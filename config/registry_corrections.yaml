# Curated corrections to registry rows, applied by scripts/apply_registry_corrections.py (idempotent, logged).
# Every hand change to data/registry/*.csv goes here with its reason, so the registry can be rebuilt and reviewed.
# orgs: org_id -> fields to set (and `why`). aliases: rows matched by (org_id, alias) -> fields to set.
# add_aliases: []
# Audit 2.2 ("Broadcom Corporation" in OFC 2026 routes to Broadcom Inc.): no alias needed. Its normalized key equals
# Broadcom Inc.'s own name key, and the pre-2016 era org is no_name_match (D27), so the routing is by D27 design.

# P0 data audit 6.4: orgs typed from a ROR "facility" record (research labs / centres) -> research_institute;
# registry `facility` stays for shared fabs and cleanrooms (EO usage). EO-seeded facilities are not touched.
orgs_retype_facility:
  - org_china_academy_of_information_and_communications_technology  # China Academy of Information and Communications Technology; ROR types facility
  - org_geoazur  # Géoazur; ROR types facility
  - org_helmholtz_zentrum_dresden_rossendorf  # Helmholtz-Zentrum Dresden-Rossendorf; ROR types facility, funder
  - org_iii_v_lab  # III V Lab; ROR types facility
  - org_institut_de_physique_de_nice  # Institut de Physique de Nice; ROR types facility
  - org_institut_de_recherche_en_informatique_et_systemes_aleatoires  # Institut de Recherche en Informatique et Systèmes Aléatoires; ROR types facility
  - org_institute_of_integrated_research_institute_of_science_tokyo  # Institute of Integrated Research, Institute of Science Tokyo; ROR types facility
  - org_istituto_nazionale_di_ricerca_metrologica  # Istituto Nazionale di Ricerca Metrologica; ROR types facility, funder
  - org_joint_quantum_institute  # Joint Quantum Institute; ROR types facility, funder
  - org_mit_lincoln_laboratory  # MIT Lincoln Laboratory; ROR types facility
  - org_purple_mountain_laboratories  # Purple Mountain Laboratories; ROR types facility, funder
  - org_technology_innovation_institute  # Technology Innovation Institute; ROR types facility
  - org_tyndall_national_institute  # Tyndall National Institute; ROR types facility, funder
  - org_ait_austrian_institute_of_technology  # AIT Austrian Institute of Technology GmbH; ROR types facility, funder
  - org_energy_sciences_network  # Energy Sciences Network; ROR types facility
  - org_fonctions_optiques_pour_les_technologies_de_linformation  # Fonctions Optiques pour les Technologies de l’information; ROR types facility
  - org_foundation_for_research_and_technology_hellas  # Foundation for Research and Technology Hellas; ROR types facility, funder
  - org_institute_of_computing_technology  # Institute of Computing Technology; ROR types facility
  - org_institute_of_electronics_computer_and_telecommunication_engineering  # Institute of Electronics, Computer and Telecommunication Engineering; ROR types facility
  - org_istituto_di_fotonica_e_nanotecnologie  # Istituto di Fotonica e Nanotecnologie; ROR types facility
  - org_swiss_federal_institute_for_forest_snow_and_landscape_research  # Swiss Federal Institute for Forest, Snow and Landscape Research; ROR types facility, funder

