      integrated_lens:
        title:
          - 'integrated micro[- ]?lens|on[- ]chip (?:micro[- ]?)?lens|(?:SiON|silicon|silica|polymer) micro[- ]?lens|micro[- ]?lens arrays?|\bMLAs?\b'
          - 'wafer[- ]level (?:micro[- ]?)?(?:optic|lens)'
        abstract: ['micro[- ]?lens arrays?', 'integrated micro[- ]?lens']
      metalens:
        title:
          - 'meta[- ]?lens(?:es)?'
          - 'metasurface[^.]{0,30}(?:lens|coupl|fib(?:er|re)|collimat|focus)'
          - '(?:fib(?:er|re)|facet|tip)[^.]{0,20}metasurface'
        abstract: ['meta[- ]?lens']
      vertical_taper:
        title:
          - 'vertical(?:ly)?[- ](?:curved |tapered )?(?:taper|waveguide|coupler)s?|3D tapers?'
          - '(?:total internal reflection|\bTIR\b|45[- ]?(?:°|deg|degree)|micro[- ]?|turning|curved)[- ]?(?:mirrors?|reflectors?)[^.]{0,40}(?:coupl|waveguide|photodiode|fib(?:er|re)|out[- ]of[- ]plane)'
          - 'out[- ]of[- ]plane coupl|elephant coupler|bent taper'
      other:
        title:
          - 'micro[- ]?optic(?:s|al)? (?:bench|elements?|coupl|components?|assembl|packag)'
          - 'ball lens|GRIN lens|graded[- ]index lens|expanded[- ]beam'
          - 'micro[- ]?optics?\b'

  fiber_interface:
    subtypes:
      fau:
        title:
          - 'fib(?:er|re)[- ]arrays?|\bFAUs?\b|fib(?:er|re) array units?'
          - 'fib(?:er|re)[- ](?:attach|pigtail)|pigtail(?:ed|ing)'
          - 'fib(?:er|re) (?:assembly|packaging|alignment) (?:of|for|to)'
