          - '(?:laser[- ]written|glass|3D|three[- ]dimensional) (?:optical )?waveguides?[^.]{0,40}(?:fan|interconnect|coupl|interposer|multi[- ]?core)'
        abstract: ['fan[- ]in', 'multi[- ]?core fib(?:er|re)', 'photonic lantern']
      connector:
        title:
          - '(?:optical|fib(?:er|re)|photonic) connectors?|connectori[sz]'
          - 'expanded[- ]beam|detachable[^.]{0,30}(?:fib(?:er|re)|optical|connect|coupl)|pluggable[^.]{0,20}(?:fib(?:er|re)|connector|coupl)'
          - '\bMPO\b|\bMT ferrule|ferrules?'
        abstract: ['expanded[- ]beam', 'detachable (?:fib(?:er|re)|optical) (?:connect|coupl)']
      other:
        title:
          - 'fib(?:er|re)[- ]to[- ]fib(?:er|re) coupl|tapered fib(?:er|re)[^.]{0,30}(?:coupl|chip|waveguide)|fib(?:er|re) (?:couplers?|splice|splicing)\b'

