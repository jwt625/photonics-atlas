      v_groove:
        title:
          - '[VU][- ]grooves?'
          - 'passive(?:ly)?[- ]align[^.]{0,40}fib(?:er|re)|self[- ]align[^.]{0,30}fib(?:er|re)|fib(?:er|re)[^.]{0,30}(?:passive|self)[- ]align'
