# Regex prefilter for the component-literature pool (DevLog-006 S2). Used by scripts/lit_prefilter.py.
# All patterns are Python regexes, case-insensitive, searched (not anchored). Write them in single quotes.
#
# classes.<class>.subtypes.<subtype>: {title: [...], abstract: [...]}
#   title    = strong hit (searched in the title only)
#   abstract = weak hit (searched in the abstract only); when omitted, the title patterns are used for the abstract too
#   subtype `_class` = hits that assign the class without a subtype
# classes.<class>.require: optional; a class hit counts only if one of these matches title + abstract; classes without
#   `require` use `context_default` (integrated / fiber-chip context); `require: []` disables the check.
#   By default a title hit on a specific subtype (not `other` / `_class`) skips the check; `require_scope: all` applies it
#   to every hit.
# classes.<class>.exclude_title: optional; drops this class's hits (not the record) when the title matches
# exclusions: global out-of-scope rules over the title (record excluded from scoring when a rule fires):
#   title: [...] fire on a title match; unless_title / unless_text: [...] cancel the rule when they match;
#   unless_class_title_hit: true cancels the rule when any class has a title hit (ignore_classes are not counted);
#   require_no_text: [...] the rule fires only when none of these match title + abstract;
#   require_abstract: true the rule fires only when the record has an abstract
# Hit order (best class): title hit > abstract hit > seed_class; then a specific-subtype title hit (not other / _class)
# before a generic one; then the earliest title match (titles name the main component first); then the number of
# subtypes hit in the title, then in the abstract.
version: 1

groups:
  G1: [fiber_chip_coupler, micro_optics, fiber_interface, free_space_emitter]
  G2: [splitter, crossing, mode_converter, polarization]
  G3: [resonator, wdm, reflector]
  G4: [phase_shifter, switch_fabric, nonreciprocal]
  G5: [photodetector]
  G6: [laser, amplifier, frequency_converter]
  G7: [waveguide_platform, chip_chip_coupler]

# Per-class LLM-scoring cap = max(cap_min, cap_mult x budget); budget from config/literature/selection.yaml.
caps:
  # 6 x budget / min 200 (DevLog plan) caps the total at 5890 < the 6000-9000 scoring target, so 8 x / min 250 (max 7770)
  cap_min: 250
  cap_mult: 8
  min_rule_score: 3       # title-hit records below this rule score are not sent to scoring (tier-A seeds exempt)
  weak_min_rule_score: 5  # same for records whose best hit is abstract-only
# Seed tiers (D131, revised 2026-10-21 by the coordinator), by pool file prefix:
#   A (curated local seeds): +a_bonus, ranked first, kept beyond the cap, seed_class stands in when no regex fires.
#   B (review references / forward citations): +b_bonus (+b_multi_bonus when cited by reviews of >= 2 classes or by
#     >= 2 reviews, refs_of_all), count toward the cap, normal exclusions and score floors; when no lane also found the
#     work it needs a title class hit, and before b_old_year also an experimental or quantitative cue.
#   Review seeds (is_review_seed) are snowball sources and are never scored (D123).
seed_tiers:
  seed_prefix: seeds_
  a_files: [seeds_local]
  b_files: [seeds_refs_, seeds_cites_]
  a_bonus: 2
  b_bonus: 1
  b_multi_bonus: 1
  b_old_year: 2005
# Pool-file prefixes whose records are matched strictly (title hit required, `require` on every hit) unless another
# lane also found the work: arXiv app-ph / quant-ph not cross-listed to physics.optics (lane L3 note 2026-10-21).
strict_files: [arxiv_appq_]

# Records with these OpenAlex / Crossref types are dropped at merge.
drop_types: [erratum, editorial, paratext, retraction, letter, peer-review]
# Front matter and corrections (title), dropped at prefilter.
non_paper_title: '^(?:erratum|errata|corrigendum|correction(?: to)?:|correction to\b|retraction|retracted|publisher''s note|editorial\b|expression of concern|front matter|back matter|table of contents|author index|cover image|title page|issue information|masthead|reviewers? list|preface\b|foreword\b|welcome\b|in memoriam|obituary)'

# Default component context for every class without its own `require` (title + abstract).
context_default:
  - 'on[- ]chip|integrated|photonic integrated circuit|\bPICs?\b|waveguid|\bchips?\b|chip[- ]scale|CMOS|foundry|wafer|monolithic|silicon photonic|\bPDK\b|silicon nitride|\bSiN\b|Si3N4|lithium niobate|\bLNOI\b|\bTFLN\b|\bSOI\b|\bInP\b|III-?V|planar lightwave|micro-?rings?|micro-?resonators?|ring resonators?|photonic crystal|nanophotonic|heterogeneous|hybrid integrat|transceiver|co-?packaged|fib(?:er|re)[- ](?:to|coupled|pigtail|array|attach|optic)|semiconductor|quantum[- ]dot|quantum[- ]well'

cues:
  experimental: 'fabricat|measur|demonstrat|experiment|characteri[sz]|prototype|\btested\b'
  quantitative: '(?<![a-z])\d+(?:\.\d+)?\s?(?:dB(?:m|/cm|/m|/km|/90|/turn)?|%|nm|pm|µm|μm|um|GHz|THz|MHz|kHz|Hz|A/W|mA/W|mW|µW|μW|nW|Gb/s|Gbit/s|Gbps|Gbaud|GBd|Tb/s|ps|fs|ns|mm|K|°C|pJ|fJ|nJ|V)(?![a-zA-Z])|\bQs?\s?(?:factors?)?\s?(?:of|=|~|>|≈|exceeding|above|up to)\s?(?:\d|10)|\d(?:\.\d+)?\s?[x×]\s?10\^?\s?[0-9]|\d(?:\.\d+)?\s?(?:million|billion)\b'
  integrated: 'on[- ]chip|integrated|photonic integrated circuit|\bPICs?\b|waveguide|chip[- ]scale|CMOS[- ]compatible|foundry|wafer[- ]scale|monolithic|silicon photonic|\bPDK\b'
  review_title: '\b(?:review|tutorial|roadmap|perspectives?|overview|survey|progress in|advances in|recent (?:advances|progress|developments)|state[- ]of[- ]the[- ]art and|outlook|primer)\b'
  simulation: 'simulat|numerical(?:ly)?|we propose|is proposed|are proposed|theoretical(?:ly)?|\bFDTD\b|finite[- ]difference|finite[- ]element|eigenmode expansion|design(?:ed)? (?:of|and analysis)|\bin silico\b'

# Records whose title fires a rule are excluded from scoring (counted per rule in the stats).
exclusions:
  fiber_laser_amplifier:
    title:
      - 'fib(?:er|re)[- ](?:ring |optic |optical |based )?lasers?'
      - 'fib(?:er|re)[- ](?:optical |optic |raman |parametric )?amplifi'
      - '\bEDFAs?\b|\bYDFAs?\b|\bTDFAs?\b|\bFOPAs?\b'
      - '(?:erbium|ytterbium|thulium|holmium|neodymium|bismuth|Er|Yb|Tm|Ho|Nd)[- ]?(?:\d\+|3\+|³⁺)?[- ]?doped (?:silica |double[- ]clad |large[- ]mode[- ]area |photonic crystal |multicore |few[- ]mode )?fib(?:er|re)'
      - 'mode[- ]locked (?:all[- ])?fib(?:er|re)|all[- ]fib(?:er|re) (?:laser|amplif|mode[- ]locked|oscillat)'
      - '(?:Q[- ]switched|mode[- ]locked)[^.]{0,40}fib(?:er|re) (?:laser|oscillat)'
      - 'fib(?:er|re) (?:oscillator|MOPA)|\bMOPA\b'
    unless_title: ['on[- ]chip|integrated|waveguide|photonic chip|silicon|nitride|lithium niobate|\bPIC\b']
  fiber_sensing:
    # fiber-only sensors and fiber transmission physics; fiber-only passive parts for chips stay in scope
    title:
      - 'fib(?:er|re)[- ](?:optic(?:al)? )?(?:bragg grating )?sens(?:or|ing)'
      - '\bFBGs?\b[^.]{0,40}sens|distributed (?:acoustic|temperature|strain|fib(?:er|re)) sens|\bDAS\b|\bOTDR\b|\bBOTDA\b|\bphi-?OTDR|Brillouin optical time'
      - '(?:tapered|microfib(?:er|re)|D[- ]shaped|photonic crystal) fib(?:er|re)[^.]{0,40}(?:sensor|sensing|refractive index|temperature)'
    unless_title: ['on[- ]chip|integrated|waveguide|photonic chip|silicon photonic']
  biomedical_imaging:
    title:
      - 'in vivo|in[- ]vitro|\btissues?\b|endoscop|photoacoustic|optoacoustic|optical coherence tomograph|\bOCT\b|bio-?imaging|biomedical imaging|histolog|\bretina|\bbrain\b|neurons?\b|\bcells? imaging|fluorescence (?:microscop|imaging|lifetime imaging)|(?:two|multi)[- ]photon (?:microscop|imaging|excitation microscop)|super[- ]resolution (?:microscop|imaging)|light[- ]sheet|\bcancer\b|\btumou?r|diagnos|blood|\bskin\b|\bdental\b|ophthalm'
    unless_title: ['on[- ]chip|integrated photonic|photonic integrated|silicon photonic|waveguide|photonic chip|\bPIC\b']
  astronomy:
    title:
      - 'telescopes?|astronom|astrophotonic|exoplanet|stellar|nulling interferomet|astro-?comb|spectrograph'
    unless_title: ['on[- ]chip|integrated|photonic chip|waveguide|photonic lantern|\bPIC\b|microcomb|lantern']
  metamaterial_theory:
    title:
      - 'metamaterials?|metasurfaces?|meta[- ]?atoms?|hyperbolic|epsilon[- ]near[- ]zero|\bENZ\b|bound states? in the continuum|\bBICs?\b|topological|non[- ]?hermitian|exceptional points?|parity[- ]time|\bPT[- ]symmetr|anapole|toroidal|chiral(?:ity)?'
    require_no_text: ['fabricat|measur|demonstrat|experiment|characteri[sz]|prototype']
    require_abstract: true
  lidar_system:
    title: ['lidar|ladar|laser radar|range finder|rangefinder|\bFMCW\b[^.]{0,30}(?:ranging|imaging|sensing|system)|3D imaging|depth (?:sensing|imaging)|point clouds?']
    unless_class_title_hit: true
  eo_modulator_only:
    # EO-atlas scope unless the title names another component
    title:
      - 'modulators?\b|\bMZMs?\b|\bEAMs?\b|electro[- ]?absorption modulat|electro[- ]?optic(?:al)? (?:phase[- ]shifters?|frequency shift|tun(?:ing|able)|polymer)|pockels (?:modulat|phase)'
    unless_class_title_hit: true
    ignore_classes: [resonator, phase_shifter, waveguide_platform]
  solar_cells:
    title: ['solar cells?|photovoltai|solar (?:energy|harvest|absorber|thermal)|thermophotovoltai|radiative cooling']
  led_display:
    title:
      - 'light[- ]emitting (?:diodes?|devices?|transistors?)|\b(?:O|Q|PeL|micro-?|µ|μ)?LEDs?\b|electroluminescen|displays?\b|\bAR\b[^.]{0,20}(?:glasses|display)|augmented reality|virtual reality|near[- ]eye|head[- ]mounted|holographic display'
    unless_title: ['interconnect|waveguide|on[- ]chip|integrated photonic|photonic integrated|silicon photonic|optical link']
  thz_free_space:
    title: ['terahertz|\bTHz\b|sub[- ]?THz|millimet(?:er|re)[- ]wave (?:imaging|radar|antenna)']
    unless_title: ['waveguide|on[- ]chip|integrated|chip|photodiode|photodetector|photomix|photonic[- ]crystal|silicon photonic|\bPIC\b|\bUTC\b|micro-?resonators?|micro-?combs?|frequency combs?|micro-?rings?|\blasers?\b']
  plasmonic_sensing:
    title:
      - 'plasmonic (?:bio)?(?:sens|detect)|surface plasmon resonance|\b(?:L)?SPR\b|\bSERS\b|surface[- ]enhanced raman|plasmonic (?:refractive index|gas|chemical)|(?:bio|gas|chemical|humidity|refractive[- ]index) sensors?[^.]{0,30}plasmon|plasmon[^.]{0,40}(?:bio|gas|chemical|refractive[- ]index) sens'
  non_optical:
    # microwave / superconducting-circuit / acoustic / magnonic work that shares component words
    title:
      - 'superconducting (?:qubits?|resonators?|circuits?|quantum (?:circuits?|processors?))|josephson|transmons?|fluxonium|kinetic[- ]inductance|microwave (?:resonators?|circuits?|amplifiers?|electronics|filters?|cavit)|qubits? readout|circuit (?:QED|quantum electrodynamics)'
      - '\bacoustic\b|phononic crystals?|spin[- ]waves?|magnons?|magnonic|seismic|elastic waves?|\bbolts?\b|vibrometr|ultrasound|ultrasonic|sonar|antennas? for (?:5G|6G|wireless)|reconfigurable intelligent surface|\bRIS\b'
    unless_title: ['optical|photonic|\blaser|\blight\b|optomechanic|electro[- ]?optic|opto[- ]?electronic|microwave[- ]to[- ]optical|transduc|brillouin|acousto[- ]?optic|opto[- ]?acoustic']
  bulk_free_space:
    # bulk / free-space optics without a chip
    title:
      - 'free[- ]space optical (?:communication|link|transmission)|\bFSO\b|underwater (?:optical |wireless )?communication|visible light communication|\bVLC\b|optical wireless|\bOWC\b|turbulen|orbital angular momentum (?:beams?|multiplex)[^.]{0,30}free[- ]space|structured light beams?|vortex beams?|\bbulk (?:crystal|optics?)\b|ultrafast laser (?:processing|machining|ablation)|laser (?:ablation|machining|welding|cutting|cleaning|processing|induced breakdown)|\bLIBS\b|femtosecond laser (?:processing|ablation|machining)|attosecond|high[- ]harmonic generation in (?:gases|solids|crystals)|filamentation|\bX-?ray\b'
    unless_title: ['on[- ]chip|integrated|waveguide|photonic chip|silicon|nitride|lithium niobate|\bPIC\b|metasurface|grating coupler']

platforms:
  soi: '\bSOI\b|silicon[- ]on[- ]insulator|silicon photonic|\bSiPh\b|(?<![A-Za-z])Si (?:waveguide|photonic|wire|ring|strip|rib|slot|micro|MMI|chip)|silicon (?:waveguide|ring|wire|strip|rib|slot|chip|microring|micro-?disk|MMI|photonics?)\b|crystalline silicon|silicon[- ]based (?:photonic|integrated|waveguide)'
  sin: 'silicon nitride|\bSiN(?:x)?\b|Si3N4|Si₃N₄|\bSiON\b|silicon oxynitride|Si-?rich nitride'
  tfln: 'lithium niobate|\bLiNbO3\b|LiNbO₃|\bLNOI\b|\bTFLN\b|\bLN\b|\bPPLN\b'
  lt: 'lithium tantalate|LiTaO3|LiTaO₃|\bLTOI\b|\bTFLT\b'
  inp: '\bInP\b|indium phosphide|InGaAsP|InGaAlAs|AlGaInAs|InAlGaAs'
  gaas_algaas: '\bGaAs\b|gallium arsenide|AlGaAs|AlGaAsOI|GaAsOI'
  aln: '\bAlN\b|alumin(?:i)?um nitride'
  ta2o5: 'Ta2O5|Ta₂O₅|tantala\b|tantalum pentoxide|tantalum oxide'
  sic: 'silicon carbide|\bSiC\b|4H-SiC|3C-SiC|SiCOI'
  diamond: '\bdiamond'
  polymer: '\bpolymers?\b|\bSU-?8\b|\bPMMA\b|IP-Dip|ormocer|OrmoCore|organic[- ]hybrid|\bpolyimide'
  al2o3: 'Al2O3|Al₂O₃|alumina\b|alumin(?:i)?um oxide'
  glass_plc: 'planar lightwave circuit|\bPLCs?\b|silica[- ]on[- ]silicon|(?:doped|germano|Ge-?doped) silica|glass waveguide|laser[- ]written|(?:femtosecond|fs)[- ]laser[- ](?:written|inscri)|ion[- ]exchang|borosilicate|fused silica|silica waveguide|glass chip|\bglass\b[^.]{0,20}(?:waveguide|interposer|substrate|chip)'
  ge_sige: '\bGe\b|germanium|\bSiGe\b|\bGeSi\b|\bGeSn\b'
  bto: '\bBTO\b|BaTiO3|BaTiO₃|barium titanate'
  chalcogenide: 'chalcogenide|As2S3|As₂S₃|As2Se3|GeSbSe|Ge-Sb-Se|\bGST\b|Ge2Sb2Te5|Sb2Se3|Sb₂Se₃|Sb2S3|Sb₂S₃|\bGSST\b'
  hybrid_heterogeneous: 'heterogeneous(?:ly)?[- ]integrat|hybrid(?:ly)?[- ]integrat|heterogeneous (?:III-?V|InP|laser|platform)|wafer[- ]bond|die[- ]to[- ]wafer bond|micro[- ]?transfer[- ]print|transfer[- ]printed|flip[- ]chip|III-?V[- ]on[- ](?:Si|silicon|insulator)|(?:InP|III-?V|GaAs)[- ]?(?:on|/)[- ]?(?:Si|silicon|SiN|LN|lithium niobate)\b|bonded (?:III-?V|InP|lithium niobate|thin film)'

classes:
  fiber_chip_coupler:
    subtypes:
      _class:
        title:
          - 'fib(?:er|re)[- ](?:to|/)[- ](?:chip|waveguide|PIC)|(?:chip|waveguide|PIC)[- ](?:to|/)[- ]fib(?:er|re)'
          - 'fib(?:er|re)[- ](?:chip )?(?:coupl(?:er|ing)|interface)s?\b(?![- ](?:array|unit))'
          - '(?:optical )?(?:input/output|I/O) coupl|off[- ]chip coupl'
      grating:
        title:
          - 'grating[- ]couplers?|grating[- ]coupling|grating[- ]coupled'
          - '\bGCs?\b'
          - '(?:surface|vertical(?:ly)?)[- ](?:grating[- ])?coupl'
          - 'polari[sz]ation[- ](?:splitting|diversity|insensitive)[^.]{0,20}grating'
          - '(?:apodized|focusing|2D|two[- ]dimensional|dual[- ]layer|bi[- ]?layer|blazed|chirped|subwavelength|photonic[- ]crystal) grating coupl'
        abstract:
          - 'grating[- ]couplers?|grating[- ]coupling'
          - 'surface[- ]grating'
      edge:
        title:
          - 'edge[- ]coupl(?:er|ers|ing|ed)'
          - 'spot[- ]size convert|mode[- ]size convert|\bSSCs?\b|mode (?:size )?(?:expander|transformer)s?'
          - 'inverse(?:ly)?[- ]taper|inverted taper|(?:trident|multi[- ]tip|cantilever(?:ed)?|suspended)[^.]{0,30}(?:coupler|taper)'
          - 'butt[- ]coupl[^.]{0,30}fib(?:er|re)|fib(?:er|re)[^.]{0,30}butt[- ]coupl'
          - 'facet coupl|end[- ]fire coupl|lensed fib(?:er|re)'
        abstract:
          - 'edge[- ]coupl'
          - 'spot[- ]size convert'
          - 'inverse(?:ly)? taper|inverted taper'
      photonic_wire_bond:
        title:
          - 'photonic wire[- ]?bond|\bPWBs?\b'
          - '(?:3D|two[- ]photon|direct[- ]laser)[- ](?:printed|written|lithograph)[^.]{0,30}(?:waveguides?|wire|interconnect)'
        abstract: ['photonic wire[- ]?bond']

  chip_chip_coupler:
    subtypes:
      _class:
        title:
          - '(?:chip|die)[- ]to[- ](?:chip|die|wafer)[^.]{0,30}(?:optical |photonic )?(?:coupl|interconnect|interface)'
          - 'inter[- ]?chip (?:optical )?(?:coupl|interconnect|link)|interchip'
          - 'optical interposers?|photonic interposers?|chiplet[^.]{0,30}(?:optical|photonic)'
        abstract: ['(?:chip|die)[- ]to[- ](?:chip|die) (?:optical )?coupl', 'optical interposer']
      evanescent:
        title:
          - 'evanescent(?:ly)?[- ]coupl[^.]{0,40}(?:chip|die|interposer|III-?V|InP|layer|wafer)'
          - 'adiabatic[^.]{0,20}(?:taper|coupler|coupling)[^.]{0,40}(?:chip|die|interposer|III-?V|InP|polymer|glass)'
          - '(?:tip[- ]to[- ]tip|taper[- ]to[- ]taper)[^.]{0,20}coupl'
        abstract: ['evanescent(?:ly)?[- ]coupl[^.]{0,40}(?:chip|die|interposer)', 'adiabatic (?:taper )?coupl[^.]{0,40}(?:chip|die|interposer)']
      butt:
        title:
          - 'butt[- ]coupl(?!ing[^.]{0,30}fib)'
          - 'flip[- ]chip(?:ped)?[^.]{0,40}(?:laser|photonic|III-?V|InP|SOA|optical)'
          - '(?:laser|III-?V|InP|SOA|gain chip)[- ](?:to|on)[- ](?:silicon|SiN|PIC|chip|waveguide)[^.]{0,30}coupl'
          - 'hybrid(?:ly)?[- ]integrat[^.]{0,30}(?:laser|InP|III-?V|SOA|gain chip)[^.]{0,30}(?:coupl|alignment|assembl)'
        abstract: ['butt[- ]coupl[^.]{0,40}(?:laser|III-?V|InP|chip)']
      photonic_wire_bond:
        title: ['photonic wire[- ]?bond|\bPWBs?\b']
      other:
        title:
          - 'micro[- ]?transfer[- ]print|transfer[- ]printed'
          - '(?:vertical|out[- ]of[- ]plane|inter[- ]?layer)[^.]{0,20}(?:chip[- ]to[- ]chip|inter[- ]?chip)'
          - 'multi[- ]chip (?:photonic|optical) (?:module|integration|assembl)'

  micro_optics:
    require_scope: all
    require: ['fib(?:er|re)|\bchips?\b|coupl|waveguid|photonic integrated|\bPICs?\b|facet|laser|photodiode|photodetector|VCSEL|packag|interconnect|transceiver|edge[- ]emitt|grating coupler']
    exclude_title: ['imaging|camera|cameras|display|holograph|structural colou?r|cosmos|telescope|astronom|tweezers|micromachines?|end[- ]to[- ]end|deconvolution']
    subtypes:
      facet_lens:
        title:
          - '(?:3D|two[- ]photon|direct[- ]laser|4D)[- ]?(?:printed|written|lithograph)[^.]{0,30}(?:micro[- ]?)?(?:lens|optic|reflector|mirror)'
          - 'facet[- ]attached|\bFaMLs?\b'
          - 'micro[- ]?lens(?:es)?[^.]{0,40}(?:facet|fib(?:er|re)|chip|coupl)'
          - 'free[- ]?form (?:micro[- ]?)?(?:optic|lens|reflector|mirror)'
