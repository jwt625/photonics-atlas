# S4 curation, group G1 (DevLog-006): fiber_chip_coupler, micro_optics, fiber_interface, free_space_emitter.
# Reviewed 2026-10-21 against cache/literature/curation_inputs/<class>.csv as of that date.
group: G1
curator_notes: >-
  fiber_chip_coupler: rule picks were 49 grating vs 14 edge; picks rebalance toward edge / SSC (inverse-taper
  landmark, foundry production couplers, TFLN, visible, buried 3D SSC) and add grating benchmarks (Taillaert,
  backside-mirror and fully etched CE records, sub-dB SWG, Luxtera platform, LETI PDK, SiC). Photonic wire bond had 3 papers; two PWB papers added.
  Conference duplicates of journal papers dropped. micro_optics: adequate after out-of-scope imaging metalenses were
  excluded; added the in-situ facet-printing and free-form reflector benchmarks. fiber_interface: fiber-only fan-outs
  dominated; picks add CPO-relevant industry interfaces (IBM, imec, Corning, GF, detachable CPO connectors).
  free_space_emitter: 26 of 40 were OPAs; picks and adds restore the AMO grating-emitter core (ion addressing,
  visible emitters, meta-gratings, metasurface platforms). Several adds were in prefiltered.jsonl beyond the
  scoring cap (score_keep false), so they never reach the inputs.
