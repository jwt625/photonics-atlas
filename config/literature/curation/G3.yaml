group: G3
curator_notes: >-
  resonator: rule picks over-weighted nonlinear / quantum / sensing demos and missed the main Q benchmarks (cap left
  them unscored): added TFLN 2017 / 29M, PhC 11M, wedge and >1e9 silica disks, Si3N4 ultrahigh-Q / subtractive / Leti,
  Si ultralow-loss ring; dropped EO switch, spectrometer, bulk WGM, physics demos. Gaps: polymer, AlN rings.
  wdm: AWG-heavy (30); added echelle (Kotura, NRC, 3-um SOI), AWGR, MRR banks (Xia/Vlasov 2007), contra-DC, polymer /
  InP-foundry / silica AWG, Piggott inverse design; dropped spectrometers, time-domain pulse interleaver, SNSPD filter.
  wdm.tff: only 2 papers found (ETRI APD-ROSA, Sumitomo focal shifts); still a gap. Daoxin Dai has 6 rule picks in
  wdm (D125 cap 4; 2 via reserve), left for the coordinator.
  reflector: rule picks included free-space HCG / epitaxial DBR / THz / GMR mirrors (dropped as free-space or
  out-of-band); replaced with integrated Bragg benchmarks (CMOS, LioniX, low-kappa SiN, spiral, cladding-modulated,
  SWG). phc_mirror and band_stop stay thin.
  Adds: OpenAlex ids from the prefiltered pool (unscored, beyond cap) except Xia 2007 and Biberman 2012 (API-verified).
