# S4 curation, group G5 (DevLog-006): photodetector.
# Reviewed 2026-10-21 against cache/literature/curation_inputs/photodetector.csv as of that date.
group: G5
curator_notes: >-
  photodetector: rule picks were strong on Ge waveguide PDs (record bandwidth, 300 mm platforms) but thin on
  foundry / industry PDs, on-chip SNSPDs and pre-2016 benchmarks. Picks add GF, AIM, Kotura and imec APD papers,
  waveguide SNSPDs (SOI, TFLN), III-V on SOI / IMOS, a waveguide-integrated SPAD and a mid-IR GeSn waveguide PD.
  Adds are verified pre-2016 / unscored benchmarks (Intel 340 GHz GBP APD, CEA Ge APD receiver, Pernice and
  Schuck waveguide SNSPDs, planar Ge-on-Si SPAD, 110 GHz graphene, 100 GHz plasmonic, Sandia 45 GHz Ge PD).
  Scope: discrete material-science / imaging / sensing detectors dropped; optical-in photomixer
  PDs kept as PDs. InP-native waveguide UTC / PIN PDs were labelled iii_v_on_platform: reclassed to other
  (schema: III-V on Si / SiN / TFLN); top-illuminated mesas reclassed to vertical.
  Gaps: 2013-2014 graphene landmarks not added; an APL Photonics 2020
  SiN SNSPD is wrongly merged as a version of a different Schuck paper.
