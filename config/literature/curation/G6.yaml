group: G6
curator_notes: >-
  laser: rule selection was academic-heavy (combs 22, TFLN rare-earth microdisks, one Ghent/Glasgow cluster of 11)
  and thin on datacom / CPO sources. Picks add high-power low-RIN DFBs, multi-wavelength DFB arrays for optical I/O,
  SOA-DFB, Intel / Sumitomo / Huawei-class heterogeneous tunable lasers, III-V-on-TFLN, a coherent-lite SIL, and
  landmarks (first hybrid Si laser, Hz-linewidth SIL, battery comb, 108 GHz DML). Gap: els_module has a single
  system-level OFC paper; no ELSFP / CPO laser-module literature exists in the pool. amplifier: good subtype
  balance; added Er:SiN Science, TFLN EDWAs with fiber-to-fiber gain and NF, O-band QD SOA on Si, Si LMA amplifier,
  removed a preprint duplicate. frequency_converter: rule picks drifted to supercontinuum, squeezing and photon-pair
  sources; replaced with PPLN / TFLN / AlN / SiN SHG and DFG benchmarks (most were unscored, added) and industry PPLN
  ridge / module papers.
