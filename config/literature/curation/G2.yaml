group: G2
curator_notes: "splitter: rule pick is broad (6 subtypes, 40/50 OA) but SOI-heavy; picks add the Chrostowski/Plant DC and adiabatic benchmarks, TFLN, InP, 3D SiN, mid-IR; adds Halir 2016 SWG MMI. crossing: rule pick had THz and non-crossing rows; the strongest crossing papers were routed to waveguide_platform by the prefilter and capped out, so picks/adds restore Ma 2013, Jones 2013, Bloch-MMI 2013, star crossings, tri-layer SiN, Dai 6 mdB, SiN, TFLN, visible. mode_converter: rule pick was fiber-heavy (LPG, lanterns) and missed the on-chip MDM canon; picks add Dai/Shi/Tsang/Frandsen/Ding MDM, SiN, InP, TFLN; adds Luo 2014. polarization: rule pick is good; 888 polarization title-hit records were capped out (incl. Watts 2005, Fukuda 2008, Dai 2011, Ding 2013), restored as adds. Pending-score uids are picked ahead."
