# S4 curation, group G7 (DevLog-006): waveguide_platform, chip_chip_coupler.
# Reviewed 2026-10-22 against cache/literature/curation_inputs/<class>.csv as of that date.
group: G7
curator_notes: >-
  waveguide_platform: rule picks were 16 SiN (6 visible) and 11 SOI, with 1 TFLN, 0 chalcogenide, 0 SiC / diamond /
  InP / AlGaAs-on-insulator. Picks and adds aim at one or two best papers per platform and band: SiN record loss
  (0.034 dB/m, 1 dB/m wafer-scale), CEA-Leti 200 mm platform, TFLN material-limited loss and visible, AlN-on-sapphire,
  AlGaAs-on-insulator, chalcogenide C-band and LWIR, mid-IR Si / Ge, InP LWIR, 4H-SiCOI, diamond, CPO polymer. Drops
  remove conference twins, nonlinear-primary papers, a metrology paper and pre-window paywalled bends. Bends get
  TFLN and Bezier picks. Slow light is thin (PhC / SWG, mostly SOI). chip_chip_coupler: the regex bucket was
  mostly transfer-printing process, electronics and bulk-WGM coupling; 9 dropped. Adds bring die-to-die benchmarks:
  imec sub-300 nm flip-chip DFB, Si3N4-Si chip-to-chip evanescent coupler, Si3N4-polymer flip-chip coupler, PWB
  multi-chip engines / ECL / swept DFB, micro-transfer-printed etched-facet lasers butt-coupled to SOI.
