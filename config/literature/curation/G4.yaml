curator_notes: >-
  phase_shifter: thermo-optic dense and well spread (SOI, SiN, SiC, InP, Ge, Al2O3 UV); dropped EO carrier devices
  (III-V MQW OPA, BJT injection) and conference / preprint duplicates; picked MEMS benchmarks (13-pi NOEMS,
  nanobenders), ITO and folded heaters, visible SiN, TFLN; added BTO ferroelectric (IBM), graphene-heater PCM, Sb2Se3,
  PZT stress-optic, 200 mm piezo-MEMS and the Jacques heater-design study. switch_fabric: selection skewed to recent
  2x2 elements; picked large-port benchmarks (64x64 / 240x240 MEMS, 32x32 S&S, 16x16 EO, 16x16 PLC), microring 8x8,
  WSS modules; dropped TTD beamformers and nonlinear switching; reclassed S&S / PILOSS MZI fabrics to mzi_mesh.
  nonreciprocal: thin and noisy; dropped isolator-replacement circuits and garnet material papers; picked and added
  magneto-optic, nonlinear, acousto-optic and EO landmark isolators / circulators and fiber MCF isolators.
