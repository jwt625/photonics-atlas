# Lane L1 (journals) venue list for scripts/lit_harvest_openalex.py (DevLog-006 S1).
# Source ids resolved 2026-10-21 from /sources/issn:<issn> (free singleton gets); npj Nanophotonics from a
# /sources search (its ISSN was not known beforehand). Name = OpenAlex display_name at resolution time.
# types: OpenAlex work types kept (article|review|letter; drops erratum, editorial, paratext, retraction, other
# (= news & views / research highlights in LSA, OEA, Nat Photon), book-review). A venue may override with `types:`.
# Broad journals: extra_filter BROAD_TOPICS = any of the work's 3 topics in the OpenAlex photonics topic set below
# (measured 2026-10-21: keeps 134/134 EO-atlas reference papers; cuts the 6 broad journals 2016-2026 from 487,340 to
# 18,082 works). Topic set: T10299 Photonic and Optical Devices, T11050 Photorefractive and Nonlinear Optics,
# T11429 Semiconductor Lasers and Optical Devices, T10767 Advanced Photonic Communication Systems, T10232 Optical
# Network Technologies, T10847 Advanced Optical Network Technologies, T10846 Photonic Crystal and Fiber Optics,
# T10666 Photonic Crystals and Applications, T10988 Advanced Fiber Laser Technologies, T11449 Mechanical and Optical
# Resonators, T13493 Optical and Acousto-Optic Technologies, T11025 Nonlinear Optical Materials Research, T12510
# Magneto-Optical Properties and Applications, T12004 Advanced Frequency and Time Standards, T10022 Semiconductor
# Quantum Structures and Devices, T12760 Laser Design and Applications, T11127 Solid State Laser Technologies, T14158
# Optical Systems and Laser Technology, T10245 Metamaterials and Metasurfaces Applications, T10295 Plasmonic and
# Surface Plasmon Research.
