# Vendor / model dictionary for scripts/scan_vendor_models.py (DevLog-003 D205). Hand decisions; the scanner only
# proposes candidates, a reviewer decides (D206). Ported 2026-10-22 from the 2026-10-20 scratch lists (vendors.py,
# modelreg.py; supply report section 3), registry ids checked by hand on 2026-10-22.
#
# vendors: name = vendor as commonly printed; org = registry org_id, '' when the vendor is not in the registry (a gap,
#   D208) or the printed name is ambiguous between registry orgs (note says which); cat = top-level category hint (or a
#   subcategory when the vendor sells one kind of item); re = Python regex, case-sensitive, matched with word
#   boundaries added around the whole alternation.
# models: re = model regex (word-bounded); vendor = a vendors[].name; cat = subcategory hint; type = short item type;
#   infer: false when the model alone does not identify the vendor as of the source (lineage renames such as
#   Agilent -> Keysight, Ando -> Yokogawa, Finisar -> II-VI -> Coherent): such rows need the vendor printed (basis
#   stated), never inferred_from_model.
# registry_org_types: registry orgs of these types are matched by name and alias in addition to the gazetteer.
# stoplist: registry names / aliases never matched as vendor surface forms (common words, ambiguous acronyms).
version: 1

registry_org_types: [company, startup, foundry, business_unit, industrial_lab]
# D299a: shared cleanrooms are proposed in methods and acknowledgement text only (facility_use, B7).
registry_facility_types: [facility]

