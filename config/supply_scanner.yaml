# Lineage: a model of vendor K printed next to a predecessor or related brand merges into one candidate with the
# printed vendor (D295); rows keep the vendor as printed (D6, D207).
lineage:
  Keysight: [Agilent, Hewlett-Packard]
  Agilent: [Hewlett-Packard]
  Yokogawa: [Ando]
  Finisar: [II-VI, Coherent]
  Ansys: [Lumerical]
  Bruker: [Veeco]
  Cambridge NanoTech: [Veeco]
  FormFactor: [Cascade Microtech]
  FEI: [Thermo Fisher Scientific]
  New Focus: [Newport]
  Newport: [New Focus]
  EXFO: [Yenista]

# Registry forms of <= 4 capitals are acronyms that over-match (SLM, IDT, MEC, ...; audit finding 4); listed ones
# are kept. Short vendor names that matter are gazetteer entries with context (SHF, PI, AMF, JDSU, ...).
registry_short_forms_keep: []

