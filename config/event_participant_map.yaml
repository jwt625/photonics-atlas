# Staged rows not promoted in P0 (reason):
exclude_events:
  cyclotene_line_dow_to_dupont: "product-line ownership, no sourced date; belongs to P2 products"
  cyclotene_line_dupont_to_qnity: "product-line ownership, no sourced date; belongs to P2 products"
