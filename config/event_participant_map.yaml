# Event participant names (as printed in the cited sources, data/_staging/org_events/{A,B,C}/events_proposed.csv)
# -> registry org_id. Hand-curated 2026-10-20 (DevLog-001); name matching is not used for participants because
# time-aware entities share normalized names (Coherent, Inc. vs Coherent Corp.; Broadcom Corporation vs Broadcom Inc.).
# `create` is applied only when the org_id does not exist yet (name_basis cited_source, name as printed in the source,
# org_type from the name's legal form, country empty: the sources were not read for it).
# status of created orgs follows the sourced event (acquired target, renamed predecessor, merged).

participants:
