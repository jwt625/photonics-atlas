  pavonia_rename_broadcom_limited: "no sourced date"
  alcatel_rename_alcatel_lucent_2006: "no sourced date; the merger row records Alcatel-Lucent as the resulting org"

# Role corrections (event key -> printed participant -> role).
role_overrides:
  # P0 data audit 4.2: the locator states Broadcom Limited (the new holding company) completed the acquisitions of
  # Avago Technologies Limited and Broadcom Corporation.
  avago_acquire_broadcom_2016:
    "Broadcom Limited": acquirer
    "Avago Technologies Limited": target
    "Broadcom Corporation": target

# Date decisions (D26): announced_on = first public announcement found; effective_on from the most primary source.
date_overrides:
  # Central university pages give "April 2025"; the day appears only on a sub-unit page.
  osaka_university_rename_university_of_osaka: {effective_on: "2025-04"}
  # Notice gives a planned 2025-07-01 subject to the AGM; the post-change source confirms July 2025 only.
  ntt_rename_ntt_inc_2025: {effective_on: "2025-07"}
  # P0 data audit 4.3 / 4.4: the announcement dates are not supported by the quoted locators; left empty.
  nokia_acquire_alcatel_lucent_2016: {announced_on: ""}
  xperi_holding_rename_adeia: {announced_on: ""}
