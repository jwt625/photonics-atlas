name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Privacy gate (DevLog-010 D199a): no review person / observation id in the committed views. tests/test_views.py
      # reads only committed files (data/, app/static/data/); it needs no sibling input repos.
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Privacy tests (generated views)
        run: uv run --extra dev pytest -q tests/test_views.py

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: app
        run: npx pnpm@10.12.4 install --frozen-lockfile

      - name: Type-check
        working-directory: app
        run: npx pnpm@10.12.4 run check

      - name: Test
        working-directory: app
        run: npx pnpm@10.12.4 test

      - name: Build
        working-directory: app
        env:
          BASE_PATH: /photonics-atlas
        run: npx pnpm@10.12.4 run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
