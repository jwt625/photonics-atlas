[project]
name = "photonics-atlas"
version = "0.1.0"
description = "Shared org/people/source registry and PIC component, supply-chain and people atlases for integrated photonics"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "types-pyyaml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photonics_atlas"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
