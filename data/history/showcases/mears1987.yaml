# Showcase spec: erbium-doped fibre amplifier, Mears, Reekie, Jauncey, Payne, Electron. Lett. 1987. Schema: DevLog-017
# section 4a. Research 2026-11-11. Bases: stated = letter text; figure = read from a printed figure (Fig. 1 is a
# schematic, not to scale); digitized = plot points read from the page scan; ref = other cited source; assumed =
# rendering value only (tooltip says "assumed").
# Coordinates: schematic units = Fig. 1 scan px / 4 (img_p02_1.png crop at (180, 300)), NOT mm. Table plane = Fig. 1
# plane: +x = Fig. 1 right (signal direction), +z = Fig. 1 down (toward the viewer), +y = up. Origin = input fibre end
# (left end of the index-matching cell). All optics on the beam axis y = 0.
id: mears1987
title: Erbium fibre amplifier
tagline: Pumped erbium-doped fibre amplifies 1.54 µm light by up to 28 dB
title_note: >-
  Spelling "fibre" as printed. The letter claims no first: it calls the doped fibre "a third approach" to optical
  repeaters (Mears et al., Electron. Lett. 1987, p.1027 col. 1) and "a new technique of optical amplification" (p.1028
  col. 1); its ref. 3 is the authors' own OFC 1987 paper. Parallel work: Desurvire, Simpson and Becker (AT&T Bell
  Laboratories), Opt. Lett. 12(11), 888 (November 1987, received 1987-06-18) amplified a 1.53 µm signal by +22.2 dB in
  a 13 m Er^{3+}-doped fibre forward-pumped by an argon-ion laser at 514.5 nm (100 mW), and by +29 dB with the fibre
  cooled to 77 K.
renderer: 3d
height: 9                      # runtime: track length in viewport heights

parts:
  - id: laser_diode
    name: Modulated GaInAsP laser diode
    role: Signal source near 1.54 µm, modulated at 140 Mbit/s
    detail: >-
      "The signal was provided by a 1·54 µm GaInAsP DCPBH laser" (DCPBH: double-channel planar buried heterostructure).
      Thermoelectric cooling tuned it from 1.532 to 1.540 µm. Its mounting limited modulation to a few hundred
      megahertz; most measurements used 140 Mbit/s. Fig. 1 draws it as a point source with an arrow; package, mount
      and drive electronics are not described. Shown as a plain block.
    quote: "The signal was provided by a 1·54 µm GaInAsP DCPBH laser."
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1; Fig. 1"
    material: GaInAsP
    look: {color: "#3a3d44", opacity: 1.0, metal: 0.4, rough: 0.5, emissive: ""}
    geometry: {type: box, size: [8, 8, 8], standin: true}
    dims:
      - {label: wavelength, value: 1.54, unit: "µm", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: temperature tuning range, value: "1.532 - 1.540", unit: "µm", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1 (thermoelectric cooling)"}
      - {label: bit rate (most measurements), value: 140, unit: Mbit/s, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: modulation limit, value: "a few hundred", unit: MHz, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1 (set by the diode mounting)"}
      - {label: block size, value: "8 × 8 × 8", unit: "schematic units", basis: assumed, locator: "stand-in; Fig. 1 draws a symbol only"}
    essential: false

  - id: lens_launch_1
    name: Lens (diode side)
    role: Images the diode to a focus ahead of the filter
    detail: >-
      Fig. 1 draws two lenses between the diode and the fibre: the first brings the diode light to an intermediate
      focus, the beam diverges through the variable density filter, and the second focuses it onto the fibre end.
      Lens types and focal lengths are not given.
    quote: ""
    locator: "Mears et al., Electron. Lett. 1987, Fig. 1 (p.1027)"
    material: glass (type not stated)
    look: {color: "#cfe6f2", opacity: 0.35, metal: 0.0, rough: 0.05, emissive: ""}
    geometry: {type: lens, axis: x, diameter: 10, thickness: 2, standin: true}
    dims:
      - {label: diameter (drawn), value: 10, unit: "schematic units", basis: figure, locator: "Fig. 1 lens height, scan px / 4 (schematic)"}
    essential: false

  - id: density_filter
    name: Variable density filter
    role: Attenuator in the signal path, as drawn
    detail: >-
      Fig. 1 labels a dashed line between the two launch lenses "variable density filter". The text does not mention
      it or say how the signal input power was set for the power-transfer measurement (Fig. 3). Drawn as a thin
      neutral plate.
    quote: "variable density filter"
    locator: "Mears et al., Electron. Lett. 1987, Fig. 1 label (p.1027)"
    material: not stated
    look: {color: "#6b6f78", opacity: 0.45, metal: 0.0, rough: 0.3, emissive: ""}
    geometry: {type: plate, axis: x, height: 41, width: 14, thickness: 0.6, standin: true}
    dims:
      - {label: height (drawn), value: 41, unit: "schematic units", basis: figure, locator: "Fig. 1 dashed line length, scan px / 4 (schematic)"}
    essential: false

  - id: lens_launch_2
    name: Lens (fibre side)
    role: Focuses the signal onto the input fibre end
    detail: >-
      Second launch lens of Fig. 1; it focuses the beam onto the fibre end in the index-matching cell. Type and focal
      length are not given.
    quote: ""
    locator: "Mears et al., Electron. Lett. 1987, Fig. 1 (p.1027)"
    material: glass (type not stated)
    look: {color: "#cfe6f2", opacity: 0.35, metal: 0.0, rough: 0.05, emissive: ""}
    geometry: {type: lens, axis: x, diameter: 10, thickness: 2, standin: true}
    dims:
      - {label: diameter (drawn), value: 10, unit: "schematic units", basis: figure, locator: "Fig. 1 lens height, scan px / 4 (schematic)"}
    essential: false

  - id: index_cell
    name: Index-matching cell
    role: Index-matches the signal input fibre end against reflections
    detail: >-
      To stop the amplifier from lasing, feedback from the fibre ends and from plane surfaces in collimated beam
      paths had to be eliminated: "the signal input fibre endface was index-matched as shown". Fig. 1 draws a small
      cell around the fibre end at the launch focus. Cell construction, window and liquid are not described.
    quote: "Thus the signal input fibre endface was index-matched as shown"
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1; Fig. 1 label 'index-matching cell'"
    material: index-matching liquid (type not stated)
    look: {color: "#bcd8e8", opacity: 0.3, metal: 0.0, rough: 0.1, emissive: ""}
    geometry: {type: box, size: [16, 6, 6], standin: true}
    dims:
      - {label: length (drawn), value: 16, unit: "schematic units", basis: figure, locator: "Fig. 1 cell outline, scan px / 4 (schematic)"}
    essential: false

  - id: fibre_coupler
    name: Single-mode fibre coupler
    role: Taps part of the signal to a monitor port; not drawn in Fig. 1
    detail: >-
      Text only, not drawn in Fig. 1: "light from the diode was first launched into a single-mode fibre coupler which
      had a loss of 0·5 dB and a splitting ratio of 10 dB at 1·54 µm. The second output port provided a monitor for
      the signal power and wavelength." Placed on the input line between the launch and the butt-splice, in the order
      the text gives. Coupler type, construction and what the monitor port fed are not stated: shown as a plain box
      with a short open stub.
    quote: "The second output port provided a monitor for the signal power and wavelength."
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"
    material: single-mode fibre
    look: {color: "#7d828c", opacity: 1.0, metal: 0.1, rough: 0.6, emissive: ""}
    geometry: {type: box, size: [8, 3, 4], standin: true, monitor_stub: {length: 8, direction: "+z"}}
    dims:
      - {label: loss, value: 0.5, unit: dB, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: splitting ratio at 1.54 µm, value: 10, unit: dB, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: position on the input line, value: "between launch and butt-splice", unit: "", basis: stated, locator: "text order, p.1027 col. 1", note: "not drawn in Fig. 1; distance along the fibre not given"}
    essential: false

  - id: butt_splice
    name: Index-matched butt-splice
    role: Joins the input fibre to the doped fibre; not drawn in Fig. 1
    detail: >-
      "Light was launched into the doped fibre via an index-matched butt-splice, and the splice loss was measured to be
      less than 1 dB"; index-matching oil at the splice reduced Fresnel reflection. The reported gains include the
      splice loss of about 1 dB ("a true fibre/fibre signal gain"). The authors note that fusion splicing in line
      would reduce round-trip feedback to below -40 dB in a practical amplifier. Not drawn as a separate symbol in Fig. 1.
    quote: "index-matching oil was inserted at the butt-splice to reduce Fresnel reflection"
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"
    material: fibre ends with index-matching oil
    look: {color: "#d8c27a", opacity: 0.5, metal: 0.0, rough: 0.2, emissive: ""}
    geometry: {type: sleeve, axis: x, length: 3, diameter: 2.5, standin: true}
    dims:
      - {label: splice loss, value: "< 1", unit: dB, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: splice loss included in the gains, value: "≈ 1", unit: dB, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1 (gain measurements)"}
    essential: false

  - id: doped_fibre
    name: Er^{3+}-doped fibre
    role: Gain medium, 3 m of erbium-doped single-mode fibre
    detail: >-
      "A 3m length of Er^{3+}-doped fibre (NA = 0·2, λ_{cutoff} = 1·4 µm, dopant concentration ≃10^{19} cm^{-3}) was
      reverse-pumped longitudinally". Made by the group's rare-earth MCVD technique (ref. 4: Poole, Payne and Fermann,
      Electron. Lett. 1985). Fig. 1 draws it as a single loop; coil diameter, turns, core size and host glass are
      not given, so the loop is schematic. Gain saturates above about 20 mW absorbed pump, "indicating a high degree
      of inversion in the three-level Er^{3+} system".
    quote: "A 3m length of Er^{3+}-doped fibre (NA = 0·2, λ_{cutoff} = 1·4 µm, dopant concentration ≃10^{19} cm^{-3}) was reverse-pumped longitudinally with light from a CW DCM-dye laser."
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"
    material: Er^{3+}-doped fibre (host composition not stated)
    look: {color: "#a9b4ba", opacity: 0.9, metal: 0.0, rough: 0.3, emissive: "#ff6a3d"}
    geometry: {type: fibre_loop, plane: xz, loop_center: [45, 0, -16.25], loop_radius: 16.25, from_x: 37, to_x: 75, fibre_diameter: 0.8, schematic: true}
    dims:
      - {label: length, value: 3, unit: m, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1026 col. 2 abstract; p.1027 col. 1", essential: true, show_label: true}
      - {label: maximum gain, label_short: "max. gain", value: 28, unit: dB, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1 ('The maximum gain observed was 28 dB')", essential: true, show_label: true}
      - {label: numerical aperture, value: 0.2, unit: "", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: "cutoff wavelength λ_{cutoff}", value: 1.4, unit: "µm", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: "Er^{3+} concentration", value: "≈ 10^{19}", unit: "cm^{-3}", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: drawn loop radius, value: 16.25, unit: "schematic units", basis: figure, locator: "Fig. 1 loop, scan px / 4", note: "Fig. 1 draws one loop; the real coil size and turn count are not given"}
    essential: true

  - id: lens_output
    name: Lens (output end)
    role: Collimates the amplified signal, focuses the pump in
    detail: >-
      Fig. 1 draws one lens between the fibre output end and the dichroic beam-splitter, with a collimated beam on its
      far side. The same lens serves both directions: the amplified signal leaves through it, and the counter-running
      pump (reverse pumping) enters the fibre through it. Type and focal length are not given.
    quote: ""
    locator: "Mears et al., Electron. Lett. 1987, Fig. 1 (p.1027); reverse pumping p.1027 col. 1"
    material: glass (type not stated)
    look: {color: "#cfe6f2", opacity: 0.35, metal: 0.0, rough: 0.05, emissive: ""}
    geometry: {type: lens, axis: x, diameter: 10, thickness: 2, standin: true}
    dims:
      - {label: diameter (drawn), value: 10, unit: "schematic units", basis: figure, locator: "Fig. 1 lens height, scan px / 4 (schematic)"}
    essential: false

  - id: beam_splitter
    name: Dichroic beam-splitter
    role: Reflects the 1.54 µm signal, passes the red pump
    detail: >-
      "Output signal extraction was performed with a dichroic beam-splitter (90% R at 1·54 µm; 85% T at 670 nm)". In
      Fig. 1 the collimated pump from the dye laser passes straight through it toward the fibre, and the signal
      reflects off it toward the detector lens. It is the bulk optic that combines pump and signal paths; there is
      no fibre wavelength-division coupler and no isolator in the setup. Plate tilt as drawn in Fig. 1 (schematic).
    quote: "Output signal extraction was performed with a dichroic beam-splitter (90% R at 1·54 µm; 85% T at 670 nm)"
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1; Fig. 1"
    material: dichroic coated plate (substrate not stated)
    look: {color: "#a9c8e6", opacity: 0.45, metal: 0.3, rough: 0.05, emissive: ""}
    geometry: {type: plate, size: [26, 14, 1], tilt_deg_from_x: 67, standin: true}
    dims:
      - {label: reflectance at 1.54 µm, value: 90, unit: "%", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: transmittance at 670 nm, value: 85, unit: "%", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: tilt to the beam (drawn), value: 67, unit: deg, basis: figure, locator: "Fig. 1 plate line, scan px", note: "schematic drawing; the real angle of incidence is not stated"}
    essential: false

  - id: lens_detector
    name: Lens (detector side)
    role: Focuses the reflected signal onto the detector
    detail: Fig. 1 draws a lens in the reflected beam ahead of the GaInAs detector. Type and focal length are not given.
    quote: ""
    locator: "Mears et al., Electron. Lett. 1987, Fig. 1 (p.1027)"
    material: glass (type not stated)
    look: {color: "#cfe6f2", opacity: 0.35, metal: 0.0, rough: 0.05, emissive: ""}
    geometry: {type: lens, axis: reflected_beam, diameter: 10, thickness: 2, standin: true}
    dims:
      - {label: diameter (drawn), value: 10, unit: "schematic units", basis: figure, locator: "Fig. 1 lens, scan px / 4 (schematic)"}
    essential: false

  - id: detector
    name: GaInAs detector
    role: Biased GaInAs PIN diode measuring input and output signal
    detail: >-
      "detected with a biased GaInAs PIN diode. The load resistance was provided by the 50 Ω input impedance of either
      a Tektronix sampling head or a Marconi spectrum analyser." The same detector measured input and output in turn,
      so detection losses cancel in the gain. Simple and insensitive, it still detected signals of a few tens of
      nanowatts at the fibre input. Amplifier noise near 100 MHz: 200 pA/√(Hz), a sensitivity of -42 dBm at 140 Mbit/s for a
      10^{-9} bit error rate; the shot noise of the 50 µW amplified spontaneous emission suggests -62 dBm may be reachable.
    quote: "detected with a biased GaInAs PIN diode"
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1 (detection); p.1028 col. 1 (noise)"
    material: GaInAs
    look: {color: "#2e3138", opacity: 1.0, metal: 0.5, rough: 0.4, emissive: ""}
    geometry: {type: cylinder, axis: reflected_beam, diameter: 6, length: 5, standin: true}
    dims:
      - {label: load, value: 50, unit: "Ω", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: amplifier noise near 100 MHz, value: 200, unit: "pA/√Hz", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1028 col. 1"}
      - {label: "sensitivity at 140 Mbit/s, 10^{-9} BER", value: -42, unit: dBm, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1026 col. 2 abstract; p.1028 col. 1", note: "BER: bit error rate"}
      - {label: amplified spontaneous emission power, value: 50, unit: "µW", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1028 col. 1"}
      - {label: sensitivity suggested by shot noise, value: -62, unit: dBm, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1028 col. 1", note: "calculated by the authors, not measured"}
    essential: false

  - id: dye_laser
    name: Ar^{+} ion pumped DCM dye laser
    role: CW pump source, tunable red light
    detail: >-
      The fibre "was reverse-pumped longitudinally with light from a CW DCM-dye laser"; Fig. 1 labels the box "Ar^{+}
      ion pumped DCM dye laser". Fig. 2 plots gain on a 640-690 nm pump axis; the curves rise above 0 dB from about 642 to 685 nm (100 mW curve), and gain is
      "unimpaired for pump wavelengths between 655 nm and 675 nm", which suggests 670 nm laser diodes could pump the
      amplifier. Pump powers are quoted as absorbed in the doped fibre. The pump wavelength of the Fig. 3 and Fig. 4
      runs is not stated. Shown as one box, as in Fig. 1.
    quote: "reverse-pumped longitudinally with light from a CW DCM-dye laser"
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1; Fig. 1; p.1027 col. 2 (pump wavelength)"
    material: DCM dye (argon-ion pumped)
    look: {color: "#2a2d33", opacity: 1.0, metal: 0.25, rough: 0.55, emissive: ""}
    geometry: {type: box, size: [42.5, 14, 30], standin: true}
    dims:
      - {label: "pump wavelengths with gain (100 mW curve)", value: "≈ 642 - 685", unit: nm, basis: digitized, locator: "Fig. 2 curve feet (p.1027); axis 640-690 nm"}
      - {label: band of unimpaired gain, value: "655 - 675", unit: nm, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 2"}
      - {label: box size (drawn), value: "42.5 × 30", unit: "schematic units", basis: figure, locator: "Fig. 1 box, scan px / 4 (schematic)"}
    essential: false

  - id: signal_beam
    name: Signal light
    role: 1.54 µm signal, amplified on its way through the fibre
    detail: >-
      Path as drawn in Fig. 1: diode, lens, intermediate focus, variable density filter, lens, index-matched fibre end,
      coupler, butt-splice, doped fibre, output lens, dichroic beam-splitter (reflected), lens, detector. 1.54 µm is
      infrared: the drawn colour is illustrative. The growth of the light along the fibre is illustrative; the paper
      reports only the end-to-end (fibre/fibre) gain. Highest gains lie in a 300 GHz band centred on 1.536 µm.
    quote: "High gain amplification of up to 28 dB has been observed in a 3m-long erbium-doped fibre."
    locator: "Mears et al., Electron. Lett. 1987, p.1026 col. 2 abstract"
    material: light
    look: {color: "#b07cff", opacity: 0.85, metal: 0.0, rough: 1.0, emissive: "#b07cff"}
    geometry: {type: beam_path, path: [laser_diode, lens_launch_1, density_filter, lens_launch_2, index_cell, fibre_coupler, butt_splice, doped_fibre, lens_output, beam_splitter, lens_detector, detector]}
    dims:
      - {label: wavelength, value: 1.54, unit: "µm", basis: stated, locator: "Mears et al., Electron. Lett. 1987, title and p.1027 col. 1", essential: true}
      - {label: centre of the highest-gain band, value: 1.536, unit: "µm", basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 2"}
      - {label: bandwidth of highest gain, value: 300, unit: GHz, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 2"}
      - {label: drawn colour, label_short: "drawn colour", value: illustrative, unit: "", basis: assumed, locator: "1.54 µm is invisible", essential: true}
    essential: true

  - id: pump_beam
    name: Pump light
    role: Red dye-laser light running against the signal
    detail: >-
      Reverse (counter-directional) pumping: the pump enters through the dichroic beam-splitter and the output lens
      at the far end of the doped fibre and runs toward the signal input. It is absorbed in the doped fibre (powers in
      the letter are absorbed powers). Drawn at a red tone for about 670 nm, the wavelength at which the beam-splitter
      transmission is specified; the fading along the fibre is illustrative (no absorption profile printed).
    quote: "reverse-pumped longitudinally"
    locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"
    material: light
    look: {color: "#ff3b1f", opacity: 0.8, metal: 0.0, rough: 1.0, emissive: "#ff3b1f"}
    geometry: {type: beam_path, path: [dye_laser, beam_splitter, lens_output, doped_fibre], direction: "-x"}
    dims:
      - {label: absorbed pump for 20 dB gain, value: "≈ 20", unit: mW, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: threshold, value: "a little over 10", unit: mW, basis: stated, locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1"}
      - {label: drawn colour, value: "red, about 670 nm", unit: "", basis: assumed, locator: "beam-splitter spec wavelength; run wavelengths not stated except Fig. 2"}
    essential: false

