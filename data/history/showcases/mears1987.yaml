chapters:
  - {id: intro, p: [0.00, 0.08], keyword: "Fibre amplifier, 1987", line: "Southampton: light amplified inside an erbium-doped fibre.", action: "whole bench floats exploded above the table, slow orbit; beams off", parts: [laser_diode, doped_fibre, dye_laser, beam_splitter, detector], labels: []}
  - {id: signal, p: [0.08, 0.18], keyword: "Signal laser", line: "A modulated GaInAsP diode supplies the signal.", action: "diode, two launch lenses and the dashed filter plate settle on the axis; signal beam draws from the diode through the intermediate focus to the fibre end (illustrative colour)", parts: [laser_diode, lens_launch_1, density_filter, lens_launch_2, signal_beam], labels: [signal_beam]}
  - {id: launch, p: [0.18, 0.28], keyword: "No reflections", line: "Index-matched fibre end and splice keep the fibre from lasing.", action: "index-matching cell closes around the fibre end; coupler box (with its open monitor stub) and the oil-filled butt-splice slide onto the input fibre; hover on coupler says 'not drawn in Fig. 1'", parts: [index_cell, fibre_coupler, butt_splice], labels: []}
  - {id: fibre, p: [0.28, 0.38], keyword: "Er^{3+}-doped fibre", line: "Erbium ions in the fibre core form the gain medium.", action: "doped fibre runs from the splice, makes the single schematic loop of Fig. 1, ends at the output; faint warm tint in the doped section only", parts: [doped_fibre], labels: [doped_fibre]}
  - {id: pump, p: [0.38, 0.50], keyword: "Reverse pumped", line: "Dye-laser light enters the far end, against the signal.", action: "dye-laser box and dichroic plate set down; red pump beam leaves the box, passes straight through the plate, is focused by the output lens into the fibre end and runs right-to-left along the doped fibre, fading as it is absorbed (illustrative); residual pump beyond the doped fibre is not described, do not draw it", parts: [dye_laser, beam_splitter, lens_output, pump_beam], labels: []}
  - {id: gain, p: [0.50, 0.62], keyword: "*28 dB* gain", line: "The signal grows through the pumped fibre and leaves amplified.", action: "pump stays on (it must be on before and during amplification); a signal pulse train enters left to right, brightens along the doped fibre only (illustrative growth), exits through the output lens collimated", parts: [signal_beam, doped_fibre, pump_beam], labels: [doped_fibre]}
  - {id: detect, p: [0.62, 0.70], keyword: "Dichroic split", line: "Mirror for the signal, window for the pump.", action: "at the plate the signal reflects toward the detector lens and detector (about 90 % of it), the pump continues through toward the fibre; detector face lights", parts: [beam_splitter, lens_detector, detector, signal_beam, pump_beam], labels: [signal_beam]}
  - {id: pump_curve, p: [0.70, 0.80], plot: gain_pump, keyword: "Pump power", line: "More absorbed pump, more gain, across a broad red band.", action: "model in the left half; per series as the pen draws it: pump beam brightness steps 16 / 40 / 100 mW (relative brightness, no numbers on canvas), dye-laser output tone follows the pen's pump wavelength, output signal brightness = the digitized gain at the pen point; hold the last pen point at the series end, never beyond 640-690 nm", parts: [dye_laser, pump_beam, doped_fibre, signal_beam], labels: []}
  - {id: transfer, p: [0.80, 0.90], plot: transfer, keyword: "Power handling", line: "Output tracks input linearly, then saturates at high power.", action: "absorbed pump fixed (60 mW per the text; no number on canvas); step through the 7 measured points in the order the pen reveals them: input beam brightness = point input power, output brightness = point output power; no interpolated states; the dashed linear-gain line is a guide only", parts: [signal_beam, doped_fibre, detector], labels: []}
  - {id: spectrum, p: [0.90, 1.00], plot: spectrum, keyword: "Gain spectrum", line: "Measured gain peaks sharply and follows the fluorescence curve.", action: "diode tunes: step through the 7 measured points as the pen reveals them (signal tone shifts slightly, output brightness = measured gain); while the dashed fluorescence curve draws, hold the last measured state (the curve is not a gain measurement); end on a frozen frame, pump on", parts: [laser_diode, signal_beam, doped_fibre], labels: []}

