  - id: spectrum
    title: ""
    source: "Mears et al., Electron. Lett. 1987, Fig. 4, p.1027 col. 2: 'Gain spectrum and spontaneous emission'"
    note: >-
      Points: measured gain (circle centres). The first point, 1530.9 nm, lies below the stated diode tuning range
      1.532-1.540 µm (p.1027 col. 1); kept as printed. Horizontal bars: the printed error bars (the diode laser's spectral
      width), ends read from the scan to about ±0.2 nm. Dashed: the fluorescence (spontaneous emission) curve superimposed by the authors on the
      gain axis; its scale is not a gain. The model shows the measured point under the pen on a relative, illustrative
      scale (signal brightness linear in dB; pump power and wavelength not stated, drawn as on; growth along the fibre
      drawn, not measured). Fluorescence digitized per scan column over the dashes, median per 0.25 nm
      bin, bins without ink (dash gaps, points) dropped; on the steep rise to the apex (1534.8-1535.2 nm) and the first
      falling dash (1537.05-1537.2 nm) read per scan row. The apex between about 1535.2 and 1537.05 nm is hidden behind
      the two highest measured points and is bridged by a straight line, as is the 1531.5-1532.5 nm gap under the two
      lowest error bars. y calibrated piecewise between the printed ticks (tick
      spacing varies up to 6 %).
    x: {label: Signal wavelength, unit: nm, log: false, range: [1520, 1570], ticks: [1520, 1530, 1540, 1550, 1560]}
    y: {label: Gain, unit: dB, log: false, range: [0, 35], ticks: [0, 10, 20, 30]}
    series:
      - name: "measured gain"
        basis: digitized
        locator: "Mears et al., Electron. Lett. 1987, p.1027 Fig. 4 (points)"
        style: points
        points: [[1530.91, 12.4], [1532.74, 12.92], [1533.81, 17.85], [1534.75, 21.84], [1535.89, 26.73], [1536.81, 25.79], [1538.7, 22.87]]
        err_x: [[1.41, 1.4], [0.84, 0.86], [0.71, 0.69], [0.75, 0.65], [0.69, 0.61], [0.71, 0.79], [1.1, 1.1]]   # runtime: printed error-bar ends minus the centres, nm (report section 3)
      - name: "fluorescence (scaled as printed)"
        basis: digitized
