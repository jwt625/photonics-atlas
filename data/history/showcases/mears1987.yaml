  - id: gain_power
    alt_of: gain_pump
    title: ""
    label: "Peak gain vs pump power"
    source: "Mears et al., Electron. Lett. 1987, Fig. 2 maxima (p.1027) and text p.1027 col. 1"
    note: >-
      Derived view, not a printed figure: the maximum of each Fig. 2 curve over pump wavelength (digitized) and the
      one stated pair "20 dB for approximately 20 mW absorbed". The text puts the threshold "a little over 10 mW" and
      the maximum observed gain at 28 dB (pump power not stated). Points are not joined: the letter prints no gain
      against pump power curve. The model shows the plotted point on a relative, illustrative scale (signal brightness linear in dB, pump glow linear in absorbed mW, pump colour ramp illustrative; growth and fading along the fibre drawn, not measured).
    x: {label: Absorbed pump power, unit: mW, log: false, range: [0, 110], ticks: [0, 20, 40, 60, 80, 100]}
    y: {label: Gain, unit: dB, log: false, range: [0, 30], ticks: [0, 10, 20, 30]}
    series:
      - name: "Fig. 2 curve maxima"
        basis: digitized
        locator: "Mears et al., Electron. Lett. 1987, p.1027 Fig. 2: maxima at 663.75 nm (16 mW), 667.0 nm (40 mW), 658.75 nm (100 mW, flat plateau 656-668 nm)"
        style: points
        points: [[16, 16.52], [40, 26.14], [100, 27.22]]
      - name: "text: 20 dB at about 20 mW"
        basis: stated
        locator: "Mears et al., Electron. Lett. 1987, p.1027 col. 1 ('a gain of 20 dB is available for approximately 20 mW absorbed')"
        style: points
        points: [[20, 20]]
  - id: transfer
    title: ""
    source: "Mears et al., Electron. Lett. 1987, Fig. 3, p.1027 col. 2: 'Power transfer characteristic'"
    note: >-
      Measured at 60 mW absorbed pump (text). Points are the printed circles (centres by ring-template match); the
      dashed line is the printed linear-gain guide, read at each dash centre (slope 1.02, about 26 dB gain). Gain
      begins to saturate above -20 dBm input (+5 dBm output); 3 dB compression at +7 dBm output (text). The printed y
      axis sits at about -39.7 dBm, so the first point lies on it. The model shows the plotted point on a relative, illustrative scale (signal brightness linear in dB, pump glow linear in absorbed mW, pump colour ramp illustrative; growth and fading along the fibre drawn, not measured); pump held at 60 mW.
    x: {label: Input power, unit: dBm, log: false, range: [-40, -7.5], ticks: [-40, -30, -20, -10]}
    y: {label: Output power, unit: dBm, log: false, range: [-20, 22.5], ticks: [-20, -10, 0, 10, 20]}
    series:
