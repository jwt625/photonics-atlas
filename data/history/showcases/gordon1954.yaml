- id: cavity
  name: Cavity
  role: Cylindrical copper resonator in the TE_{011} mode, coaxial with the beam.
  detail: 'Letter: "A cylindrical copper cavity was used, operating in the TE_{011} mode. The molecules, which travel parallel to the axis of the cylinder, then see a field which varies in amplitude as sin(πx/L), where x varies from 0 to L." "The cavity used was twelve centimeters long" (p.283 col. 1). Diameter from the patent: "a circular cylinder with a diameter of about 0.6 inch and a length of about five inches. The cavity can be tuned by varying its length by means of a sliding end section." (col. 5:27-30). Check (derived): a TE_{011} cylinder 12 cm long resonates at 23 870 Mc/sec for an inner diameter of 15.34 mm (0.604 in), consistent with "about 0.6 inch". Wall thickness and the sliding end''s construction are not given.'
  quote: A cylindrical copper cavity was used, operating in the TE_{011} mode.
  locator: Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1
  material: copper
  look: {color: '#c98a5a', opacity: 1.0, metal: 1.0, rough: 0.25, emissive: ''}
  geometry: {type: tube, axis: x, inner_diameter: 15.24, wall: 1.5, length: 120, end_caps: true, cutaway: true}
  dims:
  - {label: length, label_short: length, value: 12, unit: cm, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1 ("twelve centimeters long")', essential: true, show_label: true, note: 'the patent example says "about five inches" (12.7 cm), col. 5:29'}
  - {label: inner diameter (patent value), value: 'about 0.6', unit: in, basis: stated, locator: 'US 2,879,439 col. 5:28', essential: false, note: '15.24 mm; TE_{011} at 23 870 Mc/sec with L = 12 cm needs 15.34 mm (derived)'}
  - {label: mode, value: 'TE_{011}', unit: '', basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1', essential: false}
  - {label: field along the axis, value: 'sin(πx/L), x from 0 to L', unit: '', basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1', essential: false}
  - {label: tuning (patent), value: sliding end section, unit: '', basis: stated, locator: 'US 2,879,439 col. 5:29-30', essential: false}
  - {label: wall, value: 1.5, unit: mm, basis: assumed, locator: 'not stated', essential: false}
  essential: true

- id: entry_aperture
  name: Aperture
  role: Hole in the cavity's upstream end where the beam enters.
  detail: 'Patent: "The upper states are thus concentrated into a fairly tight axially extending beam 412 of excited molecules directed toward the aperture 413 of cavity 414" (col. 5:24-26); "The aperture 413 for entry of the beam may be about 0.4 inch in diameter." (col. 5:31-32). FIG. 4 draws it in the upstream end wall on the axis. The letter does not describe the entrance. Whether the downstream end has an exit hole is not shown.'
  quote: The aperture 413 for entry of the beam may be about 0.4 inch in diameter.
  locator: US 2,879,439 col. 5:31-32; FIG. 4
  material: none (opening)
  look: {color: '#000000', opacity: 1.0, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: hole, in: cavity, face: upstream end, diameter: 10.16}
  dims:
  - {label: diameter (patent value), value: 'about 0.4', unit: in, basis: stated, locator: 'US 2,879,439 col. 5:31-32', essential: false, note: '10.16 mm'}
  essential: false

- id: output_guide
  name: Output guide
  role: Waveguide carrying power out of the cavity to the detector.
  detail: 'Letter Fig. 1: "OUTPUT GUIDE" rises from the top of the cavity near its upstream end, arrow pointing away. Patent: "an emission line is seen at output guide 421 when the transmitted frequency goes through the molecular transition frequency" (col. 5:37-39); "Mica windows 419, 421, in the respective waveguides keep the system vacuum-tight but permit passage of microwave energy." (col. 5:44-46). Guide cross-section, size and the coupling hole are not given; drawn as a plain rectangular stand-in.'
  quote: an emission line is seen at output guide 421 when the transmitted frequency goes through the molecular transition frequency
  locator: 'US 2,879,439 col. 5:37-39; Gordon, Zeiger, Townes, Phys. Rev. 1954, Fig. 1 (p.283)'
  material: not stated
  look: {color: '#a7abb3', opacity: 1.0, metal: 0.8, rough: 0.35, emissive: ''}
  geometry: {type: rect_tube, axis: y, stand_in: true, inner: [10, 5], wall: 1, length: 90}
  dims:
  - {label: position on the cavity, value: 'top wall, about a quarter of the length from the beam entrance', unit: '', basis: figure, locator: 'letter Fig. 1 (about 0.22 of the cavity length); US 2,879,439 FIG. 4 (about 0.27)', essential: false}
  - {label: cross-section, value: '10 x 5', unit: mm, basis: assumed, locator: 'not stated; stand-in', essential: false}
  essential: false

- id: input_guide
  name: Input guide
  role: Waveguide feeding swept klystron power into the cavity.
  detail: 'Letter Fig. 1: "INPUT GUIDE" comes down beside the downstream end of the cavity, arrow pointing in. Text: "Power of varying frequency is transmitted through the cavity, and an emission line is seen when the klystron frequency goes through the molecular transition frequency." Patent: "Power of varying frequency is transmitted to the cavity through input waveguide 419" (col. 5:35-37); FIG. 4 runs guide 419 down along the cavity''s downstream end wall, and both drawings join it to that end. Coupling hole and guide size are not given; plain rectangular stand-in.'
  quote: Power of varying frequency is transmitted through the cavity
  locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1; US 2,879,439 col. 5:35-37; FIG. 4'
  material: not stated
  look: {color: '#a7abb3', opacity: 1.0, metal: 0.8, rough: 0.35, emissive: ''}
  geometry: {type: rect_tube, axis: y, stand_in: true, inner: [10, 5], wall: 1, length: 110, joins: 'cavity downstream end wall'}
  dims:
  - {label: cross-section, value: '10 x 5', unit: mm, basis: assumed, locator: 'not stated; stand-in', essential: false}
  essential: false

- id: upper_state
  name: Upper-state molecules
  role: Molecules in the upper inversion level; focused onto the axis.
  detail: 'Letter: "Of the inversion levels, the upper states experience a radial inward (focusing) force, while the lower states see a radial outward force. The molecules arriving at the cavity are then virtually all in the upper states." Patent: the field in the focuser "is proportional to the radius. The energy of a particle in the focusser in an upper inversion state increases with the radius" (col. 5:17-19). Most probable beam velocity "4 x 10^{4} cm/sec" at room temperature (letter p.283 col. 1); motion on screen is slowed, not to scale. Shown as amber particles; particle count and spread are illustrative.'
  quote: The molecules arriving at the cavity are then virtually all in the upper states.
  locator: Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1
  material: NH_{3} molecules
  look: {color: '#f7962c', opacity: 0.95, metal: 0.0, rough: 1.0, emissive: '#f7962c'}
  geometry: {type: effect, particles: true, path: 'source -> focuser (converging to the axis) -> cavity'}
  dims:
  - {label: most probable velocity, value: '4 x 10^{4}', unit: cm/sec, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1', essential: false}
  - {label: time to cross the cavity, value: 0.3, unit: ms, basis: derived, locator: 'L/v = 12 cm / 4 x 10^{4} cm/sec', essential: false}
  essential: false

- id: lower_state
  name: Lower-state molecules
  role: Molecules in the lower inversion level; pushed out of the beam.
  detail: 'Letter: "the lower states see a radial outward force." They leave the beam in the focuser and do not reach the cavity. Patent: "These latter molecules are diverted from the beam" (col. 2:44-45); cooling the electrodes "to condense the molecules of low energy" is a patent option (col. 4:64-67), not stated for the 1954 apparatus. Molecules that have emitted in the cavity are in the lower level too. Shown as blue particles; the mix leaving the source is drawn about half and half (illustrative: the letter gives no populations).'
  quote: while the lower states see a radial outward force
  locator: Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1
  material: NH_{3} molecules
  look: {color: '#4c9bf0', opacity: 0.85, metal: 0.0, rough: 1.0, emissive: '#4c9bf0'}
  geometry: {type: effect, particles: true, path: 'source -> focuser (diverging, fading out)'}
  dims: []
  essential: false

- id: cavity_field
  name: Cavity field
  role: Microwave field inside the cavity, strongest at mid-length.
  detail: 'Letter: in the TE_{011} mode "The molecules ... see a field which varies in amplitude as sin(πx/L), where x varies from 0 to L" (p.283 col. 1). Drawn as a glow along the axis with that envelope. The radial and azimuthal shape of the mode is not drawn in the letter; the glow does not show it.'
  quote: see a field which varies in amplitude as sin(πx/L), where x varies from 0 to L.
  locator: Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1
  material: microwave field
  look: {color: '#46dca5', opacity: 0.45, metal: 0.0, rough: 1.0, emissive: '#46dca5'}
  geometry: {type: effect, in: cavity, envelope: 'sin(pi x / L), x from 0 to L along the axis'}
  dims: []
  essential: false

- id: input_wave
  name: Klystron power
  role: Swept microwave power sent in through the input guide.
  detail: 'Letter: "Power of varying frequency is transmitted through the cavity, and an emission line is seen when the klystron frequency goes through the molecular transition frequency." The klystron, its sweep and the detector are not drawn in either source; the wave in the input guide stands for that power.'
  quote: an emission line is seen when the klystron frequency goes through the molecular transition frequency
  locator: Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1
  material: microwaves
  look: {color: '#c6a6fa', opacity: 0.7, metal: 0.0, rough: 1.0, emissive: '#c6a6fa'}
  geometry: {type: effect, in: input_guide, direction: 'into the cavity'}
  dims: []
  essential: false

- id: output_wave
  name: Emission
  role: Microwave power leaving the cavity through the output guide.
  detail: 'Spectrometer: an emission line appears in the output as the klystron frequency passes the molecular line (letter p.283). Oscillator: "If the power emitted from the beam is enough to maintain the field strength in the cavity at a sufficiently high level to induce transitions in the following beam, then self-sustained oscillations will result. Such oscillations have been produced. Although the power level has not yet been directly measured, it is estimated at about 10^{-8} watt." The line shown in Figs. 2 and 3 is the J = K = 3 inversion line "at 23 870 Mc/sec"; the letter does not say on which line the oscillator ran.'
  quote: Such oscillations have been produced.
  locator: Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1; Fig. 2 caption (p.283)
  material: microwaves
  look: {color: '#46dca5', opacity: 0.8, metal: 0.0, rough: 1.0, emissive: '#46dca5'}
  geometry: {type: effect, in: output_guide, direction: 'out of the cavity'}
  dims:
  - {label: J = K = 3 inversion line, label_short: '3,3 line', value: '23 870', unit: Mc/sec, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, Fig. 2 caption (p.283)', essential: true, show_label: true}
  - {label: 'oscillation power (estimate, not measured)', value: 'about 10^{-8}', unit: W, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1', essential: false}
  - {label: observed line width (full width at half maximum), value: '6-8', unit: kc/sec, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.282 col. 2 and p.283 col. 2', essential: false}
  - {label: expected line width, value: 4, unit: kc/sec, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1-2 (Δν = 1.2v/L, "in the present case is 4 kc/sec")', essential: false}
  essential: true

