  - {label: outer diameter, value: 16, unit: mm, basis: assumed, locator: 'not stated; rendering value', essential: false}
  - {label: length shown, value: 60, unit: mm, basis: assumed, locator: 'not stated; FIG. 4 draws the tube broken off', essential: false}
  essential: false

