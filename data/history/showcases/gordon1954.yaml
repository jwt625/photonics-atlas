- {part: input_guide, pos: [373.5, -9.1, 0], axis: y, basis: figure, locator: 'shares the cavity''s downstream end wall and runs from the cavity bottom up out of the chamber: letter Fig. 1, US 2,879,439 FIG. 4'}
