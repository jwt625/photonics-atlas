# Showcase spec: ammonia beam maser, Gordon, Zeiger, Townes 1954. Schema: DevLog-017 section 4a, runtime fields in
# app/src/lib/history/showcase/types.ts. Research 2026-11-11 (report: gordon1954.report.txt).
# Sources: the letter (Phys. Rev. 95, 282-284, licensed, local only) fixes the arrangement (Fig. 1), the cavity
# (copper, TE011, 12 cm), the beam velocity, the line and the results; Townes, US 2,879,439 (public domain, same
# apparatus family: FIGS. 4-6 "using ammonia gas") gives example sizes the letter does not print (focuser, cavity
# diameter, apertures, pressures, voltage). Patent values are labelled as patent values with column:line.
# Bases: stated = letter or patent text; figure = read from a printed figure; derived = computed from stated values;
# assumed = rendering value only (tooltip says assumed).
# Coordinates: mm. x = beam axis, +x downstream (source -> focuser -> cavity), y up. Origin = centre of the source's
# perforated end face. Focuser cross-section as seen looking downstream (+x, as FIG. 6 section 6-6), y up:
# V electrodes upper-left and lower-right, O electrodes upper-right and lower-left (FIG. 6 and letter Fig. 1).
id: gordon1954
title: Ammonia maser
title_note: 'The letter calls the device a "molecular microwave oscillator" (title) and "an experimental device, which can be used as a very high resolution microwave spectrometer, a microwave amplifier, or a very stable oscillator" (Gordon, Zeiger, Townes, Phys. Rev. 1954, p.282). The word maser does not appear in it; the name is in the title of the authors'' full paper, "The Maser - New Type of Microwave Amplifier, Frequency Standard, and Spectrometer" (Phys. Rev. 1955). The letter makes no "first" claim.'
tagline: A state-selected ammonia beam emits in a cavity; the device oscillates, 1954.
renderer: 3d
height: 8

parts:
- id: nh3_source
  name: NH_{3} source
  role: Ammonia gas at low pressure; the beam leaves through many holes.
  detail: 'Fig. 1 of the letter labels the start of the beam "NH_{3} SOURCE" and shows its "END X-SECTION" as a disc with many small holes. Text: "A beam of ammonia molecules emerges from the source and enters a system of focusing electrodes." Patent (FIGS. 4-5): a tube 43 whose end carries apertures 45; "The gas is fed from a suitable source at low pressure (approximately 10^{-3} mm. Hg) through apertures 45 into chamber 417" (col. 4:48-50). Tube diameter and length, hole count and hole size are not given in either source; the tube is drawn as a plain stand-in.'
  quote: A beam of ammonia molecules emerges from the source and enters a system of focusing electrodes.
  locator: Gordon, Zeiger, Townes, Phys. Rev. 1954, p.282 col. 2; Fig. 1 (p.283)
  material: ammonia gas (NH_{3})
  look: {color: '#9aa0a8', opacity: 1.0, metal: 0.8, rough: 0.35, emissive: ''}
  geometry: {type: tube, axis: x, outer_diameter: 16, wall: 1.5, length: 60, end: apertures, stand_in: true}
  dims:
