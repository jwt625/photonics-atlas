withheld:
- {what: 'Focuser length, electrode size, spacing and voltage of the 1954 apparatus', reason: 'The letter prints none; the values shown are the patent''s example values ("may be, for example, about"), labelled as such'}
- {what: 'Gaps between source, focuser and cavity', reason: 'Not stated in the letter or the patent; the gaps in the model are assumed and drawn short'}
- {what: 'Source tube size, hole count and hole size', reason: 'Not stated; the tube is a stand-in and the hole pattern is copied from patent FIG. 5 (schematic)'}
- {what: 'Waveguide size, shape and the coupling holes into the cavity', reason: 'Neither source gives them; guides are plain stand-ins placed as in the letter''s Fig. 1 and patent FIG. 4'}
- {what: 'Chamber shape, size and pump', reason: 'Only the patent draws a chamber (FIG. 4) with a pump connection; no size, shape or pump type; shown as a faint stand-in'}
- {what: 'What happens to the beam after the cavity (exit hole, beam dump)', reason: 'Not shown in Fig. 1 or FIG. 4; particles fade inside the cavity'}
- {what: 'Electrode cooling', reason: 'Liquid-air cooling is a patent option ("advantageous"); the letter does not say the 1954 focuser was cooled'}
- {what: 'Line on which the oscillator ran, its measured power and stability', reason: 'The letter says oscillations "have been produced", estimates about 10^{-8} watt (not measured) and gives no line; the 23 870 Mc/sec label belongs to the J = K = 3 line of Figs. 2-3'}
- {what: 'Klystron, sweep, detector and oscilloscope', reason: 'Named only (klystron, scope photograph of Fig. 2); not drawn or specified'}
- {what: 'Radial and azimuthal field pattern of the TE_{011} mode', reason: 'The letter gives only the axial envelope sin(πx/L); the glow shows only that'}
- {what: 'Populations of the two levels in the source gas', reason: 'Not given; the half-and-half mix leaving the source is illustrative'}
- {what: 'Fig. 2 oscilloscope photograph', reason: 'A photograph without a frequency scale (frequency increases to the left); not digitized; licensed figure, not shown'}
