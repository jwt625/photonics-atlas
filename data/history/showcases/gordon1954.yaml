  - {label: 'clear radius at the axis, profile scaled to 2 cm', value: '4.8-5.7', unit: mm, basis: figure, locator: 'letter Fig. 1 focuser cross-section (p.283), digitized', essential: false, note: 'the model mirrors the upper-left electrode: clear radius 5.8 mm'}
  - {label: interelectrode potential (patent value), value: 'about 20 to 30', unit: kV, basis: stated, locator: 'US 2,879,439 col. 4:59', essential: false}
  essential: true

- id: focuser_ground
  name: Focusing electrodes (O)
  role: Grounded pair of the quadrupole focuser, on the other diagonal.
  detail: 'The two electrodes marked O in the focuser cross-section (letter Fig. 1; patent FIG. 6, where they are wired to ground through lead 427). Same profile and length as the V pair. Patent: "It is also advantageous to cool the electrodes to a low temperature by circulating a refrigerant medium, such as liquid air, through them" (col. 4:64-66); whether the 1954 focuser was cooled is not stated in the letter.'
  quote: The electrodes are advantageously of the cross-sectional shape shown in Fig. 6
  locator: 'US 2,879,439 col. 4:60-61, FIG. 6; Gordon, Zeiger, Townes, Phys. Rev. 1954, Fig. 1 (p.283)'
  material: metal (not stated)
  look: {color: '#8f949c', opacity: 1.0, metal: 0.9, rough: 0.35, emissive: ''}
  geometry: {type: extruded_profile, axis: x, length: 200, same_as: focuser_hv}
  dims:
  - {label: length (patent value), value: 'about 20', unit: cm, basis: stated, locator: 'US 2,879,439 col. 4:56-57', essential: false}
  essential: true

- id: leads
  name: Leads
  role: High-voltage lead to the V pair, ground lead to the O pair.
  detail: 'Patent: "a high voltage electric field is maintained by a suitable external source through leads 426, 427" (col. 4:54-56). FIG. 4 draws 427 from the upper electrode through the chamber wall to a ground symbol and 426 from the lower electrode through the wall "TO VOLTAGE SOURCE"; FIG. 6 joins the two V electrodes to the source and the two O electrodes to ground. The letter does not draw leads. Drawn as plain wires; the voltage source is not drawn.'
  quote: maintained by a suitable external source through leads 426, 427
  locator: US 2,879,439 col. 4:54-56; FIGS. 4, 6
  material: wire
  look: {color: '#8a8f99', opacity: 1.0, metal: 0.6, rough: 0.4, emissive: ''}
  geometry: {type: wire, schematic: true, from: [focuser_hv, focuser_ground], through: vacuum_chamber}
  dims: []
  essential: false

- id: vacuum_chamber
  name: Chamber
  role: Evacuated enclosure around beam, focuser and cavity (patent drawing).
  detail: 'Patent: chamber 417 "is kept evacuated at 418 by any suitable vacuum pump to a pressure of approximately 10^{-4} mm. Hg" (col. 4:50-52); FIG. 4 draws it as a hatched wall around the focuser and the cavity, with the source tube entering one end. The letter''s Fig. 1 is a block diagram without the enclosure. Shape and size are not given: shown as a faint neutral box, not a model of the real vessel.'
  quote: chamber 417, which is kept evacuated at 418 by any suitable vacuum pump to a pressure of approximately 10^{-4} mm. Hg
  locator: US 2,879,439 col. 4:50-52; FIG. 4
