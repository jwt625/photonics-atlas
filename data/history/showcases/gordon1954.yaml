chapters:
- {id: intro, p: [0.00, 0.08], keyword: Ammonia beam, line: 'Columbia University, 1954: molecules drive a microwave cavity.', action: 'all parts float exploded along x around the faint chamber; slow orbit', parts: [nh3_source, focuser_hv, focuser_ground, cavity, output_guide, input_guide, vacuum_chamber], labels: []}
- {id: source, p: [0.08, 0.20], keyword: Ammonia source, line: 'NH_{3} gas leaves the source through many small holes.', action: 'source tube flies in; camera looks at the perforated end; a mixed stream (amber and blue, about half each) leaves the holes along +x into the evacuated chamber', parts: [nh3_source, apertures, vacuum_chamber, pump_port, upper_state, lower_state], labels: []}
- {id: focuser, p: [0.20, 0.34], keyword: Quadrupole focuser, line: 'Four electrodes along the beam, high voltage on one diagonal.', action: 'four electrodes slide in around the beam axis; end-on view shows V / O on alternate diagonals; leads attach; voltage still off, beam passes straight', parts: [focuser_hv, focuser_ground, leads], labels: [focuser_hv, focuser_ground]}
- {id: select, p: [0.34, 0.48], keyword: State selection, line: Upper states are pushed inward; lower states are pushed outward., action: 'voltage on; amber particles converge toward the axis inside the focuser, blue particles drift outward and fade before the focuser end; plots.levels assembles', parts: [upper_state, lower_state, focuser_hv, focuser_ground], plot: levels, labels: []}
- {id: cavity, p: [0.48, 0.58], keyword: Copper cavity, line: 'A copper cylinder in the TE_{011} mode, coaxial with the beam.', action: 'cavity slides onto the axis after the focuser; aperture faces the beam; output guide on top near the entrance, input guide at the far end; cut-away opens', parts: [cavity, entry_aperture, output_guide, input_guide], labels: [cavity]}
- {id: emission, p: [0.58, 0.70], keyword: Emission, line: 'Arriving molecules are virtually all upper states; they emit.', action: 'amber particles enter the cavity and turn blue while crossing it; the field glow builds with the sin(pi x / L) envelope; klystron power enters through the input guide, output leaves through the output guide', parts: [upper_state, lower_state, cavity_field, input_wave, output_wave], labels: []}
- {id: spectrum, p: [0.70, 0.86], keyword: '*23 870 Mc/sec*', line: Klystron sweep reveals the main line and new magnetic satellites., action: 'plots.spectrum assembles; model in the left half; klystron offset = x of the plot pen; cavity glow and output brightness follow the digitized curve at the pen', parts: [output_wave, input_wave, cavity_field], plot: spectrum, labels: [output_wave]}
- {id: oscillation, p: [0.86, 1.00], keyword: Self-sustained, line: Emitted power holds the field; oscillation needs no input., action: 'input power fades to zero while the cavity glow and output stay on; ends as a held frame of the running oscillator', parts: [output_wave, cavity_field, upper_state], labels: []}

plots:
- id: levels
  kind: levels
  title: ''
  source: 'Schematic from the letter''s text; the letter prints no level diagram. Values: Fig. 2 caption (p.283) and text p.282-283.'
  note: >-
    Schematic, drawn from the text: the letter prints no energy-level figure. The two inversion levels of the
    J = K = 3 state; the transition between them is the line at 23 870 Mc/sec (Fig. 2 caption). The drawn gap is not to
    scale. The focuser passes the upper level and removes the lower one (p.282-283).
  y: {label: Energy (schematic), log: false, range: [-0.3, 1.35], scale: none}
  levels:
  - {id: lower, label: lower inversion level, kind: line, energy: 0.0, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1 ("Of the inversion levels ... the lower states")', note: 'pushed outward by the focuser; drawn height schematic'}
  - {id: upper, label: upper inversion level, kind: line, energy: 1.0, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1 ("the upper states experience a radial inward (focusing) force")', note: 'focused onto the axis; virtually all molecules reaching the cavity; drawn height schematic'}
  splits:
  - {between: [upper, lower], value: '23 870', unit: Mc/sec, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, Fig. 2 caption (p.283): "J = K = 3 inversion line at 23 870 Mc/sec"'}
  transitions:
  - {from: upper, to: lower, label: '3,3 line', kind: emission, basis: stated, locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.283 col. 1 (emission of energy in the cavity); Fig. 2 caption'}

