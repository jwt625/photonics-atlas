- id: focuser_hv
  name: Focusing electrodes (V)
  role: High-voltage pair of the quadrupole focuser, on one diagonal.
  detail: 'The focuser establishes "a quadrupolar cylindrical electrostatic field whose axis is in the direction of the beam" (letter p.282-283). Its cross-section (letter Fig. 1 "FOCUSSER X-SECTION"; patent FIG. 6) shows four electrodes, two marked V and two marked O on the diagonals; in FIG. 6 the V pair is wired to the voltage source and the O pair to ground. Patent example values: "about 2 cm. in diameter and about 20 cm. in length", "minimum interelectrode spacing may be about 4 mm. with an interelectrode potential of about 20 to 30 kv." (col. 4:56-59). The letter gives no focuser dimensions or voltage. The profile is read from the letter''s Fig. 1 cross-section and scaled to the patent''s 2 cm; the gaps between neighbours then come out at 3.1-4.5 mm, consistent with the patent''s "about 4 mm".'
  quote: These electrodes establish a quadrupolar cylindrical electrostatic field whose axis is in the direction of the beam.
  locator: 'Gordon, Zeiger, Townes, Phys. Rev. 1954, p.282 col. 2 - p.283 col. 1; US 2,879,439 col. 4:52-63, FIG. 6'
  material: metal (not stated)
  look: {color: '#b8bcc4', opacity: 1.0, metal: 0.9, rough: 0.3, emissive: ''}
  geometry: {type: extruded_profile, axis: x, length: 200, profile_mm_upper_left: [[-8.19, 2.37], [-9.84, 2.53], [-11.62, 2.69], [-13.33, 2.99], [-15.0, 3.41], [-16.42, 3.9], [-17.95, 4.65], [-19.34, 5.73], [-20.28, 7.09], [-21.06, 8.61], [-21.52, 10.13], [-21.84, 11.84], [-21.52, 13.56], [-21.08, 15.21], [-20.43, 16.79], [-19.42, 18.12], [-18.09, 19.32], [-16.74, 20.31], [-15.17, 20.97], [-13.51, 21.4], [-11.73, 21.55], [-10.02, 21.24], [-8.37, 20.78], [-6.88, 19.93], [-5.64, 18.9], [-4.53, 17.59], [-3.59, 16.13], [-2.92, 14.57], [-2.65, 12.84], [-2.34, 11.12], [-2.03, 9.41], [-2.19, 7.63], [-2.69, 6.0], [-3.66, 4.56], [-4.96, 3.47], [-6.52, 2.79]], profile_basis: 'letter Fig. 1 focuser cross-section, digitized, scaled to 20 mm width', others: 'upper-right = mirror in y-axis (z), lower-left = mirror in the horizontal, lower-right = both mirrors; V on upper-left and lower-right, O on upper-right and lower-left (FIG. 6, Fig. 1)'}
