  - {label: electrode diameter (patent value), value: 'about 2', unit: cm, basis: stated, locator: 'US 2,879,439 col. 4:56-57 ("about 2 cm. in diameter")', essential: false}
  - {label: minimum interelectrode spacing (patent value), value: 'about 4', unit: mm, basis: stated, locator: 'US 2,879,439 col. 4:58', essential: false}
