  note: >-
    Later device (Vellekoop and Smit 1991), measured: intensity across the cleaved end face at 778.1 nm, TE (Fig. 6,
    p.313). Channel 2 is lit, channels 1, 3 and 4 stay dark; the peaks at about 20 and 29 µm are the two bent reference
    guides, those at about 75 and 85 µm the two straight ones. The paper estimates 0.6 dB insertion loss for channel 2.
    The paper's dashed channel markers sit at about 38, 47, 57 and 66 µm. Digitized from the page scan: flat parts read
    per column, shipped every 3.1-4.2 µm; peak flanks read per row at the stroke centre, median per 1/60 of the curve
    length (peak feet three times denser), not interpolated; 393 points spanning 2.46-98.16 µm (the printed baseline
    runs on to the frame). The right-hand peak touches the
    figure's top frame. Alternate of the Table II plot (TE by default, TM toggle).
