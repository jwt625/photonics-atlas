# Showcase spec: optical phased array of concentric bent waveguides (smit1988). Schema: DevLog-017 section 4a, runtime
# fields in app/src/lib/history/showcase/types.ts. Research 2026-11-11 (report: smit1988.report.txt).
# Sole technical source: M. K. Smit, Electron. Lett. 24(7), 385-386 (1988-03-31), licensed, local only.
# Page / column locators: p.385 = first journal page (Fig. 1, Fig. 2, Eq. (1)-(4)); p.386 col. 1 = experiment and Fig. 3,
# p.386 col. 2 = demultiplexer prototype and conclusions.
# Plan frame (all geometry): micrometres, origin at the common centre of curvature, x to the right, y up, orientation as in
# the Fig. 3 photograph (beam enters from the left, guides turn upward, beams leave up and to the right). Fig. 1 draws the
# same geometry mirrored (turning downward); the two are equivalent.
# This device has NO input waveguide and NO input free region: a broad beam meets the bare input plane of the array.
# The later layout with fan-in / fan-out sections and star couplers is not this paper (see withheld, references).
# Closing coda (owner decision 2026-11-11): two chapters show the later layout of Vellekoop and Smit, J. Lightwave
# Technol. 9(3) 1991, labelled as later work; its parts have ids starting later_ and their own frame plan_um_1991.
id: smit1988
title: Optical phased array
title_note: 'The letter calls it "a novel focusing and dispersive component ... based on a phased array of bent optical waveguides" (Smit, Electron. Lett. 1988, p.385); it uses neither "PHASAR" nor "arrayed-waveguide grating". The name arrayed-waveguide grating appears in the title of Takahashi et al., Electron. Lett. 1990, p.87. A later review by the same author calls this letter "the first AWG" (Smit et al., Semicond. Sci. Technol. 2014, p.2); the 1988 letter itself says only "novel". The two closing chapters show a later design, not this device: the four-channel demultiplexer of Vellekoop and Smit, J. Lightwave Technol. 1991, with the fan-in and fan-out sections this letter recommended.'
tagline: Thirty-one bent Al₂O₃ guides focus and disperse light like a grating.
renderer: 2.5d
height: 8.1

parts:
- id: substrate
  name: silicon substrate
  role: Silicon wafer under the Al₂O₃ guides; size not stated (stand-in).
  detail: 'The arrays were realised "using Al_{2}O_{3} ridge guides on a silicon substrate, as described in References 4 and 5" (Smit, van der Laan and Acket, Thin Solid Films 1986; Smit, Sensors & Actuators symposium 1986). Neither reference is read here, so the layer stack (film thickness, ridge height, any buffer layer) is withheld. Substrate size is not stated: drawn as a plain stand-in.'
  quote: We realised a set of arrays using Al_{2}O_{3} ridge guides on a silicon substrate, as described in References 4 and 5.
  locator: Smit, Electron. Lett. 1988, p.385 col. 2
  material: silicon
  look: {color: '#4a4d52', opacity: 1.0, metal: 0.2, rough: 0.6, emissive: ''}
  geometry: {type: stand_in_rect, note: 'plain rectangle framing the five arrays; size not stated'}
  essential: false

- id: other_arrays
  name: further arrays
  role: Four more identical arrays on the same substrate.
  detail: 'Fig. 3 shows "five identical arrays (the white areas)" in a column; the second one is excited. Centre-to-centre pitch read from the photograph against its 1 mm bar: about 0.50 mm (65.4 px at 131 px/mm, spread 63-67 px). Each white area measures about 0.5-0.6 mm across and 0.3-0.37 mm high, consistent with the stated radii and sector angle. In the photograph each array sits about 0.07 mm left of the one above (about 0.27 mm over the column; a stagger or a slight tilt of the column, not stated); drawn aligned (assumed).'
  quote: The substrate comprises five identical arrays (the white areas).
  locator: Smit, Electron. Lett. 1988, p.385 col. 2 to p.386 col. 1; Fig. 3 (p.386)
  material: Al₂O₃ ridge guides
  look: {color: '#d8e2ea', opacity: 0.55, metal: 0.0, rough: 0.5, emissive: ''}
  geometry: {type: copies_of, of: array, count: 4, pitch_um: 500, direction: 'y; one copy above the excited array, three below (the excited one is the second from the top)'}
  dims:
  - {label: arrays per substrate, value: 5, basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1'}
  - {label: array pitch, value: '≈ 0.50', unit: mm, basis: figure, locator: 'Smit, Electron. Lett. 1988, Fig. 3 (p.386), against the 1 mm bar', note: 'read from a halftone photograph, about ±0.03 mm'}
  essential: false

- id: array
  name: phased array
  role: Concentric bent Al₂O₃ ridge guides; drawn equidistant (true radii not printed).
  detail: '31 concentric waveguides, 3 µm wide, at an average radial spacing of 6 µm, with bending radii R_{i} from 910 to 1090 µm, each turning through the sector angle ψ = 30°. The guides are deliberately not equidistant: the radii are computed from βψR_{i} = Φ(R_{i}) + 2πm_{i} (Eq. (3)) so that each guide delivers a chosen phase; the m_{i} are picked to keep the array as close to equidistant as possible. The individual radii and the phase profile used are not printed, so the guides are drawn equidistant at the stated 6 µm average (the stated example, m_{i} - m_{i-1} = 10, needs spacing changes of at most ±5 %).'
  quote: We chose a number of 31 concentric waveguides with a width of 3 µm at an average distance ΔR_{i} of 6 µm, R_{i} varying between 910 and 1090 µm. ψ was chosen 30°.
  locator: Smit, Electron. Lett. 1988, p.386 col. 1; Fig. 1 and Eq. (3) (p.385)
  material: Al₂O₃ ridge guides
  look: {color: '#d8e2ea', opacity: 0.95, metal: 0.0, rough: 0.4, emissive: ''}
  geometry:
    type: concentric_arcs
    frame: plan_um
    centre: [0, 0]
    count: 31
    radius_um: {first: 910, last: 1090, step: 6, drawn: 'equidistant at the stated average; true radii not printed'}
    width_um: 3
    theta_deg: [0, 30]
    note: 'guide i is the arc (R_{i} sin θ, -R_{i} cos θ), θ from 0 (input plane, heading +x) to 30° (output plane, heading 30° above +x); true scale'
  dims:
  - {label: guides, value: 31, basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1', essential: true, label_short: guides}
  - {label: bending radii, value: '910-1090', unit: 'µm', basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1', essential: true, label_short: 'R_{i}'}
  - {label: guide width, value: 3, unit: 'µm', basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1'}
  - {label: average radial spacing, value: 6, unit: 'µm', basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1', note: '30 steps of 6 µm = 180 µm = 1090 - 910 µm'}
  - {label: average gap between guides, value: 3, unit: 'µm', basis: derived, locator: '6 µm spacing - 3 µm width (Smit, Electron. Lett. 1988, p.386 col. 1)'}
  - {label: 'guide length ψR_{i}', value: '476-571', unit: 'µm', basis: derived, locator: 'Eq. (1), p.385; 0.5236 rad × 910 / 1090 µm'}
  - {label: 'average length step ψΔR_{i}', value: '3.14', unit: 'µm', basis: derived, locator: '0.5236 rad × 6 µm'}
  - {label: plan extent of one array, value: '≈ 0.55 × 0.30', unit: mm, basis: derived, locator: 'from the radii and ψ; Fig. 3 white areas measure about 0.5-0.6 × 0.3-0.37 mm'}
  essential: true

- id: input_plane
  name: input plane
  role: Radial line where all guides start, facing the incoming beam.
  detail: 'Fig. 1 labels the straight radial line through the centre of curvature where every guide begins "input plane". The guides start there tangent to the incoming beam direction. The phase at the input plane, φ_{0}, is the same for all guides and drops out (Eq. (1)). No fan-in section: the letter recommends adding "fan-in and fan-out coupling sections" to avoid multiple orders and reduce coupling losses, which this device did not have.'
  quote: To avoid the occurrence of multiple orders, and simultaneously reduce coupling losses, the array should be provided with fan-in and fan-out coupling sections.
  locator: Smit, Electron. Lett. 1988, Fig. 1 and Eq. (1) (p.385); p.386 col. 1
  material: ''
  look: {color: '#a8a69d', opacity: 0.7, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: dash_dot_line, frame: plan_um, from: [0, -1110], to: [0, -890], extends_to_centre: true}
  essential: false

- id: output_plane
  name: output plane
  role: Radial line at the sector angle where all guides end.
  detail: 'Fig. 1 labels the radial line at the sector angle ψ "output plane". Light arrives there with phase φ_{i} = βψR_{i} + φ_{0} (Eq. (1)): every guide turns through the same angle, so the path, and the phase, grows linearly with the radius. Guide ends lie at the 6 µm average spacing along this line; light leaves each guide along its tangent, perpendicular to the line.'
  quote: The light coupled into the waveguides will propagate to the output plane and arrive there with phase distribution
  locator: Smit, Electron. Lett. 1988, p.385 col. 1; Fig. 1 and Eq. (1) (p.385)
  material: ''
  look: {color: '#a8a69d', opacity: 0.7, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: dash_dot_line, frame: plan_um, from: [445.0, -770.8], to: [555.0, -961.3], note: 'radial at θ = 30°; inner guide end (455.0, -788.1), outer (545.0, -944.0)'}
  essential: false

- id: sector
  name: sector angle ψ
  role: Angle every guide turns through, between input and output planes.
  detail: 'ψ is "the sector angle of the concentric array" (Fig. 1). The experiment used ψ = 30°. ψ also sets the dispersion: Eq. (4) gives dα ≈ ψ dβ/β, "a wavelength shift of 1 % will cause an angular dispersion of 0.01ψ; with ψ = π this is roughly 2°".'
  quote: ψ is the sector angle of the concentric array, and R_{i} is the bending radius of the ith waveguide.
  locator: Smit, Electron. Lett. 1988, p.385 col. 2; Fig. 1, Eq. (4) (p.385); p.386 col. 1
  material: ''
  look: {color: '#a8a69d', opacity: 0.8, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: angle_arc, frame: plan_um, centre: [0, 0], from_deg: 0, to_deg: 30, note: 'drawn at the centre of curvature between the two radial planes, as in Fig. 1'}
  dims:
  - {label: sector angle, value: 30, unit: '°', basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1', essential: true}
  essential: true

- id: he_ne_beam
  name: broad Gaussian He-Ne beam
  role: Broad He-Ne beam over the input plane; λ 0.6320 µm as printed.
  detail: 'The second array of Fig. 3 "is excited with a broad Gaussian He-Ne beam (λ = 0.6320 µm)" (wavelength as printed; the common He-Ne line is 0.6328 µm). "Part of the incident power will couple into the waveguides and the other part will propagate straight forward or be scattered" (p.385). How the beam was launched into the film and its width are not stated; drawn as a parallel band covering the input plane.'
  quote: the second array, which is excited with a broad Gaussian He-Ne beam (λ = 0.6320 µm)
  locator: Smit, Electron. Lett. 1988, p.386 col. 1; p.385 col. 1
  material: ''
  look: {color: '#ff3b2f', opacity: 0.85, metal: 0.0, rough: 1.0, emissive: '#ff3b2f'}
  geometry: {type: beam_band, frame: plan_um, direction: '+x', y_band: [-1100, -900], from_x: -600, to_x: 0, profile: 'Gaussian across the band (stated "Gaussian"; width not stated)'}
  dims:
  - {label: wavelength, value: '0.6320', unit: 'µm', basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1', note: as printed}
  essential: false

- id: straight_light
  name: uncoupled light
  role: Light that misses the guides and runs straight on.
  detail: 'Not all of the broad beam enters the guides: "the other part will propagate straight forward or be scattered" (p.385). Fig. 3 shows a bright horizontal streak continuing past the excited array at its height. Fraction not stated.'
  quote: part of the incident power will couple into the waveguides and the other part will propagate straight forward or be scattered.
  locator: Smit, Electron. Lett. 1988, p.385 col. 1; Fig. 3 (p.386)
  material: ''
  look: {color: '#ff3b2f', opacity: 0.25, metal: 0.0, rough: 1.0, emissive: '#ff3b2f'}
  geometry: {type: beam_band, frame: plan_um, direction: '+x', y_band: [-1100, -900], from_x: 0, to_x: 1400, note: 'faint; fraction not stated'}
  essential: false

- id: free_region
  name: region beyond the output plane
  role: Where the beams from the guides converge toward the focal plane.
  detail: 'Between the output plane and the focal plane the beams leave the guides and converge; Fig. 3 shows them as a bright fan rising at about 29° from the horizontal (measured on the photograph), close to the 30° sector angle. The layer makeup of this region is not stated.'
  locator: Smit, Electron. Lett. 1988, Fig. 3 (p.386)
  material: not stated
  look: {color: '#d8e2ea', opacity: 0.12, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: polygon, frame: plan_um, corners: 'output plane ends (455.0, -788.1), (545.0, -944.0) to the focal plane ±150 µm around the focus', note: 'outline only as the support for the converging beams'}
  essential: false

- id: focal_plane
  name: focal plane
  role: Design focal plane, 1 mm beyond the output plane.
  detail: 'A quadratic phase distribution Φ(R_{i}) "will yield a focusing operation" (p.385). In Fig. 3 "the dashed line represents the design position for the focal plane (f = 1 mm)". On the photograph the dashed line lies about 0.95-1.05 mm from the excited array and roughly perpendicular to the outgoing beams. The focus is drawn on the perpendicular through the middle of the output plane; the centre of the quadratic profile is not printed. The letter also reports a "small size (1.3 × 4 mm) five-channel demultiplexer prototype working at He-Ne wavelength with a wavelength channel spacing of 0.5%, exhibiting good focusing properties and a channel separation better than 20 dB", built by "positioning a set of receiver waveguides next to each other in the focal plane" (Smit, Electron. Lett. 1988, p.386 col. 2); its layout is not printed, so it is not drawn.'
  quote: The dashed line represents the design position for the focal plane (f = 1 mm).
  locator: Smit, Electron. Lett. 1988, p.386 col. 1; Fig. 3 (p.386); p.385 col. 2
  material: ''
  look: {color: '#a8a69d', opacity: 0.8, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: dashed_line, frame: plan_um, through: [1366.0, -366.0], direction: [-0.5, 0.866], half_length_um: 160, note: 'axis from the output-plane midpoint (500.0, -866.0) along (0.866, 0.5) for f = 1000 µm'}
  dims:
  - {label: focal length, value: 1, unit: mm, basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1', essential: true, label_short: f}
  essential: true

- id: foci
  name: focused orders
  role: Several foci side by side, one per grating order; drawn count illustrative.
  detail: '"A phased array having different orders and multiple foci will occur without additional measures"; Fig. 3 shows "a number of focused beams emerging from the second array". The spacing of the orders in the focal plane "compares well with the theoretically expected value (66 µm)". The number of orders seen is not stated: drawn are the central focus and one neighbour on each side (illustrative count). Spot size not stated.'
  quote: The spatial separation of the orders in the focal plane compares well with the theoretically expected value (66 µm).
  locator: Smit, Electron. Lett. 1988, p.386 col. 1; Fig. 3 (p.386)
  material: ''
  look: {color: '#ff3b2f', opacity: 0.95, metal: 0.0, rough: 1.0, emissive: '#ff3b2f'}
  geometry: {type: spots, frame: plan_um, centre: [1366.0, -366.0], neighbours: [[1333.0, -308.8], [1399.0, -423.2]], spacing_um: 66, note: 'central brightest, neighbours fainter (relative strengths not stated); count illustrative'}
  dims:
  - {label: order separation (theory), value: 66, unit: 'µm', basis: stated, locator: 'Smit, Electron. Lett. 1988, p.386 col. 1', note: 'theoretical value; the measured spacing is said to compare well, no number printed'}
  essential: false

- id: wavefront
  name: tilted wavefront
  role: Wavelength shift tilts the wavefront, moving the focus; shift drawn 10× larger.
  detail: 'The channel length is proportional to R_{i}, so a frequency shift causes a phase shift linear in R_{i}: "the position of the focus in the focal plane will shift linearly with df, the focal length remaining unaffected" (p.385). Fig. 2 relates the wavefront tilt α to the phase step Δφ_{i} between neighbouring guides; Eq. (4): dα ≈ ψ dβ/β, so a 1 % wavelength shift tilts the beam by 0.01ψ. For this array (ψ = 30°, f = 1 mm) that is about 0.3°, about 5 µm along the focal plane per 1 % (derived, not printed). Drawn shift is exaggerated. Direction (derived from Eq. (1), not stated): a longer wavelength moves the focus toward the inner, smaller-radius side.'
  quote: Consequently, the position of the focus in the focal plane will shift linearly with df, the focal length remaining unaffected.
  locator: Smit, Electron. Lett. 1988, p.385 col. 2; Fig. 2 and Eq. (4) (p.385)
  material: ''
  look: {color: '#ff7a5c', opacity: 0.8, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: wavefront_lines, frame: plan_um, at: output_plane, note: 'short lines parallel to the output plane, then tilted; focus slides along the focal plane; magnitude exaggerated and labelled'}
  dims:
  - {label: angular dispersion, value: '0.01ψ per 1 % wavelength shift', basis: stated, locator: 'Smit, Electron. Lett. 1988, p.385 col. 2, Eq. (4)'}
  - {label: focus shift for this array, value: '≈ 5', unit: 'µm per 1 %', basis: derived, locator: '0.01 × 0.5236 rad × 1 mm; Eq. (4), p.385 and dims p.386 col. 1', note: 'derived for the Fig. 3 arrays, not the demultiplexer prototype'}
  essential: false

# ---- Later-work coda (DevLog-017 owner decision): the 1991 four-channel demultiplexer of the same Delft group.
# Not the 1988 device. Every coda part id starts with later_. Frame plan_um_1991 (micrometres): origin at the common
# centre of the concentric section, x to the right, y up; transmitter on the left and receivers on the right as in
# Fig. 1 (p.311); the arch of guides on top and both fans pointing down, as the two fan regions in the Fig. 4 mask
# photograph (p.313). Values from Table I (p.312); derived values are marked derived with their formula.

- id: later_layout
  name: four-channel demultiplexer (1991)
  role: 'Later design: phased-array demultiplexer of Vellekoop and Smit, 4.5 × 3.2 mm chip.'
  detail: 'Later work, not the 1988 device. Three years after this letter the same Delft group built a four-channel wavelength demultiplexer around a phased array with the fan-in and fan-out coupling sections the letter recommended. Fig. 1 names the sections in order: transmitter waveguide, divergence region, fan-out coupling section, adapter section, concentric section, adapter section, fan-in coupling section, convergence region, receiver waveguides. Design wavelength 780 nm, 31 array guides 2 µm wide; a 0.25 µm Al_{2}O_{3} film (n ≈ 1.69) on thermally oxidized silicon with a 40 nm milled step under a 0.6 µm SiO_{2} cover (n ≈ 1.46), an embedded ridge guide with optical contrast Δn ≈ 0.02. Measured: channels at 776.5, 778.1, 779.6 and 781.2 nm (1.55 nm spacing); TE insertion loss 0.6 dB for the central and 1.2 dB for the outer channels, excluding 1.3 dB waveguide loss; crosstalk 15.4-29.7 dB (TE) and 13.4-22.2 dB (TM). The drawn plan uses the printed design values (Table I); derived values say so in hover. The chip outline, the placement of the layout on the chip, the reference channels and the access-guide routes are not printed and are not drawn.'
  quote: An experimental device with dimensions 4.5 × 3.2 mm^{2} is designed and fabricated, using conventional (high quality) optical lithography.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 abstract; Fig. 1 (p.311); p.311-312 Sec. IV-V; Table II (p.314)'
  material: Al₂O₃ embedded ridge guides on oxidized silicon
  look: {color: '#d8e2ea', opacity: 0.0, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: group, frame: plan_um_1991, of: 'all later_ parts', note: 'no chip outline: the 4.5 × 3.2 mm size is stated, the placement and orientation of the layout on the chip are not'}
  dims:
  - {label: chip size, value: '4.5 × 3.2', unit: mm, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 abstract; p.312 col. 2'}
  - {label: design wavelength, value: 780, unit: nm, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 2; Table I (p.312)'}
  - {label: channels, value: 4, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 abstract'}
  - {label: 'channel wavelengths (measured)', value: '776.5, 778.1, 779.6, 781.2', unit: nm, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table II (p.314)'}
  - {label: 'channel spacing (measured)', value: 1.55, unit: nm, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 abstract; p.314 conclusions', note: 'design: Δβ/β_{0} = 0.22 %, about 1.7 nm (p.312)'}
  - {label: TE insertion loss, value: '0.6 (central) / 1.2 (outer)', unit: dB, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 abstract; p.313 col. 2', note: 'relative to the bent reference guides, excluding 1.3 dB waveguide loss'}
  - {label: 'crosstalk TE / TM', value: '15.4-29.7 / 13.4-22.2', unit: dB, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 abstract; p.313 col. 2'}
  - {label: 'film / cover', value: '0.25 µm Al_{2}O_{3} (n ≈ 1.69) / 0.6 µm SiO_{2} (n ≈ 1.46)', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.312 col. 2 Sec. V'}
  essential: false

- id: later_transmitter
  name: transmitter waveguide
  role: 'Later design: the single input guide; light leaves its end and spreads.'
  detail: 'Later work (1991). A 2 µm wide guide ends on the array axis; the light leaving it diverges across the divergence region with a 1/e^{2} far-field half angle θ_{0} = 6.86° (Table I). In the experiment light from an AlGaAs laser was coupled in with a prism coupler, the input and reference channels excited together by a broad beam (p.312). The route from the coupling point to the divergence region is not printed (Fig. 1 is schematic): drawn as a short stub along the axis that fades out.'
  quote: Input and reference channels were excited simultaneously with a broad beam.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.312 col. 2; Fig. 1 (p.311); Table I (p.312)'
  material: Al₂O₃ embedded ridge guide
  look: {color: '#d8e2ea', opacity: 0.95, metal: 0.0, rough: 0.4, emissive: ''}
  geometry: {type: guide_stub, frame: plan_um_1991, end: [-1216.7, -859.8], direction: [-0.0192, -0.9998], drawn_length_um: 200, width_um: 2, note: 'direction points away from the array along its axis; stub length illustrative, route not printed'}
  dims:
  - {label: guide width, value: 2, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 2'}
  - {label: '1/e^{2} modal half width', value: 1.34, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  - {label: '1/e^{2} beam divergence half angle', value: 6.86, unit: '°', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  essential: false

- id: later_divergence
  name: divergence region
  role: 'Later design: free slab between the input guide and the fan, f = 123 µm.'
  detail: 'Later work (1991). Laterally unguided film where the light from the transmitter spreads over the fan. Its length is the focal length f = 123 µm (Table I; Fig. 1 dimensions f from the guide end to the input plane), chosen with Eq. (6) for a 5 µm receiver spacing and weak polarization dependence. Lithography filled the narrow gaps between the fan guides over about 70 µm, so the effective focal length became about 193 µm (p.313); the drawn length is the design value. The lateral outline of the region is not printed: drawn as the sector the fan spans.'
  quote: With a lateral receiver-waveguide spacing d = 5 µm and a relative-channel spacing Δβ/β_{0} = 0.22%, the focal length becomes 123 µm.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 2; Fig. 1 (p.311); Table I (p.312); p.313 col. 2'
  material: Al₂O₃ film, no lateral guiding
  look: {color: '#d8e2ea', opacity: 0.2, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: sector, frame: plan_um_1991, apex: [-1216.7, -859.8], axis: [0.0192, 0.9998], radius_um: 123, half_angle_deg: 13.97, note: 'apex = transmitter end; arc = input plane; outline = the sector spanned by the fan (real edges not printed)'}
  dims:
  - {label: 'focal length (design)', value: 123, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312); p.311 col. 2'}
  - {label: 'effective focal length (gap fill)', value: '≈ 193', unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.313 col. 2', note: 'gaps filled over about 70 µm of the fan'}
  essential: false

- id: later_fan_out
  name: fan-out coupling section
  role: 'Later design: 31 straight guides fanning out at equal angles over ±14°.'
  detail: 'Later work (1991). The coupling sections "gradually adapt the in- and outcoming beams to the set of guided modes in the array" (p.310), which reduces the power going into the higher-order foci of the 1988 array (p.310). Straight guides pointing at the transmitter end (Fig. 1, angle α_{i}), each t = 460 µm long, the outermost at α_{max} = 14.0° (Table I); t = 460 µm brings the concentric sector angle to about 180° and avoids guide crossings (p.311). Equal angular steps of w/f = 2 µm / 123 µm = 0.93° are derived, not printed: the pitch at the input plane then equals the 2 µm width used for the array-function period in Eq. (5)-(6), and 15 steps give 13.97°, matching α_{max}. The guides touch at the input plane (2 µm pitch, 2 µm wide); the paper reports the gaps filled in over about 70 µm (p.313). The Fig. 4 mask photograph (1 mm bar) shows two solid fan regions narrowing downward, 0.27-0.28 mm long as solid areas (0.3-0.4 mm with the sparse specks above them; the two-level scan loses the guides) and about 0.06 mm wide at the tips, tips 2.41 mm apart: consistent with the drawn layout (2.43 mm).'
  quote: These coupling sections gradually adapt the in- and outcoming beams to the set of guided modes in the array.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 col. 2; Fig. 1 (p.311); Table I (p.312); Fig. 4 (p.313)'
  material: Al₂O₃ embedded ridge guides
  look: {color: '#d8e2ea', opacity: 0.95, metal: 0.0, rough: 0.4, emissive: ''}
  geometry: {type: radial_guides, frame: plan_um_1991, origin: [-1216.7, -859.8], axis: [0.0192, 0.9998], count: 31, step_deg: 0.9316, r_um: [123, 583], width_um: 2, note: 'guide k (k = -15..15) at angle k × 0.9316° from the axis; ends of the two outermost guides: inner side (-1184.7, -741.0) to (-1065.1, -296.9), outer side (-1244.1, -739.9) to (-1346.6, -291.5)'}
  dims:
  - {label: section length t, value: 460, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312); p.311 col. 2'}
  - {label: 'maximum guide angle α_{max}', value: 14.0, unit: '°', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)', note: 'printed as "transceiver maximum angle"; read as the angle of the outermost fan guide (α_{i} in Fig. 1)'}
  - {label: angular step, value: 0.93, unit: '°', basis: derived, locator: 'w / f = 2 µm / 123 µm (p.311, Table I)', note: 'equal steps assumed; 15 steps = 13.97°, matching α_{max}'}
  - {label: 'fan width at input plane / at section end', value: '62 / 282', unit: 'µm', basis: derived, locator: '31 guides at 2 µm pitch; 2 × 583 µm × sin 13.97°'}
  essential: true

- id: later_adapters
  name: adapter sections
  role: 'Later design: bends from the fans onto the arcs; guide shapes not printed.'
  detail: 'Later work (1991). "To obtain a smooth connection between the concentric section and the coupling section, an adapter section is required" (p.310). Only the length of the central channel is printed, s_{0} = 300 µm (Table I). The shapes of the other 30 adapter guides are not printed: each adapter is drawn as a plain band between the end of the fan and the start of the concentric arcs, with no guides inside. The central channel is drawn straight through it (assumed).'
  quote: To obtain a smooth connection between the concentric section and the coupling section, an adapter section is required.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 col. 2; Table I (p.312)'
  material: Al₂O₃ embedded ridge guides
  look: {color: '#d8e2ea', opacity: 0.3, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: stand_in_band, frame: plan_um_1991, corners_left: [[-1065.1, -296.9], [-1346.6, -291.5], [-1378.5, 26.5], [-1021.0, 19.6]], corners_right: 'mirror in x', note: 'plain band, no guides drawn; corners = outermost fan ends and outermost arc starts'}
  dims:
  - {label: 'adapter central length s_{0}', value: 300, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  essential: false

- id: later_concentric
  name: concentric section
  role: 'Later design: 31 concentric arcs through 177.8°, central radius 1.2 mm.'
  detail: 'Later work (1991). As in 1988 every guide turns through one sector angle, here Ψ = 177.8°, so the channel length grows linearly with the radius (p.310, Table I). Central channel radius R_{0} = 1200 µm (Table I); at 780 nm the minimum bend radius of this guide is 1 mm (p.311). The other radii are not printed (chosen so that each channel length is an integer number of wavelengths, p.310): drawn equidistant at 11.9 µm, derived from Eq. (1), d = (Δβ/β) Ψ (f + t + s_{0}/2), with the equal-angle fan: ΔR = (w/f)(f + t + s_{0}/2) = 0.01626 × 733 µm. That gives radii 1021-1379 µm (the innermost above the stated 1 mm minimum) and a path-length step ΨΔR ≈ 37 µm (derived, not printed). Check: Eq. (1) with Table I values returns d = 5.0 µm for Δβ = 0.0274 µm^{-1}, the stated receiver spacing.'
  quote: The phase transfer of the complete phased array (including coupling and adapter sections), can be controlled by choosing the radii R_{i} of the concentric section such, that the total length of each channel equals an integer number of wavelengths.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 col. 2, Eq. (1); Fig. 1 (p.311); Table I (p.312)'
  material: Al₂O₃ embedded ridge guides
  look: {color: '#d8e2ea', opacity: 0.95, metal: 0.0, rough: 0.4, emissive: ''}
  geometry:
    type: concentric_arcs
    frame: plan_um_1991
    centre: [0, 0]
    count: 31
    radius_um: {central: 1200, step: 11.92, first: 1021.2, last: 1378.8, drawn: 'equidistant at the derived step; true radii not printed'}
    width_um: 2
    polar_deg: [1.1, 178.9]
    note: 'arch over the top (polar angle from +x); central arc ends (-1199.8, 23.0) and (1199.8, 23.0); the legs below the arc ends splay outward by 1.1° each'
  dims:
  - {label: sector angle Ψ, value: 177.8, unit: '°', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  - {label: 'central channel radius R_{0}', value: 1200, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  - {label: 'array guides N_{p}', value: 31, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312); p.312 col. 2'}
  - {label: radial step, value: '≈ 11.9', unit: 'µm', basis: derived, locator: '(w/f)(f + t + s_{0}/2), Eq. (1) p.310 and Table I (p.312)', note: 'not printed; equal-angle fan assumed'}
  - {label: radii, value: '≈ 1021-1379', unit: 'µm', basis: derived, locator: '1200 µm ± 15 × 11.92 µm', note: 'innermost above the stated 1 mm minimum bend radius (p.311)'}
  - {label: path-length step, value: '≈ 37', unit: 'µm', basis: derived, locator: 'Ψ × ΔR = 3.103 rad × 11.92 µm', note: 'not printed; check: 2π / Δβ_{p} = 37.0 µm, the TE / TM one-period condition of Eq. (5)'}
  - {label: minimum bend radius, value: 1, unit: mm, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 2'}
  essential: true

- id: later_fan_in
  name: fan-in coupling section
  role: 'Later design: mirror of the fan-out, converging on the receivers.'
  detail: 'Later work (1991). The receiver side mirrors the transmitter side (Fig. 1): an adapter, then 31 straight guides over t = 460 µm, now converging at equal angles (derived, as the fan-out) on the focal point at the end of the convergence region. The array turns the diverging input beam into a converging one with the same angular field distribution, reproducing the transmitter field in the focal plane (p.310); a wavelength change tilts the outgoing beam and moves the focus sideways (Eq. (1)).'
  quote: This choice of the phase transfer will transform the divergent incoming beam into a convergent outcoming one with the same angular field distribution.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 col. 2; Fig. 1 (p.311); Table I (p.312)'
  material: Al₂O₃ embedded ridge guides
  look: {color: '#d8e2ea', opacity: 0.95, metal: 0.0, rough: 0.4, emissive: ''}
  geometry: {type: radial_guides, frame: plan_um_1991, origin: [1216.7, -859.8], axis: [-0.0192, 0.9998], count: 31, step_deg: 0.9316, r_um: [123, 583], width_um: 2, note: 'mirror in x of the fan-out section'}
  dims:
  - {label: section length t, value: 460, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  essential: false

- id: later_convergence
  name: convergence region
  role: 'Later design: free slab where the array output focuses onto the receivers.'
  detail: 'Later work (1991). Mirror of the divergence region, length f = 123 µm (design). The focal plane at its end is perpendicular to the axis; a wavelength shift moves the focus along it by d(Δβ) = f Θ(Δβ) (Eq. (1)) and slightly along the axis by the aberration a(Δβ) (Eq. (2)). Lateral outline not printed: drawn as the sector the fan spans.'
  quote: The most important physical properties of the demultiplexer are the dispersive lateral focal displacement d(Δβ), the aberration a(Δβ) (shown in the enlargement of the focal plane in Fig. 1), and the insertion loss L_{max} of the outer channels.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 col. 2, Eq. (1); p.311 Eq. (2); Table I (p.312)'
  material: Al₂O₃ film, no lateral guiding
  look: {color: '#d8e2ea', opacity: 0.2, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: sector, frame: plan_um_1991, apex: [1216.7, -859.8], axis: [-0.0192, 0.9998], radius_um: 123, half_angle_deg: 13.97, note: 'apex = focal point on the axis; focal plane through the apex along (0.9998, 0.0192)'}
  dims:
  - {label: 'focal length (design)', value: 123, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  essential: false

- id: later_receivers
  name: receiver waveguides
  role: 'Later design: four receiver guides 5 µm apart in the focal plane.'
  detail: 'Later work (1991). Four 2 µm guides at lateral displacements d = ±2.5 µm (channels 2, 3) and ±7.5 µm (channels 1, 4) from the axis, dispersion angles ±1.16° and ±3.5° (Table I). Each was placed off the focal plane by the computed aberration a = ±1.5 µm (channels 2, 3) and ±4.5 µm (channels 1, 4), Eq. (2), a correction valid for TE only (p.311). The direction of these offsets is not resolved in the schematic Fig. 1: receivers drawn ending on the focal plane, offsets in hover only. Channel 1 (shortest wavelength) is drawn on the outer-arc side and channel 4 on the inner side: derived from the phase (longer guides outside), agreeing with the channel labels of the schematic Fig. 1; also the order at the cleaved face, bent reference next to channel 1 (Fig. 1, Fig. 6). Routes to the cleaved end face are not printed: drawn as short stubs that fade out. The four guides span about 17 µm.'
  quote: A receiver-waveguide spacing of 5 µm and a number N_{p} = 31 array waveguide should be sufficient for a channel isolation better than -45 dB.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 2; Fig. 1 (p.311); Table I (p.312)'
  material: Al₂O₃ embedded ridge guides
  look: {color: '#d8e2ea', opacity: 0.95, metal: 0.0, rough: 0.4, emissive: ''}
  geometry: {type: guide_stubs, frame: plan_um_1991, focal_point: [1216.7, -859.8], focal_plane_dir: [0.9998, 0.0192], lateral_um: {channel_1: 7.5, channel_2: 2.5, channel_3: -2.5, channel_4: -7.5}, direction: [0.0192, -0.9998], drawn_length_um: 200, width_um: 2, note: '+ lateral = away from x = 0 (outer-arc side, derived); stubs start on the focal plane, aberration offsets not drawn, length illustrative'}
  dims:
  - {label: receivers, value: 4, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.310 abstract'}
  - {label: receiver spacing d, value: 5, unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 2'}
  - {label: 'displacement channels 1, 4 / 2, 3', value: '±7.5 / ±2.5', unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)'}
  - {label: 'aberration offset channels 1, 4 / 2, 3', value: '±4.5 / ±1.5', unit: 'µm', basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)', note: 'TE design; direction not resolved, not drawn'}
  - {label: design crosstalk, value: '< -45', unit: dB, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, Table I (p.312)', note: 'simulation with aberration and truncation: about -40 dB (p.312)'}
  essential: true

- id: later_light
  name: AlGaAs laser light
  role: 'Later design: near-infrared light near 780 nm; drawn colour illustrative.'
  detail: 'Later work (1991). A single-mode AlGaAs laser, thermally tunable between 775 and 785 nm (0.25 nm/K with a Peltier module), fixed the design wavelength at 780 nm (p.311-312). The light is near infrared, so the drawn colour is illustrative. It diverges from the transmitter, runs through all 31 guides, and converges on the receiver of its wavelength; the output at the cleaved end face was imaged onto a CCD camera (Fig. 5, Fig. 6, p.313). In the four-receivers chapter (Table II, the default plot) the focus moves across the receivers as the wavelength changes: at each printed wavelength it sits on that row''s receiver and every receiver glows by its measured power; between printed wavelengths its position follows the derived linear dispersion. On the Fig. 6 toggle (778.1 nm) receiver 2 is lit. The spread of light over the fan and the array is drawn with an illustrative Gaussian-like taper.'
  quote: A single-mode AlGaAs laser, which is thermally tunable between 775-785 nm, was applied to measure the device, thus fixing the design central wavelength at λ_{0} = 780 nm.
  locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 1-2; p.312 col. 2'
  material: ''
  look: {color: '#ff3b2f', opacity: 0.85, metal: 0.0, rough: 1.0, emissive: '#ff3b2f'}
  geometry: {type: light_path, frame: plan_um_1991, from: later_transmitter, through: [later_divergence, later_fan_out, later_adapters, later_concentric, later_fan_in, later_convergence], to: later_receivers, note: 'colour illustrative (near infrared); spread over the fan and array illustrative (Gaussian-like taper); in the plot chapter the focus follows the Table II pen across the receivers (derived dispersion between printed wavelengths), receiver 2 held on the Fig. 6 toggle'}
  dims:
  - {label: laser tuning range, value: '775-785', unit: nm, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.311 col. 1'}
  - {label: tuning coefficient, value: 0.25, unit: nm/K, basis: stated, locator: 'Vellekoop and Smit, J. Lightwave Technol. 1991, p.312 col. 2'}
  essential: false

