chapters:
- id: arrays
  p: [0.0, 0.0893]
  keyword: Five arrays
  line: Al_{2}O_{3} ridge guides on a silicon substrate.
  action: 'plan view from above: silicon stand-in, five pale sector-shaped arrays in a column at the measured pitch (Fig. 3 white areas); the zoom toward the second from the top opens the bends chapter, so the chapter ends on all five'
  parts: [substrate, other_arrays, array]
  labels: []
- id: bends
  p: [0.0893, 0.2143]
  keyword: Concentric bends
  line: 31 guides bend around one shared centre.
  action: 'other arrays fade; the 31 arcs draw in one by one from the input plane to the output plane at true scale (radii 910-1090 µm, 3 µm wide, drawn equidistant at 6 µm); input and output planes appear as dash-dot radial lines'
  parts: [array, input_plane, output_plane]
  labels: [array]
- id: lengths
  p: [0.2143, 0.3214]
  keyword: Longer outside
  line: Same sector angle, so path length grows with radius.
  action: 'sector-angle arc appears at the centre of curvature; innermost and outermost guides highlight in turn to show length ψR_{i} growing linearly with radius'
  parts: [sector, array]
  labels: [sector]
- id: phase
  p: [0.3214, 0.4286]
  keyword: Phased array
  line: Radii set so phases align; a quadratic profile focuses.
  action: 'small phase ticks (one per guide) appear at the output plane: first aligned (Eq. (2)), then bending into a shallow parabola (Eq. (3), quadratic Φ); no numbers; true radii stay drawn equidistant (hover says why)'
  parts: [array, output_plane]
  labels: []
- id: beam
  p: [0.4286, 0.5357]
  keyword: Broad beam
  line: A wide He-Ne beam lights the guides; some runs straight on.
  action: 'red Gaussian band enters from the left across the whole input plane; light runs along the arcs from input to output plane; a faint part continues straight on past the array (uncoupled light)'
  parts: [he_ne_beam, straight_light, array, input_plane]
  labels: []
- id: focus
  p: [0.5357, 0.6607]
  keyword: "*1 mm* focus"
  line: Beams converge on the focal plane, in several orders.
  action: 'light leaves each guide perpendicular to the output plane and converges across the free region onto the dashed focal plane; the central focus brightens, with fainter neighbouring orders 66 µm to each side (count illustrative)'
  parts: [free_region, focal_plane, foci]
  labels: [focal_plane]
- id: dispersion
  p: [0.6607, 0.7768]
  keyword: Wavelength moves focus
  line: A wavelength shift tilts the wavefront; the focus slides sideways.
  action: 'model frames left, plot assembles right; wavefront lines at the output plane tilt (Fig. 2) and the central focus slides along the focal plane in step with the plot pen (position from the plotted point, exaggerated on the model and labelled so in hover), focal length unchanged; longer wavelength toward the inner (smaller-radius) side; never beyond ±1 %'
  parts: [wavefront, foci, focal_plane]
  plot: dispersion
  labels: []
- id: later_fans
  p: [0.7768, 0.8884]
  keyword: Fan-in, fan-out
  line: 'Later design: fans join the input and receiver guides to the array.'
  action: 'later work, labelled in the line, hover and panel: the 1988 sector and its foci fade; the 1991 plan (frame plan_um_1991, true scale, about 2.8 × 2.3 mm) draws in left to right: transmitter stub, divergence region, fan-out (31 straight guides), plain adapter band (no guides), 31 concentric arcs over the top, adapter band, fan-in, convergence region, four receiver stubs; then light (illustrative colour, near infrared) leaves the transmitter, spreads over the fan, runs through all guides and converges at the focal point; no chip outline, no reference channels, no access-guide routes'
  parts: [later_layout, later_transmitter, later_divergence, later_fan_out, later_adapters, later_concentric, later_fan_in, later_convergence, later_receivers, later_light]
  labels: [later_fan_out, later_concentric]
  parts_hidden: [substrate, other_arrays, array, input_plane, output_plane, sector, he_ne_beam, straight_light, free_region, focal_plane, foci, wavefront]
- id: later_channels
  p: [0.8884, 1.0]
  keyword: Four receivers
  line: 'Later design: the focus moves across four receivers as the wavelength changes.'
  action: 'model frames left (a true-scale close-up of the convergence region and the four receivers 5 µm apart), plot assembles right. Main plot Table II TE (D1043): as the pen reaches each printed wavelength (that row''s own-channel point) the focus sits on the receiver Table II assigns; between printed wavelengths it moves linearly by the derived dispersion (5 µm receiver pitch per channel step); all four receivers glow by the current row''s printed powers (dB to power ratio), changing only at printed wavelengths. TM toggle: the same with the TM rows. Fig. 6 toggle (778.1 nm, TE): focus held on receiver 2, lit at the scan''s own level; the scan x is not mapped onto the model'
  plot: later_channels_te
  parts: [later_receivers, later_convergence, later_light]
  labels: [later_receivers]
  parts_hidden: [substrate, other_arrays, array, input_plane, output_plane, sector, he_ne_beam, straight_light, free_region, focal_plane, foci, wavefront]

