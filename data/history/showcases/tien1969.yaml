  keyword: Rutile prism
  line: A high-index prism hangs over the film.
  action: 'the symmetric rutile prism (Fig. 1 outline with short end faces) descends to a hover position above the film; base angle α marked'
  parts: [prism]
  labels: [prism]
- id: press
  p: [0.25, 0.35]
  keyword: Pressed close
  line: Pressure from below closes the gap to about half a wavelength.
  action: 'the pointed pressure tool rises under the substrate and pushes substrate and film up toward the prism base; the gap shrinks to its final (drawn enlarged) width; the prism stays still (the paper presses the film, it does not lower the prism)'
  parts: [pressure_tool, gap, film, substrate]
  labels: [gap]
- id: reflect
  p: [0.35, 0.45]
  keyword: Total reflection
  line: Polarized laser light reflects off the base onto a screen.
  action: 'polarizer and unlabelled optic fade in; red incident beam enters the left face, meets the base under the apex at θ_{3} (as drawn), totally reflects through the right face to the tilted screen; bright B_{3} spot on the screen; no light in the film (not synchronous)'
  parts: [polarizer, optic, beam_in, beam_reflected, screen]
  labels: []
- id: tunnel
  p: [0.45, 0.57]
  keyword: Optical *tunneling*
  line: At the synchronous angle, light crosses the gap into one mode.
  action: 'the prism, film, substrate, tool and screen turn together (turntable, laser fixed) by a small schematic angle; at the synchronous angle the B_{3} spot dims and a dark line crosses it, the film near the coupling spot glows, and light runs in +x in the film, rising over the illuminated base and fading beyond it (Eq. (6), (7), no numbers)'
  parts: [guided_mode, beam_in, beam_reflected, gap, screen]
  labels: []
- id: mlines
  p: [0.57, 0.67]
  keyword: m lines
  line: Scattered light displays the film's modes as bright lines.
  action: 'out-coupled rays fan from the coupling spot through the right face to the screen; the face-on screen view (Fig. 1 inset) lights: five bright lines, one through the B_{3} spot with its dark line, the outer three curved'
  parts: [m_lines, screen, beam_reflected]
  labels: []
- id: modes
  p: [0.67, 0.85]
  keyword: Mode spectrum
  line: Measured mode indices match theory for a zinc oxide film.
  action: 'model frames in the left half (assembly at the synchronous angle, m lines lit); plot assembles right: Table I β/k vs mode order, observed points over computed points, substrate index as a dashed floor; alternates for 4880 Å and for the observed minus computed differences'
  parts: [m_lines, film]
  plot: modes
  labels: []
- id: free
  p: [0.85, 1.0]
  keyword: Half prism
  line: Cut in half, the prism lets the guided mode run free.
  action: 'the right half of the prism slides away (cut along the symmetry plane through the apex); the beam now enters the remaining hypotenuse face and couples in up to the 90° corner (x = L); beyond it the mode runs on as a bright streak about 1 cm long (two prism heights); a fine scratch across the film ends the streak sharply and glows'
  parts: [half_prism, streak, film, beam_in]
  labels: [streak]

