# Showcase spec: prism-film coupler (tien1969). Schema: DevLog-017 section 4a, runtime fields in
# app/src/lib/history/showcase/types.ts. Research 2026-11-11 (report: tien1969.report.txt).
# Technical source: Tien, Ulrich, Martin, Appl. Phys. Lett. 14(9), 291-294 (1969-05-01), licensed, local only.
# Same-work patent (public domain, traced drawing): P. K. Tien, US 3,584,230, filed 1969-01-24, granted 1971-06-08.
# Page locators are journal pages (p.291 = text.md page 2 ... p.294 = text.md page 5), two columns per page.
# The 2.5D model is a side view after the paper's Fig. 1 (p.291), a schematic without scale. Geometry below is in
# the drawing's own pixel units ("fig1_px" = crop (1270, 1300)-(2080, 1960) of references/tien1969/figures/img_p02_1.png,
# x right, y down); only printed values carry physical units. Film and gap thicknesses are drawn enlarged.
id: tien1969
title: Prism-film coupler
title_note: 'The paper calls the coupler "a novel prism-film coupler" (Tien et al., Appl. Phys. Lett. 1969, p.291 abstract) and makes no "first" claim. The same arrangement is the subject of P. K. Tien, US 3,584,230 "Light wave coupling into thin films" (Bell Telephone Laboratories, filed 1969-01-24); its FIG. 1 is the traced drawing beside the model. The model follows the paper''s Fig. 1, not the patent drawing.'
tagline: A rutile prism tunnels laser light into a deposited thin film.
renderer: 2.5d
height: 9

parts:
- id: substrate
  name: glass substrate
  role: Carries the film; its elasticity lets pressure set the gap.
  detail: 'Both ZnO and ZnS films were "deposited on glass" (p.292 col. 2). For the ZnO film of Table I the substrate index is n_{0} = 1.5127 at 6328 Å and 1.5206 at 4880 Å. The film is pressed against the prism base from below; "residual dust particles, serving as spacers, and the elasticity of the substrate permit adjustment of S by variation of the pressure" (p.293 col. 1). Glass type, size and thickness are not given.'
  quote: Both ZnO and ZnS films, deposited on glass, have been used for the experiments.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.292 col. 2; Table I caption (p.293)
  material: glass (type not stated)
  look: {color: '#cfd8dc', opacity: 0.45, metal: 0.0, rough: 0.3, emissive: ''}
  geometry: {type: slab_side, frame: fig1_px, rect: [52, 522, 535, 563], drawn: 'stippled band below the film in Fig. 1; length and thickness not stated (stand-in)'}
  dims:
  - {label: 'index n_{0} at 6328 Å', value: 1.5127, basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Table I caption (p.293)', note: substrate of the Table I ZnO film}
  - {label: 'index n_{0} at 4880 Å', value: 1.5206, basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Table I caption (p.293)', note: substrate of the Table I ZnO film}
  essential: false

- id: film
  name: ZnO or ZnS film
  role: Thin deposited film that guides the light; drawn far thicker than to scale.
  detail: 'Sputtered ZnO films (argon-oxygen atmosphere, sintered ZnO powder target; crystallite c axes within a 5° cone of the film normal; polished after growth) and ZnS films evaporated by electron bombardment (not oriented), 800 to 30 000 Å thick (p.291 col. 1; p.292 col. 2 to p.293 col. 1). Guiding needs n_{1} > n_{0} and n_{1} > n_{2} (p.292 col. 1). The ZnO film of Table I: thickness W = 15 881 ± 60 Å and n_{1} fitted to the measured modes, n_{1} = 1.973 ± 0.001 at 6328 Å (TE, ordinary ray), slightly below the 1.988 interpolated from Bond''s bulk ZnO data (p.294 col. 1). The film of the half-prism experiment is ZnS, 1500 Å thick (Fig. 2 caption). Drawn many times thicker than to scale.'
  quote: In our experiments, we used sputtered films of ZnO and films of ZnS evaporated by electron bombardment. The films used range from 800 to 30 000 Å thick.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.291 col. 1; p.293 col. 1; p.294 col. 1; Table I (p.293)
  material: ZnO (rf-sputtered) or ZnS (electron-beam evaporated)
  look: {color: '#e6c86e', opacity: 0.85, metal: 0.0, rough: 0.35, emissive: ''}
  geometry: {type: band_side, frame: fig1_px, rect: [52, 509.5, 535, 521.5], drawn: 'hatched band in Fig. 1, drawn enlarged (not to scale)'}
  dims:
  - {label: thickness range, value: '800 to 30 000', unit: 'Å', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.291 col. 1'}
  - {label: 'thickness W (ZnO film of Table I)', value: '15 881 ± 60', unit: 'Å', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Table I caption (p.293); p.294 col. 1', note: 'fitted to the 6 lowest TE modes at 6328 Å, together with n_{1}'}
  - {label: 'index n_{1}, TE / TM at 6328 Å', value: '1.9732 / 1.9779', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Table I (p.293)', note: 'fitted per group; text: 1.973 ± 0.001 (TE)'}
  - {label: 'index n_{1}, TE / TM at 4880 Å', value: '2.0428 / 2.0485', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Table I (p.293)', note: fitted per group}
  - {label: 'thickness (ZnS film, half-prism experiment)', value: 1500, unit: 'Å', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Fig. 2 caption (p.294)'}
  essential: false

- id: prism
  name: rutile prism
  role: High-index prism; its totally reflected beam couples into the film.
  detail: 'Rutile, base angle α = 26°, optical axis parallel to the y axis of Fig. 1, so light coupling to TM modes of the film runs as the ordinary ray in the prism and light coupling to TE modes as the extraordinary ray (p.293 col. 1). The prism index must exceed β/k (p.292 col. 1); the rutile indices are not printed. Height 0.5 cm (Fig. 2 caption, for the half prism cut from this prism along its plane of symmetry, which keeps the height). Fig. 1 draws a symmetric prism with short vertical end faces at the base; base length and end-face height are not stated (drawn from Fig. 1 proportions). Some low-order modes "could not be observed with the 26° rutile prism" (Table I footnote).'
  quote: The coupling prism was of rutile, α = 26°, optical axis parallel to the y axis of Fig. 1.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1; Fig. 1 (p.291); Fig. 2 caption (p.294)
  material: rutile (TiO_{2})
  look: {color: '#bfe3f2', opacity: 0.35, metal: 0.0, rough: 0.05, emissive: ''}
  geometry:
    type: polygon_side
    frame: fig1_px
    outline: [[154, 500], [154, 478], [320, 391], [491, 477], [491, 500]]
    base_y: 499.5
    apex: [320, 391]
    note: 'Fig. 1 outline: base x 153-491, short vertical end faces (about 22 px of the 109 px height), apex above the coupling spot. Drawn slopes measure 27.7° (left) and 26.7° (right); the model uses the printed α = 26° with height 5 mm (0.5 cm) and an end-face height of about 1 mm (assumed, Fig. 1 proportion 22/109)'
  dims:
  - {label: base angle α, value: 26, unit: '°', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1; Table I footnote', essential: true, label_short: 'α'}
  - {label: height, value: 0.5, unit: cm, basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Fig. 2 caption (p.294)', essential: true, label_short: height, note: 'printed for the half prism of Fig. 2, cut from this prism along its plane of symmetry (p.294 col. 2)'}
  - {label: optical axis, value: 'parallel to y (normal to the plane of Fig. 1)', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1'}
  - {label: end-face height (drawn), value: '≈ 1', unit: mm, basis: assumed, locator: 'Fig. 1 proportion 22 px / 109 px applied to the 0.5 cm height', note: 'drawing value only; not stated'}
  essential: true

- id: gap
  name: gap S
  role: Air gap about λ/2 that light tunnels across; drawn far wider than to scale.
  detail: 'The film is "placed at a close distance S parallel to the prism base"; the evanescent fields excited in the gap by the total reflection carry the light across ("optical tunneling"). Coupling condition (3): "The film must be placed close enough to the prism base. Typically, S is in the order of half a wavelength." Dust particles act as spacers and S is adjusted by the pressure (p.293 col. 1). The paper gives no gap index; the Table I theory column is reproduced to 0.0001 by Eq. (5) with an air cover n_{2} = 1 (evaluated for this story; the patent states gap index 1 for its FIG. 1). Drawn far wider than to scale.'
  quote: Typically, S is in the order of half a wavelength.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.291 col. 1-2; p.293 col. 1
  material: air (dust particles as spacers)
  look: {color: '#a8a69d', opacity: 0.0, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: gap_side, frame: fig1_px, between: [499.5, 509.5], x: [153, 491], drawn: 'drawn about 10 px; real gap about λ/2 (not to scale)'}
  dims:
  - {label: gap S, value: '≈ λ/2', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.291 col. 2 ("in the order of half a wavelength")', essential: true, label_short: S}
  - {label: 'gap index n_{2}', value: '1 (air)', basis: derived, locator: 'Eq. (5) (Tien et al., Appl. Phys. Lett. 1969, p.292) with n_{2} = 1 reproduces every Table I theory value (p.293) to 0.0001 (checked for this story)', note: 'not printed in the paper'}
  essential: true

- id: pressure_tool
  name: pressure tool
  role: Presses the film against the prism base from below.
  detail: 'Fig. 1 labels "ADJUSTABLE PRESSURE" under the substrate (a pointed shape with upward arrows). "The film is pressed with adjustable pressure against the prism base (Fig. 1)." In the half-prism experiment the film "is pressed against the prism base by a pointed tool" (p.294 col. 2). Force, tool material and mechanism are not given: drawn as a plain pointed stand-in.'
  quote: The film is pressed with adjustable pressure against the prism base (Fig. 1).
  locator: Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1; Fig. 1 (p.291); p.294 col. 2
  material: not stated
  look: {color: '#6b6b66', opacity: 1.0, metal: 0.3, rough: 0.6, emissive: ''}
  geometry: {type: pointed_stand_in, frame: fig1_px, rect: [300, 560, 338, 648], tip: [320, 560], arrows_x: [283, 357], note: 'tip under the coupling spot, as drawn'}
  essential: false

- id: polarizer
  name: polarizer
  role: Sets TE or TM polarization of the incident beam.
  detail: 'Labelled in Fig. 1 across the incident beam. The modes have a distinct polarization (TM or TE) and the incident beam "must have the same polarization as the mode to be excited" (coupling condition (2), p.291 col. 2). The text speaks of "the linear polarized laser beam" (p.293 col. 1). Type not given.'
  quote: As the modes of the film have a distinct polarization (TM or TE) the incident beam must have the same polarization as the mode to be excited.
  locator: Tien et al., Appl. Phys. Lett. 1969, Fig. 1 (p.291); p.291 col. 2
  material: not stated
  look: {color: '#9aa4ad', opacity: 0.8, metal: 0.0, rough: 0.5, emissive: ''}
  geometry: {type: thin_disc_edge, frame: fig1_px, from: [88, 341], to: [64, 420]}
  essential: false

- id: optic
  name: unlabelled optic
  role: Biconvex outline after the polarizer; not named in the paper.
  detail: 'Fig. 1 draws a biconvex outline in the incident beam just after the polarizer; the beam narrows toward the prism after it. Neither the figure nor the text names it. The text states only that the aperture of the incident beam is "about 1° (inside the prism)" (p.293 col. 2). Drawn as an outline only.'
  locator: Tien et al., Appl. Phys. Lett. 1969, Fig. 1 (p.291), unlabelled
  material: not stated
  look: {color: '#9aa4ad', opacity: 0.5, metal: 0.0, rough: 0.5, emissive: ''}
  geometry: {type: biconvex_outline, frame: fig1_px, top: [120, 350], bottom: [97, 418]}
  essential: false

- id: beam_in
  name: incident laser beam
  role: Linearly polarized; meets the prism base at angle θ_{3}.
  detail: '"A laser beam enters a prism of sufficiently high refractive index n_{3}. It reaches the base of the prism at an angle of incidence θ_{3} and is totally reflected" (p.291 col. 1). Its component of the propagation vector parallel to the film is k n_{3} sin θ_{3}; θ_{3} is synchronous for a mode when β = k n_{3} sin θ_{3} (p.291 col. 2 - p.292 col. 1). Wavelengths used: 6328 Å and 4880 Å (Table I; 6328 Å in Fig. 2). The laser type and power are not stated. The refraction at the entrance face is taken into account in the β measurements (p.293 col. 2). Aperture about 1° inside the prism. Drawn red; θ_{3} as drawn in Fig. 1 (about 42°), not a computed synchronous angle.'
  quote: A laser beam enters a prism of sufficiently high refractive index n_{3}. It reaches the base of the prism at an angle of incidence θ_{3} and is totally reflected.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.291 col. 1; p.293 col. 2; Table I (p.293)
  material: ''
  look: {color: '#ff3b30', opacity: 0.85, metal: 0.0, rough: 1.0, emissive: '#ff3b30'}
  geometry:
    type: beam_side
    frame: fig1_px
    outside: {from_band: [[45, 358], [45, 382]], to: [253, 424], note: 'converging band through the polarizer and the unlabelled optic'}
    inside: {from: [253, 424], to: [320, 498]}
    theta3_drawn_deg: 42
    normal: {x: 320, from_y: 400, to_y: 497, dashed: true}
  dims:
  - {label: wavelengths, value: '6328 and 4880', unit: 'Å', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, Table I (p.293); Fig. 2 caption (p.294)'}
  - {label: aperture inside the prism, value: '≈ 1', unit: '°', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.293 col. 2'}
  - {label: 'synchronous condition', value: 'β = k n_{3} sin θ_{3}', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.292 col. 1'}
  essential: false

- id: beam_reflected
  name: reflected beam B_{3}
  role: Totally reflected beam; makes the bright spot on the screen. Its dip is drawn at the deepest reported (50 %).
  detail: '"In the experiment, a bright spot produced by the reflected wave B_{3} is always observed on the screen." At a synchronous direction the spot dims; "this dip, occasionally down to 50%, means that part of the incident light has been fed into the film and was then lost by absorption or scattering before it could be coupled back into the prism again" (p.293 col. 1). A dark line appears in the spot: the mode accepts only a small part of the beam''s 1° range of θ_{3} (p.293 col. 2).'
  quote: In the experiment, a bright spot produced by the reflected wave B_{3} is always observed on the screen.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1-2
  material: ''
  look: {color: '#ff3b30', opacity: 0.7, metal: 0.0, rough: 1.0, emissive: '#ff3b30'}
  geometry: {type: beam_side, frame: fig1_px, from: [320, 498], exit_face: right, screen_hit: [585, 368], note: 'stippled band widening to the screen, as drawn'}
  dims:
  - {label: spot dip at a synchronous angle, value: 'occasionally down to 50', unit: '%', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1'}
  essential: false

- id: guided_mode
  name: guided mode
  role: Light fed into one mode of the film; travels in +x.
  detail: 'At a synchronous angle the beam "excites in the film a mode of order m. This mode propagates in the positive x direction" (p.293 col. 1); "a small area of the film near the coupling spot appears very bright" (scattering into the substrate). Theory (Eq. (6), (7), p.292 col. 2): for a beam illuminating the base uniformly from x = 0 to x = L the power in the film builds up from x = 0 toward 4 t_{1}^{-2} |A_{3}|^{2}, then decays beyond x = L where the prism acts as an output coupler; at most about 81 % of the incident power can be transferred (by choice of S or L). Measured: "Up to 50 % of the incident laser energy has been fed into a single mode of propagation" (abstract). The glow profile is drawn after Eq. (6), (7) without numbers.'
  quote: Up to 50 % of the incident laser energy has been fed into a single mode of propagation.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.291 abstract; p.292 col. 2; p.293 col. 1
  material: ''
  look: {color: '#ff5a4f', opacity: 0.9, metal: 0.0, rough: 1.0, emissive: '#ff3b30'}
  geometry: {type: film_glow, frame: fig1_px, start_x: 320, direction: '+x', note: 'bright near the coupling spot; rises over the illuminated base length and decays beyond it under the full prism (Eq. (6), (7)); illuminated length L not stated'}
  dims:
  - {label: fed into one mode (measured), value: 'up to 50', unit: '%', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.291 abstract'}
  - {label: theoretical maximum (uniform illumination), value: '≈ 81', unit: '%', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.292 col. 2'}
  - {label: 'finesse F (one case)', value: '≈ 50', basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.293 col. 2', note: 'F = π / t_{1}^{2}, so t_{1}^{2} = 0.06'}
  essential: false

- id: screen
  name: screen
  role: Shows the B_{3} spot and the m lines; turns with the prism.
  detail: 'The reflected light is observed on a screen (Fig. 1). "The whole prism-film assembly, including the screen but not the laser, is mounted on a turntable so that the direction θ_{3} can be varied at will" (p.293 col. 1). Fig. 1 draws the screen edge-on at the right and, above it, a face-on view: a dark field with the bright B_{3} spot crossed by a dark line, and bright lines. Distance, size and material are not given.'
  quote: As shown in Fig. 1, the reflected light is observed on a screen.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1; Fig. 1 (p.291)
  material: not stated
  look: {color: '#d9d6cc', opacity: 0.9, metal: 0.0, rough: 0.8, emissive: ''}
  geometry:
    type: screen_side
    frame: fig1_px
    edge_on: {from: [518, 296], to: [776, 553], thickness_px: 6}
    face_on_inset: {rect: [523, 72, 788, 190], note: 'black field as drawn; dashed projection lines at x 548, 585, 636, 682, 748 connect it to the edge-on screen'}
  essential: false

- id: m_lines
  name: m lines
  role: Bright lines on the screen, one per mode order; schematic, as Fig. 1 draws them.
  detail: 'At a synchronous angle "we observe one or more (depending on the film thickness) bright lines on the screen (Fig. 1). One of these lines always intersects the bright B_{3} spot. These lines will be called m lines" (p.293 col. 1). Light scattered into modes azimuthally degenerate with the excited one is coupled out by the same prism and forms the line through the spot; intermode scattering into other orders forms the other lines: "The m lines are therefore a direct display of the spectrum of the film modes" (p.293 col. 1-2). With increasing coupling the lines first brighten, then broaden and shift. Drawn as in the Fig. 1 face-on view (five lines, the outer three curved), a schematic not tied to a particular film; the ZnO film of Table I has seven TE modes at 6328 Å.'
  quote: The m lines are therefore a direct display of the spectrum of the film modes.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.293 col. 1-2; Fig. 1 (p.291)
  material: ''
  look: {color: '#ff5a4f', opacity: 1.0, metal: 0.0, rough: 1.0, emissive: '#ff3b30'}
  geometry:
    type: screen_pattern
    frame: fig1_px
    lines_x: [548, 587, 638, 682, 748]
    curved: [638, 682, 748]
    spot: {center: [587, 137], r: 16, dark_line_x: 587}
    rays_to_edge_on_screen: [[545, 333], [585, 368], [630, 418], [673, 470], [740, 527]]
    note: 'as drawn in the Fig. 1 face-on inset; schematic positions; the line through the spot is the second from the left'
  essential: false

- id: half_prism
  name: half prism
  role: Prism cut at its symmetry plane; the 90° corner ends coupling.
  detail: '"We cut the prism of Fig. 1 along its plane of symmetry and removed the right half-prism. The laser beam is adjusted so that the 90° corner plays the role of the point x = L discussed in the theory" (p.294 col. 2). Beyond the corner nothing couples the light back out, so the mode propagates freely in the film. Fig. 2 photographs this arrangement through the substrate (ZnS film 1500 Å, 6328 Å, prism height 0.5 cm). The authors also used two such 90° prisms, one as input and one as output coupler, 3 mm apart; an m line again appeared on the output screen (p.294 col. 2).'
  quote: For this purpose we cut the prism of Fig. 1 along its plane of symmetry and removed the right half-prism.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.294 col. 2; Fig. 2 caption (p.294)
  material: rutile (TiO_{2})
  look: {color: '#bfe3f2', opacity: 0.35, metal: 0.0, rough: 0.05, emissive: ''}
  geometry: {type: polygon_side, frame: fig1_px, outline: [[154, 500], [154, 478], [320, 391], [320, 500]], note: 'left half of the prism outline; 90° corner at (320, 500)'}
  dims:
  - {label: 'two-prism experiment, spacing', value: 3, unit: mm, basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.294 col. 2'}
  essential: false

- id: streak
  name: guided streak
  role: Light scattered from the freely propagating mode; about 1 cm.
  detail: 'Set to the synchronous direction of the single-mode ZnS film, "a bright streak of light is seen extending from the coupling spot toward the lower right. The streak is about 1 cm long and consists of light scattered from the propagating mode, much like a laser beam is visible in dusty air" (p.294 col. 2). In the side view it runs in +x along the film from the 90° corner. "When the continuity of the film is interrupted by scratching across the streak with a fine point, the streak ends sharply at the scratch and the scratch itself radiates brightly" (p.294 col. 2). The scratch position is not stated (drawn at an assumed place along the streak).'
  quote: The streak is about 1 cm long and consists of light scattered from the propagating mode, much like a laser beam is visible in dusty air.
  locator: Tien et al., Appl. Phys. Lett. 1969, p.294 col. 2; Fig. 2 (p.294)
  material: ''
  look: {color: '#ff5a4f', opacity: 0.9, metal: 0.0, rough: 1.0, emissive: '#ff3b30'}
  geometry: {type: film_glow, frame: fig1_px, from_x: 320, length: 'about 2 prism heights (1 cm vs 0.5 cm, both stated)', scratch: 'assumed position along the streak'}
  dims:
  - {label: length, value: '≈ 1', unit: cm, basis: stated, locator: 'Tien et al., Appl. Phys. Lett. 1969, p.294 col. 2', essential: true, label_short: length}
  essential: true

