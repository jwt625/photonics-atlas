withheld:
- {what: "Synchronous angles θ_{3} of the modes", reason: "The paper prints β/k (Table I), not angles; θ_{3} = arcsin(β/(k n_{3})) needs the rutile indices, which it does not print. The beam is drawn at the Fig. 1 angle (about 42°) and the turntable rotation is schematic"}
- {what: "Laser type, power, beam diameter", reason: "Not stated; only the wavelengths 6328 Å and 4880 Å, linear polarization and an aperture of about 1° inside the prism"}
- {what: "Identity of the biconvex element after the polarizer", reason: "Drawn in Fig. 1 without a label and not mentioned in the text; shown as an outline only"}
- {what: "Rutile prism indices, base length, end-face height, width in y", reason: "Not printed; the outline follows Fig. 1 with the printed α = 26° and 0.5 cm height, end-face height assumed from the drawing"}
- {what: "Gap value at each setting, dust particle size, pressing force", reason: "Only 'in the order of half a wavelength' and the adjustment by pressure; the gap is drawn enlarged"}
- {what: "Turntable", reason: "Only its function is stated (prism, film and screen turn together, laser fixed); not drawn, shown as a rotation of the assembly about an axis normal to the drawing (the axis needed to change θ_{3}; orientation not stated)"}
- {what: "Number and positions of the m lines for a given film", reason: "The Fig. 1 face-on view is a schematic not tied to a film or wavelength; it is reproduced as drawn (five lines). The Table I film carries seven TE modes at 6328 Å"}
- {what: "Illuminated length L and the buildup length in the film", reason: "Not stated for the experiments; the Eq. (6), (7) glow is drawn without numbers"}
- {what: "Screen distance, size and material", reason: "Not given"}
- {what: "Film and substrate lateral size, glass type, substrate thickness", reason: "Not given; slab and film are stand-ins with drawn (not to scale) thicknesses"}
- {what: "Propagation loss of the films, ZnS film index", reason: "Not given"}
- {what: "Scratch position in the half-prism experiment; layout of the two-prism experiment beyond the 3 mm spacing", reason: "Not stated; the scratch is placed at an assumed point along the streak"}
- {what: "Path of the totally reflected beam in the half-prism experiment", reason: "Not described; Fig. 2 shows only the streak. Drawn up to the cut face of the half prism"}
- {what: "Fig. 2 photograph", reason: "Licensed figure; not shown. Its caption values (ZnS 1500 Å, 6328 Å, prism height 0.5 cm, viewed through the substrate) are used"}

