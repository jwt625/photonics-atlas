  p: [0.0, 0.07]
  keyword: Glass substrate
  line: A glass plate to carry a thin film.
  action: 'side view after Fig. 1; the stippled glass slab slides in'
  parts: [substrate]
  labels: []
- id: film
  p: [0.07, 0.16]
  keyword: Deposited film
  line: Sputtered zinc oxide or evaporated zinc sulfide on the glass.
  action: 'the film grows on the slab as a thin hatched band (drawn enlarged); hover gives the 800 to 30 000 Å range'
  parts: [film, substrate]
