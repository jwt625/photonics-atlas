- id: substrate
  p: [0.0, 0.08]
  keyword: Lithium niobate
  line: An electro-optic crystal, C axis normal to the surface.
  action: 'LiNbO3 slab drops in, isometric; a short C-axis arrow rises normal to the surface (Fig. 3a)'
  parts: [substrate]
  labels: []
- id: titanium
  p: [0.08, 0.17]
  keyword: Titanium film
  line: A thin titanium layer is sputtered on.
  action: 'sputter arrows rain down (Fig. 4 row 1); a thin grey Ti layer fades in over the whole surface; height exaggerated, schematic'
