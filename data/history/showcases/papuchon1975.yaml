# Showcase spec: Cobra electro-optic directional-coupler switch (papuchon1975). Schema: DevLog-017 section 4a,
# runtime fields in app/src/lib/history/showcase/types.ts. Research 2026-11-11 (report: papuchon1975.report.txt).
# Sole technical source: Papuchon et al., Appl. Phys. Lett. 27(5), 289-291 (1975-09-01), licensed, local only.
# Page / column locators: p.289 = first journal page (two columns), p.290 = figures 3-6 and text, p.291 col. 1 = results.
# Plan view (Fig. 5) and cross-section (Fig. 3a) are schematic drawings without scale; geometry below is given in the
# drawings' own pixel units (crop origins in the report) and only the printed dimensions carry physical values.
id: papuchon1975
title: Cobra
title_note: 'Name: "Cobra" is the authors'' acronym for "commutateur optique binaire rapide" (literally "fast binary optical switch") (Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 1). The paper calls the electrode configuration "original" and "novel"; it makes no "first" claim.'
tagline: Two electrodes switch light between Ti:LiNbO₃ guides at 6 V.
renderer: 2.5d
height: 8

parts:
- id: substrate
  name: LiNbO₃ substrate
  role: Electro-optic crystal; C axis normal to the guide surface.
  detail: 'Lithium niobate crystal carrying the guides and electrodes. In the Cobra configuration "the crystal C axis is normal to the guide surface" (p.289 col. 2); Fig. 3a draws C vertical and y across the guides, so light runs along x (propagation axis read from the figure axes, not stated in the text). Fig. 3b prints the electro-optic tensor of LiNbO₃. Crystal size, thickness and supplier are not given.'
  quote: In this configuration the crystal C axis is normal to the guide surface
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2; Fig. 3a (p.290)
  material: LiNbO₃
  look: {color: '#d9d3c4', opacity: 0.55, metal: 0.0, rough: 0.4, emissive: ''}
  geometry: {type: slab, plan: 'stand-in rectangle around the Fig. 5 pattern (size not stated)', axes: {c: 'up (normal to surface)', y: 'across the guides', x: 'along the guides (from Fig. 3a axes)'}}
  dims:
  - {label: crystal orientation, value: 'C axis normal to the guide surface', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2'}
  essential: false

- id: ti_film
  name: Ti film
  role: Sputtered titanium layer, later patterned into strips.
  detail: 'About 500 Å of titanium is rf-sputtered on the LiNbO₃ substrate (text); Fig. 4 row 1 labels it "Ti (500 Å)".'
  quote: Approximately 500 Å of Ti is deposited by rf sputtering on the LiNbO₃ substrate.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2; Fig. 4 (p.290)
  material: titanium
  look: {color: '#8c9096', opacity: 0.9, metal: 0.7, rough: 0.4, emissive: ''}
  geometry: {type: layer, plan: substrate, thickness_A: 500, drawn: 'thin layer, height schematic'}
  dims:
  - {label: thickness, value: 500, unit: 'Å', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2 ("Approximately 500 Å"); Fig. 4'}
  essential: false

- id: resist
  name: resist
  role: Photoresist mask exposed to light, then the Ti is ion-etched.
  detail: 'Fig. 4 row 2 shows a resist layer on the Ti film exposed to "light", then "Masking and Ion etching" leaves Ti strips. The text says the Ti "is then masked and etched" (ref. 7, Ostrowsky et al., Appl. Opt. 1974). Resist type and thickness are not given; Fig. 4 draws the etch step slightly into the substrate surface (schematic).'
  quote: This Ti is then masked and etched to obtain the desired guide configuration in the Ti.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2 to p.290 col. 1; Fig. 4 row 2 (p.290)
  material: photoresist (type not stated)
  look: {color: '#b8607e', opacity: 0.5, metal: 0.0, rough: 0.6, emissive: ''}
  geometry: {type: layer, plan: substrate, drawn: 'thin layer over the Ti film, height schematic; removed after etching'}
  essential: false

- id: ti_strips
  name: Ti strips
  role: Patterned titanium, two 2 µm strips 3 µm apart along the coupler.
  detail: 'The etched Ti pattern follows Fig. 5: a wide launching region tapering into one strip, a second strip that bends in from the lower left, the two running parallel over the coupling region, then one bending away and the other tapering into a second wide region. Strip width a = 2 µm and separation b = 3 µm (Fig. 5 caption; "2-µm-wide Ti strips", "3-µm separation (which was actually used in the switching experiment)"). Fig. 5 dimension arrows put a across one strip and b between the facing strip edges (read from the small print).'
  quote: 'Typical coupling lengths L_{0} observed for couplers formed from 2-µm-wide Ti strips were ≈ 500 µm for a 2-µm separation and ≈ 1 mm for a 3-µm separation (which was actually used in the switching experiment).'
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2; Fig. 5 caption (p.290)
  material: titanium
  look: {color: '#8c9096', opacity: 0.95, metal: 0.7, rough: 0.4, emissive: ''}
  geometry: {type: plan_pattern, source: 'Fig. 5 outline (guides + tapers + wide regions), see guide_1 / guide_2 / launch_region / output_region', drawn: 'Fig. 5 proportions, not to scale'}
  dims:
  - {label: strip width (a), value: 2, unit: 'µm', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, Fig. 5 caption "a = 2 µm" (p.290); p.290 col. 2', essential: true, label_short: width}
  - {label: separation (b), value: 3, unit: 'µm', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, Fig. 5 caption "b = 3 µm" (p.290); p.290 col. 2', essential: true, label_short: gap, note: 'edge-to-edge as read from the Fig. 5 arrows; the text says only "separation"'}
  essential: true

- id: guide_1
  name: curved guide
  role: Initially excited guide; bends away at the output end.
  detail: 'Ti-diffused channel guide fed from the launching region (Fig. 5). The paper names it by its output end: "the initially excited guide (curved guide)". Light switched back into this guide at 6 V. Guide model used for the coupling length (Marcatili): same width as the Ti strip, 2 µm thickness, uniform Δn about 5×10⁻³; the authors call this "a rather pragmatic description" (nonuniform profile, lateral Ti diffusion makes the guide wider than the strip).'
  quote: With 6 V applied the guided light has been switched back to the initially excited guide (curved guide).
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.291 col. 1; Fig. 5 (p.290); guide model p.290 col. 1-2
  material: Ti-diffused LiNbO₃
  look: {color: '#7fb6c8', opacity: 0.85, metal: 0.0, rough: 0.3, emissive: ''}
  geometry:
    type: polyline_channel
    frame: fig5_px
    centerline: [[200, 130], [230, 131], [705, 131], [740, 124], [775, 108], [805, 85], [825, 62], [833, 47]]
    drawn_width_px: 15
    note: 'straight from the launch taper to x about 705 px, then a quarter bend up and out of the coupling region; open end at top right (Fig. 5). Bend shape read from the drawing, radius not stated'
  dims:
  - {label: width (model), value: 2, unit: 'µm', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 1 ("same widths as the original Ti strip")', note: model assumption of the authors}
  - {label: thickness (model), value: 2, unit: 'µm', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 1', note: 'model assumption ("a 2-µm thickness"), not a measured depth'}
  - {label: index step (model), value: '5×10⁻³', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 1 ("a uniform Δn of about 5×10⁻³")', note: model assumption}
  essential: false

- id: guide_2
  name: straight guide
  role: Initially unexcited guide; runs straight to the output end.
  detail: 'Ti-diffused channel guide that bends in from the lower left (open end), runs parallel to the curved guide over the coupling region and continues straight into the wide output region (Fig. 5). At 0 V "most of the guided light" leaves through this guide, as expected for a 3 mm coupling region and L_{0} = 1 mm. Same guide model as the curved guide.'
  quote: We note that with 0 V applied most of the guided light is in the initially unexcited guide (straight guide), as would be expected since L_{0} = 1 mm and the actual length of the coupling region is 3 mm.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.291 col. 1; Fig. 5 (p.290)
  material: Ti-diffused LiNbO₃
  look: {color: '#7fb6c8', opacity: 0.85, metal: 0.0, rough: 0.3, emissive: ''}
  geometry:
    type: polyline_channel
    frame: fig5_px
    centerline: [[196, 250], [199, 229], [207, 210], [215, 199], [230, 183.5], [245, 174], [260, 168], [285, 165], [820, 165]]
    drawn_width_px: 15
    note: 'open end at the bottom left, quarter bend up into the parallel section, straight to the output taper at x about 820 px (Fig. 5). Bend radius not stated'
  essential: false

- id: launch_region
  name: launching region
  role: Wide region where the prism coupler launches light into one guide.
  detail: 'Labelled "Launching region" in Fig. 5: a wide rectangle that tapers into the curved guide. The text says one guide was excited "using a rutile prism coupler". Whether the wide region is itself Ti-diffused is not stated; Fig. 5 draws it as one outline with the guide. Size not stated.'
  quote: Coupler configuration - launching and observation regions are also shown.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, Fig. 5 and caption (p.290)
  material: drawn continuous with the guide (makeup not stated)
  look: {color: '#7fb6c8', opacity: 0.6, metal: 0.0, rough: 0.3, emissive: ''}
  geometry: {type: plan_rect_taper, frame: fig5_px, rect: [17, 92, 168, 169], taper: {from_x: 168, from_y: [100, 160], to_x: 200, to_y: [120, 141]}, note: 'neck 200-230 px then guide_1'}
  essential: false

- id: output_region
  name: wide output region
  role: Unlabelled wide region at the straight guide's output end.
  detail: 'Fig. 5 draws the straight guide tapering into a wide rectangle at the right, mirroring the launching region. It carries no label and the text does not mention it; purpose and size are not stated.'
  locator: Papuchon et al., Appl. Phys. Lett. 1975, Fig. 5 (p.290), unlabelled
  material: drawn continuous with the guide (makeup not stated)
  look: {color: '#7fb6c8', opacity: 0.6, metal: 0.0, rough: 0.3, emissive: ''}
  geometry: {type: plan_rect_taper, frame: fig5_px, rect: [860, 128, 1008, 204], taper: {from_x: 820, from_y: [158, 173], to_x: 860, to_y: [128, 204]}}
  essential: false

- id: coupling_region
  name: coupling region
  role: Parallel section where the guides exchange power; 3 mm long.
  detail: 'Fig. 5 marks the length c = 3 mm with a dashed outline around the parallel section. The text: "the actual length of the coupling region is 3 mm", three coupling lengths for the 3 µm separation (L_{0} about 1 mm). Total switching needs a length that is an odd multiple of L_{0} (p.289 col. 2).'
  quote: Note that total switching can only occur when the coupler length is an odd multiple of L_{0}, i.e., all the energy has been transferred out of the guide initially excited.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 1-2; Fig. 5 caption "c = 3 mm" (p.290); p.291 col. 1
  material: ''
  look: {color: '#a8a69d', opacity: 0.0, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: dashed_outline, frame: fig5_px, rect: [285, 35, 744.5, 263], dim_line_y: 304}
  dims:
  - {label: length (c), value: 3, unit: mm, basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, Fig. 5 caption "c = 3 mm" (p.290); p.291 col. 1', essential: true, label_short: length}
  - {label: 'coupling length L_{0} (3 µm separation)', value: '≈ 1', unit: mm, basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2; p.291 col. 1 ("L_{0} = 1 mm")'}
  - {label: 'coupling length L_{0} (2 µm separation)', value: '≈ 500', unit: 'µm', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2', note: other couplers, not the switch}
  essential: true

- id: electrode_1
  name: electrode over the curved guide
  role: One of two gold electrodes; lies over one guide.
  detail: 'rf-sputtered 2000 Å gold, patterned by optical superposition masking and ion etching into two 1 × 3 mm electrodes separated by 3 µm at the coupler center. Fig. 3a and the last row of Fig. 4 draw each electrode over one guide with the gap above the gap between the guides (Fig. 4 labels the film "Au or Al (2000 Å)"; the text says gold). Under the electrodes the TM modes see about 2 dB/cm extra loss. Which electrode sits over which guide follows from that topology; the paper does not number them. Drawn with the inner edges over the guide inner edges (assumed from the equal printed 3 µm electrode gap and guide separation; Fig. 3a draws one electrode overhanging its guide) and 3 mm long, the length c of the coupling region (printed 1 × 3 mm); drawn width schematic.'
  quote: The electrodes were made by rf sputtering a 2000-Å-thick gold film onto the structure and masking (using a standard optical superposition technique) and ion etching the film to form two 1 × 3-mm electrodes separated by 3 µm at the coupler center.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2; Fig. 3a, Fig. 4 (p.290)
  material: gold (Fig. 4 "Au or Al")
  look: {color: '#d4a640', opacity: 1.0, metal: 0.9, rough: 0.3, emissive: ''}
  geometry: {type: plan_rect, length_of: coupling_region, side: 'outer side of guide_1, inner edge at the electrode gap', drawn: 'length = c along the dashed coupling region (printed 1 × 3 mm); width schematic (printed 1 mm cannot be drawn to the Fig. 5 proportions); inner edge over the guide inner edge (assumed)', thickness_A: 2000}
  dims:
  - {label: size, value: '1 × 3', unit: mm, basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2'}
  - {label: gold thickness, value: 2000, unit: 'Å', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2; Fig. 4'}
  - {label: gap between electrodes, value: 3, unit: 'µm', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2 ("separated by 3 µm at the coupler center")'}
  - {label: TM loss under electrode, value: '≈ 2', unit: dB/cm, basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2'}
  essential: false

- id: electrode_2
  name: electrode over the straight guide
  role: Second gold electrode; no electrode between the guides.
  detail: 'Mirror of the first electrode across the 3 µm gap. With the C axis normal to the surface, the fringing field between the two electrodes points in opposite directions in the two guides (Fig. 3a), giving opposite index changes, mainly for TM light through r_{zzz}. This removes the central electrode of the classical three-electrode layout.'
  quote: the opposite direction of the fringing fields in the two guiding regions gives the desired, opposite, index changes (Fig. 3).
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2; p.290 col. 2; Fig. 3a (p.290)
  material: gold (Fig. 4 "Au or Al")
  look: {color: '#d4a640', opacity: 1.0, metal: 0.9, rough: 0.3, emissive: ''}
  geometry: {type: plan_rect, length_of: coupling_region, side: 'outer side of guide_2, inner edge at the electrode gap', drawn: 'as electrode_1', thickness_A: 2000}
  dims:
  - {label: size, value: '1 × 3', unit: mm, basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2'}
  - {label: gold thickness, value: 2000, unit: 'Å', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 2; Fig. 4'}
  essential: false

- id: central_electrode
  name: central electrode (classical layout)
  role: The third electrode of the classical layout, which Cobra drops.
  detail: 'Fig. 2(a) "Classical configuration (three electrodes)" puts a narrow electrode between the guides, with the C axis in the plane across the guides; Fig. 2(b) "Cobra configuration (two electrodes)" has none, C axis normal to the surface. The text: such a central electrode, 2000 Å × 2 µm in section and several mm long, "will be rather fragile and have a high resistance". Shown only as a fading ghost for contrast; it was not part of the device.'
  quote: Elimination of the central electrode is desirable since, due to its small section (2000 Å × 2 µm) and relatively long length (~ several mm) it will be rather fragile and have a high resistance.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2; Fig. 2 (p.289)
  material: metal (classical proposal)
  look: {color: '#d4a640', opacity: 0.35, metal: 0.5, rough: 0.5, emissive: ''}
  geometry: {type: plan_rect, frame: fig5_px, between: [guide_1, guide_2], length_of: coupling_region, drawn: 'ghost only'}
  dims:
  - {label: section, value: '2000 Å × 2 µm', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2'}
  essential: false

- id: prism
  name: rutile prism coupler
  role: Couples the argon laser beam into one guide.
  detail: 'One guide was excited "using a rutile prism coupler"; Fig. 5 marks the launching region. Prism size, angle, clamping and exact position are not given: drawn as a plain neutral prism stand-in over the launching region.'
  quote: were examined by exciting one of the guides (using a rutile prism coupler)
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 1
  material: rutile (TiO₂)
  look: {color: '#e9e2d0', opacity: 0.35, metal: 0.0, rough: 0.05, emissive: ''}
  geometry: {type: stand_in_prism, over: launch_region, note: 'plain stand-in; no dimensions'}
  essential: false

- id: argon_beam
  name: argon laser light (5145 Å)
  role: Probe light; mainly TM in the switching test.
  detail: 'The 5145 Å argon line made the energy exchange visible by fluorescence or by light diffused out of the guides. In the switching test an "essentially TM guided wave was excited". Laser power is not given.'
  quote: The use of the 5145-Å line of an argon laser permitted this observation to be made using either a fluorescence technique or direct observation of diffused light.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 1; p.291 col. 1
  material: ''
  look: {color: '#36ff3c', opacity: 0.9, metal: 0.0, rough: 1.0, emissive: '#36ff3c'}
  geometry: {type: beam, enters: prism, then: 'guided light along guide_1 / guide_2 per chapter', wavelength_A: 5145}
  dims:
  - {label: wavelength, value: 5145, unit: 'Å', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.290 col. 1'}
  - {label: polarization in the switching test, value: essentially TM, basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.291 col. 1'}
  essential: false

- id: observation_region
  name: observation region
  role: Output end where the light in each guide was watched.
  detail: 'Circle in Fig. 5 where the curved guide leaves and the straight guide continues. Light diffused out of the guides there was observed while voltages were applied; Fig. 6 shows photographs at 0 V and 6 V (in the scan used here the photographs reproduce as black fields, so no intensities are read from them).'
  quote: Light from an argon laser was coupled into one of the guides, and the light diffused out of the guides at the output was observed as various voltages were applied to the electrodes.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.291 col. 1; Fig. 5, Fig. 6 (p.290)
  material: ''
  look: {color: '#a8a69d', opacity: 0.0, metal: 0.0, rough: 1.0, emissive: ''}
  geometry: {type: circle_outline, frame: fig5_px, center: [763, 150], r: 62}
  essential: false

- id: field_lines
  name: fringing field
  role: Field lines dive under the gap; opposite directions in the two guides.
  detail: 'Fig. 3a, "Section of the coupling region showing the crystal orientation, electrode configuration, and electric field lines": three field lines run from under one electrode down through its guide, arc beneath the gap and rise through the other guide. Arrows point down in the left guide and up in the right guide as drawn; the applied polarity and which guide of Fig. 5 is on the left are not stated. With C vertical, the TM index change comes mainly from r_{zzz}; the r_{yzy} coefficient makes the index change between the guides asymmetric for opposite polarities, which was observed. Section tints: index changes of opposite sign in the two guides (p.289 col. 2, Fig. 3); the paper gives no sign. Lighter = index raised, darker = lowered for the polarity drawn; the tint direction follows r_{33} > 0 (textbook sign, assumed, not from the paper).'
  quote: With this electrode configuration the principal effect will be to change the Δβ of TM polarized waves due to the r_{zzz} coefficient.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 col. 2; Fig. 3a (p.290); p.291 col. 1
  material: ''
  look: {color: '#4c9bf0', opacity: 0.9, metal: 0.0, rough: 1.0, emissive: ''}
  geometry:
    type: section_fig3a
    frame: fig3a_px
    surface_y: 237.5
    electrodes: [[120, 207.5, 400, 237.5], [538, 207.5, 815, 237.5]]
    guides_half_ellipse: [{x: [259, 350], bottom_y: 306}, {x: [536, 625], bottom_y: 309}]
    c_axis: {x: 462, from_y: 237.5, to_y: 170}
    y_axis: {y: 238, to_x: 980}
    arcs: 'three arcs between the guides, lowest points about y 394, 421 and lower (drawn); arrows down in the left guide, up in the right guide'
    note: 'Fig. 3a is schematic: drawn guide width 91 px vs gap 186 px (printed 2 µm / 3 µm), left electrode overhangs its guide inner edge while the right one is flush; do not read sizes from it'
  essential: false

- id: voltage
  name: control voltage
  role: 6 V across the two electrodes switches the light back.
  detail: 'Abstract: "Efficient switching is observed with 6 V applied." Results: at 0 V most light leaves by the straight guide; at 6 V it is switched back to the curved guide. The effect was about 3 times stronger for TM than TE, and opposite polarities behaved differently, as expected from the r_{yzy} coefficient. Source, leads, polarity and switching speed are not described: drawn as a plain stand-in with a 0 V / 6 V toggle; only the 0 V and 6 V states are shown, intermediate voltages are not.'
  quote: Efficient switching is observed with 6 V applied.
  locator: Papuchon et al., Appl. Phys. Lett. 1975, p.289 abstract; p.291 col. 1
  material: ''
  look: {color: '#a8a69d', opacity: 0.8, metal: 0.0, rough: 0.8, emissive: ''}
  geometry: {type: stand_in_source, leads_to: [electrode_1, electrode_2], note: 'plain stand-in; no circuit detail'}
  dims:
  - {label: switching voltage, value: 6, unit: V, basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.289 abstract; p.291 col. 1'}
  - {label: TM vs TE effectiveness, value: '≈ 3×', basis: stated, locator: 'Papuchon et al., Appl. Phys. Lett. 1975, p.291 col. 1'}
  essential: false

