  labels: []
- id: strips
  p: [0.17, 0.28]
  keyword: Two strips
  line: Masked and ion-etched to the coupler pattern.
  action: 'resist layer appears, exposure arrows (Fig. 4 row 2), the film etches away leaving the Fig. 5 pattern: launching region tapering into one strip, a second strip bending in from the lower left, parallel section, one strip bending away, the other tapering into the wide output region. Dashed coupling-region outline appears'
  parts: [resist, ti_strips, coupling_region]
  process: pattern
  labels: [ti_strips, coupling_region]
- id: diffusion
  p: [0.28, 0.38]
  keyword: In-diffusion
  line: Hours in hot oxygen; titanium sinks in and forms guides.
  action: 'furnace glow tint; the grey strips sink into the crystal and turn into faint blue channels slightly wider than the strips (lateral diffusion, p.290 col. 2); surface flat afterwards'
  parts: [guide_1, guide_2, launch_region, output_region]
  process: diffuse
  labels: []
- id: electrodes
  p: [0.38, 0.48]
  keyword: Two electrodes
  line: Gold over each guide; no electrode between them.
  action: 'ghost of the classical central electrode (Fig. 2a) appears between the guides and fades out; gold film sputtered over the surface, resist, exposure (optical superposition), ion etch back to two pads over the two guides along the coupling region with a narrow gap above the gap between the guides (Fig. 4 row 4, Fig. 2b, Fig. 3a)'
  parts: [electrode_1, electrode_2, central_electrode]
  process: electrodes
  labels: []
- id: crossover
  p: [0.48, 0.6]
  keyword: Light crosses over
  line: Power swaps guides and leaves by the straight one.
  action: 'prism stand-in over the launching region; green beam enters; guided glow in the curved guide hands over to the straight guide and back along the coupling region (Eq. (2), Δβ = 0: full transfer at L0, back at 2L0, across at 3L0); at the output most light leaves by the straight guide, a faint residue in the curved one (fraction not stated); observation circle lights'
  parts: [prism, argon_beam, guide_1, guide_2, observation_region]
  process: test
  labels: [coupling_region]
- id: field
  p: [0.6, 0.7]
  keyword: Opposite fields
  line: Field points down in one guide, up in the other.
  action: 'section through the middle of the coupling region lifts out (Fig. 3a layout): electrodes, two half-elliptic guides, C axis up, y across; three field lines draw from one guide under the gap to the other with arrows down / up; the two guides tint in opposite directions (index up / down); no numbers'
  parts: [field_lines, electrode_1, electrode_2, guide_1, guide_2]
  labels: []
- id: switch
  p: [0.7, 0.82]
  keyword: Switched at *6 V*
  line: Light returns to the guide it entered.
  action: 'voltage stand-in toggles 0 V -> 6 V; the 0 V pattern crossfades into the 6 V pattern (no intermediate voltages drawn); along the coupling region the glow stays mostly in the curved guide, dipping and recovering (pattern from Eq. (2) for Δβ = c√12, the Fig. 1 case: the paper does not state the Δβ reached at 6 V); at the output the curved guide carries the light out and up'
  parts: [voltage, guide_1, observation_region, argon_beam]
  process: test
  labels: []
- id: power
  p: [0.82, 1.0]
  keyword: Coupled-mode theory
  line: Zero mismatch hands the power over; mismatch brings it back.
  action: 'model frames left; plot assembles right: axes, Δβ = 0 curve, then Δβ = c√12 curve, then the dashed marker at 3 L0 (coupling region end). Toggle to the Eq. (2) curves extended to 3 L0'
  parts: [coupling_region]
  plot: power
  labels: []

