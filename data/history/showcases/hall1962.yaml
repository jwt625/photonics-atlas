      - {label: material, value: "N-type gallium arsenide, monocrystalline ingot", unit: "", basis: stated, locator: "US 3,245,002 col. 3:34-35"}
      - {label: tellurium, value: "about 10^{18}", unit: "cm^{-3}", basis: stated, locator: "US 3,245,002 col. 3:36-37"}
      - {label: tellurium in the melt, value: "at least 5x10^{18}", unit: "cm^{-3}", basis: stated, locator: "US 3,245,002 col. 3:38-39"}
