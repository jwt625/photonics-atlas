  - {id: wafer, p: [0.07, 0.15], keyword: "n-type GaAs", line: "A wafer of tellurium-doped gallium arsenide.", action: "plain slab drops in (schematic size); HUD shows the patent doping values", parts: [wafer], process: wafer, labels: []}
  - {id: diffuse, p: [0.15, 0.26], keyword: "Zinc diffusion", line: "Sealed with zinc and heated: a p-type skin forms on every surface.", action: "quartz ampoule closes around the wafer, warm glow, a brown skin grows inward from all surfaces; ampoule fades", parts: [quartz_ampoule, wafer, zn_skin], process: diffuse, labels: []}
  - {id: cut, p: [0.26, 0.36], keyword: "One junction", line: "Cut and ground to a cube with one flat junction.", action: "a small cube is cut from the slab; other skin faces are ground away; the junction plane at mid-height lights faintly; label the 0.4 mm edge", parts: [crystal, p_region, n_region, junction], process: cut, labels: [crystal]}
  - {id: polish, p: [0.36, 0.45], keyword: "Parallel faces", line: "Front and back faces polished flat and parallel.", action: "front and back faces glint in turn; a faint arrow pair shows the cavity axis normal to them", parts: [front_face, rear_face, side_faces], process: polish, labels: []}
  - {id: contacts, p: [0.45, 0.54], keyword: "Ohmic contacts", line: "Contacts on top and bottom; mounted on a metal disc.", action: "top contact drops onto the top face, the cube settles on the disc, lead attaches", parts: [top_contact, mount_disc, top_lead], process: contacts, labels: []}
  - {id: cold, p: [0.54, 0.62], keyword: "Liquid nitrogen", line: "Immersed in liquid nitrogen, driven by short current pulses.", action: "liquid rises around the mount; the pulse source appears off to the left, its lead to the top contact", parts: [ln2_bath, pulse_source, top_lead], process: cold, labels: [ln2_bath]}
  - {id: threshold, p: [0.62, 0.75], keyword: "Threshold", line: "Past threshold the light rises abruptly and leaves as a beam.", action: "plots.threshold assembles; drive current density follows the plot pen; junction glow follows the digitized light output; beam out of both polished faces only once the curve leaves the dashed line; a frozen moment within one pulse", parts: [junction, beam, front_face, pulse_source], plot: threshold, labels: [beam]}
  - {id: spectrum, p: [0.75, 0.88], keyword: "Line *narrows*", line: "Spectral width collapses as the current passes threshold.", action: "plots.spectrum: the broad curve draws with a dim glow and no beam; the narrow curve draws with the beam on; model in the left half", parts: [beam, junction], plot: spectrum, labels: []}
  - {id: modes, p: [0.88, 1.00], keyword: "More modes", line: "More current: extra modes appear at longer wavelengths.", action: "plots.modes: curves a-d reveal in order; drive steps 6000 / 8600 / 10400 / 20000 A/cm^2 with them; glow scales with each curve's peak; beam from curve b on", parts: [beam, junction, pulse_source], plot: modes, labels: [beam]}

process:
  - id: wafer
    name: n-type GaAs wafer
    source: patent US 3,245,002
    parts: [wafer]
