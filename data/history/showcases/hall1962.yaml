withheld:
  - {what: "Junction depth in the letter's diodes", reason: "The patent example puts the junction about 0.1 mm below every surface; the letter describes it through the centre of a 0.4 mm cube. The sources do not reconcile the two; the model shows the letter's cube"}
  - {what: "Side-face finish of the letter's diodes", reason: "The letter describes only the polished front and back faces; tapered or roughened side faces are the patent's example (col. 3:56-61). The cube is drawn plain"}
  - {what: "Contact metals and solders of diodes L-69, L-70, L-75", reason: "The letter says only 'Ohmic contacts'; In-Zn and tin solders are the patent example"}
  - {what: "Lead shape, disc metal and size, diode position on the disc", reason: "Not stated; the patent's strip connectors are drawn in FIG. 1 only. Plain wire and plain disc stand-ins"}
  - {what: "Dewar, windows, image converter tube and spectrometer layout", reason: "The letter names the infrared converter tube and the spectrometer on the beam axis but gives no arrangement"}
  - {what: "Pulse repetition rate, pulse amplitude, source circuit", reason: "Only the 5 to 20 µs duration is printed in the letter; the patent shows a pulsed source with a series limiting resistor (FIG. 2)"}
  - {what: "Beam divergence of diodes L-69 and L-70", reason: "Not stated; Fig. 1 photographs are licensed and give no printed angle. The beam spread is illustrative"}
  - {what: "Doping levels and junction thickness of the letter's diodes", reason: "The letter says only 'degenerate' and 'a fraction of a wavelength'; numbers in the side panel are the patent example"}
  - {what: "Currents for Fig. 2 and the scale ratio between its two curves", reason: "Not printed ('Different vertical scales'); the patent says curve E 'may be 20 to 50 times' curve D (col. 4:47-48)"}
  - {what: "Output power and efficiency of the letter's diodes", reason: "Not in the letter; the patent's 'current efficiencies of greater than 50%' (col. 7) refers to devices of the invention in general"}
  - {what: "Wafer and ampoule sizes", reason: "Not stated; schematic stand-ins"}
  - {what: "Mirror coatings", reason: "None mentioned in the letter; the patent offers partial metallizing only as an option (col. 6:15-22)"}
