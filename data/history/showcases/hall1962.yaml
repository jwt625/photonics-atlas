# Showcase spec: GaAs junction laser, Hall et al. 1962. Schema: DevLog-017 section 4a + runtime fields (types.ts).
# Research 2026-11-11. Bases: stated = printed in the letter or the patent text; figure = read from a printed figure;
# ref = other cited source; digitized = sampled from a printed curve; derived = computed from stated values;
# assumed = rendering value only, no source (tooltip says "assumed").
# Coordinates: mm. x = cavity axis (+x = front face, beam direction), y = up (normal to the junction), z = across.
# Origin: centre of the mount disc top surface; cube from y = 0 to 0.4, junction plane at y = 0.2.
# Letter = Hall, Fenner, Kingsley, Soltys, Carlson, Phys. Rev. Lett. 9, 366-368 (1962-11-01).
# Patent = R. N. Hall, US 3,245,002 (filed 1962-10-24, granted 1966-04-05, assignor to General Electric Company).
id: hall1962
title: GaAs junction laser
tagline: Forward-biased gallium arsenide p-n junction emits coherent infrared, General Electric 1962
title_note: 'The letter states that "this is the first time that direct conversion of electrical energy to coherent infrared radiation has been achieved in a solid state device" and calls it "the first example of a laser involving transitions between energy bands rather than localized atomic levels" (Hall et al., Phys. Rev. Lett. 1962, p.368). Received 1962-09-24. Stimulated emission from GaAs junctions was also reported by Nathan et al. (IBM Watson Research Center, Appl. Phys. Lett. 1, 62, 1962-11-01) and Quist et al. (MIT Lincoln Laboratory, Appl. Phys. Lett. 1, 91, 1962-12-01); both are cited on the patent. The letter prints no fabrication recipe: the wafer, zinc diffusion, polishing and solder values come from R. N. Hall''s patent of the same work (US 3,245,002, filed 1962-10-24), whose FIG. 4 repeats the letter''s Fig. 2 spectra.'
renderer: 3d
height: 9                      # runtime: track length in viewport heights

parts:
  - id: wafer
    name: n-type GaAs wafer
    role: Tellurium-doped gallium arsenide, degenerate n-type
    detail: >-
      Patent example: "a flat wafer cut from a monocrystalline ingot of N-type gallium arsenide which had been
      impregnated or doped with approximately 10^{18} atoms per cubic centimeter of tellurium by growth from a melt of
      gallium arsenide containing at least 5x10^{18} atoms per cubic centimeter of tellurium to cause it to be
      degenerately N-type". The letter gives no wafer, doping or growth details; it calls the end regions of the
      junction "degenerate n- and p-type". Wafer size is not stated: drawn as a plain slab.
    quote: "a flat wafer cut from a monocrystalline ingot of N-type gallium arsenide"
    locator: "US 3,245,002 col. 3:34-40"
    material: n-type GaAs (Te-doped)
    look: {color: "#5d6470", opacity: 1.0, metal: 0.35, rough: 0.35, emissive: ""}
    geometry: {type: box, size: [2.4, 0.6, 2.4], schematic: true}
    dims:
      - {label: Te concentration (patent example), value: "about 10^{18}", unit: "cm^{-3}", basis: stated, locator: "US 3,245,002 col. 3:36-37", essential: false}
      - {label: Te in the melt (patent example), value: "at least 5x10^{18}", unit: "cm^{-3}", basis: stated, locator: "US 3,245,002 col. 3:38-39", essential: false}
      - {label: size, value: "2.4 x 0.6 x 2.4", unit: mm, basis: assumed, locator: "not stated; schematic slab", essential: false}
    essential: false

  - id: quartz_ampoule
    name: Sealed quartz tube
    role: Evacuated ampoule holding the wafer and the zinc
    detail: >-
      Patent example: the junction is formed "by diffusing zinc into all surfaces thereof at a temperature of
      approximately 1000° C. for approximately 1/2 hour using an evacuated sealed quartz tube containing the gallium
      arsenide crystal and 10 milligrams of zinc". Tube size and furnace are not stated: drawn as a plain closed
      cylinder.
    quote: "using an evacuated sealed quartz tube containing the gallium arsenide crystal and 10 milligrams of zinc"
    locator: "US 3,245,002 col. 3:43-44"
    material: fused quartz
    look: {color: "#dfe8ef", opacity: 0.22, metal: 0.0, rough: 0.05, emissive: ""}
    geometry: {type: capsule, axis: x, diameter: 4.0, length: 9.0, schematic: true}
    dims:
      - {label: zinc charge, value: 10, unit: mg, basis: stated, locator: "US 3,245,002 col. 3:44", essential: false}
      - {label: size, value: "dia. 4 x 9", unit: mm, basis: assumed, locator: "not stated", essential: false}
    essential: false

  - id: zn_skin
    name: Zinc-diffused p layer
    role: Zinc diffuses in from every surface and turns the skin p-type
    detail: >-
      Patent example: diffusion of zinc "into all surfaces" at about 1000 °C for about 1/2 hour, "thus producing a
      P-N junction region of approximately 1000 Angstroms in thickness at a distance of approximately .1 mm. below
      all surfaces of the crystal 1." Shown as a skin on the schematic wafer. The letter does not say how its
      junctions were made.
    quote: "producing a P-N junction region of approximately 1000 Angstroms in thickness at a distance of approximately .1 mm. below all surfaces"
    locator: "US 3,245,002 col. 3:45-47"
    material: p-type GaAs (Zn-diffused)
    look: {color: "#9a6a4a", opacity: 0.85, metal: 0.3, rough: 0.4, emissive: ""}
    geometry: {type: shell, of: wafer, depth: 0.1}
    dims:
      - {label: junction depth below the surface (patent example), value: 0.1, unit: mm, basis: stated, locator: "US 3,245,002 col. 3:46-47", essential: false}
      - {label: diffusion temperature (patent example), value: 1000, unit: "°C", basis: stated, locator: "US 3,245,002 col. 3:42", essential: false}
      - {label: diffusion time (patent example), value: "about 1/2", unit: h, basis: stated, locator: "US 3,245,002 col. 3:42-43", essential: false}
    essential: false

  - id: crystal
    name: GaAs diode cube
    role: The diode, about a 0.4 mm cube with one flat junction
    detail: >-
      Letter: "The diodes can be described approximately as cubes 0.4 mm on an edge, the junction lying in a
      horizontal plane through the center." Patent example: "The wafer is then cut and ground to remove all except one
      such planar junction. As cut, the wafer typically may be .5 mm. thick and .4 mm. x .4 mm. on its faces." In
      diode L-70 the polished faces "were 0.32 mm apart" (letter p.367). The model follows the letter (0.4 mm cube,
      junction at mid-height); the patent's 0.1 mm junction depth and 0.5 mm thickness are not reconciled with it in
      the sources.
    quote: "The diodes can be described approximately as cubes 0.4 mm on an edge, the junction lying in a horizontal plane through the center."
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: GaAs
    look: {color: "#6b7280", opacity: 1.0, metal: 0.35, rough: 0.3, emissive: ""}
    geometry: {type: group, of: [p_region, junction, n_region], size: [0.4, 0.4, 0.4]}
    dims:
      - {label: edge, label_short: edge, show_label: true, value: 0.4, unit: mm, basis: stated, locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1 ('approximately as cubes 0.4 mm on an edge')", essential: true}
      - {label: "face spacing, diode L-70", value: 0.32, unit: mm, basis: stated, locator: "Hall et al., Phys. Rev. Lett. 1962, p.367 col. 2", essential: false}
      - {label: "as cut (patent example), thickness", value: 0.5, unit: mm, basis: stated, locator: "US 3,245,002 col. 3:49-50", essential: false}
      - {label: "as cut (patent example), faces", value: "0.4 x 0.4", unit: mm, basis: stated, locator: "US 3,245,002 col. 3:50", essential: false}
      - {label: junction area (0.4 mm x 0.4 mm), value: 0.0016, unit: "cm^{2}", basis: derived, locator: "from the 0.4 mm edge (letter p.366); patent: 'approximately .001 cm.^{2}' (col. 4:22-23)", essential: false, note: "derived from the approximate cube size; not printed in the letter"}
    essential: true

  - id: p_region
    name: p-type region
    role: Degenerate p-type upper half; holes injected into the junction
    detail: >-
      Letter: "the necessary population inversion is produced by injection of carriers from the degenerate n- and
      p-type end regions of the junction into the transition region." Patent FIG. 1 labels the upper region P (2,
      "degenerately impregnated or doped P-type region") and the lower region N (3). The letter does not say which
      side faces up; the model follows patent FIG. 1.
    quote: "injection of carriers from the degenerate n- and p-type end regions of the junction into the transition region"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1; US 3,245,002 FIG. 1, col. 1:72 - col. 2:1"
    material: p-type GaAs (Zn)
    look: {color: "#8a6f5a", opacity: 1.0, metal: 0.3, rough: 0.35, emissive: ""}
    geometry: {type: box, size: [0.4, 0.2, 0.4]}
    dims:
      - {label: height (half the cube), value: 0.2, unit: mm, basis: derived, locator: "junction through the centre of a 0.4 mm cube (letter p.366)", essential: false}
    essential: false

  - id: n_region
    name: n-type region
    role: Degenerate n-type lower half; electrons injected into the junction
    detail: >-
      Letter: "degenerate n- and p-type end regions"; the patent's example crystal is tellurium-doped n-type GaAs
      (col. 3:34-40). Lower half per patent FIG. 1 (N, 3, "degenerately impregnated or doped N-type region").
    quote: "the degenerate n- and p-type end regions of the junction"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1; US 3,245,002 FIG. 1, col. 2:2"
    material: n-type GaAs (Te)
    look: {color: "#5d6470", opacity: 1.0, metal: 0.35, rough: 0.35, emissive: ""}
    geometry: {type: box, size: [0.4, 0.2, 0.4]}
    dims:
      - {label: height (half the cube), value: 0.2, unit: mm, basis: derived, locator: "junction through the centre of a 0.4 mm cube (letter p.366)", essential: false}
    essential: false

  - id: junction
    name: Junction (active region)
    role: Thin active region where injected carriers recombine and lase
    detail: >-
      Letter: "the stimulated radiation propagates in the plane of the junction where the active region may be only a
      fraction of a wavelength in thickness and has a wave front which laterally extends many wavelengths into the
      passive n- and p-type regions bounding the junction plane." Patent example: junction region "approximately 1000
      Angstroms in thickness" (col. 3:45-46); preferred 500 to 2000 Å (col. 3:67-68). Drawn far thicker than scale so
      that it can be seen.
    quote: "the active region may be only a fraction of a wavelength in thickness"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: GaAs p-n transition region
    look: {color: "#c0392b", opacity: 0.9, metal: 0.0, rough: 0.6, emissive: "#ff3020"}
    geometry: {type: box, size: [0.4, 0.012, 0.4], schematic_thickness: true}
    dims:
      - {label: thickness (patent example), value: "about 1000", unit: "Å", basis: stated, locator: "US 3,245,002 col. 3:45-46", essential: false}
      - {label: drawn thickness (visual only), value: 0.012, unit: mm, basis: assumed, locator: "exaggerated about 100x to be visible", essential: false, note: "not to scale"}
    essential: false

  - id: front_face
    name: Polished front face
    role: One cavity mirror; the measured beam leaves here
    detail: >-
      Letter: "The front and back faces are polished parallel to each other and perpendicular to the plane of the
      junction, in order to satisfy condition (c) above" (condition (c): "the active region must be contained within a
      cavity having a resonance"). Patent: polished "to optical smoothness and to exact parallelism ... approximately
      ±0.1 micron", or parallelism "by proper cleavage"; "the reflectance of the surfaces is high, of the order of .4,
      or higher". No coating on the letter's diodes is mentioned.
    quote: "The front and back faces are polished parallel to each other and perpendicular to the plane of the junction"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: polished GaAs
    look: {color: "#c9d1db", opacity: 0.55, metal: 0.8, rough: 0.05, emissive: ""}
    geometry: {type: face, of: crystal, side: "+x"}
    dims:
      - {label: parallelism (patent example), value: "about ±0.1", unit: "µm", basis: stated, locator: "US 3,245,002 col. 3:53-55", essential: false}
      - {label: reflectance (patent statement), value: "of the order of 0.4 or higher", unit: "", basis: stated, locator: "US 3,245,002 col. 6:8-10", essential: false}
    essential: false

  - id: rear_face
    name: Polished back face
    role: The other cavity mirror, parallel to the front face
    detail: >-
      Same polish as the front face (letter p.366). The patent says light is transmitted "through the polished front
      and rear surfaces" (col. 6:26-28); the letter measured only on the front beam axis.
    quote: "The front and back faces are polished parallel to each other"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: polished GaAs
    look: {color: "#c9d1db", opacity: 0.55, metal: 0.8, rough: 0.05, emissive: ""}
    geometry: {type: face, of: crystal, side: "-x"}
    dims: []
    essential: false

  - id: side_faces
    name: Side faces
    role: The two faces across the cavity; not polished in the letter's text
    detail: >-
      The letter describes only the polished front and back faces. Patent example: "The side surfaces 13 and 14 are
      cut so as to form a tapered structure as one means of precluding any possibility of transverse standing waves
      within the semiconductor crystal. Alternatively, they could be roughened with abrasive for the same purpose."
      Patent FIG. 1 draws the tapered form. How the letter's diodes were finished on these faces is not stated; the
      model keeps the letter's plain cube.
    quote: "The side surfaces 13 and 14 are cut so as to form a tapered structure"
    locator: "US 3,245,002 col. 3:56-61"
    material: GaAs
    look: {color: "#6b7280", opacity: 1.0, metal: 0.25, rough: 0.7, emissive: ""}
    geometry: {type: face, of: crystal, side: "±z"}
    dims: []
    essential: false

  - id: top_contact
    name: Top Ohmic contact
    role: Contact on the top face, feeds current down through the junction
    detail: >-
      Letter: "Current is passed through the junction by means of Ohmic contacts attached to the top and bottom
      faces." Patent example (FIG. 1, first electrode 5 on solder layer 6): "acceptor solder 6 is an alloy of 3 wt.
      percent zinc, the remainder being indium." Electrode material and thickness are not stated; drawn as a thin
      plate over the top face as in patent FIG. 1.
    quote: "Current is passed through the junction by means of Ohmic contacts attached to the top and bottom faces."
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: metal electrode on In-Zn solder (patent example)
    look: {color: "#b8bcc4", opacity: 1.0, metal: 0.9, rough: 0.3, emissive: ""}
    geometry: {type: box, size: [0.4, 0.03, 0.4]}
    dims:
      - {label: solder (patent example), value: "In + 3 wt.% Zn", unit: "", basis: stated, locator: "US 3,245,002 col. 3:61-63", essential: false}
      - {label: thickness (visual only), value: 0.03, unit: mm, basis: assumed, locator: "not stated", essential: false}
    essential: false

  - id: mount_disc
    name: Metal disc
    role: The diode sits on it; bottom contact
    detail: >-
      Letter: the horizontal bands in the radiation pattern "result from interference between the light produced at
      the junction and its image in the metal disc on which the diode was mounted" (p.366 col. 2). With the "Ohmic
      contacts attached to the top and bottom faces", the disc carries the bottom contact; that the disc is the bottom
      electrode is an inference. Patent example: "Donor solder 8 is of tin" joining the N region to the second
      electrode 7 (col. 3:63; col. 2:6-9). Disc metal, size and position of the diode on it are not stated: drawn as a
      plain disc.
    quote: "its image in the metal disc on which the diode was mounted"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 2"
    material: metal (not stated); tin solder (patent example)
    look: {color: "#a7abb3", opacity: 1.0, metal: 0.95, rough: 0.2, emissive: ""}
    geometry: {type: cylinder, axis: y, diameter: 2.0, height: 0.2}
    dims:
      - {label: solder (patent example), value: tin, unit: "", basis: stated, locator: "US 3,245,002 col. 3:63", essential: false}
      - {label: diameter, value: 2.0, unit: mm, basis: assumed, locator: "not stated", essential: false}
      - {label: thickness, value: 0.2, unit: mm, basis: assumed, locator: "not stated", essential: false}
    essential: false

  - id: top_lead
    name: Top lead
    role: Current lead to the top contact
    detail: >-
      Patent: "Electrode connectors 9 and 10 are connected to electrodes 5 and 7 respectively as, for example, by
      welding, brazing, etc."; FIG. 1 draws them as bent strips. The letter does not describe its leads. Drawn as a
      plain wire, a stand-in.
    quote: "Electrode connectors 9 and 10 are connected to electrodes 5 and 7 respectively"
    locator: "US 3,245,002 col. 2:9-11"
    material: metal (not stated)
    look: {color: "#8a8f99", opacity: 1.0, metal: 0.7, rough: 0.4, emissive: ""}
    geometry: {type: wire, from: top_contact, to: pulse_source, diameter: 0.05, schematic: true}
    dims: []
    essential: false

  - id: ln2_bath
    name: Liquid nitrogen
    role: The diode runs immersed in it
    detail: >-
      Letter: "with the diode immersed in liquid nitrogen". Patent: "when a diode of gallium arsenide is immersed in
      a Dewar of liquid air at a temperature of approximately 77° K. the threshold for coherent emission occurs at
      approximately 10,000 amperes per square centimeter and decreases to less than 2000 A./cm.^{2} at 20° K."
      Dewar, windows and optical access are not described; drawn as a plain translucent volume of liquid.
    quote: "with the diode immersed in liquid nitrogen"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: liquid nitrogen
    look: {color: "#a9cfee", opacity: 0.18, metal: 0.0, rough: 0.05, emissive: ""}
    geometry: {type: cylinder, axis: y, diameter: 6.0, height: 3.0, schematic: true}
    dims:
      - {label: temperature, value: 77, unit: K, basis: ref, locator: "US 3,245,002 col. 4:17-18 ('liquid air at a temperature of approximately 77° K.'); the letter says only 'liquid nitrogen' (p.366 col. 1)", essential: false, note: "77 K is the patent's figure for liquid-air immersion; the letter prints no temperature"}
      - {label: volume drawn, value: "dia. 6 x 3", unit: mm, basis: assumed, locator: "not stated", essential: false}
    essential: true

  - id: pulse_source
    name: Pulsed current source
    role: Forward current in short pulses
    detail: >-
      Letter: "Current is applied in the form of pulses of 5 to 20 µsec duration". Patent FIG. 2: "a pulsed source
      ... 15 ... connected to diode 1 through a series limiting resistor 16"; pulse width "conveniently kept to a level
      of approximately 1 to 10 microseconds" to avoid overheating; "a 10 ampere pulsed current source is sufficient at
      77° K." for a junction area of about .001 cm^{2}. Repetition rate, amplitude and circuit of the letter's source
      are not stated. Shown as a schematic box.
    quote: "Current is applied in the form of pulses of 5 to 20 µsec duration"
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: ""
    look: {color: "#2a2d33", opacity: 1.0, metal: 0.2, rough: 0.6, emissive: ""}
    geometry: {type: box, size: [3.0, 1.6, 1.6], schematic: true}
    dims:
      - {label: pulse duration, value: "5 to 20", unit: "µs", basis: stated, locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1", essential: false}
      - {label: pulse width (patent), value: "about 1 to 10", unit: "µs", basis: stated, locator: "US 3,245,002 col. 4:8-10", essential: false}
      - {label: source sufficient at 77 K (patent), value: 10, unit: A, basis: stated, locator: "US 3,245,002 col. 4:21-24", essential: false}
      - {label: "current at 8500 A/cm^{2} for a 0.4 mm cube", value: "about 14", unit: A, basis: derived, locator: "8500 A/cm^{2} (letter p.367) x 0.0016 cm^{2}", essential: false, note: "derived from the approximate cube size"}
    essential: false

  - id: beam
    name: Coherent beam
    role: Near-infrared beam out of both polished faces
    detail: >-
      Letter: coherence rests on "the sharply beamed radiation pattern of the emitted light", "a threshold current
      beyond which the intensity of the beam increases abruptly" and "the pronounced narrowing of the spectral
      distribution of this beam beyond threshold". Above threshold, vertical interference bands appear in the
      radiation pattern of diode L-69 (Fig. 1b, c), evidence "that the light is coherent"; diode L-75 gave a pattern
      "almost uniform in the azimuthal plane, but ... only a few tenths of a degree wide in the vertical plane"
      (p.368). Intensity was measured "at 8420 Å on the axis of the beam" (diode L-70). Patent: light "is
      transmitted through the polished front and rear surfaces" (col. 6:26-28). Drawn in visible red: 8420 Å is
      near-infrared and invisible; spread angles are illustrative.
    quote: "Coherent infrared radiation has been observed from forward biased GaAs p-n junctions."
    locator: "Hall et al., Phys. Rev. Lett. 1962, p.366 col. 1"
    material: light
    look: {color: "#ff1a1a", opacity: 0.8, metal: 0.0, rough: 1.0, emissive: "#ff1a1a"}
    geometry: {type: beam, axis: x, origin: junction, from_faces: ["+x", "-x"], length: 8.0, illustrative_spread: true}
    dims:
      - {label: wavelength (diode L-70 measurement), value: 842, unit: nm, basis: stated, locator: "Hall et al., Phys. Rev. Lett. 1962, p.367 col. 1 ('at 8420 Å on the axis of the beam')", essential: true}
      - {label: "vertical width, diode L-75", value: "a few tenths of a degree", unit: "", basis: stated, locator: "Hall et al., Phys. Rev. Lett. 1962, p.368 col. 1", essential: false}
      - {label: drawn spread, value: "illustrative", unit: "", basis: assumed, locator: "not stated for diodes L-69 / L-70", essential: false}
    essential: true

