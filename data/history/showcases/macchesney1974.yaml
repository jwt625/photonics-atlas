  essential: true
  drawing_refs: ['fig3:35']
- id: clear_zone
  name: region 36
  role: Particle-free region where the deposit is fused.
  detail: 'Patent FIG. 3, upstream (left) of the hot zone. Name as printed: ''region 36''.'
  quote: region 36, devoid of such particulate matter, defines the region within which fusion of deposited material is occurring.
  locator: US 4,217,027 col. 4:45-47
  material: gas stream
  look:
    color: '#ffffff'
