- id: preform
  name: preform
  role: Solid rod after collapse; core from the germania-rich layer.
  detail: 'Paper: after deposition the tube is collapsed into a solid rod, so that the germania-rich layer forms the core of the preform. Patent: finished preform of a GeO2-SiO2 core, borosilicate cladding, supported by a silica layer. Patent states preforms ''of rod shape with an internal diameter of from 4 to 8 mm and a length of 18 inches'' (wording as printed).'
  quote: After the deposition is complete, the tube is collapsed into a solid rod, so that the germania rich layer forms the core of the optical waveguide preform.
  locator: MacChesney et al., Proc. IEEE 62(9) p.1280 right col.
  material: GeO2-SiO2 core / borosilicate cladding / silica tube
  look:
    color: '#d6e6ef'
