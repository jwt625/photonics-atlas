# Showcase spec: MCVD preform process (macchesney1974). Schema: DevLog-017 section 4a. Research 2026-11-11.
id: macchesney1974
title: MCVD
title_note: 'Name: the 1974 paper does not use the term MCVD (modified chemical vapor deposition); it calls the process "a new method derived from CVD" (MacChesney et al., Proc. IEEE 62(9) p.1280). MCVD is the later, established name.'
tagline: Vapor deposition inside a spinning silica tube, then collapse to a preform.
renderer: 3d
height: 8
thumb_p: 0.36  # compact-view preview: burner traversing with the hot zone on the tube
parts:
- id: substrate_tube
  name: substrate tube
  role: Thin-wall fused quartz tube; deposition happens inside it.
  detail: 'Commercial-grade fused quartz (Amersil T08 in the paper). Patent Example 1: 12 mm I.D. x 14 mm O.D., cut to 18 in lengths, cleaned in HF-HNO3 for 3 min and rinsed in deionized water for 1 h. It becomes the outer cladding / support of the preform.'
  quote: deposition is accomplished inside a thin-wall fused-quartz tube (Amersil, Inc. T08 Commercial Grade), with the tube held in a glass-working lathe so that it is supported on both ends.
  locator: MacChesney et al., Proc. IEEE 62(9) p.1280 right col.
  material: fused quartz (SiO2), commercial grade
  look:
    color: '#dce8ee'
    opacity: 0.22
    metal: 0.0
    rough: 0.05
    emissive: ''
  geometry:
    type: tube
    od: 14.0
    id: 12.0
    length: 457.2
    axis: x
  dims:
  - label: outer diameter
    value: 14
    unit: mm
    basis: stated
    locator: US 4,217,027 col. 8:35-36 (Example 1); col. 6:61 (General Procedure)
    essential: true
    label_short: OD
  - label: inner diameter
    value: 12
    unit: mm
    basis: stated
    locator: US 4,217,027 col. 8:35-36; col. 6:61
    essential: true
    label_short: ID
  - label: cut length
    value: 457.2
    unit: mm
    basis: stated
    locator: US 4,217,027 col. 8:23-24 ('cut into 18" lengths'; 18 in = 457.2 mm)
    essential: false
    note: input and exhaust sections were added (col. 8:25-26), lengths not stated
  essential: true
  drawing_refs: ['fig1:2', 'fig3:30']
- id: lathe
  name: glass-working lathe
  role: Holds the tube at both ends and spins it.
  detail: 'The paper calls it a glass-working lathe; Tasker and French (same issue) call it a modified glass-working lathe. Patent FIG. 1: lathe 1, horizontal; tube 2 spans headstock to tailstock; gas enters through inlet tube 7 in the headstock, exits via outlet 18 beyond the tailstock. Rotation means not shown in the patent.'
  quote: FIG. 1 depicts a lathe 1 holding substrate tube 2
  locator: US 4,217,027 col. 3:61
  material: N/A (not stated)
  look:
    color: '#3a4048'
    opacity: 1.0
    metal: 0.6
    rough: 0.45
    emissive: ''
  geometry:
    type: group
    members: [headstock, tailstock, bed]
    note: box proportions assumed; patent drawing is schematic, no scale
  dims:
  - label: headstock / tailstock / bed size
    value: N/A
    unit: mm
    basis: assumed
    locator: no source gives lathe dimensions; render at visual scale only
    essential: false
  essential: false
  drawing_refs: ['fig1:1']
- id: burner
  name: oxy-hydrogen burner
  role: External heat source; its hot zone traverses the tube.
  detail: 'Paper: ''an oxy-hydrogen burner which traverses along its length''. Patent: heating means 4 (FIG. 1) moved by threaded feed member 6; heating means 31 (FIG. 3) below the tube. Hot zone about 2 cm long (heated region extending 4 cm either side of the peak). Temperatures read by optical pyrometer at the outer tube surface; gradient across the wall estimated up to 300 C.'
  quote: While rotating, it is heated using an oxy-hydrogen burner which traverses along its length.
  locator: MacChesney et al., Proc. IEEE 62(9) p.1280 right col.
  material: N/A (burner construction not stated)
  look:
    color: '#8a8f96'
    opacity: 1.0
    metal: 0.7
    rough: 0.35
    emissive: ''
  geometry:
    type: nozzle
    note: shape assumed (FIG. 3 shows a nozzle head with flames rising to the tube underside)
  dims:
  - label: hot zone length
    value: 20
    unit: mm
    basis: stated
    locator: US 4,217,027 col. 5:16-17 ('hot zone of the length of approximately 2 cm'); col. 8:04-06
    essential: false
  - label: heated region either side of peak
    value: 40
    unit: mm
    basis: stated
    locator: US 4,217,027 col. 8:05-06
    essential: false
  - label: burner body size
    value: N/A
    unit: mm
    basis: assumed
    locator: not stated
    essential: false
  essential: true
  drawing_refs: ['fig1:4', 'fig3:31']
- id: flame
  name: hot zone
  role: 'Moving hot zone: reaction and fusion site.'
  detail: 'The moving zone is the nucleation site for the gas-phase (homogeneous) reaction and the consolidation site for previously deposited particles (claim 1). Wall temperature during deposition 1400-1460 C in the General Procedure and Example 1 (US 4,217,027 col. 7:04-06, 8:40-45); Example 4, also chlorides: barrier 1740 C, core 1470 C (col. 9:64, 10:11, 10:19); up to 1600 C possible without distortion at 100 rpm, 2 cm zone, 45 cm/min.'
  quote: 'the moving zone serving the dual functions of: nucleation site for homogeneous reaction to produce particulate matter; and consolidation site for previously produced particulate matter.'
  locator: US 4,217,027 col. 10:54-58 (claim 1)
  material: oxy-hydrogen flame
  look:
    color: '#ff9a3c'
    opacity: 0.6
    metal: 0.0
    rough: 1.0
    emissive: '#ff7a1a'
  geometry:
    type: flame
    length_along_tube: 20
  dims:
  - label: zone length
    value: 20
    unit: mm
    basis: stated
    locator: US 4,217,027 col. 5:16-17
    essential: false
  essential: false
  drawing_refs: ['fig1:3', 'fig3:32']
- id: soot
  name: powdery suspension (soot)
  role: Particles formed in the gas, drifting downstream of the hot zone.
  detail: 'Paper: the gas-phase reaction produces particles which settle as a powder on the tube walls downstream from the hot zone; the powder is fused to a clear film as the burner traverses. Patent FIG. 3: zone 35 downstream of hot zone 32 is filled with a moving powdery suspension; region 36 (upstream) is free of particles and is where fusion occurs.'
  quote: The latter produces particles which settle as a powder on the tube walls downstream from the hot zone, and this powdery deposit is subsequently fused to a clear film as the burner traverses along the tube.
  locator: MacChesney et al., Proc. IEEE 62(9) p.1280 right col.
  material: oxide particles of the deposited glass composition
  look:
    color: '#f4f4f2'
    opacity: 0.85
    metal: 0.0
    rough: 1.0
    emissive: ''
  geometry:
