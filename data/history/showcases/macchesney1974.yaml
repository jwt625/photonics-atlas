- id: core_layers
  name: germania-doped core layers
  role: Index-raising deposit that becomes the fiber core.
  detail: 'Paper: silica doped with germania, or with germanium and boron. Patent Example 1: SiCl4 + GeCl4 in O2, 68 min at 1460 C (pass count not stated). Graded version (paper): ten layers of equal thickness, GeCl4 flow stepped in ten increments, SiCl4 and BCl3 flows constant.'
  quote: Next, a layer of silica doped with germania, or silica doped with germanium and boron is deposited.
  locator: MacChesney et al., Proc. IEEE 62(9) p.1280 right col.
  material: GeO2-SiO2 or GeO2-B2O3-SiO2
  look:
    color: '#7fb3ff'
    opacity: 0.6
    metal: 0.0
    rough: 0.1
    emissive: ''
  geometry:
