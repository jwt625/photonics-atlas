withheld:
- what: lathe dimensions, chuck form, rotation drive
  reason: not stated; patent FIG. 1 is schematic ('rotated ... by means not shown', col. 3:63-64); render lathe at assumed visual scale
- what: burner geometry (nozzle shape, size, gas flows of the torch)
  reason: not stated in paper or patent; FIG. 3 shows a nozzle head with flames only
- what: deposited layer thicknesses
  reason: not stated; cutaway layers are visual, not to scale
- what: core pass count (Example 1) and passes per graded layer
  reason: not stated (Example 1 gives 68 min; paper gives 10 layers without pass counts)
- what: which bubbler (14 or 15) holds SiCl4 vs GeCl4; contents of reservoir 13
  reason: FIG. 1 description does not assign them; text only says O2 was bubbled through SiCl4 and GeCl4 and combined with vapor-phase BCl3 (col. 6:17-22)
- what: flow values for the paper's own fibers
  reason: the 1974 paper prints no flows, temperatures or speeds; HUD values are from the patent examples (same inventors, priority 1974-02-22)
- what: alpha = 2.0 and 1.5 comparison curves of Fig. 2
  reason: they overlap the measured curve on the left half; not digitized; core radius a is not stated, so they cannot be recomputed without an assumption
- what: particle deposition (transport) mechanism wording (thermophoresis)
  reason: not in the 1974 paper or the patent; only in later secondary literature, not read
- what: preform diameter for this run
  reason: only the general 4-8 mm range is stated (col. 3:30-32, printed as 'internal diameter'); the render uses 8 mm
- what: draw apparatus and orientation
  reason: US col. 7:43-50 gives only local heating of the preform end and a draw at ~60 m/min onto a 30 cm mandrel at 60 rpm (method of Kapany 1967, not read); Example 2 col. 9:02 'removed to a pulling apparatus'; orientation not stated, shown vertical as a neutral layout choice, no furnace or mandrel drawn
- what: collapse pass count
  reason: the patent gives two stages (traverse slowed with reactants flowing to nearly complete collapse, then flow stopped for final collapse; col. 7:27-35, Example 1 col. 8:45-47), not a pass count; the render shows one slow traverse per stage
- what: input and exhaust section lengths
  reason: tubes 'provided with appropriate input and exhaust sections' (col. 8:25-26) and the traverse 'extends beyond the tube at both ends' (col. 8:01-03); lengths and material not stated, drawn as short neutral glass sections held in the chucks
notes: [The paper does not use the term MCVD or 'modified chemical vapor deposition'; it says 'a new method derived from CVD'. Title keyword uses the later name; flag in the side panel., 'Patent Example 1 fiber length (723 m) equals the paper''s Fig. 1 fiber length; core sizes differ (40 vs 35 um). Treat as likely the same work, not stated as the same fiber.', 'look values are presentational, not material data.']
