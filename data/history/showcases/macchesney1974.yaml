- id: barrier_layer
  name: borosilicate layer
  role: 'First deposit: barrier against impurities from the tube.'
  detail: 'Paper: a thin borosilicate layer is deposited first to minimize diffusion of transition-metal impurities from the quartz tube into the core. Patent Example 1: SiO2-B2O3 from SiCl4 + BCl3 in O2, 16 passes at 1430 C. Layer thickness not stated.'
  quote: a thin layer of borosilicate is deposited inside the support tube to minimize the diffusion of transition metal impurities from the quartz tube into the core
  locator: MacChesney et al., Proc. IEEE 62(9) p.1280 right col.
  material: B2O3-SiO2 (borosilicate)
  look:
    color: '#bcd6e6'
    opacity: 0.55
    metal: 0.0
    rough: 0.1
    emissive: ''
  geometry:
    type: layer_stack
    layers: 16
    layer_basis: stated (Example 1, 16 passes)
    thickness: N/A
  dims:
  - label: passes
