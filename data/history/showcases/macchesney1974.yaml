chapters:
- id: tube
  p: [0.0, 0.1]
  keyword: Silica tube
  line: Thin-wall fused quartz, cleaned and cut to length.
  action: tube floats in along x, slow quarter turn, settles on axis
  parts: [substrate_tube]
  process: prepare
  labels: [substrate_tube]
- id: lathe
  p: [0.1, 0.2]
  keyword: Glass lathe
  line: Held at both ends and spun about its axis.
  action: headstock and tailstock slide in, clamp the ends; tube starts rotating (rotation arrow)
  parts: [lathe, substrate_tube]
  process: prepare
  labels: []
- id: gases
  p: [0.2, 0.3]
  keyword: Chlorides in oxygen
  line: SiCl₄ and BCl₃ first, GeCl₄ later, carried in oxygen.
  action: inlet at -x lights up; colored vapor streamlines run +x through the bore to the outlet
  parts: [inlet, exhaust, gas_supply]
  process: barrier
- id: burner
  p: [0.3, 0.4]
  keyword: Moving hot zone
  line: Oxy-hydrogen burner moves in the gas-flow direction, about 45 cm/min.
  action: burner rises from below, flame ignites, glow band on the tube; burner traverses +x then snaps back
  parts: [burner, flame, feed_screw]
  process: barrier
  labels: [burner]
- id: soot
  p: [0.4, 0.52]
  keyword: Soot and sinter
  line: Particles form in the hot zone, settle downstream, fuse as the zone passes.
  action: particle cloud forms in the hot zone, drifts +x and settles as white powder ahead of the zone; the advancing hot zone fuses it to clear glass
  parts: [soot, flame, clear_zone]
  process: barrier
  labels: [soot]
- id: layers
  p: [0.52, 0.64]
  keyword: Layer by layer
  line: Borosilicate barrier first, then germania-doped core glass.
  action: 'cross-section: 16 thin barrier rings grow pass by pass, then core glass grows behind the moving zone with a porous band ahead (core pass count not stated; passes shown are visual)'
  parts: [barrier_layer, core_layers, substrate_tube]
  process: core
  labels: []
- id: collapse
  p: [0.64, 0.74]
  keyword: Collapse
  line: 'Slower traverse, about 1900 °C: the tube closes to a rod.'
  action: traverse slows, glow brightens; stage 1 with reactants flowing nearly closes the bore, flow stops, stage 2 closes it (two stages per col. 7:27-35; pass count not stated)
  parts: [substrate_tube, burner, preform]
  process: collapse
  labels: [burner]
- id: preform
  p: [0.74, 0.82]
  keyword: Preform
  line: Germania-rich core inside borosilicate and silica.
  action: rod lifts out, rotates; end-on section shows core / borosilicate / silica rings
  parts: [preform]
  process: draw
  labels: [preform]
- id: loss
  p: [0.82, 0.92]
  keyword: Under 2 dB/km
  line: Measured on the drawn fiber; loss falls about as λ⁻⁴ toward the infrared.
  action: 'preform end necks down to a fiber (drawn); loss plot assembles: axes, lambda^-4 guide, measured curve left to right'
  parts: [fiber]
  plot: loss
  process: measure
- id: graded
  p: [0.92, 1.0]
  keyword: Graded index
  line: Ten layers, germania stepped up toward the axis.
  action: ten core rings (equal radius steps of 0.1 a in the fiber) recolor by GeCl4 step; index profile points drop in symmetric pairs
  parts: [core_layers]
  plot: profile
  process: graded
