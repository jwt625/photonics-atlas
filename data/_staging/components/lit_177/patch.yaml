# Audit patch lit_177 (fresh-context audit 2026-11-16, DevLog/audits/2026-11-16-lit_177-audit.md).
# 74 metrics: 72 ok / 2 imprecise / 0 wrong; 16 components: 14 ok / 2 imprecise (notes) / 0 wrong; 0 deleted;
# 4 misses added (doerr2010 fiber MFD 11 um, bundalo2022 SMF28 MFD 9.2 um, larrea2018 overlay thickness 3.5 um and
# simulated 1-dB longitudinal tolerance > 20 um). After the patch: 16 components, 78 metrics.
# Coordinator rulings asked (audit Q1-Q6): Q1 doerr2010 derived loopback_half + borderline IME fab kept (no op);
# Q2 larrea2018 ~2 dB author_estimate + borderline UPV fab kept (no op); Q3 zhong2014 measured loopback_half, UW fab,
# design row kept (no op; variant note added); Q4 gui2021 band c_band inferred from Fig. 4 labels (patched);
# Q5 bundalo2022 Table II / MOB / connector rows kept (no op); Q6 larrea2018 longitudinal-tolerance add (alternative: drop).
components:
  cmp_lit_gui2021_pt_icr_thermal_ps:
    notes: "Two stages of heater phase shifters and 2x2 symmetric couplers form the LO polarization tracker integrated with the coherent receiver (2 PSRs, 2x8 90-degree hybrids, 4 balanced PDs; Fig. 3). Platform empty (only 'SiP' printed, D422 / D423). Fab empty (no fabrication statement; the chip is called a 'real product', authors at Huawei, D80b). No wavelength in the text; the Fig. 4 setup labels the two external lasers 1530-1540 nm and 1550-1560 nm (each PT-ICR receives the remote side's LO), and the Fig. 4 inset c spectrum spans 1533.5-1534.7 nm: C band. Tracker performance (up to 300 rad/s polarization rotation without penalty, Fig. 5) has no registry parameter (report); the ITLA and DFB lasers are external sources injected into the transceivers (rule 13)."
    why: "p.5 Fig. 4 labels 'External Laser 1530~1540 nm' and '1550~1560nm' and inset c (1533.5-1534.7 nm axis): the note 'No wavelength is printed anywhere in the paper' is not correct"
  cmp_lit_zhong2014_fc_swgc:
    notes: "Fab: 'The devices were fabricated at the University of Washington - Washington Nanofabrication Facility (WNF)' (p.8 acknowledgment; co-author at WNF): org_university_washington (D448, lu2015a precedent); WNF facility not in the registry (report). EBL, single full etch. Design (2D FDTD + particle swarm optimization in Lumerical): effective indices 2.79 / 1.71 (high / low region) at 1550 nm, subwavelength fill factors 0.67 / 0.13 (no parameter; grating fill factor 0.5 entered). Geometry rows are the optimized design (p.3-4); 'multiple SWGCs with parameter variations around the optimal values were fabricated' (p.5) and the paper does not say which variant Fig. 4 (and Fig. 7, tapered row) shows. Curved lines are confocal ellipses (Eq. (4)). Test pair at 127 um pitch joined by a short strip waveguide. Fabry-Perot ripples with about 1.1 nm FSR (pair cavity about 295 um) and about 18 nm FSR (front / rear curves, about 18 um) reveal back reflection (not quantified). Straight-line SWGCs with similar parameters were also fabricated; no penalty from curving, values in the authors' OFC paper (ref. 20), not entered."
    why: "p.5 Sec. 3: several parameter variants were fabricated and the measured device is 'a focusing-curved SWGC'; the design-geometry rows on this fabricated row need that caveat"
metrics:
  cmp_lit_gui2021_pt_icr_thermal_ps-m1:
    band: c_band
    wavelength_inferred: 'true'
    notes: "Printed 'small insertion loss (<0.3dB)' for the thermal phase shifters; no measurement shown (origin not stated). No wavelength with the value: C band inferred from the Fig. 4 setup labels (external lasers 1530-1540 nm and 1550-1560 nm; inset c spectrum 1533.5-1534.7 nm), rule 8."
    why: "rule 8: the device's operating band is stated in Fig. 4 (p.5), so band c_band with wavelength_inferred, not unspecified"
  cmp_lit_bundalo2022_pluggable_microlens_connector-m2:
    qualifier: ''
    notes: "Printed 'expanded MFDs to 30 um at a distance of about 2 mm' (the 'about' qualifies the distance, not the 30 um); whether designed or measured is not stated (Fig. 8 is a photograph)."
    why: "p.4 Sec. III-B prints 30 um without an approximation word; 'about' belongs to the 2 mm distance"
