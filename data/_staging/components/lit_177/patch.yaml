  parameter: tol_1db_longitudinal_um
  value: '20'
  unit: um
  qualifier: gt
  wavelength_nm: '1310'
  polarization: te
  condition: "fiber-to-SSC separation in air from contact; 3D-BPM, Wtip 70 nm, L 130 um, 3.5 x 8 um SiO2 cover, SMF"
  basis: simulated
  locator: 'p.3 Sec. II; p.2 Fig. 4(b)'
  verified_on: '2026-11-16'
  notes: "Printed: losses 'maintained below 1.5 dB when the separation between the SSC and the fiber is below 20 um' (p.3) against the 0.5 dB optimum at zero gap (p.2, Fig. 4(b) at 0 um), so the 1-dB excess point lies beyond 20 um. Fig. 4(b) reads about 1.4 dB at the 20 um end of the plotted range (+/- 0.05 dB). One-sided window from contact (no +/- span to halve). Arithmetic on simulated values stays simulated (D83f)."
  why: "Miss: registry tol_1db_longitudinal_um; the printed 1.5 dB bound minus the printed 0.5 dB optimum gives a 1-dB tolerance > 20 um, confirmed on Fig. 4(b)"
