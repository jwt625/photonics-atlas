  cmp_lit_bruch2018_aln_ring_shg_1590nm:
    notes: 'Fab empty: first-person fabrication (''we demonstrate a fabrication process'', ''our 100 kV electron-beam lithography process'', p.1-2) by authors at Yale University and the Institute of Semiconductors,
      CAS (p.1); the paper does not say which org grew the film or processed the chip (D154 / D80b). No facility acknowledged (funding only, p.4). Platform other (AlN on sapphire, no enum value; D515).
      Cached text is arXiv v3 (1807.09638) of the Applied Physics Letters paper; journal version unread. Seven rings share one IR bus (900 nm) and one wrap-around visible extraction waveguide (tapered 175
      -> 125 nm at constant gap), on-chip IR / visible WDM (p.2). Ring radius not printed (30 um appears only in the radiation-loss simulation example, p.2). Headline device of the paper; the text does
      not give its ring width or gap. Taken as a separate ring from the 1556 nm (1.24 um width) row: the paper''s own Fig. 2(a) sets the phase-matched SHG wavelength by the ring width (1480-1640 nm over
      widths 1.2-1.3 um, p.3), and Fig. 3(b) tunes the chip by only +/-10 C; the paper does not identify the 1590 nm device (not stated). Fig. 3(a) contour (simulated 20,000 %/W at critical coupling) not
      entered.'
    why: 'p.3 Fig. 2(a): the phase-matching wavelength is set by the ring width within the paper''s own data; the batch argument rested on an unstated thermal tuning rate (coordinator Q4, row kept)'
