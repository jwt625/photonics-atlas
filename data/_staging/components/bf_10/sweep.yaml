    basis: author_estimate
    notes: 'Stated 0.4 dB/m converted to dB/cm; FEM thermal plus Kerr response fit. Not a total propagation loss. Fig. 2(d) labels the probe at 1545 nm; the pumped resonance wavelength is not stated. Basis
