    notes: 'Stated 7.3 dB/m converted to dB/cm. Wavelength of the wafer map not stated. Basis author_estimate (D76): group index of the 2 um racetrack not stated (ng ~2.25 is given for the MZM waveguide).'
    why: 'D76: Q / kappa0-derived loss with the group index of the racetrack not stated -> author_estimate (as cai2025 / powell2024a: author_estimate wins over the dB/m to dB/cm conversion); source p.3
      and Extended Data Fig. 1 (kappa0/2pi -> dB/m, no ng); the only ng (~2.25, p.5) is for the 1.2 um MZM waveguide'
