# Convention sweep D76 / D80 / D82 (subagent, 2026-10-20); applied after patch.yaml.
metrics:
  cmp_chen2026_ring_loss-m1:
    basis: author_estimate
    notes: 'Text: about 0.5 dB/cm from a Lorentz fit of the ring transmission; Fig. 2(c) caption: less than 0.5 dB/cm. Wavelength not stated; 1550 nm is the MZM operating wavelength. Basis author_estimate
      (D76): loss computed by the authors from the fitted ring Q (''through calculation'', p.5); the Q is not stated and the stated group index 2.2 (p.5) is that of the MZM optical mode, so the conversion
      inputs are not all stated.'
    why: 'D76 / D44: loss computed from a ring fit is derived only when its inputs are stated; source p.4-5 (''Through calculation'', Lorentz fit): the ring Q is not printed and ng = 2.2 (p.5) is given
      for the MZM optical mode in the velocity-matching paragraph -> author_estimate (supersedes the bf_10 audit''s derived)'
  cmp_wang2024b_racetrack_2um_optical-m1:
    basis: author_estimate
    notes: 'Stated 5.6 dB/m converted to dB/cm; wavelength computed from the stated resonance at 209.358 THz. Basis author_estimate (D76): group index of the 2 um racetrack not stated (ng ~2.25 is given
      for the MZM waveguide).'
    why: 'D76: Q / kappa0-derived loss with the group index of the racetrack not stated -> author_estimate (as cai2025 / powell2024a: author_estimate wins over the dB/m to dB/cm conversion); source p.3
      and Extended Data Fig. 1 (kappa0/2pi -> dB/m, no ng); the only ng (~2.25, p.5) is for the 1.2 um MZM waveguide'
  cmp_wang2024b_racetrack_2um_optical-m2:
