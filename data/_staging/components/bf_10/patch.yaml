# Audit patch bf_10 (fresh-context audit 2026-10-20), main block only (optional Block B not applied).
components:
  cmp_celik2022_ring_r120um:
    facility_org_ids: org_stanford_nano_shared_facilities;org_stanford_nanofabrication_facility
    notes: 'Ring at the 120 um minimum bend radius used across the chip, fabricated to bound losses (p.5). The 1.6 dB/cm derived from Q_i is held by EO row celik2022-a (not re-entered). Extraction model
      and loaded Q not stated. Facility: part of the work performed at Stanford Nano Shared Facilities and Stanford Nanofabrication Facility (acknowledgments, p.8); both entered as the pre-merger facility
      orgs printed in the paper (time-aware facility rule; org_nano_stanford is their 2026 merged successor). Fab org not set: authors at Stanford, Flux Photonics and NTT Research; who fabricated is not
      stated.'
    why: '''performed at'' SNSF and SNF (p.8) -> facility (D42); registry round 2 holds SNSF and SNF as separate time-aware orgs, the 2022 paper predates the 2026 merger'
  cmp_celik2022_gc_780:
    facility_org_ids: org_stanford_nano_shared_facilities;org_stanford_nanofabrication_facility
    notes: 'I/O grating couplers of the 780 nm MZI; output GC described as focusing on-chip light into a collimated Gaussian beam (Fig. 1 caption). The 10 % figure is held only in the EO row notes. Background
      ripple in Fig. 3(d) attributed to the GC response. Facility: part of the work performed at Stanford Nano Shared Facilities and Stanford Nanofabrication Facility (acknowledgments, p.8); both entered
      as the pre-merger facility orgs printed in the paper (time-aware facility rule; org_nano_stanford is their 2026 merged successor). Fab org not set: authors at Stanford, Flux Photonics and NTT Research;
      who fabricated is not stated.'
    why: '''performed at'' SNSF and SNF (p.8) -> facility (D42); registry round 2 holds SNSF and SNF as separate time-aware orgs, the 2022 paper predates the 2026 merger'
  cmp_celik2022_dc_5050:
    facility_org_ids: org_stanford_nano_shared_facilities;org_stanford_nanofabrication_facility
    notes: 'Beam splitter / combiner of the MZI (celik2022-a). Coupler length chosen by fabricating path-length-mismatched MZIs and picking the highest-contrast fringes (p.5); the fabricated split ratio
      is not reported; the MZI static ER 27 dB is in the EO row. Facility: part of the work performed at Stanford Nano Shared Facilities and Stanford Nanofabrication Facility (acknowledgments, p.8); both
      entered as the pre-merger facility orgs printed in the paper (time-aware facility rule; org_nano_stanford is their 2026 merged successor). Fab org not set: authors at Stanford, Flux Photonics and
      NTT Research; who fabricated is not stated.'
    why: '''performed at'' SNSF and SNF (p.8) -> facility (D42); registry round 2 holds SNSF and SNF as separate time-aware orgs, the 2022 paper predates the 2026 merger'
  cmp_zhu2022_lensed_fiber_facet:
    fab_org_ids: org_hyperlight
    notes: 'Per-facet term of the 11 dB total insertion loss (EO row zhu2022-a); 0.5 dB/facet and 2.7 dB/m are projections cited to refs. 45-46 (not entered). Facility: device fabrication performed at Harvard
      CNS (acknowledgments, p.6). Fab: L.H., C.R. and M.Z. fabricated the modulator (contributions, p.6), all three HyperLight Corporation (D72).'
    why: 'D72: the three fabricating authors are all HyperLight (affiliation 4, p.1; contributions p.6); batch note ''not all at one organization'' is wrong'
  cmp_wang2024b_racetrack_2um_optical:
    fab_org_ids: org_epfl
    notes: 'Optical-grade (unreduced) LTOI racetracks, wafer D101_LT_A2. Not part of the EO devices (MZMs use a 220 nm etch), so host empty. Losses are the authors'' conversions of comb-calibrated intrinsic
      loss rates kappa0/2pi (26.8 MHz best device, 35.2 MHz best-field mean, field means 35.2-72.9 MHz; histogram mean 40.4 and median 36.4 MHz, Fig. 2c, not converted by the authors; entered as kappa_intrinsic_mhz,
      D73). Sidewall almost 70 deg in the SEM cross-section (Fig. 1j). Samples fabricated in EPFL CMi and the IPHYS cleanroom (acknowledgments, p.9); LTOI wafers made at Shanghai Novel Si Integration Technology
      (NSIT) and SIMIT-CAS (wafer supplier, a note). Fab: C.W. and Z.L. fabricated the devices (contributions, p.9), both EPFL-affiliated (C.W. also SIMIT), in the EPFL CMi / IPHYS cleanrooms (D72 as extended
      by D76; wang2024a precedent).'
    why: 'D72/D76: both fabricating authors (C.W., Z.L., p.9) share EPFL, samples fabricated in EPFL CMi and IPHYS (p.9); consistent with wang2024a (bf_05 audit)'
  cmp_wang2024b_racetrack_2um_acoustic:
    fab_org_ids: org_epfl
    notes: 'Same racetrack design on LTOI made from reduced bulk wafers (sibling material, separate row). Field values 39-135 MHz in Extended Data Fig. 1(b) (one field damaged, NA) not converted by the
      authors and not entered. Samples fabricated in EPFL CMi and the IPHYS cleanroom (acknowledgments, p.9); LTOI wafers made at Shanghai Novel Si Integration Technology (NSIT) and SIMIT-CAS (wafer supplier,
      a note). Fab: C.W. and Z.L. fabricated the devices (contributions, p.9), both EPFL-affiliated (C.W. also SIMIT), in the EPFL CMi / IPHYS cleanrooms (D72 as extended by D76; wang2024a precedent).'
    why: 'D72/D76: both fabricating authors (C.W., Z.L., p.9) share EPFL, samples fabricated in EPFL CMi and IPHYS (p.9); consistent with wang2024a (bf_05 audit)'
  cmp_wang2024b_spiral_1p75um:
    fab_org_ids: org_epfl
    notes: 'Spiral D101_LT_A2_F2_C7_Spiral5, 5 x 2 mm footprint, OFDR loss extraction; group index 2.25 entered (D75); beta2 -163 fs2/mm (no matching parameter); 300 um long tapers at the facets (geometry
      only). Minor defect at 3.36 m optical distance. Samples fabricated in EPFL CMi and the IPHYS cleanroom (acknowledgments, p.9); LTOI wafers made at Shanghai Novel Si Integration Technology (NSIT) and
      SIMIT-CAS (wafer supplier, a note). Fab: C.W. and Z.L. fabricated the devices (contributions, p.9), both EPFL-affiliated (C.W. also SIMIT), in the EPFL CMi / IPHYS cleanrooms (D72 as extended by D76;
      wang2024a precedent).'
    why: 'D72/D76: both fabricating authors (C.W., Z.L., p.9) share EPFL, samples fabricated in EPFL CMi and IPHYS (p.9); consistent with wang2024a (bf_05 audit)'
  cmp_wang2024b_lensed_fiber_facet:
    fab_org_ids: org_epfl
    notes: 'Coupling loss stated for the photorefraction test (uncladded LTOI and LNOI racetracks, 80 GHz FSR), identical for both samples; facet / taper design not stated. Not linked to the MZM rows (their
      coupling loss is not reported). The uncladded LTOI and LNOI racetracks of this test are entered as cmp_wang2024b_racetrack_uncladded_ltoi / _lnoi (D73 rates). Samples fabricated in EPFL CMi and the
      IPHYS cleanroom (acknowledgments, p.9); LTOI wafers made at Shanghai Novel Si Integration Technology (NSIT) and SIMIT-CAS (wafer supplier, a note). Fab: C.W. and Z.L. fabricated the devices (contributions,
      p.9), both EPFL-affiliated (C.W. also SIMIT), in the EPFL CMi / IPHYS cleanrooms (D72 as extended by D76; wang2024a precedent).'
    why: 'D72/D76: both fabricating authors (C.W., Z.L., p.9) share EPFL, samples fabricated in EPFL CMi and IPHYS (p.9); consistent with wang2024a (bf_05 audit)'
  cmp_wang2024b_soliton_comb_81ghz:
    fab_org_ids: org_epfl
    notes: 'Device D101_LT_A2_F9_C4_02_WG6. Single soliton, sech2 spectrum with 4.9 THz 3 dB bandwidth (63 fs pulse); no comb-bandwidth parameter. Pumped with an ECDL plus EDFA at 90 mW on-chip using rapid
      single-sideband tuning. Solitons formed in all ten tested devices oriented at 90 deg and in none of ten at 0 deg (Raman). Samples fabricated in EPFL CMi and the IPHYS cleanroom (acknowledgments, p.9);
      LTOI wafers made at Shanghai Novel Si Integration Technology (NSIT) and SIMIT-CAS (wafer supplier, a note). Fab: C.W. and Z.L. fabricated the devices (contributions, p.9), both EPFL-affiliated (C.W.
      also SIMIT), in the EPFL CMi / IPHYS cleanrooms (D72 as extended by D76; wang2024a precedent).'
    why: 'D72/D76: both fabricating authors (C.W., Z.L., p.9) share EPFL, samples fabricated in EPFL CMi and IPHYS (p.9); consistent with wang2024a (bf_05 audit)'
  cmp_wang2024b_soliton_comb_30ghz:
    fab_org_ids: org_epfl
    notes: 'Device D101_LT_A2_F3_C6_01_WG3. Single soliton 4.0 THz bandwidth (71 fs); three-soliton state on another device (F2_C4_01_WG3); beat-note phase noise -86 dBc/Hz at 10 kHz and -114 dBc/Hz at
      1 MHz (no phase-noise parameter). Pumped with an ECDL plus EDFA at 90 mW on-chip using rapid single-sideband tuning. Solitons formed in all ten tested devices oriented at 90 deg and in none of ten
      at 0 deg (Raman). Samples fabricated in EPFL CMi and the IPHYS cleanroom (acknowledgments, p.9); LTOI wafers made at Shanghai Novel Si Integration Technology (NSIT) and SIMIT-CAS (wafer supplier,
      a note). Fab: C.W. and Z.L. fabricated the devices (contributions, p.9), both EPFL-affiliated (C.W. also SIMIT), in the EPFL CMi / IPHYS cleanrooms (D72 as extended by D76; wang2024a precedent).'
    why: 'D72/D76: both fabricating authors (C.W., Z.L., p.9) share EPFL, samples fabricated in EPFL CMi and IPHYS (p.9); consistent with wang2024a (bf_05 audit)'
metrics:
  cmp_he2019_vac_si_ln-m1:
    scope: per_component
    why: 'D76: on-chip inter-layer transitions are per_component (per_interface is chip-chip only)'
  cmp_he2019_vac_si_ln-m2:
    scope: per_component
    why: 'D76: on-chip inter-layer transitions are per_component (per_interface is chip-chip only)'
  cmp_he2019_vac_si_ln-m3:
    scope: per_component
    why: 'D76: on-chip inter-layer transitions are per_component (per_interface is chip-chip only)'
  cmp_chen2026_ring_loss-m1:
    basis: derived
    notes: 'Text: about 0.5 dB/cm from a Lorentz fit of the ring transmission; Fig. 2(c) caption: less than 0.5 dB/cm. Wavelength not stated; 1550 nm is the MZM operating wavelength. Basis derived (D76):
      loss computed by the authors from the fitted ring Q (''through calculation'', p.5); Q not stated, group index 2.2 stated (p.5).'
    why: 'D76: propagation loss computed from a ring fit is derived, not measured'
