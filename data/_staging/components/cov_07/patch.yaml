delete_components:
- id: cmp_lit_raja2019_ring_88p6ghz
  why: 'Q1 / D259, D408: p.6 introduces the sub-100 GHz devices with Q0 about 8e6 and attributes soliton generation at that Q to ref. 26 (= liu2018a, the authors'' own paper); the p.7 Methods values of the Fig. 4(d) ring (Q0 8.2e6, FSR 88.6 GHz, D2/2pi 1.10 MHz, width 1.58 um) equal the liu2018a 88 GHz device (p.3-4: Q0 > 8.2e6, D1/2pi 88.63 GHz, D2/2pi 1.10 MHz, 1.58 x 0.75 um2) to every printed digit; the row carries no value of this paper beyond them (the Fig. 4(d) breather spectra give no metric)'
