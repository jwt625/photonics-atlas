# Audit patch cov_07 (fresh-context audit 2026-11-07, DevLog/audits/2026-11-07-cov_07-audit.md).
# 145 metrics: 118 ok / 24 imprecise / 3 wrong (Q1); 38 components: 34 ok / 3 imprecise (Q3) / 1 wrong (Q1).
# Misses added: 9 metrics (poulton2016 film / BOX thickness on the 3 MMIs and the IR edge coupler, raja2019 149 GHz ring height).
# Coordinator choices: to keep raja2019 ring_88p6ghz (Q1 alternative) replace the delete_components op by a metrics op
# setting ring_88p6ghz-m3 basis derived (printed 1.58 um, D256; an op on a deleted row breaks the re-run); to keep shen2020 packaging orgs out (Q3 alternative) drop the five shen2020 component ops; to keep
# raja2019 comb rows on channel_spacing_ghz (Q6 alternative) drop the two parameter ops.
components:
  cmp_lit_shen2020_turnkey_comb_40ghz:
    fab_org_ids: org_epfl;org_freedom_photonics;org_ucsb;org_caltech
    notes: 'Fab: author contributions (p.6) say J.L., R.N.W., J.H. and T.L. (EPFL) designed and fabricated the Si3N4 chips (org_epfl); the DFB pump laser was fabricated by Freedom Photonics (p.7 Appendix B); D.K., L.C. (UCSB) and B.S., Q.-F.Y. (Caltech) packaged the chip (p.6): the butt-coupled DFB / Si3N4 assembly is mounted in a butterfly package to facilitate measurements (p.2, Fig. 1(D)) and the microcombs are described as generated in these butterfly packaged devices (p.4), so org_ucsb and org_caltech on the assembled comb rows (D399). The feedback-phase study (Fig. 4(C)) adjusted the laser-chip gap with a piezo stage (p.8 Appendix C). Cached text is the arXiv v1 of the Nature paper (same work, D430 / D433). Pump 1556 nm, up to 30 mW launched into the microresonator; locking bandwidth estimated 5 GHz; turnkey success probability vs feedback phase (Fig. 4(C), 100 attempts per point) not entered (no parameter).'
    why: 'Q3 / D399: p.6 author contributions name the UCSB and Caltech authors who packaged the chip (the assembly of the comb rows); p.2 and p.4 tie the comb measurements to the butterfly-packaged devices'
  cmp_lit_shen2020_turnkey_comb_20ghz:
    fab_org_ids: org_epfl;org_freedom_photonics;org_ucsb;org_caltech
    notes: 'Fab: author contributions (p.6) say J.L., R.N.W., J.H. and T.L. (EPFL) designed and fabricated the Si3N4 chips (org_epfl); the DFB pump laser was fabricated by Freedom Photonics (p.7 Appendix B); D.K., L.C. (UCSB) and B.S., Q.-F.Y. (Caltech) packaged the chip (p.6): the butt-coupled DFB / Si3N4 assembly is mounted in a butterfly package to facilitate measurements (p.2, Fig. 1(D)) and the microcombs are described as generated in these butterfly packaged devices (p.4), so org_ucsb and org_caltech on the assembled comb rows (D399). The feedback-phase study (Fig. 4(C)) adjusted the laser-chip gap with a piezo stage (p.8 Appendix C). Cached text is the arXiv v1 of the Nature paper (same work, D430 / D433). Pump 1556 nm, up to 30 mW launched into the microresonator; locking bandwidth estimated 5 GHz; turnkey success probability vs feedback phase (Fig. 4(C), 100 attempts per point) not entered (no parameter).'
    why: 'Q3 / D399: p.6 author contributions name the UCSB and Caltech authors who packaged the chip (the assembly of the comb rows); p.2 and p.4 tie the comb measurements to the butterfly-packaged devices'
  cmp_lit_shen2020_turnkey_comb_15ghz:
    fab_org_ids: org_epfl;org_freedom_photonics;org_ucsb;org_caltech
    notes: 'Fab: author contributions (p.6) say J.L., R.N.W., J.H. and T.L. (EPFL) designed and fabricated the Si3N4 chips (org_epfl); the DFB pump laser was fabricated by Freedom Photonics (p.7 Appendix B); D.K., L.C. (UCSB) and B.S., Q.-F.Y. (Caltech) packaged the chip (p.6): the butt-coupled DFB / Si3N4 assembly is mounted in a butterfly package to facilitate measurements (p.2, Fig. 1(D)) and the microcombs are described as generated in these butterfly packaged devices (p.4), so org_ucsb and org_caltech on the assembled comb rows (D399). The feedback-phase study (Fig. 4(C)) adjusted the laser-chip gap with a piezo stage (p.8 Appendix C). Cached text is the arXiv v1 of the Nature paper (same work, D430 / D433). Pump 1556 nm, up to 30 mW launched into the microresonator; locking bandwidth estimated 5 GHz; turnkey success probability vs feedback phase (Fig. 4(C), 100 attempts per point) not entered (no parameter).'
    why: 'Q3 / D399: p.6 author contributions name the UCSB and Caltech authors who packaged the chip (the assembly of the comb rows); p.2 and p.4 tie the comb measurements to the butterfly-packaged devices'
  cmp_lit_shen2020_dfb_pump:
    notes: 'Fab: author contributions (p.6) say J.L., R.N.W., J.H. and T.L. (EPFL) designed and fabricated the Si3N4 chips (org_epfl); the DFB pump laser was fabricated by Freedom Photonics (p.7 Appendix B). Packaging by D.K., L.C. (UCSB) and B.S., Q.-F.Y. (Caltech) (p.6) is entered on the assembled comb rows only, not on this chip part (D399). Cached text is the arXiv v1 of the Nature paper (same work, D430 / D433). Platform empty: DFB material not stated (D422 / D423). Not entered: current tuning about -1.4 GHz/mA (static current tuning is not an FM efficiency, D83g), frequency-noise suppression about 30 dB when feedback-locked (no parameter).'
    why: Consequence of Q3 (packaging orgs on the assembled comb rows only); drop together with the comb-row ops if the coordinator keeps the distiller's call
  cmp_lit_shen2020_ring_fig1b:
    notes: 'Fab: author contributions (p.6) say J.L., R.N.W., J.H. and T.L. (EPFL) designed and fabricated the Si3N4 chips (org_epfl); the DFB pump laser was fabricated by Freedom Photonics (p.7 Appendix B). Packaging by D.K., L.C. (UCSB) and B.S., Q.-F.Y. (Caltech) (p.6) is entered on the assembled comb rows only, not on this chip part (D399). Cached text is the arXiv v1 of the Nature paper (same work, D430 / D433). One row for the resonance of Fig. 1(B): the device is not identified, so the Q is not attached to a comb row (D159 / D458).'
