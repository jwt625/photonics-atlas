# Audit patch lit_50 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_50-audit.md).
# 153 metrics: 136 ok / 16 imprecise / 1 wrong (valdez2025 fill_factor, deleted);
# 30 components: 20 ok / 10 changed / 0 deleted; misses: 2 components + 27 metrics added (deng2024 Supp. Note5
# filters, valdez2025 two-coupler transmission, ribeiro2016 core thickness).
# Not covered here (coordinator / registry): University of Washington WNF (lu2015 facility), Europractice MPW service
# (ribeiro2016 fab, D398), registry gaps listed in the audit file.
components:
  cmp_lit_lu2015_bc3db_coupler_design:
    row_kind: fabricated
    notes: 'Sub-element of cmp_lit_lu2015_pbs_point_symmetric (two copies, the second point-symmetry transformed). Only simulated performance (3D FDTD, p.5 Fig. 3); row_kind fabricated because the coupler exists on the fabricated chip inside every PBS (D80e; the id keeps its _design suffix). Design method from the authors'' earlier work [18], but both-side tapers differ from [18] (p.4) and the geometry is this paper''s Fig. 2(b) (labels): S-bend 2 um offset over 5 um, coupling sections 22.5 um and 13 um at 500 nm gap with 500 nm widths, 1 um tapers, 6.2 um phase-shifter section with 400 nm / 600 nm widths (phase-shifter widths not entered: no role parameter). Fab: the devices were fabricated by a named UW staff member at the University of Washington WNF, part of NSF NNIN (p.10 Acknowledgments): fab org_university_washington (eid2016 precedent); the Washington Nanofabrication Facility is missing from the registry (reported), facility empty. EBL on SOI (p.6 Sec. 4.1). CMC Microsystems acknowledged for design software only (not a fab / facility role).'
    why: 'D80e: row_kind design only for parts not fabricated; p.4-5 Sec. 3 and p.6 Sec. 4.1: the two 3 dB couplers are the building blocks of every fabricated PBS (Fig. 2(a), Fig. 5 SEM)'
  cmp_lit_valdez2025_twig_1d:
    fab_org_ids: org_applied_nanotools
    notes: 'Highest-performing 1D TWIG of a 15-device array of etch-width-bias / alignment-error corrections; this device carries a -5 nm etch-width-bias and a -10 nm alignment-error correction (p.6). Apodized, adjoint-optimized geometry with three scatterers per local period (two full 220 nm etches, one 70 nm partial etch), N = 24 local periods (p.3); initial uniform-grating parameters on cmp_lit_valdez2025_twig_design. Coupler efficiency eta_GC = sqrt(Pout / (Pin Twg)) of the two-coupler structure with the waveguide transmission Twg from the authors'' own Fabry-Perot fit (1.35 dB/cm, cmp_lit_valdez2025_sm_waveguide); maximum structure transmission 47.8 % at 1555.5 nm (p.5, m18). Fabry-Perot fit gives a grating power reflectivity of 4.35 % (p.5; no reflectivity parameter for fiber_chip_coupler, registry gap). Abrupt drop near 1528 nm attributed to the test station (p.6). Fab: devices ''submitted to the commercial foundry Applied Nanotools for fabrication'' (p.4 Sec. 5; also abstract, p.7): fab org_applied_nanotools (registry org). EBL process, minimum CD 70 nm full etch / 160 nm partial etch enforced in the design (p.3).'
    why: 'p.4 Sec. 5 names Applied Nanotools as the fabricating foundry; org_applied_nanotools exists in data/registry/organizations.csv (61 merged rows use it), so the batch note "missing from the registry" is wrong'
  cmp_lit_valdez2025_twig_focusing:
    fab_org_ids: org_applied_nanotools
    notes: 'Radial version of the optimized TWIG: radial etches span 22 deg and begin after a 24.35 um offset to reach an approximate 10.4 um MFD (p.4). Highest-performing focusing TWIG of a 15-device array; it carries a -10 nm etch-width-bias and a -10 nm alignment-error correction (p.6). Not entered (array-level trends, Figs. 7-8, p.6): over +/- 10 nm etch-width corrections the peak wavelength shifts by about 30 nm and the peak efficiency drops from 85 % to 50 %; a +10 nm bias device shows back reflections up to 20 % (-7 dB) beyond 1540 nm; alignment-error corrections of +/- 10 nm change little. Same test structure and efficiency extraction as cmp_lit_valdez2025_twig_1d. Fab: devices ''submitted to the commercial foundry Applied Nanotools for fabrication'' (p.4 Sec. 5; also abstract, p.7): fab org_applied_nanotools (registry org). EBL process, minimum CD 70 nm full etch / 160 nm partial etch enforced in the design (p.3).'
    why: 'p.4 Sec. 5 fabrication statement; org_applied_nanotools is in the registry'
  cmp_lit_valdez2025_twig_design:
    row_kind: fabricated
    fab_org_ids: org_applied_nanotools
    notes: 'Optimized 2D design from which the 1D and focusing TWIGs are generated (p.4); its uncorrected version (0 nm etch-width bias, 0 nm alignment correction, ''Base Design'') was fabricated in both 15-device arrays (p.5 Sec. 5, p.6 Fig. 7), so row_kind fabricated (D80e) although only simulated values are entered here. Initial (pre-optimization, unapodized, uniform) parameters from Table 1 (p.3): period 637 nm, D 85 %, H1 = H2 = 220 nm, H3 = 70 nm, scatterer offsets d1 = 194 nm and d2 = 246 nm (no role parameter). D is defined per scatterer (each of the three scatterers is W = (1 - D) x period wide, p.2; Eq. (3) weights the unetched waveguide by 3D - 2), so it is not the single tooth / period fill factor of the registry (D253) and is not entered as fill_factor. The optimized local periods and widths are apodized and not printed. Simulated tolerances (Fig. 3, p.4): +/- 10 nm etch-width bias significantly reduces peak efficiency and shifts the spectrum; partial-etch depth error mainly shifts the centre wavelength; +/- 10 nm alignment error has little effect. Fab: devices ''submitted to the commercial foundry Applied Nanotools for fabrication'' (p.4 Sec. 5; also abstract, p.7): fab org_applied_nanotools (registry org). EBL process, minimum CD 70 nm full etch / 160 nm partial etch enforced in the design (p.3).'
    why: 'D80e: the base design exists on the fabricated chip (p.5 Sec. 5: arrays include 0 nm bias / 0 nm alignment devices; p.6 Fig. 7 "Base Design" curves); fab org from p.4 Sec. 5; fill_factor reasoning moved to notes (deleted metric below)'
  cmp_lit_valdez2025_sm_waveguide:
    fab_org_ids: org_applied_nanotools
    notes: 'Loss from a fit of the Fabry-Perot fringes (FSR 0.029 nm, cavity = the 1.03 cm grating separation) of the best 1D TWIG test structure to an analytical lossy cavity, grating reflectivity free (fit 4.35 %) (p.5, D394 standard fit). The foundry''s reported average -1.2 dB/cm (p.5) is not entered (foundry value, not this paper''s measurement). Fab: devices ''submitted to the commercial foundry Applied Nanotools for fabrication'' (p.4 Sec. 5; also abstract, p.7): fab org_applied_nanotools (registry org). EBL process, minimum CD 70 nm full etch / 160 nm partial etch enforced in the design (p.3).'
    why: 'p.4 Sec. 5 fabrication statement covers the whole test structure incl. the waveguide; org_applied_nanotools is in the registry'
  cmp_lit_deng2024_ring_topic_r0p7:
    class: resonator.ring
    tags: ring;add_drop;topic_bend
    notes: 'Smallest radius with single-guided-mode add-drop spectra (p.7, Fig. 5(a),(d)). Standalone add-drop test ring of the radius series used for FSR and roundtrip-loss extraction (Fig. 5(b)-(c)), not a channel filter in a WDM path (the filter rings are R = 2 um, p.7-9), hence resonator.ring (skill rule 10, D400; audit lit_50 Q1). Roundtrip loss plotted only (Fig. 5(c)); no roundtrip-loss parameter (registry gap). Fab org_imec: ''fabrication is done using imec''s most advanced iSiPP300 platform'' with 193 nm immersion lithography (p.7 Fig. 5 caption); all authors at imec; author contributions name the fabricating co-authors (p.11). TOPIC bend angles theta_p,i = 43.2 deg / theta_p,o = 62.35 deg for all rings (p.7).'
    why: 'p.7 Sec. 3 / Fig. 5: the R = 0.7 um ring demonstrates radius scaling (FSR, roundtrip loss), it is not part of a WDM path; D400 keeps wdm.mrr for channel filters in a WDM path; the eid2016 precedent is a dedicated add-drop filter device'
  cmp_lit_deng2024_ring_topic_r1p2:
    class: resonator.ring
    tags: ring;add_drop;topic_bend
    notes: 'Wafer-scale add-drop characterization (300 mm wafer, p.7, Fig. 5(e)). Standalone add-drop ring of the radius series (Fig. 5(b)-(c)), not a channel filter in a WDM path (the filter rings are R = 2 um), hence resonator.ring (skill rule 10, D400; audit lit_50 Q1); the drop-port FWHM is stored as linewidth_mhz (resonator widths, D250). Roundtrip loss about 0.05 dB for R >= 1.2 um (p.7; no roundtrip-loss parameter, registry gap). Fab org_imec: ''fabrication is done using imec''s most advanced iSiPP300 platform'' with 193 nm immersion lithography (p.7 Fig. 5 caption); all authors at imec; author contributions name the fabricating co-authors (p.11). TOPIC bend angles theta_p,i = 43.2 deg / theta_p,o = 62.35 deg for all rings (p.7).'
    why: 'p.7 Sec. 3 / Fig. 5: radius-series test ring, not in the WDM path; D400 / skill rule 10'
  cmp_lit_deng2024_wdm_32x100ghz:
    notes: '4-channel cascaded MZI interleaver (spiral phase shifters; first lattice filter with two phase-shifting stages, three DCs with cross-coupling 0.5 / 0.29 / 0.08, second stage double arm length) splitting into 4 buses of 8 rings at 400 GHz, staggered by 100 GHz; 36 heaters driven in parallel, aligned to the CW-WDM MSA 100 GHz grid centred at 1300 nm (p.9, p.11 Methods, Fig. 7). Not entered: filter tuning efficiency 283 GHz/mW per channel (author estimate from the ring and spiral characterizations with an assumed maximum 2 pi per interleaver shifter, p.10-11 Methods; no GHz/mW parameter, registry gap); interleaver as its own row (no own measured values). The untuned 8x400 GHz and 16x200 GHz TOPIC-ring filters of Supplementary Note5 (cached, p.18) are cmp_lit_deng2024_wdm_8x400ghz and cmp_lit_deng2024_wdm_16x200ghz. Fab org_imec: ''fabrication is done using imec''s most advanced iSiPP300 platform'' with 193 nm immersion lithography (p.7 Fig. 5 caption); all authors at imec; author contributions name the fabricating co-authors (p.11). TOPIC bend angles theta_p,i = 43.2 deg / theta_p,o = 62.35 deg for all rings (p.7).'
    why: 'the supplement is part of the cached text (p.15-18, Supplementary Information with Notes 1-5); the batch note "supplement not cached" is wrong; the two filters are added below'
  cmp_lit_taballione2019_thermo_optic_ps:
    notes: 'Designed to allow a 3/2 pi phase shift each (p.3 Sec. 2; fraction confirmed on the page render); a full period of the calibration sinusoid is not reached (p.5). Phase follows phi(U) = c + d U^2, fitted per element (p.4). Not entered: MZI splitting ratio adjustable between 5 % and 95 % on average and phase offset mean about 3.5 rad (std 1.85 rad) (p.5; no matching parameter). Heater geometry not printed (tunable-element length in Table 1 is cited). No fab org: the waveguide technology is described passively (LPCVD stoichiometric Si3N4, double-stripe cross-section citing [33], p.3); co-authors at LioniX International (org_lionix_international) and QuiX BV, but no fabrication statement. QuiX BV is missing from the registry.'
    why: 'p.3 Sec. 2 (page render): the 128 tunable elements are designed for a 3/2 pi phase shift, not 2 pi as the batch note said'
  cmp_lit_taballione2019_double_stripe_wg:
    tags: double_stripe
    why: 'the word TriPleX appears only in the title of reference [33] (p.14), not in the paper''s own text; tags carry what the paper states'
