delete_metrics:
  - id: cmp_lit_valdez2025_twig_design-m4
    why: 'p.2 Sec. 2 / p.3 Eq. (3) and Table 1: D = 85 % is the unetched fraction per scatterer (each of three scatterers per local period is (1 - D) x period wide; Eq. (3) gives the unetched waveguide fraction 3D - 2 = 0.55), not the tooth / period fill factor of a single-etch grating (D253); stored as 0.85 it would make the gc_1d view draw one 85 % tooth per period (Fig. 2(a) shows three etches per period). Value and definition kept in the component notes'
add_components:
  - component_id: cmp_lit_deng2024_wdm_8x400ghz
    source_id: lit:deng2024
    class: wdm.mrr
    label: 'Si TOPIC-ring WDM 8x400 GHz demux: 8 add-drop rings (R = 2 um) on one bus, without tuning'
    row_kind: fabricated
    platform: soi
    core_material: 'Si (SOI), nominal 220 nm'
    fab_org_ids: org_imec
    tags: mrr;demux;topic_bend;untuned;o_band
    verified_on: '2026-10-29'
    notes: 'Supplementary Note5 (cached in text.md, p.18): TOPIC rings configured as an 8x400 GHz WDM filter without tuning (microscope image Fig. S2(a), spectra Fig. S2(c)); rings drop sequentially from one bus, so IL accumulates and channel isolation drops with ring count (p.18). Ring geometry per the Fig. S2 caption: R = 2 um, 380 nm nominal width outside the varying-width regions, TOPIC angles theta_p,i = 43.2 deg / theta_p,o = 62.35 deg, coupling straights varied per ring to set the channel spacing. Gap not entered: the caption gives a 150 nm coupling gap for all rings and, in the next sentence, a nominal ring-bus gap of 158 nm for this 8x400 GHz filter (D159). Same TOPIC ring family as the 32x100 GHz filter (cmp_lit_deng2024_wdm_32x100ghz). Fab org_imec: all authors at imec; author contributions name the co-authors responsible for device fabrication (p.11); the process platform of these filters is not named.'
    why: 'miss: p.18 Supp. Note5 and Fig. S2(c) report a measured filter with its own IL and channel isolation; the supplement is in the cached text (p.15-18), contrary to the batch report'
  - component_id: cmp_lit_deng2024_wdm_16x200ghz
    source_id: lit:deng2024
    class: wdm.mrr
    label: 'Si TOPIC-ring WDM 16x200 GHz demux: 16 add-drop rings (R = 2 um) on one bus, without tuning'
    row_kind: fabricated
    platform: soi
    core_material: 'Si (SOI), nominal 220 nm'
    fab_org_ids: org_imec
    tags: mrr;demux;topic_bend;untuned;o_band
    verified_on: '2026-10-29'
    notes: 'Supplementary Note5 (cached in text.md, p.18): TOPIC rings configured as a 16x200 GHz WDM filter without tuning (microscope image Fig. S2(b), spectra Fig. S2(d)); performance degraded vs 8x400 GHz because the smaller spacing under a fixed FSR lowers the isolation and the sequential drops accumulate IL (p.18). Ring geometry per the Fig. S2 caption: R = 2 um, 380 nm nominal width outside the varying-width regions, 150 nm gap (both caption statements agree for this filter), TOPIC angles theta_p,i = 43.2 deg / theta_p,o = 62.35 deg, coupling straights varied per ring. Fab org_imec: all authors at imec; author contributions name the co-authors responsible for device fabrication (p.11); the process platform of these filters is not named.'
    why: 'miss: p.18 Supp. Note5 and Fig. S2(d) report a second measured filter (IL, channel isolation)'
