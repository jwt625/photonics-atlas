  cmp_lit_kurczveil2013_taper_t1_si10:
    notes: 'Si-to-hybrid mode converter (rule 10: on-chip inter-material transition). three III/V taper levels start within 2.4 um of each other (Fig. 2
      labels 1.2 um / 1.2 um); final III/V taper 80 um; Si tapered to 2 um for 100 um before the first III/V tip, then to 1.0 um at the start of the final
      level (p.3-4). Simulated QW confinement 15.6 % in the hybrid waveguide (p.4, Fig. 4; no parameter). Back reflection not entered: Table 4 (p.10) gives
      R_t -44.0 dB (one device, no error bar), an upper limit set by the setup noise floor (FT of HR-OSA transmission of polished devices, TE, Fig. 10);
      back_reflection_db is not allowed on waveguide_platform (registry gap). Loss values are per taper: p.6 calls the Fig. 5(b) result the taper (pair)
      loss, but the abstract, Sec. 3.3 and Sec. 5 state the Table 2 range 0.22-0.57 dB per taper, and a check of the Fig. 5(b) slopes (about 1.66 dB per
      section for Type 1 - 1.0 um minus 0.64 dB hybrid loss, about 0.64 dB per section for Type 2 - 1.5 um minus 0.2 dB; audit reading of the fitted lines
      on a 400 dpi render) gives twice the Table 2 values, so the table is per taper. Table 2 footnotes cite Fig. 6 for what is Fig. 5 (D417). Passive chip
      with blue-shifted QWs (PL 1410 nm) so the III/V is transparent at 1550 nm (p.2-3). Fab empty: ''A passive chip was fabricated'' (passive voice, p.2);
      authors at UCSB (Kurczveil also HP Labs, Pintus also Scuola Superiore Sant''Anna). Measured with TE light at 1550 nm through 7 deg angled 2 um Si
      facets with lensed fibers, about 9.5 dB per facet (p.4-5).'
    why: 'Note arithmetic: the Type 2 - 1.5 um fitted line drops about 1.93 dB over 3 sections (0.64 dB per section, not 0.47); 0.64 - 0.2 = 0.44 = 2 x
      0.22 confirms the per-taper reading. p.6 Fig. 5(b)'
  cmp_lit_kurczveil2013_taper_t1_si15:
    notes: 'Si-to-hybrid mode converter (rule 10: on-chip inter-material transition). three III/V taper levels start within 2.4 um of each other (Fig. 2
