  cmp_lit_yuan2023_swg_dpmoc:
    platform: soi_strip
    notes: 'MZI with one SWG phase-shifter arm (L_PS about 8.5 um), Y length 5 um, branch spacing 1.5 um, input / output waveguides 1 um wide (p.3). SWG
      period 200 nm and duty cycle 50 % not entered: subwavelength_period_nm and fill_factor are not allowed on mode_converter (registry gap). Tapers n2
      = 14 periods, tip w2 = 0.16 um (p.4). EBL (100 keV) + ICP etch (p.5). Fab empty: passive ''has been fabricated'', all authors at HUST / WNLO (D80b).
      Measured through focused TE / TM GCs and on-chip mode MUX / DEMUX, normalized to reference GCs and mode (DE)MUXs on the same wafer (p.5-6); ASE 1530-1610
      nm. 20 Gb/s NRZ eye Q factors 10.1-14.4 at 1550 nm (Fig. 10) not entered. Simulated fabrication tolerance (+/-10 nm, IL increase below 1 dB for TE;
      p.5 Fig. 6) not entered (no parameter). The paper extends the authors'' ref. [25]; the values here are this device''s own. Platform soi_strip: p.3
      names the non-SWG arm a strip waveguide, Fig. 2 is computed for a 340 nm strip waveguide and the Fig. 1 cross-section shows a fully etched core (D434,
      D459).'
    why: 'Etch is stated: strip waveguide (p.3 Sec. III, p.3 Fig. 2 caption) and fully etched core in the p.2 Fig. 1 cross-section; D434 / D459 su2017 precedent'
  cmp_lit_caillaud2021_etched_facet_lens:
    notes: 'Shared facet lens design of the UTC photodiodes (cross-note: cmp_lit_caillaud2021_utc_* rows); D396 one row per class. The PD geometry used
      for the Fig. 3 tolerance scan is not stated. Fab empty (see the PD rows). Fig. 3 prints full widths of the 1-dB windows (audit trace: lateral about
      -7.2 to +8.3 um, vertical about -1.1 to +1.1 um, longitudinal from about -7.6 um to beyond the +10 um scan end); stored halved for the +/- convention
      of tol_1db_*.'
    why: Record the full-width reading behind the halved tolerance rows. p.2 Fig. 3
metrics:
  cmp_lit_caillaud2021_etched_facet_lens-m1:
    value: '7.5'
    basis: derived
    condition: lateral fiber displacement, 1-dB coupling tolerance, +/- value; fiber not restated for Fig. 3 (responsivity measurements use a lensed fiber,
      MFD 5.5 um)
    notes: 'printed ''lateral: 15 um'' (Fig. 3 label, p.2 text) is the full width of the 1-dB window: the trace crosses 0.79 relative response at about
      -7.2 and +8.3 um (audit reading, +/-0.3 um); halved for the +/- convention (ong2018, snyder2018)'
    why: tol_1db_lateral_um is a half-width (+/- value); the printed 15 um is the full window. p.2 Fig. 3
  cmp_lit_caillaud2021_etched_facet_lens-m2:
    value: '1.1'
    basis: derived
    condition: vertical fiber displacement (axis vertical), 1-dB coupling tolerance, +/- value
    notes: 'printed ''vertical: 2,2 um'' is the full width: the trace crosses 0.79 at about -1.06 and +1.06 um (audit reading); halved for the +/- convention;
      vertical axis stored in tol_1db_lateral_um with the axis in condition (merged practice, D460)'
    why: Full width printed, parameter is a half-width. p.2 Fig. 3
  cmp_lit_caillaud2021_etched_facet_lens-m3:
    value: '9'
    qualifier: gt
    basis: derived
    condition: longitudinal fiber displacement, 1-dB coupling tolerance, +/- value; limited by the -10 to +10 um scan
    notes: 'printed ''longitudinal: >18 um'' is the full span of the 1-dB window (trace above 0.79 from about -7.6 um to the +10 um scan end); halved for
      the +/- convention (dietrich2018, romerogarcia2014 longitudinal rows)'
    why: Full span printed; halved as the merged longitudinal rows. p.2 Fig. 3
  cmp_lit_caillaud2021_utc_4x15-m6:
    locator: p.2; p.2 Fig. 4; p.3 Fig. 5
    notes: 'printed 63 GHz with Fig. 4 and 62 GHz for the same point (-1 V, 1 mA) with Fig. 5 (p.2); one row kept: 63 GHz matches the printed 37 GHz bandwidth-efficiency
      product with 0.73 A/W (63 x 0.73 x 1.24 / 1.55 = 36.8), and the Fig. 4 4x15 and Fig. 5 -1 V traces (same curve shape) cross -3 dB at about 63 GHz
      (audit reading); 62 GHz kept in this note (D417)'
    why: Fig. 4 and Fig. 5 show one measurement of the same diode at the same bias and current; one metric row per operating point (rule 9). p.2; p.2 Fig.
      4; p.3 Fig. 5
  cmp_lit_caillaud2021_utc_6x50-m6:
    notes: printed 'still above 25 GHz'; Fig. 4 trace crosses -3 dB at about 26 GHz (audit reading on a 400 dpi render, +/-1 GHz).
    why: 'Figure re-read: the 6x50 trace crosses -3 dB near 26 GHz, not 27. p.2 Fig. 4'
  cmp_lit_caillaud2021_utc_5x25_biased-m1:
    notes: printed 'above 86 GHz' (p.3 body); conclusions print 86 GHz with 0.8 A/W; the introduction prints 85 GHz on 25 ohm load for the 0.8 A/W design
      (p.1, D417); Fig. 7 trace crosses -3 dB at about 85-90 GHz (audit reading).
    why: Conflicting printed value on p.1 not recorded. p.1 Introduction; p.3 Fig. 7
  cmp_lit_golshani2021_pvd_sin_wg_cband-m3:
    condition: example cut-back fit of one die shown in Fig. 3(b) (In_REF 0 cm reference and 1.5 / 4.0 / 7.5 cm spirals plotted)
    notes: 'Fig. 3(b) legend slope printed as negative dB/cm (sign dropped). Not a conflict with the p.2 best value 0.2 dB/cm: a least-squares line through
      the plotted 1.5 / 4.0 / 7.5 cm points gives about 0.15 dB/cm and through those points plus the 0 cm reference about 0.20 dB/cm (audit reading of the
      Fig. 3(b) points), so the legend slope appears to exclude the reference waveguide; the fit behind the stated values is not printed.'
    why: The 0 cm point is the reference waveguide, not a spiral; the legend / text difference is explained by the fit range rather than a printed conflict.
      p.2 Fig. 3(b)
  cmp_lit_golshani2021_pvd_sin_wg_cband-m4:
    condition: example cut-back fit of one die shown in Fig. 3(b) (In_REF 0 cm reference and 1.5 / 4.0 / 7.5 cm spirals plotted)
    notes: Fig. 3(b) legend slope printed as negative dB/cm (sign dropped). Fit through the 1.5 / 4.0 / 7.5 cm points gives about 0.25 dB/cm, with the 0
      cm reference about 0.29 dB/cm, near the stated 0.31 dB/cm (audit reading); the legend slope appears to exclude the reference waveguide.
    why: Same fit-range reading as m3. p.2 Fig. 3(b)
  cmp_lit_golshani2021_pvd_sin_wg_cband-m5:
    condition: example cut-back fit of one die shown in Fig. 3(b) (In_REF 0 cm reference and 1.5 / 4.0 / 7.5 cm spirals plotted)
    notes: Fig. 3(b) legend slope printed as negative dB/cm (sign dropped). Same fit as the 1550 / 1520 nm legend values (see m3, m4); no 1580 nm value
      in the text.
    why: Condition aligned with m3 / m4. p.2 Fig. 3(b)
  cmp_lit_golshani2021_pvd_sin_ring_r50-m1:
    notes: printed 'extracted Quality factor' 4.17e5, unqualified Q stored as loaded (skill pitfall). 1549 nm / 3.1 pm gives about 5.0e5, above the printed
      4.17e5; the paper does not say how the Q was extracted beyond the Lorentzian fit (D417, kept as printed).
    why: Printed Q and printed 3-dB width disagree by about 20 %. p.2 Sec. IV-B; p.2 Fig. 5 inset
  cmp_lit_her2022_mems_tunable_dc-m1:
    notes: 'text: coupling continuously varied from 0 to 100 %; Fig. 2(a) drop fraction 0.37 at zero offset, minimum near 300 nm offset (audit reading,
      +/-20 nm), about 1.0 above about 800 nm.'
    why: 'Figure re-read: the drop minimum sits near 295 nm on the 0-1000 nm axis. p.2 Fig. 2(a)'
delete_metrics:
- id: cmp_lit_caillaud2021_utc_4x15-m8
  why: Duplicate of m6 (same diode, -1 V, 1 mA; Fig. 5 -1 V trace is the Fig. 4 4x15 trace); printed 62 GHz moved to the m6 note. p.2; p.3 Fig. 5
add_components:
- component_id: cmp_lit_kurczveil2013_angled_si_facet
  source_id: lit:kurczveil2013
  class: fiber_chip_coupler.edge
  label: Angled (7 deg) 2 um wide Si rib waveguide facet, lensed-fiber coupling, 1550 nm TE
  row_kind: fabricated
  platform: soi_rib
  core_material: SOI 700 nm Si, 400 nm deep trenches, 1 um BOX
  tags: edge_coupler;angled_facet;soi
  verified_on: '2026-11-06'
  notes: 'Input / output facets of the hybrid taper test chip: Si waveguides angled 7 deg to reduce facet reflections, 2 um wide to reduce coupling loss,
    then tapered to 0.8 um (p.4 Sec. 2). Facet angle has no parameter (fiber_angle_deg is the fiber tilt). Fab empty: ''A passive chip was fabricated''
    (passive voice, p.2); authors at UCSB (Kurczveil also HP Labs, Pintus also Scuola Superiore Sant''Anna).'
  why: 'Miss: the paper states a per-facet coupling loss for its own on-chip facet design (p.4 Sec. 2, p.5 Sec. 3.1); the batch report treated it as a setup
    term, but rule 13 covers setup equipment, not on-chip facets'
