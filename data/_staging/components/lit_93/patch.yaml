components:
  cmp_lit_golshani2021_pvd_sin_wg_cband:
    notes: 'Fab org_imec: all authors at imec, conclusions state ''we demonstrated ... waveguide fabrication on 300mm wafers'' (first person) and the acknowledgment
      names the imec pilot line (p.2); borderline, kept (rule 12, D80b, D84b analogue: all authors at one org alone would not qualify; no sentence names
      the site); fallback empty. Sidewall roughness below 1.3 nm rms by AFM (p.1, no parameter). FTIR shows no N-H / Si-H bonds (p.1, Fig. 1). Fig. 4 DOE-wafer
      losses at 1520 nm (0.35-27.56 dB/cm vs Si/N ratio, lowest at R_Si/N = 0.76) are other film recipes and not entered. Fig. 3(c, d) wafer maps give binned
      values only (not entered).'
    why: 'Fab basis named precisely: D80b alone (all authors at one org) would not qualify; the first-person fabrication sentence (p.2 Sec. V) plus the
      pilot-line acknowledgment (p.2) is the D84b-type basis. p.2'
