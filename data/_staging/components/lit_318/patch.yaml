  cmp_lit_ferdous2011_sin_ring_r40:
    notes: 'Comb-generating ring of cmp_lit_ferdous2011_kerr_comb (D396 cross-note: same physical device, resonator values
      here, comb values there). Two TM mode families seen in Fig. 1(c); the values refer to the high-Q family (p.5). Transmission
      contrast of the 1556.43 nm mode printed as Delta T = 0.9 (normalized-transmission minimum about 0.1 in Fig. 1(d)): entered
      as extinction_db 10 dB, derived (m13). Performance degraded after months of air exposure (p.7; see the comb row). Fab:
      borderline org_center_for_nanoscale_science_and_technology (D84b): first-person ''We fabricated silicon nitride ring
      resonators'' (p.4) with authors at Purdue University (ECE, Birck Nanotechnology Center) and NIST CNST / Maryland NanoCenter
      (p.1), so the authors'' own org is ambiguous (D154); the acknowledgment thanks the staff of the CNST Nanofab for assistance
      with e-beam lithography (p.9), which places the fabrication at CNST (staff thanks: fab borderline, never a facility,
      D84b / D72). Cached copy: arXiv preprint (arXiv 1103.2330, title ''Spectral line-by-line pulse shaping of an on-chip
      microresonator frequency comb'') of the Nature Photonics paper; values from the preprint only.'
    why: 'p.5 / p.14 Fig. 1(d): note follows the added extinction row m13'
