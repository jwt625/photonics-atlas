# Audit patch lit_318 (fresh-context audit 2026-11-28, DevLog/audits/2026-11-28-lit_318-audit.md).
# 52 metrics: 47 ok / 5 imprecise / 0 wrong; 16 components: 9 ok / 7 imprecise / 0 wrong. 1 miss added.
# After the patch: 16 components, 53 metrics.
# Fixes: li2012 Kavli Nanoscience Institute facility removed on all 7 rows (bare thanks, D80c / D802); li2012 pump TE
