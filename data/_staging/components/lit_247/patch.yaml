  parameter: dark_current_na
  value: '60'
  unit: nA
  bias_v: '-0.1'
  condition: dark, 0.1 V reverse
  basis: measured
  locator: p.6 Sec. 3; p.3 Fig. 2
  notes: "Printed in the summary sentence ('can be operated at a low reverse bias such as 0.1 V with a low absolute leakage current of 60 nA'), which names no device. Tied to the 7 x 10 um device: its Fig. 2 dark trace reads about 50 nA at -0.1 V (log scale, +/- 30 %), and it is the only device with a printed dark I-V."
  why: 'moved from cmp_lit_ahn2007_ge_pd_impulse-m5 (see delete); p.3 Fig. 2 render: dark trace about 5e-8 A at -0.1 V, 2.9e-7 A at -0.5 V (= 0.41 A/cm2 x 70 um2), 9e-7 A at -1 V'
