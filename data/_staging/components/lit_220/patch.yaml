    condition: "through-power asymptote of the 2D (effective-index) optimization stage, worst case over the design wavelengths 1520, 1550 and 1580 nm"
    notes: "printed through power asymptote -0.08 dB (p.9); the asymptote is reached in the > 600 2D iterations before the switch to 3D (p.8-9), so the value is not a 3D result; Fig. 5(a) LM upper envelope about -0.08 dB in the 2D stage and about -0.08 to -0.09 dB after the 3D restart (reading +/- 0.01 dB)"
    why: "p.8-9: 'iterations are performed in 2D for >600 iterations until the asymptote is reached after which the simulations are performed in 3D'; the row condition said 3D FDTD (p.8 Fig. 5(a) render)"
  cmp_lit_hoffman2019_gd_fom_1_1p5_design-m1:
    condition: "through-power asymptote of the 2D (effective-index) optimization stage, worst case over the design wavelengths 1520, 1550 and 1580 nm"
    notes: "printed through power asymptote -0.13 dB (p.9); the asymptote is reached in the > 600 2D iterations before the switch to 3D (p.8-9), so the value is not a 3D result; Fig. 5(a) GD trace about -0.135 to -0.15 dB in the 2D stage and about -0.14 to -0.15 dB after the 3D restart (reading +/- 0.01 dB)"
    why: "p.8-9: the asymptote belongs to the 2D stage; the row condition said 3D FDTD (p.8 Fig. 5(a) render)"
  cmp_lit_xu2008_xconnect_2x2_grid-m1:
