components:
  cmp_lit_xu2008_plain_xconnect_filter:
    notes: "Round-cornered square microring laterally coupled to a plain (direct) waveguide crossing (control cross-connect filter); throughput and drop spectra normalized to the lensed PM fiber output, end-fire into ~2.5 um tapered facets, TE (p.5). Control filter with bus waveguides and microring identical to the MMI filter (p.6); crossing: cmp_lit_xu2008_plain_crossing. Asymmetric (Fano-like) drop line shapes (Fig. 3(c)). Fab: p.5 'We design and fabricate ... to fabricate the devices', both authors at HKUST (one org). Process printed: i-line (365 nm) photolithography + reactive ion etching on a commercially available SOI wafer (340 nm Si / 1 um BOX) thinned to ~250 nm by wet etching (p.5); process_name left empty (no named process)."
    why: "p.6 Fig. 3(c) / p.6 text: this is the control filter on the plain crossing; the copied notes said 'laterally coupled to an MMI crossing'"
metrics:
