# Audit patch bt_05 (fresh-context audit 2026-10-20), main block plus optional blocks ['B'] (D80 / D82 rulings).
components:
  cmp_datta2020_sin_ring_ws2:
    fab_org_ids: org_columbia_university
    notes: Ring used to measure the WS2 index change under ionic-liquid gating (Fig. 1); not an EO atlas row (the EO rows are the capacitor MZIs), so host_device_ids is empty. Authors state WS2 adds negligible
      loss and the linewidth stays largely unchanged with doping. Fab org Columbia (D72 / D76) - the first author (Columbia EE) fabricated the composite photonic device (contributions p.13). Facilities
      - work done in part at the CUNY ASRC NanoFabrication Facility, the Cornell NanoScale Facility and the Columbia Nano Initiative shared labs (acknowledgments p.13).
    why: 'D72 / D76: the paper states the first author (Columbia University) fabricated the device'
metrics:
  cmp_han2023_gc_cband-m1:
    notes: Paper - about 10 dB from a pair of GCs, 5 dB each (p.5); the equal split and how the pair loss was isolated are not stated (origin not stated). Supplement S7 (p.9-10) shows loopback spectra of
      six GC pairs (300 um strip) without a loss number. Wavelength not stated with the value; 1550 nm inferred from the C-band GCs and the measurement around 1.55 um (p.5).
    why: record the loopback test structure in the supplement
