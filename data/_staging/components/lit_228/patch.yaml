# Audit patch lit_228 (fresh-context audit 2026-11-20, DevLog/audits/2026-11-20-lit_228-audit.md).
# 113 metrics: 110 ok / 3 imprecise / 0 wrong; 17 components: 17 ok / 0 imprecise / 0 wrong. 3 misses added (figure reads).
# Fixes: sato2008 5 nm threshold note gains the Fig. 9(b) cross-check; gopinath2007 Device B slope-efficiency condition carries the
# same quasi-CW context as its threshold row; mason2000 SOA peak-gain wavelength marked inferred (1550 nm is printed for the
# unity-gain current in the same sentence). Misses: alloush2021 PML lasing peak (Fig. 2 inset), gopinath2007 Device B mode-locked
# spectral peak (Fig. 3), staring1996 lasing-channel span (Fig. 3).
# Coordinator questions (audit Q1-Q7): all distiller judgment calls kept (no op).
metrics:
  cmp_lit_sato2008_ba_laser_inas5nm-m1:
    notes: 'D431 precedent (Jth x stripe area); the paper does not state the area used for Jth. Fig. 9(b) 25 C knee reads about 560 mA (+/- 10 mA, 600 dpi render), about 2 % below the derived value; Fig. 10 25 C point about 1.6 kA/cm2, consistent.'
    why: 'p.5 Fig. 9(b) render: 25 C curve (third from left, 25 C leader) knee near 560 mA; the 3 nm row already carries its Fig. 9(a) cross-check, the 5 nm row had none'
  cmp_lit_gopinath2007_scowl_mll_b-m3:
    condition: 'unbiased absorber; front facet; devices first characterized quasi-CW at 1 % duty cycle (100 Hz, 100 us), p.2; operating mode not restated in the threshold / slope sentence'
    why: 'p.2 Sec. III: threshold and slope efficiency come from the same sentence; the threshold row (m2) carries the quasi-CW context, the slope row did not'
  cmp_lit_mason2000_int_soa-m1:
    wavelength_inferred: 'true'
    notes: 'Rests on waveguide-loss terms of unstated origin (rule 4). Higher bias raised the output saturation power but not the gain (p.3). 1550 nm is printed for the unity-gain current in the same calculation sentence; the wavelength of the peak gain is not stated separately (inferred).'
    why: 'p.2-3 Sec. III: "calculated the unity gain current at 1550 nm to be 14 mA and the peak gain to be 8.5 dB at 100 mA"; the wavelength binds to the unity-gain current'
