  locator: p.2 Fig. 2 right inset
  notes: 'Read off the Fig. 2 right inset (axis 1545-1575 nm, gridlines at 1550 / 1560 / 1570 nm): dominant peak on the 1560 nm gridline (+/- 1 nm); a weaker peak near 1556 nm about 25 dB lower. Title and conclusion state 1550 nm as the nominal band. HML spectra (Fig. 5 inset) are multi-peaked and not entered.'
