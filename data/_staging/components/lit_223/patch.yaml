# Audit patch lit_223 (fresh-context audit 2026-11-20, DevLog/audits/2026-11-20-lit_223-audit.md).
# 101 metrics: 90 ok / 11 imprecise / 0 wrong; 19 components: 13 ok / 6 imprecise (notes, core_material) / 0 wrong.
# Misses added: chen2015a bi-directional AWG element row (AWG-only estimate and AWG design geometry moved onto it, AWG-part
# footprint and N = 9 added), PR cut-corner We / He, grating-coupler etch depth; kashyap1993 filter 1 nm band-pass width.
# After the patch: 20 components, 111 metrics.
components:
  cmp_lit_chen2015a_hybrid_demux_awg:
    notes: "Whole structure measured in Fig. 9: polarization beam combiner (PBC, added in front to launch TE and TM through two grating couplers, Fig. 8), PBS, PR and the bi-directional AWG; the TE group exits on one side, the TM group (rotated to TE) on the other (p.4, p.9). Spectra normalized by a straight waveguide with grating couplers on the same chip. Element rows: cmp_lit_chen2015a_bidir_awg (the 10 x 10 bi-directional AWG part: design geometry, AWG-part footprint, AWG-only 5~6 dB estimate), cmp_lit_chen2015a_pbs_bent_dc, cmp_lit_chen2015a_pr_cut_corner (same designs as test structures), grating couplers and waveguide cmp_lit_chen2015a_gc_te / _gc_tm / _si_nanowire. Fig. 9 places the central channel #6 at about 1548 nm while the conclusion prints '~1545nm' (p.10; D417 note on the 7 dB row). Not entered: polarization-diversity-circuit excess loss 1~2 dB (p.9-10, restates the PBS / PR test results); TM-group excess loss < 1 dB at 1530-1550 nm and 1~2 dB at 1550-1560 nm attributed to the PR (p.9); polarization-dependent wavelength 'nearly zero' (no value). Fab empty: fabrication is described in passive voice (p.5 Sec. 3: the process 'was started from a 220nm-thick SOI wafer', e-beam lithography with MA-N2403 and ICP etching, a second shallow etch for the grating couplers), no org named; all four authors at Zhejiang University (D80b). No facility acknowledged (funding only, p.10)."
    why: "rule 9: the AWG-only estimate and the AWG design geometry move to the new element row cmp_lit_chen2015a_bidir_awg; p.10 Fig. 9 render: peak #6 at about 1548 nm (axis 1530-1560 nm), #5 at about 1545 nm"
  cmp_lit_chen2015a_pr_cut_corner:
    notes: "Pure polarization rotator (D404: polarization.psr). Test circuit: TM grating coupler, PR, then a bent-coupler PBS with a TE grating coupler at the through port and a TM grating coupler at the cross port (Fig. 4); Fig. 7 normalized by the transmission of a PBS with grating couplers (p.8). Same design as the PR in cmp_lit_chen2015a_hybrid_demux_awg. Dimensions chosen following the experimental results of ref. [26] (other authors; p.5). Cut corner: the Fig. 3 inset dimensions He from the top surface down to the floor of the cut and We as the cut width (p.5), and the text says the shallow-etched part has the grating-coupler etch depth: He = 70 nm entered as etch_depth_nm, We = 50 nm as width_nm. Not entered: TM-to-TE conversion efficiency about 85 % and residual TM about -8 dB relative to the input TM (p.8, p.10; no polarization-conversion-efficiency parameter, registry gap; the residual is referenced to the input power, not an output-port ratio, D424); 10 um linear width taper (no taper_length_um on polarization). Performance attributed to the control of the about 50 nm feature in an aligned second step (p.8). Fab empty: fabrication is described in passive voice (p.5 Sec. 3: the process 'was started from a 220nm-thick SOI wafer', e-beam lithography with MA-N2403 and ICP etching, a second shallow etch for the grating couplers), no org named; all four authors at Zhejiang University (D80b). No facility acknowledged (funding only, p.10)."
    why: "p.5 Fig. 3 inset: He is drawn from the top surface to the floor of the cut corner, so it is the etch depth (the notes said its role was not stated); We / He now entered as rows"
  cmp_lit_chen2015a_gc_te:
    core_material: "Si 220 nm (SOI wafer), shallow-etched grating (second etch step, 70 nm: same depth as the PR cut corner He)"
    notes: "Polarization-dependent grating couplers used at the inputs / outputs of every test structure and of the hybrid demux (p.5-6). Etch depth 70 nm from p.5: the PR's shallow-etched corner (He = 70 nm) 'has the same etch depth with the grating coupler'. Not entered: polarization extinction ratio 'more than 20dB' (cited to ref. [28], rule 3); peak wavelength and period not printed. Reproducibility on the same chip is referred to the authors' ref. [27]. Fab empty: fabrication is described in passive voice (p.5 Sec. 3: the process 'was started from a 220nm-thick SOI wafer', e-beam lithography with MA-N2403 and ICP etching, a second shallow etch for the grating couplers), no org named; all four authors at Zhejiang University (D80b). No facility acknowledged (funding only, p.10)."
    why: "p.5 Sec. 2: the shallow-etched PR corner has the grating-coupler etch depth and He = 70 nm; notes said the GC etch depth was not printed"
  cmp_lit_chen2015a_gc_tm:
    core_material: "Si 220 nm (SOI wafer), shallow-etched grating (second etch step, 70 nm: same depth as the PR cut corner He)"
    notes: "Polarization-dependent grating couplers used at the inputs / outputs of every test structure and of the hybrid demux (p.5-6). Etch depth 70 nm from p.5: the PR's shallow-etched corner (He = 70 nm) 'has the same etch depth with the grating coupler'. Not entered: polarization extinction ratio 'more than 20dB' (cited to ref. [28], rule 3); peak wavelength and period not printed. Reproducibility on the same chip is referred to the authors' ref. [27]. Fab empty: fabrication is described in passive voice (p.5 Sec. 3: the process 'was started from a 220nm-thick SOI wafer', e-beam lithography with MA-N2403 and ICP etching, a second shallow etch for the grating couplers), no org named; all four authors at Zhejiang University (D80b). No facility acknowledged (funding only, p.10)."
    why: "p.5 Sec. 2: the shallow-etched PR corner has the grating-coupler etch depth and He = 70 nm; notes said the GC etch depth was not printed"
  cmp_lit_kashyap1993_mzi_bragg_bandpass:
    notes: "Several balanced MZIs with different coupler lengths on one substrate; the one with two identical 50-50 couplers at 1555 nm was selected (p.2). Gratings written by two-beam 244 nm UV interference into each arm close to one coupler (arms 10 mm long); one arm then re-exposed after the input coupler (2.4 s in total) to move the bandpass from Port 1 to the looped-through Port 2 (laser trimming, p.3, Fig. 2). Table I values are % of the power in the butt-coupling fiber at Port 1 (input coupling loss not removed; brackets: relative to the total power at Ports 3 and 4). ELED source around 1550 nm, OSA. Grating row cmp_lit_kashyap1993_uv_bragg_gratings (D396): the grating reflections read from the Port 3 dip (95.5 % before, 96.8 % after trimming) are on that row, the 13.5 dB rejection form here; the conclusion's '96% rejection within a band-stop of 1 nm' (p.3) is the same after-trimming measurement. Not entered: Port 1 bandpass reflection 54.3 % -> 9.8 % [64.7 -> 13.3] and Port 4 bandpass-through 4.8 % -> 2.6 %, Port 4 bandstop minimum 0.13 / 0.08 % (Table I; no parameter for unwanted-port levels); about 5 dB / more than 2 dB Port 1 reflection changes during trimming (Fig. 2); UV-induced index change about 4.4e-4 (estimate, p.3). The abstract text layer prints '135 dB' for the 1.35 dB loss (decimal point lost; body and Table I note print 1.35 dB). Page 1 of the cached text opens with the end of the preceding paper in the issue. Fab empty: the waveguides 'were manufactured using the flame hydrolysis technique' and the gratings 'were written' (p.2 Sec. II, passive); the acknowledgment thanks a named person for fabrication of the planar guides without naming an org (p.3; D84b needs the org); all three authors at BT Laboratories (p.1; the registry has org_bt_research and org_bt_group, no 'BT Laboratories' alias; only relevant if fab is set)."
    why: "96.8 % row moved to the grating row (pairing as for the before-trimming 95.5 % / 13.5 dB); data/registry/organizations.csv has org_bt_research (BT Research), so 'not in the registry' was inaccurate"
  cmp_lit_kashyap1993_uv_bragg_gratings:
    notes: "Gratings of the four-port filter cmp_lit_kashyap1993_mzi_bragg_bandpass (D396: same physical gratings, reflector function). The paper takes the grating reflections from the extinction at Ports 3 and 4 (p.2): 95.5 % immediately after writing, 96.8 % after laser trimming (abstract 'reflection at the output port'; conclusion '96% rejection'). Grating length printed as 2 mm in the abstract (p.1) but 'around 3 mm' as typical lengths in Sec. II (p.2); the trimming exposure covered a 2 mm region (p.3): conflict noted (D417). Writing: two interfering 244 nm beams (over 100 mW) from an intracavity frequency-doubled argon-ion laser, cylindrical focusing. Fab empty: the waveguides 'were manufactured using the flame hydrolysis technique' and the gratings 'were written' (p.2 Sec. II, passive); the acknowledgment thanks a named person for fabrication of the planar guides without naming an org (p.3; D84b needs the org); all three authors at BT Laboratories (p.1; the registry has org_bt_research and org_bt_group, no 'BT Laboratories' alias; only relevant if fab is set)."
    why: "after-trimming 96.8 % added on this row (m5); BT org note corrected (org_bt_research exists)"
metrics:
  cmp_lit_chen2015a_hybrid_demux_awg-m1:
    notes: "Printed 'about 7dB for both polarizations' (also abstract, conclusion); wavelength '~1545nm' from the conclusion. Fig. 9 places channel #6 at about 1548 nm (#5 at about 1545 nm; reading +/- 0.5 nm), conflict noted (D417), printed wavelength kept."
    why: "p.10 Fig. 9 render: x axis 1530-1560 nm, peak #6 at about 1548 nm; the row cites Fig. 9 without the conflict"
  cmp_lit_chen2015a_pr_cut_corner-m1:
    notes: "Printed 'insertion loss less than 1dB from TM mode to TE mode' for 1530-1550 nm (p.8). Fig. 7 TM-to-TE trace reads about -0.5 dB at 1530 nm, crosses -1 dB near 1547 nm and reads about -1.2 dB at 1550 nm (reading +/- 0.2 dB): the bound holds over most of the stated range, conflict at the long end noted (D417)."
    why: "p.8 Fig. 7 render: the printed < 1 dB bound is exceeded near 1550 nm; note added, printed bound kept"
  cmp_lit_suzuki2017_tin_heater-m1:
    condition: "electric power to switch from the bar state to the cross state (pi phase shift), as printed in the double-MZ element section; for the asymmetric MZ switch the bar state is unheated and the cross state needs the pi shift"
    notes: "Printed '≈40 mW' (p.4-5). Fig. 4 maps the element cross state to both MZ switches in bar (unheated) and the element bar state to both in cross, so a bar-to-cross pi shift is an MZ-switch (single-heater) transition; the p.4 budget 2 x 8 x 40 mW = 0.64 W is consistent with 40 mW per MZ switch (factors not explained in the text; suzuki2020 uses the same 2 x 8 x P_pi form). Wavelength not printed; C band inferred from the Fig. 4 band 1.53-1.57 um."
    why: "p.3 Sec. 2 and p.5 Fig. 4: switching the double-MZ element from bar to cross means turning both heaters off, so the condition 'switch the double-MZ element from bar to cross' misread the sentence"
  cmp_lit_kashyap1993_mzi_bragg_bandpass-m9:
    basis: derived
    notes: "Printed 1.5558 um only (p.1-3, Table I, Fig. 2); stored in nm (D157 / D256)."
    why: "D256: unit conversion with no nm form printed for this quantity is derived"
