add_components:
  - component_id: cmp_lit_chen2015a_bidir_awg
    source_id: lit:chen2015a
    class: wdm.awg
    label: "10 x 10 bi-directional AWG part of the PDM-WDM hybrid (de)multiplexer (9 wavelengths, 3.2 nm / 400 GHz), SOI nanowire"
    row_kind: fabricated
    platform: soi
    core_material: "Si 220 nm (SOI wafer), single-mode nanowire 500 x 220 nm; e-beam lithography, ICP etch"
    cladding: "PMMA 300 nm (protection layer)"
    tags: awg;bidirectional;c_band
    verified_on: "2026-11-20"
    notes: "AWG part of cmp_lit_chen2015a_hybrid_demux_awg (element row, rule 9): (N + 1) x (N + 1) = 10 x 10 bi-directional AWG, N = 9; on each side the inner-edge access waveguide is the input and the other nine are outputs; the TE group enters from one side and the PR-rotated TM group from the other (p.3-4, Fig. 1). Not measured on its own: its only performance value is the 5~6 dB excess-loss estimate the authors separate from the whole-structure measurement (p.9). The design channel spacing 3.2 nm / 400 GHz and the 18-channel count are on the hybrid row. Not entered: FSR printed 'about 29μm' (p.4; the context FSR > N x 3.2 nm implies nm, unit misprint, value left out); number of arrayed waveguides not stated. Fab empty: fabrication is described in passive voice (p.5 Sec. 3: the process 'was started from a 220nm-thick SOI wafer', e-beam lithography with MA-N2403 and ICP etching, a second shallow etch for the grating couplers), no org named; all four authors at Zhejiang University (D80b). No facility acknowledged (funding only, p.10)."
    why: "rule 9: the bi-directional AWG is a separate physical design inside the hybrid with its own stated loss estimate (p.9), design geometry and footprint (p.4); one wdm.awg row should not carry two loss scopes"
