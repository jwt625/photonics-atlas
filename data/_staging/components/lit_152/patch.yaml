# Audit patch lit_152 (fresh-context audit, DevLog/audits/2026-11-15-lit_152-audit.md).
# 194 metrics: 151 ok / 43 imprecise / 0 wrong; 34 components: 33 ok / 1 note sync / 0 wrong; 0 deleted; 19 misses added
# (vagionas2021 Si3N4 / Al2O3:Er3+ stack on the transition, waveguide and fiber-interface rows; tu2024 simulated IL ~3 dB;
# ning2022 measured kappa = 0.29 coupling ratio read off Fig. 8 and the 220 nm / 2 um stack on the five DC rows).
# 34 of the 43 imprecise rows are rule 8 (performance value without wavelength / band); the other 9: vagionas2021 net gain
# basis (2), MMI approx (1), tu2024 facet scope (1), ning2022 FDTD coupling lengths basis (5, design dimensions).
# Coordinator rulings open (audit Q1-Q6):
# Q1 catalalahoz2026 Vpi / rise / fall / ER kept on the phase-shifter row (no op; EO-atlas candidate).
# Q2 catalalahoz2026 platform bto_on_si kept on PUC / mesh / configured-filter rows, soi on the grating couplers (no op).
# Q3 catalalahoz2026 fab org_cea_leti + org_lumiphase kept (no op).
# Q4 vagionas2021 net gain and gain per cm -> author_estimate (ops below). To keep derived: drop the two
#    cmp_lit_vagionas2021_edwa_5p9cm-m1 / -m2 ops.
# Q5 ning2022 fab org_amf kept, process_name empty (no op).
# Q6 ning2022 kappa = 0.29 Fig. 8 read added (cmp_lit_ning2022_dc_k029-m5); the kappa 0.2 / 0.08 / 0.04 curves stay out. To drop
#    the read: remove that add_metrics entry and the dc_k029 component note op.
components:
  cmp_lit_ning2022_dc_k029:
    notes: "Fab: 'fabricated on a SOI wafer ... by utilizing the silicon photonics multi-project wafer (MPW) service of Advanced Micro Foundry (AMF)' (p.3). TE polarization; fiber grating couplers; spectra normalized to the two-GC coupling loss (stated for the stand-alone filters, p.3). Measured on cascaded-DC test trees (Fig. 1(c)); measured ratios only in Fig. 8 (p.4); the red dashed kappa = 0.29 curve is distinct from the three low-kappa curves (kappa 0.2 / 0.08 / 0.04, which overlap near 0.03-0.15 and are not read, D156) and is read in m5. The paper attributes the filter degradation mainly to DC dispersion and fabrication errors."
    why: "Note sync with the added m5 (p.4 Fig. 8: the red dashed kappa = 0.29 trace lies between 0.1 and 0.22, clear of the other curves)"
