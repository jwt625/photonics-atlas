    basis: author_estimate
    notes: "Net gain printed 3.6 dB (p.5; Fig. 3(d) label '3.6 dB net gain'). The p.5 method sentence defines net gain as signal output minus input minus the fiber-to-active-region coupling losses on both sides: -27.4 + 18.8 + 12.2 = 3.6 dB reproduces it exactly, and the 18.8 / 12.2 dB terms are sums of 'estimated' / 'calculated' parts (10 dB interface, 8.3 / 1.7 dB MMI port, 0.5 dB adiabatic coupler, p.4), so the value rests on estimated inputs (rule 4; D429, D583). The alternative route 11.8 dB enhancement minus 1.4 dB/cm x 5.9 cm gives 3.54 dB. 'in the 1550 nm wavelength region' (D393)."
    why: "Rule 4: p.5 'the estimation of the net-gain has to be based on ... minus the coupling loss from the fiber till the Al2O3:Er3+ active region'; those losses are the p.4 estimated / calculated terms, which reproduce 3.6 dB exactly (the 1.4 dB/cm route gives 3.54). D166 (derived) needs own measured losses"
