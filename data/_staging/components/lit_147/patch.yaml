# Q1 liu2020b alpha ~1 dB/m kept as author_estimate (D80i borderline, D578 rees2020 precedent). To drop: delete_metrics cmp_lit_liu2020b_ring_20ghz-m6.
# Q2 liu2020b 38 mW / 7 mW on-chip powers kept derived (D394 / D166). 7 mW reference plane follows the sentence (bus waveguide), not printed separately.
# Q3 liu2023a IL < 0.22 dB kept as excess_loss_db; +/- deviations kept as coupling_variation (lu2015a D539 / cheung2019 precedent; D401 does not apply).
# Q4 li2022a fab empty on both rows; org_cornerstone stays in notes (it made only the SiN receiver chip; D515 / D463 per component).
