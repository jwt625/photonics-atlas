metrics:
  cmp_lit_krasnokutska2019_rib_waveguide-m2:
    wavelength_inferred: 'true'
    notes: "Paper: deviation from the measured FSRs below 2 % (p.5). Wavelength not stated with the group indices (p.4); the waveguide was designed single-mode at 1550 nm with the mode solver (p.2 Sec. II, Fig. 1(b)) and the mode-solver field plots are at 1550 nm (p.4), so 1550 nm inferred."
    why: "p.4: 'n_g^TM = 2.33 and n_g^TE = 2.38' are printed without a wavelength; 1550 nm comes from the design statement (p.2) and the neighbouring field-plot sentence, so rule 8 applies (wavelength_inferred true with the reason)"
  cmp_lit_krasnokutska2019_rib_waveguide-m3:
    wavelength_inferred: 'true'
    notes: "Wavelength not stated with the group indices (p.4); the waveguide was designed single-mode at 1550 nm with the mode solver (p.2 Sec. II, Fig. 1(b)) and the mode-solver field plots are at 1550 nm (p.4), so 1550 nm inferred."
    why: "p.4: group indices printed without a wavelength; same rule 8 fix as m2"
  cmp_lit_liu2023a_adc_90_10-m3:
    notes: "Printed as IL < 0.22 dB; stored as excess_loss_db (loss beyond the ideal split, skill rule 6). Cascade-slope fit of own data = measured (D80a); method cutback as papadovasilakis2023 (D559). Fig. 9: the bound matches the regression curves; the 90:10 regression peaks near 0.225 dB at about 1592 nm and the raw 90:10 measurement trace exceeds 0.22 dB at many points above about 1540 nm (spikes to about 0.38 dB near 1588 nm)."
    why: "p.8 Fig. 9 (embedded image): the 90:10 measurement trace (teal) lies above 0.22 dB over much of 1540-1600 nm and the regression (red) peaks at about 0.225 dB; the printed bound holds only for the regression, which the row did not say"
