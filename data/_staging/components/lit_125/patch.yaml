# Audit patch lit_125 (fresh-context audit 2026-11-11, DevLog/audits/2026-11-11-lit_125-audit.md).
# 209 metrics: 176 ok / 31 imprecise / 2 wrong (deleted); 23 components: 22 ok / 1 imprecise / 0 wrong, 0 deleted; 1 miss added.
# Coordinator rulings open: Q1 johnson2020 own-org fab (no op; to empty it, set fab_org_ids '' on cmp_lit_johnson2020_mmi_crossing),
# Q2 lin2021 488 nm transition labels (notes only; alternative in the audit), Q3 shi2023 0.48 dB/cm (kept, basis derived; to move it
# to notes instead, add a delete_metrics op for cmp_lit_shi2023_polymer_waveguide-m2), Q4 D417 cases (notes only), Q5 tahara2024
# AIST fab on the SSC / waveguide rows (no op), Q6 lin2021 other Fig. 4(c) tip widths (no op), Q7 shi2023 Optoweave (note only).
components:
  cmp_lit_shi2023_polymer_waveguide:
    notes: 'Fab: no fabricating org named; the board work is described partly in first person (we used FR-4 substrate) with authors at SJTU and TTM Technologies (two orgs, D154 / D80b). Acknowledgment (p.9) thanks a named person of Shanghai Optoweave Technology Co., Ltd. for advice and help on OPCB design and fabrication: borderline fab candidate under D84b (staff-thanks fabrication credit); the org is not in the registry (reported), fab left empty. Optical polymers from Panasonic (supplier, note only); bulk material loss 0.05-0.07 dB/cm at 850 nm (p.3, supplier material value, not entered). Board: 8 electrical layers + 1 optical layer, 3.2 mm thick; waveguides 10 cm long, pitch 250 um (design, p.3; pitch_um not allowed on waveguide_platform, D250). 90-deg crossings in groups 1 / 2 (no crossing loss printed). Misalignment 3-dB tolerances with 50 um GI-MMF (p.5): input (-20, +17) um horizontal, (-21, +25) um vertical; output (-21, +21) um and (-27, +22) um (no 3-dB tolerance parameter, D81). Adjacent-channel crosstalk below -44 dB, about -60 dB at the centre of the adjacent waveguide (p.5-6; registry gap: crosstalk_db not allowed on waveguide_platform). Channel bandwidth 234 GHz for 10 cm at 780 nm and bandwidth-length product 23 GHz x m (p.8, p.1; registry gap, measured through the connectorized channel). 30 Gb/s NRZ error-free with about 1.5 dB penalty (system result, not entered).'
    why: 'p.9 Acknowledgment names Shanghai Optoweave Technology Co., Ltd. for help on OPCB design and fabrication; the distiller notes did not record this D84b borderline fab statement (org missing from the registry, audit Q7)'
