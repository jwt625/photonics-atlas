  parameter: bw_fwhm_nm
  value: '40'
  unit: nm
  qualifier: approx
  band: c_band
  wavelength_inferred: 'true'
  condition: FWHM of the GC transmission band; angle-polished fiber
  method: unspecified
  basis: author_estimate
  locator: p.11 Sec. 4.3
  notes: Stated as an FWHM transmission band, not called 3 dB; how obtained not stated; band inferred (device resonances near 1558 nm)
  why: D71 bw_fwhm_nm
