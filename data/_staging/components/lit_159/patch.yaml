    'notes': 'D396: same physical device as cmp_lit_herrmann2022_freq_circulator (circulator metrics and film thickness there). Rates from a bootstrap fit of the VNA phase trace (Supp. Table S1, 95 % confidence intervals in metric notes). Ring coupling rates mu12/2pi 1.864 GHz and mu23/2pi 1.861 GHz (Table S1) have no registry parameter. Racetracks 2 and 3 have no waveguide coupling term in the model (Supp. Eqs. 1b / 1c), so their printed total loss rates (linewidth_mhz rows) carry no external part. Fab Stanford: author contributions (p.6) ''J.F.H. fabricated the device'', all authors at Stanford (D395). Facility: ''Part of this work was performed at the Stanford Nano Shared Facilities (SNSF)'' and ''Work was performed in part in the nano@stanford labs'' (NNCI site, p.6); the second is the printed name of registry org_nano_stanford (audit 2026-11-16). Platform lnos_rib: LN on sapphire is stated, rib vs fully etched is not (only LN-on-sapphire platform value). Cached text is arXiv v1 (2021-09-28) of the Nature Photonics 2022 paper; journal version unread.'
