    'notes': 'Ports are three frequency channels (dressed modes w1-w3) of one bus waveguide. The paper''s isolation parameter I_ij = |S_ij|^2 / |S_ji|^2 compares forward and reverse frequency conversion between two channels, both measured with light input from the left waveguide; mirror symmetry (right-to-left input) checked in Supp. Fig. S5 (no number). Not entered as isolation_db (D581 / D419 / D513: conversion contrast, not same-frequency isolation; the feed-through |S_kk|^2 0.19-0.29 at the operating point, Supp. Eq. (12) p.10, is not suppressed, p.4-5): I31 nearly 40 dB printed (p.1 abstract, p.2, p.6) at P1 73.2 mW / P2 59.0 mW, 1543.6 nm, while the Fig. 2(b) / 2(c) I31 curve at the same powers peaks at about 35 dB (+/- 1 dB, D417); I31 > 25 dB at P1 7.32 mW / P2 0.74 mW (p.6); Fig. 2(c) peaks I23 about 26 dB and I12 about 27 dB (+/- 1 dB, p.3). Enter these as conversion_contrast_db when that parameter exists (audit 2026-11-16). D396: resonator data on cmp_lit_herrmann2022_triple_racetrack. Fab Stanford: author contributions (p.6) ''J.F.H. fabricated the device'', all authors at Stanford (D395). Facility: ''Part of this work was performed at the Stanford Nano Shared Facilities (SNSF)'' and ''Work was performed in part in the nano@stanford labs'' (NNCI site, p.6); the second is the printed name of registry org_nano_stanford (audit 2026-11-16). Platform lnos_rib: LN on sapphire is stated, rib vs fully etched is not (only LN-on-sapphire platform value). Cached text is arXiv v1 (2021-09-28) of the Nature Photonics 2022 paper; journal version unread.'
    'why': 'Q1 / Q4: isolation values moved to notes after the delete ops (D581); facility org_nano_stanford for the printed ''nano@stanford labs'' (p.6 Acknowledgements), which names the registry org itself, so the D80d time-aware rule (printed SNSF / SNF not re-pointed) does not apply'
  'cmp_lit_herrmann2022_triple_racetrack':
