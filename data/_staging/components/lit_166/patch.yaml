# 72 metrics: 68 ok / 4 imprecise / 0 wrong; 14 components: 13 ok / 1 imprecise / 0 wrong; 0 deleted;
# 1 miss added (tabatabavakili2019 g120 q_external > 1e5). After the patch: 14 components, 73 metrics.
