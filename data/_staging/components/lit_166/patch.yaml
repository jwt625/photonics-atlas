components:
  cmp_lit_tabatabavakili2019_disk_g120:
    notes: "Weakest-coupled device of the A = 90 deg gap series (30-120 nm); its Q is the paper's Q_int reference. The same device lases (cmp_lit_tabatabavakili2019_disk_laser_g120, D396). Bus waveguide bent around the disk over A = 90 deg (no coupling-angle parameter on resonator); waveguide end tapered from 500 nm to 2 um, light extracted by scattering at a 120 nm etched edge; device length 100 um (p.8). Optically pumped (355 nm) active disk, no transmission measurement: Q values from micro-PL linewidths. Lasing threshold of this device 1.2 mJ/cm2 per pulse (300 kW/cm2; p.2, p.4, p.13 Supp., Fig. S7) is on the laser row's notes (no areal pump-threshold parameter). Fab: 'We fabricated 5 um diameter microdisks' (p.3) with authors at four organizations (C2N / Univ. Paris-Sud, Univ. Grenoble Alpes / CEA, L2C Montpellier, CRHEA Valbonne): fab_org_ids empty (D80b, D154). Process 'similar to the one described previously' (p.8, authors' ref. 22), no place named. RENATECH network only as support in the acknowledgments (program acknowledgement, D80c; billet2022 precedent)."
    why: "D396 cross-note: the resonator row named the laser row only as 'the laser row'; the g45 pair names the id (p.4, p.13 Supp. Fig. S7)"
metrics:
  cmp_lit_shiran2021_adc_mode_mux-m1:
    method: unspecified
    excludes: "grating couplers (GC-GC straight-waveguide normalization stated for the dBcMMI, p.8; not restated for this test structure)"
    notes: "Printed as 'the worst IL of the mode multiplexer' from the mux + demux cascade test structure (p.8-9); how the single-multiplexer value was isolated from the cascade and whether the GC-GC reference was applied to this structure is not shown (D167: stated directly)."
    why: "p.8 Sec. 3: the single-mode GC-GC waveguide is fabricated 'to normalize the loss of the design' (the dBcMMI); p.8-9 Sec. 3.1 gives no normalization for the multiplexer test structure, so method reference_structure was not stated"
  cmp_lit_shiran2021_adc_mode_mux-m2:
    method: unspecified
    excludes: "grating couplers (GC-GC straight-waveguide normalization stated for the dBcMMI, p.8; not restated for this test structure)"
    notes: "Printed as 'the worst IL of the mode multiplexer' from the mux + demux cascade test structure (p.8-9); how the single-multiplexer value was isolated from the cascade and whether the GC-GC reference was applied to this structure is not shown (D167: stated directly)."
    why: "as adc_mode_mux-m1 (p.8 Sec. 3; p.8-9 Sec. 3.1)"
  cmp_lit_li2025h_ysplit_sb2s3_r150-m1:
    notes: "Printed 'maximum IL of Sb2S3 in the amorphous state was measured at 0.34 dB' inside the simulation section (Fig. 6 is captioned as simulation; the paper reports no fabrication): simulated. Abstract prints 0.35 dB, introduction 0.4 dB. Conflict (D417): the Fig. 6(b) IL curve (embedded figure) reads about 0.14 dB at 0 nm crystalline depth (amorphous) falling to about 0.07 dB at 220 nm (+/- 0.01 dB); Fig. 5(c) at r = 0.15 um, n = 2.7, 1550 nm also reads about 0.15 dB. Printed value kept."
    why: "p.5 Fig. 6(b) (img_p05_1 read: axis 0-2, 350 px per unit): the plotted IL never exceeds about 0.15 dB, so the printed 0.34 dB disagrees with the paper's own figure; the note did not say so"
  cmp_lit_li2025h_ysplit_sb2s3_r150-m2:
    notes: "10 log10 of the printed ratios (1.14 -> 0.57 dB, 1.86 -> 2.70 dB); arithmetic on simulated values stays simulated (D83f). Range = tuning span of the output imbalance, not an error. Conflict (D417): the Fig. 6(b) power-ratio curve reads about 1.69, 1.57, 1.42, 1.28, 1.17, 1.12 (+/- 0.01) at 0-220 nm crystalline depth, i.e. about 0.48-2.28 dB; Fig. 5(b) at r = 0.15 um, n = 2.7, 1550 nm also reads about 1.7. Printed ratios kept."
    why: "p.5 Fig. 6(b) (img_p05_1 read): the plotted ratios sit below the printed 1.86 / 1.70 / 1.50 / 1.34 / 1.21 / 1.14 at every depth; the note did not record the conflict"
