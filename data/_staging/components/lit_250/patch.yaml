# Audit patch lit_250 (fresh-context audit 2026-11-22, DevLog/audits/2026-11-22-lit_250-audit.md).
# 152 metrics: 148 ok / 4 imprecise / 0 wrong; 25 components: 16 ok / 9 imprecise / 0 wrong. 6 misses added (footprints).
# Fixes: xiao2013 MMI rows platform soi -> soi_strip (etch down to the BOX stated, D434 / D459); guo2023a design rows lose
# fabrication-process words (PECVD, EBL + ICP-RIE); chen2015c three length locators and one tolerance-row condition.
# Misses: footprint_um2 derived from the printed L x W footprints (guo2023a Table 2, five converters; xiao2013 abstract / conclusion).
# Coordinator questions (audit Q1-Q13): distiller judgment calls kept (no op).
