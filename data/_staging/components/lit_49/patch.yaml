# Audit patch lit_49 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_49-audit.md).
# 141 metrics: 123 ok / 3 imprecise / 15 wrong (basis / parameter / wavelength); 20 components: 14 ok / 6 changed (notes,
# core_material); 0 deleted; 0 misses added. Not covered here (coordinator / registry): OpSIS org (simard2013 fab, audit Q1),
# registry gaps listed in the audit record.
components:
  cmp_lit_ji2017_ring_p1_standard:
    core_material: LPCVD Si3N4 730 nm on thermally oxidized Si; standard process of the authors' earlier work (ref. [44]); mask and etch recipe of that process not detailed in this paper
    notes: 'Devices partially fabricated at the CUNY Advanced Science Research Center and the Cornell NanoScale Facility (p.5 Acknowledgment; facilities). No fab org: the authors state they fabricated the devices but sit at Cornell, Columbia and Georgia Tech (ambiguous). Coupling gap not stated. Measured in the under-coupled regime per the authors (p.3 Sec. 3); the Fig. 3(a) dip is a single deep dip without visible splitting. Process (1) is the standard process of the authors'' earlier work (ref. [44]); the ring and its numbers are measured in this paper.'
    why: 'p.2 Sec. 2: the photoresist mask / standard CHF3-O2 sentence is generic background, the process-1 recipe is only referenced (ref. [44]); p.3 Fig. 3(a) render: single dip, so the split-doublet note does not apply to this ring'
  cmp_lit_ji2017_ring_p4_full:
    notes: 'Devices partially fabricated at the CUNY Advanced Science Research Center and the Cornell NanoScale Facility (p.5 Acknowledgment; facilities). No fab org: the authors state they fabricated the devices but sit at Cornell, Columbia and Georgia Tech (ambiguous). Coupling gap not stated. Rings measured in the under-coupled regime; the transmission dips are split doublets (backscatter mode splitting) and the stated FWHM refers to the marked dip (Fig. 3 / Fig. 5). Also the 2.5 um ring of the Sec. 5 width comparison, fabricated on the same wafer as the 10 um ring with ''the optimized fabrication process'' (p.4; same design, entered here with its own conditions; identity with the Fig. 3(d) device and the process number are not stated; placed on process 4 because the abstract pairs the 2.5 um ring of the loss comparison with the 37 M record Q, process 2 is only the optimized etch (p.3), and the Sec. 5 loss 0.79 dB/m matches process 4 (0.8 dB/m), not process 2 (1.8 dB/m)). Used as the Kerr OPO: cmp_lit_ji2017_opo_2p5um_ring (D396). Not entered: bulk-absorption loss 0.13 +/- 0.05 dB/m and absorption-limited Q >= 170 M, sidewall scattering 0.41 dB/m, top / bottom scattering 0.007 / 0.24 dB/m (p.4-5: model-based decomposition with simulated interaction factors and Payne-Lacey estimates; material-level, not a component value); AFM roughness / correlation lengths (no parameter).'
    why: 'p.1 Abstract, p.3 Sec. 3, p.4 Sec. 5: evidence for the process-4 assignment of the Sec. 5 2.5 um ring recorded (audit Q4); assignment kept'
  cmp_lit_ji2017_ring_10um_wide:
    notes: 'Devices partially fabricated at the CUNY Advanced Science Research Center and the Cornell NanoScale Facility (p.5 Acknowledgment; facilities). No fab org: the authors state they fabricated the devices but sit at Cornell, Columbia and Georgia Tech (ambiguous). Coupling gap not stated. Coupling regime of the Sec. 5 rings not stated (the under-coupled statement, p.3, refers to the Fig. 3 rings); Fig. 5(c) TE resonance is a split doublet with the FWHM marked on one dip, Fig. 5(d) TM resonance is a single deep dip. Comparison ring for the loss decomposition of Sec. 5 (see cmp_lit_ji2017_ring_p4_full for the values not entered). Ring-down lifetime 25.6 +/- 1.3 ns (TM, p.4 Fig. 5(e)) has no parameter.'
    why: 'p.3 Sec. 3 vs p.4 Sec. 5 and Fig. 5(c)-(d) renders: the under-coupled statement covers only the process rings; the 10 um TM dip is single and near zero transmission'
  cmp_lit_ye2019_soliton_comb_100ghz:
    core_material: LPCVD Si3N4, thickness of this ring not stated (~600 or 740 nm films in this work) (two depositions, 350 nm + second layer, 1100 C N2 anneals, crack barriers), EBL (maN-2405) + CHF3 / O2 ICP-RIE (sidewall ~85 deg), post-etch 1100 C anneal, on 3 um thermal SiO2 (3-inch Si)
    why: core_material text garbled by the generator ('740 (not stated for this ring) nm'); p.6 Sec. 4 gives only '100 GHz' and anomalous dispersion for this ring
  cmp_lit_simard2013_interleaved_spiral_ibg:
    notes: 'Fab: chips fabricated using the OpSIS service through IME A*STAR (p.11 Acknowledgments): fab_org_ids org_astar_ime; OpSIS is not in the registry (report). Measured by OFDR with the coupling losses removed and time filtering of the cleaved-fiber reflections; reflection spectra in dB vs wavelength offset, Bragg wavelength ~1557.6 nm from the Fig. 5(e) lambda_B axis (Figs. 3(b) / 4(b): ~1557.8 nm). Shown spectra are typical; over thirty gratings characterized with similar responses (p.7). Access: compact focusing GCs, 2 mm single-TE 500 nm waveguides and 125 um adiabatic tapers on each side (no performance stated, no rows). Third-order grating; the retrieved index-modulation amplitude ~0.07e-3 (Fig. 3(c), 4(c)) has no parameter. Interleaved spiral: R0 59 um, delta-w 15 um, alpha 0.671, N 1.345, three spirals spaced 5 um, minimum radius of curvature 20 um (side spirals) / 25 um (central), each 2 mm long (p.10, p.9 Fig. 5(a)). Which of the three gratings the Fig. 5(d) spectrum belongs to is not stated. footprint_um2 is the total area of the three interleaved gratings.'
    why: 'Fig. 5(e) render: the lambda_B reference line sits at about 1557.6 nm, not 1557.8 nm (Figs. 3(b) / 4(b) only)'
  cmp_lit_simard2013_spiral_cbg_gaussian_apodized:
    notes: 'Fab: chips fabricated using the OpSIS service through IME A*STAR (p.11 Acknowledgments): fab_org_ids org_astar_ime; OpSIS is not in the registry (report). Measured by OFDR with the coupling losses removed and time filtering of the cleaved-fiber reflections; reflection spectra in dB vs wavelength offset, Bragg wavelength ~1557.5 nm from the Fig. 6(b) lambda_B axis (Figs. 3(b) / 4(b): ~1557.8 nm). Shown spectra are typical; over thirty gratings characterized with similar responses (p.7). Access: compact focusing GCs, 2 mm single-TE 500 nm waveguides and 125 um adiabatic tapers on each side (no performance stated, no rows). Third-order grating; the retrieved index-modulation amplitude ~0.07e-3 (Fig. 3(c), 4(c)) has no parameter. Phase apodization (technique of the authors'' earlier work, ref. [16]) with modulation period 17.5 um; retrieved index modulation follows the designed Gaussian with 1 mm FWHM (p.11, Fig. 6(c)); no parameter. Spiral parameters for this grating not stated. The statement that the sidelobe suppression improves by more than 20 dB with an ideal Bragg-wavelength profile is a calculation (green curve), not a device value: not entered.'
    why: 'Fig. 6(b) render: the lambda_B reference line sits at about 1557.5 nm, not 1557.8 nm (Figs. 3(b) / 4(b) only)'
