delete_metrics:
- id: cmp_lit_woods2020_clad_wg_w3p2-m3
  why: 'p.3 Sec. 2 "During numerical modelling, we use propagation loss values between 3 and 4 dB/cm for the cladded waveguides" and p.9 Sec. 4 lists it as a variable parameter "(between 3 dB/cm and 4 dB/cm)": the range is the window the GNLSE free parameter was allowed to take, not a result; p.8 Figs. 8-9 per-fit values sit at the 3 dB/cm lower edge in 7 of 9 fits, with mode order and coupled power (1.5-12.1 mW) also free and n2 cited (ref. [16]). Same footing as the Fig. 7 2 dB/cm model input the batch already left out (D468 model-input precedent); values in component notes. The unclad 5-6.5 dB/cm row stays: p.3 states it as the outcome of matching ("revealed that the values ... were typically higher in order to achieve the closest matches")'
