# Audit patch cov_06 (fresh-context audit 2026-11-07, DevLog/audits/2026-11-07-cov_06-audit.md).
# 132 metrics: 116 ok / 16 imprecise / 0 wrong; 29 components: 25 ok / 4 imprecise / 0 wrong.
# Misses added: 2 metrics (li2022 EO tuning efficiency per Q1, xiang2021a Si-SiN spacer gap).
# Coordinator choices: Q1 (li2022 GHz/V): to keep the value out drop add_metrics cmp_lit_li2022_pockels_laser-m8 and
# the components op on cmp_lit_li2022_pockels_laser. Q2 (zhou2025 fab): to keep fab empty drop the two components ops
# on cmp_lit_zhou2025_mci_laser and cmp_lit_zhou2025_slr. Q3 (fan2025a shared linewidth range): to keep the range rows
# drop the metrics ops on cmp_lit_fan2025a_ecl_rsoa1-m8 and cmp_lit_fan2025a_ecl_rsoa2-m4.
components:
  cmp_lit_fan2025a_vernier_mrrs:
    class: resonator.ring
    why: 'Imprecise class: the two add-drop racetracks are cascaded inside the laser cavity, not mutually coupled; D400 puts intracavity rings in resonator.ring, and one-row Vernier pairs are resonator.ring in the merged table (ji2026, franken2025, heim2026) (p.2 Sec. 2, p.2 Fig. 1(a))'
  cmp_lit_li2022_vernier_racetracks:
    class: resonator.ring
    why: 'Imprecise class: two separate racetracks of the Vernier mirror inside the laser cavity, not a coupled-ring molecule; D400 and the merged one-row Vernier pairs (ji2026, franken2025, heim2026) use resonator.ring (p.3-4, p.3 Fig. 2(b))'
  cmp_lit_li2022_pockels_laser:
    notes: 'Fab org_university_of_rochester: author contributions (p.11) name M.L., J.L., Y.H. and S.X. as fabricators, all at the University of Rochester (D395). Facility org_cornell_nanoscale_facility (performed in part at, p.11); the Cornell Center for Materials Research named in the same sentence is not in the registry. Wafer supplier NanoLN (note only). arXiv v1 text; journal version unread. Fab applies to the LNOI cavity chip; RSOA origin not stated. Cross-notes: cmp_lit_li2022_vernier_racetracks, cmp_lit_li2022_rsoa_lnoi_ssc. EO laser-frequency tuning efficiency printed 0.26-0.34 GHz/V (p.4, Fig. 3(c)) entered in pm/V (m8). Not entered: frequency-modulation rate 2.0 EHz/s, modulation nonlinearity < 10 % / 3 %, on-off switching 10-90 % rise / fall about 3 ns at up to 50 MHz (driver-limited), mode switching at 4 V, photon lifetime about 0.2 ns (estimate), SH tunability over 10 nm and the 15 % SHG projection, 41 kHz linewidth of another device with loaded Q about 2.5e4 (different, unnamed device, D159).'
    why: 'Notes follow the Q1 ruling (tuning efficiency entered as m8)'
  cmp_lit_zhou2025_mci_laser:
    fab_org_ids: org_east_china_normal_university
    notes: 'Fab org_east_china_normal_university, borderline (D84a): the MCI chip is fabricated with the PLACE method and the paper refers the method details to the authors own earlier work (p.7), which reads as fabrication with the authors own process; every author lists an East China Normal University affiliation (one also SIOM and other institutes, p.1); nan2025 precedent (same group, same PLACE pointer). RSOA purchased from Anritsu (vendor of a part, note only). Cross-note: cmp_lit_zhou2025_slr. Not entered: fine-tuning resolution 0.014 nm (OSA-limited) and coarse step 0.07 nm (no parameter); EDFA-amplified 70 mW (external fiber amplifier); 1x8 MMI uniform splitting stated without a number (geometry-only, no row); simulated MCI reflection spectrum (Fig. 2). Supplementary material not in the cached text.'
    why: 'Q2 ruling: D84a counts a statement that the device was made with the authors own process; the PLACE pointer to our previous work (p.7) is that statement and the org is unambiguous (all authors at ECNU, p.1); nan2025 precedent'
  cmp_lit_zhou2025_slr:
    fab_org_ids: org_east_china_normal_university
    notes: 'Fab org_east_china_normal_university, borderline (D84a): the MCI chip is fabricated with the PLACE method and the paper refers the method details to the authors own earlier work (p.7); every author lists an East China Normal University affiliation (p.1); nan2025 precedent. Platform empty: etch profile not stated (D422 / D423). Design follows the authors earlier SLRs with DCs replaced by 2x2 MMIs (p.4). Whether the tunable SLR is included in the > 90 % statement is not stated.'
    why: 'Q2 ruling, as cmp_lit_zhou2025_mci_laser (same chip, p.7)'
