add_metrics:
- metric_id: cmp_lit_li2022_pockels_laser-m8
  component_id: cmp_lit_li2022_pockels_laser
  parameter: tuning_efficiency_pm_per_v
  value: 2.17
  value_max: 2.84
  unit: pm/V
  statistic: range
  wavelength_nm: 1581.12
  wavelength_inferred: 'true'
  condition: 'EO phase-control section, triangular drive VP 3.0 V, modulation frequency 0.1-600 MHz; laser-frequency modulation amplitude 1.6-2.0 GHz; beat note against a reference laser (STFT)'
  basis: derived
  locator: 'p.4; p.5 Fig. 3(c)'
  notes: 'Printed 0.26-0.34 GHz/V; d_lambda = lambda^2 d_f / c at 1581.12 nm, the lasing mode of the LIV and SHG measurements of this device (p.4, p.6); the wavelength of the FM measurement is not printed, and any wavelength in the 1576-1596 nm TO tuning range changes the result by under 2 %. Efficiency degrades beyond 700 MHz (photon-lifetime limit about 0.2 ns, estimate, p.4).'
  why: 'Miss (Q1): a measured laser tuning efficiency; merged practice converts printed GHz/V with lambda^2 / c into tuning_efficiency_pm_per_v, derived (andreou2019, stanfield2019; kim2026 author_estimate only where a nominal wavelength had to be assumed) (p.4; p.5 Fig. 3(c))'
- metric_id: cmp_lit_xiang2021a_si_sin_taper-m7
  component_id: cmp_lit_xiang2021a_si_sin_taper
  parameter: gap_nm
  value: 600
  unit: nm
  qualifier: approx
  condition: 'vertical SiO2 spacer between the Si3N4 core and the bonded Si layer (planarized first cladding layer)'
  basis: design_target
  locator: 'p.6 Methods'
  notes: 'Methods: 900 nm deuterated SiO2 on the SiN, planarized by CMP to a cladding thickness of around 600 nm, then the SOI piece is bonded and its BOX removed; read as the SiN-to-Si spacing of the transition (spacer SiO2 in Fig. 1(a), p.3). Measured or nominal not stated (dimension, D76).'
  why: 'Miss (D153 geometry): the transition_bilayer template lists gap_nm; the spacer thickness is printed (p.6 Methods)'
