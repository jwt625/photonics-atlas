# Audit patch lit_06 (fresh-context audit 2026-10-22, DevLog/audits/2026-10-22-lit_06-audit.md).
# 8 metric corrections (imprecise) + 10 missed metric rows + 1 component note. No wrong rows.
# Open questions (not patched): ye2023 fab org (Qaleido Photonics missing from the registry), see audit record.
components:
  cmp_lit_bogaerts2006_wire_bends:
    notes: "Spirals with lengths 0.1-50 mm and 0-550 bends; straight loss and excess bend loss from the slopes of a 2-D fit (Fig. 1(a)); the fitted straight-wire slope is printed only as a Fig. 1(a) label (0.37 dB/mm, entered as prop_loss_db_per_cm), the per-radius excess losses only as Fig. 1(b) labels (0.104 / 0.029 / 0.016 / 0.007 dB at R = 1 / 2 / 3 / 5 um). The text's 0.24 dB/mm is cited earlier work (refs. 2, 9), not entered. Processed in imec's advanced CMOS research environment (p.1 Sec. II-A: 'we used the advanced CMOS research environment' of imec; 248 nm DUV, ICP-RIE); acknowledgment thanks the IMEC P-line operators for processing (D84b)."
    why: 'audit: figure-label values now entered (m7-m9); note no longer says the straight loss is not printed'
