# D169 gap-fill (subagent, 2026-10-22); replay order patch, sweep, gapfill, addendum, geometry, geoaudit, coord, sweep2
components:
  cmp_lit_bogaerts2006_racetrack_r5um:
    notes: "Drop efficiency 50-70 % (m6). Processed in imec's advanced CMOS research environment (p.1 Sec. II-A: 'we used the advanced CMOS research environment' of imec; 248 nm DUV, ICP-RIE); acknowledgment thanks the IMEC P-line operators for processing (D84b)."
    why: 'D169 gap-fill: drop_efficiency_pct now exists; note sentence rewritten to point to m6'
  cmp_lit_tanizawa2015_mz_element_tm:
    notes: "Test element on the same die. DC waveguides 430 nm wide with a 430 nm gap (Fig. 8(a); gap entered as m13). 3-dB DCs designed for TM (larger dimensional tolerance); designed cross state without heating. Crosstalk-below-35-dB bandwidth 4.3 nm (bar) and 2.3 nm (cross), envelope fit (entered as xt_bandwidth_nm m11 / m12). Cross-state trimming power 1.5 mW typical (not entered). 'We fabricated the 32 x 32 switch' (300 mm SOI, ArF immersion lithography) (p.3 Sec. 2); 13 of 15 authors at AIST, 2 at Furukawa Electric: fab org set to AIST (borderline D80b, facility not named)."
    why: 'D169 gap-fill: gap_nm (switch_fabric) and xt_bandwidth_nm now exist; the two registry-gap sentences rewritten, rest verbatim'
  cmp_lit_iwama2015_wss_1x93:
    notes: "Calibrated for 96 channels at 50 GHz spacing over the full C-band; flexible-grid operation in 12.5 GHz steps shown (Fig. 6). 0.5-dB and 3-dB passband widths for a 50 GHz slot typically 37.0 and 45.5 GHz (entered as m10 / m11); super-Gaussian order 4.7 (no registry parameter, not entered). Insertion loss rises with port distance (LCOS diffraction efficiency). All authors at Furukawa Electric; no fabrication statement (fab_org_ids empty, D80b)."
    why: 'D169 gap-fill: bw_0p5db_ghz and bw_3db_ghz now allowed for switch_fabric; registry-gap sentence rewritten, rest verbatim'
