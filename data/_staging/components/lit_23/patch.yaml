components:
  cmp_lit_zheng2026a_ta2o5_ring_r300:
    cladding: ''
    notes: 'All-pass ring side-coupled to a 1.2 um bus; etch depth in the coupling region shallower than elsewhere (values
      not stated). AFM rms surface roughness 0.46 nm (p.5, Fig. 2(c); the introduction p.3 prints 0.47 nm) not entered (no
      registry parameter). The 8.7 um bus-ring gap appears only in the coupling-region simulation (p.6, Fig. 2(d)); not entered
      as the device gap. Near-critical coupling with a normalized transmission TF of 95% (p.7) not entered (inconsistent with
      the ~0.09 dip of Fig. 4(b)). Fab empty: fabrication described passively / as "we" with authors split over East China
      Normal University and SIOM-CAS (not unambiguous). Cladding not stated (no cladding step in the Fig. 1 flow; field left
      empty).'
    why: 'skill step 3: cladding only if stated; p.4-5 Sec. 2 and Fig. 1 describe no upper cladding and the text never says
      air-clad'
  cmp_lit_zheng2026a_lensed_fiber_butt:
    cladding: ''
    notes: 'Input coupling of the Q-measurement setup (p.6); no facet taper stated. Fab empty: fabrication described passively
      / as "we" with authors split over East China Normal University and SIOM-CAS (not unambiguous). Cladding not stated (field
      left empty).'
    why: 'skill step 3: cladding only if stated (p.4-6 Sec. 2: no cladding mentioned)'
  cmp_lit_teng2009_ring_w350_air:
    notes: 'Same chip as the polymer-clad row, measured before the PSQ-LH overlay. Racetrack add-drop ring: R 15 um, coupling
      length 2 um, gap 180 nm, width 350 nm (p.4-5; Fig. 3 SEM). TE only (shallow-etched 70 nm grating couplers). 300 nm wide
      rings were also designed on the mask but no results are given. Fab: acknowledgement states the SOI circuits were fabricated
      by CEA-LETI through ePIXfab (p.7); ePIXfab (MPW access provider) is also a fab org under D83d / D398 but is not in the
      registry: add it to fab_org_ids after the org round.'
    why: 'p.7 Acknowledgements: fabrication done by CEA-LETI through ePIXfab; D83d / D398: an MPW access provider is a fab
      role'
  cmp_lit_teng2009_ring_w350_psq:
    notes: 'Polymer overlay on the narrowed wire to cancel the Si thermo-optic shift. Racetrack add-drop ring: R 15 um, coupling
      length 2 um, gap 180 nm, width 350 nm (p.4-5; Fig. 3 SEM). TE only (shallow-etched 70 nm grating couplers). 300 nm wide
      rings were also designed on the mask but no results are given. Fab: acknowledgement states the SOI circuits were fabricated
      by CEA-LETI through ePIXfab (p.7); ePIXfab (MPW access provider) is also a fab org under D83d / D398 but is not in the
      registry: add it to fab_org_ids after the org round. Athermal 350 nm MZIs mentioned without numbers (p.7).'
    why: 'p.7 Acknowledgements: fabrication done by CEA-LETI through ePIXfab; D83d / D398'
  cmp_lit_lin2026_wdm_oh_8ch:
    notes: 'Two inputs (signal, LO), 32 outputs (4 hybrid outputs x 8 wavelengths); the four lattice filters are one design
      (all-passive, no trimming); optical paths length-matched (p.4-5). Packaged with SMF arrays and wire bonds. System-level
      results (SFDR 80.8 dB Hz^2/3, IMRR 33.26 dB, 1.024 Tb/s, BERs) not component metrics. The 1x2 / 2x2 MMIs have only simulated
      IL / imbalance variations (< 0.3 dB C-band, < 0.5 dB over 100 nm; p.5 Fig. 1(c)): not entered (variation over wavelength
      has no splitter parameter). Fabricated from a Multi-Project Wafer run provided by Applied Nanotools Inc. (p.5). SJTU-Pinghu
      Institute of Intelligent Optoelectronics thanked for assistance with the chip packaging (p.17 Acknowledgments): a packaging
      service, not fabrication of this component and not a shared facility; not entered.'
    why: 'p.17 Acknowledgments: packaging assistance recorded so the org round sees it; rule 12 / D80c facility basis not
      met'
