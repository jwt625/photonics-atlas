# Audit patch lit_14 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_14-audit.md).
# 177 metrics: 162 ok / 12 imprecise / 3 wrong; 39 components: 29 ok / 9 changed / 1 deleted; 4 misses added.
# Not covered here (coordinator decisions, see the audit file): registry orgs (TIA SCR of AIST, Yale SEAS cleanroom, YINQE),
# registry gaps, one-device-several-class-rows convention (lit_10 Q3), lapointe2025 source row preprint note.
components:
  cmp_lit_white2022_kerr_isolator_il1p8:
    notes: 'No fab org: the text says ''we fabricate'' the 16-ring array and the two cascaded rings (p.9; Methods passive, p.16), but the authors are at Stanford and UCSB, so the fabricating org is not unambiguous (rule 12; bock2010 precedent). Facility: ''Part of this work was performed at'' SNSF/SNF (p.17). Isolation threshold (input power for 3 dB isolation) has no nonreciprocal parameter (registry gap). Inverse-designed grating couplers at 1550 nm used for coupling (p.16). One of 16 rings with varied coupling strength / asymmetry (Fig. 3b-c). Intro (p.3) prints 17 dB with 1.3 dB IL for the low-loss example vs 1.8 dB in Sec. III (p.9) and abstract; Sec. III entered.'
    why: 'p.9 Sec. III: ''we fabricate an array of 16 air-clad silicon nitride isolators'' and ''we fabricate two rings''; the note claimed passive-only fabrication. fab_org_ids stays empty (authors at two orgs, rule 12)'
  cmp_lit_white2022_kerr_isolator_il5p5:
    notes: 'No fab org: the text says ''we fabricate'' the 16-ring array and the two cascaded rings (p.9; Methods passive, p.16), but the authors are at Stanford and UCSB, so the fabricating org is not unambiguous (rule 12; bock2010 precedent). Facility: ''Part of this work was performed at'' SNSF/SNF (p.17). Isolation threshold (input power for 3 dB isolation) has no nonreciprocal parameter (registry gap). Inverse-designed grating couplers at 1550 nm used for coupling (p.16). One of 16 rings with varied coupling (Fig. 3b-c). Intro (p.3) prints 23 dB with 4.6 dB IL vs 5.5 dB in Sec. III (p.9) and abstract; Sec. III entered.'
    why: 'p.9 Sec. III: ''we fabricate an array of 16 air-clad silicon nitride isolators'' and ''we fabricate two rings''; the note claimed passive-only fabrication. fab_org_ids stays empty (authors at two orgs, rule 12)'
  cmp_lit_white2022_kerr_isolator_cascade2:
    notes: 'No fab org: the text says ''we fabricate'' the 16-ring array and the two cascaded rings (p.9; Methods passive, p.16), but the authors are at Stanford and UCSB, so the fabricating org is not unambiguous (rule 12; bock2010 precedent). Facility: ''Part of this work was performed at'' SNSF/SNF (p.17). Isolation threshold (input power for 3 dB isolation) has no nonreciprocal parameter (registry gap). Inverse-designed grating couplers at 1550 nm used for coupling (p.16). Pump of at least 40 mW needed to overlap the two resonances (Fig. 4e).'
    why: 'p.9 Sec. III: ''we fabricate an array of 16 air-clad silicon nitride isolators'' and ''we fabricate two rings''; the note claimed passive-only fabrication. fab_org_ids stays empty (authors at two orgs, rule 12)'
  cmp_lit_white2022_kerr_isolator_dfb_chip:
    notes: 'No fab org: the text says ''we fabricate'' the 16-ring array and the two cascaded rings (p.9; Methods passive, p.16), but the authors are at Stanford and UCSB, so the fabricating org is not unambiguous (rule 12; bock2010 precedent). Facility: ''Part of this work was performed at'' SNSF/SNF (p.17). Isolation threshold (input power for 3 dB isolation) has no nonreciprocal parameter (registry gap). Inverse-designed grating couplers at 1550 nm used for coupling (p.16). Same isolator concept on the chip butt-coupled to a DFB laser via an oxide-clad inverted taper (design from [4]); slightly lower Q than the air-clad rings (p.11). Direct butt-coupled operation shown with backward pulses (Fig. 5d), no number.'
    why: 'p.9 Sec. III: ''we fabricate an array of 16 air-clad silicon nitride isolators'' and ''we fabricate two rings''; the note claimed passive-only fabrication. fab_org_ids stays empty (authors at two orgs, rule 12)'
  cmp_lit_white2022_sin_ring_d200:
    notes: 'No fab org: the text says ''we fabricate'' the 16-ring array and the two cascaded rings (p.9; Methods passive, p.16), but the authors are at Stanford and UCSB, so the fabricating org is not unambiguous (rule 12; bock2010 precedent). Facility: ''Part of this work was performed at'' SNSF/SNF (p.17). Isolation threshold (input power for 3 dB isolation) has no nonreciprocal parameter (registry gap). Inverse-designed grating couplers at 1550 nm used for coupling (p.16). Value stated for the array of 16 isolator rings (details in Supplemental Section 5, not cached).'
    why: 'p.9 Sec. III: ''we fabricate an array of 16 air-clad silicon nitride isolators'' and ''we fabricate two rings''; the note claimed passive-only fabrication. fab_org_ids stays empty (authors at two orgs, rule 12)'
  cmp_lit_matsumoto2018_si_switch_4x4:
    fab_org_ids: ''
    notes: 'No fab org: the only fabrication statement names the 300 um Si inverse taper of the dual-core SSC (''fabricated in an advanced process line'' at AIST, p.2-3); the switch itself is described passively (''was fabricated'', p.5) and its design follows refs [2], [14] (D80b). Device fabrication supported by TIA SCR of AIST (p.6 Acknowledgement; facility not in the registry). With the 4ch SOA array: +4.5 dB fiber-to-fiber insertion gain at the gain peak (p.6), not a loss value.'
    why: 'D80b: p.2-3 names AIST as fabricator of the Si taper only; p.5 Sec. IV-C ''A 4x4 Si optical switch with hybrid-integrated InP-SOA was fabricated'' is passive; extending the taper statement to the switch is inference'
  cmp_lit_guo2016_aln_ring_shg:
    fab_org_ids: org_yale_university
    notes: 'fab_org_ids Yale (borderline, D84a analogue): the authors state a device-processing step themselves (''we anneal our device'', p.3), all three authors are at Yale (p.1), and the acknowledged fabrication facilities are Yale''s (p.5); pattern definition and etch are passive (p.3). Acknowledged facilities Yale SEAS cleanroom and Yale Institute for Nanoscience and Quantum Engineering (p.5) are not in the registry. Geometry not enterable for frequency_converter (registry gap): radius 30 um; pump point-contact bus 0.8 um wide, gap 0.6 um; SH wrap-around bus 80 um long, tapered 0.175 -> 0.125 um, gap 0.5 um (p.3). Temperature-tuning FWHM of the efficiency 7.7 C (fit; 7.8 +/- 1.4 C calculated) and nonlinear coupling g/2pi 0.08 MHz (fit) not entered. SH resonance extinction 0.75 (linear) not entered (no extinction parameter for this class). AlN platform has no enum value (other).'
    why: 'rule 12 / D80b / D84a: first-person fabrication statement ''we anneal our device in 950 C'' (p.3) by authors who all sit at Yale (p.1); ''Facilities used for device fabrication were supported by Yale SEAS cleanroom and YINQE'' (p.5) places the fabrication at Yale'
  cmp_lit_pintus2017_ring_circulator_r20:
    notes: 'No fab org: fabrication described passively (p.1-2); authors at UCSB and Tokyo Institute of Technology. Ring radius / coupling gap not enterable for nonreciprocal (registry gap). Bonded chip 3.5 mm long; input/output waveguide propagation loss estimated 8.7 dB from the Ce:YIG absorption (about 60 dB/cm assumed, p.2, p.6), not entered as a device loss. Estimated ring-waveguide power coupling 10.45% vs optimum 9.0% for a 0.35 nm split (p.7): no coupling parameter for nonreciprocal. Simulated spectra blue-shifted 0.633 nm to match (p.6). Measured isolation 11 dB (P1-P2) and 6.7 dB (P1-P4) at 1558.38 nm (p.7) carries citation [35] (Huang et al., Optica 2017, the authors'' own circulator paper) and the abstract''s 32 dB / 11 dB are the [25] / [35] results: removed under D259a; this row keeps only the simulated single-ring value at the optimum 9% coupling.'
    why: D259a applied to m1 / m2 (p.7 Sec. IV-A sentence ends with [35]); note records the removal
  cmp_lit_davenport2016_iii_v_si_taper:
    core_material: III-V mesa 26 -> 4 -> 0.5 um (InP p-cladding), undercut SCH/MQW tip 150 nm, over Si 500 nm widened to 2 um, then tapered to 0.8 um
