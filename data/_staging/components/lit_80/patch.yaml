  cmp_lit_stanfield2019_ring_undercut-m3:
    notes: 'Standard fit of own data (D80a). The fit model includes loading and coherent backscattering (p.10, ref. 42): a doublet lineshape fixes the loading, unlike the singlet of m2, so the regime comes from the data (D403 satisfied). No spectrum of this resonance is shown; wavelength not attached to this value; devices operated near 780 nm (abstract, p.12), laser 765-781 nm (p.8)'
