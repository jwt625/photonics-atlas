# Audit patch lit_80 (fresh-context audit 2026-11-04, DevLog/audits/2026-11-04-lit_80-audit.md).
# 231 metrics: 214 ok / 14 imprecise / 3 wrong; 42 components: 40 ok / 2 imprecise / 0 wrong.
# Misses: 11 metric rows added. After the patch: 42 components, 239 metrics.
# Rulings pending on srinivasan2020 1550 nm rows (Q1) and shahin2025 fab (Q2): drop those ops if overruled.
components:
  cmp_lit_stanfield2019_ring_7k_ps:
    notes: 'Separate unnamed-device row (matsuo2013 precedent, D159): the paper says ''a ring resonator device'' and does not say undercut or not, though it compares the value with room temperature. Not entered: resistance > 20 TOhm, 6.1 TOhm cm at cryogenic temperature (p.15, no parameter; 2e13 Ohm in the abstract). Abstract and p.2 say the exemplary device was characterized at room temperature and 7 K; p.14 names only a ring resonator device and prints 0.26 GHz/V against 0.2 GHz/V (non-undercut) and 0.48 GHz/V (undercut), so the row is not merged into either.'
    why: evidence for the separate row, p.1, p.2, p.9, p.10, p.14 (D159, matsuo2013 precedent in D422)
  cmp_lit_blundell2025_mmi_40nm_crystalline_pixels:
    notes: 'Port contrast (Tbtm - Ttop) / T read about 0.71 at the last pixel of Fig. 4(b) (no parameter). Throughput and contrast are versus pixel number; the definition of contrast differs between the text (/ T0, p.11) and the captions (/ T). MMI dimensions are not stated. Amorphous-pixel MMIs (Fig. 3): the 20, 80 and 100 nm devices gain transmission against the crystalline start, the 40 nm device reads about -1 dB at its last pixel, no row; 60 nm devices are in the supplement, not cached.'
    why: 'p.12 Fig. 3(b): the 40 nm T / T0 trace falls below 0, the note and the report say all rise'
  cmp_lit_srinivasan2020_lsacm_apd:
    notes: 'Fab from the acknowledged imec 200 mm pilot line contribution (p.6). Device with the highest gain-bandwidth product of the design set (p.2). Fails catastrophically beyond -13 V (p.2): no breakdown criterion, not entered. Table II ''This work'' prints DC gain 36 at 1310 nm, Table I 39 +/- 6; text prints 0.65 A/W on one device and 0.64 wafer scale. 1550 nm RF values not entered (D259, D408): the Fig. 5 caption assigns the 1550 nm S21 curves to ref. [14], the authors'' ECOC 2019 paper, whose title carries 32 GHz and gain > 8; Fig. 5(c), (d) read about 32 GHz at -12 V and 5.5 GHz at -2 V, text gain 8.5 at -12 V (p.4, p.5). Absorbed fractions 95 / 99 % cite ref. [1]: out. Eye SNR has no parameter. Fig. 4: responsivity falls with optical power, stronger at -12 V.'
    why: follows the deleted rows m12, m14, m16; report pointer removed
  cmp_lit_vines2019_planar_spad_100um:
    notes: 'Fabrication by three authors at the School of Engineering, University of Glasgow, Glasgow, UK (p.9 author contributions): org missing from the registry, so fab empty until the org round. No guided-light platform: normal incidence, platform empty. Gated, 50 ns gate, 1 kHz repetition, 19.5 ps timing bins (p.3, p.8). Not entered (no parameter): NEP 1.9e-16, 3e-16, 7e-16 W/Hz^0.5 at 78, 100, 125 K (p.4, computed by the authors from SPDE and DCR); cut-off wavelength 1468 nm at 125 K to 1495 nm at 175 K, about 0.54 nm/K (p.5); afterpulse activation energy 80-90 meV (p.6); yield over 90 % (p.3); punchthrough 20 V (p.3 Fig. 2(d)); AR reflection below 1 % (p.4, design). Projections for 2 um Ge (SPDE > 55 %) and smaller devices are out. Dead-time reduction 50-75 % against the commercial SPAD (p.7): no parameter.'
    why: report pointer does not belong in row notes (p.9 author contributions)
  cmp_lit_vines2019_ingaas_inp_spad_reference:
    notes: Vendor not named. Comparison device under nominally identical conditions; NEP 7e-17 W/Hz^0.5 (p.6) has no parameter. Device under test of the comparison with its own measured numbers (D155), not setup equipment (rule 13).
    why: ruling recommendation Q3, p.5, p.6, p.7 Fig. 6(a); report pointer removed
  cmp_lit_shahin2025_vsacm_apd:
    fab_org_ids: org_imec
    notes: 'Fab: fabricated on imec''s 300-mm Si-Pho platform (p.2), the wording of merged deng2026a and OFC Th3F.2 rows; Q2 of the lit_80 audit. Charge layer average 5.5e17 cm-3 target, SIMS in Fig. 4(a). Text prints 49 GHz (p.5) and 50 GHz (abstract, Table I, p.6) for the same point. Dark current: below 50 nA up to -11.3 V (p.4) against Table I 0.055 uA at -11 V. Early reliability data cite ref. [12]: out. Effective k about 0.1 (p.7), eye SNR, BER and jitter have no parameter (50 and 70 Gbps, -10 V, Fig. 8). Fig. 7 BW-gain points cover 5 dies.'
    why: p.2 Sec. II names the org of the platform in a fabrication sentence; merged deng2026a (p.2, near identical wording, authors at imec and Ghent University-imec), elsaeed2024, song2024a, OFC Th3F.2 and M1E.6 are org_imec; D84a covers an own 'our platform', szelag2017 (D433) has no such sentence; rule 12 foundry clause
