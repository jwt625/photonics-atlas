# Audit patch lit_195 (fresh-context audit 2026-11-18, DevLog/audits/2026-11-18-lit_195-audit.md).
# 149 metrics: 143 ok / 6 imprecise / 0 wrong; 19 components: 17 ok / 2 imprecise (notes) / 0 wrong; 0 misses added.
# After the patch: 19 components, 149 metrics.
# Coordinator rulings asked (audit Q1-Q5): Q1 liu2024b kept, ref. [16] is not lit:liu2023a (component note op below),
# L stays coupling_length_um (dc template field; merged liu2023a m7 to be migrated in a coordinator fix batch, not here);
# Q2 du2019 fab split and Qc rows kept, 0.35 is a power ratio (metric note op below); Q3 song2024b kept, heater-sweep
# and P_pi notes carry the Fig. 7 reads (three metric note ops); Q4 qiu2017 bandwidths stay out (registry gap), GC
# 3-dB bandwidth gets the inferred band (op below); Q5 ahmmed2020 kept, budget-arithmetic note on the EpoCore row (op below).
components:
  cmp_lit_liu2024b_rib_adc_3db:
    notes: "Five regions (p.2, Table I p.3): input tapers W -> W1 / W2 over Lt1 at gap G1 = 3 um; Bezier S-bends to G2; region III tapers W1 -> W3 and W2 -> W4 over L at constant G2; output S-bends (Ls1 5 um) and tapers Lt2 back to W (W not printed). Fig. 5(b) / 5(c) labels G1 / G2 swapped against the text and Table I (Table I values used). Test circuit: four cascaded ADCs plus reference waveguides with TE grating couplers (Fig. 5(a)); EL from linear regression over the cascade (Fig. 6(c)). Measurement span 1450-1600 nm set by the laser. Not entered: '150 nm bandwidth' for 3-dB splitting (no criterion stated; equals the laser range; liu2023a handled the same way), simulated +/-50 nm width / +/-10 nm height tolerance (Fig. 4, no registry parameter). Same group, stack and Table I values (W1 0.47, W2 0.23, W3 = W4 0.35, G1 3, G2 0.1, Lt1 = Lt2 10, Ls1 5, L 78 um) as the 50:50 device of lit:liu2023a (Optics Express 32(2), 2029, 2024; cmp_lit_liu2023a_adc_50_50), which this letter does not cite. Its ref. [16] (p.1, simulation agreement) is a different paper (X. Liu et al., Appl. Opt. 62(5), 1279, 2023; not in the registry). No value here is attributed to earlier work and the measured numbers differ from liu2023a (EL < 0.18 vs < 0.22 dB; variation 5.2 % vs +/-0.051), so kept (D408 / D259 do not apply); whether both papers measured the same chip is not stated. Fab: first-person ('we can process', EBL with ZEP, two ICP etches, p.3; 'we design and fabricate', p.4 conclusion); all four authors at SIMIT, also UCAS: own org SIMIT (D72 / D80b; liu2023a precedent). Commercial SOI wafer supplier not named."
    why: "the old note named lit:liu2023a as the authors' ref. [16]; p.4 reference list: [16] is X. Liu et al., Appl. Opt. 62(5), 1279 (2023), while lit:liu2023a is Optics Express 32(2), 2029 (2024) (references/liu2023a/text.md p.1) and is not cited; Fig. 5(b), (c) labels vs Table I p.3"
  cmp_lit_ahmmed2020_epocore_channel_wg:
    notes: "Material-loss terms of the two insertion-loss budgets (p.12, p.13); no cut-back or other loss measurement is shown, and the two chips give different values. Budget arithmetic: the three-mode budget closes only with 2.75 taken as a total in dB (2.65 + 2.75 + 1.30 = 6.70 dB; 2.75 dB/cm x 9.71 mm = 2.67 dB would give 6.62 dB); the four-mode budget closes neither way (2.90 + 2.95 + 1.35 = 7.20 dB against the printed 7.32 / 7.25 dB). Values kept in dB/cm as printed (device lengths 9.71 / 9.95 mm, so the two readings differ by < 3 %). Fab: first-person fabrication (p.9 'We then spin coat the EpoCore', thickness 'We measured'; p.13 'We fabricated the devices'); all authors at City University of Hong Kong (first author also University of Chittagong): own org (D72 / D80b; chen2023b D595 and liu2023a dual-affiliation precedent). EpoCore / EpoClad from micro resist technology GmbH (material supplier, note only, Contract v7). Si wafer substrate, UV contact lithography plus RIE to the 4.50 um core height (p.8-9)."
    why: "p.12 budget 6.70 dB = 2.65 + 2.75 + 1.30 (dB) exactly, p.13 budget 7.32 / 7.25 dB vs 2.90 + 2.95 + 1.35 = 7.20; device lengths p.6 (9.71 mm) and p.7 (9.95 mm): the printed dB/cm unit is not confirmed by the paper's own arithmetic"
metrics:
  cmp_lit_du2019_pte_device_c-m1:
    notes: "printed 'reflection coefficient' 0.35 at 1552 nm (p.6). The p.4 text calls the amplitude 2itk the reflection coefficient, but the p.6 value is computed from the measured C2 / C3 port powers as 2C3 / (C2 + 2C3), so it is a power ratio (a field reading, sqrt(0.35) = 0.59, does not follow from this formula); the factor 2 on C3 (2 x 1 MMI on the return path) and the C2 + 2C3 normalization make it R / (R + T), equal to the power reflectivity only for a lossless PTE (not stated). Ripples on C3 removed by low-pass filtering first. fraction -> % (D256)"
    why: "p.4 defines the amplitude reflection coefficient 2itk; p.6 computes 0.35 from port powers with 2C3/(C2 + 2C3) at 1552 nm (Fig. 5(b)); note states the power reading and the lossless normalization behind it"
  cmp_lit_qiu2017_adf_te1_w1200-m4:
    notes: "printed 'slightly larger insertion losses of 1.3 dB' for the add spectrum (p.4); read as the total add -> through loss, not 0.6 + 1.3 dB: in Fig. 6 the add-path (blue) passband sits about 1.4 dB below 0 dB and the drop path (red) about 0.7-0.9 dB (reading +/-0.2 dB)"
    why: "p.4 wording is ambiguous (absolute vs. excess over the 0.6 dB drop loss); Fig. 6 (p.4) passband levels support 1.3 dB as the absolute add-path loss"
  cmp_lit_qiu2017_phc_gc-m2:
    band: c_band
    wavelength_inferred: "true"
    notes: "no wavelength printed (p.3); the filters operate around 1550 nm (C band inferred, rule 8), as for m1"
    why: "rule 8: no stated wavelength, operating band stated (p.3-4, 1550 nm design); the sibling m1 row already carries the inferred C band"
  cmp_lit_song2024b_mzs_2x2-m7:
    notes: "printed > 20 dB for the calibrated ON / OFF states of the single-wavelength heater sweep at 1455 nm (Fig. 7(a); ON / OFF powers picked at that wavelength). The stitched spectra of Fig. 7(d)-(e) use one calibration (Q0, Q0 + Q_pi printed at 1550 nm, p.4) and give > 20 dB only over 1470-1617 nm (p.5); the two statements are not in conflict, the sweep recalibrates. Fig. 7(a) dips read about -19.6 dB (black) and -21.2 dB (red), +/-0.3 dB: one state sits slightly below the printed bound; kept as printed (D417)"
    why: "p.4 Fig. 7 caption and text: (a)-(c) are per-wavelength heater sweeps, (d)-(e) one calibrated OFF / ON pair, so the old 'outside the stitched > 20 dB span' framing is not the inconsistency; the Fig. 7(a) black dip at about -19.6 dB is the actual mismatch (p.4 render read)"
  cmp_lit_song2024b_mzs_2x2-m9:
    notes: "printed > 20 dB for the calibrated ON / OFF states of the single-wavelength heater sweep at 1630 nm (Fig. 7(c); ON / OFF powers picked at that wavelength). The stitched spectra of Fig. 7(d)-(e) use one calibration (Q0, Q0 + Q_pi printed at 1550 nm, p.4) and give > 20 dB only over 1470-1617 nm (p.5); the two statements are not in conflict, the sweep recalibrates. Fig. 7(c) dips read about -22.5 / -20.6 dB (+/-0.3 dB), consistent with the printed bound"
    why: "p.4 Fig. 7 caption and text: (a)-(c) are per-wavelength heater sweeps, (d)-(e) one calibrated OFF / ON pair; the old note framed the > 20 dB at 1630 nm as a D417 inconsistency, which Fig. 7(c) does not show"
  cmp_lit_song2024b_to_ps_1um-m1:
    notes: "17.6 - 1.5 mW from the two printed state powers (patel2014 precedent, D619); consistent with the printed 0.09 pi imbalance (1.5 / 16.1 = 0.093). Fig. 7(b) does not match the printed powers closely: black (bar) dip at about 0.9 mW and black maximum near 15.5 mW, red dip at about 16.5 mW (+/-0.3 mW), i.e. about 15.6 mW between the dips; printed values used (D417)"
    why: "p.4 text prints Q0 ~1.5 mW and Q0 + Q_pi ~17.6 mW; Fig. 7(b) (p.4 render, 0-30 mW axis) places the dips at about 0.9 / 16.5 mW; reader needs the discrepancy before any showcase use"
