# Audit patch lit_199 (fresh-context audit 2026-11-18, DevLog/audits/2026-11-18-lit_199-audit.md).
# 69 metrics: 56 ok / 13 imprecise / 0 wrong; 10 components: 4 ok / 5 imprecise (notes) / 1 wrong (liang2005 fab empty
# despite first-person fabrication statements); 1 miss added (liang2005 device length about 1 cm).
# After the patch: 10 components, 70 metrics.
# Coordinator questions (audit Q1-Q6): Q1 lu2017 measured ILs mean without qualifier (notes only); Q2 lu2017 5x5 length 5.41 um
# kept (no op); Q3 lu2017 fab HUST restated as rule 12 first-person (notes only); Q4 tsarev2011 conversions and 180 nm gap kept
# (no op); Q5 yamaguchi2022 rows kept in scope, conventional range max 3.35 -> 3.3; Q6 liang2005 fab CUHK, excess loss scope
# per_component (revert = drop the m3 op), Fig. 5 series stays out.
components:
  cmp_lit_lu2017_star_4x4:
    notes: 'Fab: p.7-8 Sec. 3 (EBL Vistec EBPG 5000 Plus, 330 nm ZEP-520A; ICP Plasmalab System100): the authors etched hole test chips themselves (first person ''did the etching processes'', p.7-8) and
      used 1.6 x the full-etching time to fabricate the star-crossings at the 200 nm hole design depth (p.8); all authors at HUST (p.1) -> org_huazhong_university_of_science_and_technology (rule 12 first-person
      statement, one institution). The acknowledgments (p.10) also thank named engineers of the Center of Micro-Fabrication and Characterization (CMFC) of Wuhan National Laboratory for Optoelectronics (WNLO)
      for support in the EBL and ICP etching processes (D84b, xu2025 / D573 precedent); staff thanks do not set a facility. Design (p.4): 1/8 circular-symmetric hole arrangement, x1 = x2 = 160 nm, line
      spacing y = 99.5 nm, 25 nm grey (unpatterned) wall, coupling region 5.33 um with 33 periods, hole radius 45 nm, DBS optimization (7 iterations at 200 nm depth, Fig. 6(a)); port density about 7.1 um2/port
      (device area / port count; no registry parameter, footprint not computed). Hole radius, y and period count not entered (no registry parameter for crossing). Hole-radius series 39-51 nm (p.9: average
      IL +0.6 / +0.9 dB for +/-2.5 / +/-5 nm) not entered: the text does not say which star-crossing was used and gives only increments. Polarization not stated. Cladding not stated.'
    why: 'fab basis restated: p.7-8 Sec. 3 first-person etching (''did the etching processes'' on the hole test chips, then 1.6 x full-etching time for the star-crossings, p.8) with all authors at HUST
      (p.1) is a rule 12 statement, not only the p.10 staff thanks; fab id unchanged'
  cmp_lit_lu2017_star_5x5:
    notes: 'Fab: p.7-8 Sec. 3 (EBL Vistec EBPG 5000 Plus, 330 nm ZEP-520A; ICP Plasmalab System100): the authors etched hole test chips themselves (first person ''did the etching processes'', p.7-8) and
      used 1.6 x the full-etching time to fabricate the star-crossings at the 200 nm hole design depth (p.8); all authors at HUST (p.1) -> org_huazhong_university_of_science_and_technology (rule 12 first-person
