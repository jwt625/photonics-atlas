      nm, 5 nm grey wall, 9 DBS iterations; port density 5.83 um2/port. Hole radius and access-waveguide width not printed for this design. Length conflict (D417): p.3 prints 6.63 um for the 5 x 5 star-crossing,
      p.7 prints a 5.41 um coupling region including the grey wall; the p.7 value is entered as the coupling-region length.'
    why: 'fab basis restated: p.7-8 Sec. 3 first-person etching (''did the etching processes'' on the hole test chips, then 1.6 x full-etching time for the star-crossings, p.8) with all authors at HUST
      (p.1) is a rule 12 statement, not only the p.10 staff thanks; fab id unchanged'
  cmp_lit_lu2017_star_6x6:
    notes: 'Fab: p.7-8 Sec. 3 (EBL Vistec EBPG 5000 Plus, 330 nm ZEP-520A; ICP Plasmalab System100): the authors etched hole test chips themselves (first person ''did the etching processes'', p.7-8) and
      used 1.6 x the full-etching time to fabricate the star-crossings at the 200 nm hole design depth (p.8); all authors at HUST (p.1) -> org_huazhong_university_of_science_and_technology (rule 12 first-person
