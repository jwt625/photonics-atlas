  cmp_lit_liang2005_mzi_pbs_w3p2_w2p5-m3:
    scope: per_component
    notes: 'Paper term ''excess loss'', ''a total of 1.1 dB'' for the two MMIs and waveguide tapers (PBS excess as insertion_loss_db: polarization has no excess_loss_db; wu2017 / D595). Scope per_component:
      a straight reference waveguide of the same cross section and length removes coupling, facet and propagation loss and isolates the splitter (rule 6; fukuda2006 and wu2017 PBS rows are per_component).
      Wavelength not printed with the value; the loss measurements use the ASE source over 1520-1565 nm (inferred). Polarization not stated.'
    why: p.2 Sec. III control measurement on a straight waveguide of the same cross section and length isolates one component (rule 6 per_component); the cited precedent wu2017 is per_component, as is fukuda2006
      (reference_structure)
