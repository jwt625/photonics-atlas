      (p.1) is a rule 12 statement, not only the p.10 staff thanks; fab id unchanged'
  cmp_lit_yamaguchi2022_fifo_25mm_rotated:
    notes: 'Polymer waveguide FIFO for a four-core MCF made by the Mosquito method (core monomer dispensed from a needle into a 500 um liquid cladding monomer on a glass substrate, then UV-cured; p.1 Sec.
      II). Fab: ''fabricated applying the Mosquito method we developed [5]'' and passive fabrication sentences; authors at Keio University and Sumitomo Electric Industries: fab empty (D80b, D154), process_name
      as printed (no foundry). New MCF-side arrangement: Ch. 3 / Ch. 4 dispensed above Ch. 1 / Ch. 2, the square rotated counter-clockwise by 30 deg so no two cores sit in one vertical row (p.2 Sec. III.A,
      Fig. 4(a)); core bending not optimized. Measurement configuration and wavelength of Fig. 4(b) not stated (the preliminary straight-core study of Table 1 is at 1550 nm). Loss reduction 0.2-0.8 dB vs
      the conventional arrangement (cmp_lit_yamaguchi2022_fifo_25mm_conventional) has no registry parameter. Fig. 4(b) and the printed 2 to 3 dB are attributed to the 25 mm FIFO with unoptimized core bending
      (p.2 Sec. III.A); the same paragraph also says the cores of ''these waveguides'' (the rotated-structure study) are dispensed on straight paths before the 25 mm FIFOs are introduced, so the bend content
      of the Fig. 4(b) samples is stated only through that attribution.'
    why: 'p.2 Sec. III.A: the ''not bent ... straight path, as well'' sentence precedes the 25 mm FIFO sentence; the notes did not record it'
  cmp_lit_yamaguchi2022_fifo_25mm_conventional:
    notes: 'Polymer waveguide FIFO for a four-core MCF made by the Mosquito method (core monomer dispensed from a needle into a 500 um liquid cladding monomer on a glass substrate, then UV-cured; p.1 Sec.
      II). Fab: ''fabricated applying the Mosquito method we developed [5]'' and passive fabrication sentences; authors at Keio University and Sumitomo Electric Industries: fab empty (D80b, D154), process_name
      as printed (no foundry). Conventional MCF-side arrangement compared in Fig. 4(b) (cores stacked in vertical rows, the case Fig. 3 / Table 1 show to degrade the lower core); arrangement drawing not
      printed for the FIFO itself. Only figure-read values exist; wavelength and measurement configuration not stated. Fig. 4(b) and the printed 2 to 3 dB are attributed to the 25 mm FIFO with unoptimized
      core bending (p.2 Sec. III.A); the same paragraph also says the cores of ''these waveguides'' (the rotated-structure study) are dispensed on straight paths before the 25 mm FIFOs are introduced, so
      the bend content of the Fig. 4(b) samples is stated only through that attribution.'
    why: 'p.2 Sec. III.A: the ''not bent ... straight path, as well'' sentence precedes the 25 mm FIFO sentence; the notes did not record it'
  cmp_lit_liang2005_mzi_pbs_w3p2_w2p5:
    fab_org_ids: org_chinese_university_of_hong_kong
    notes: 'Polarization splitting from the rib-width dependence of birefringence in two equal-length MZI arms of widths w1 / w2 between two 3-dB MMIs (p.1 Sec. II). Fab: first person ''We design, fabricate,
      and test'' (p.1 abstract) and ''We have fabricated and tested'' (p.3 Sec. IV), both authors at the Department of Electronic Engineering, Chinese University of Hong Kong (p.1) -> org_chinese_university_of_hong_kong
      (rule 12; D595 chen2023b precedent). Process (p.2 Sec. III): SOI wafer (supplier not named), photolithography, SF6 / C4F8 ICP etch, single etch step. Arm length conflict (D417): p.2 prints 6 mm MZI
      arms in the fabricated samples, p.3 prints a 3 mm physical path length; arm length not entered (no arm-length parameter). The about 1 cm device length (36 um to 1 cm aspect ratio of the whole PBS,
      p.2 Sec. III) is entered as length_um (approx); it matches 6 mm arms plus two 2000 um MMIs. MMI width 36 um and length 2000 um not entered (mmi_width_um / mmi_length_um not allowed on polarization;
      registry gap). Fig. 5 width series at 1550 nm (w1 2.1-2.5 um with w2 = 3.5 um; w2 3.2-3.8 um with w1 = 2.5 um) not entered: the same nominal 2.5 / 3.5 um pair reads about -15.5 / -18 dB (TE / TM)
      in Fig. 5(a) and about -14.5 / -16.5 dB in Fig. 5(b), the 3.2 / 2.5 um pair reads about -11 / -20 dB in Fig. 5(b) vs about -16.5 / -16 dB at 1550 nm in Fig. 4, and Fig. 5(b) plots 3.8 um outside the
      printed 3.2-3.5 um range: sample identity per point not resolvable (D159). Fig. 2 computed birefringence (6.2e-4 at 2.1 um to 3.2e-4 at 2.6 um) has no registry parameter.'
    why: 'p.1 abstract ''We design, fabricate, and test'' and p.3 Sec. IV ''We have fabricated and tested'' are first-person fabrication statements; both authors at CUHK (p.1): rule 12 own org (D595 chen2023b);
      length note follows the added m9'
