# Audit patch lit_109 (fresh-context audit 2026-11-08, DevLog/audits/2026-11-08-lit_109-audit.md).
# 203 metrics: 177 ok / 23 imprecise / 3 wrong; 24 components: 20 ok / 4 imprecise / 0 wrong, 0 deleted; 1 miss added.
# Coordinator rulings open: Q1 chen2016a 400 nm Ge row kept (D408 reading; to delete it add the component to
# delete_components); Q2 chen2019 0.07 A/W rows deleted under D159 / D254 (to keep them drop delete_metrics and the three
# chen2019 component notes ops); Q3 smith2023 8 q_intrinsic / ring-loss rows -> author_estimate under D403 (to keep
# derived drop those 8 ops). All other ops are figure re-reads, condition-field fixes and a conflict note.
components:
  cmp_lit_chen2016a_si_lpin_gepd_ge400:
    notes: 'Fab as the 160 nm device (p.2 Sec. 2; Fig. 9 caption: only the Ge thickness differs). The 400 nm design is the one of the authors'' earlier ref. [11] (p.2: 20 GHz there, transit-time limited, over 1 A/W across the C band at -1 V). Kept under D408: Fig. 9 and its p.8 discussion carry no citation and call the curves experimental; the figure is assembled in this paper (the 160 nm traces of Fig. 9(a) are the Fig. 5(a) 1550 nm curves with the same > 50 GHz labels, the 160 nm trace of Fig. 9(b) is the Fig. 4(a) spectrum), and the 400 nm label (19 GHz at -1 V) differs from the 20 GHz this paper quotes for ref. [11]. Weak point: no fabrication or measurement sentence names this device. Bias of the Fig. 9(b) responsivity spectrum and its normalization not stated. Length taken as the 160 nm device''s 14.2 um only through the caption''s ''only difference'' statement, so no length row.'
    why: 'Audit Q1 (D259 / D408): records the evidence for keeping the row. p.2 Sec. 1 (ref. [11] values), p.8 Sec. 4, p.10 Fig. 9 vs p.5 Fig. 4(a) and p.7 Fig. 5(a) (identical 160 nm traces and labels)'
  cmp_lit_chen2019_utc_pd_d10:
    notes: 'Fab empty: growth and mesa processing in passive voice, no org named (all authors at ShanghaiTech University, first author also SIMIT / UCAS; D80b). Parasitic capacitance 49.6 fF from the C vs area fit over the three diameters (Fig. 4). 100 % cutoff wavelength about 2.25 um (p.2, no parameter). Responsivity 0.07 A/W at 2 um is stated for ''the devices'' (p.1 abstract, p.2 Sec. 3B, p.6 conclusion) from one top-illuminated FTIR spectrum whose device (diameter) is not given; not entered on any diameter row (D159 / D254: one value stated for the device family). Fig. 5 inset reads about 0.063 A/W at 0 V and 0.073-0.074 A/W at -1 to -4 V. Not entered: RC-limit bandwidth 41.4 GHz (computed from the fitted circuit, Fig. 9(e)) and the rough transit-time limit about 31 GHz (Eq. 1); 30 Gbit/s eye at -3 V (Fig. 11); Fig. 12 RF output vs photocurrent curves beyond Table 2.'
    why: Follows the deletion of the 0.07 A/W rows (audit Q2, D159 / D254); p.1 Abstract, p.2 Sec. 3B, p.3 Fig. 5 inset
  cmp_lit_chen2019_utc_pd_d20:
    notes: 'Fab empty: growth and mesa processing in passive voice, no org named (all authors at ShanghaiTech University, first author also SIMIT / UCAS; D80b). Parasitic capacitance 49.6 fF from the C vs area fit over the three diameters (Fig. 4). 100 % cutoff wavelength about 2.25 um (p.2, no parameter). Responsivity 0.07 A/W at 2 um is stated for ''the devices'' (p.1, p.2) from one top-illuminated FTIR spectrum whose device (diameter) is not given; not entered on any diameter row (D159 / D254; values in cmp_lit_chen2019_utc_pd_d10 notes). RC-limit bandwidth 18.9 GHz (computed, Fig. 9(e)) not entered.'
    why: Follows the deletion of the 0.07 A/W rows (audit Q2, D159 / D254); p.2 Sec. 3B
  cmp_lit_chen2019_utc_pd_d40:
    notes: 'Fab empty: growth and mesa processing in passive voice, no org named (all authors at ShanghaiTech University, first author also SIMIT / UCAS; D80b). Parasitic capacitance 49.6 fF from the C vs area fit over the three diameters (Fig. 4). 100 % cutoff wavelength about 2.25 um (p.2, no parameter). Responsivity 0.07 A/W at 2 um is stated for ''the devices'' (p.1, p.2) from one top-illuminated FTIR spectrum whose device (diameter) is not given; not entered on any diameter row (D159 / D254; values in cmp_lit_chen2019_utc_pd_d10 notes). RC-limit bandwidth 7.7 GHz (computed, Fig. 9(e)) not entered.'
    why: Follows the deletion of the 0.07 A/W rows (audit Q2, D159 / D254); p.2 Sec. 3B
