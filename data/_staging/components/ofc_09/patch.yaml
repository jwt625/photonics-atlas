components:
  cmp_ofc2026_tu2d4_ge_pd:
    class: photodetector.other
    notes: 'STMicroelectronics PIC100G back-side integrated 300 mm SiPh platform (300 nm SOI / 200 nm BOX, wafer-bonded on HR carrier, reconstructed BOX > 5 um); the paper presents it as ST''s platform
      (authors ST Crolles / Grenoble and CEA-Leti). Ge photodiode with a vertical single Si/Ge heterojunction (Sec. 2); the paper does not state how light is coupled into the Ge (waveguide-coupled not stated),
      so the generic subtype other is used. O-band values at 25 C (Table 2). Text: bandwidth ''above 80GHz @-1V'' and dark current ''around 10nA''.'
    why: 'flag check: Sec. 2-3 and Table 2 say only "Ge photodiodes" / "single heterojunction photodiode"; ge_waveguide is not stated (rule 1: no guess)'
