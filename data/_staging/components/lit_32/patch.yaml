# Audit patch lit_32 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_32-audit.md).
# 246 metrics: 243 ok / 2 imprecise / 1 wrong; 26 components: 25 ok / 1 imprecise / 0 wrong (one more note updated after a miss); 5 misses added.
# Not covered here (coordinator decisions, see the audit file): Service Center for Physical Sciences at Westlake
# University (sun2026a facility, not in the registry); suzuki2021 / yang2020 journal extensions of the authors' own OFC
# papers (D259 scope); registry gaps.
components:
  cmp_lit_mikkelsen2018_sin_inverse_taper_ec:
    test_structure: 'true'
    why: 'p.4 Measurements: the edge-coupler loss was determined from a straight waveguide calibration structure (dedicated
      test structure)'
  cmp_lit_sun2026a_dc_fpr_unit:
    notes: 'Two Bragg mode-conversion reflectors (TE0_r <-> TE1) form the F-P cavity; asymmetric mode directional couplers
      phase-match TE0 bus to TE1. Heaters P1 (global, wavelength tuning) and P2 (local, intensity tuning). FSR-free single-peak
      bandwidth > 300 nm (simulated; measured devices show a single peak within the measurable range) entered as fsr_nm
      > 300 (m14, Table 1 FSR column). Separate devices for O, S and C bands (Fig. 2(e)-(g)). Undercut gives a nearly eightfold
      tuning-efficiency improvement and 12-inch MPW wafer-scale results (Supp. Notes 5-6, not cached; no numbers in the
      main text). Size 150 x 10 um from Table 1. Methods (p.16): 220 nm SOI, 100 kV EBL, ICP-RIE 150 nm etch, 800 nm PECVD
      SiO2, Pt/Au heaters, XeF2 undercut, wire bonding to a PCB. Author contributions (p.17): chip fabrication and packaging
      by authors at Westlake University and Zhejiang University -> fab org_westlake_university + org_zhejiang_university
      (D80b, two orgs); Crealights staff assisted with wafer-scale device fabrication (MPW, not a fab statement, D395).
      Acknowledgment (p.17) of the Westlake Center for Micro/Nano Fabrication and Instrumentation, the Service Center for
      Physical Sciences at Westlake University (not in the registry) and the ZJU Micro-Nano Fabrication Center for providing
      facilities -> facility_org_ids. Supplement not cached.'
    why: 'consequence of the added fsr_nm row m14 (p.13 Table 1 FSR > 300 nm): the note said the value had no registry parameter'
