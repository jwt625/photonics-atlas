  cmp_lit_giewont2019_ge_pd:
    notes: 'Fab: paper describes CMS90WG as the GlobalFoundries 300 mm foundry technology, with data from lots in manufacturing (p.1-2). Text range 35 to 70 nA is attributed to the final process, while Fig. 8 plots newPOR about 15 to 50 nA and oldPOR about 30 to 70 nA: the printed value is kept (m1), the newPOR peak is entered as m4. Paths to 50 to 60 GHz are roadmap only.'
    why: note follows added row m4 (p.5 Fig. 8)
  cmp_lit_chen2022b_si_spiral:
    platform: ''
    notes: 'Fab: AIM Photonics foundry named for fabrication (p.2, p.6); MPW runs. Same MPW run as sample H. Delay 0.95 ns/cm, 20.8 ns/mm2, 10.42 dB/ns (Table III): no parameter. Spiral separation 9 um. Platform empty: the Si layer of the AIM run is not stated as SOI for this device (the p.1 SOI sentence is about the literature; D422 / D423).'
    why: 'D423: p.4-6 name only a Si spiral, a Si layer and the AIM foundry service; SOI appears only in a cited general statement (p.1 Sec. I), so the platform is not defaulted'
  cmp_lit_veiga2026_sin1_annealed_w700:
    notes: 'No fab org: fabrication sentences are passive and the authors sit at LTM / CNRS / UGA and CEA-Leti, Grenoble (not unambiguous, D80b); RENATECH appears as funding only. Loss is the mean over 15 dies with std error bars (p.4). Annealed 1100 C after patterning, then capped (p.7). Width on nominal-700 lines drops to 547 nm (SiN1) and 563 nm (SiN2) (Table III). Index 2.07 at 1.31 um after anneal (Table II). Film thickness falls with the 1100 C anneal by 15.4 % (SiN1) and 6.3 % (SiN2), printed as about 50 and 20 nm (p.5 Sec. IV-A): core_thickness_nm is the as-deposited design value.'
    why: 'miss: annealed rows carry the 400 nm as-deposited thickness; the paper states densification shrink (p.5 Sec. IV-A), the percentages and nm values do not agree for SiN1 (15.4 % of 400 nm is 62 nm), no post-anneal thickness row is possible'
  cmp_lit_veiga2026_sin2_annealed_w700:
    notes: 'No fab org: fabrication sentences are passive and the authors sit at LTM / CNRS / UGA and CEA-Leti, Grenoble (not unambiguous, D80b); RENATECH appears as funding only. Loss is the mean over 15 dies with std error bars (p.4). Annealed 1100 C after patterning, then capped (p.7). Width on nominal-700 lines drops to 547 nm (SiN1) and 563 nm (SiN2) (Table III). Index 1.97 at 1.31 um after anneal (Table II). Conclusion range 0.18 to 0.24 dB/cm at 1.31 um is stated for widths 700 to 900 nm of annealed PECVD SiN, not tied to one row (D254). Film thickness falls with the 1100 C anneal by 15.4 % (SiN1) and 6.3 % (SiN2), printed as about 50 and 20 nm (p.5 Sec. IV-A): core_thickness_nm is the as-deposited design value.'
    why: 'miss: annealed rows carry the 400 nm as-deposited thickness; the paper states densification shrink (p.5 Sec. IV-A), the percentages and nm values do not agree for SiN1 (15.4 % of 400 nm is 62 nm), no post-anneal thickness row is possible'
  cmp_lit_veiga2026_sin2_annealed_w1000:
    notes: 'No fab org: fabrication sentences are passive and the authors sit at LTM / CNRS / UGA and CEA-Leti, Grenoble (not unambiguous, D80b); RENATECH appears as funding only. Loss is the mean over 15 dies with std error bars (p.4). Annealed 1100 C after patterning, then capped (p.7). Width on nominal-700 lines drops to 547 nm (SiN1) and 563 nm (SiN2) (Table III). Core size from Table V. Film thickness falls with the 1100 C anneal by 15.4 % (SiN1) and 6.3 % (SiN2), printed as about 50 and 20 nm (p.5 Sec. IV-A): core_thickness_nm is the as-deposited design value.'
    why: 'miss: annealed rows carry the 400 nm as-deposited thickness; the paper states densification shrink (p.5 Sec. IV-A), the percentages and nm values do not agree for SiN1 (15.4 % of 400 nm is 62 nm), no post-anneal thickness row is possible'
  cmp_lit_thiel2026_balanced_photoreceiver:
    notes: 'Fab: Nexus Photonics team acknowledged for fabrication of the heterogeneous platform; lasers and detectors use that process (p.3-5, p.7). TIA maker not stated. Body measures 510 MHz for this co-packaged receiver (m1). The abstract 3 GHz for detectors with amplifiers is not tied to this receiver: it matches the 3 dB below peak crossing of the Fig. 4(f) photodiode classes (see the pd rows). No parameter: 5.9 kohm gain, 1.9 pA/rtHz noise, shot-noise clearance above 30 dB, CMRR 50.4 dB at 10 MHz.'
    why: follows deletion of m2
  cmp_lit_romerogarcia2013_mmi_1x4:
    notes: 'No fab org: fabricated in an unnamed standard CMOS pilot line on 200 mm wafers (p.8); TSMC staff are only thanked by name (p.11), not stated as fabricator. Imbalance is defined as (max - min) / mean of the port powers and measured below 10 % at 57.3 um (p.11; simulated below 1 %, p.8): no parameter for this linear definition, imbalance_db not used. Table 2 sensitivities (above 91 % at width +/- 0.2 um) stay here.'
    why: simulated efficiency is now row m10 (dB form), as the measured efficiency in m1
