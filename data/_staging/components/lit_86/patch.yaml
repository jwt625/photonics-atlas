# Audit patch lit_86 (fresh-context audit 2026-11-06, DevLog/audits/2026-11-06-lit_86-audit.md).
# 133 metrics: 118 ok / 11 imprecise / 4 wrong; 20 components: 14 ok / 0 imprecise / 6 wrong (heim2026 fab), 0 deleted;
# misses: 2 geometry metrics added (romerogarcia2014). Coordinator decisions open: audit Q1 (heim2026 1.65 M basis), Q2 (franken2025 78 mW basis),
# Q3 (yang2018 unit-cell rows deleted), Q4 (heim2026 laser rows fab incl. UCSB).
components:
  cmp_lit_heim2026_stabilized_ectl:
    fab_org_ids: org_honeywell;org_ucsb
    notes: 'Same Vernier ring radii as merged heim2025 (authors'' ref. 52) but 2.8 um ring waveguides (p.9, p.16) and 6 um cladding; new monolithic
      chip with the stabilization circuit. Not in the registry: ADEV 6.5e-13 at 0.08 ms, 225 kHz/s drift (p.7); lock bandwidth 0.1 MHz (0.1-0.3
      MHz, p.18); about 6 orders of frequency-noise suppression near 100 Hz (p.7); error-signal slope 0.45 MHz/V at 1540 nm (p.17). Self-isolation
      over -30 dB cited to ref. 52: not entered (rule 3). The RSOA-to-Si3N4 butt coupling has no stated loss: no coupler row. Fab: the contributions
      statement (p.13) names K.D.N. (Honeywell Aerospace) as the fabricator of the chips (D395, D399; heim2025 coil precedent); Methods (p.9)
      says only ''fabricated in a CMOS foundry''. D.A.S.H. (UCSB) built the ECTL with the purchased RSOA (p.13): UCSB on this assembled row (D399).
      Cross-notes: cmp_lit_heim2026_ectl_vernier_rings, _coil_4m.'
    why: 'p.13 Contributions: ''K.D.N. fabricated them'' (the integrated photonic chips); K.D.N. is at Honeywell Aerospace (p.1). D395 / D399:
      fab = the org of the author the fabrication sentence names; merged heim2025 coil row carries org_honeywell for the same author; p.13 ''D.A.S.H.
      built the ECTL'' is a first-person assembly statement for this hybrid row (D399, D419)'
  cmp_lit_heim2026_sbs_laser:
    fab_org_ids: org_honeywell;org_ucsb
    notes: 'Not in the registry: ADEV 2.8e-13 at 5.12 ms, 5 kHz/s drift (p.7); lock bandwidth 0.8 MHz (p.5, p.10); self-isolation 25 dB (p.5);
      fundamental linewidth stays 4.0 Hz for feedback from -43 to -7 dB (p.15); integral linewidth reduced > 20x by the lock (p.2). 80/20 splitter
      to the stabilization circuit (design ratio, no measured value). Fab: the contributions statement (p.13) names K.D.N. (Honeywell Aerospace)
      as the fabricator of the chips (D395, D399; heim2025 coil precedent); Methods (p.9) says only ''fabricated in a CMOS foundry''. K.L. (UCSB)
      built and packaged the SBS laser (p.13): UCSB on this assembled row (D399). Cross-notes: cmp_lit_heim2026_sbs_ring (D396), _stokes_filter_ring,
      _coil_4m.'
    why: 'p.13 Contributions: ''K.D.N. fabricated them'' (the integrated photonic chips); K.D.N. is at Honeywell Aerospace (p.1). D395 / D399:
      fab = the org of the author the fabrication sentence names; merged heim2025 coil row carries org_honeywell for the same author; p.13 ''K.L.
      built and packaged the SBS laser'' (D399, D419)'
  cmp_lit_heim2026_ectl_vernier_rings:
    fab_org_ids: org_honeywell
    notes: 'Vernier ring pair of the ECTL (D400 intracavity rings); one row for both, radii per ring in condition. Loaded Q 1.65 M (p.4) is stated
      without a spectrum, fit or method in the main text or supplement; the sentence ends with ref. 52 after the self-isolation clause. heim2025
      (ref. 52) prints 0.65 M for 2.6 um wide rings; these are 2.8 um wide (p.9), so not a restated value (D408): kept as author_estimate (D76).
      Fab: the contributions statement (p.13) names K.D.N. (Honeywell Aerospace) as the fabricator of the chips (D395, D399; heim2025 coil precedent);
      Methods (p.9) says only ''fabricated in a CMOS foundry''. Cross-note cmp_lit_heim2026_stabilized_ectl.'
    why: 'p.13 Contributions: ''K.D.N. fabricated them'' (the integrated photonic chips); K.D.N. is at Honeywell Aerospace (p.1). D395 / D399:
      fab = the org of the author the fabrication sentence names; merged heim2025 coil row carries org_honeywell for the same author; Q note follows
      the m1 basis change'
  cmp_lit_heim2026_coil_4m:
    fab_org_ids: org_honeywell
    notes: 'Coil resonator coupled to one arm of an unbalanced MZI with a heater on the delay arm; balanced detection of the two outputs gives
      the modulation-free error signal (p.3, p.17). Same design on the ECTL and SBS chips. Not in the registry: error-signal slopes 0.14-0.53
      MHz/V (p.5) vs 0.13-0.5 MHz/V over 1520-1570 nm and 0.45 MHz/V at 1540 nm (p.17). Fab: the contributions statement (p.13) names K.D.N. (Honeywell
      Aerospace) as the fabricator of the chips (D395, D399; heim2025 coil precedent); Methods (p.9) says only ''fabricated in a CMOS foundry''.
      Cross-notes: cmp_lit_heim2026_stabilized_ectl, _sbs_laser.'
    why: 'p.13 Contributions: ''K.D.N. fabricated them'' (the integrated photonic chips); K.D.N. is at Honeywell Aerospace (p.1). D395 / D399:
      fab = the org of the author the fabrication sentence names; merged heim2025 coil row carries org_honeywell for the same author'
  cmp_lit_heim2026_sbs_ring:
    fab_org_ids: org_honeywell
    notes: 'Gap chosen so the ring is slightly over-coupled at 1550 nm (design statement, p.9); micro-heater on top. p.7 also states a platform
      loss below 1 dB/m at 1550 nm (not a separate row). Fab: the contributions statement (p.13) names K.D.N. (Honeywell Aerospace) as the fabricator
      of the chips (D395, D399; heim2025 coil precedent); Methods (p.9) says only ''fabricated in a CMOS foundry''. Cross-note cmp_lit_heim2026_sbs_laser
      (D396).'
    why: 'p.13 Contributions: ''K.D.N. fabricated them'' (the integrated photonic chips); K.D.N. is at Honeywell Aerospace (p.1). D395 / D399:
      fab = the org of the author the fabrication sentence names; merged heim2025 coil row carries org_honeywell for the same author'
  cmp_lit_heim2026_stokes_filter_ring:
    fab_org_ids: org_honeywell
    notes: 'Drops the first-order Stokes to the output bus and filters back-reflected pump, replacing a fiber circulator; heavily over-coupled
      by design, thermally tuned (p.9). Not in the registry: 23 dB suppression of back-reflected pump vs a fiber circulator (p.15, Supp. Fig.
      3(b)). Class wdm.mrr (wavelength-selective drop filter in the output path, not an intracavity ring). Fab: the contributions statement (p.13)
      names K.D.N. (Honeywell Aerospace) as the fabricator of the chips (D395, D399; heim2025 coil precedent); Methods (p.9) says only ''fabricated
      in a CMOS foundry''. Cross-note cmp_lit_heim2026_sbs_laser.'
    why: 'p.13 Contributions: ''K.D.N. fabricated them'' (the integrated photonic chips); K.D.N. is at Honeywell Aerospace (p.1). D395 / D399:
      fab = the org of the author the fabrication sentence names; merged heim2025 coil row carries org_honeywell for the same author'
  cmp_lit_yang2018_pcf_metalens_na037:
    notes: 'Not in the registry: measured focal length 26.7-28.0 um over 1500-1630 nm (28.0 um at 1550 nm); simulated 28.5 um; design 30 um (p.5,
      Fig. 5(a)). Maximum operating (RCP-to-LCP focusing) efficiencies 16.1 % at 1530 nm and 16.4 % at 1540 nm are printed for ''these two'' lenses
      (p.5); the assignment is not determinable (text order vs Fig. 5(b) readings), not entered (D159). Enhanced optical intensity 234 % at 1540
      nm (p.5) is not tied to a lens in the text and has no parameter. Fabricated unit-element dimensions are in the supplement (Table S1, not
      cached). Fab: first-person process statement with authors at three orgs, fabricating org not named. Baylor CMI thanked for microscopy support
      (p.6): not a fabrication facility entry. In scope as a fiber-coupled passive part (D411). Simulated unit-cell values (periodic array, not
      lens metrics; not entered): with SEM-measured dimensions 1499.3 nm resonance and 16.9 % RCP-to-LCP conversion (p.3); optimized design unit
      1482.6 nm, 17 % (p.2). Fig. 5(b) render: the NA 0.37 curve peaks near 1510 nm at about 17 %, the NA 0.23 curve at about 16 % near 1530-1540
      nm (read +/- 0.5 %), so neither printed maximum (16.1 % at 1530 nm, 16.4 % at 1540 nm) maps to one curve.'
    why: consequence of deleting m2 / m3 (unit-cell simulation values, audit Q3); Fig. 5(b) reading added to support the D159 call on p.5
  cmp_lit_yang2018_pcf_metalens_na023:
    notes: 'Not in the registry: measured focal length 40.0-41.3 um over 1500-1630 nm (40.0 um at 1550 nm); simulated 40.0-41.0 um; design 50
      um (p.5, Fig. 5(a)). Maximum operating (RCP-to-LCP focusing) efficiencies 16.1 % at 1530 nm and 16.4 % at 1540 nm are printed for ''these
      two'' lenses (p.5); the assignment is not determinable (text order vs Fig. 5(b) readings), not entered (D159). Enhanced optical intensity
      234 % at 1540 nm (p.5) is not tied to a lens in the text and has no parameter. Fabricated unit-element dimensions are in the supplement
      (Table S1, not cached). Fab: first-person process statement with authors at three orgs, fabricating org not named. Baylor CMI thanked for
      microscopy support (p.6): not a fabrication facility entry. In scope as a fiber-coupled passive part (D411). Simulated unit-cell values
      (periodic array, not lens metrics; not entered): with SEM-measured dimensions 1490.3 nm resonance and 16.5 % RCP-to-LCP conversion (p.3);
      optimized design unit 1482.6 nm, 17 % (p.2). Fig. 5(b) render: the NA 0.37 curve peaks near 1510 nm at about 17 %, the NA 0.23 curve at
      about 16 % near 1530-1540 nm (read +/- 0.5 %), so neither printed maximum (16.1 % at 1530 nm, 16.4 % at 1540 nm) maps to one curve.'
    why: consequence of deleting m2 / m3 (unit-cell simulation values, audit Q3); Fig. 5(b) reading added to support the D159 call on p.5
