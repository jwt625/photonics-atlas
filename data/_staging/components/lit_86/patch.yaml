delete_metrics:
- id: cmp_lit_yang2018_pcf_metalens_na037-m2
  why: 'p.3 Sec. 2: 1499.3 nm is the simulated resonance of one unit element in a periodic array (unit-cell boundary, p.6 Methods), not a response
    of the lens; the lens operates 1500-1630 nm with its measured efficiency peak elsewhere (p.5 Fig. 5(b)). Value kept in component notes; audit
    Q3'
- id: cmp_lit_yang2018_pcf_metalens_na037-m3
  why: 'p.3 Sec. 2: 16.9 % is a simulated RCP-to-LCP polarization-conversion efficiency of a periodic unit-cell array, not a coupling efficiency
    of the lens (the measured lens quantity is the p.5 operating efficiency, not entered under D159); coupling_efficiency_pct per_component would
    rank it as lens throughput. Value kept in component notes; audit Q3'
- id: cmp_lit_yang2018_pcf_metalens_na023-m2
  why: 'p.3 Sec. 2: 1490.3 nm is the simulated resonance of one unit element in a periodic array (unit-cell boundary, p.6 Methods), not a response
