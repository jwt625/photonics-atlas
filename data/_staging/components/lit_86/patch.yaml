  cmp_lit_franken2025_dual_gain_ecl-m1:
    basis: author_estimate
    notes: Printed as on-chip power (p.4, Fig. 3(a)). The output leaves through the TFLN-to-fiber PWB and fiber array; how it was referred to
      the chip is not described, and the 3 dB LN-to-fiber PWB loss was measured on a separate characterization chip (p.4, p.8 Acknowledgments).
      De-embedding term not stated (D76, D431).
    why: 'p.4-5: an on-chip power whose de-embedding term is not stated rests on a loss of unstated origin (rule 4, D76; lihachev2022 120 mW precedent,
      D431); D167 is limited to per-facet coupling loss. Distiller judgment call 5'
  cmp_lit_heim2026_ectl_vernier_rings-m1:
    basis: author_estimate
    locator: p.4
    notes: 'Stated with the rings (p.4); no spectrum, fit or method for this Q in the main text or supplement: origin not stated (D76). The sentence
      ends with ref. 52 after the self-isolation clause; ref. 52 (heim2025) prints 0.65 M for 2.6 um wide rings and these are 2.8 um (p.9), so
      not a restated value (D408).'
    why: 'p.4: the sentence sits before the p.5 marker; no measurement of this Q anywhere in the text (Supp. Sec. 3 p.16-17 covers tuning, SMSR
      and linewidth only), unlike the SBS ring (''we measure'', p.14) and the coil (spectrum in Fig. 2(a)); D76. Audit Q1'
