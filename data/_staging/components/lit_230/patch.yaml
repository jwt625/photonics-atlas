# Audit patch lit_230 (fresh-context audit 2026-11-20, DevLog/audits/2026-11-20-lit_230-audit.md).
# 66 metrics: 56 ok / 10 imprecise / 0 wrong; 11 components: 10 ok / 1 imprecise / 0 wrong. 3 misses added.
# Fixes: geng2014 NIPD 0.6 A/W kept with the Fig. 8(a) conflict noted (D417); geng2014 bandwidth rows get 1550 nm inferred
# (rule 8, lit_61 reading); ozdemir2020 Fig. 3(b) medians extracted_from_figure -> author_estimate (figure-read estimate keeps its
# origin basis, D80a / D454 analogue); bernard2021 responsivity 0.304 A/W from the Fig. 2(c) label (text prints about 0.3);
# gao2025b cladding step reclassed waveguide_platform.other (one core layer, cladding change: quack2019 / xiao2022 precedent).
# Misses: geng2014 printed active areas (footprint_um2, yuan2021 precedent); bernard2021 10 um epi absorber thickness (D153).
components:
  cmp_lit_gao2025b_cladding_step:
    class: waveguide_platform.other
    notes: 'Fab org_ligentec: ''The Si3N4/Si chip was fabricated by a foundry (LIGENTEC)'' (p.2). The cladding thinning is passive (''has been thinned'', p.1) with no org named; fab names the chip foundry only. Same Si3N4 core on both sides, only the SiO2 top cladding changes (6.3 um to about 100 nm at the bonding-window edge): an in-layer cladding transition, waveguide_platform.other (quack2019 air-clad to oxide-clad transition, xiao2022 / cheng2025 precedent, D417); authors expect lower loss with wider waveguides (p.1).'
    why: 'p.1: one Si3N4 core, only the cladding changes; inter-layer / inter-material transitions are waveguide_platform.transition (rule 10), a cladding change within one core layer is waveguide_platform.other (merged cmp_lit_quack2019_air_oxide_transition; D417 xiao2022)'
