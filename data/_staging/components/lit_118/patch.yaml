# Audit patch lit_118 (fresh-context audit 2026-11-09, DevLog/audits/2026-11-09-lit_118-audit.md).
# 167 metrics: 160 ok / 7 imprecise / 0 wrong; 30 components: 24 ok / 6 imprecise / 0 wrong, 0 deleted; 6 misses added (6 metrics).
# Coordinator rulings open: Q1 hsu2025 39 GHz fiber-channel bandwidth (recommend notes only, no op), Q2 osorniomartinez2025 PHIX fab
# (recommend coupler row only, no op), Q3 hsu2025 coupling class (keep, no op), Q4 zhao2016 HHI fab and < 0.1 dB/cm (keep, no op),
# Q5 zhang2023b fab / li2025c Fig. 3(a) / deng2020 basis (keep; zhang2023b note wording fixed). To skip the figure-read miss on
