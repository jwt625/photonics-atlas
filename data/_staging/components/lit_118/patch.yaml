components:
  cmp_lit_zhao2016_vernier_ecl:
    core_material: InP/InGaAsP SOA gain chip (Fraunhofer HHI; HR-coated outer facet and AR-coated facet toward the Si3N4 chip as drawn in Fig. 1, which the text calls the front (HR) and back (AR) facets) + TriPleX double-stripe Si3N4/SiO2 chip with two microrings, phase section and power-tuning section (heaters)
    why: p.1 Sec. II prints 'Front and back facets of the SOA are high- and anti-reflection coated, respectively'; the batch wrote HR back / AR front. p.1 Fig. 1 places HR at the outer end and AR toward the phase section, so the physical placement is kept and the printed naming added
  cmp_lit_zhao2016_hhi_soa_gain_chip:
    core_material: InP/InGaAsP semiconductor optical amplifier gain chip, HR-coated outer facet and AR-coated facet toward the Si3N4 chip (Fig. 1; p.1 Sec. II names them the front (HR) and back (AR) facets)
    why: Same correction as the ECL row (p.1 Sec. II wording vs p.1 Fig. 1 placement)
  cmp_lit_zhang2023b_interchip_coupler:
    notes: 'Fab: first-person fabrication flow (p.5-6, ''we perform'', ''we deposited''), all six authors at UC Davis (p.1; abstract: we design, fabricate, and demonstrate; D72, lee2025 precedent). Staff support acknowledged at the UC Davis Center for Nano/Micro Manufacturing and the UC Berkeley Marvell Nanofabrication Laboratory (p.11) is staff thanks: no facility_org_ids (D84b). 3-dB lateral misalignment tolerance +/-3.53 um (Fig. 7(b); no 3-dB tolerance parameter, D81). Longitudinal tolerance > 50 um (criterion not stated, p.3). Post-bonding misalignment estimated 5 um; the minimum loss is at the offset that compensates it, the broadband scan at -5 um offset. Bonding 400 C, 3 N, 10 min; anneal 350 C, 67 N, 1 h (p.6).'
    why: p.1 lists six authors, all at the UC Davis Department of Electrical and Computer Engineering; the note said both authors. Fab value unchanged (Q5)
  cmp_lit_zhang2023b_eps_1x10:
    notes: 'Fab: first-person fabrication flow (p.5-6, ''we perform'', ''we deposited''), all six authors at UC Davis (p.1; abstract: we design, fabricate, and demonstrate; D72, lee2025 precedent). Staff support acknowledged at the UC Davis Center for Nano/Micro Manufacturing and the UC Berkeley Marvell Nanofabrication Laboratory (p.11) is staff thanks: no facility_org_ids (D84b). Aperture dimensions not printed. Simulated per-port insertion loss in Fig. 10(c) not entered.'
    why: p.1 lists six authors, all at the UC Davis Department of Electrical and Computer Engineering; the note said both authors. Fab value unchanged (Q5)
  cmp_lit_zhang2023b_wafer_distribution_1x100:
    notes: 'Fab: first-person fabrication flow (p.5-6, ''we perform'', ''we deposited''), all six authors at UC Davis (p.1; abstract: we design, fabricate, and demonstrate; D72, lee2025 precedent). Staff support acknowledged at the UC Davis Center for Nano/Micro Manufacturing and the UC Berkeley Marvell Nanofabrication Laboratory (p.11) is staff thanks: no facility_org_ids (D84b). Terminals are grating emitters (cmp_lit_zhang2023b_grating_emitter) in this demonstration. Stitching misalignment 100 nm; the ''around 0.075 dB insertion loss at all the connections'' from simulation (p.8) is not entered: per connection or total is not stated (Fig. 11(c), p.9, gives about 0.015 dB at 100 nm).'
    why: p.1 lists six authors, all at the UC Davis Department of Electrical and Computer Engineering; the note said both authors. Fab value unchanged (Q5)
  cmp_lit_zhang2023b_grating_emitter:
    notes: 'Fab: first-person fabrication flow (p.5-6, ''we perform'', ''we deposited''), all six authors at UC Davis (p.1; abstract: we design, fabricate, and demonstrate; D72, lee2025 precedent). Staff support acknowledged at the UC Davis Center for Nano/Micro Manufacturing and the UC Berkeley Marvell Nanofabrication Laboratory (p.11) is staff thanks: no facility_org_ids (D84b). Emission imaged with an IR camera only (out of focus, not at the optimum angle, p.8-9); the 100 nm Si3N4 gives weak, long emission (Fig. 13).'
