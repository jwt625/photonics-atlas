add_components:
- component_id: cmp_lit_korcek2023_bend_r80
  source_id: lit:korcek2023
  class: waveguide_platform.bend
  label: Si3N4 strip waveguide bend, 80 um radius, 1 um x 400 nm, air-clad (bend-count test structures)
  row_kind: fabricated
  host_device_ids: ''
  platform: sin
  core_material: LPCVD Si3N4 400 nm on 6 um BOX, single full etch to the BOX (EBL + RIE); air superstrate
  cladding: none (air)
  fab_org_ids: org_centre_de_nanosciences_et_de_nanotechnologies;org_cea_leti
  facility_org_ids: ''
  process_name: ''
  test_structure: 'true'
  tags: ''
  verified_on: '2026-10-29'
  notes: 'Fab: author contributions (p.11) name R.K. (University of Zilina), Q.W. (CEA-Leti), S.E. and C.A.R. (C2N) as having
    fabricated the samples; fabricator orgs per D80b: C2N and CEA-Leti entered, University of Zilina not in the registry (reported).
    Work done within the C2N micro nanotechnologies platforms (acknowledgments p.11): the platform is not in the registry
    and its owner C2N is not a facility (D82c; lit_24 ruling, liu2018 / gonzalezandrade2019), so facility_org_ids empty; RENATECH
    network support is a program (not entered). Bend angle per bend not stated (test layout Fig. 5(a) / (c) shows U-turns);
    per-bend loss from structures with 2-10 bends (Fig. 5(e)).'
  why: 'miss: p.5 ''bending losses ... measured to be ... 0.25 dB/bend'', p.9 Methods (bend test structures, slope fit, 80
    um radius); merged bend rows carry per-bend loss as insertion_loss_db per_component (8 rows); the batch skipped it only
    for the missing bend angle'
