# Audit patch lit_67 (fresh-context audit 2026-11-02, DevLog/audits/2026-11-02-lit_67-audit.md).
# 290 metrics: 270 ok / 20 imprecise / 0 wrong; 42 components: 42 ok (5 notes updates), 0 deleted; misses: 20 geometry rows added.
# After the patch: 42 components, 310 metrics. Not covered here (coordinator rulings): audit Q1-Q4; missing orgs FBK and the
# Munster Nanofabrication Facility (fab / facility stay empty until registered); registry gaps listed in the audit file.
components:
  cmp_lit_zhang2024b_fe_ring_ps:
    notes: 'Fab: author contributions (p.10) name two NUS authors. Same lab and gate stack as lit:chen2022; Fig. 4(a), 4(b) and 5 here show the same curves as chen2022 Fig. 19, 10 and 12 with no attribution (D408: values kept, audit Q1); ring values are read at 1 V here, at 3 V in chen2022. All measurements with a 520 nm laser of about 5 mW on the ring and a TEC (p.4, p.10). Read: -5 V, 100 us pulse gives 90 % of the maximum peak shift (10 kHz writing speed, Fig. 2(d)); writing energy 5.05 nJ (Table 1); Pr 7.43 uC/cm2 (Fig. 2(c)); RBER between states up to 2.3e-2 optical, 5.9e-2 electrical: no registry parameters. Quality factors in the uncached supplement (Fig. S3).'
    why: 'distiller question 5: p.5 Fig. 2, p.8 Fig. 4-5 renders compared with chen2022 p.2 Fig. 10, 12, 16, 19; the previous wording said only that values differ'
  cmp_lit_zhang2024b_fe_ring_resonator:
    notes: 'Fab: author contributions (p.10) name two NUS authors. Same lab and gate stack as lit:chen2022; Fig. 4(a), 4(b) and 5 here show the same curves as chen2022 Fig. 19, 10 and 12 with no attribution (D408: values kept, audit Q1); ring values are read at 1 V here, at 3 V in chen2022. All measurements with a 520 nm laser of about 5 mW on the ring and a TEC (p.4, p.10). Same physical device as cmp_lit_zhang2024b_fe_ring_ps. Resonance positions about 1528.2-1528.8 nm over the voltage sweep (Fig. 2(b)). Q values only in the uncached supplement.'
    why: 'distiller question 5: p.5 Fig. 2, p.8 Fig. 4-5 renders compared with chen2022 p.2 Fig. 10, 12, 16, 19; the previous wording said only that values differ'
  cmp_lit_zhang2024b_ito_hao_rib:
    notes: 'Fab: author contributions (p.10) name two NUS authors. Same lab and gate stack as lit:chen2022; Fig. 4(a), 4(b) and 5 here show the same curves as chen2022 Fig. 19, 10 and 12 with no attribution (D408: values kept, audit Q1); ring values are read at 1 V here, at 3 V in chen2022. All measurements with a 520 nm laser of about 5 mW on the ring and a TEC (p.4, p.10). Excess loss of the gate stack over the bare rib; the bare rib loss itself is not printed.'
    why: 'distiller question 5: p.5 Fig. 2, p.8 Fig. 4-5 renders compared with chen2022 p.2 Fig. 10, 12, 16, 19; the previous wording said only that values differ'
  cmp_lit_chen2022_fe_soi_switch:
    notes: 'Fabrication sentence is passive and names no org, so fab_org_ids is empty (D80b) although all authors are at NUS. Green laser illumination during measurement (Fig. 6). -5 V, 100 us pulse gives 90 % of the maximum peak shift (10 kHz writing speed, Fig. 18, Table 1): no registry parameter. Pr 8.11 uC/cm2 at 5 V (Fig. 8). Multi-level shown by sweep voltage (Fig. 15), no level count printed, n_levels not entered. Endurance and retention of Fig. 10-11 are on the MIS capacitor; retention of Fig. 19 on the switch. lit:zhang2024b Fig. 4 shows the same endurance and retention curves (audit Q1).'
    why: cross-note, p.2 Fig. 10, 12, 19 against zhang2024b p.8 Fig. 4-5
  cmp_lit_chen2022_ito_hao_wg:
    notes: Fabrication sentence is passive and names no org, so fab_org_ids is empty (D80b) although all authors are at NUS. Green laser illumination during measurement (Fig. 6). Additional loss of the gate stack; bare rib loss not printed. lit:zhang2024b Fig. 5 shows the same stack-loss curve (audit Q1).
    why: cross-note, p.2 Fig. 10, 12, 19 against zhang2024b p.8 Fig. 4-5
