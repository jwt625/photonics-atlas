# Audit patch lit_08 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_08-audit.md).
# 246 metrics: 232 ok / 14 imprecise / 0 wrong; 36 components: 31 ok / 5 changed / 0 deleted; 6 misses added.
# Not covered here (coordinator decisions, see the audit file): koninck2025 platform vs the OFC W2A.10 nano-ridge row
# (gaas), fowler2025 PIC fab borderline (D84a), registry gaps.
components:
  cmp_lit_koninck2025_nr_laser_etched_1mm:
    notes: 'Grown and fabricated in imec''s 300 mm CMOS pilot line by the authors (contributions p.21: NR growth executed and wafer fabrication coordinated by authors; acknowledgement p.21): fab_org_ids org_imec. Platform iii_v_on_si_epi (monolithic epitaxy on Si; OFC W2A.10 nano-ridge precedent used gaas). Laser wavelength ~1020 nm (nir_below_o). Wafer-scale statistics: more than 300 functional lasers over three lengths, 87 of them 1 mm long (Fig. 5(a) panel label, p.29); total two-facet power and slope from on-wafer NR photodiode photocurrent using the cited PD responsivity 0.65 A/W [48] and a simulated 12.5 % LD-to-PD coupling (p.6, p.20 Methods): those values are author_estimate; thresholds come directly from the I-I curves (measured). Etched facets: 12 deg, ~1000 nm deep (HAADF-STEM, Supp. S1), ~5 % reflectivity (simulated); facet angle convention ambiguous, not entered. minimum threshold 4.5 mA = 1.2 kA/cm2 (p.6).'
    why: 'p.29 Fig. 5(a) panel label "Laser count = 87" for L = 1 mm; the note claimed the per-length count is not stated'
  cmp_lit_koninck2025_nr_laser_etched_1p5mm:
    notes: 'Grown and fabricated in imec''s 300 mm CMOS pilot line by the authors (contributions p.21: NR growth executed and wafer fabrication coordinated by authors; acknowledgement p.21): fab_org_ids org_imec. Platform iii_v_on_si_epi (monolithic epitaxy on Si; OFC W2A.10 nano-ridge precedent used gaas). Laser wavelength ~1020 nm (nir_below_o). Wafer-scale statistics: more than 300 functional lasers over three lengths, 105 of them 1.5 mm long (Fig. 5(b) panel label, p.29); total two-facet power and slope from on-wafer NR photodiode photocurrent using the cited PD responsivity 0.65 A/W [48] and a simulated 12.5 % LD-to-PD coupling (p.6, p.20 Methods): those values are author_estimate; thresholds come directly from the I-I curves (measured). Etched facets: 12 deg, ~1000 nm deep (HAADF-STEM, Supp. S1), ~5 % reflectivity (simulated); facet angle convention ambiguous, not entered.'
    why: 'p.29 Fig. 5(b) panel label "Laser count = 105" for L = 1.5 mm; the note claimed the per-length count is not stated'
  cmp_lit_koninck2025_nr_laser_etched_2mm:
    notes: 'Grown and fabricated in imec''s 300 mm CMOS pilot line by the authors (contributions p.21: NR growth executed and wafer fabrication coordinated by authors; acknowledgement p.21): fab_org_ids org_imec. Platform iii_v_on_si_epi (monolithic epitaxy on Si; OFC W2A.10 nano-ridge precedent used gaas). Laser wavelength ~1020 nm (nir_below_o). Wafer-scale statistics: more than 300 functional lasers over three lengths, 113 of them 2 mm long (Fig. 5(c) panel label, p.29); total two-facet power and slope from on-wafer NR photodiode photocurrent using the cited PD responsivity 0.65 A/W [48] and a simulated 12.5 % LD-to-PD coupling (p.6, p.20 Methods): those values are author_estimate; thresholds come directly from the I-I curves (measured). Single-device rows (Fig. 4(a), Fig. 4(b) / Ext. Data Fig. 2, Fig. 4(c) stress test) are 2 mm lasers whose identity with each other is not stated. Etched facets: 12 deg, ~1000 nm deep (HAADF-STEM, Supp. S1), ~5 % reflectivity (simulated); facet angle convention ambiguous, not entered. minimum threshold 7.1 mA = 0.93 kA/cm2 (p.7).'
    why: 'p.29 Fig. 5(c) panel label "Laser count = 113" for L = 2 mm; the note claimed the per-length count is not stated; single-device provenance made explicit (p.6-7, p.17, p.23)'
  cmp_lit_yu2023_freeform_reflector_smf:
    class: fiber_chip_coupler.other
    notes: 'SiN waveguides from an AIM Photonics MPW run (p.5, p.9), foundry fabrication performed by authors at the Research Foundation for SUNY (contributions p.9); reflectors designed, fabricated (TPP, Nanoscribe) and characterized by MIT authors (contributions p.9). Class fiber_chip_coupler.other per D138 / D152 (3D-printed out-of-plane fiber-to-chip coupler). Not entered: coupler surface RMS roughness 18 nm, unchanged loss after 250 C anneal (Fig. 6(d)), no damage at 8 kW peak pulses, simulated < 0.1 dB over 28 um out-of-plane (p.6, no parameter). Fig. 4(a) reflector dimension labels (40, 10, 14, 100 um; recess depth 140 um) not tied to a registry dimension unambiguously.'
    why: 'D138 / D152: fiber_chip_coupler.other is the registry class for 3D-printed out-of-plane couplers; this is a TPP-printed surface-normal SMF-to-SiN coupler (p.3, p.5-7); every metric parameter of the row is allowed for fiber_chip_coupler, and tip_width_nm becomes enterable'
  cmp_lit_yu2023_freeform_reflector_pcf_design:
    class: fiber_chip_coupler.other
    why: 'D138 / D152, as the SMF coupler row (same free-form TPP reflector concept, PCF target fiber; p.5)'
