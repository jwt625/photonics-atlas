# Audit patch lit_04 (fresh-context audit 2026-10-22, DevLog/audits/2026-10-22-lit_04-audit.md).
# 36 metric corrections, 1 metric deletion (D111), 10 missed metric rows, 2 component note fixes.
# Not patchable with scripts/patch_component_staging.py (no component-delete op): the proposed deletion of
# cmp_lit_djogo2026_mcf_fanout_probe (skill rule 13, measurement equipment) is listed under the key
# proposed_delete_components, which the script ignores; coordinator decision (audit record, open question 1).
proposed_delete_components:
- id: cmp_lit_djogo2026_mcf_fanout_probe
  with_metrics: [cmp_lit_djogo2026_mcf_fanout_probe-m1]
  why: 'skill rule 13 / D45: the commercial MCF fanout is the measurement probe (p.4-5 Sec. III "applied to probe the 7-channel groups"; also used for active alignment during packaging), not a device under test; its 1.0 dB loss is a calibration term, already recorded in the excludes of cmp_lit_djogo2026_interposer_c1_packaged-m1'
components:
  cmp_lit_jia2017_suspended_ssc:
    notes: 'Abstract (p.1): "We fabricated the device together with other photonic circuits"; all authors IME A*STAR (p.1) -> fab org_astar_ime (D72 / D80b explicit statement); Sec. III (p.2): fabricated in the IME MPW platform with circuits from other parties. Platform = facet layer (suspended oxide waveguide, D82f). Losses calibrated with the Si waveguide loss of a 3.5 mm connecting waveguide (p.2). Cross-wafer uniformity within 0.4 dB (p.5, Table II), Table I ranges 0.35 dB (TE) and 0.15 dB (TM). UV-cured simple package: variation 0.5 dB after curing and over 1 h / 1 day (p.5, Fig. 8), no per-coupler value entered. Modelled scattering loss < 0.1 dB/facet (Tien''s model, p.4) not entered.'
    why: 'fab basis: the cited Sec. III wording ("our MPW platform", passive) alone would not qualify (D84a); the abstract states "We fabricated" (D80b), so the fab id stands with the right evidence'
  cmp_lit_djogo2026_interposer_c1_packaged:
    notes: '6 seven-core MCFs (37 um core pitch; waveguide hexagon widened to 38.5 um) in self-aligning sockets, routed by 3D waveguides and 40 TIR micro-mirrors onto a 4 x 10 SiP grating-coupler grid; epoxy-bonded to the SiP chip (p.4-6). Fabricated by femtosecond laser writing + HF etching (FLICE) in a 1 mm fused-silica wafer (p.3 Sec. III, passive wording; all authors University of Toronto, no explicit fabrication statement -> fab_org_ids empty, D80b). Socket density 133 channels/mm2 (p.4). Re-measured two weeks after packaging: degradation < 0.1 dB (p.7). Channel 8 spectrum -2.9 to -4.0 dB over a 420 nm source bandwidth (p.6, Fig. 6(b)) entered as wdl_db (m7); two-pass interposer losses 3.0 dB (ch 8) and 3.2 dB (ch 10) at 1504 nm (p.6) are loss-budget terms of the loop, not entered. MCF: Chiral Photonics MCF-007_2.'
    why: 'stale note after the added wdl_db row (m7)'
