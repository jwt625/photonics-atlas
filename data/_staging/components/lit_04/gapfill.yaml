# D169 gap-fill (subagent, 2026-10-22); replay order patch, sweep, gapfill, addendum, geometry, geoaudit, coord, sweep2
components:
  cmp_lit_wilson2019_gap_strip_wg:
    platform: gap_on_insulator
    notes: 'S.H. (IBM Research - Zurich) fabricated all devices (author contributions, p.5); all samples fabricated at BRNC, IBM Research (acknowledgements, p.5). Platform gap_on_insulator: GaP direct-bonded (5 nm Al2O3 on both surfaces) to 2 um thermal SiO2 on Si (p.1, p.2; D252). Sidewall RMS roughness as low as 1.1 nm (AFM), nearly vertical sidewalls (Supp. Fabrication). Not entered (no registry parameter): nonlinearity parameter 2.4(6)e2 /W/m and n2 1.1(3)e-17 m2/W (pump-probe, p.3), effective area 0.2 um2 (simulated).'
    why: 'D252 platform: other -> gap_on_insulator; text p.1 ''GaP-on-insulator'' platform, p.2 GaP bonded to a Si wafer with 2 um thermal oxide; platform sentence of the note rewritten'
  cmp_lit_wilson2019_gap_ring_r50_uncladded:
    platform: gap_on_insulator
    notes: 'S.H. (IBM Research - Zurich) fabricated all devices (author contributions, p.5); all samples fabricated at BRNC, IBM Research (acknowledgements, p.5). Platform gap_on_insulator: GaP direct-bonded (5 nm Al2O3 on both surfaces) to 2 um thermal SiO2 on Si (p.1, p.2; D252). Grating-coupled bus; grating coupler performance not reported. Measured FSR vs wavelength for widths 450-650 nm agrees with simulated dispersion (Fig. 2(h),(i)).'
    why: 'D252 platform: other -> gap_on_insulator; text p.1 ''GaP-on-insulator'' platform, p.2 GaP bonded to a Si wafer with 2 um thermal oxide; platform sentence of the note rewritten'
  cmp_lit_wilson2019_gap_kerr_comb_r50:
    platform: gap_on_insulator
    notes: 'S.H. (IBM Research - Zurich) fabricated all devices (author contributions, p.5); all samples fabricated at BRNC, IBM Research (acknowledgements, p.5). Platform gap_on_insulator: GaP direct-bonded (5 nm Al2O3 on both surfaces) to 2 um thermal SiO2 on Si (p.1, p.2; D252). Combs > 100 nm wide with sech2 envelope 3-dB width 1.4 THz (1 W input), not fully coherent (RF noise); simultaneous frequency-doubled visible combs (up to 50 lines) (p.4). Comb spacing 100-250 GHz across devices (p.5).'
    why: 'D252 platform: other -> gap_on_insulator; text p.1 ''GaP-on-insulator'' platform, p.2 GaP bonded to a Si wafer with 2 um thermal oxide; platform sentence of the note rewritten'
  cmp_lit_wilson2019_gap_racetrack_cladded_100ghz:
    platform: gap_on_insulator
    notes: 'S.H. (IBM Research - Zurich) fabricated all devices (author contributions, p.5); all samples fabricated at BRNC, IBM Research (acknowledgements, p.5). Platform gap_on_insulator: GaP direct-bonded (5 nm Al2O3 on both surfaces) to 2 um thermal SiO2 on Si (p.1, p.2; D252). Cladding reduces D2 by an order of magnitude (p.4). Same cladded racetrack generates > 200 nm FWM combs (Fig. 4(c)) and Raman-shifted combs (separate row).'
    why: 'D252 platform: other -> gap_on_insulator; text p.1 ''GaP-on-insulator'' platform, p.2 GaP bonded to a Si wafer with 2 um thermal oxide; platform sentence of the note rewritten'
  cmp_lit_wilson2019_gap_raman_laser_racetrack:
    platform: gap_on_insulator
    notes: 'S.H. (IBM Research - Zurich) fabricated all devices (author contributions, p.5); all samples fabricated at BRNC, IBM Research (acknowledgements, p.5). Platform gap_on_insulator: GaP direct-bonded (5 nm Al2O3 on both surfaces) to 2 um thermal SiO2 on Si (p.1, p.2; D252). Stokes shift 12 THz (Raman line < 100 GHz wide on the growth substrate); 10% conversion efficiency (definition not given, no registry parameter, not entered). Q ~2e5 mode. Not observed in smaller-radius resonators.'
    why: 'D252 platform: other -> gap_on_insulator; text p.1 ''GaP-on-insulator'' platform, p.2 GaP bonded to a Si wafer with 2 um thermal oxide; platform sentence of the note rewritten'
  cmp_lit_shikama2017_fifo_6mode_19core:
    notes: 'Fabricated by the authors (''we fabricated'', p.2-3 Sec. III); all authors NTT Corporation (NTT Device Technology Labs and Access Network Service Systems Labs), mapped to org_ntt. Spatial multiplicity > 100 (19 cores x 6 modes). MDL variation < 2 dB per core, all 19 cores (p.4 Fig. 7, conclusion: all modes and cores over the C band) and MDL of total output power < 1.7 dB (p.5) entered as mdl_db m7 / m8 (D169 gap-fill). Modal crosstalk with DUT (Tables II-III, p.6) includes the MPLC mode MUX / DEMUX, not entered. Rotational misalignment clearance reduced to < +/-0.9 deg (1.3 um worst-case offset, design, p.3).'
    why: 'D169 gap-fill: mdl_db now exists for fiber_interface; rewrite the not-entered sentence only'
  cmp_lit_yue2026_opa_16ch_cladding_free:
    notes: 'Chip fabricated by authors affiliated with SIMIT-CAS (author contributions, p.17; D83c). Facilities acknowledged for sample fabrication (p.16): ''SIMIT material-device and characterization platform'' and ''ShanghaiTech Material and Device Lab (SMDL)'', neither in the registry as a facility. Packaging by SJTU-Pinghu Institute staff (thanks, not entered). PM lensed fiber attached to edge couplers (p.15). Entered in the D169 gap-fill: SLSR above 8 dB for over 4 h (m5, p.11, Fig. 6(a)); phase-steering range -20 to 20 deg in theta_x (m6, p.12, Fig. 6(c)); wavelength-steering range 9 deg in theta_y (m7, p.12); wavelength-steering slope -0.09 deg/nm (m8, Fig. 6(d) inset fit). Not entered: EO phase-modulator V_pi 4.4 V (Fig. 3(f), EO metric). Far-field FWHM 2.6 deg x 1.6 deg (p.7, Fig. 3) not entered: the text does not say which OPA variant (cladded or cladding-free) Fig. 3 shows. 16 channels entered as n_channels m9 (D169 gap-fill). Sibling SiO2-cladded LT OPA (focusing-stability time ~16 min) and cladded LN control OPA have no registry-parameter metric, not rows.'
    why: 'D169 gap-fill: slsr_db, n_channels, steering_range_deg, steering_efficiency_deg_per_nm now allowed for free_space_emitter; rewrite the not-entered sentences only'
  cmp_lit_prost2022_opa_32ch_onchip_calibration:
    notes: 'Implemented in a 200-mm DUV SiN/Si process stack (ref. [15]); all authors imec, but no explicit fabrication statement, so fab_org_ids empty (D80b). Calibration readout by Si photon-assisted tunneling PDs (1 mm active section, -1 V), characterized in a cited work, no own metric. Entered in the D169 gap-fill: SLSR 11 dB after calibration (m6, printed -11 dB, p.3) and 13.3 dB theoretical (m10); ambiguous steering range +/-19.2 deg at 1550 nm (m7, calculated, p.2); 32 channels and 2.5 um pitch (m8 / m9). 2D steering by wavelength tuning 1520-1580 nm (p.3-4).'
    why: 'D169 gap-fill: slsr_db, steering_range_deg, n_channels, pitch_um now allowed for free_space_emitter; rewrite the not-entered sentence only'
  cmp_lit_kim2019_opa_32el:
    notes: 'Antenna: 400 nm wide Si waveguide grating with fully etched apodized sidewall perturbations, 500 um long, 4 um element pitch; wavelength steering along phi (design 0.164 deg/nm from simulated n_g 4.43). Cascaded directional-coupler distribution, L-shaped thermo-optic phase shifters driven by pitch-matched PDM switch-mode drivers through TOVs. Fabrication org not stated explicitly (3D platform ''similar to [26]''; co-authors at the Colleges of Nanoscale Science and Engineering, Albany, printed as such, not in the registry under that name). Berkeley Wireless Research Center thanked ''for continued support'' (p.12): research center, not entered as a facility. SLSR 8.5 dB after calibration (m6) and 2D steering 16 deg (theta, phase) x 18.5 deg (phi, 120 nm tuning around 1550 nm) (m7 / m8) entered in the D169 gap-fill, with the design steering efficiency (m9) and the theoretical theta range 22.3 deg (m12); near-field intensity variation within 2.25 dB along the antenna (p.7-9, Figs. 9, 12) not entered (no registry parameter). 32 elements and 4 um pitch entered as n_channels m10 / pitch_um m11 (D169 gap-fill).'
    why: 'D169 gap-fill: slsr_db, steering_range_deg, steering_efficiency_deg_per_nm, n_channels, pitch_um now allowed for free_space_emitter; rewrite the not-entered sentences only'
  cmp_lit_kim2019_opa_125el:
    notes: 'Antenna: 400 nm wide Si waveguide grating with fully etched apodized sidewall perturbations, 500 um long, 4 um element pitch; wavelength steering along phi (design 0.164 deg/nm from simulated n_g 4.43). Cascaded directional-coupler distribution, L-shaped thermo-optic phase shifters driven by pitch-matched PDM switch-mode drivers through TOVs. Fabrication org not stated explicitly (3D platform ''similar to [26]''; co-authors at the Colleges of Nanoscale Science and Engineering, Albany, printed as such, not in the registry under that name). Berkeley Wireless Research Center thanked ''for continued support'' (p.12): research center, not entered as a facility. Average 20 mW/element power (abstract), no free_space_emitter parameter. Theoretical emission efficiency ~-9 dB for the 125-element array (p.11) not entered (calculated). 125 elements and 4 um pitch entered as n_channels m8 / pitch_um m9 (D169 gap-fill); Table I SLSR 7.4 dB (m6), design steering efficiency (m7) and theoretical theta range 22.3 deg (m10) also entered.'
    why: 'D169 gap-fill: n_channels, pitch_um, slsr_db, steering_efficiency_deg_per_nm, steering_range_deg now allowed for free_space_emitter; rewrite the not-entered sentence only'
