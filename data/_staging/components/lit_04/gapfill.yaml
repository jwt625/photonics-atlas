  component_id: cmp_lit_yue2026_opa_16ch_cladding_free
  parameter: slsr_db
  value: '8'
  unit: dB
  qualifier: gt
  polarization: te
  condition: cladding-free LT OPA after phase calibration, held for over 4 h (focusing-stability test); main lobe over highest sidelobe in the theta_x far-field cross-section
  method: direct
  basis: measured
  locator: p.11; p.13 Fig. 6(a)
  notes: '''an SLSR over 8 dB for over 4 hours''; Fig. 6(a) insets annotate 8.77 / 9.05 / 9.07 dB at 1 / 2.5 / 4 h. Wavelength and optical power of the Fig. 6(a) run not stated; Fig. 6(b) shows similar SLSR at 14, 0 and -14 dBm (no numbers in text). TE input (Methods p.15).'
  why: 'D169 gap-fill: slsr_db now allowed for free_space_emitter; SLSR > 8 dB over 4 h listed as not entered in the component note'
