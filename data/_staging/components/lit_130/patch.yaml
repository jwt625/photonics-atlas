# Audit patch lit_130 (fresh-context audit 2026-11-14, DevLog/audits/2026-11-14-lit_130-audit.md).
# 123 metrics: 115 ok / 8 imprecise / 0 wrong; 17 components: 13 ok / 4 imprecise / 0 wrong; 0 deleted; 6 misses added.
# Coordinator rulings open (audit Q1-Q8): Q1 wang2023 absorption-only rows kept beside the added totals (to drop the totals,
# remove the adds cmp_lit_wang2023_gesbs_er_waveguide-m8 / -m9), Q2 li2025b on-chip powers added as author_estimate (to drop,
# remove the adds cmp_lit_li2025b_dfb_sil_tfln-m7 / cmp_lit_li2025b_vernier_ring_laser-m6 and restore the two component
# notes), Q3 li2025b ring Q author_estimate (to keep measured, remove the two basis ops), Q4 zhao2025b RIN as the printed
# bound (to keep the printed range, remove the -m19 op), Q5 zhao2025b far-field axes per figure legend (no op beyond the
# simulated-row conditions), Q6 yokokawa2022 RIN bound kept as printed (no op), Q7 xia2024 8.1 mW on Device II and the Q
# range on both ring rows (no op), Q8 fab empty on wang2023 / zhao2025b / wang2023a / yokokawa2022 and on xia2024 Device I
# (no op).
components:
  cmp_lit_zhao2025b_dfb_array_8ch_flipchip:
    notes: 'Fab empty: chip and bonding steps are described with passive verbs (p.4 Sec. 2.2: ''is fabricated'', ''can be easily prepared''); authors at Nanjing University (incl. the Nanjing University-Tongding joint lab), China United Network Communications Nanjing Branch and Jiangsu University of Science and Technology (D80b). Bonding tool named as equipment only. Flip-chip versus p-side-up: junction temperature lower by 28 % (calculated from the 0.94 nm current-shift difference and 0.1 nm/C) and maximum power about 20 % higher (p.5); simulated steady-state difference 4.08 C (Fig. 6): no parameter. Simulated APS-grating single-mode yield 90 % vs 13 % (Fig. 3): design only. Values from Fig. 9-10 are the flip-chip bonded laser unit of the same design (comparison units on one AlN submount); Fig. 11-15 values are the 8-channel array. Far-field axes conflict between figures (D417): Fig. 13 (measured) labels the narrower curve Horizontal (25.8 / 26.3 deg), Fig. 4(d) (simulated) labels the narrower curve Vertical (25.2 deg), and p.3-4 say the design reduces the vertical divergence; each row follows its own figure legend (audit read: Fig. 13(a) FWHM about 25.6 deg blue / 29.9 deg red, Fig. 4(d) about 25.4 deg red / 31.0 deg blue, +/-0.5 deg).'
    why: 'p.3 Fig. 4(d) and p.6 Fig. 13 assign the narrower far-field angle to opposite axes; the note said only that the text does not assign the axes'
  cmp_lit_li2025b_dfb_sil_tfln:
    notes: 'Fab org_ucsb + org_university_of_rochester: author contributions name nine fabricators (five at UC Santa Barbara, four at the University of Rochester; D80b, D395). Facility: UCSB Nanofabrication Facility (''performed in part at'') and Cornell NanoScale Facility (''a portion of this work was performed at''). LN film from NanoLN (supplier note, D428). The 6.7 dB chip-to-fiber coupling loss (p.4, in a sentence carrying ref. [31]; p.5 calls it the consistent loss of the packaging setup) has no measurement shown and is not entered as a coupler row; the on-chip power built on it (18.7 mW at 700 mA, p.4, p.6) is entered as author_estimate (m7; rule 4, D429). Free-running white frequency-noise floor 0.33 MHz2/Hz at 40 MHz offset and locked floor 3.5 kHz2/Hz (Fig. 3(d)). L-I irregularities attributed to mode hops (p.4). TFLN resonator: cmp_lit_li2025b_tfln_sil_ring.'
    why: 'audit Q2: the on-chip power is this paper''s own value resting on a coupling loss of unstated origin (rule 4: author_estimate, ahmadi2022 D429 precedent), not a value cited from earlier work; note updated for the added m7'
  cmp_lit_li2025b_vernier_ring_laser:
    notes: 'Fab org_ucsb + org_university_of_rochester: author contributions name nine fabricators (five at UC Santa Barbara, four at the University of Rochester; D80b, D395). Facility: UCSB Nanofabrication Facility (''performed in part at'') and Cornell NanoScale Facility (''a portion of this work was performed at''). LN film from NanoLN (supplier note, D428). The 6.7 dB chip-to-fiber coupling loss (p.4, in a sentence carrying ref. [31]; p.5 calls it the consistent loss of the packaging setup, no citation there) has no measurement shown and is not entered as a coupler row; the on-chip power built on it (2.01 mW, p.5) is entered as author_estimate (m6; rule 4, D429). Abstract calls the 44 nm tuning continuous; p.5-6 call it coarse tuning (Fig. 4(c) shows discrete lines). Si rings (FSR 215 / 208 GHz, Q): cmp_lit_li2025b_si_vernier_rings.'
    why: 'audit Q2: the 2.01 mW sentence carries no citation and rests on the setup coupling loss (rule 4: author_estimate); note updated for the added m6'
  cmp_lit_wang2023a_qd_lcdfb:
    notes: 'Fab empty: growth and fabrication described with passive verbs (p.2 Sec. 2.1); authors at the Institute of Semiconductors CAS / University of Chinese Academy of Sciences and Zhejiang University / Zhejiang Lab (D80b). Same-wafer FP lasers (same cavity and ridge) gave alpha factor 0.34 at the 1315 nm gain peak (ASE method, p.2): no row (no laser metric). Threshold / slope variation < 9 mA and < 0.012 W/A over 25-85 C (p.3); threshold current density 1243 A/cm2 (Table 1); critical feedback for coherence collapse -14 / -11 / -8 dB at 25 / 55 / 85 C, 300 mA (p.7): no parameter (D77 / D431 candidates). Grating etch: ICP etch of the AlGaAs to 50 nm followed by a short wet etch removing about 10 nm (p.2), consistent with the 60 nm grating etch depth of the design sentence (p.2) and p.7; entered as etch_depth_nm 60 (m24, design_target); m20 is the 1500 nm ridge etch. Current tuning 0.0087 nm/mA at 85 C (p.4): no parameter (D83g).'
    why: 'p.2 Sec. 2.1: 50 nm ICP plus about 10 nm wet etch gives the 60 nm design depth, so there is no conflict; the note also said the 60 nm was entered while no row held it'
