  cmp_lit_zhao2025b_dfb_unit_psideup-m4:
    value: 67
    notes: 'read off the Fig. 10(c) end point at 250 mA (audit read 400 dpi, 3.67 px/mW: about 66.7 mW, +/-1 mW); the flip-chip curve reads about 80.7 mW at the same point, consistent with the printed ''approximately 20 %'' higher'
    why: 'p.5 Fig. 10(c): the black P-side-up curve ends at about 66.7 mW (pixel read against the 0-100 mW ticks); 68 was high by about 1 mW'
  cmp_lit_li2025b_tfln_sil_ring-m1:
    basis: author_estimate
    notes: 'printed loaded Q of 3 x 10^5 (p.5); no transmission trace or fit is shown, so author_estimate (heim2026 D460, velha2016 D544 precedents); wavelength taken from the lasing line aligned to this resonance (1559.0 nm, p.4)'
