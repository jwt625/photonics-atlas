  cmp_lit_zhao2025b_dfb_array_8ch_flipchip-m19:
    value: -135.3
    value_max: ''
    qualifier: lt
    statistic: ''
    locator: p.1 Abstract; p.6 Sec. 3; p.6 Fig. 15; p.7 Sec. 4
    notes: 'printed bound ''below -135.3 dB/Hz'' for all 8 channels (abstract, conclusion), consistent with Fig. 15: per-channel maxima read about -141 / -139 / -138 / -135.5 / -143 / -136 / -139 / -141.5 dB/Hz for CH1-CH8 (+/-1 dB, relaxation peaks near 7-8 GHz). The p.6 sentence prints a range -135.3 to -138.7 dB/Hz, whose lower end is above the CH1, CH5 and CH8 maxima (D417); kept here as the figure-consistent printed bound (audit Q4)'
