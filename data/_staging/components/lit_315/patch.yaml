    parameter: box_thickness_um
    value: '2.2'
    unit: um
    condition: SiO2 between the Si3N4 core and the Si substrate
    basis: derived
    locator: 'p.5; p.4 Fig. 1(b)'
    notes: '5.4 um total SiO2 cladding - 2.4 um SiO2 between the Mo layer and the Si3N4 - 0.8 um core height = 2.2 um (p.5);
      the Fig. 1(b) ''3um'' label from the Si3N4 top to the Si minus the 800 nm core gives the same value.'
    why: 'miss (D153 geometry): p.5 and the Fig. 1(b) label fix the lower cladding by arithmetic on printed values; both routes
      agree (2.4 + 3 = 5.4 um)'
