components:
  cmp_lit_he2025_crossing:
    fab_org_ids: org_peng_cheng_laboratory;org_university_of_science_and_technology_of_china
    notes: 'Four identical arms from W1 to W13 (um): 1, 1.534, 1.314, 1.808, 2.188, 2.22, 2.07, 1.9, 1.9, 2.106, 2.4, 3.43, 1 (Table 1 p.4). Fab: author contributions name F.G. (Peng Cheng Laboratory), F.Y.Y. (USTC) and X.Y.Z. (ISCE2, A*STAR) as having designed and fabricated the device (p.8, p.1), D80b; ISCE2, A*STAR is not in the registry (org round). p.2 attributes the 70 deg sidewall value to an unnamed commercial foundry. LN anisotropy neglected in the design (p.3). Printed bound vs plot: Fig. 4(b) has spikes near 0.15 dB at the short-wavelength end and Fig. 5(b) peaks near -36 dB; printed bounds entered. Fig. 5(b) dips reach below the printed -50 dB best. Table 2 comparison rows are other works.'
    why: 'p.8 Author contributions + p.1 affiliations: named fabricators at named orgs is the D80b case (niels2026, churaev2023); D154 / qi2024 is an unattributed "we fabricate" with no org named, so it does not apply. See audit Q1'
  cmp_lit_he2025_inverse_taper:
    fab_org_ids: org_peng_cheng_laboratory;org_university_of_science_and_technology_of_china
    notes: Input and output couplers of the crossing test structure (cmp_lit_he2025_crossing). Fab as for the crossing (p.8, D80b). Rib cross-section of the taper not stated; platform follows the waveguide it connects to.
    why: same chip and statement as the crossing; see audit Q1
  cmp_lit_sacher2014a_tin_heater:
    platform: soi_strip
    why: 'p.3 Sec. 2 and p.6 Sec. 4: heaters sit above Si strip waveguides, the paper names the etch type (lit_69 / D434 precedent cherchi2013, ding2022)'
  cmp_lit_peng2021_crossing:
    notes: 'Four identical arms, 13 width variables w1-w13 (um): 0.48, 0.71, 1.11, 1.55, 1.67, 1.64, 1.69, 1.77, 1.85, 2.08, 2.32, 2.875, 0.48 (Table 1 p.1). Foundry not named: fab empty, although p.2 also says the authors fabricated the test structures, next to the foundry-process sentence (audit Q3). Cut-back on N = 0, 200, 400, 600 crossings (p.2). SEM dimension labels in Fig. 2 (2.185 and 2.252 um) are not tied to a named parameter: not entered. Measured crosstalk not reported.'
    why: 'p.2 Sec. 2: first-person wording not recorded; keeps the decision traceable'
