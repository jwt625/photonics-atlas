metrics:
  cmp_lit_cheung2010_hml_1ghz-m4:
    condition: 'minimum pulse width at 7 C, 20 dBm RF at 1.0425 GHz; 386 mA gain current, SA reverse bias 6.18 V (Fig. 4(a) label, Fig. 3 386 mA curve); DCA trace'
    notes: 'Printed about 51 ps (ps -> fs, D256). Conflict (D417): the text (p.2) prints 376 mA and 6.19 V; the Fig. 4(a) label prints 386 mA and -6.18 V, and in Fig. 3 the 386 mA curve (the one the inset arrow points to) reaches about 50 ps near 6.2 V while the 376 mA curve stays at about 58 ps or more. Condition follows the two figure sources (sohn2021 precedent, D462). Main peak followed by a satellite pulse.'
    why: 'p.2 Fig. 3 render (cyan 386 mA curve minimum about 50 ps at 6.2 V, blue 376 mA minimum about 58 ps) and p.3 Fig. 4(a) label (Current = 386mA, Reverse Bias = -6.18V, T = 7 C) agree against the one text sentence'
  cmp_lit_cao2014_laser_b_tri_qw-m8:
    condition: 'average lasing-wavelength temperature coefficient, CW, 280-330 K (Fig. 2(b) spectra), 0.8 mm cavity'
    why: 'p.2 Fig. 2(b) render: laser B spectra are labelled 280-330 K in 10 K steps (270 K only in Fig. 2(a), laser A)'
  cmp_lit_komljenovic2015_ec_laser-m13:
    notes: 'Read off Fig. 7(b), +/- 1 dB: the with-feedback trace peaks at about -146.5 dBc/Hz near 1.9 GHz; the trace without feedback peaks at about the same level, slightly broader; noise floor about -151 dBc/Hz.'
    why: 'p.5 Fig. 7(b) render (10 dB grid): both traces peak at about -146.5 dBc/Hz; the note said the no-feedback trace peaks at about -145'
  cmp_lit_menezo1999_dbr_array-m11:
    condition: 'Bragg currents set for 200 GHz spacing, accuracy better than 25 GHz; each laser 120 mA active, one channel at a time, on the common PHASAR output collected 3 exits (4.8 nm) from the central port'
    why: 'p.3 Sec. III: the Fig. 4 wavelengths are collected on an output 3 exits (4.8 nm) spaced from the central one'
  cmp_lit_menezo1999_dbr_array-m12:
    condition: 'coupled power on the common PHASAR output (3 exits, 4.8 nm, from the central port), all channels except 5 and 6, 120 mA active current each'
    why: 'p.3 Sec. III: output port as printed (3 exits from the central one)'
  cmp_lit_menezo1999_dbr_array-m13:
    notes: 'Read off Fig. 3(a) at 120 mA (end of the sweep), +/- 0.5 mW; no output power printed in the text. The range covers all ten curves: lasers 5 and 6 (arrows; the two highest-threshold curves) end at about 10-11 mW, the other eight at about 11-15.5 mW.'
    why: 'p.2 Fig. 3(a) render: the 10 mW lower end is the laser-5 / laser-6 pair the text excludes from the threshold range; the condition did not say so'
