# Audit patch lit_137 (fresh-context audit 2026-11-15, DevLog/audits/2026-11-15-lit_137-audit.md).
# 153 metrics: 123 ok / 26 imprecise / 4 wrong (3 of them pending Q4); 34 components: 26 ok / 8 imprecise / 0 wrong;
# 3 metrics deleted; 6 misses added. After the patch: 34 components, 156 metrics.
# Coordinator rulings (audit Q1-Q4): Q1 rudenkov2025 laser-written Cr:ZnS waveguide amplifier kept (no op; to drop,
# delete_components the eight cmp_lit_rudenkov2025_* rows); Q2 cheung2015 fab org_university_of_california_davis on all
# 7 rows (to keep fab empty, remove the seven `components` entries for cmp_lit_cheung2015_*); Q3 cheung2015 Pout - Pin
# gain rows kept as derived (no op; to drop, delete straight m2 / m4 / m6 and flared m2 / m4); Q4 subramanian2012 measured
# gain rows m1-m3 deleted as reproduced from the authors' ref. [11] (to keep them, remove the three delete_metrics entries
# and the subramanian2012 amplifier `components` entry).
components:
  cmp_lit_cheung2015_soa_straight_si500:
    fab_org_ids: org_university_of_california_davis
    notes: 'Fab org_university_of_california_davis (audit Q2, D72): first-person fabrication sentences (''we employ photoresist reflow'', p.7; ''We fabricated several flared SOA devices'', p.11) and UC Davis is the only org printed for the work; the fourth author''s Furukawa Electric line is a ''Currently with'' present address (p.1), not a work affiliation. No facility named (no acknowledgment section). No acknowledgment section. 6-inch SOI wafer and 3-inch III-V wafer: supplier not named. Headline wall-plug efficiencies (WPE = 100 (Pout - Pin) / (I V), on-chip powers) are not entered: wpe_pct is a laser-only parameter (registry gap, reported). Printed WPE: 9.2 % at 35 mA / 7.0 dBm (p.9-10, conclusion), 7.2 % at 95 mA / 10.1 dBm (p.10, Fig. 6(b)), ~0.38 % at Pin 0.1 mW (Fig. 8(b)); the abstract prints 7.3 % for output < 10 mW (conflicts with 9.2 % in body and conclusion). Siblings with Si width 600 / 700 nm (Fig. 6(a), 8(a)) and lengths 500-700 um (p.10) were measured but have no printed
      values (figure curves only; not entered). Fig. 6 caption prints ''width = 4um'' for the straight SOA while Fig. 6(a), Fig. 7 and p.10 say Si width 500 nm. Gain ripple < 1 dB (p.10, 0.06 nm OSA RBW): no parameter. Leakage current 0.9 uA: no amplifier parameter. Design simulations (WPE maps, Fig. 3) not entered.'
    why: 'p.7 Sec. 3 and p.11: first-person fabrication (''we employ'', ''We fabricated''); p.1 prints UC Davis as the only work affiliation (Furukawa is a present address), so the authors'' own org is unambiguous (D72, D80b; audit Q2)'
