  cmp_lit_subramanian2012_er_ta2o5_rib_amp_2p3cm:
    notes: 'Fab empty: passive fabrication sentences only (p.1-2); all authors at the Optoelectronics Research Centre, University of Southampton at the time (D80b). Acknowledgment thanks named persons only. Values are from the page renders (the text layer drops numbers in math font). Measured gain values not entered (audit Q4, D259a / D424): Sec. V introduces the 2.3 cm waveguides as ''used for gain measurements as discussed in [11]'', the same authors'' Opt. Commun. 285 (2011) amplifier paper that p.1 calls their first gain measurements in Er:Ta2O5; values for reference: 4.83 +/- 0.11 dB net (2.1 +/- 0.05 dB/cm) at 1531.5 nm with 20 mW launched 977 nm pump, net-gain threshold about 4.5 mW (p.5 Sec. V, Fig. 9; p.6). The theory curves and the upconversion fit are this paper''s own (m4, m5 kept). Theory: 3.75 dB/cm gross gain without upconversion (p.5) and fitted Cup 1e-17 cm3/s (fit parameter, no component parameter) not entered. Coupling into the chip by fiber / objective; coupling losses
      not printed.'
    why: 'p.5 Sec. V: the gain measurement is introduced as discussed in the authors'' ref. [11] (p.1: their first gain measurements); notes record the removed values (audit Q4)'
