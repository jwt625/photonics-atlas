    basis: author_estimate
    notes: About 2 mW (3 dBm), calculated back by the authors from the measured output to the power in the waveguide at the
      laser output port (p.11); the out-coupling loss used is not stated (origin not stated), hence author_estimate.
    why: 'D44 / D76: on-chip power from a correction of unstated origin (p.11 Sec. 5); precedent lit_03 hu2023 m4 (coupler
      loss of unstated origin removed -> author_estimate)'
