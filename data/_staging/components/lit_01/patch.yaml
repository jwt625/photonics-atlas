      out setup, grating-coupler and MZI-switch losses (p.7); the switch IL 1.4 dB is cited from [30] and the grating-coupler
      loss origin is not stated, hence author_estimate (D44).
    why: 'D44: the value rests on a cited input (switch IL 1.4 dB from [30], p.7) and a calibration of unstated origin'
