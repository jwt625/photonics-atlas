components:
  cmp_lit_zhang2023_utp_inp_soa_switch:
    platform: other
    fab_org_ids: org_imec
    notes: 'Coupon 45 um wide, printed in an 80 x 1050 um recess; FIB cross-section shows 230 nm lateral misalignment (p.7).
      Differential resistance 10 ohm at 100 mA (Fig. 5(a)) has no amplifier parameter: not entered. Gain is on-chip (setup,
      grating couplers and MZI switch loss calibrated out; switch IL 1.4 dB is cited from [30], not entered). Platform other:
      light is amplified in the printed InP coupon on the c-Si / poly-Si waveguide (hybrid, D71), stack in core_material.
      fab_org_ids: imec (SiPh host, p.5 iSiPP50G, p.10 SiPh circuit fabrication at imec); DVS-BCB spray-coating done at EV
      Group (p.5, p.10) is a bonding-film step, note only (rule 12). Who fabricated the InP SOA coupons is not stated (design
      in ref. [31]); printing with an X-Celeprint uTP-100 tool.'
    why: 'rule 11 / D71: the gain region guides light in the hybrid InP-coupon-on-Si stack, not SOI (precedent laser.heterogeneous
      / laser.tunable rows use other); rule 12: a company that only supplied a film (EV Group BCB spray-coating, p.5 / p.10)
      is a note, not fab_org_ids'
  cmp_lit_zhang2023_iii_v_si_taper_utp:
    class: waveguide_platform.transition
    platform: other
    fab_org_ids: org_imec
    notes: 'Printed InP coupon bonded on the SiPh chip (BCB): an inter-material transition on one chip (D48 / rule 10; precedents
      vanackere2023 printed LN coupon, akazawa2026 bonded InGaAsP/Si taper), not a chip_chip_coupler. TE mode simulation insets
      in Fig. 4(f) without a number. Coupling figure stated for the transmitter printing site (220 nm x 3 um c-Si + 160 nm
      poly-Si slab, p.10); BCB < 50 nm there vs 75 nm in the switch. SiPh chip fabricated at imec (p.10; switch on imec iSiPP50G,
      p.5); DVS-BCB spray-coating done at EV Group (p.5, p.10), note only (rule 12). Who fabricated the InP SOA coupons is
      not stated (design in ref. [31]); printing with an X-Celeprint uTP-100 tool.'
    why: 'D48 / skill rule 10: transitions bonded on the same chip are waveguide_platform.transition (micro-transfer-printed
      coupon on the SiPh chip, p.5-7, p.10); platform = hybrid value (other, D71); EV Group film step is a note (rule 12)'
  cmp_lit_zhang2023_wtl1_vernier_ring_laser:
