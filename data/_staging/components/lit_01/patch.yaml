  cmp_lit_kuznetsov2025_gap_opa_spiral_780nm:
    notes: 'Single CW pump at 1550 nm, degenerate FWM; signal scanned 1550-1630 nm (laser limit), OSA 2 nm RBW, Max Hold.
      Net gain > 10 dB over 70 nm entered as a gain_db bound over 1560-1630 nm (m10); the estimated > 140 nm (17 THz) symmetric
      10-dB region (p.4) rests on an assumed symmetric spectrum and has no amplifier gain-bandwidth parameter: not entered
      (gap). Idler conversion efficiency spectra (Fig. 2(d)) not read. Abstract''s up-to-35 dB parametric gain and 0.25 mm2
      footprint not attributed to a specific spiral in the text; gain entered on this row (Fig. 2(e) internal signal gain
      peaks near 37 dB at 4.13 W, reading), footprint on both rows. Measured beta2 = -124 fs2/mm (Methods, Ext. Data Fig.
      3) and simulated gamma 165 /W/m (Aeff 0.26 um2) have no registry parameter: not entered (gap). Spirals: Archimedean,
      bend radius from 250 um to about 80 um, fit one 525 x 525 um EBL field. Acknowledgements (p.11): the authors fabricated
      the sample at the Binnig and Rohrer Nanotechnology Center (BRNC) at IBM Research Europe - Zurich; author contributions
      credit A.N. (EPFL and IBM Research Europe - Zurich) with the fabrication: fab_org_ids = IBM Research Zurich (D83c, org
      where fabrication was done), facility BRNC (mohl2025 precedent).'
    why: note made consistent with the added m10 (net gain > 10 dB over 70 nm, p.4)
  cmp_lit_starnault2026_eo_tw_circulator_o_band_10mm:
    notes: 'Two cascaded travelling-wave MZMs between 2x2 MMIs, single-ended electrodes, both biased at maximum; non-reciprocity
      from co- vs counter-propagating RF (no magnets, no resonators). Packaged with epoxy-attached fibre arrays; ports 1->2
      counter-propagating (low loss), 2->1 isolated, 2->3 circulated with residual 2fRF pulses. MZM Vpi and EO bandwidth are
      modulator metrics (no modulator class in this atlas; this lit paper is not in the EO atlas): not entered. Mean RF drive
      per modulator and same-wavelength BiDi 800G link results are not component parameters: not entered. Isolation-bandwidth
      (THz) has no nonreciprocal parameter: the fixed-parameter >= 15 dB window is entered as an isolation row over the wavelength
      range. O-band device: 6-dB EO bandwidth > 110 GHz and 5-GHz Vpi 2.5 V (not entered). AM-FM drive bandwidth 54.8 GHz;
      driven at the RF amplifier 3 dB compression point (5.3 V, 18.5 dBm); measured 37.4 dB exceeds the simulated 35.2 dB
      limit (p.5). Loss terms (p.5 text, Fig. 2(c) caption) are consistent as excess + passive: port 1 -> 2 0.04 + 0.77 =
      0.81 dB, port 2 -> 3 minimum 5.8 + 0.77 = 6.57 dB, so the printed 5.8 dB minimum is the excess term and 6.57 dB the
      minimum total (same arithmetic as the C+L device: 0.07 + 0.84 = 0.91, 4.9 + 0.84 = 5.74). Methods (p.10): PICs designed
      and manufactured by HyperLight in its commercial TFLN foundry process; author contributions: fabrication led by the
      HyperLight authors (p.11): fab_org_ids = HyperLight.'
    why: 'audit: the note called 5.8 vs 6.57 dB a conflict and left the 0.77 dB passive loss out as ambiguous; the stated
      values add up exactly as excess + passive (p.5 text; p.4 Fig. 2(c) caption; Fig. 2(c) port 2 -> 3 curve minimum near
      1310 nm about 6.5 dB), see metric fixes m7 and new m10 / m11'
metrics:
  cmp_lit_zhang2023_utp_inp_soa_switch-m1:
