      (A.L.S., A.J.L., A.T.P., D.C.T., C.D., M.B., K.M.M., M.G., A.K., A.L.L., M.E., N.T.O.) ''fabricated the devices'' (p.9);
      ''fabricated through a CMOS-foundry process'' (Fig. 1(d) caption): fab_org_ids = Sandia National Laboratories. Text
