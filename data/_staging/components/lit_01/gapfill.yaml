  cmp_lit_cheng2025_aom_isolator_two_ridge_device_a:
    notes: 'Two acousto-optic frequency-shifting beam splitters (AOMs, ~2.3 GHz phonons from angled AlN IDTs) forming a nonreciprocal
      multimode interferometer with directional-coupler mode multiplexers; total optical power measured without spectral filtering.
      10-dB isolation bandwidth entered as isolation_bw_nm (D169; THz values not entered). Microwave power for the AOMs is
      tens of dBm (no power_consumption value stated). Device A: wafer II, liquid-HF release (higher AOM efficiency, more
      intermodal crosstalk). 10-dB isolation bandwidth printed 5.8 nm / 0.73 THz (p.6, Fig. 3(c)) and 5.6 nm (Supp. Table
      III): main-text 5.8 nm entered. Measured ridge heights 74.73 / 29.01 nm (Supp. Table I, wafer II) not entered (role
      of the heights not defined in text). Author contributions: Sandia authors (A.L.S., A.J.L., A.T.P., D.C.T., C.D., M.B.,
      K.M.M., M.G., A.K., A.L.L., M.E., N.T.O.) ''fabricated the devices'' (p.9); ''fabricated through a CMOS-foundry process''
      (Fig. 1(d) caption): fab_org_ids = Sandia National Laboratories. Text is the arXiv v1 version.'
    why: 'D169 gap-fill: note said the 10-dB isolation bandwidth was not entered (gap); now entered'
  cmp_lit_cheng2025_aom_isolator_two_ridge_device_b:
    notes: 'Two acousto-optic frequency-shifting beam splitters (AOMs, ~2.3 GHz phonons from angled AlN IDTs) forming a nonreciprocal
      multimode interferometer with directional-coupler mode multiplexers; total optical power measured without spectral filtering.
      10-dB isolation bandwidth entered as isolation_bw_nm (D169; THz values not entered). Microwave power for the AOMs is
