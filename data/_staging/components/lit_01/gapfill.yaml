  cmp_lit_song2025a_mo_si_5x5_router:
    class: nonreciprocal.other
    notes: 'Planar nonreciprocal focusing device: input slab f1 = 200 um, output slab f2 = 50 um, N = 13 arrayed waveguides,
      backward port spacing D = 6 um (design, p.7); TM0 operation; measured under a 1000 Oe in-plane field on a PM fibre butt-coupled
      setup. Measured and simulated crosstalk entered as crosstalk_db (positive magnitudes; widened to nonreciprocal, D169).
      Simulated NRPS 4.375 rad/mm of the 500 nm MO/Si waveguide (p.7) not entered. Router, not a strict circulator: nonreciprocal.other
      (D252). Measured minimum crosstalk -18 dB between I1 and I2 at 1551 nm; measured insertion loss not stated. Design:
      simulated crosstalk -21 dB, focusing loss ~1.5 / ~1.2 dB. Fabrication width error 500 -> 475 nm causes ~12 rad phase
      offset and ~25% focusing efficiency vs 85% ideal (p.12, analysis). Devices made in a silicon photonics foundry, then
      MO thin films deposited (p.10): foundry not named, MO deposition process referred to earlier work [8]: fab_org_ids empty.'
    why: 'D168 / D252 reclass: nonreciprocal.circulator -> nonreciprocal.other (5x5 multiport router). D169 gap-fill: note
      said crosstalk was only quoted in notes; now entered'
  cmp_lit_starnault2026_eo_tw_circulator_o_band_10mm:
    notes: 'Two cascaded travelling-wave MZMs between 2x2 MMIs, single-ended electrodes, both biased at maximum; non-reciprocity
      from co- vs counter-propagating RF (no magnets, no resonators). Packaged with epoxy-attached fibre arrays; ports 1->2
      counter-propagating (low loss), 2->1 isolated, 2->3 circulated with residual 2fRF pulses. MZM Vpi and EO bandwidth are
      modulator metrics (no modulator class in this atlas; this lit paper is not in the EO atlas): not entered. Mean RF drive
      per modulator and same-wavelength BiDi 800G link results are not component parameters: not entered. Isolation bandwidth
      11 THz (1290-1355 nm) entered as isolation_bw_nm 65 nm (derived from the printed edges, D169); the fixed-parameter >=
      15 dB window is also entered as an isolation row over the wavelength range. O-band device: 6-dB EO bandwidth > 110 GHz
      and 5-GHz Vpi 2.5 V (not entered). AM-FM drive bandwidth 54.8 GHz; driven at the RF amplifier 3 dB compression point
      (5.3 V, 18.5 dBm); measured 37.4 dB exceeds the simulated 35.2 dB limit (p.5). Loss terms (p.5 text, Fig. 2(c) caption)
      are consistent as excess + passive: port 1 -> 2 0.04 + 0.77 = 0.81 dB, port 2 -> 3 minimum 5.8 + 0.77 = 6.57 dB, so
      the printed 5.8 dB minimum is the excess term and 6.57 dB the minimum total (same arithmetic as the C+L device: 0.07
      + 0.84 = 0.91, 4.9 + 0.84 = 5.74). Methods (p.10): PICs designed and manufactured by HyperLight in its commercial TFLN
      foundry process; author contributions: fabrication led by the HyperLight authors (p.11): fab_org_ids = HyperLight.'
    why: 'D169 gap-fill: note said the isolation bandwidth had no nonreciprocal parameter; O-band nm edges printed, now entered'
  cmp_lit_starnault2026_eo_tw_circulator_cl_band_13mm:
    notes: 'Two cascaded travelling-wave MZMs between 2x2 MMIs, single-ended electrodes, both biased at maximum; non-reciprocity
      from co- vs counter-propagating RF (no magnets, no resonators). Packaged with epoxy-attached fibre arrays; ports 1->2
      counter-propagating (low loss), 2->1 isolated, 2->3 circulated with residual 2fRF pulses. MZM Vpi and EO bandwidth are
      modulator metrics (no modulator class in this atlas; this lit paper is not in the EO atlas): not entered. Mean RF drive
      per modulator and same-wavelength BiDi 800G link results are not component parameters: not entered. Isolation bandwidth
      printed only as 14 THz over the full C+L band (no nm edges with the statement): not entered as isolation_bw_nm (D169);
      the fixed-parameter >= 15 dB window is entered as an isolation row over the wavelength range. C+L device: 6-dB EO bandwidth
      printed 102 GHz (p.3 text) vs 104 GHz (Fig. 1 caption), 5-GHz Vpi 2.25 V (not entered). Mean RF power 19 dBm (5.64 V)
      per modulator. Methods (p.10): TFLN PICs designed and manufactured by HyperLight Corporation in a commercial high-volume
      TFLN foundry process: fab_org_ids = HyperLight.'
    why: 'D169 gap-fill: note said the isolation bandwidth had no nonreciprocal parameter; isolation_bw_nm exists now but
      the C+L span is printed only in THz'
