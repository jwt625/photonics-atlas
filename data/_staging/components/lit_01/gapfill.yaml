  cmp_lit_kuznetsov2025_gap_opa_spiral_780nm:
    platform: gap_on_insulator
    notes: 'Single CW pump at 1550 nm, degenerate FWM; signal scanned 1550-1630 nm (laser limit), OSA 2 nm RBW, Max Hold.
      Net gain > 10 dB over 70 nm entered as a gain_db bound over 1560-1630 nm (m10); the 70 nm span and the estimated > 140
      nm (17 THz) symmetric 10-dB region (p.4; assumed symmetric spectrum, author_estimate) are entered as gain_bandwidth_nm
      (D169). Idler conversion efficiency spectra (Fig. 2(d)) not read. Abstract''s up-to-35 dB parametric gain and 0.25 mm2
      footprint not attributed to a specific spiral in the text; gain entered on this row (Fig. 2(e) internal signal gain
      peaks near 37 dB at 4.13 W, reading), footprint on both rows. Measured beta2 = -124 fs2/mm (Methods, Ext. Data Fig.
      3) and simulated gamma 165 /W/m (Aeff 0.26 um2) have no registry parameter: not entered (gap). Spirals: Archimedean,
      bend radius from 250 um to about 80 um, fit one 525 x 525 um EBL field. Acknowledgements (p.11): the authors fabricated
      the sample at the Binnig and Rohrer Nanotechnology Center (BRNC) at IBM Research Europe - Zurich; author contributions
      credit A.N. (EPFL and IBM Research Europe - Zurich) with the fabrication: fab_org_ids = IBM Research Zurich (D83c, org
      where fabrication was done), facility BRNC (mohl2025 precedent).'
    why: 'D252 platform: GaP 299 nm device layer bonded (5 nm ALD Al2O3) onto 2 um SiO2 on Si, per core_material and p.8 Methods
      (Fabrication): GaP on an insulator. D169 gap-fill: note said the > 140 nm region was not entered (no gain-bandwidth
      parameter); now entered'
  cmp_lit_kuznetsov2025_gap_opa_spiral_790nm:
