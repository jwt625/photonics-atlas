  cmp_lit_mckenna2022_ppln_racetrack_shg:
    class: frequency_converter.shg
    notes: 'Doubly resonant frequency doubler; reclassed resonator.ring -> frequency_converter.shg after the registry extension
      (D168 / D252): SHG efficiency 12% at 390 uW in the feed waveguide (p.4, Fig. 4(a), 30.5 C) and cascaded-OPO threshold
      690 uW on-chip (p.4) entered (D169); nonlinear coupling rate g ~130 kHz (p.8) has no parameter: not entered. Poling
      period ~3.7 um (p.1, Lambda = lambda_SH / dn) entered as poling_period_um. All modes undercoupled (power-dependent lineshape
      analysis, p.7). Different but similar device from the OPO row on the same chip. Author contributions credit T.P.M.,
      H.S.S. and V.A. with fabricating the device (all authors at Stanford University): fab_org_ids Stanford University (D72).
      Acknowledgements (p.12): part of the work performed at the Stanford Nano Shared Facilities (SNSF): facility (pre-merger
      name, D80d).'
    why: 'D168 / D252 reclass: resonator.ring -> frequency_converter.shg (doubly resonant SHG device; Q / FSR / pump_threshold
      now allowed on frequency_converter). D169 gap-fill: note said SHG efficiency, cascaded-OPO threshold and poling period
      were not entered; now entered'
  cmp_lit_mckenna2022_ppln_racetrack_opo:
    class: frequency_converter.other
    notes: 'Reclassed laser.other -> frequency_converter.other after the registry extension (D168 / D252). Mode Qs (SH: Q_L
      0.88e6, Qi 1.5e6; signal modes Q_L 0.68e6 / 0.94e6, Qi 0.8e6 / 1.5e6, p.7, Table I) entered (q_loaded / q_intrinsic
