    why: 'D169 gap-fill: note said the 10-dB isolation bandwidth was not entered (gap); now entered'
  cmp_lit_song2025a_mo_si_three_port_circulator:
    notes: 'Planar nonreciprocal focusing device: input slab f1 = 200 um, output slab f2 = 50 um, N = 13 arrayed waveguides,
      backward port spacing D = 6 um (design, p.7); TM0 operation; measured under a 1000 Oe in-plane field on a PM fibre butt-coupled
      setup. Measured and simulated crosstalk entered as crosstalk_db (positive magnitudes; widened to nonreciprocal, D169).
      Simulated NRPS 4.375 rad/mm of the 500 nm MO/Si waveguide (p.7) not entered. Measured crosstalk -19 dB between port
      1 and port 3 at 1552.3 nm. IL breakdown by the authors (origin of the terms not stated): Si to MO/Si junction loss 3.5
      dB, Si and MO/Si waveguide loss 2.5 dB, focusing loss 6 dB (fabrication phase errors). Design: simulated crosstalk -21
      dB and focusing loss 0.7 dB. Devices made in a silicon photonics foundry, then MO thin films deposited (p.10): foundry
      not named, MO deposition process referred to earlier work [8]: fab_org_ids empty.'
    why: 'D169 gap-fill: note said crosstalk was only quoted in notes (crosstalk_db not allowed); now entered'
  cmp_lit_song2025a_mo_si_four_port_router:
    class: nonreciprocal.other
    notes: 'Planar nonreciprocal focusing device: input slab f1 = 200 um, output slab f2 = 50 um, N = 13 arrayed waveguides,
      backward port spacing D = 6 um (design, p.7); TM0 operation; measured under a 1000 Oe in-plane field on a PM fibre butt-coupled
      setup. Measured and simulated crosstalk entered as crosstalk_db (positive magnitudes; widened to nonreciprocal, D169).
      Simulated NRPS 4.375 rad/mm of the 500 nm MO/Si waveguide (p.7) not entered. Router, not a strict circulator: nonreciprocal.other
      (D252). Forward power from port 1 equally divided to ports 2 and 3 at 1552.7 nm. Measured minimum crosstalk about -16
      dB between port 4 and port 1 at 1549.9 nm. IL breakdown by the authors: junction 3.5 dB, waveguide 3 dB, focusing 8.5
      dB. Design: simulated crosstalk -21 dB, focusing loss 0.9 / 1.2 dB. Devices made in a silicon photonics foundry, then
      MO thin films deposited (p.10): foundry not named, MO deposition process referred to earlier work [8]: fab_org_ids empty.'
    why: 'D168 / D252 reclass: nonreciprocal.circulator -> nonreciprocal.other (four-port router, forward power split to two
