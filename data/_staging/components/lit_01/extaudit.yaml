components:
  cmp_lit_zhang2023_utp_inp_soa_switch:
    notes: 'Coupon 45 um wide, printed in an 80 x 1050 um recess; FIB cross-section shows 230 nm lateral misalignment (p.7).
      Differential resistance 10 ohm at 100 mA (Fig. 5(a)) entered as series_resistance_ohm m5 (D258). Gain is on-chip (setup,
      grating couplers and MZI switch loss calibrated out; switch IL 1.4 dB is cited from [30], not entered). Platform other:
      light is amplified in the printed InP coupon on the c-Si / poly-Si waveguide (hybrid, D71), stack in core_material.
      fab_org_ids: imec (SiPh host, p.5 iSiPP50G, p.10 SiPh circuit fabrication at imec); DVS-BCB spray-coating done at EV
      Group (p.5, p.10) is a bonding-film step, note only (rule 12). Who fabricated the InP SOA coupons is not stated (design
      in ref. [31]); printing with an X-Celeprint uTP-100 tool.'
    why: 'D258: series_resistance_ohm allowed for amplifier; the 10 ohm value is now entered (m5)'
