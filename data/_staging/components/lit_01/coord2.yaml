# Org round 5 coordinator assignments (DevLog-001 D277, 2026-10-22): fab / facility org ids left empty in
# lit_01 only because the org was missing from the registry; orgs added by org curation batch_7. Applied last,
# on top of patch.yaml, coord.yaml, gapfill.yaml and sweep2.yaml (current staging CSVs); notes replace the
# 'not in the registry' wording.
components:
  cmp_lit_ronn2019_er_al2o3_si3n4_slot_amp_250um:
    fab_org_ids: org_centre_de_nanosciences_et_de_nanotechnologies
    facility_org_ids: org_micronova_nanofabrication_centre
    notes: 'Er:Al2O3 150 nm by ALD (830 supercycles, 300 C), ~4.9e21 Er/cm3; Si3N4 slot (~100 nm slot, ~460 x 460 nm rails,
      SEM) on 5.5 um LPCVD SiO2 + 500 nm thermal oxide; TE coupled. Net modal gain per unit length (Table 1) entered as gain_db_per_cm
      (D169); net material gain per unit length (lower bound, alpha0 ~ 0 assumed) is not entered; signal enhancement is not
      a net gain, not entered. Confinement factor 0.311 / 0.315 (calculated) not entered. Fabrication: the authors state they
      fabricated the devices (p.2), authors at Aalto, C2N (CNRS / Universite Paris-Sud), Southampton and UEF; author contributions
      (p.9) credit X.L., C.R. and W.Z. (C2N) with the waveguide design and fabrication and J.R. (Aalto) with designing the
      gain material and its deposition (design, not a fabrication statement): fab_org_ids org_centre_de_nanosciences_et_de_nanotechnologies
      (C2N; coord2, lit_01 audit Q2). Micronova Nanofabrication Centre thanked for providing the facilities (p.9): facility_org_ids
      org_micronova_nanofabrication_centre (D42 / D80c; coord2).'
    why: 'lit_01 audit Q2 / D277: author contributions (p.9) credit the C2N authors with waveguide design and fabrication
      (D80b); ''thank Micronova Nanofabrication Centre for providing the facilities'' (p.9) is facility use (D42 / D80c);
      both orgs added in org round 5'
