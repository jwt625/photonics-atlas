- id: cmp_lit_liu2022f_hybrid_tops
  why: 'D259 / D259a / D408: Table 3 (p.18) credits the hybrid TOPS (18.61 mW/pi, 6.0 / 6.0 us) to ref. [45], a misprint for the authors'' own ref. [49] (Liu et al., 2020 symposium, CUMEC TOPS comparison): Table 3 tags the CUMEC silicide / TiN rows [45] with exactly the Table 1 [49] values (p.4) and the IMEC rows [46] with the Tables 1 / 2 [50] values (p.4, p.7), and [45] (Passaro 2005, p.20) cannot hold CUMEC data; the p.4 value 18.61 mW/pi equals that row'
