# Audit patch lit_295 (fresh-context audit 2026-11-26, DevLog/audits/2026-11-26-lit_295-audit.md).
# 43 metrics: 39 ok / 4 imprecise / 0 wrong; 9 components: 6 ok / 3 imprecise / 0 wrong. 1 miss added.
# After the patch: 9 components, 44 metrics (selvaraja2009 4 / 26, selvaraja2009a 5 / 18, smit1996 0 / 0).
# Fixes: selvaraja2009a Fig. 17 printed data labels (R 1 / 2 / 3 um) are measured, not extracted_from_figure (D702:
# printed label, not a plot reading). selvaraja2009 AWG 0.57 nm condition no longer tied to the 17 AWGs of Fig. 12
# (the text does not tie it). Component notes of the three 193 nm selvaraja2009 rows: the process metrology was not
# stated to be on separate characterization wafers. Miss: Fig. 11 0.02 nm label of the RTR pair 25 um apart, entered
# on the ring with the text / figure conflict noted (D417). Note supplement (row ok): AWG footprint conflict with the
# companion overview.
metrics:
