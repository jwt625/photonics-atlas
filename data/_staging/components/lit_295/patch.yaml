    basis: measured
    notes: 'printed Fig. 17 data label 0.071 dB/90 deg: a printed label, not a plot reading, so measured (D702); error bar drawn, size not printed; no wavelength stated'
    why: 'p.7 Fig. 17 render: the value is a printed data label beside the R 1 um point, not read off the axis; D702 (akiyama2005 printed figure label measured), merged selvaraja2014 ring_demux_1x4-m2 (Fig. 7 label, measured)'
  cmp_lit_selvaraja2009a_bend_r2-m1:
    basis: measured
