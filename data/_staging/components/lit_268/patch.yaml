    scope: per_component
    condition: 'MZI2 (ATL 70 um, Wout 500 nm, PS 0.7 mm) at its loss minimum; printed with "a total MZI loss of only 3 dB" (MZI2 minimum 3.00 dB at 1512.35 nm, p.6)'
