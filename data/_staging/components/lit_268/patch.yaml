    basis: author_estimate
    locator: 'p.2 Sec. I; p.6 Sec. III-C; p.6 Fig. 5(b)'
    notes: 'printed "At 1512 nm, the interface loss was 1.18 dB for a total MZI loss of only 3 dB"; the breakdown inputs at 1512 nm are not printed (origin not stated); same assumptions as the 1550 nm extraction (nominal 0.22 dB PDK MMIs). (3.00 - 2 x 0.22 - 2 x 1.18) / 0.7 mm implies about 0.29 dB/mm PS loss at 1512 nm, which the paper does not state'
    why: 'miss: printed interface value at a second wavelength; ties to the 70 um ATL design through MZI2 (only MZI2 has the 3.00 dB minimum); author_estimate per rule 4 (nominal input, origin not stated)'
