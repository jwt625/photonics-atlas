# Audit patch lit_268 (fresh-context audit 2026-11-24, DevLog/audits/2026-11-24-lit_268-audit.md).
# 108 metrics: 97 ok / 11 imprecise / 0 wrong; 21 components: 21 ok. 4 misses added (1 performance value, 3 geometry).
# Fixes: um-printed widths stored in nm -> derived (D157 / D256: chrysostomidis2025 Winp, frigg2019 ring and bus widths);
# frigg2019 core thickness cites the p.2 nm form (D256); chrysostomidis2025 simulated 1.65 dB locator (p.2 / p.6 print
# 1.65, p.4 prints 1.66); frigg2019 single-mode 1580 nm loss = Table 1 1.1 dB/cm (Fig. 6(a) 1580 nm point agrees; the
# introduction pair 1.3 dB/cm / Q_int 2.68e5 matches the Fig. 6(a) 1560 nm point), Q_int 2.68e5 kept with the conflict
# note (D417); multi-mode ng printed precision 2.00.
