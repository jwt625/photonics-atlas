    why: 'p.12 Fig. 14(a): the -5 V non-trapping trace crosses -3 dB at about 2.0 GHz, not 2.1 GHz'
  cmp_lit_zhou2020_nopt_d60-m2:
    value: '0.70'
    notes: 'Fig. 14(a) -3 V w/o-holes (black) trace lies under the red R = 700 nm trace near -3 dB; read about 0.70 GHz (audit pixel read); the printed +1.4 % for the trapping device (p.11) places it about 0.01 GHz lower; reading uncertainty about +/-0.03 GHz'
    why: 'p.12 Fig. 14(a): the black and red -3 V traces overlap and cross -3 dB at about 0.70 GHz, not 0.75 GHz'
  cmp_lit_zeng2019_apd_3t_gap300-m7:
    value: '7.9'
    notes: 'read off the Fig. 4(d) marker at 2.0 V: about 7.9 GHz (audit pixel read on the embedded figure, 44.5 px per GHz in a 2x crop; calibration checked on the printed 18.9 GHz point at 6.4 V); neighbouring markers about 7.8 GHz (1.8 V) and 8.2 GHz (2.2 V); reading uncertainty about +/-0.1 GHz'
    why: 'p.4 Fig. 4(d): the 2.0 V marker sits at about 7.9 GHz (scale 6-20 GHz), not 7.6 GHz'
  cmp_lit_jacques2019_npp_si_tops-m19:
    basis: design_target
    notes: 'p.3 prints a 90 nm high Si slab; Fig. 4 caption H_slab = 0.09 um (design)'
    why: 'p.3 Sec. 2.2 prints the slab height in nm (90 nm), so no unit rescale is involved: design_target, not derived'
  cmp_lit_jacques2019_npp_si_tops-m17:
    locator: p.3 Sec. 2.2; p.8 Fig. 4
    notes: 'W_rib = 0.5 um (Fig. 4 caption); p.3 prints the 500 nm waveguide width and builds the rib by adding the 90 nm slab to it (design)'
    why: 'The only locator printed the width in um (design_target would need a rescale, D157 / D256); p.3 Sec. 2.2 prints 500 nm for the waveguide that the rib design extends'
  cmp_lit_miller2019_mode_converter_adc-m1:
    wavelength_inferred: 'true'
    notes: "printed 'we estimate'; reproduces as 2.2 dB / 5 (five-pass minimum IL at 1594 nm); also printed as 0.44 dB per pass (p.3). No wavelength printed with the per-event value: band from the input minimum (1594 nm, L band)"
    why: 'Rule 8: the 0.44 dB value has no printed wavelength; the band comes from the five-pass minimum it reproduces from, so wavelength_inferred is true'
  cmp_lit_miller2019_mode_converter_adc-m2:
    wavelength_inferred: 'true'
    notes: "printed 'we estimate'; reproduces as (4.6 - 2.2) dB / 2 from the minima at 1601 / 1594 nm; higher loss attributed to closer mode effective indices. No wavelength printed with the per-event value: band from the input minima (L band)"
    why: 'Rule 8: the 1.2 dB value has no printed wavelength; the band comes from the minima it reproduces from, so wavelength_inferred is true'
  cmp_lit_miller2019_mmi_1x2-m1:
    band: ''
    wavelength_nm: '1552'
    wavelength_max_nm: '1575'
    notes: "printed 'less than 0.03 dB loss per splitter'; origin not stated; no wavelength printed with the value: the phased array that contains the splitter tree is operated over 1552-1575 nm (p.4), entered as the inferred span (it crosses the C / L boundary)"
    why: 'Rule 8: the inferred band c_band does not cover the stated 1552-1575 nm operating span of the array (p.4); the span itself is entered with wavelength_inferred true'
  cmp_lit_jacques2019_tin_tops_7p5um-m6:
    notes: 'p.9: the heated-segment loss vs back-to-back grating couplers is below the effective measurement resolution (FAU drift +/- 0.2 dBm) for both fabricated designs; the 0.4 dB bound is printed only in Table 2 (p.13), on the row of the optimal 2.5 um TiN design, which was not fabricated, so the bound can only come from this 7.5 um device; simulation predicts < 0.01 dB; no voltage dependence measured'
    why: 'Audit Q9: the number 0.4 dB is printed for the unfabricated 2.5 um design row of Table 2, not for this device; the note now records why it is placed here'
  cmp_lit_zhou2020_pt_r700_d250-m2:
    notes: 'mesa diameter not printed with the value. Identification from the paper''s own numbers: the abstract pairs 45.2 with the non-trapping 31.5 mA/cm2, which Fig. 10(b) places at 4/D = 160 /cm (250 um); with J_bulk 28.7 mA/cm2 and the Fig. 11 with-holes surface shares 26 / 31 / 28 / 37 % at 60 / 80 / 150 / 250 um, 28.7 / (1 - share) gives 38.8 / 41.6 / 39.9 / 45.6 mA/cm2, so only the 250 um device reproduces 45.2 (photon-trapping devices of Fig. 10 have R = 700 nm)'
    why: 'Note-only (audit Q1): records the full reproduction across the four Fig. 11 diameters, which is why the D159 risk does not apply'
