metrics:
  cmp_lit_zhou2020_pt_r700_d60-m2:
    value: '1.0'
    notes: 'read off the blue (-3 V, R = 700 nm) trace of Fig. 14(b) at the -3 dB line: about 0.99 GHz (audit pixel read on the embedded figure, log axis 182 px per decade, quadratic fit of the trace either side of the dashed line; calibration checked on the printed 2.7 GHz star); reading uncertainty about +/-0.03 GHz'
    why: 'p.12 Fig. 14(b): the -3 V trace crosses -3 dB at about 1.0 GHz (x within 1 px of the 1e9 tick), not 0.95 GHz'
  cmp_lit_zhou2020_pt_r700_d60-m3:
    value: '2.25'
    notes: 'read off the blue (-5 V, R = 700 nm) trace of Fig. 14(a) at the -3 dB line: about 2.22-2.29 GHz (audit pixel read, log axis 182 px per decade; the dashed circle around the crossing excluded, trace fitted either side); reading uncertainty about +/-0.05 GHz; printed +12.3 % vs the 60 um non-trapping device at -5 V (p.11), which with the 2.0 GHz non-trapping read gives 2.25 GHz'
    why: 'p.12 Fig. 14(a): the -5 V R = 700 nm trace crosses -3 dB at about 2.25 GHz, not 2.4 GHz; 2.25 / 2.0 also matches the printed +12.3 %'
  cmp_lit_zhou2020_pt_r700_d60-m4:
    value: '0.70'
    notes: 'read off the red (-3 V, R = 700 nm) trace of Fig. 14(a) at the -3 dB line: about 0.70 GHz (audit pixel read, log axis 182 px per decade; dashed circle excluded); reading uncertainty about +/-0.03 GHz; printed +1.4 % vs the non-trapping device at -3 V (p.11)'
    why: 'p.12 Fig. 14(a): the -3 V R = 700 nm trace crosses -3 dB at about 0.70 GHz, not 0.75 GHz'
  cmp_lit_zhou2020_nopt_d60-m1:
    value: '2.0'
