  cmp_lit_miller2019_ps_7pass:
    notes: 'Measured in an MZI (Fig. 1(d)); heater on the SiO2 cladding above the 2.44 um multimode waveguide. Fabrication of the test devices not stated in the main text (Supplement 1, not cached): fab empty; the first-person fabrication sentence names only the phased array (D515). Facilities: work performed in part at the Advanced Science Research Center at the City College of New York and at Columbia Nano Initiative Nano Fabrication Facilities (p.4 Acknowledgment). Not entered: P_pi x tau = 11.1 mW us (product of entered values); 3.7 % phase-shift variation over 1525-1600 nm (no parameter); 3-dB optical bandwidth > 100 nm (registry gap); 8.9x reduction; 2-3 dB total IL over 150 nm with optimized converters (Supp. Fig. S2, not cached; optimized design, not this device); comparison values of refs. [33], [34], [39], [40] (cited). Phase tuning time 6.5 us printed (p.2, P_pi x tau figure of merit), stated independent of the number of passes; its definition is only in Supp. Fig. S9 (not cached), so no thermal_time_constant_us row.'
