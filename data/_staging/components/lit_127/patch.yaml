# Audit patch lit_127 (fresh-context audit 2026-11-12, DevLog/audits/2026-11-12-lit_127-audit.md).
# 151 metrics: 139 ok / 12 imprecise / 0 wrong; 25 components: 24 ok / 1 imprecise / 0 wrong; 0 deleted; 1 miss added.
# Ops: 1 component, 13 metrics (12 imprecise + 1 note-only edit on an ok row), 1 add_metrics; 15 ops.
# Coordinator rulings open (audit Q1-Q11): Q1 zhou2020 45.2 mA/cm2 (kept, note only), Q2 zhou2020 Fig. 6 / Fig. 9 reads on the
# 250 um rows (kept; strict alternative: delete cmp_lit_zhou2020_nopt_d250-m2, cmp_lit_zhou2020_pt_r600_d250-m1 and -m2),
# Q3 thermal_time_constant_us (kept; strict alternative for miller2019: delete cmp_lit_miller2019_ps_1pass-m2, ps_3pass-m3,
# ps_5pass-m3, ps_7pass-m3), Q4 sheng2026 heater_thickness_nm (no op), Q5 li2018 20 levels (no op), Q6 jacques2019 fab (no op),
# Q7 zhou2020 NTU fab (no op), Q8 miller2019 fab per component (no op), Q9 jacques2019 TiN < 0.4 dB (note only),
# Q10 zeng2019 Fig. 4(b) 300 nm point (added; to drop it, remove the add_metrics entry), Q11 li2018 source-row licence (no op).
components:
  cmp_lit_jacques2019_tin_tops_7p5um:
    notes: "Fab: both TOPS designs fabricated on the same die in a multi-project wafer at A*STAR's Institute of Microelectronics (IME) Foundry (p.7 Sec. 2.3; IME printed 'now AMF', p.2; AMF, CMC Microsystems, Lumerical thanked for support only, p.15, not fab). Tested in a thermally tuned MZI with one output, grating couplers in and out (p.7 Sec. 3, Fig. 5(a)); 15 test structures, all C-band. Not entered (no parameter): power drift < 0.1 mW over 10 min at fixed voltage (p.9 Fig. 6(b)); thermal crosstalk into a victim MZI (Fig. 9; deep trench reduces the victim phase by 0.31 / 0.11 / 0.08 / 0.02 rad at 5 / 15 / 45 / 135 um gaps, p.11); frequency-response peaking; FOM P_pi x tau. Fabricated TiN width is the widest simulated case (Fig. 2), chosen to validate the simulations (p.7). Measured P_pi exceeds the Fig. 2(a) simulation by about 3.0 mW (p.10). Per-pitch P_pi: the text prints only the 29.2-31.5 mW span and the +2.3 mW increase from d_intra 200 to 50 um (p.10; Fig. 8 render on p.10 shows the four pitches with linear fits); the 100 / 150 um values would be figure reads of the pi crossings and are not entered."
    why: "p.10 Fig. 8 is rendered (page_10) with a readable legend; the note said the legend was missing and no render existed. Not entering the intermediate pitches stays right (figure-only crossings), the reason is corrected"
  cmp_lit_miller2019_ps_1pass:
    notes: 'Measured in an MZI (Fig. 1(d)); heater on the SiO2 cladding above the 2.44 um multimode waveguide. Fabrication of the test devices not stated in the main text (Supplement 1, not cached): fab empty; the first-person fabrication sentence names only the phased array (D515). Facilities: work performed in part at the Advanced Science Research Center at the City College of New York and at Columbia Nano Initiative Nano Fabrication Facilities (p.4 Acknowledgment). Not entered: insertion loss (not reported for the one-pass device). Phase tuning time 6.5 us printed (p.2, P_pi x tau figure of merit), stated independent of the number of passes; its definition is only in Supp. Fig. S9 (not cached), so no thermal_time_constant_us row.'
    why: 'coordinator ruling D569 (audit Q3, strict definition, lit_43 practice): the paper prints a ''phase tuning time'' of 6.5 us whose definition is only in an uncached supplement; thermal_time_constant_us is a first-order time constant, not a rise time; value kept in the component notes'
  cmp_lit_miller2019_ps_3pass:
    notes: 'Measured in an MZI (Fig. 1(d)); heater on the SiO2 cladding above the 2.44 um multimode waveguide. Fabrication of the test devices not stated in the main text (Supplement 1, not cached): fab empty; the first-person fabrication sentence names only the phased array (D515). Facilities: work performed in part at the Advanced Science Research Center at the City College of New York and at Columbia Nano Initiative Nano Fabrication Facilities (p.4 Acknowledgment). Not entered: 3-dB optical bandwidth > 100 nm (IL within 3 dB of its minimum, Fig. 2(b); no bandwidth parameter for phase_shifter, registry gap); 3.3x power reduction (ratio). Phase tuning time 6.5 us printed (p.2, P_pi x tau figure of merit), stated independent of the number of passes; its definition is only in Supp. Fig. S9 (not cached), so no thermal_time_constant_us row.'
    why: 'coordinator ruling D569 (audit Q3, strict definition, lit_43 practice): the paper prints a ''phase tuning time'' of 6.5 us whose definition is only in an uncached supplement; thermal_time_constant_us is a first-order time constant, not a rise time; value kept in the component notes'
  cmp_lit_miller2019_ps_5pass:
    notes: 'Measured in an MZI (Fig. 1(d)); heater on the SiO2 cladding above the 2.44 um multimode waveguide. Fabrication of the test devices not stated in the main text (Supplement 1, not cached): fab empty; the first-person fabrication sentence names only the phased array (D515). Facilities: work performed in part at the Advanced Science Research Center at the City College of New York and at Columbia Nano Initiative Nano Fabrication Facilities (p.4 Acknowledgment). In the phased array the five-pass shifters are separated by 28 um (p.3; pitch_um not allowed for phase_shifter). Not entered: 3-dB optical bandwidth > 100 nm (registry gap); 5.9x power reduction (ratio). Phase tuning time 6.5 us printed (p.2, P_pi x tau figure of merit), stated independent of the number of passes; its definition is only in Supp. Fig. S9 (not cached), so no thermal_time_constant_us row.'
