# Audit patch bt_03 (fresh-context audit 2026-10-20), main block plus optional blocks [] (D80 / D82 rulings).
components:
  cmp_chen2023_sl_wg_ng3p54:
    notes: Coupled Bragg-resonator SL waveguide, W 0.4 um, P 20 periods per mirror, N 5-25 resonators (cut-back by N, Fig. 6(f)). The ng legend of Fig. 6(f) is not tied to a corrugation depth in the text;
      the value matches the W 0.4 um bar for delta 0.20 um in Fig. 6(e) (curator matching). The ng 4.00 design (0.0133 dB/um) is held by EO row chen2023-a (133 dB/cm) and is not entered. Group index 3.54
      from the FP-cavity test structures entered (D75). Fabricated by three co-authors at Zhejiang University (author contributions, p.9); x-cut LNOI wafer from NanoLN (supplier, a note). Separate passive
      test structures, not the SL-MZM itself.
    why: D75 group_index now available
  cmp_chen2023_sl_wg_ng4p42:
    notes: Coupled Bragg-resonator SL waveguide, W 0.4 um, P 20 periods per mirror, N 5-25 resonators (cut-back by N, Fig. 6(f)). The ng legend of Fig. 6(f) is not tied to a corrugation depth in the text;
      the value matches the W 0.4 um bar for delta 0.28 um in Fig. 6(e) (curator matching). The ng 4.00 design (0.0133 dB/um) is held by EO row chen2023-a (133 dB/cm) and is not entered. Group index 4.42
      from the FP-cavity test structures entered (D75). Fabricated by three co-authors at Zhejiang University (author contributions, p.9); x-cut LNOI wafer from NanoLN (supplier, a note). Separate passive
      test structures, not the SL-MZM itself.
    why: D75 group_index now available
  cmp_chen2023_sl_wg_ng4p96:
    notes: Coupled Bragg-resonator SL waveguide, W 0.4 um, P 20 periods per mirror, N 5-25 resonators (cut-back by N, Fig. 6(f)). The ng legend of Fig. 6(f) is not tied to a corrugation depth in the text;
      the value matches the W 0.4 um bar for delta 0.32 um in Fig. 6(e) (curator matching). The ng 4.00 design (0.0133 dB/um) is held by EO row chen2023-a (133 dB/cm) and is not entered. Group index 4.96
      from the FP-cavity test structures entered (D75). Fabricated by three co-authors at Zhejiang University (author contributions, p.9); x-cut LNOI wafer from NanoLN (supplier, a note). Separate passive
      test structures, not the SL-MZM itself.
    why: D75 group_index now available
  cmp_chen2023_sl_wg_ng7p5:
    notes: Highest-ng SL waveguide (ng about 7.5 from the FP-cavity FSR; 7.50 on p.2). W 0.2 um and delta 0.32 um from the tallest bar of Fig. 6(e); P 20, N 5 per the Fig. 6 caption. Group index and 3-dB
      passband about 8 nm entered (D75). IL / BW3dB / ng bars for the other 11 W-delta combinations of Fig. 6(c)-(e) not read off. Fabricated by three co-authors at Zhejiang University (author contributions,
      p.9); x-cut LNOI wafer from NanoLN (supplier, a note). Separate passive test structures, not the SL-MZM itself.
    why: D75 group_index and bw_3db_nm for waveguide_platform now available
  cmp_hou2024_ring_r40um:
    notes: The two identical-design rings of EO row hou2024-a, entered as one design with the two individual values as ranges (n = 2). The p.8 'respectively' lists Q (20k, 25k) and power coupling (7.1,
      4.5 %) without naming the rings; the EO row assigns them to ring 1, ring 2 in that order, which is consistent with ring 1 (ER 13 dB) being the broader single resonance (pair linewidth / 1.28) - curator
      check, not stated. Ring-pair values (32 dB ER, 22 GHz linewidth) belong to the EO device and are not entered here. Fabrication org not stated (authors 'fabricated', affiliations not in the cached
      text); LNOI from NanoLN.
    why: D75 power_coupling_pct now entered; ring-order note updated after the consistency check
