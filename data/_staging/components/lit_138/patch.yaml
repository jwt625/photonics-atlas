# 68 metrics: 66 ok / 2 imprecise / 0 wrong; 14 components: 12 ok / 2 imprecise / 0 wrong; 0 deleted; 5 misses added (D153 geometry).
# Coordinator rulings open (audit Q1-Q7):
# Q1 boller2019 Sec. 5 dual-gain rows vs ref. [149]: keep (no op). Strict D259a alternative, values only: delete_metrics
#    cmp_lit_boller2019_dual_gain_laser-m1 and -m2 (the 'these values ... [149]' sentence); whole-section alternative:
#    delete_components cmp_lit_boller2019_dual_gain_laser and cmp_lit_boller2019_dual_gain_output_coupling.
# Q2 rees2020 0.1 dB/cm and 100 um bend radius next to ref. [31]: keep author_estimate / design_target (no op; D80i borderline,
#    zhao2016 D554 precedent). To drop: delete_metrics cmp_lit_rees2020_triplex_wg-m1 / -m2 and delete_components
#    cmp_lit_rees2020_triplex_wg.
# Q3 boller2019 Sec. 6 (ref. [108]) and Sec. 7.1 (ref. [168]) kept out (no op).
# Q4 boller2019 Sec. 4 laser and rees2020 laser are one device reported in both papers: both kept, cross-notes (op below).
# Q5 rees2020 HHI gain chip: no amplifier row (no op).
# Q6 morton2021 reflector peak reflectivity 0.5 (amplitude in text, power in Fig. 3): kept out (no op).
# Q7 morton2021 360 Hz qualifier lt and mrr1 group index author_estimate (ops below).
components:
  cmp_lit_rees2020_ecl:
    notes: "Gain chip fabricated by the Fraunhofer Heinrich Hertz Institute (p.3); no fabrication statement for the feedback chip or the assembly, so fab is empty on this assembled row (Contract v7 per-component rule). Effective optical cavity length 3.5 cm (6.7 mm bus plus ring enhancement 13.7): no parameter. Cross-note: the same laser and data (24 mW at 1576 nm / 300 mA, 120 nm coverage, 63 dB SMSR, 700 Hz2/Hz white level, 2.2 kHz; Figs. 3-5 match boller2019 Figs. 5-7) are reported in lit:boller2019 Sec. 4 (cmp_lit_boller2019_two_ring_laser); neither paper cites the other for these values."
    why: "Cross-note missing on this side: boller2019 p.9 Sec. 4 and Figs. 5-7 (p.9-10) show the same values and the same spectra / noise traces as rees2020 Figs. 3-5 (p.5-6); the boller2019 row already carries the cross-note"
  cmp_lit_boller2019_visible_vernier_rings:
    notes: "Sec. 7.3 feedback circuit for a planned 690 nm hybrid laser (no laser yet). Two rings in one row as merged fan2025a Vernier precedent. Fab empty. Radii and 5 % coupling from the Fig. 16 caption, which ties them to the measured spectrum (right panel); the on-chip labels in the Fig. 16 (left) micrograph read K=0.1 R=1200 and K=0.1 R=1220, so the photographed circuit may be a sibling design; the measured Vernier spacing of about 10 nm is consistent with the caption radii (5 um difference), not with a 20 um difference."
    why: "p.20 Fig. 16: the micrograph labels (audit crop of the cached image, label text K=0.1 R=1200 / K=0.1 R=1220) differ from the caption radii 1200 / 1205 um and the specified 5 % coupling; the row did not say which circuit the values belong to"
metrics:
  cmp_lit_morton2021_ictl-m9:
    qualifier: lt
    notes: "Upper bound: at 500 mA the white frequency-noise floor was not reached at 100 MHz; the paper states that measurements to higher frequencies would give Lorentzian linewidths significantly below the 100 MHz values for both 400 and 500 mA (p.6), the same situation as the < 95 Hz row (m7)."
    why: "p.6 Sec. IV: 360 Hz is computed from the FN value at 100 MHz with the floor not reached, and the text states the 400 / 500 mA linewidths are significantly below those found at 100 MHz; skill rule 7 (below -> lt), consistent with m7 (< 95 Hz at 400 mA)"
  cmp_lit_morton2021_mrr1-m3:
    basis: author_estimate
    notes: "No wavelength stated; the design spectra centre near 1550 nm (Fig. 2(c)). Group index used as the design input for FSR = c / (n L) (22.1 GHz follows from 3.6064 and the 599.967 um radius); how the index was obtained is not stated (D82a)."
    why: "p.2 Sec. II states the group index as the input that gives the 22.1 GHz FSR; the reflector tool computes spectra from it, but the paper does not say the index was simulated or measured: D82a / rule 4 origin not stated -> author_estimate (the FSR itself stays simulated)"
