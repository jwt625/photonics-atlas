metrics:
  cmp_lit_seok2019_mems_switch_cell-m6:
    basis: derived
    notes: 'unit cell printed 110 um x 110 um; area is the product (D82d)'
    why: 'p.3 Sec. 3 / Fig. 3(b) print 110 um x 110 um; 12100 um2 is arithmetic on the printed dimensions, so derived (D82d; same basis as the 240 x 240 die footprint m3 and ni2025a footprints)'
  cmp_lit_song2008_mi_arm_heater-m1:
    basis: derived
    notes: 'printed 16.625 kOhm (p.4); stored in ohm, a prefix conversion (D256)'
    why: 'D256: the source prints only 16.625 kOhm (p.4 Sec. 4), never 16625 ohm; a prefix conversion of a measured value is derived'
  cmp_lit_davis2020_cdc_demux_16ch-m5:
    notes: 'printed -18.9 dB average (p.2, p.6, p.7, abstract ~-18.9 dB); the arithmetic mean of the 16 Table 2 values is 20.05 dB and their linear-power mean about 16.4 dB, so the printed average does not reproduce from Table 2; entered as printed'
    why: 'p.6 Table 2 values (19.0 ... 21 dB) average to 20.05 dB, not 18.9 dB; the in-paper inconsistency belongs in the note'
  cmp_lit_suzuki2025_switch_32x32_double_mz-m4:
    wavelength_inferred: ''
    why: 'p.7 Sec. 3.2 states the value with its wavelength (''at a wavelength of around 1330 nm''); an approximately stated wavelength is stated, not inferred (flag definition: inferred from the operating band or a plot axis)'
  cmp_lit_huang2026_sin_ring_annealed-m1:
    wavelength_inferred: ''
    why: 'p.4 ''near 1550 nm'' and p.3 Fig. 2(c) caption ''resonance dips around 1550 nm'' state the wavelength with the value'
  cmp_lit_huang2026_sin_ring_unannealed-m1:
    wavelength_inferred: ''
    why: 'p.4 ''0.066 million near 1550 nm'' states the wavelength with the value'
  cmp_lit_shen2019_gesbs_ring_r100-m1:
    wavelength_inferred: ''
    why: 'p.4 Fig. 2(b) caption ''a resonance close to 1550 nm'' states the wavelength with the value (Fig. 2(b) axis 1549.62-1549.72 nm)'
