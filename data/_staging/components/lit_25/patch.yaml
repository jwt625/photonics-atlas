    why: 'p.4 Fig. 2(b) caption states period and duty cycle of the coupler design; p.6 Sec. 3.1 says the fabricated duty
      cycle may deviate, so the value is not an SEM measurement (skill rule 4: dimensions are design_target unless SEM / AFM-measured)'
  cmp_lit_li2024a_ta2o5_microdisk_120um-m2:
    basis: author_estimate
    notes: printed 2.05e6, computed by the authors as Qi = 2 QL / (1 + sqrt(TF)) with QL 1.92e6 and minimum transmission TF
      77% (undercoupled branch of the formula); the coupling regime is not determined from the data or stated
    why: 'skill rule 4 / coordinator ruling: an intrinsic Q resting on an assumed coupling regime is author_estimate whether
      or not the paper says it assumes it; p.4-5 Sec. 4 uses the undercoupled formula without a regime determination (same
      rule as lucia2026 racetrack q_intrinsic rows, p.7-8)'
  cmp_lit_dumon2004_ring_adddrop-m1:
    notes: unqualified Q (8000 measured); wavelength not stated; the paper's measurements and its racetrack coupling are at
      / around 1550 nm (p.2 Table I, p.3), so the C band is the inferred operating band; ring dimensions and spectrum not
      shown
    why: 'rule 8 reason in notes: the batch note cited the Fig. 6 spectral span, but Fig. 6 shows the racetrack, not this
      ring (p.3 Fig. 6 caption)'
  cmp_lit_cabanillas2021_rac_3db_coupler-m5:
    wavelength_inferred: 'true'
    notes: printed IL < 0.3 dB 'limited by the experimental setup' (p.3 Conclusion, no wavelength stated); span 1275-1290
      nm read from the Fig. 3(b) axis (GCs designed at 1290 nm); Fig. 3(b) boxplots span about -0.15 to 0.27 dB incl. outliers
    why: the conclusion states no wavelength for the < 0.3 dB bound; 1275-1290 nm comes from the Fig. 3(b) plot axis, so wavelength_inferred
      is true with the reason (skill rule 8, D46)
