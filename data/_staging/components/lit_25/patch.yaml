      p.2 ''we only etched'' the Si top layer) but sit at two orgs (Ghent University-IMEC INTEC group and IMEC vzw Silicon
      Processing Technology Division) and the place of fabrication is not named (D72 unambiguity; mangal2018 org-split precedent);
      staff thanks for wafer exposures and mask design name no org (D84b not applicable). Loss from Fabry-Perot cavities (cleaved
      facets on 3 um ridges, 300 um adiabatic tapers to the wire, wire lengths up to 1 mm), cavity loss from fringe contrast
      vs wire length (p.2). Printed uncertainty +/- 1.7 dB/cm (Table I).'
    why: note claimed passive-only fabrication; p.1 'We have made' (ring and racetrack resonators) and p.2 'we only etched'
