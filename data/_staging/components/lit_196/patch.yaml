# Audit patch lit_196 (fresh-context audit 2026-11-18, DevLog/audits/2026-11-18-lit_196-audit.md).
# 189 metrics: 169 ok / 20 imprecise / 0 wrong; 25 components: 21 ok / 4 imprecise / 0 wrong; 0 deletes, 0 misses added.
# All 20 imprecise rows are wavelength conditions: zhu2020 Table II rows (16) carried c_band although Fig. 7 prints each
# resonance on its wavelength axis; chen2025b Fano Q (1) carried c_band for a resonance at about 1529 nm (Fig. 13(g));
# liu2021c excess-loss rows (3) carried 1550 nm although Fig. 6(b) / Fig. 7 print the device passbands (1526-1579 nm).
# After the patch: 25 components, 189 metrics.
# Coordinator rulings asked (audit Q1-Q7): Q1 chen2025b Lg series from Fig. 14 (no op); Q2 Table II on the Ld 0 device
# (patched wavelength only); Q3 GC / waveguide measured (no op); Q4-Q5 xiang2018 as distilled (no op); Q6 zhu2020
# (patched wavelengths); Q7 liu2021c figure wavelengths (patched; revert = drop the three liu2021c metric ops).
components:
  cmp_lit_zhu2020_chg_microdisk_etch0min:
    notes: 'Unsuspended reference sample (etching time 0 min, Fig. 7(a), Table II). Gap 340 nm and access width 500 nm stated for the characterized set (p.6); the gap was designed 310-380 nm in 10 nm steps across eight samples (p.2). Table II ER is a linear dip fraction (0.72 / 0.92 / 0.7 / 0.3; 0.92 called near critical coupling) with no definition: not entered (no linear notch-depth parameter; a dB conversion would assume the definition). Table II Q_s (scattering Q) and alpha_s (scattering share of alpha) have no registry parameter. Q_i is ''calculated following the formula described in Ref. [30]'' from Q_L and ER with no stated coupling regime (D403), and alpha from Q_i with the estimated FSR 2.7 nm (Eq. (2)): both author_estimate. Resonance wavelength not printed in the text; the Fig. 7(a) spectrum, which carries this sample''s Table II FWHM and Q_L labels, puts the dip at about 1543.805 nm (wavelength axis, +/-0.002 nm): Table II rows carry 1543.81 nm with wavelength_inferred. The estimated FSR 2.7 nm keeps c_band inferred. Fab empty: first-person fabrication (''we have fabricated various samples'', p.5) by authors at Sun Yat-Sen University and Jinan University (D154, D395); no acknowledgment. Lensed-fiber input (2.5 um spot) into 2 um-wide input waveguides, tunable laser, polarization controller, 0 dBm (p.2).'
    why: 'follow-up of the wavelength fix: Fig. 7(a) axis prints the resonance (p.5)'
