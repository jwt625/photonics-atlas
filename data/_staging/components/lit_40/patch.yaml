# Audit patch lit_40 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_40-audit.md).
# 103 metrics: 87 ok / 16 imprecise (4 of them moved to new design rows) / 0 wrong; 27 components: 25 ok / 2 changed
# (notes) / 0 deleted; 2 Lc 1.5 mm design rows added (dangel2018, skill rule 9) with 4 moved values, 2 Fig. 17 misses and
# 7 geometry rows; 1 further miss (margaria2025 bottom DBR pairs). Validated on a scratchpad copy: 37 changes, re-run 0,
# merge dry-run "+29 components, +112 metrics; errors 0".
# Not covered here (coordinator decisions, see the audit file): Quandela SAS registry org (margaria2025 fab), lin2022 EO
# MZI as EO-atlas candidate, registry gaps.
components:
  cmp_lit_dangel2018_flipchip_taper:
    notes: 'fab_org_ids org_ibm_research_zurich: the authors (all IBM Research - Zurich) state they structured the 4-inch SOI wafers by e-beam lithography and dry etching (p.6 Sec. V); the polymer waveguides are the authors'' own SM PWG technology (p.4 Sec. IV, D84a). Polymers developed by Dow Corning (acknowledgment, material supplier only). Flip-chip assembly described passively. Coupler loss from the S-shaped test unit (two couplers) compared with adjacent bare reference PWGs; the paper uses it as the single-coupler loss (p.8 loss breakdown). Family row (D165) for values stated over a taper-length range: measured lengths 0.5 / 1.0 / 1.5 / 2.0 mm (Fig. 17) and 0.5-3.0 mm on the 186-I/O assembly (Fig. 23). Values tied to Lc 1.5 mm (Fig. 17-19) are on cmp_lit_dangel2018_flipchip_taper_lc1p5 (skill rule 9).'
    why: 'cross-note for the Lc 1.5 mm design row split off under skill rule 9 (p.8 Sec. VI-B, VI-C: Fig. 18 and Fig. 19 are stated for Lc = 1.5 mm)'
  cmp_lit_dangel2018_fiber_pwg_si_interface:
    notes: 'fab_org_ids org_ibm_research_zurich: the authors (all IBM Research - Zurich) state they structured the 4-inch SOI wafers by e-beam lithography and dry etching (p.6 Sec. V); the polymer waveguides are the authors'' own SM PWG technology (p.4 Sec. IV, D84a). Polymers developed by Dow Corning (acknowledgment, material supplier only). Family row (D165): 50 coupler I/Os with Lc >= 1.0 mm on one 186-I/O assembly (Fig. 22-24). Per-facet IL = fiber-PWG butt coupling + PWG propagation + PWG-SiWG coupler (loss breakdown p.8: 1.5 + 1.5 + 0.5 dB, TE). The Lc 1.5 mm IL/facet (Fig. 20) is on cmp_lit_dangel2018_fiber_pwg_si_interface_lc1p5. The abstract''s ''less than 3.5 dB across the O-band'' is not entered: Fig. 20 shows up to about 4.7 dB (TE) at 1370 nm.'
    why: 'cross-note for the Lc 1.5 mm design row split off under skill rule 9 (p.8 Sec. VI-D: the IL/facet values refer to Fig. 20, Lc = 1.5 mm)'
metrics:
  cmp_lit_dangel2018_flipchip_taper-m1:
    scope: per_component
    why: 'consistency with the direct-processed rows (m1 / m2 per_component) and skill rule 6: one on-chip coupler isolated against a bare reference PWG (p.7 Sec. VI-A)'
  cmp_lit_dangel2018_flipchip_taper-m2:
    scope: per_component
    notes: 'printed as an upper bound; coupler loss = S-shaped test unit (two couplers + S-bend) vs bare reference PWG, used by the paper as the single-coupler loss (p.8 breakdown); halving not stated. Fig. 17 TM points at Lc 1.5 and 2.0 mm read about 0.65-0.7 dB, above the printed bound'
    why: 'p.8 Fig. 17 render: TM squares at Lc 1.5 / 2.0 mm sit near 0.68 / 0.65 dB while the text prints < 0.6 dB for Lc >= 1.0 mm; value kept as printed, inconsistency noted; scope as m1'
  cmp_lit_hwang2017_apodized_gc_1310-m1:
    basis: author_estimate
    notes: 'printed 2.5 dB/facet; origin not stated: the paper describes no optical measurement of the switch chip and states that testing of the package is ongoing (p.4 Conclusions); abstract says the couplers are designed for 1300 nm'
    why: 'skill rule 4: a value of unstated origin is author_estimate; D167 covers a per-facet value whose arithmetic is not shown, not a value with no measurement in the paper (p.4 Conclusions: testing ongoing; lit_05 huang2019a precedent)'
  cmp_lit_lin2022_psr_mode_evolution-m1:
    wavelength_inferred: 'true'
    notes: 'Fig. 1(c) includes the off-chip coupling loss; de-embedding to the on-chip value not described; wavelength not stated with the value, span from the Fig. 1(c) axis (inferred)'
    why: 'components.schema.yaml wavelength_inferred: true when the wavelength comes from a plot axis; p.3 states the < 0.12 dB without a wavelength'
  cmp_lit_lin2022_rib_waveguide_2um-m1:
    wavelength_inferred: 'true'
    notes: 'printed near 0.11 dB/cm; extraction method not described; wavelength not stated with the value, span from the Fig. S3(a) axis (inferred)'
    why: 'p.15 Supp. III states the loss without a wavelength; 1520-1590 nm is the Fig. S3(a) axis (schema: plot axis = inferred)'
  cmp_lit_margaria2025_micropillar_fiber_pigtail-m1:
    notes: 'printed 75(5) %; inferred from the output-fiber brightness 20.8 % divided by the free-space first-lens brightness 46.8 % (assumed unaltered by pigtailing), splice 90 % and filter 66 % transmissions; operating wavelength not printed; the micropillar of the lateral-alignment example has its fundamental mode at 945.8 nm at room temperature (p.4 Fig. 2(e); identity with the pigtailed device not stated); band inferred'
    why: 'p.4: Fig. 2(e) is presented as the result of the alignment measurement on a micropillar; the text does not say it is the pigtailed device, so the note must not claim it'
  cmp_lit_margaria2025_micropillar_fiber_pigtail-m2:
    notes: 'operating wavelength not printed; the micropillar of the lateral-alignment example has its fundamental mode at 945.8 nm at room temperature (p.4 Fig. 2(e); identity with the pigtailed device not stated); band inferred'
    why: as pigtail-m1 (p.4 Fig. 2(e))
  cmp_lit_margaria2025_micropillar_fiber_pigtail-m3:
    notes: 'operating wavelength not printed; the micropillar of the lateral-alignment example has its fundamental mode at 945.8 nm at room temperature (p.4 Fig. 2(e); identity with the pigtailed device not stated); band inferred'
    why: as pigtail-m1 (p.4 Fig. 2(e))
  cmp_lit_margaria2025_micropillar_fiber_pigtail-m4:
    notes: 'operating wavelength not printed; the micropillar of the lateral-alignment example has its fundamental mode at 945.8 nm at room temperature (p.4 Fig. 2(e); identity with the pigtailed device not stated); band inferred'
    why: as pigtail-m1 (p.4 Fig. 2(e))
  cmp_lit_margaria2025_micropillar_fiber_pigtail-m5:
    notes: 'operating wavelength not printed; the micropillar of the lateral-alignment example has its fundamental mode at 945.8 nm at room temperature (p.4 Fig. 2(e); identity with the pigtailed device not stated); band inferred'
    why: as pigtail-m1 (p.4 Fig. 2(e))
  cmp_lit_margaria2025_uhna3_780hp_splice-m1:
    notes: 'printed 90(2) %; operating wavelength not printed; the micropillar of the lateral-alignment example has its fundamental mode at 945.8 nm at room temperature (p.4 Fig. 2(e); identity with the pigtailed device not stated); band inferred'
    why: as pigtail-m1 (p.4 Fig. 2(e))
  cmp_lit_margaria2025_qd_micropillar_cavity-m1:
    notes: 'printed Q around 13,000 for the resulting micropillars; unqualified Q -> q_loaded; operating wavelength not printed; the micropillar of the lateral-alignment example has its fundamental mode at 945.8 nm at room temperature (p.4 Fig. 2(e)); band inferred'
    why: as pigtail-m1 (p.4 Fig. 2(e)); the family row needs no device identity
