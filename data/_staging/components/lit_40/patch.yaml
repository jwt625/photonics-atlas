add_components:
  - component_id: cmp_lit_dangel2018_flipchip_taper_lc1p5
    source_id: lit:dangel2018
    class: chip_chip_coupler.evanescent
    label: Flip-chip-bonded Si inverse taper to SM polymer waveguide on glass, adiabatic coupler, Lc 1.5 mm
    row_kind: fabricated
    platform: other
    core_material: 'Si wire 350 nm wide, 158 or 170 nm thick (both tested) on 2 um BOX, three-segment taper 350 -> 90 nm (LS1 = LS3 = 60 um, LS2 = 1380 um for Lc 1.5 mm), Si chip flip-chip bonded face down; siloxane polymer waveguides on a 6-inch glass wafer, upper cladding opened over the coupler windows'
    cladding: 'UV-curable optical adhesive underfill; PWG claddings 25 um (lower) and 25 um (upper, opened)'
    fab_org_ids: org_ibm_research_zurich
    test_structure: 'true'
    tags: adiabatic;polymer_waveguide;flip_chip
    verified_on: '2026-10-29'
    notes: 'fab_org_ids org_ibm_research_zurich: the authors (all IBM Research - Zurich) state they structured the 4-inch SOI wafers by e-beam lithography and dry etching (p.6 Sec. V); the polymer waveguides are the authors'' own SM PWG technology (p.4 Sec. IV, D84a). Lc 1.5 mm design of the flip-chip family row cmp_lit_dangel2018_flipchip_taper (skill rule 9). Coupler loss from the S-shaped test unit (two couplers + S-bend) vs adjacent bare reference PWGs, used by the paper as the single-coupler loss (p.8 breakdown); halving not stated. Segment lengths from the p.4 Sec. III-C example.'
    why: 'skill rule 9: Fig. 18 (O + C band), Fig. 19 (lateral tolerance) and the Fig. 17 point are tied to the Lc 1.5 mm design (p.8 captions); the family row keeps the values stated over Lc ranges (D165), as the xu2022 design rows beside its family row (lit_05)'
  - component_id: cmp_lit_dangel2018_fiber_pwg_si_interface_lc1p5
    source_id: lit:dangel2018
    class: fiber_chip_coupler.other
    label: SMF to Si waveguide interface via flip-chip polymer waveguide (butt-coupled PWG + adiabatic taper, Lc 1.5 mm)
    row_kind: fabricated
    platform: polymer
    core_material: 'SM siloxane polymer waveguide (Dow Corning test core formulation) on glass, about 1 cm long, adiabatically coupled to a flip-chip-bonded Si taper (Si 158 / 170 nm, 350 nm wire, 90 nm tip, Lc 1.5 mm)'
    fab_org_ids: org_ibm_research_zurich
    test_structure: 'true'
    tags: adiabatic;polymer_waveguide;flip_chip
    verified_on: '2026-10-29'
    notes: 'fab_org_ids org_ibm_research_zurich: the authors (all IBM Research - Zurich) state they structured the 4-inch SOI wafers by e-beam lithography and dry etching (p.6 Sec. V); the polymer waveguides are the authors'' own SM PWG technology (p.4 Sec. IV, D84a). Lc 1.5 mm design of the family row cmp_lit_dangel2018_fiber_pwg_si_interface (skill rule 9). Per-facet IL = fiber-PWG butt coupling + PWG propagation + PWG-SiWG coupler (loss breakdown p.8: 1.5 + 1.5 + 0.5 dB, TE).'
    why: 'skill rule 9: the 1310 nm IL/facet values refer to Fig. 20, stated for Lc = 1.5 mm (p.8 Sec. VI-D, p.9 Fig. 20 caption)'
