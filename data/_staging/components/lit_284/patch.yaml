# Audit patch lit_284 (fresh-context audit 2026-11-25, DevLog/audits/2026-11-25-lit_284-audit.md).
# 116 metrics: 114 ok / 0 imprecise / 2 wrong; 18 components: 16 ok / 2 imprecise / 0 wrong. 2 misses added (li2018b
# gain-waveguide lengths). After the patch: 18 components, 118 metrics.
# Fixes: duprez2016 Fig. 7 FSR rows carried the Table 1 side names, but the figure's own brackets and arrows (and the
# caption and p.8 text) put 6 nm on the left and 7.5 nm on the right mirror of laser 1; the laser notes claimed Fig. 7
# agrees with Table 1. Side conflict now stated on every FSR row and mirror row (D417), values unchanged.
# Note supplements (rows ok): duprez2016 Table 1 FSR rows and the four mirror rows (side conflict); auth2019 Table 2
# power rows (per-point Fig. 2(a) readings).
components:
  cmp_lit_duprez2016_sgdbr_laser_1:
    notes: 'Fab empty: fabrication described in the passive voice (''a 200-mm SOI wafer is processed'', ''the III-V heterostructure was grown'', p.6 Sec. 3; process ''similar to that explained in [4,13]''), authors at CEA-LETI and INL Lyon, no org named (D80b; ferrotti2016 precedent). Acknowledgment: staff thanked for help on device characterization; IRT Nanoelec is a funding program (D80c), not a facility. Sibling design of cmp_lit_duprez2016_sgdbr_laser_2. Parts: mirrors cmp_lit_duprez2016_sgdbr1_right_mirror / _left_mirror, mode transformer cmp_lit_duprez2016_iii_v_si_mode_transformer, output coupler cmp_lit_duprez2016_fiber_grating_coupler. Resistance attributed to over-etched MQWs (n-InP 125 / 100 nm instead of 150 nm), which also explains the high thresholds (p.7). LI curve kinks are mode hops (p.7). Mirror side conflict (D417): Table 1 lists FSR right / left 6 / 7.5 nm (laser 1) and 6 / 6.5 nm (laser 2), consistent through Eq. (1) with its own sampling periods (right 39.7 um, left 31.6 / 36.6 um); the Fig. 7 caption (FSRleft 6 nm / FSRright 7.5 nm), the Fig. 7 arrows (below-background dips labelled ''Right SGDBR peaks'', spaced about 7.5 nm; above-background peaks labelled ''Left SGDBR peaks'', spaced about 6 nm; the 6 nm bracket spans two above-background peaks, the 7.5 nm bracket two dips), the p.7-8 rule (right peaks below, left above the background) and the p.8 text (right mirror 6.5 nm for laser 2 vs 7.5 nm for laser 1) all assign the sides the other way round. Values entered as printed: Table 1 FSRs under the Table 1 side names, Fig. 7 spacings under the figure''s side names; mirror rows named by the Table 1 columns. Not entered: 0.8 nm-spaced set points across 1300-1330 nm at 130 mA (Fig. 9, a demonstration of set points, not a channel plan).'
    why: 'render p.8 Fig. 7: the ''6 nm'' bracket spans above-background peaks (the comb the arrows and the p.7-8 text call left) and the ''7.5 nm'' bracket spans the dips labelled ''Right SGDBR peaks''; Fig. 7 agrees with the caption and p.8 text, not with Table 1, so the note''s claim that Fig. 7 matches Table 1 is wrong'
