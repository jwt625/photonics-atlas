    notes: "Printed 1.1 +/- 0.1 dB/cm ('bending loss', p.6; Fig. 4(e) label). The paper does not print the formula; the value matches slope + intercept / (2 pi R) of the Fig. 4(e) fit (intercept about 0.045 dB), not the intercept alone. Basis author_estimate as the straight rows (coupling regime of the Lorentzian fits not stated, D403)."
