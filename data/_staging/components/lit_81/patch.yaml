components:
  cmp_lit_wu2018_n3_fig8b:
    notes: 'Standing-wave filter of 3 Sagnac loop reflectors = 2 cascaded Fabry-Perot cavities (p.2); class resonator.photonic_crystal per the registry definition
      (Fabry-Perot cavity). Fit coupler field transmission [t] = [0.882, 0.783, 0.882] (Table II, p.11); field coefficients, no registry parameter. Nominal Ls = 129.66
      um and L = 100 um for Sec. II calculations (p.5). First-person fabrication statement (p.9 Sec. III), all authors at one centre of Swinburne University of Technology
      (D399). Melbourne Centre for Nanofabrication acknowledged for device fabrication support and Swinburne Nano Lab for characterisation (p.13): neither in the
      registry, see report. Printed L2 differs: 295.33 um in the Fig. 8(b) caption and p.11-12 text, 259.33 um in Table II (not resolved). L1'' = L1 - Lc1 - Lc2 =
      0 um; loop of SLR1 rotated to the bottom side of SLR2 (p.12). Audit arithmetic: 2 x 129.66 um = 259.32 um fits the L2 = m Ls1 family of Fig. 3(c) (p.6), and
      effective cavities Ls1 + Ls2 = 259.3 um and Ls2 + 2 L2 + Ls3 = 778 um (ratio 3.0) fit the repeating three-peak period of Fig. 8(b); 295.33 um would give ratio
      3.28.'
    why: Printed L2 conflict confirmed on the page (p.11 Fig. 8 caption and text 295.33 um; p.11 Table II 259.33 um); audit arithmetic added, still unresolved by
      the paper
  cmp_lit_wang2016a_swg_dc_50_50:
    notes: 'Fabricated by the Washington Nanofabrication Facility, University of Washington (p.9): facility not in the registry, fab org left empty, see report. MZI
      test structure with two identical couplers, 250 um arm difference (p.7). SWG fill factor 0.28, NG = 47, SWG extension t = 500 nm, Bragg wavelength about 1425
      nm (p.5-8; no registry parameter on splitter for fill factor, grating periods or extension). Waveguide width w of the SWG coupler not stated. Gap 40 nm above
      the design value to offset the thin Si layer (p.8). Reference cmp_lit_wang2016a_swg_dc_50_50_design is the 220 nm design. Printed imbalance of +/-0.7 dB over
      100 nm (p.8) is the per-port deviation around -3 dB (Fig. 10(b)), not a port ratio: not entered as imbalance_db (D401), pending split_deviation_db.'
    why: 'D401: record the removed printed value (p.8 Sec. 3; p.8 Fig. 10(b))'
  cmp_lit_wang2016a_swg_dc_50_50_design:
    notes: 'Simulated design (full-structure FDTD), fabricated with a larger gap on thinner Si as cmp_lit_wang2016a_swg_dc_50_50. SWG fill factor 0.28, NG = 47, SWG
      extension t = 500 nm, Bragg wavelength about 1425 nm (p.5-8; no registry parameter on splitter for fill factor, grating periods or extension). Waveguide width
      w of the SWG coupler not stated. IL vs fill factor (Fig. 8, 0.20-0.30): other fill factors not entered (design sweep). Printed imbalance of +/-0.55 dB over
      100 nm (p.6) is the per-port deviation around -3 dB (Fig. 7(a)), not a port ratio: not entered as imbalance_db (D401), pending split_deviation_db.'
    why: 'D401: record the removed printed value (p.6 Sec. 2; p.6 Fig. 7(a))'
