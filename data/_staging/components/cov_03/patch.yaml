      the ''MRSEC Control Facilities of Northwestern University'' (name as printed, p.1 footnote): facility not in the registry,
      not entered. Process (p.1 Sec. II): EBL in 250 nm PMMA, 400 nm SiO2 mask, ICP Cl2:Ar (2:3) at 250 C, etch depth about
      3 um. Excess loss in Fig. 2 is normalized to the total output at the 1.55 um optimum wavelength (p.2), so no absolute
      excess loss is reported. TE-TM excess-loss difference below 1 dB for most lengths (Fig. 3, MMI3), not entered (not a
      PDL value of one device). S-bend loss estimated below 0.05 dB (p.2), not entered (no S-bend component data). Calculated
      lengths (Table I): 48.23 um TE, 48.04 um TM; measured optimum lengths 49.0 um TE and about 48.5 um TM (p.2). Length
      tolerance about 8 um and width tolerance about 0.26 um for +/-0.5 dB imbalance (p.3), no registry parameter.'
