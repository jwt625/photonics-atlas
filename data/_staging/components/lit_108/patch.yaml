# Audit patch lit_108 (fresh-context audit 2026-11-08, DevLog/audits/2026-11-08-lit_108-audit.md).
# 74 metrics: 72 ok / 2 imprecise / 0 wrong; 18 components: 14 ok / 4 imprecise / 0 wrong, 0 deleted; 8 misses added (8 metrics).
# Coordinator rulings open: to skip the yang2026a stack-geometry misses drop the six core / box / cladding add_metrics (Q1);
# to skip the shen2016 figure-read misses drop m17 / m18 (Q2). All other ops are a figure re-read, a note / locator fix and
# a fab-note wording fix (fab stays empty).
components:
  cmp_lit_shen2016_utc_pd_3x10:
    notes: 'Headline device. Not entered: 40 / 54 Gb/s open eyes at -4 V (no parameter); model estimates of transit-limited 123 / 85 GHz and RC-limited about 145 GHz bandwidth (p.4, assumed velocities and 100 ohm); n-contact loss coefficients of the authors'' earlier work (ref. 23: 0.93 / 2.91 / 0.56 dB/um) and the 2.5 um p-contact spacing from ref. 21 (rule 3); 6 dB ''typical'' fiber-to-PD loss used to set the LCA input (assumed, p.9). Fab: fabrication described in passive voice (p.5 Sec. 2, Fig. 2); every author lists Eindhoven University of Technology (one also Ghent University-IMEC, p.1), but no sentence names who fabricated the chip (passive wording only), so fab empty (Contract v4 / v7: passive ''fabricated'' and a shared affiliation are not enough; ma2021 IMOS precedent). Facility: ''Nanolab at TU/e'' (printed with an at sign) acknowledged for the use of the cleanroom facilities (p.12). No process / MPW name printed (IMOS = platform). Double-sided processing: p-side processed before BCB bonding, n-side after substrate removal.'
    why: 'p.1 affiliations: one author lists TU/e (1) and Ghent University-IMEC (3), the others TU/e, so all authors share TU/e; the note''s ''not one org'' reason is wrong. Fab stays empty for the passive fabrication wording (p.3, p.5 Sec. 2), as the ma2021 IMOS rows'
  cmp_lit_shen2016_utc_pd_3x5:
    notes: 'Shorter sibling design on the same chip; only the capacitance is stated. Fab: fabrication described in passive voice (p.5 Sec. 2, Fig. 2); every author lists Eindhoven University of Technology (one also Ghent University-IMEC, p.1), but no sentence names who fabricated the chip (passive wording only), so fab empty (Contract v4 / v7: passive ''fabricated'' and a shared affiliation are not enough; ma2021 IMOS precedent). Facility: ''Nanolab at TU/e'' (printed with an at sign) acknowledged for the use of the cleanroom facilities (p.12). No process / MPW name printed (IMOS = platform). Double-sided processing: p-side processed before BCB bonding, n-side after substrate removal.'
    why: 'p.1 affiliations: one author lists TU/e (1) and Ghent University-IMEC (3), the others TU/e, so all authors share TU/e; the note''s ''not one org'' reason is wrong. Fab stays empty for the passive fabrication wording (p.3, p.5 Sec. 2), as the ma2021 IMOS rows'
  cmp_lit_shen2016_utc_pd_3um_family:
    notes: 'Population row (D165) for a statement over ''most 3 um wide PDs''; Rs scatters strongly (no on-chip 50 ohm termination). 5 um wide PDs usually larger Rs (p.10). Responsivity vs length (Fig. 3(b), saturates at 10 um) and Cj vs area (Fig. 6(d)) plotted only. Fab: fabrication described in passive voice (p.5 Sec. 2, Fig. 2); every author lists Eindhoven University of Technology (one also Ghent University-IMEC, p.1), but no sentence names who fabricated the chip (passive wording only), so fab empty (Contract v4 / v7: passive ''fabricated'' and a shared affiliation are not enough; ma2021 IMOS precedent). Facility: ''Nanolab at TU/e'' (printed with an at sign) acknowledged for the use of the cleanroom facilities (p.12). No process / MPW name printed (IMOS = platform). Double-sided processing: p-side processed before BCB bonding, n-side after substrate removal.'
    why: 'p.1 affiliations: one author lists TU/e (1) and Ghent University-IMEC (3), the others TU/e, so all authors share TU/e; the note''s ''not one org'' reason is wrong. Fab stays empty for the passive fabrication wording (p.3, p.5 Sec. 2), as the ma2021 IMOS rows'
  cmp_lit_shen2016_ncontact_wg:
    notes: 'Testing waveguides on the PD chip used to evaluate the n-contact loss that limits the PD responsivity (p.6); method from the authors'' earlier work (ref. 23). Fab: fabrication described in passive voice (p.5 Sec. 2, Fig. 2); every author lists Eindhoven University of Technology (one also Ghent University-IMEC, p.1), but no sentence names who fabricated the chip (passive wording only), so fab empty (Contract v4 / v7: passive ''fabricated'' and a shared affiliation are not enough; ma2021 IMOS precedent). Facility: ''Nanolab at TU/e'' (printed with an at sign) acknowledged for the use of the cleanroom facilities (p.12). No process / MPW name printed (IMOS = platform). Double-sided processing: p-side processed before BCB bonding, n-side after substrate removal.'
    why: 'p.1 affiliations: one author lists TU/e (1) and Ghent University-IMEC (3), the others TU/e, so all authors share TU/e; the note''s ''not one org'' reason is wrong. Fab stays empty for the passive fabrication wording (p.3, p.5 Sec. 2), as the ma2021 IMOS rows'
metrics:
  cmp_lit_salamin2018_pd_l3_s160-m3:
    value: 130
    notes: 'Black (dark) curve of Fig. 3(a) read on the log axis (decade ticks 1e-4 to 1e-1 uA, about 144 px per decade at 400 dpi): about 0.13 uA at +1 V and about 0.11 uA at -1 V (+/- 0.01 uA).'
    why: 'p.10 Fig. 3(a) re-read at 400 dpi: the dark trace sits about 0.11 decade above the 1e-1 uA tick at +1 V (0.13 uA) and 0.05 decade above it at -1 V (0.11 uA); 100 nA lies at the edge of the stated 0.08-0.13 uA reading'
  cmp_lit_shen2016_utc_pd_3x10-m7:
    locator: p.9 Sec. 3.2; p.9 Fig. 5
    notes: printed 'after -3 V it reaches about 67 GHz'. Fig. 5 shows five traces (0 to -4 V; only 0 / -2 / -4 V labelled); the unlabelled purple trace between the -2 V and -4 V traces (the -3 V curve by colour order and the bias arrow) has noise dips below -3 dB from about 49 GHz and a 2-GHz running mean that reaches -3 dB at about 67 GHz (vector paths).
    why: The batch note says the -3 V curve is not plotted; p.9 Fig. 5 (vector art) has five traces, and the unlabelled fourth trace is consistent with the printed value
