- metric_id: cmp_lit_shen2016_utc_pd_3x10-m17
  component_id: cmp_lit_shen2016_utc_pd_3x10
  parameter: responsivity_a_per_w
  value: 0.5
  value_max: 0.815
  unit: A/W
  statistic: range
  wavelength_nm: 1510
  wavelength_max_nm: 1590
  bias_v: -4
  ref_plane: on_chip
  condition: responsivity spectrum of the 3 x 10 um2 PD at -4 V; fiber-to-waveguide coupling calibrated out with nearby reference waveguides
  basis: extracted_from_figure
  locator: p.7 Fig. 3(a)
  notes: 'Read from the vector path of Fig. 3(a) (tick-calibrated, +/- 0.005 A/W): 0.815 A/W at 1510 nm (shortest wavelength, maximum), about 0.77 at 1530, 0.70 at 1550, minimum 0.50 at about 1585 nm, 0.51 at 1590 nm; C-band minimum 0.61 at about 1564 nm (matches m2). Rising responsivity at shorter wavelength discussed on p.7.'
  why: Miss. p.7 Fig. 3(a) is vector art; the measured spectrum spans 1510-1590 nm and its end values are not in the batch (only 0.7 A/W at 1550 nm and > 0.6 A/W over the C band)
