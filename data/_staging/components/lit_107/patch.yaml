# Audit patch lit_107 (fresh-context audit 2026-11-08, DevLog/audits/2026-11-08-lit_107-audit.md).
# 144 metrics: 137 ok / 7 imprecise / 0 wrong; 22 components: 12 ok / 10 imprecise / 0 wrong, 0 deleted; 3 misses added (3 metrics).
# Coordinator rulings open: to keep the defaulted platforms (kanazawa2016 inp, trappen2020 imec soi) drop the platform fields of those
# 3 component ops (Q1). All other ops are basis / condition fixes (D256a), a cited-process note (Contract v7), label wording and figure-read misses.
components:
  cmp_lit_kanazawa2016_dml_array_tosa:
    platform: ''
    notes: 'Fab: p.2 Sec. 2 states that Fig. 1 shows the array chip the authors fabricated, all authors at NTT (D399, D429 kazama2021 precedent); the p.2 Sec. 1 ''we fabricated'' sentence cites the authors'' earlier reports [12,13] and is not the basis (D399). org_ntt for the pre-2025 NTT Corporation. Platform empty: the paper names InGaAlAs compressive-strain MQWs but never states the substrate or InP (D422, D423; Contract v7). Quarter-wave-shifted gratings, both facets AR coated (p.2). Chip 2.0 x 2.4 mm with a comb-like GND pad wire-bonded to the subcarrier to cut electrical crosstalk (p.2). TOSA (lens, isolator, FPC, K-connector fixture) 14.3 x 7.2 x 6.5 mm (p.4). All TOSA measurements at 55 C chip temperature (p.4). The 4x1 MMI MUX has no stated performance, so no separate row. Not entered (no parameter on laser): measured electrical crosstalk about -20 dB at 16 GHz between adjacent lanes incl. package, FPC and fixture (p.5 Figs. 9-10; background about -30 dB), dynamic extinction ratio > 4 dB (p.6), thermal wavelength shift up to 0.3 nm under simultaneous operation (p.6). Refs. [12,13] are the authors'' earlier reports of the array chip / TOSA; the values here are this paper''s own TOSA measurements.'
    why: 'p.2 Sec. 1: the intro fabrication sentence carries refs. [12,13] (authors'' earlier reports), so the fab basis is the p.2 Sec. 2 first-person sentence about Fig. 1 (D399); fab org_ntt unchanged. Text grep: no InP or substrate statement anywhere, only InGaAlAs MQWs (p.2 Sec. 2), so platform inp is a default (D422 / D423, Contract v7). Audit Q1'
  cmp_lit_trappen2020_imec_sip_waveguide:
    platform: ''
    notes: 'Test chips fabricated on the standard silicon photonics platform of imec (p.8). Loss extracted from measured reference structures and used to de-embed the probe losses. Platform empty: the paper names the standard imec silicon photonics platform but never states SOI, a buried oxide or the layer stack (D422, D423; Contract v7).'
    why: p.8 Sec. 4 names only the standard silicon photonics platform of imec; SOI appears only generically (p.1 introduction on grating couplers, one reference title). Platform soi is a default (D422 / D423, Contract v7). Audit Q1
  cmp_lit_trappen2020_imec_sip_edge_coupler:
    platform: ''
    notes: 'Test chips fabricated on the standard silicon photonics platform of imec (p.8). Coupling losses to these couplers are on the probe_sip row. Platform empty: the paper names the standard imec silicon photonics platform but never states SOI, a buried oxide or the layer stack (D422, D423; Contract v7).'
    why: p.8 Sec. 4 names only the standard silicon photonics platform of imec; SOI appears only generically (p.1 introduction on grating couplers, one reference title). Platform soi is a default (D422 / D423, Contract v7). Audit Q1
  cmp_lit_trappen2020_probe_triplex:
    label: 3D-printed TIR-mirror + aspheric-lens probe on SMF for TriPleX Si3N4 edge facets (target MFD 10 um), working distance f = 40 um
    why: 'p.3-5 Sec. 2, Fig. 1(b) inset: the paper''s f is the working distance from the lens apex to the chip facet, not a focal length; label disambiguated'
  cmp_lit_trappen2020_probe_inp:
    label: 3D-printed TIR-mirror + aspheric-lens probe on SMF for InP BH DFB laser facets (target MFD 3 um), working distance f = 20 um
    why: 'p.3-5 Sec. 2, Fig. 1(b) inset: the paper''s f is the working distance from the lens apex to the chip facet, not a focal length; label disambiguated'
  cmp_lit_trappen2020_probe_sip:
    label: 3D-printed TIR-mirror + aspheric-lens probe on SMF for imec SiP edge couplers (target MFD 2.5 um), working distance f = 25 um
    why: 'p.3-5 Sec. 2, Fig. 1(b) inset: the paper''s f is the working distance from the lens apex to the chip facet, not a focal length; label disambiguated'
  cmp_lit_luquegonzalez2019_swg_grin_ssc_nominal:
    process_name: (Applied Nanotools NanoSOI process cited, ref. [27])
    notes: 'Fab: ''fabricated in a 220 nm thick SOI platform'' (p.4 Sec. 4) citing ref. [27], the NanoSOI fabrication process of Applied Nanotools Inc. (p.7 reference list); a cited process with no fabrication statement naming an org, so fab stays empty and the process goes to process_name (D433, Contract v7). The p.4 BOX / cladding thicknesses carry the same citation (foundry stack, design_target, D402). Authors at Universidad de Malaga and NRC Canada. Garbled text layer flagged on p.7 (references only); values from the clean pages 1-6. Same-layer (single Si layer) spot-size converter, classed waveguide_platform.other (D417 xiao2022 precedent). TE. Measured IL band limited by the 1.51-1.64 um setup; simulation predicts IL < 1 dB over more than 300 nm (to beyond 1.8 um). Feeding a back-to-back grating-coupler pair: behaves like a 150 um linear taper (normalized curves only, Fig. 6(b)); back-reflection 14 % from the lens-grating index mismatch (p.6; no parameter on this class). Table 2 lists L = 15 um and NER 2.90 for this work vs 14 um in the text.'
    why: 'p.4 Sec. 4 fabrication sentence cites ref. [27], which p.7 lists as the NanoSOI fabrication process of Applied Nanotools Inc.; Contract v7: a process only cited goes into process_name as a cited-process note with fab empty. The batch notes did not name the process'
