  cmp_lit_luquegonzalez2019_linear_taper_150um:
    process_name: (Applied Nanotools NanoSOI process cited, ref. [27])
    notes: 'Fab: ''fabricated in a 220 nm thick SOI platform'' (p.4 Sec. 4) citing ref. [27], the NanoSOI fabrication process of Applied Nanotools Inc. (p.7 reference list); a cited process with no fabrication statement naming an org, so fab stays empty and the process goes to process_name (D433, Contract v7). The p.4 BOX / cladding thicknesses carry the same citation (foundry stack, design_target, D402). Authors at Universidad de Malaga and NRC Canada. Garbled text layer flagged on p.7 (references only); values from the clean pages 1-6. Same-layer (single Si layer) spot-size converter, classed waveguide_platform.other (D417 xiao2022 precedent). Reference structure on the same chips; end width not printed beyond the comparison with the 15 um converter (p.4, p.6).'
