    notes: 'Fig. 1(c) label Q0 = 2.7 x 10^6, restated p.9; the extraction is not described. The regime comes from the paper''s own data: Fig. 1(b) dip visibility at 1970 nm rises monotonically with the nominal gap (audit read about 0.23 / 0.26 / 0.53 / 0.78 for 400 / 500 / 600 / 700 nm), so all four rings including this one are over-coupled (p.3); p.9 calls the coupling Q ''found experimentally''. Q0 from the loaded Q and the dip depth (Fig. 1(c) minimum about 0.23) with the data-fixed regime: derived (D403, D465, D520), not a direct reading.'
    why: 'D403: q_intrinsic is never a direct measurement; with the regime determined from the data (p.3 Fig. 1(b) gap series that includes this ring) it is derived, not measured (audit Q2)'
  cmp_lit_karunakaran2024_ring_r158_gap700-m7:
    basis: derived
    notes: 'printed intrinsic Q0 = 1.5 x 10^6 (p.4); the extraction is not described. Regime from Fig. 1(b): visibility at 1550 nm falls with the gap (audit read about 0.82 / 0.79 / 0.63 / 0.32 for 400-700 nm), which the paper reads as the under-coupled regime (p.3, worded as ''an indication''); derived (D403). Weaker evidence than the 1970 nm value (m3).'
    why: Same as m3 (D403; p.3 Fig. 1(b) 1550 nm trend); measured is not a basis for an extracted Q0 (audit Q2)
