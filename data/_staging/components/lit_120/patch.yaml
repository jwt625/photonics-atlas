# Audit patch lit_120 (fresh-context audit 2026-11-09, DevLog/audits/2026-11-09-lit_120-audit.md).
# 272 metrics: 242 ok / 22 imprecise / 8 wrong (deleted); 25 components: 18 ok / 7 imprecise / 0 wrong, 0 deleted; 10 misses added.
# Coordinator rulings open: Q1 nie2019 accepted-manuscript identity (no op), Q2 karunakaran2024 q_intrinsic basis (to keep author_estimate
# instead, set m3 / m7 basis author_estimate), Q3 hu2020 family values (to keep them, drop the 8 delete_metrics and the 4 drop-port
# add_metrics, restore the component notes), Q4 lin2023 family bounds (no op).
components:
  cmp_lit_nie2019_gacdc_16stage:
    notes: 'Fab empty: e-beam lithography prototyping is stated (p.1), no fabricating org named (D80b). Cached text is the accepted-manuscript version (title ''High rejection ratio ...'' vs the source row''s ''High extinction ratio ...''; same authors and content). Measured with cleaved 780HP fibers at 10 deg through on-chip grating couplers (no coupler values reported), Ti:sapphire laser, 0.3 nm resolution (p.3). Coupler geometry (p.1-2): Wa = 330 nm and Wb = 585 nm measured from the SEM image; grating width Wg = 320 nm, period 244 nm and duty cycle around 50 % are printed in the next sentence without a measurement statement (period entered design_target); waveguide spacing 750 nm set, grating shifted 80 nm toward waveguide b; mode-solver rib height and slab 150 nm each (p.2). 16 stages of 125 um (Fig. 4(a) legend ''16x125um''), drop ports remove the contra-coupled light between stages. Sibling cascades with 4 / 8 / 10 stages and the single stage of equal length have only Fig. 4(b) values, whose two curves are shifted for visualization: not entered. Self-reflection band (about 772 nm) rejection also rises but is not printed. Stop-band ''bandwidth less than 3 nm'' (p.4) has no stated level: not entered (registry gap). Through-port downshift attributed to 32 mode-transition tapers (simulated 0.15 dB each, about 4.8 dB total, p.4; cmp_lit_nie2019_mode_transition_taper).'
    why: 'p.1-2: the SEM sentence names only Wa and Wb as measured from the SEM image; the grating width, period and duty cycle follow in a separate sentence with no measurement statement, so the notes overstated the SEM-measured set'
  cmp_lit_nie2019_gacdc_single_stage_series:
    notes: 'Fab empty: e-beam lithography prototyping is stated (p.1), no fabricating org named (D80b). Cached text is the accepted-manuscript version (title ''High rejection ratio ...'' vs the source row''s ''High extinction ratio ...''; same authors and content). Measured with cleaved 780HP fibers at 10 deg through on-chip grating couplers (no coupler values reported), Ti:sapphire laser, 0.3 nm resolution (p.3). Coupler geometry (p.1-2): Wa = 330 nm and Wb = 585 nm measured from the SEM image; grating width Wg = 320 nm, period 244 nm and duty cycle around 50 % are printed in the next sentence without a measurement statement (period entered design_target); waveguide spacing 750 nm set, grating shifted 80 nm toward waveguide b; mode-solver rib height and slab 150 nm each (p.2). One row for the length series L = 150, 300, 600, 1000, 2000, 3000 um (D165): the paper states the notch positions and the saturation level for the series, per-length values only in Fig. 3(b) (curves shifted for visualization: not read). A third dip at 769.2 nm is attributed to coupling into a higher-order TM-like mode of waveguide b. Saturation printed as ''around 40 dB'' (p.3) and ''less than 40 dB'' (p.4) (D417).'
    why: 'p.1-2: the SEM sentence names only Wa and Wb as measured from the SEM image; the grating width, period and duty cycle follow in a separate sentence with no measurement statement, so the notes overstated the SEM-measured set'
  cmp_lit_nie2019_mode_transition_taper:
    notes: 'Fab empty: e-beam lithography prototyping is stated (p.1), no fabricating org named (D80b). Cached text is the accepted-manuscript version (title ''High rejection ratio ...'' vs the source row''s ''High extinction ratio ...''; same authors and content). Measured with cleaved 780HP fibers at 10 deg through on-chip grating couplers (no coupler values reported), Ti:sapphire laser, 0.3 nm resolution (p.3). Coupler geometry (p.1-2): Wa = 330 nm and Wb = 585 nm measured from the SEM image; grating width Wg = 320 nm, period 244 nm and duty cycle around 50 % are printed in the next sentence without a measurement statement (period entered design_target); waveguide spacing 750 nm set, grating shifted 80 nm toward waveguide b; mode-solver rib height and slab 150 nm each (p.2). Building block of the cascaded filters (two per stage, 32 in the 16-stage filter, cmp_lit_nie2019_gacdc_16stage). Simulation: 96.6 % of the power stays in waveguide a. The about 4.8 dB for 32 tapers (p.4) is the authors'' multiplication of the simulated value: not entered.'
    why: 'p.1-2: the SEM sentence names only Wa and Wb as measured from the SEM image; the grating width, period and duty cycle follow in a separate sentence with no measurement statement, so the notes overstated the SEM-measured set'
  cmp_lit_hu2020_si_gst_cdc_p370:
    notes: 'Si strip pair: W1 = 370 nm (Si), W2 = 400 nm (GST-loaded, 50 nm inner-sidewall corrugation, 50 % duty), gap 230 nm, H = 220 nm; GST nano-strips 390 x 100 nm, 50 nm thick, period = grating period (p.2); grating length L = 200 um chosen in the FDTD design (p.4). SOI 220 nm on 2 um buried oxide; EBL + ICP etch, second EBL, RF-sputtered GST, lift-off (p.5-6). Fab empty (passive fabrication sentence, D80b); facility: AEMD of SJTU thanked for support in device fabrication (p.9 Acknowledgments). Measured through 70 nm-etched vertical grating couplers, quasi-TE, normalized to a reference straight waveguide (p.6). GST crystallized on a 245 C hot plate for 5 min. Period-series device measured only with amorphous GST (Fig. 6). The through-port 2.5 dB average loss outside the band and the 0.5-1.5 dB drop-port loss (p.6) are stated once for the four devices and do not describe each device (audit read of Fig. 6: drop-port peaks about 1.4 / 0.9 / 0.55 / 0.3 dB for 370 / 374 / 378 / 382 nm; out-of-band through-port level about 1.9-2.5 / 1.7-2.7 / 2.2-4.7 / 3.6-6.1 dB): not entered (D254, D541); each row carries its figure-read drop-port peak. The about 5 nm 3-dB width (p.6) is consistent with each panel of Fig. 6 and stays on each row.'
