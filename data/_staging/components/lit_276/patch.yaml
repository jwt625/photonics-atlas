    notes: 'printed ''saturates near -18 dB''; 100 x 10^(-1.8) = 1.58 %; attributed to the 3 ns free-carrier lifetime (p.5); the saturation sentence prints no pump wavelength: 1554 nm is the pump of the Fig. 2(b) / Fig. 3 discussion it follows (p.4), entered as inferred; Fig. 2(b) (110 mW, 1554 nm pump) reads about -15 to -22 dB over 1560-2078 nm converted wavelength'
