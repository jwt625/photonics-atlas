metrics:
  cmp_lit_zhang2016a_te_gc-m1:
    band: unspecified
    wavelength_inferred: ''
    notes: printed coupling loss per port "at the central wavelengths of the gratings"; the centre wavelength is not printed
      and no band is stated for the gratings; the PBS measurement span 1510-1544 nm (Fig. 4-6 axes) straddles the S and C
      bands, so no band is inferred; how the loss was isolated is not stated
    why: 'p.4-5 Sec. 2: no wavelength or band is printed for the GC loss; rule 8 infers a band only from a stated operating
      band, and the 1510-1544 nm measurement span lies mostly in the S band (c_band was not supported)'
  cmp_lit_zhang2016a_tm_gc-m1:
    band: unspecified
    wavelength_inferred: ''
    notes: printed coupling loss per port "at the central wavelengths of the gratings"; the centre wavelength is not printed
      and no band is stated for the gratings; the PBS measurement span 1510-1544 nm (Fig. 4-6 axes) straddles the S and C
      bands, so no band is inferred; how the loss was isolated is not stated
    why: 'p.4-5 Sec. 2: no wavelength or band is printed for the GC loss; rule 8 infers a band only from a stated operating
      band, and the 1510-1544 nm measurement span lies mostly in the S band (c_band was not supported)'
  cmp_lit_zafar2018_design_a-m6:
    condition: TE loss per polarizer from 20-cascade test structures vs. mean of 4 identical straight reference waveguides;
      TM loss per polarizer (test structure not stated; the 20-cascade is described for the insertion loss only); lensed-fiber
      edge coupling through inverse-taper SSCs; tunable laser 1.5-1.6 um; ER = TM loss minus TE loss
    why: 'p.7 Sec. 4: the 20 cascaded polarizers are used "to get a reliable measurement of the insertion loss" (TE); Table
      1 TM losses of 28-45 dB per polarizer cannot come from a 20-cascade (hundreds of dB), so the ER condition no longer
      implies the TM leg was cascaded'
  cmp_lit_zafar2018_design_c-m6:
    condition: TE loss per polarizer from 20-cascade test structures vs. mean of 4 identical straight reference waveguides;
      TM loss per polarizer (test structure not stated; the 20-cascade is described for the insertion loss only); lensed-fiber
      edge coupling through inverse-taper SSCs; tunable laser 1.5-1.6 um; ER = TM loss minus TE loss
    why: 'p.7 Sec. 4: the 20 cascaded polarizers are used "to get a reliable measurement of the insertion loss" (TE); Table
      1 TM losses of 28-45 dB per polarizer cannot come from a 20-cascade (hundreds of dB), so the ER condition no longer
      implies the TM leg was cascaded'
  cmp_lit_zafar2018_design_c-m7:
    condition: TE loss per polarizer from 20-cascade test structures vs. mean of 4 identical straight reference waveguides;
      TM loss per polarizer (test structure not stated; the 20-cascade is described for the insertion loss only); lensed-fiber
      edge coupling through inverse-taper SSCs; tunable laser 1.5-1.6 um; ER = TM loss minus TE loss
    why: 'p.7 Sec. 4: the 20 cascaded polarizers are used "to get a reliable measurement of the insertion loss" (TE); Table
      1 TM losses of 28-45 dB per polarizer cannot come from a 20-cascade (hundreds of dB), so the ER condition no longer
      implies the TM leg was cascaded'
  cmp_lit_zafar2018_const_r2_n8-m2:
    qualifier: ge
    notes: 'printed "to achieve 30 dB extinction" with this number of bends; the design criterion is an ER of at least 30
      dB over the band (p.5 Sec. 3); Fig. 5(a) check: the N 8 curve stays above about 33 dB over 1.5-1.6 um (+/-1 dB reading)'
    why: 'p.5 / p.7 Sec. 3: 30 dB is the stated minimum-ER target, not an approximate value; Fig. 5(a) confirms the bound
      (ge, rule 7)'
  cmp_lit_zafar2018_const_r3_n10-m2:
    qualifier: ge
    notes: 'printed "to achieve 30 dB extinction" with this number of bends; the design criterion is an ER of at least 30
      dB over the band (p.5 Sec. 3); Fig. 5(b) check: the N 10 curve stays above about 33 dB from 1.53 to 1.6 um and falls
      to about 23 dB near 1.52 um (+/-1 dB reading)'
    why: 'p.5 / p.7 Sec. 3: 30 dB is the stated minimum-ER target, not an approximate value; Fig. 5(b) confirms the bound
      (ge, rule 7)'
  cmp_lit_wu2022a_tm_pass_coupled_nanowire_polarizer-m11:
    notes: printed L2 ~6.825 um for N2 = 20 (p.7); the p.5 rule L2 = N2 x period + a2 gives 7.175 um for N2 = 20 (and the
      printed 6.475 um for N2 = 18), so 6.825 um corresponds to N2 = 19; the printed total 13.6 um = 2 x 3.4 + 6.825 um matches
      the printed L2; kept as printed (approx)
    why: 'note supplement (row ok): conflict between the printed L2 and the p.5 length rule'
add_metrics:
- metric_id: cmp_lit_zafar2018_r1_n8_t30-m9
  component_id: cmp_lit_zafar2018_r1_n8_t30
  parameter: per_db
  value: '27'
  unit: dB
  statistic: mean
  wavelength_nm: '1500'
  wavelength_max_nm: '1600'
  condition: TE loss per polarizer from 20-cascade test structures vs. mean of 4 identical straight reference waveguides;
    TM loss per polarizer (test structure not stated; the 20-cascade is described for the insertion loss only); lensed-fiber
    edge coupling through inverse-taper SSCs; tunable laser 1.5-1.6 um; ER = TM loss minus TE loss
  basis: derived
  locator: p.8 Table 1 (Fig. 7(a)); p.9 Sec. 4
  notes: mean ER = Table 1 measured average TM loss 28.3 dB minus average TE loss 1.30 dB over 1.5-1.6 um (both averaged in
    dB; the same arithmetic reproduces the printed design C average 36.0 dB = 36.1 - 0.12); p.9 reads Table 1 as giving the
    measured average extinction ratios
  why: 'miss (audit judgment c): p.9 Sec. 4 states that Table 1 gives the measured peak and average ERs and the paper''s own
    design C average (36.0 dB, abstract) equals avg TM - avg TE; the mean ER is exact arithmetic on printed own measurements
    (rule 4 derived, D80a); minima are not derivable (min TM and max TE fall at different wavelengths)'
