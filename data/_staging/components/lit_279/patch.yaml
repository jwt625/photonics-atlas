# Audit patch lit_279 (fresh-context audit 2026-11-25, DevLog/audits/2026-11-25-lit_279-audit.md).
# 155 metrics: 148 ok / 7 imprecise / 0 wrong; 22 components: 16 ok / 6 notes updated (2 imprecise, 4 follow added rows).
# 6 misses added: zafar2018 measured mean ER (derived, Table 1) on the three theta siblings and design A; wu2022a trident
# splitter n_inputs / n_outputs. After the patch: 22 components, 161 metrics.
# Fixes: zhang2016a GC loss band unspecified (no band stated; span 1510-1544 nm is mostly S band); zafar2018 measured ER
# condition no longer implies a cascaded TM leg; zafar2018 constant-radius 30 dB ER targets ge (not approx).
# Note supplement (row ok): wu2022a L2 6.825 um vs the p.5 length rule.
components:
  cmp_lit_zhang2016a_te_gc:
    notes: 'Facility AEMD: authors thank the Center for Advanced Electronic Materials and Devices for support in device fabrication
      (p.8 Acknowledgments). Fab empty: fabrication described with passive verbs (EBL on ZEP520A, ICP etch with SF6 / C4F8,
      p.4) and no org named (D80b; hu2020 precedent). I/O coupler of the PBS test structures (p.4-5). Fill factor printed
      50 % without a definition (D253, kept as printed). The ''central wavelength'' of the grating is not printed; band left
      unspecified (the 1510-1544 nm measurement span straddles the S and C bands). Sentence before the values cites ref. [26]
