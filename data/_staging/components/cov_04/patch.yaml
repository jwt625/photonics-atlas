# Audit patch cov_04 (fresh-context audit 2026-11-07, DevLog/audits/2026-11-07-cov_04-audit.md).
# 106 metrics: 103 ok / 3 imprecise / 0 wrong; 18 components: 18 ok / 0 imprecise / 0 wrong (1 notes update follows Q1).
# Misses added: 14 metrics (gatkine2022 1, hu2021b 3, li2019 2, shim2026 8). No fab / facility org change.
# Coordinator choices: Q1 (shim2026 Supp. Sec. 7 Q values on the Device B row): to keep the distiller's D159 call drop
# add_metrics cmp_lit_shim2026_octagonal_racetrack-m6..-m11 and the components op on cmp_lit_shim2026_octagonal_racetrack.
# Q7 (li2019 e_cavity-m5 unqualified Q -> q_intrinsic): to keep q_loaded drop the metrics op on cmp_lit_li2019_e_cavity-m5.
components:
  cmp_lit_shim2026_octagonal_racetrack:
    notes: 'Fab: first-person fabrication (we also fabricated ..., p.4; Appendix A-1, p.7), but authors span Harvard and KAIST and no sentence names the fabricating site: fab empty (D80b, D395). No acknowledgment of a facility in the cached text. Coupler: straight section L_c 51.6 um, gap 800 nm, Bezier S-bends (dy 10 um over dx 50 um), designed near critical coupling from the measured waveguide loss (Supp. Sec. 5). Supp. Sec. 7 (p.21) and Fig. S11 (p.22) report loaded Q, ER and Q_i = 2 Q_L for the fabricated racetrack resonators without naming Device A or B; entered here (m6-m11, D458: D159 needs two candidate rows, and Device A has no row: it serves the thermoreflectance study, Supp. Sec. 6, while the optical TO measurements and the coupler design for the 7.1 mm round trip are Device B, p.5 and Supp. Sec. 5). FSR fitted as a linear function of wavelength (Supp. Sec. 8), no single value.'
    why: 'Q1 ruling: the Supp. Sec. 7 Q values go on the only racetrack row (D458 precedent); notes updated to match the added m6-m11'
metrics:
  cmp_lit_hu2021b_two_ring_12g5-m1:
    notes: 'Doublet splitting set by the coupling gap; pump wavelength 1601.3 nm from p.8 and p.11 (p.3 prints 1601.2 nm for the same up-shift experiment; printed conflict, D417).'
    why: 'Imprecise note: p.3 prints 1,601.2 nm for the Fig. 2(b) pump, p.8 Methods and p.11 print 1,601.3 nm; conflict recorded'
  cmp_lit_li2019_e_cavity-m5:
    parameter: q_intrinsic
    basis: author_estimate
    method: ring_extraction
    notes: 'Text: experimentally recorded optical Q above 1.5e5 for line-defect widths 1.10-1.33 um, peak at w = 1.27 um (p.3). The paper uses optical Q for the fitted intrinsic Q0: the abstract and p.6 quote optical Q up to 3.51e5, which is the Fig. 3(d) Q0 label, and the highest Fig. 3(e) points (about 3.3e5) match the Fig. 3(c) Q0 = 3.34e5; entered as q_intrinsic, author_estimate (fit model and coupling regime not described, D403). Several Fig. 3(e) points read about 1.25-1.45e5 on the right axis (1.0-3.5e5), so the printed bound conflicts in part with the figure (D417). Wavelength not stated.'
    why: 'Imprecise parameter: in this paper optical Q means the fitted intrinsic Q0 (abstract 3.51e5 = Fig. 3(d) Q0; Fig. 3(e) maxima = Fig. 3(c) Q0), so the unqualified-Q default to q_loaded does not fit (p.1, p.3, p.4 Fig. 3(c)-(e)); Q7'
  cmp_lit_shim2026_nicr_heater-m18:
    condition: 'lateral edge-to-edge gap in the film plane between the rib top edge and the NiCr heater on the slab (G_h, Fig. 2(b))'
    why: 'Imprecise condition: G_h is the lateral gap beside the rib (p.11 Fig. 2(b), (e), (f)); heater_offset_um defines heater_gap_um as the vertical distance by default, so the lateral meaning must be in condition (merged practice, maeder2022 / campenhout2010)'
add_metrics:
- metric_id: cmp_lit_gatkine2022_inverse_taper-m3
  component_id: cmp_lit_gatkine2022_inverse_taper
  parameter: insertion_loss_db
  value: 2.75
  unit: dB
  wavelength_nm: 1450
  wavelength_max_nm: 1550
  wavelength_inferred: 'true'
  scope: per_facet
  condition: SMF28 butt-coupled, in and out facets of the AWG throughput measurement
  method: cutback
  basis: derived
  locator: p.6 Sec. 5; p.7 Fig. 6; p.5 Fig. 4
  notes: 'Printed as coupling losses accounting for 5.5 dB of the overall transmission (two facets); 5.5 / 2 = 2.75 dB per facet. Wavelength not stated with the value: taken as the 1450-1550 nm band of the Fig. 6 peak it is subtracted from (as awg-m4); the Fig. 4 cutback curve reads about 2.7 dB per facet near 1500 nm, consistent.'
  why: 'Miss: a stated coupling loss for a band other than the 1550-1650 nm of m1 (p.6 Sec. 5, p.7 Fig. 6 caption); halving -> derived'
