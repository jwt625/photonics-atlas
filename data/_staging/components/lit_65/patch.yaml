# Audit patch lit_65 (fresh-context audit 2026-11-02, DevLog/audits/2026-11-02-lit_65-audit.md).
# 200 metrics: 177 ok / 23 imprecise / 0 wrong; 35 components: 31 ok / 4 wrong (KNMF facility, D83e), 0 deleted;
# misses: 11 metrics added (D153 stack geometry on the yoo2022 splitters, stated pitches, blaicher2020 fiber-side PWB).
# Coordinator decision open: theurer2019 calibration family (audit Q1), patched to the strict reading of skill rule 4.
components:
  cmp_lit_blaicher2020_pwb_bridge_test:
    facility_org_ids: ''
    notes: 'Fab: M.B. designed and fabricated these samples (author contributions, p.11; KIT): fab KIT (D395). KNMF appears only in the funding list (p.10): not a facility (D83e / D80c; lindenmann2012, billah2018 precedent). Same-chip test bridge stays chip_chip per lindenmann2012 (D422). Fully automated, about 30 s per PWB (p.4). Temperature cycling -40 to 85 C: no degradation after 225 cycles (p.4 Fig. 2(b)); earlier samples 600 cycles and damp-heat 85 C / 85 % RH above 3000 h (p.4-5). Five PWB bridges survived until the Si waveguides failed at about 19 dBm on-chip (p.5; power handling not allowed for this class, registry gap). Pitch 25 um and bend radius 35 um: no parameter for this class. 0.4 dB of ref. 17 and 1300-1600 nm of ref. 16 are cited: not entered.'
    why: p.10 lists KNMF among the grant and program supporters, no statement of use or fabrication there; D83e / D80c funding-only rule; merged lindenmann2012, billah2018 and dietrich2018 rows have the same acknowledgement wording and facility empty (lit_52 audit, lit_16 audit)
  cmp_lit_blaicher2020_pwb_imdd_pair:
    facility_org_ids: ''
    notes: 'Fab: IM/DD module jointly fabricated by M.R.B., T.H. and M.B. (author contributions, p.11; all KIT, D395). KNMF appears only in the funding list (p.10): not a facility (D83e / D80c; lindenmann2012, billah2018 precedent). Over-etched oxide opening of the module SiP wafer left Si tapers with tips of about 200 nm instead of 130 nm (p.9). Paper reports one per-PWB average for each cascaded pair, so laser-side and fiber-side PWBs are one row. Journal paper extending the authors'' conference reports (D408: values kept).'
    why: p.10 lists KNMF among the grant and program supporters, no statement of use or fabrication there; D83e / D80c funding-only rule; merged lindenmann2012, billah2018 and dietrich2018 rows have the same acknowledgement wording and facility empty (lit_52 audit, lit_16 audit)
  cmp_lit_blaicher2020_pwb_hcsel_coherent:
    facility_org_ids: ''
    notes: 'Fab: coherent module fabricated by M.R.B. with T.H. and M.B. (author contributions, p.11; all KIT). KNMF appears only in the funding list (p.10): not a facility (D83e / D80c; lindenmann2012, billah2018 precedent). Over-etched oxide opening of the module SiP wafer left Si tapers with tips of about 200 nm instead of 130 nm (p.9). Channel 1 HCSEL-side PWB impaired by a dirt particle (p.8).'
    why: p.10 lists KNMF among the grant and program supporters, no statement of use or fabrication there; D83e / D80c funding-only rule; merged lindenmann2012, billah2018 and dietrich2018 rows have the same acknowledgement wording and facility empty (lit_52 audit, lit_16 audit)
  cmp_lit_blaicher2020_pwb_fiber_coherent:
    facility_org_ids: ''
    notes: 'Fab: coherent module fabricated by M.R.B. with T.H. and M.B. (author contributions, p.11; all KIT). KNMF appears only in the funding list (p.10): not a facility (D83e / D80c; lindenmann2012, billah2018 precedent). Over-etched oxide opening of the module SiP wafer left Si tapers with tips of about 200 nm instead of 130 nm (p.9). PWBs of Fig. 1(c) compensate a 25 um lateral offset (p.3).'
    why: p.10 lists KNMF among the grant and program supporters, no statement of use or fabrication there; D83e / D80c funding-only rule; merged lindenmann2012, billah2018 and dietrich2018 rows have the same acknowledgement wording and facility empty (lit_52 audit, lit_16 audit)
