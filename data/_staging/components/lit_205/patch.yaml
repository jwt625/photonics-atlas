      sentence citing ref. [34] (D80i; not entered). SEM of the interface in Fig. 1(b).'
    why: 'the text layer keeps the minus signs (U+2212: p.1 abstract, p.3 Sec. III-A, p.5 Fig. 6 caption); the old sentence was wrong'
metrics:
  cmp_lit_pfeiffer2018_ring_w2um_wafer6_reflow_bhf-m1:
    notes: 'Printed ''lowest mean linewidths, smaller than 35 MHz''. Lorentzian or doublet lineshape fits over up to 150 resonances per ring, 1500-1630 nm (p.3). Fig. 2(c) wafer-6 markers
      (read from the PDF vector data, log axis calibrated on the 40-100 MHz labels, +/- 1 MHz): 2 um quasi-TM about 34.4 / 36.9 MHz, quasi-TE about 34.1 / 37.4 / 37.9 / 41.0 MHz; 1.5
      um markers 42-55 MHz. ''Lowest mean linewidths'' are the lowest per-ring values (one marker per ring, the per-ring statistic of up to 150 resonances, p.3); only the lowest TE and
      TM 2 um ring each fall below 35 MHz.'
    why: 'p.4 Fig. 2(c) vector data: the printed < 35 MHz is met by the lowest 2 um wafer-6 ring per polarization, not by the wafer average; notes only'
  cmp_lit_pfeiffer2018_ring_w2um_wafer6_reflow_bhf-m3:
    notes: 'Printed ''~5 dB/m'', converted to dB/cm (D256a). alpha = n_eff kappa_0 / c as printed (p.3); n_eff not stated (D76: author_estimate).'
    why: p.3 prints alpha = (n_eff kappa_0)/c, not n_g; basis unchanged
  cmp_lit_pfeiffer2018_ring_w2um_wafer6_reflow_bhf-m4:
    qualifier: approx
    notes: Printed 'radius of ~230 um' (p.3).
    why: p.3 prints 'a radius of ~230 um' (rule 7 approx)
  cmp_lit_pfeiffer2018_ring_w2um_wafer3_reflow-m2:
    qualifier: approx
    notes: Printed 'radius of ~230 um' (p.3).
    why: p.3 prints 'a radius of ~230 um' (rule 7 approx)
  cmp_lit_pfeiffer2018_ring_w2um_wafer3_reflow-m1:
    value: '48'
    notes: 'Peak of the Burr-distribution fit (red arrow) read from the PDF vector data: the fit curve maximum and the arrow tip sit at 48.0 MHz (axis calibrated on the histogram bars,
      centred on 40, 45, ... 100 MHz; +/- 1 MHz). Histogram in 5 MHz bins, 67 resonances (7 + 14 + 14 + 12 + 11 + 3 + 4 + 1 + 1 bars); wavelength range from the measurement span (p.3).
      Fig. 2(c) wafer-3 2 um quasi-TM markers about 43 / 47 MHz (vector data).'
    why: 'p.4 Fig. 2(b) vector data: Burr fit maximum and arrow at 48.0 MHz (bars centred on multiples of 5 MHz), not 47'
  cmp_lit_gundlapalli2022_apd_w200_j300-m17:
    notes: 'Table I prints 8.8 GHz at 18 V. Conflict (D417): in Fig. 6(a) (this device, p.5) the dashed 3-dB roll-off line of the 18 V trace sits at about 8.1 GHz and that of the 20
      V trace at about 8.7 GHz; the Table I value is kept as printed.'
    why: p.5 Fig. 6(a) roll-off markers (18 V about 8.1 GHz, 20 V about 8.7 GHz) disagree with the Table I bias; notes only
  cmp_lit_gundlapalli2022_apd_w600_j200-m17:
    value: '5.4'
    notes: 'Read from the PDF vector data (marker centre at 24 V: 5.44 GHz; axis calibrated on the 1.5 GHz minor ticks, +/- 0.05 GHz); the paper notes the w = 400 / 600 nm curves have
      not saturated at 20 / 25 V (p.5).'
    why: 'p.5 Fig. 6(b) vector data: the 24 V marker of the w = 600 nm curve is at 5.44 GHz'
add_components:
- component_id: cmp_lit_pfeiffer2018_ring_w1p5um_wafer1_noreflow
  source_id: lit:pfeiffer2018
  class: resonator.ring
  label: Si3N4 100-GHz-FSR microring, 1.5 um wide, e-beam lithography, no preform reflow, SiO2 clad (wafer 1)
  row_kind: fabricated
  host_device_ids: ''
  platform: sin
  core_material: 'LPCVD Si3N4 1.5 um wide (core height within the stated 0.6-0.85 um range; not stated per wafer), ring radius about 230 um; photonic Damascene process without the preform
    reflow step; wet thermal SiO2 preform, CMP planarization; wafer 1: e-beam lithography, no reflow, no BHF dip, Si3N4 anneal 24 h N2 1200 C (Fig. 2(c) table)'
  cladding: LTO SiO2 top cladding, annealed 3 h N2 1200 C (wafer 1, Fig. 2(c) table)
  fab_org_ids: org_epfl
  facility_org_ids: org_center_of_micronanotechnology
  process_name: photonic Damascene process (no preform reflow)
  test_structure: ''
  tags: damascene
  verified_on: '2026-11-18'
  notes: 'Fab org_epfl and facility org_center_of_micronanotechnology: p.8 Acknowledgements ''Si3N4 microresonator samples were fabricated in the EPFL Center of MicroNanotechnology (CMi)''
    (named place of fabrication, D448). Cached text is arXiv 1802.08315v1 (dated 2018-02-26 in the text, titled ''Probing the loss origins of ultra-smooth Si3N4 integrated photonic waveguides''),
    the preprint of the Optica 2018 paper of the source row (D430 / D433); journal version unread; the Supplementary Information is not in the cached file. Audit addition: p.6 prints
    for the non-reflowed 1.5 um wide wafer-1 microresonators an expected intrinsic linewidth kappa_0 / 2 pi of about 100 MHz (see Fig. 2(c,d)); Fig. 2(c) wafer-1 open (1.5 um) markers
    read from the PDF vector data: quasi-TM about 106 / 108 / 108 MHz, quasi-TE about 97 / 101 MHz. Same 100-GHz FSR ring family as the other rows (p.3). Used in the doublet analysis
    of Fig. 2(e-h) (blue), which has no registry parameter.'
  why: 'miss: p.6 prints kappa_0 / 2 pi ~100 MHz for the identifiable non-reflowed 1.5 um wafer-1 rings (Fig. 2(c,d)); rule 9 sibling design'
