  cmp_ectc51687_2025_00014_vcbel_pair-m5:
    basis: author_estimate
    notes: MFD of the glass waveguide the VCBEL couples to (9 um; not a fiber) as stated (p.3 Sec. II.B); origin not stated (D76).
    why: same (D76)
  cmp_ectc51846_2026_00016_expanded_beam_lens-m4:
