    why: '"0.62+/-0.01 dB" is not called a mean (p.4); OFC Th1D.3 rows leave statistic empty for the same values'
  cmp_ectc51846_2026_00106_iox_fanout_16ch-m3:
    statistic: ''
    notes: Printed as 0.65 +/- 0.04 dB; statistic and spread definition not stated; mapping of the two values to designs not explicit in this paper (ofc2026:Th1D.3 assigns 0.65 dB to the circular fan-out).
    why: same
  cmp_ectc51909_2023_00324_molded_mt_connector-m2:
