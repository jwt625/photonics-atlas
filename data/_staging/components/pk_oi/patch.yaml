    notes: Penalty spectrum read off Fig. 10 (+/-0.05 dB); minimum about 0.8 dB near 1305 nm, maximum about 1.75 dB near 1275 nm.
    why: Fig. 10 (p.3) points reach about 0.8 dB near 1305 nm (checked on the 220 dpi render)
  cmp_ectc51906_2022_00072_vgroove_metamaterial_ssc-m3:
