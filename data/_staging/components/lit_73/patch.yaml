# Audit patch lit_73 (fresh-context audit 2026-11-02, DevLog/audits/2026-11-02-lit_73-audit.md).
# 233 metrics: 221 ok / 12 imprecise / 0 wrong; 26 components: 25 ok / 1 imprecise, 0 deleted; 5 misses added.
# Not covered here (coordinator rulings): basis of the brusberg2025 per-facet rows and scope of the pair rows (audit Q1, Q2); registry gaps in the audit file.
components:
  cmp_lit_du2022_ld_connector:
    test_structure: ''
    notes: 'Detachable expanded-beam interface: permanent chip-side connector (lens array + modified MT registration connector on a common substrate) and removable fiber connector (EBFAC: 8-fiber V-groove array, 2.1 mm glass spacer, off-the-shelf silicon lens array f 1.6 mm, 1 mm substrate, modified MT ferrule). Beam-size wording differs inside the paper: abstract 160 um in diameter; p.8 about 80 um in diameter; p.9-10 waist size about 80 um. Model (Fig. 3-4) is calculated Gaussian overlap: not a device value. Fab: "we" built the assemblies, authors span Nanjing University and Innolight Technology Research Institute, so fab empty (D80b). LD wavelength not stated in this paper (the 26 deg divergence is cited, ref. [16]; not entered). Text 1-dB tolerance about +/-35 um entered as printed; Fig. 11(b) X curve falls 1 dB at about -30 / +60 um (asymmetric; the printed value is near its tighter side), Y curve at about -80 / +85 um (by eye). Abstract says less than 1 dB in both cases, while Table 2 includes 1.11 dB at the largest lens offset. Repeatability: insertion-loss variation within 5 % over 20 detach / attach cycles (p.10; no parameter, see report).'
    why: 'p.10 Sec. 3.2 calls no part of the LD assembly a test structure (the test-structure wording on p.8 is for the PIC only); p.11 Fig. 11(b) enlarged: the X curve reaches the 1 dB level (87 % peak, about 69 %) near -30 and +60 um, not symmetric +/-40 um'
  cmp_lit_brusberg2025_iox_sin_evanescent:
    notes: 'Fabrication sentences are passive with all authors at Corning Research and Development: fab empty (D80b). Loss always includes the IOX bends and propagation; FAU-to-IOX edge coupling excluded: not an isolated interface loss. Device-to-device differences are on the same design, conditions on metrics. SiN nested U-loops at 100 um design pitch (no pitch parameter on this class, see report). Text colours Device 1 blue and Device 4 red; caption and Fig. 3(C) legend show the reverse: legend used. Fig. 3(C) Device 1 TE reads about 1.68 dB near 1260-1280 nm against the printed below 1.65 dB. Device rows run through IOX in / out channel pairs and a SiN U-loop (Fig. 3(B), inset): the paper prints loss per facet and does not state the halving or how the FAU-to-IOX term was removed (no value printed for it here; Sec. 2 gives an estimated 0.3 dB per facet for fiber coupling). Basis stays measured (caption wording, D167); see audit Q2. The 3000 um is stated for the SiN waveguide; the length of the taper section itself is not stated.'
    why: 'p.2 Sec. 3 and p.3 Fig. 3 caption: records how the per-facet rows relate to the in / out channel pairs, which the report left out (audit Q2); p.2 Sec. 3 for the 3000 um'
