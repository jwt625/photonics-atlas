add_components:
- component_id: cmp_lit_bauters2011a_sin_80nm_bend
  source_id: lit:bauters2011a
  class: waveguide_platform.bend
  label: Bent high-aspect-ratio Si3N4 waveguide, 80 nm x 2.8 um core, SiO2 clad (ring-resonator loss at R = 1 and 1.5 mm)
  row_kind: fabricated
  platform: sin
  core_material: stoichiometric LPCVD Si3N4 80 nm x 2.8 um (TriPleX), n = 1.99
  cladding: SiO2 (n = 1.45), 8 um lower / 7.5 um upper
  process_name: TriPleX LPCVD Si3N4 technology
  test_structure: 'true'
  tags: ultra_low_loss;sin;ring_extraction;ofdr;bend
  verified_on: '2026-11-27'
  notes: 'Same waveguide cross-section as cmp_lit_bauters2011a_sin_80nm (geometry rows there): ring-resonator propagation loss at bend radii below 2 mm, where bend radiation adds to the scattering loss (p.9 Sec. 3.1: bend radiation negligible only for R >= 2 mm). Test rings with a single two-port bus, gap ~2 um, kappa ~0.01 targeted, three coupling lengths (p.9). Fab empty: waveguides ''fabricated with TriPleX LPCVD Si3N4 technology [11]'' (p.3) names the process but no fabricating org (Contract v7); authors at UCSB and LioniX BV (affiliation only). No facility acknowledged. Conclusion values 5 / 3.5 dB/m at 1 / 1.5 mm name no core thickness (p.12, D159; bounds in the straight-row notes).'
  why: 'p.9 Sec. 3.1: ''At a bend radius of 2 mm, the loss of each core thickness has reached its minimum, indicating that bend radiation loss is negligible for a bend radius greater than or equal to 2 mm''; ring points at R < 2 mm include bend radiation, so they are in-bend loss per length, which D81 puts on waveguide_platform.bend rows with the radius in the condition (kim2025, cai2019, zhang2017a precedents); value, basis and locator unchanged'
