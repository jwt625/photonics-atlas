# Owner ruling 2026-11-07 (DevLog-014 D912): munk2019 states fabrication by the commercial foundry Tower-Jazz
# (p.4 Sec. III-A); Tower-Jazz is the former name of org_tower_semiconductor (registry), so the fab org is set.
components:
  cmp_lit_munk2019_arma_dwdm_8ch:
    fab_org_ids: org_tower_semiconductor
    why: p.4 Sec. III-A fabricated by the commercial silicon foundry Tower-Jazz (former name of Tower Semiconductor); D912
    notes: 'Fabricated by the commercial silicon foundry Tower-Jazz, Migdal HaEmek (p.4 Sec. III-A): Tower-Jazz is the former name of Tower Semiconductor: fab set by owner ruling 2026-11-07. Two authors
      at Tower-Jazz. Stage A (4 tau), B1-B2 (2 tau), C1-C4 (tau); each ring in the shorter arm with one-pass delay twice the MZI differential delay; rho = 1/3 for all rings (design). 14 phase delays trimmed
      once by fs-laser (810 nm) photo-darkening / mass transfer of As2Se3 patches (50-400 um long), no cross-interference; response stable over months. Directional couplers and group delays met the design
      without tuning. Not entered: group-delay variation 40 ps across a passband (Fig. 10); periodic response quality retained over a 10 nm bandwidth; QAM-16 demux BER 5e-4, EVM 0.105; device temperature
      printed as 25 +/- 0.001 with a K unit (unit inconsistent, not entered).'
  cmp_lit_munk2019_rib_wg:
    fab_org_ids: org_tower_semiconductor
    why: p.4 Sec. III-A fabricated by the commercial silicon foundry Tower-Jazz (former name of Tower Semiconductor); D912
    notes: 'Fabricated by the commercial silicon foundry Tower-Jazz, Migdal HaEmek (p.4 Sec. III-A): Tower-Jazz is the former name of Tower Semiconductor: fab set by owner ruling 2026-11-07. Two authors
