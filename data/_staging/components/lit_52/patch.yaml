    why: 'not a stated value: the paper prints the highest misalignment loss within a fixed +/-2 um window about the normalized zero offset (Table 2, p.10), not a 1-dB tolerance; the window is not centred on the loss minimum (Fig. 8 render: 3-seg TE minima at -1 / +1 um) and offsets are sampled in 1 um steps, so "> 2 um half-width about the optimum" does not follow (skill rule 1); values kept in component notes; dangel2018 lc1p5-m2 precedent differs (that paper states about 1 dB within +/-2 um)'
  - id: cmp_lit_soganc2013_flipchip_3seg-m9
    why: 'same as 3seg-m8 (TM; Table 2 p.10; Fig. 8(c) 3-seg TM minimum at +1 um)'
  - id: cmp_lit_soganc2013_flipchip_1seg-m7
    why: 'same reasoning as 3seg-m8: a 1-dB tolerance is not stated; Table 3 (p.10) gives the highest misalignment loss in the +/-2 um window; values kept in component notes'
