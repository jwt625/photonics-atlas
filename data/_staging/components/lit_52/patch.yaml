# Audit patch lit_52 (fresh-context audit 2026-10-30, DevLog/audits/2026-10-30-lit_52-audit.md).
# 91 metrics: 80 ok / 7 imprecise / 4 wrong (soganc2013 inferred tol_1db_lateral_um rows, deleted);
# 14 components: 12 ok / 2 changed / 0 deleted; misses: none added.
# Not covered here (coordinator / registry): ePIXfab (fab org on lindenmann2012 pwb_soi_soi, pwb_prototypes_2_4,
# soi_gc and cabezon2012 vgc_vgc once registered, D398; same pending org as teng2009 / abdulla2011), registry gaps
# listed in the audit file.
components:
  cmp_lit_soganc2013_flipchip_3seg:
    notes: 'Fab: the authors (all IBM Research - Zurich) state they fabricated the polymer waveguides and established the flip-chip bonding process (p.11 Sec. 5; bonding p.7 Sec. 3): fab on the assembled coupler (D399). SOI processing is stated passively (p.7); a named individual is thanked for contributing to it (p.11). Taper segments 75 -> 150 nm over 50 um, 150 -> 250 nm over 500 um, 250 -> 425 nm over 150 um (p.5-6). Offsets normalized from the designed -3..+3 um scan to -2..+4 um for an estimated ~1 um bonding misalignment (p.9). Highest misalignment loss within the +/-2 um lateral offset window (Table 2, p.10): TE 0.9 / 0.6 / 0.6 dB, TM 0.7 / 0.3 / 0.3 dB at 1530 / 1550 / 1570 nm (abstract and p.11 restate the 1570 / 1550 nm values as < 0.6 dB TE, < 0.3 dB TM). The paper states no 1-dB tolerance, the offsets are sampled in 1 um steps and the window is centred on the normalized zero offset while several loss minima lie at -1 or +1 um (Fig. 8), so no tol_1db_lateral_um row is entered (audit lit_52; registry gap: misalignment loss at a stated offset). No significant temperature-dependent loss up to 70 C (p.10-11, Fig. 9, 1550 nm TM). Lowest Sample 1 fiber-to-fiber loss of the input-to-cross channel at 1570 nm: 5.2 dB (three-segment) / 5.0 dB (one-segment); reference channel 3.2 dB (p.9). Geometry roles: tip_width_nm / width_nm = Si taper (chip face down above the polymer waveguide); lower_width_nm / layer2_thickness_nm = polymer core (dangel2018 precedent).'
    why: 'the four tol_1db_lateral_um rows are deleted (see delete_metrics); the Table 2 misalignment-loss values they carried in condition move to the component notes so the stated values stay recorded (p.10 Table 2, Fig. 8 render)'
  cmp_lit_soganc2013_flipchip_1seg:
    notes: 'Fab: the authors (all IBM Research - Zurich) state they fabricated the polymer waveguides and established the flip-chip bonding process (p.11 Sec. 5; bonding p.7 Sec. 3): fab on the assembled coupler (D399). SOI processing is stated passively (p.7); a named individual is thanked for contributing to it (p.11). Comparison design to the three-segment taper (p.6). Offsets normalized from the designed -3..+3 um scan to -2..+4 um for an estimated ~1 um bonding misalignment (p.9). Highest misalignment loss within the +/-2 um lateral offset window (Table 3, p.10): TE 2.8 / 2.6 / 2.2 dB, TM 2.3 / 2.0 / 2.0 dB at 1530 / 1550 / 1570 nm. The paper states no 1-dB tolerance and the window is centred on the normalized zero offset, so no tol_1db_lateral_um row is entered (audit lit_52; registry gap: misalignment loss at a stated offset). No significant temperature-dependent loss up to 70 C (p.10-11, Fig. 9, 1550 nm TM). Lowest Sample 1 fiber-to-fiber loss of the input-to-cross channel at 1570 nm: 5.2 dB (three-segment) / 5.0 dB (one-segment); reference channel 3.2 dB (p.9). Geometry roles: tip_width_nm / width_nm = Si taper (chip face down above the polymer waveguide); lower_width_nm / layer2_thickness_nm = polymer core (dangel2018 precedent).'
    why: 'the two tol_1db_lateral_um rows are deleted (see delete_metrics); the Table 3 misalignment-loss values move to the component notes (p.10 Table 3)'
