# Audit patch lit_55 (fresh-context audit 2026-10-30, DevLog/audits/2026-10-30-lit_55-audit.md).
# 285 metrics: 266 ok / 19 imprecise / 0 wrong; 35 components: 34 ok / 1 imprecise (platform) / 0 wrong / 0 deleted,
# 4 changed (1 platform + notes, 3 notes that follow the added misses);
# 5 misses added (yin2007 x3, kang2008 x2). Not covered here: coordinator rulings on the open questions and registry gaps
# listed in the audit file.
components:
  cmp_lit_mcnab2003_fs_ssc:
    platform: polymer
    notes: 'Optimized for TE only (PhC circuit); the polymer extends past the taper vertex to relax cleaving tolerance (p.6).
      Coupling uncertainty between devices below 0.2 dB (p.7, p.10). Misalignment: 3-dB loss at +/- 1 um lateral or vertical
      displacement (Fig. 4 inset; no 1-dB value; 3-dB tolerances not a registry parameter, D250). Fig. 2(c) SEM shows a 3
      um thick polymer ''in this case'' (not the 2 x 2 um2 design). Test fibers: tapered microlensed PM input fiber (2.1 um
      beam waist), tapered SMF output (1.85 um waist). Polymer defined by a final lithography step (p.6). Fab org_ibm_watson:
      wafers etched in the 200 mm CMOS line at IBM Watson Research Center (p.6 Sec. 3); e-beam lithography on a Leica VB6-HR.
      Acknowledgment thanks MRL staff at the IBM Watson facility (staff thanks, company-own cleanroom: no facility entry,
      D404). Platform polymer (audit 2026-10-30, D82f): the 2 x 2 um2 epoxy polymer waveguide extends lengthwise past the
      taper vertex to the cleaved facet (p.6), so the fiber-facing layer is the polymer; the Si inverse taper is in core_material.'
    why: 'D82f: edge couplers / SSCs take the platform of the layer at the fiber-facing facet; p.6 Sec. 3 the polymer waveguide
      extends past the taper vertex to relax cleaving tolerance and supports guiding by itself (index about 1.58 above the
      oxide); merged precedent: polymer facets are platform polymer'
  cmp_lit_kang2008_ge_si_sacm_apd_30um:
    notes: 'Breakdown voltage thermal coefficient 0.05 %/degC (12 mV/K, 200-340 K, Fig. 3; no registry parameter). Effective
      k about 0.1 from McIntyre fits (no parameter). Gain = APD responsivity / primary responsivity of the co-fabricated PIN
      (cmp_lit_kang2008_ge_si_pin_ref). Punch-through between 12 and 20 V. Calculated transit-limited bandwidth 13 GHz at
      low gain (p.6) entered as simulated m13 (audit 2026-10-30). Fab empty: ''We designed and fabricated'' (abstract) but
      authors at Intel (US, Israel), UCSB, U. Virginia and an independent address (D154). Mesa diameters 10-200 um on the
      same wafer; values below are for 30 um devices. Layer stack (Fig. 1 labels): p+ Ge 0.1 um, i-Ge 1 um, p-Si charge 0.1
      um, i-Si multiplication 0.5 um, on low-doped Si; a-Si / Si3N4 passivation, Si3N4 anti-reflection at 1310 nm.'
    why: notes follow the added miss m13 (p.6 Sec. 3 theoretical 13 GHz bandwidth of the 30 um device)
  cmp_lit_kang2008_ge_si_pin_ref:
    notes: 'Fabricated in parallel with the APDs on the same chip to calibrate the unity-gain responsivity (p.3); diameter
      of the measured PIN not stated. Expected responsivity 0.55 A/W calculated with an absorption coefficient of 0.706 um-1
      (p.4; entered as simulated m5, audit 2026-10-30). Fab empty: ''We designed and fabricated'' (abstract) but authors at
      Intel (US, Israel), UCSB, U. Virginia and an independent address (D154). Mesa diameters 10-200 um on the same wafer;
      values below are for 30 um devices. Layer stack (Fig. 1 labels): p+ Ge 0.1 um, i-Ge 1 um, p-Si charge 0.1 um, i-Si multiplication
      0.5 um, on low-doped Si; a-Si / Si3N4 passivation, Si3N4 anti-reflection at 1310 nm.'
    why: notes follow the added miss m5 (p.4 Sec. 3 expected responsivity 0.55 A/W)
  cmp_lit_yin2007_ge_a_7p4x50:
    notes: 'Detector A. Si rib on 1.5 um SOI (100 ohm-cm, 1 um BOX): 1.4 um wide, 0.6 um etch; the substrate under the detectors
      is locally B-implanted (anode); lateral tapers to the wider Ge waveguide; selective Ge epitaxy (0.1 um LT buffer + 1.2
      um at 700 C) planarized by CMP to 0.8 um (intrinsic 0.7 um), Ge anneal, P implant on top (vertical n-i-p), n+ implant
      pulled 0.4 um in from the Ge sidewalls, 1 um Al contacts (p.2, p.4). Polarization dependence smaller than 1 dB (p.4;
      pdl_db not allowed for photodetector). Pad capacitance 23 fF measured (p.5, not the diode). Open 40 Gb/s eyes (Fig.
      4). Fab empty: processing described passively, all authors at Intel (D80b). Impulse response FFT gives a 31 GHz optical
      bandwidth for detector A, consistent with the frequency domain (p.6; entered as m18, audit 2026-10-30). Predicted electrical
      bandwidth 27 GHz from modeling entered as simulated m17. Responsivities: input power at the Ge (about 126 uW) computed
      from the measured 3.0 dB facet loss and 0.55 dB/cm rib loss (p.4), hence derived.'
    why: notes follow the added misses m17 / m18 (p.6 Sec. 3)
