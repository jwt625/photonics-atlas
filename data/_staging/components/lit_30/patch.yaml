  why: 'reclass to switch_fabric.other: bw_1db_ghz not allowed for switch_fabric (Table I MRR 1-dB bandwidth > 70 GHz, p.3); value kept in component notes, registry gap'
- id: cmp_lit_testa2018_mrr_switch_element-m8
  why: 'reclass to switch_fabric.other: tuning_range_nm not allowed for switch_fabric (Table I > 12 nm, p.3); value kept in component notes, registry gap'
- id: cmp_lit_testa2018_mrr_switch_element-m9
  why: 'reclass to switch_fabric.other: fsr_nm not allowed for switch_fabric (FSR 19 nm, p.8 Sec. VI, Fig. 14(b)); value kept in component notes, registry gap'
- id: cmp_lit_testa2018_mrr_switch_element-m10
  why: 'reclass to switch_fabric.other: wavelength_spread_nm not allowed for switch_fabric (up to 9 nm inter-die, p.4 Sec. II, Fig. 5(b)); value kept in component notes, registry gap'
