  notes: 'printed saturation power greater than 240 mW; 10 log10(240) = 23.80 dBm; inferred by the authors from the absence of saturation up to 1.5 A (D256a: unit conversion keeps author_estimate)'
  why: 'miss: p.7 Sec. 3.2 states the SOA saturation power as > 240 mW; registry psat_out_dbm is "1-dB compression unless noted", so an unstated criterion is a note, not a reason to skip (precedent cmp_ofc2026_th2a21 m4 lower bound)'
