# Audit patch lit_17 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_17-audit.md).
# 158 metrics: 148 ok / 10 imprecise / 0 wrong; 28 components: 27 ok / 1 changed / 0 deleted; 8 misses added.
# Not covered here (coordinator decisions, see the audit file): ShiJia Photons registry org (chen2023 SOA vendor),
# registry gaps (laser frequency drift, laser bw_3db_ghz, threshold current density, micro_optics angular tolerance and
# NA, heater_gap_um for wdm, printed placement offset).
components:
  cmp_lit_ibrahimi2021_sin_fiber_facet:
    fab_org_ids: org_cea_leti
    notes: 'Output facet of the Si3N4 chip made at CEA LETI (p.2 Sec. III-A: optical facets defined by deep etching down to the silicon as part of that process). Only the estimated chip-to-fiber coupling loss is given (p.4); facet / taper design not stated.'
    why: 'p.2 Sec. III-A: ''The passive Si3N4 chips are made at CEA LETI'' and the facet definition is a step of that process; the sibling Si3N4 rows (sin_wg, bragg_mirror) already carry org_cea_leti (rule 12)'
metrics:
  cmp_lit_chen2023_dual_mrr_filter-m5:
    basis: author_estimate
    notes: 'design value printed 0.08; fraction -> %; stated as a design parameter of the linewidth simulation (p.4), not stated to be simulated or calculated'
    why: 'D82a: a design-stated performance value is simulated only when the paper says it was simulated / calculated; p.4 Sec. 2.2 states the 0.08 ring-bus coupling as a design parameter next to the Table 1 simulation inputs'
  cmp_lit_chen2023_dual_mrr_filter-m6:
    basis: derived
    notes: printed 1 um x 800 nm; um -> nm
    why: 'D157 / D256: a pure unit rescaling of a printed dimension is derived; p.3 Sec. 2.1 prints the width only as 1 um'
  cmp_lit_chen2023_sin_strip_wg-m2:
    basis: derived
    notes: printed 1 um; um -> nm
    why: D157 / D256, as dual_mrr_filter-m6 (p.3 Sec. 2.1)
  cmp_lit_ibrahimi2021_rsoa-m2:
    ref_plane: unspecified
    notes: 'printed 7.5 mW; 10 log10(7.5) = 8.75 dBm; reference plane (facet / fiber) not stated'
    why: 'p.2 Sec. II-B gives only ''R-SOA output power for a bias current of 300 mA is of 7.5 mW''; ref_plane chip was an assumption (rule 6: unspecified, never a guess)'
  cmp_lit_ibrahimi2021_bragg_mirror-m6:
    basis: design_target
    locator: p.3 Fig. 6; Fig. 5 caption
    notes: 'Fig. 6 label prints the period as 528 nm (Fig. 5 caption: 0.528 um)'
    why: 'D256: the source prints the stored-unit form (Fig. 6 ''Grating period = 528 nm''), so the row keeps the dimension basis design_target'
  cmp_lit_wang2026e_eband_tl-m8:
    condition: 'lasing-wavelength slope for single-ring heater tuning, Ring1 heater curve of Fig. 7(b); gain current not stated for Fig. 7(b) (100 mA is stated for the Fig. 7(a) map)'
    notes: 'printed approximately 0.44 nm/mW; nm/mW -> pm/mW; the two printed slopes pair with the Ring1 (rising) and Ring2 (falling) curves of Fig. 7(b); which radius (24 / 22 um) Ring1 has is not stated'
    why: 'p.8 Sec. 4.3: the 100 mA gain current is stated for the 2D map (Fig. 7(a)) only; Fig. 7(b) legend names the rings (Ring1 / Ring2 heater), so the old note ''which ring is first not stated'' was imprecise'
  cmp_lit_wang2026e_eband_tl-m9:
    condition: 'lasing-wavelength slope for single-ring heater tuning, Ring2 heater curve of Fig. 7(b); gain current not stated for Fig. 7(b) (100 mA is stated for the Fig. 7(a) map)'
    notes: 'printed approximately -0.61 nm/mW; nm/mW -> pm/mW; sign as printed; pairs with the falling Ring2 curve of Fig. 7(b); which radius Ring2 has is not stated'
    why: p.8 Sec. 4.3 and Fig. 7(b) legend, as m8
  cmp_lit_mangal2019a_backside_si_microlens-m1:
    method: direct
    notes: 'Table I net loss (sum of the listed contributions 4.5 + 3.5 + 1.85 + 1.15 dB); Fig. 7 SMF28-to-TEC40 curve peaks near -11 dB around 1300-1310 nm'
    why: 'p.4 Fig. 7 / Table I: the 11 dB fiber-to-fiber value is the measured total (Fig. 7 peak), not a value isolated by a loss breakdown; the breakdown terms are separate rows'
  cmp_lit_psaila2024_glass_micro_optic_bridge-m1:
    basis: author_estimate
    notes: 'half the loopback IL minus 0.5 dB fiber-to-glass-waveguide coupling, 0.3 dB Fresnel and 1.5 dB on-PIC half-loop loss; origin of the three subtracted terms not stated; mean of the four per-assembly averages (1.62, 1.23, 1.13, 1.29 dB); wavelength not stated for the loss (target 1310 nm)'
    why: 'rule 4 / D44: a value resting on loss-budget terms whose origin the paper does not state is author_estimate (p.5 Sec. III gives the 0.5 / 0.3 / 1.5 dB terms without method), not derived'
  cmp_lit_psaila2024_glass_micro_optic_bridge-m2:
    basis: author_estimate
    notes: as m1 (subtracted terms of unstated origin)
    why: rule 4 / D44, as m1 (p.5 Sec. III)
