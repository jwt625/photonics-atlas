  cmp_lit_chang2018c_dmc_adiabatic_design:
    core_material: Si 220 nm SOI (dual-mode stem and three single-mode branches, W0 550 nm and W1 450 nm; W0 labels the middle
      branch in Fig. 2(a), the text assigns W0 to the lateral branches; gap growing from 0 to Wgap > 1 um over the coupling
      length L)
    notes: 'Conventional-waveguide building block of the Fig. 1(a) splitter concept (p.2-3, Fig. 2); not fabricated (the fabricated
      device is the subwavelength version). Simulated stem effective indices 2.6 (TE0) and 2.28 (TE1) not entered (no parameter).
      Branch-role conflict (D417): p.3 says the lateral branches and the middle one are W0 and W1, respectively, but Fig.
      2(a) labels W0 on the middle branch and W1 on a lateral branch, and Fig. 2(b)-(c) show the even supermode TSM0 (converted
      to the middle-branch IFM, p.2-3) tuned by W0 and the odd TSM1 (lateral branches) by W1; figure and physics point to
      W0 = middle (550 nm), W1 = lateral (450 nm).'
    why: 'p.3 Sec. 2.1 vs p.3 Fig. 2(a)-(c) (embedded image read): the text''s W0 / W1 roles contradict the figure labels
      and the supermode plots; the row stated the text roles as fact'
