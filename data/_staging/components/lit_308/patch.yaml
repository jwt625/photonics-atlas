      the experimental results'') sits at about 14 dB / 6 fJ, the black CMT curve at about 13 dB / 8 fJ (+/- 0.5 dB, +/- 1
      fJ); the bottom-to-peak switching energy is a model quantity (measured pump-probe maximum 13.7 dB at about 2.3 fJ, Fig.
      4(a)), so simulated is kept'
    why: 'p.10 Fig. 5(b) (render read) vs p.9 text: the printed 14 dB / 6 fJ match the blue point the caption calls experimental;
