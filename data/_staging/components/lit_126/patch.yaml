# Audit patch lit_126 (fresh-context audit 2026-11-12, DevLog/audits/2026-11-12-lit_126-audit.md).
# 166 metrics: 154 ok / 12 imprecise / 0 wrong; 37 components: 33 ok / 4 imprecise / 0 wrong; 0 deleted; 20 misses added.
# Coordinator rulings open (audit Q1-Q7): Q1 Ps fit parameter as psat_out_dbm (no op), Q2 thai2018 T0 of an optical pump
# threshold (no op; to remove it add delete_metrics cmp_lit_thai2018_gesn_microdisk_10um-m3), Q3 kumar2025 class butt (no op),
# Q4 souleiman2024 / gasse2019 fab empty (no op), Q5 beeck2020 ring-laser wavelength miss (to drop, remove the add for
# cmp_lit_beeck2020_ring_laser-m9), Q6 D153 geometry misses (to drop the souleiman2024 BOX rows, remove the four -m3 adds),
# Q7 lee2022 SOA 10 dB (no op).
components:
  cmp_lit_kumar2025_pic_pic_oxide_align:
    notes: 'Fab: ''We fabricate the devices'' (p.5 Sec. 3), both authors at the University of Rochester; facility: acknowledgment places device fabrication at the Cornell NanoScale Facility and the Integrated Nanosystems Center at University of Rochester (p.10; the latter missing from the registry). Alignment: elastic averaging, rings on the PIC back (outer radius about 800 um, 10 um high, 100 um wide) on pillars of an SiO2-on-Si interposer (4 um high, radius about 600 um), 1000 x 1000 um2 cells (p.4, design). Coupling loss = Lt - L1A - L1B, the fiber-to-PIC losses of each chip measured separately with a 20x / 0.4 NA objective (p.6). SiO2 alignment structures about 9 um tall on the PIC back and 4 um on the interposer (Fig. 6 caption). Measured placement: lateral misalignment 260 nm (+/-100 nm, optical microscopy) and height difference 238 nm mean, 66.1 nm std over 15 reassemblies (p.8): no assembly-accuracy parameter. Fig. 6 holds six ports per assembly; the sixth sits on the right plot border and also carries the right-axis misalignment reading. Audit read of the oxide ports (250 dpi, 420 px/dB): about -3.05 / -2.79 / -2.39 / -2.77 / -3.00 / -2.28 dB, i.e. best -2.28, mean -2.71, std 0.29-0.32 dB, matching the printed -2.3 / -2.7 / 0.3 dB (no conflict). Abstract / p.2 print -2.4 dB link loss between two PICs without naming the assembly or port (oxide port 3 reads about -2.39 dB). Simulated 1-dB height tolerance 1.8 um (p.4): no vertical-tolerance parameter. Simulated values apply to the coupler design shared with cmp_lit_kumar2025_pic_pic_si_align.'
    why: 'p.7 Fig. 6: the batch note read only ports 1-5 and called the printed -2.3 dB a D417 conflict; the sixth port (right border, left-axis reading about -2.28 dB) is the best port, and the six-port mean / std reproduce the printed -2.7 / 0.3 dB'
  cmp_lit_kumar2025_pic_pic_si_align:
    notes: 'Fab: ''We fabricate the devices'' (p.5 Sec. 3), both authors at the University of Rochester; facility: acknowledgment places device fabrication at the Cornell NanoScale Facility and the Integrated Nanosystems Center at University of Rochester (p.10; the latter missing from the registry). Alignment: elastic averaging, rings on the PIC back (outer radius about 800 um, 10 um high, 100 um wide) on pillars of an SiO2-on-Si interposer (4 um high, radius about 600 um), 1000 x 1000 um2 cells (p.4, design). Coupling loss = Lt - L1A - L1B, the fiber-to-PIC losses of each chip measured separately with a 20x / 0.4 NA objective (p.6). Si alignment structures shallow etched, about 30 um (Fig. 6 caption), DRIE. Fig. 6 holds six ports per assembly, the sixth on the right plot border. Audit read of the Si ports (250 dpi, 420 px/dB): about -3.15 / -2.84 / -3.27 / -3.65 / -3.22 / -2.50 dB, i.e. best -2.50, mean -3.11, std 0.36 dB (population), matching the printed -2.5 / -3.1 / 0.36 dB (no conflict); -2.5 dB also equals the -0.4 dB misalignment estimate plus the -2.1 dB simulated gap loss. Same coupler design as cmp_lit_kumar2025_pic_pic_oxide_align (simulated values there).'
    why: 'p.7 Fig. 6: the batch note compared the printed -2.5 dB with the best of ports 1-5 (about -2.84 dB) and called it a conflict; the sixth port (right border, about -2.50 dB) is the best port and the six-port mean / std reproduce the printed -3.1 / 0.36 dB'
  cmp_lit_lee2022_sgdbr_laser_1:
    notes: 'Fab: the PIC was made on the generic InP foundry platform of Fraunhofer HHI in MPW runs (p.2, p.8). Front SG DBR Z0 93.9 um, Z1 7.63 um, 6 bursts; rear Z0 106 um, Z1 12.12 um, 8 bursts (Table 2, design). Output path: MMIs, SOA1 and the 7 deg SSC1 (AR-coated facet). The printed maximum SMSR 48 dB (p.5) belongs to laser 2 (Fig. 5(b): highest point orange near 1556 nm; laser 1 points reach about 45 dB near 1534 nm), entered on cmp_lit_lee2022_sgdbr_laser_2. Fig. 3 caption prints 6 mA SOA current, text 60 mA. Combined two-laser tuning 43 nm (5.36 THz beat bandwidth) and THz power 1.8-320 uW are PIC / system values with an external photodiode emitter: not entered.'
    why: 'p.6 Fig. 5(b) ties the printed 48 dB maximum SMSR to laser 2 (legend colours); the note said the laser was not named'
  cmp_lit_lee2022_sgdbr_laser_2:
    notes: 'Fab: the PIC was made on the generic InP foundry platform of Fraunhofer HHI in MPW runs (p.2, p.8). Front SG DBR Z0 97.5 um, Z1 7.63 um, 6 bursts; rear Z0 110.1 um, Z1 12.58 um, 8 bursts (Table 2, design). Output path: MMIs, SOA1 and the 7 deg SSC1 (AR-coated facet). Maximum SMSR 48 dB (p.5) is tied to this laser by Fig. 5(b) (highest point, orange, near 1556 nm): entered as m14. Fig. 3 caption prints 6 mA SOA current, text 60 mA. Combined two-laser tuning 43 nm (5.36 THz beat bandwidth) and THz power 1.8-320 uW are PIC / system values with an external photodiode emitter: not entered.'
    why: 'p.6 Fig. 5(b) ties the printed 48 dB maximum SMSR to laser 2 (legend colours); the note said the laser was not named'
  cmp_lit_thai2018_gesn_microdisk_10um:
    notes: 'Fab empty: patterning and etching described with passive verbs, no fabricator named (D80b); all authors at Univ. Grenoble Alpes / CEA (INAC-Pheliqs, Leti). Pump: pulsed 1064 nm Nd:YAG, 51 kHz, 0.6 ns, 20 um spot. Thresholds are optical pump power densities, no registry parameter: 134 kW/cm2 at 15 K, 375 at 135 K, 640 at 190 K (p.4), 503 kW/cm2 by extrapolation and at most 790 kW/cm2 from the spectral change at 230 K (p.5). Maximum lasing temperature 230 K, no lasing at 250 K (p.4): no parameter. Simulated (1D, TE0) confinement 63 % in the perimeter (p.6). Pages 6 and 8 of the text layer interleave columns: values there read from the page renders. Multimode lasing. Characteristic temperature T0 = 117 K (''nominal'', exponential fit 15-230 K of the optical pump threshold power density, p.5 Sec. 3.1, Fig. 3(c)): not a threshold-current T0, so no metric row (registry candidate: T0 of an optical pump threshold).'
    why: 'coordinator ruling D568 (audit Q2, strict definition): characteristic_temperature_k is defined for the threshold current; the 117 K fit is of an optical pump density threshold, value kept in notes'
