  cmp_lit_kumar2025_pic_pic_si_align-m2:
    n_samples: 6
    why: 'p.7 Fig. 6: six ports per assembly; the six-port mean of the audit read (about -3.11 dB) reproduces the printed -3.1 dB'
  cmp_lit_kumar2025_pic_pic_si_align-m3:
