# Audit patch lit_316 (fresh-context audit 2026-11-28, DevLog/audits/2026-11-28-lit_316-audit.md).
# 92 metrics: 89 ok / 3 imprecise / 0 wrong; 19 components: 14 ok / 5 imprecise / 0 wrong. 2 geometry misses added.
# After the patch: 19 components, 94 metrics.
# Imprecise: hulme2013 vernier_ring_laser-m7 basis (on-chip power, D394); doylend2011 si_rib_wg-m1 method (Fabry-Perot
# fringes = direct, merged precedent); rogers2021 rx_pixel-m1 qualifier (printed "bandwidths above 280 MHz"); rogers2021
# process_name on 5 rows trimmed to the printed "CMS90WG" (merged form).
# Note supplements on ok rows: hulme2013 si_rib_wg-m1 (D420 coefficient reading); doylend2011 opa_16ch-m4 (abstract axis order).
# Misses: hulme2013 bus_width_nm 700 on both ring rows (rings and bus both 0.7 um, p.3); width_nm conditions narrowed.
components:
  cmp_lit_rogers2021_to_mzi_switch:
    process_name: CMS90WG
    why: 'process_name as printed (p.10 "GlobalFoundries'' CMS90WG 300 mm silicon photonics process"); the descriptive
      parenthesis is not part of the printed name and the merged rows use "CMS90WG" (6 rows); description stays in notes'
  cmp_lit_rogers2021_tx_switch_tree_1x16:
    process_name: CMS90WG
    why: 'process_name as printed (p.10); merged form "CMS90WG"'
  cmp_lit_rogers2021_rx_lo_switch_tree_1x8:
    process_name: CMS90WG
    why: 'process_name as printed (p.10); merged form "CMS90WG"'
