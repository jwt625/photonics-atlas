# Audit patch lit_291 (fresh-context audit 2026-11-26, DevLog/audits/2026-11-26-lit_291-audit.md).
# 119 metrics: 118 ok / 1 imprecise / 0 wrong; 38 components: 31 ok / 7 imprecise / 0 wrong. 1 miss added.
# After the patch: 38 components, 120 metrics.
# Fixes: lim2014 process_name reduced to the printed "GF 200 mm 0.18 um CMOS manufacturing foundry line" on all 7 rows, the
# IME / GF / Alcatel-Lucent collaboration and the GlobalFoundries, Singapore acknowledgment moved to notes; siew2021 Table VI
# O-band 2x2 MMI note (unit is printed). Miss: siew2021 vertical Ge PD dark current about 20 nA at -1 V read off Fig. 15(a)
# (method validated on the printed lateral 7 nA at -3 V). Note supplements on ok rows: heck2012 tapers cross-noted to
# lit:kurczveil2013 (Fig. 4 = its Fig. 5, kept under D408); lim2014 dark-current-density arithmetic check for the -1 V bias.
components:
  cmp_lit_heck2012_taper_type1:
    notes: 'Type 1: Si waveguide tapered out to 2 um where the III-V taper starts; p-InP taper starts almost immediately after the other two levels, 1.2-um margin of the n-InP and SCH levels. Passive hybrid-Si taper test structures: ''tapers were fabricated where the bandgap of the QWs was shifted to 1.40 um'' so that QW absorption and pumping are absent at 1.55 um (p.3 Sec. II-A). Hybrid-section Si widths 1.0 and 1.5 um were both measured (Fig. 4); the printed per-type loss is not split by width. The value sentence and Fig. 4 carry no citation; the paragraph cites the authors'' refs. [37] (Photon. J. 2013) and [38] (GFP 2011) only for design details, so no value or figure is attributed to them (D408 test: kept). Fig. 4 shows the same data points as Fig. 5 of ref. [37], which is in the atlas as lit:kurczveil2013 (per-width transition losses and back reflection): same test structures, two sources (as a conference / journal pair under D408). Back reflection below -41 dB for both types (p.3) not entered: back_reflection_db is not allowed for waveguide_platform (registry gap). Fab empty: passive ''were fabricated'', no org named (D80b). Platform other: bonded III-V on SOI has no enum value (merged precedent for hybrid III-V/Si tapers).'
    why: 'p.3 Fig. 4 vs lit:kurczveil2013 p.6 Fig. 5: identical data points (same four symbol series and fits); [37] is cited for design details only, no value or figure attributed (D408), rows kept; cross-note so the two sources of one measurement are visible'
  cmp_lit_heck2012_taper_type2:
    notes: 'Type 2: mode more gradually converted from the Si mode to the hybrid mode; Si width tapered from 2.0 um down to the hybrid-section width (1.0 or 1.5 um) over the length of the III-V taper; Fig. 2 offsets 40 um and 20 um. Passive hybrid-Si taper test structures: ''tapers were fabricated where the bandgap of the QWs was shifted to 1.40 um'' so that QW absorption and pumping are absent at 1.55 um (p.3 Sec. II-A). Hybrid-section Si widths 1.0 and 1.5 um were both measured (Fig. 4); the printed per-type loss is not split by width. The value sentence and Fig. 4 carry no citation; the paragraph cites the authors'' refs. [37] (Photon. J. 2013) and [38] (GFP 2011) only for design details, so no value or figure is attributed to them (D408 test: kept). Fig. 4 shows the same data points as Fig. 5 of ref. [37], which is in the atlas as lit:kurczveil2013 (per-width transition losses and back reflection): same test structures, two sources (as a conference / journal pair under D408). Back reflection below -41 dB for both types (p.3) not entered: back_reflection_db is not allowed for waveguide_platform (registry gap). Fab empty: passive ''were fabricated'', no org named (D80b). Platform other: bonded III-V on SOI has no enum value (merged precedent for hybrid III-V/Si tapers).'
    why: 'p.3 Fig. 4 vs lit:kurczveil2013 p.6 Fig. 5: identical data points (same four symbol series and fits); [37] is cited for design details only, no value or figure attributed (D408), rows kept; cross-note so the two sources of one measurement are visible'
  cmp_lit_siew2021_ge_pd_vertical:
    notes: 'AMF PDK Ge PIN photodetector (''typical performance'', Fig. 15 testing results of AMF Ge photodetectors, p.12). Subtype other: waveguide coupling of the AMF devices is not stated in the text (D80h). Table VIII AMF rows (ref. [48]) are cited and not entered. Wavelength: 1550 nm inferred, Fig. 15 states none; Table VIII compares the AMF PDK photodetectors at 1550 nm. Fab org_amf: all authors at AMF; the platform ''is fabricated at AMF'' (p.2, Fig. 3 ''AMF''s standard MPW flow'') and the data are ''compiled from MPW wafers running in AMF in 2019 and 2020'' (p.5). Review paper: only AMF data printed without a reference are entered; Table II (all foundries incl. the AMF row, ref. [48] PDK manual), Table I, Table IV, Table V rows with refs. [83] / [84], Table VII and Table VIII are cited and not entered. Vertical-device dark current is not printed; Fig. 15(a) log-axis read at -1 V entered as extracted_from_figure (m4).'
    why: 'p.12 Fig. 15(a): audit adds the dark current figure read (miss m4); note updated'
  cmp_lit_lim2014_si_channel_wg:
    process_name: GF 200 mm 0.18 um CMOS manufacturing foundry line
    notes: 'Fab org_globalfoundries: ''A pilot Si passive wafer ... was fab out from GF''s line'' / ''pilot wafer fabricated in GF'' (p.7, Fig. 7) and ''pure Ge PDs were fabricated and verified in GF line'' (p.8). IME, GF and Bell Labs Alcatel-Lucent collaborated to develop the process technology on GF''s line, ALU providing design support (p.6); the acknowledgment calls it IME''s platform transfer and names GlobalFoundries, Singapore (p.10); IME (all authors) is not stated as fabricator of these wafers (note only); optical measurements on IME''s wafer-level tester (p.7). SOI 220 nm Si / 3 um BOX (p.7). Interim results of the GF technology transfer (Sec. IV-B); the rest of the review (Table I, OpSIS / ePIXfab, refs.) is not entered. Cutback structures with grating couplers on a wafer-level optical tester (Fig. 6(c)); no post-etch treatment.'
    why: 'p.6 Sec. IV-B prints "GF''s 200 mm 0.18 um CMOS manufacturing foundry line"; the appended "(IME / GF / Alcatel-Lucent technology transfer)" is not part of a printed process name (Contract v7: process_name as printed; shown in the benchmark tooltip): moved to notes with the p.6 / p.10 wording'
