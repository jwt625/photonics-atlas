metrics:
  cmp_lit_siew2021_sin_mmi2x2_o-m1:
    notes: Printed 'Loss <0.7 dB'; read as loss beyond the ideal split.
    why: 'p.8 Table VI render: the O-band 2-by-2 MMI row prints ''Loss <0.7 dB'' with the unit (only the C-band row omits it); note said no unit'
  cmp_lit_lim2014_ge_pd_8x25-m2:
    notes: 'Printed ''The dark current density is ~5-6 mA/cm2 for all the PDs'' (stated once for all 8 PD designs, entered on each PD row); bias not stated in that sentence, -1 V from the dark-current context. Check: printed ~11 nA at -1 V / 200 um2 = 5.5 mA/cm2, consistent with the -1 V reading (width x length area; audit arithmetic, notes only).'
    why: 'p.8 Sec. IV-B and Fig. 9: the -1 V dark currents divided by the PD areas reproduce the printed 5-6 mA/cm2 (5.5 for 8x25), which supports bias -1 V; note supplement (row ok)'
  cmp_lit_lim2014_ge_pd_8x40-m2:
    notes: 'Printed ''The dark current density is ~5-6 mA/cm2 for all the PDs'' (stated once for all 8 PD designs, entered on each PD row); bias not stated in that sentence, -1 V from the dark-current context. Check: Fig. 9 read ~18.0 nA at -1 V / 320 um2 = 5.6 mA/cm2, consistent with the -1 V reading (width x length area; audit arithmetic, notes only).'
    why: 'p.8 Sec. IV-B and Fig. 9: the -1 V dark currents divided by the PD areas reproduce the printed 5-6 mA/cm2 (5.6 for 8x40), which supports bias -1 V; note supplement (row ok)'
  cmp_lit_lim2014_ge_pd_7x25-m2:
    notes: 'Printed ''The dark current density is ~5-6 mA/cm2 for all the PDs'' (stated once for all 8 PD designs, entered on each PD row); bias not stated in that sentence, -1 V from the dark-current context. Check: Fig. 9 read ~8.6 nA at -1 V / 175 um2 = 4.9 mA/cm2, consistent with the -1 V reading (width x length area; audit arithmetic, notes only).'
    why: 'p.8 Sec. IV-B and Fig. 9: the -1 V dark currents divided by the PD areas reproduce the printed 5-6 mA/cm2 (4.9 for 7x25), which supports bias -1 V; note supplement (row ok)'
add_metrics:
- metric_id: cmp_lit_siew2021_ge_pd_vertical-m4
  component_id: cmp_lit_siew2021_ge_pd_vertical
  parameter: dark_current_na
  value: '20'
  unit: nA
  qualifier: approx
  statistic: typical
  bias_v: '-1'
  basis: extracted_from_figure
  locator: p.12 Sec. III-D, Fig. 15(a)
  notes: 'Read off the Fig. 15(a) dark-current trace (log axis, 1e-9 to 1e-3 A) at -1 V: marker band about 12-33 nA, centre about 20 nA (reading uncertainty about a factor 1.6). The same read on Fig. 15(b) at -3 V gives 7.4 nA against the printed 7 nA of the lateral device. Not printed in the text; Table VIII AMF rows (ref. [48]) not used.'
  why: 'miss: Fig. 15 is the paper''s own ''typical performance'' data and the vertical dark current is the one PD figure of merit (p.11: dark current, responsivity, bandwidth) without a printed value; figure read validated on the printed lateral 7 nA (rule 4 extracted_from_figure, D469 / D574 figure-read precedents)'
