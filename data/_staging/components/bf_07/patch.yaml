# Audit patch bf_07 (fresh-context audit 2026-10-20), main block plus coordinator-selected optional items (see DevLog/audits).
components:
  cmp_churaev2023_dimer_50ghz:
    notes: 'Coupled-ring dimer for transduction schemes; zero-bias mode splitting 4.6 GHz (Fig. 4f, mode_splitting_ghz) and DC tuning about 30 MHz/V (EO effect; no EO atlas row; not entered, see audit Block
      B). Facility: Si3N4 substrates fabricated in the EPFL CMi (acknowledgments, p.8); LNOI wafer (300 nm x-cut) from NanoLN (supplier, a note); BRNC operations team thanked for help and support only (not
      entered).'
    why: 'D72/D76 by author contributions p.8: fabricators at EPFL and IBM Research Europe (two orgs, niels2026 precedent); coordinator applied audit Block B2'
    fab_org_ids: org_epfl;org_ibm_research_zurich
  cmp_mohl2025_photonic_molecule:
    notes: 'Optical resonator pair of the triply resonant transducer (device 2, EO row mohl2025-a). Intrinsic Q is in the EO row notes only, so entered here; FSR 218 GHz is already in the EO row (fsr_nm
      1.87) and not re-entered. Room-temperature fit before cooldown also gives ring-ring detuning -2.2 GHz (Fig. 21; not entered); splitting 2mu = 2pi x 4.7 GHz entered as mode_splitting_ghz; intrinsic
      loss rate roughly doubled after cooldown (p.26). Ring radius and gap not stated in the text. Fab: samples fabricated by the authors (contributions, p.11), all at IBM Research Europe, Zurich; facility:
      all samples fabricated at BRNC (acknowledgments, p.11).'
    why: D73 parameters now used
  cmp_axline2026_racetrack_l500_s410:
    notes: 'Photonic-molecule optical resonators of transducer device(s) 1 (Table B.1, p.16); design follows an earlier TFLN design (ref. 25). FSR is already in the EO rows (fsr_nm) and not re-entered.
      Intrinsic (kappa_0) and external (kappa_ext) rates per supermode from Table B.1; minimum splitting from Table B.1 (origin not stated, author_estimate). Fab org not set: fabrication by the authors
      (Miraex SA and EPFL affiliations; acknowledgments mention Miraex photonics platform), no fabricating org stated; LT-on-insulator stack from NanoLN (supplier, a note).'
    why: D73 repoint and additions
  cmp_axline2026_racetrack_l400_s410:
