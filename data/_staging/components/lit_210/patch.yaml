# Audit patch lit_210 (fresh-context audit 2026-11-18, DevLog/audits/2026-11-18-lit_210-audit.md).
# 78 metrics: 69 ok / 8 imprecise (D157 basis) / 1 wrong (jeong2020 m7 TE-TM grid difference as wavelength_spread_nm);
# 9 components: 1 ok / 8 imprecise (notes); 2 misses added (jeong2020 C-band chip length 2.8 mm, koyama2013 element
# footprint ~2.0 mm2). After the patch: 9 components, 79 metrics.
# Coordinator questions (audit Q1-Q5): Q1 guan2014b fab UC Davis + BAE (once registered) + Marvell facility (notes only);
# Q2 guan2014b cited-figure exclusions and BOX / taper kept (no op); Q3 jeong2020 composite rows kept, m7 deleted
# (revert = drop the delete op); Q4 koyama2013 Fig. 2 dimensions stay out on registry grounds (notes only), element
# extinction reads confirmed; Q5 lu1994 0 rows confirmed.
components:
  cmp_lit_guan2014b_unit_cell_lattice_filter:
    notes: 'Fab sentence (p.4 Sec. IV): devices ''fabricated in BAE Systems CMOS foundry and Microlab/Marvell Nanolab facilities,
      University of California, Berkeley''; first-person process steps follow (p.4-5: second lithography for the heat-isolation
      trenches, dry thermal oxidation, iterative process optimization for the 50/50 couplers, cladding densification with
      dopant activation, AR coating), and an author biography (p.10) states that this author designed, fabricated and characterized
      the reconfigurable lattice filters; all authors at UC Davis at the time of the work: fab = UC Davis (rule 12, D440 /
      D419). The paper assigns no process step or layer to BAE Systems or to the Berkeley facility (the Fig. 6 flow, p.5,
      is unattributed): BAE Systems is a fab org (foundry) for the whole chip once registered (open supply / org request,
      same gap as lit:shi2013); ''Microlab/Marvell Nanolab'' -> org_marvell_nanofabrication_laboratory as facility (owner
      UC Berkeley not entered, D634 / D653). Not entered: Q 2.7e5 and 13 mA per 2 pi (cited refs. [10], [13]); worst-case
      round-trip loss 0.6 dB (assumption, no parameter); Fig. 10 pole magnitudes 0.11 / 0.87 (caption cites ref. [13]); reconfiguration
      time < 16.67 ns and 30-50 ns settling, 15-30 mW heat load (Fig. 14, caption and sentences cite ref. [21], D259a); two-tone
      SFDR 61.6 dB (p.7; conclusion p.9 prints 61.5 dB; no parameter); directional coupler < 3 % splitting error (cited ref.
      [10]). Fig. 5(c) labels 13 mm / 6 mm are not tied to one device.'
    why: 'fab basis: p.4-5 first-person steps plus the p.10 author biography (designed, fabricated and characterized the lattice
      filters); the paper does not split the process between BAE Systems and the Berkeley facility (p.4 Sec. IV, Fig. 6 p.5);
      fab / facility ids unchanged'
