  cmp_lit_jeong2020_pd_demux_16ch_cband:
    notes: 'Fabrication sentence (p.3 Sec. III) is passive (''was fabricated by ArF-immersion lithography technology on a
      300-mm SOI wafer'', process cited to ref. [22]) and names no org: fab empty, process_name as printed. Chip 1.7 mm x
      2.8 mm incl. PBS/PR, two interleavers, two AWGs and a crossing (p.3). Not entered: TE vs TM WDM grid wavelength difference
      < 0.1 nm (p.4 Sec. III; polarization-dependent wavelength shift, no registry parameter); loss split 0.5 dB PBS/PR /
      0.5 dB interleaver / 4.5 dB AWG and AWG 1.2 dB (attributed to refs. [9], [13], [14]); crossing < 0.1 dB / < -30 dB (ref.
      [10]); waveguide < 0.5 dB/cm (ref. [22]); channel grid +/-< 5 GHz and die-to-die center-wavelength deviation +/-< 20
      GHz (p.6; frequency spread, no GHz parameter); Table I effective index 2.3343 and kappa_DC 0.5 / 0.2 / 0.2 / 0.04 (no
      parameter for wdm); 32 Gbps NRZ eye diagrams (system test); Fig. 8 Ch01 peak -13.7 dB (method check of the Table II
      total); sigma = 120 GHz expectation (ref. [22]). Table I values are the parameters of the analytic calculation, which
      the fabricated device used for its widths (p.3).'
    why: records the deleted m7 value (TE vs TM grid difference < 0.1 nm, p.4 Sec. III) in notes
  cmp_lit_koyama2013_mzos_4x4_fabric:
    notes: 'Fabrication sentence (p.1 Sec. II) is passive and names no org (authors at Waseda University and Hitachi): fab
      empty. Not entered: MMI 3-dB coupler 215 um and middle-mesa phase shifter 200 um (p.1 Fig. 2 labels; the p.1 sentence
      says the element design of ref. [3] was used, so these are this fabric''s element dimensions under D80i borderline /
      D578, but switch_fabric has no MMI-length or phase-shifter (active) length parameter: registry gap); about 5 mA / about
      3 ns of the earlier 4x4 fabric (ref. [4]). Device 6 mm x 1 mm incl. I/O ports, access waveguides and six elements (p.1).
      Fig. 7: input port 3, OS-3 or OS-4 modulated, other elements at adjusted bias currents; relative output powers only
      (no absolute insertion loss). Crosstalk described as ''almost the same'' (no number).'
    why: the element design credited to ref. [3] is reused in this fabric (p.1 Sec. II 'was used'); same reading as the guan2014b
      3 um BOX / 200 um taper rows (D578); the values stay out only because no switch_fabric parameter exists (mmi_length_um
      is splitter / crossing / wdm / mode_converter only)
  cmp_lit_koyama2013_mzos_2x2_element:
    notes: 'Fabrication sentence (p.1 Sec. II) is passive and names no org (authors at Waseda University and Hitachi): fab
      empty. Not entered: MMI 3-dB coupler 215 um and middle-mesa phase shifter 200 um (p.1 Fig. 2 labels; the p.1 sentence
      says the element design of ref. [3] was used, so these are this fabric''s element dimensions under D80i borderline /
      D578, but switch_fabric has no MMI-length or phase-shifter (active) length parameter: registry gap); about 5 mA / about
      3 ns of the earlier 4x4 fabric (ref. [4]). Needs an offset bias current of 6.5 mA for low off-state crosstalk (p.2).
      Fig. 5(c) switching: port 2'' minimum near 6.5 mA, port 1'' minimum near 24-25 mA (no switching-current parameter).
      Same element design as the six elements of cmp_lit_koyama2013_mzos_4x4_fabric. Fig. 5(b) labels about 4 mm length and
      0.5 mm width (footprint entered as approx).'
    why: the element design credited to ref. [3] is reused in this fabric (p.1 Sec. II 'was used'); same reading as the guan2014b
      3 um BOX / 200 um taper rows (D578); the values stay out only because no switch_fabric parameter exists (mmi_length_um
      is splitter / crossing / wdm / mode_converter only)
