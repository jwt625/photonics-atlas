add_components:
- component_id: cmp_lit_liu2018_bragg_wg_p088_n210
  source_id: lit:liu2018
  class: reflector.bragg
  label: Ge-rich graded SiGe surface-corrugated Bragg grating waveguide, period 0.88 um, N = 210 (6.4 um band)
  row_kind: fabricated
  platform: other
  core_material: 'Ge-rich graded Si(1-x)Ge(x) on Si: Ge fraction rising linearly to pure Ge across the 6 um core (LEPECVD);
    waveguide etch 4 um, width 5 um; top-surface grating shallow etch 0.4 um over a 3.5 um wide region (r = 70%), duty cycle
    0.5'
  cladding: air (top); Si substrate below the graded layer
  tags: mid_ir;lwir;sige;bragg
  verified_on: '2026-10-29'
  notes: 'Fab: device fabrication ''performed at'' the Plateforme de Micro-Nano-Technologie/C2N (p.6 Acknowledgments): facility
    not in the registry (reported; its owner C2N is in the registry as a research institute, not entered per D82c); SiGe graded
    layers grown by LEPECVD (passive, p.4; L-NESS Politecnico di Milano co-authors); no explicit fabricator statement: fab_org_ids
    empty. Sibling of cmp_lit_liu2018_bragg_wg_p088_n280 (same period, N = 210); minimum transmittance only plotted (Fig.
    2(c), 2(d)).'
  why: 'miss: N = 210 grating of the 0.88 um series is measured in Fig. 2(c) and its minimum transmittance plotted in Fig.
    2(d) (p.3); both readings agree (about -9.1 dB); sibling design = new row (rule 9)'
