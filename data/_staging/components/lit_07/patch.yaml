# Audit patch lit_07 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_07-audit.md).
# 205 metrics: 185 ok / 20 imprecise / 0 wrong; 44 components: 33 ok / 11 changed / 0 deleted; misses: 1 component + 20 metrics added.
# Not covered here (coordinator decisions, see the audit record): missing registry orgs (Surrey Ion Beam Centre,
# Helmut Schmidt University, Glasgow, Minnesota, C2N platform, PhotonX), white2024 fab (Stanford + UW vs Stanford only),
# garciablanco2025 m3 basis alignment, registry gaps.
components:
  cmp_lit_riemensberger2022_twopa_2m_spiral:
    cladding: SiO2 (preforms etched into the SiO2 substrate; TEOS + low-temperature oxide top cladding, annealed 1200 C)
    why: 'p.5 Methods: patterns dry-etched to the SiO2 substrate; top cladding TEOS + low-temperature oxide; the paper does
      not say thermal oxide (grep: no thermal / wet oxide in text)'
  cmp_lit_riemensberger2022_sin_spiral_waveguide_2m:
    cladding: SiO2 (preforms etched into the SiO2 substrate; TEOS + low-temperature oxide top cladding, annealed 1200 C)
    why: p.5 Methods, as the TWOPA row
  cmp_lit_riemensberger2022_sin_inverse_taper_lensed_fiber:
    cladding: SiO2 (preforms etched into the SiO2 substrate; TEOS + low-temperature oxide top cladding, annealed 1200 C)
    why: p.5 Methods, as the TWOPA row
  cmp_lit_suntsov2021_rpe_ppln_ridge_10um:
    notes: 'Fab: the authors state in the Conclusion that they fabricated the PPLN ridge waveguides (p.7); all authors at
      Helmut Schmidt University, Hamburg, which is not in the registry (reported): fab_org_ids empty. Best of the 10 um wide
      ridges, operated at 120 C to mitigate photorefractive damage (PRD). Not entered (no frequency_converter parameter):
      QPM tuning-curve FWHM 0.22 nm (p.5, registry gap), SH output 0.84 W at 1.2 W coupled pump and the 1 W headline (p.1,
      p.6-7), 97% pump depletion (p.6), measured QPM wavelength 1551.4 nm (p.5), measured mode sizes 8.1 x 6.4 um (pump) and
      8.0 x 4.8 um (SH) at 1/e2 (p.5), lens-to-waveguide coupling efficiency 0.94 (overlap estimate, p.4-5), PRD onset above
      1.6 W coupled pump at QPM (p.6). Output facet cut at 5.6 deg after the loss measurement (p.2).'
    why: 'lit:suntsov2021 is restricted_local_only: the quoted Conclusion phrase is replaced by a paraphrase (rights rule,
      lit addendum); sidewall deviation now entered as sidewall_angle_deg (m10), measured QPM wavelength and PRD onset listed'
  cmp_lit_suntsov2021_rpe_ppln_ridge_waveguides:
    notes: 'Fab: the authors state in the Conclusion that they fabricated the PPLN ridge waveguides (p.7); all authors at
      Helmut Schmidt University, Hamburg, which is not in the registry (reported): fab_org_ids empty. Array-level row (D165):
      ridges 7-15 um wide on one 50 mm chip; losses from the Fabry-Perot resonator method on perpendicular facets with the
      bulk air/LiNbO3 reflectance (0.132 at 1550 nm) taken as facet reflectance, before the output facet was angled (p.2,
      p.4).'
    why: 'restricted_local_only source: quote replaced by a paraphrase; FP reflectance assumption stated (p.4)'
  cmp_lit_white2024_kerr_ring_backscatter_sil:
    core_material: Si3N4 ring (cross-section, film and process not stated for this comparison device)
    cladding: ''
    why: 'p.9-10 Fig. 3(b) / caption: the comparison device is described only by its lower Q and an inset image; the paper
      does not state that it shares the ULS process or cladding (the previous core_material text said the paper assumes the
      same process, which it does not)'
  cmp_lit_white2024_dfb_laser_chip_free_running:
    notes: 'Laser chip provided by the UCSB co-authors (p.17 Author Contributions); no fabrication statement: fab empty (D80b).
      The Methods frequency-splitting setup names the DFB laser as PhotonX (p.15); whether this is the same chip as the UCSB-provided
      one is not stated, and PhotonX is not in the registry: fab not set. Free-running reference of the self-injection-locked
      row.'
    why: 'p.15 Methods: DFB laser (PhotonX) coupled directly to the chip; p.17: UCSB co-authors provided the semiconductor
      laser chip; vendor identity recorded for the coordinator (rule 12 vendor of a purchased device under test)'
  cmp_lit_liu2018_fp_p11_n280:
    class: resonator.photonic_crystal
    why: 'registry: resonator.photonic_crystal = photonic-crystal / Fabry-Perot cavity; this is a Fabry-Perot cavity of two
      Bragg-grating mirrors around a 70 um straight waveguide (p.4 Sec. 3, Fig. 3(a)); merged precedent for mirror-bounded
      FP cavities: berman2026, qi2025 fp_slr_cavity, xu2022 fp_retro_*'
  cmp_lit_liu2018_fp_p116_n280:
    class: resonator.photonic_crystal
    why: 'registry: resonator.photonic_crystal = photonic-crystal / Fabry-Perot cavity; this is a Fabry-Perot cavity of two
      Bragg-grating mirrors around a 70 um straight waveguide (p.4 Sec. 3, Fig. 3(a)); merged precedent for mirror-bounded
      FP cavities: berman2026, qi2025 fp_slr_cavity, xu2022 fp_retro_*'
  cmp_lit_liu2018_fp_p11_n500:
    class: resonator.photonic_crystal
    why: 'registry: resonator.photonic_crystal = photonic-crystal / Fabry-Perot cavity; this is a Fabry-Perot cavity of two
      Bragg-grating mirrors around a 70 um straight waveguide (p.4 Sec. 3, Fig. 3(a)); merged precedent for mirror-bounded
      FP cavities: berman2026, qi2025 fp_slr_cavity, xu2022 fp_retro_*'
  cmp_lit_liu2018_bragg_wg_p088_n280:
    notes: 'Fab: device fabrication ''performed at'' the Plateforme de Micro-Nano-Technologie/C2N (p.6 Acknowledgments): facility
      not in the registry (reported; its owner C2N is in the registry as a research institute, not entered per D82c); SiGe
      graded layers grown by LEPECVD (passive, p.4; L-NESS Politecnico di Milano co-authors); no explicit fabricator statement:
      fab_org_ids empty. Sibling gratings with the same period: N = 210 entered as cmp_lit_liu2018_bragg_wg_p088_n210 (Fig.
      2(c) and 2(d) agree, about -9 dB); N = 250 not entered (D159): Fig. 2(b) / 2(c) dip about -14.4 dB vs Fig. 2(d) minimum
      transmittance about -12.8 dB.'
    why: audit added the N = 210 sibling (Fig. 2(c) and 2(d) readings agree); the N = 250 disagreement is between Fig. 2(b)/(c)
      and Fig. 2(d) (p.3), not between (c) and (d) only
metrics:
  cmp_lit_liu2022_er_sin_spiral_waveguide-m1:
    statistic: ''
    notes: Peak (spectral maximum at 1535 nm) of the wavelength-dependent OFDR loss of the 0.5-m spiral (linear fit of back-reflection
      vs distance in spectral windows); slightly above the ~1.75 dB/cm ring-linewidth peak (p.14). Single device, so no statistic.
    why: 'p.14 Supp. Note 7: 2.14 dB/cm is the peak of the OFDR loss spectrum of one spiral, not the best of several devices;
      statistic best (best device / lowest loss) misstates it'
  cmp_lit_liu2022_er_sin_spiral_waveguide-m3:
    basis: author_estimate
    notes: Printed < 2.5 dB background loss for a 0.5-m-long waveguide (p.3); 2.5 dB / 50 cm = 0.05 dB/cm. The background
      loss after annealing is the one "extrapolated from intrinsic resonance linewidth measurement of a doped microring" (p.3),
      i.e. the ring-extracted per-length loss (n_eff not stated, as microring m5 / m6) applied to 0.5 m, not a measurement
      on the spiral. Wavelength not stated (outside the erbium band).
    why: 'p.3: the < 2.5 dB is the ring-extrapolated background loss scaled to 0.5 m; the ring loss rows (n_eff not stated)
      are author_estimate (D76), so this value rests on the same unstated input'
  cmp_lit_akin2024_ingap_ring_shg_r5-m1:
    band: ''
    wavelength_nm: '1533.5'
    wavelength_inferred: 'true'
    notes: 'Peak eta = PSHG / Pp^2 = 440,000%/W (printed in text and Fig. 1(d) caption). Pump wavelength not stated in text:
      about 1533.5 nm read off the Fig. 1(d) pump-wavelength axis (SH peak between 1533.5 and 1533.55 nm ticks, reading uncertainty
      +/- 0.03 nm); 1550 nm band TE00 pump'
    why: 'p.2 Fig. 1(d): the SHG spectrum is plotted against pump wavelength 1533.45-1533.6 nm with the peak near 1533.53
      nm; a plot-axis wavelength is more specific than the inferred band (schema wavelength_inferred: plot axis)'
  cmp_lit_suntsov2021_rpe_ppln_ridge_waveguides-m1:
    wavelength_inferred: ''
    notes: 'Printed (0.15 +/- 0.03) dB/cm, losses evaluated around 1550 nm with the FP resonator formula on low-power laser
      scans; facet reflectance = bulk extraordinary-wave value 0.132 at 1550 nm (p.4). Model-parameter extraction (FP resonator
      formula) with an assumed facet reflectance (bulk Fresnel value, not measured) as the stated model input: measured (standard fit of own data, D80a; ruling D394).'
    why: 'p.4: "evaluated propagation losses around 1550 nm" states the wavelength; wavelength_inferred true misstates it
      (D46); basis: the loss is extracted from the FP fringe contrast with the bulk air/LN reflectance 0.132 taken as the
      facet reflectance (p.4), a model-parameter extraction with a stated assumption (D80a: derived), as liu2022 back-reflection
      rows'
    basis: measured
  cmp_lit_suntsov2021_rpe_ppln_ridge_waveguides-m2:
    wavelength_inferred: ''
    notes: 'Printed (0.27 +/- 0.04) dB/cm for the 7-8 um wide ridges, evaluated around 1550 nm (FP resonator formula, facet
      reflectance 0.132; p.4). Model-parameter extraction (FP resonator formula) with an assumed facet reflectance (bulk Fresnel
      value, not measured) as the stated model input: measured (standard fit of own data, D80a; ruling D394).'
    why: 'p.4 states the wavelength, as m1; basis: the loss is extracted from the FP fringe contrast with the bulk air/LN
      reflectance 0.132 taken as the facet reflectance (p.4), a model-parameter extraction with a stated assumption (D80a:
      derived), as liu2022 back-reflection rows'
    basis: measured
  cmp_lit_white2024_uls_kerr_isolator_ring-m3:
    basis: design_target
    locator: p.11; p.16 Methods (4000 x 310 nm)
    notes: multimode ring width printed 4 um (p.11) and 4000 nm in the TRN simulation geometry (p.16)
    why: 'D256: the source prints the stored-unit form (4000 x 310 nm, p.16) for the same ring width, so the row keeps its
