add_metrics:
- metric_id: cmp_lit_komatsu2021_pin_phase_shifter-m5
  component_id: cmp_lit_komatsu2021_pin_phase_shifter
  parameter: rise_time_us
  value: '0.016'
  unit: us
  qualifier: lt
  condition: fitted exponential time constant of the far-field signal behind a slit (APD) after a voltage step on one phase shifter;
    equal to the time constant of the applied voltage, i.e. limited by the DAC of the driver circuit; not a 10-90 % rise time
  method: direct
  basis: derived
  locator: p.3 Sec. IV, Fig. 6; p.1 Abstract
  notes: printed 'less than 16 ns' (ns -> us, D256); fit of the authors' own trace (D80a); the device limit is not reached (sub-ns carrier
    response and > 1 GHz RC bandwidth are expectations, p.3, not entered)
  why: 'miss: p.3 Fig. 6 measures the response to a step on one phase shifter; rise_time_us is allowed on phase_shifter and instrument-limited
    response times are entered with the limit in the condition (stanfield2019 precedent)'
