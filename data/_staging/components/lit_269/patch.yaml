# Audit patch lit_269 (fresh-context audit 2026-11-24, DevLog/audits/2026-11-24-lit_269-audit.md).
# 142 metrics: 121 ok / 21 imprecise / 0 wrong; 25 components: 23 ok / 2 imprecise (notes). 9 misses added
# (tien2011 Fig. 1 experimental crosses of the 2.8 um x 80 nm rings: R 2 mm loss on the add-drop row, two new ring rows
# for R 1 mm and R 1.5 mm with loss + geometry).
# Fixes: evans2015 rib width basis design_target (p.8 prints the 750 nm design width of the 633-850 nm rib data),
# "as low as" channel losses statistic best (rule 7), ring polarization cleared (not stated for the ring measurements,
# D673); qiu2018a gap-series widths moved to linewidth_mhz like the 460 nm device (same Fig. 6(b) quantity, "FWHM" in
# text and axis); tien2011 1060 nm notch width note (Fig. 3(a) vector data about 22 MHz) and the 2.9 dB/m exclusion
# re-argued from Fig. 1.
components:
  cmp_lit_tien2011_ring_r5mm_t40:
    notes: "Fab empty: the acknowledgment thanks 'LioniX BV for fabrication' (p.6); LioniX BV (2011 entity) is not in the registry and is kept separate from org_lionix_international (D278, D545; bauters2013 / mu2016 / zhuang2016 precedent): reported as a missing fab org. All authors at UCSB; no facility named. Intrinsic Q and waveguide loss of Table 1 come from curve fits, the intrinsic Q 'by comparing the spectra of similar resonator structures with various power coupling ratios' (p.4), i.e. the coupling regime is fixed from data (D403 met, D425 lee2012 precedent); the coupling gaps are not stated, so all couplings of one R / t / w design share this row (rule 9). Input TE (p.3). Table 1: at 1310 nm 'High loss' (no resonance), at 1550 nm no transmitted power (substrate leakage). Same design used as the 1060 nm notch filter of Fig. 3(a) (p.5). Check (D417): f / 16 MHz at 1060 nm is about 17.7 M, i.e. the printed 16 MHz notch bandwidth equals the intrinsic linewidth of Q_i 18 M; the Fig. 3(a) vector trace gives a half-depth width of about 22 MHz at a 10.6 dB notch, which matches Q_i 18 M with 0.8 % coupling under-coupled (arithmetic check: about 24 MHz and 10.2 dB, group index about 1.47 from the Table 1 Q / loss pairs). The figure supports Q_i 18 M; the printed 16 MHz is the outlier and is kept as printed (m3 note)."
    why: 'p.6 Fig. 3(a) vector data (half-depth width about 0.083 pm = 22 MHz, depth 10.6 dB) and p.5 Sec. 4: the earlier note did not say which printed number the figure supports'
  cmp_lit_tien2011_adddrop_ring_r2mm_t80:
    notes: "Fab empty: the acknowledgment thanks 'LioniX BV for fabrication' (p.6); LioniX BV (2011 entity) is not in the registry and is kept separate from org_lionix_international (D278, D545; bauters2013 / mu2016 / zhuang2016 precedent): reported as a missing fab org. All authors at UCSB; no facility named. Intrinsic Q and waveguide loss of Table 1 come from curve fits, the intrinsic Q 'by comparing the spectra of similar resonator structures with various power coupling ratios' (p.4), i.e. the coupling regime is fixed from data (D403 met, D425 lee2012 precedent); the coupling gaps are not stated, so all couplings of one R / t / w design share this row (rule 9). Input TE (p.3). Radius conflict (D417): Table 1 and p.5 text print 2 mm, the Fig. 3(c) caption 1.5 mm; 2 mm entered (printed twice; a ~1 % round-trip loss, Q_i 7 M and a ~300 MHz width with ~5 % per coupler are consistent with a 2 mm ring at a group index near 1.46 and not with 1.5 mm, arithmetic check only). Table 1 also lists 2.9 dB/m for this ring, but the p.5 sentence gives 2.9 dB/m as the loss of the 2.8 um x 80 nm waveguides of ref. [15] (the authors' earlier paper; also p.2-3) and the Fig. 1 experimental cross at R = 2 mm reads about 3.66 dB/m (entered as m9, consistent with Q_i 7 M): 2.9 dB/m not entered (rule 3, D80i, D259). Round-trip loss in the ring ~1 % from the fit (p.5): no registry parameter. Over-coupled by design to reduce the drop-port loss (p.5). Table 1: multimode at 1310 / 1060 nm. Sibling 80 nm rings of Fig. 1: cmp_lit_tien2011_ring_r1mm_t80, cmp_lit_tien2011_ring_r1p5mm_t80."
    why: 'p.3 Fig. 1 (cross at R 2.0 mm, 3.66 dB/m, PDF vector data): the earlier group-index argument also fails for the entered 1550 nm 50 nm pair (Q 1 M / 20.8 dB/m implies ng about 1.18), so the exclusion rests on the ref. [15] attribution and Fig. 1'
