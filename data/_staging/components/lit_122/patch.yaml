    qualifier: le
    condition: pump power at which internal net gain is reached (-15 dBm signal); printed as exceeding 25 mW; gain saturates near 125 mW
    notes: 'printed ''exceeds 25 mW'' for both 1538 and 1550 nm (p.8); Fig. 6(c) shows SE about 6.8 dB already at 25 mW, the first pump point above 0 mW, against the 0.77 dB propagation-loss band, so the threshold lies at or below 25 mW (le); kuyken2011 / li2025 transparency precedent'
    why: 'p.9 Fig. 6(c): at the first measured pump point (25 mW) the 1538 nm SE (about 6.8 dB) is far above the 0.77 dB loss, so 25 mW bounds the threshold from above; an unqualified 25 mW reads as the transparency point'
