# Audit patch lit_122 (fresh-context audit 2026-11-11, DevLog/audits/2026-11-11-lit_122-audit.md).
# 138 metrics: 111 ok / 25 imprecise / 2 wrong (deleted); 21 components: 18 ok / 3 imprecise / 0 wrong, 0 deleted; 2 misses added (2 metrics).
# Coordinator rulings open: Q1 zhang2026 Jilin fab (recommend keep, no op), Q2 mangal2021 imec / CMST fab (recommend keep) and
# Ghent Photonics Research Group facility -> borderline fab (patched below; to keep the batch value, drop the
# cmp_lit_mangal2021_backside_si_microlens_eb component op), Q3 yang2021 BUPT on the butt rows only + Applied Optoelectronics org
# round (no op), Q4 cao2025 fab empty (no op), Q5 cao2025 single / dual pass on one row (keep, no op), Q6 yang2021 design rows
# (keep; laser platform and duplicate MFD rows patched), Q7 moodie2024 family rows (keep, no op), Q8 cao2025 on-chip gain basis
# (keep measured, no op). To skip the two derived -10 dBm gain rows, drop add_metrics cmp_lit_zhang2026_tby_er_su8_amp_4mm-m7 / -m8.
components:
  cmp_lit_yang2021_monolithic_eel_design:
    platform: iii_v_on_si_epi
    notes: 'Appendix calls the simulated laser a DFB with deep ridge mesa (p.9); Sec. 2 calls the design an EEL. Rate-equation simulation with commercial packages (p.9). Platform iii_v_on_si_epi: the design is a III-V stack on a 2.4 um InP buffer grown on the Si substrate (selective-area growth preferred, p.2; growth on the Si substrate or the top Si of an SOI wafer, p.2; Fig. 1(c)).'
    why: 'p.2 and p.6: the monolithic laser is III-V grown on the Si substrate (InP buffer on Si, Fig. 1(c)); the registry value for epitaxial III-V on Si is iii_v_on_si_epi (merged chen2016, koninck2025), not inp'
  cmp_lit_mangal2021_uniform_gc_490nm:
    notes: 'Fab org_imec (borderline, D84b): acknowledgment thanks imec''s SiPh integration team for the dies fabricated from 200-mm wafer-scale processing (p.13); three of five authors list an imec affiliation (p.1; CMST is printed as Ghent University-imec). mangal2019 / mangal2019a / mangal2020 rows carry org_imec for the same family of dies. No metal reflector (to allow front- and backside fiber tests). Backside coupling measured on a separate chip thinned to 100 um, polished and AR-coated. Per-interface frontside-to-backside penalty printed as 3.75 dB (p.10; the Fig. 9(a) 7.5 dB label is the two-interface difference). Grating beam angle in Si 4.06 deg (design, 10 deg in oxide). Backside GC with metal reflector 2.3 dB and apodized 1.5 dB are cited (refs. 37, 45, 46), not entered.'
    why: 'p.1: Mangal, Snyder and Van Campenhout list imec (affiliation 2) and affiliation 1 reads Ghent University-imec; the note said two authors at imec. Fab value unchanged (Q2)'
  cmp_lit_mangal2021_backside_si_microlens_eb:
    fab_org_ids: org_centre_for_microsystems_technology;org_ghent_photonics_research_group
    facility_org_ids: ''
    notes: 'Fab borderline (D84b, staff / group thanks for fabrication steps of this interface): org_centre_for_microsystems_technology (CMST staff thanked for microlens RIE and die lapping, p.13; mangal2019a precedent) and org_ghent_photonics_research_group (thanked for help with the SiN AR deposition, p.13; mangal2020 precedent, where the same kind of thanks set a borderline fab and no facility). No facility: the acknowledgment thanks the group and names no place where the work was performed (D72, D84b; mangal2019 differs because its text says the deposition was done at intec Photonics, D470). Grating die from imec (see GC row). Substrate printed 600 um (p.6-7, design; thinning +/- 1 um) vs 580 um (Table 2; Fig. 9(b), 9(c), 11 insets; D417). Lens diameter 270 um (design aperture radius 135 um, fitted 138.29 um, Fig. 7); lens offset 43 um from the grating; backside-to-frontside alignment within +/- 1 um; lens rms roughness < 10 nm (40 x 40 um2); Si backside rms 10-15 nm. Angular 1-dB tolerance +/- 0.6 deg (Fig. 10(b)) not entered: no registry parameter (gap). Simulated ROC tolerance -100 / +180 um for 1 dB (Fig. 4). AR coating improved SMF-to-TEC40 coupling by 2 dB (Fig. 9(c)). Projected < 2.8 / < 2 dB with reflector gratings (Table 2) are projections, not entered. 0.5 dB misplacement penalty is cited from ref. 37.'
    why: 'p.13 thanks the Photonics Research Group (INTEC), Ghent University for help with SiN deposition: group / staff thanks never set facility_org_ids (Contract v7, D84b, D72); thanks for a fabrication step of this component are a borderline fab, as CMST on the same row and org_ghent_university on mangal2020 (Q2)'
metrics:
