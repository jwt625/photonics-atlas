# Audit patch lit_29 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_29-audit.md).
# 168 metrics: 155 ok / 13 imprecise / 0 wrong; 27 components: 20 ok / 7 changed / 0 deleted; 20 misses added.
# Not covered here (coordinator decisions, see the audit file): registry orgs VTT, Europractice, Southampton
# Nanofabrication Centre; registry gaps.
components:
  cmp_lit_liu2025a_gap_crossing_perp:
    notes: 'Fabricated by the authors with in-house facilities (p.4 Sec. III; p.5 Fig. 11 in-house fabricated chip); 10 of 13 authors at Guangdong University of Technology, 2 at Sun Yat-sen University,
      1 at Warsaw University of Technology (p.1): fab_org_ids borderline (D84b, huang2019a precedent). Cross waveguides C1 / C2 (with gaps) cross through waveguides C3 / C4; every measured path passes two
      crossings (p.2-3, p.4 Fig. 8(a)). Normalization of the butt-coupled transmission not stated. Lateral crossing gap 5 um design (p.3), 4.87 um measured mean of 10 samples (p.5 Fig. 10(c)): not entered
      (gap_nm is the vertical gap of multilevel crossings; registry gap). Fig. 1(b) labels n_core 1.559 / n_clad 1.569, swapped relative to the text (p.2). Simulated gap sweeps (Fig. 3) not entered.'
    why: 'p.1 author list: 13 authors, 10 with Guangdong University of Technology affiliations (three schools), 2 Sun Yat-sen University, 1 Warsaw University of Technology; the note said 9 of 12'
  cmp_lit_liu2025a_gap_crossing_angled:
    notes: 'Fabricated by the authors with in-house facilities (p.4 Sec. III; p.5 Fig. 11 in-house fabricated chip); 10 of 13 authors at Guangdong University of Technology, 2 at Sun Yat-sen University,
      1 at Warsaw University of Technology (p.1): fab_org_ids borderline (D84b, huang2019a precedent). Angles: C1 crosses C3 / C4 at 36.8 deg, C2 crosses C3 / C4 at 33.5 deg (p.5 Sec. III; p.6 Fig. 13);
      each path passes two crossings. Crossing angle not entered (no registry parameter). The text prints a value pair per mode and polarization for the two launch ports without an explicit port order,
      so each pair is entered as a range. Core height 4 um from the Fig. 1(b) cross-section (m6, audit).'
    why: 'p.1 author list: 13 authors, 10 with Guangdong University of Technology affiliations (three schools), 2 Sun Yat-sen University, 1 Warsaw University of Technology; the note said 9 of 12'
  cmp_lit_liu2025a_adiabatic_tapered_dc:
    notes: 'Fabricated by the authors with in-house facilities (p.4 Sec. III; p.5 Fig. 11 in-house fabricated chip); 10 of 13 authors at Guangdong University of Technology, 2 at Sun Yat-sen University,
      1 at Warsaw University of Technology (p.1): fab_org_ids borderline (D84b, huang2019a precedent). Only simulated coupling is reported (p.4 Fig. 7(b)); the fabricated DCs (p.4 Fig. 8(b), (c)) are shown
      by output near-field patterns only (p.5 Fig. 11(b)). Class per D165 (asymmetric DC used for mode conversion). Text labels W3 as an FMC width (typo; SMC per Fig. 7(a)). S-bend length 5 mm not entered.'
    why: 'p.1 author list: 13 authors, 10 with Guangdong University of Technology affiliations (three schools), 2 Sun Yat-sen University, 1 Warsaw University of Technology; the note said 9 of 12'
  cmp_lit_weigel2023_mwrn_16x4:
    class: splitter.other
    notes: 'Fab empty: fabrication is described in passive voice and the PolyBoard platform is called our technology (p.1, p.3-4), without a statement that the authors or a named org fabricated the chips
      (D80b; D84a M1D.4 precedent); all authors Fraunhofer HHI. Each path: three cascaded 1x1 3D MMIs and one 4x1 MMI (p.3). Output O2 has higher loss from a fabrication error (omitted compensation layer
      in layer 2, p.4), not entered. Reproducibility over six devices on two wafers (p.6 Fig. 5: max deviation 1.0 dB between identical devices and outputs, within 1.5 dB except O2) not entered (no parameter).
      Class splitter.other (audit 2026-10-29): a crossing-free 16-to-4 combining / routing network of 4x1 MMI combiners and vertical 1x1 3D MMIs; it contains no waveguide crossing, and its losses include
      the inherent 6 dB 4x1 combining loss (p.2-4). 3D MMI losses (1 dB, 2.5 dB for three cascaded, 2.0 dB simulated) come from refs. [27] / [29] and are not entered. The 4x1 MMI has only its inherent 6
      dB combining loss stated (no own performance; not a row).'
    why: 'p.1-3: the 16x4 MWRN is crossing-free by design (no waveguide crossing to characterize, no crossing_loss_db possible); each path holds three 1x1 3D MMIs and one 4x1 MMI combiner with an inherent
      6 dB loss (p.3; p.5 Table I); crossing.multilevel rows (fu2023, nan2025) are single inter-layer crossings. A 16-to-4 combiner network is splitter-family (n_inputs / n_outputs / excess_loss_db / pitch_um
      all valid for splitter)'
  cmp_lit_shahwar2025_tir_mzi_pbs:
    notes: 'Manufactured in an MPW run at VTT (p.7 Sec. 6; all authors VTT, one also Aalto): VTT missing from the registry (fab role). Best device of a set with slightly different mirror angles (p.8 Sec.
      7). MMI dimensions not entered (MMI parameters not allowed for polarization). Fig. 10 caption gives 15 dB PER over about 120 nm (text: 80 nm) and swaps the TE / TM colours relative to the legend:
      caption span not entered. Model-fitted polarization crosstalk (-20 / -18 dB, p.11) not entered. Setup PER limit 20 dB (p.10). Design lower-arm angle 117 deg (p.7) vs 117.5 deg fabricated (p.8, p.10).'
    why: 'page markers of text.md: Sec. 6 Fabrication (VTT MPW statement) is on p.7, Sec. 7 Measurements on p.8-10, crosstalk sentence on p.11; the note cited pages one higher and section numbers one lower'
  cmp_lit_shahwar2025_tir_mirror_46p5deg:
    notes: 'Manufactured in an MPW run at VTT (p.7 Sec. 6; all authors VTT, one also Aalto): VTT missing from the registry (fab role). Mirror cascades up to about 100 mirrors (p.9 Fig. 9(a), (b)); footprint
      < 5 x 15 um2 per mirror (p.7 Sec. 6; entered as m3). Physical mirror angle not entered (no parameter). Wavelength not stated (broadband SLED source).'
    why: p.7 Sec. 6 holds the VTT MPW statement and the mirror footprint (text.md page markers); the note cited p.8 Sec. 5
  cmp_lit_shahwar2025_tir_mirror_117p5deg:
    notes: 'Manufactured in an MPW run at VTT (p.7 Sec. 6; all authors VTT, one also Aalto): VTT missing from the registry (fab role). Mirror cascades up to about 100 mirrors (p.9 Fig. 9(c), (d)); footprint
      < 5 x 15 um2 per mirror (p.7 Sec. 6; entered as m3). Physical mirror angle not entered (no parameter). Wavelength not stated (broadband SLED source).'
    why: p.7 Sec. 6 holds the VTT MPW statement and the mirror footprint (text.md page markers); the note cited p.8 Sec. 5
