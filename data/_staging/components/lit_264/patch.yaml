# Audit patch lit_264 (fresh-context audit 2026-11-23, DevLog/audits/2026-11-23-lit_264-audit.md).
# 133 metrics: 115 ok / 9 imprecise / 9 wrong; 27 components: 16 ok / 11 imprecise / 0 wrong. 30 misses added.
# Wrong: benedikovic2016 group back-reflection estimates copied onto 9 device rows (D254 / D552), moved to component notes.
# Imprecise: wang2017b simulated conditions (values match the 2D curves of Fig. 4(a)), two Fig. 7 range notes; zou2015 Fig. 2(a) conflict note.
# Misses: benedikovic2016 geometry on sibling rows (fill factor, grating width, waveguide width, fiber MFD, wafer stack, coupling angle);
# zou2015 full-etch depths (3) and the 3 % back reflectivity on the P_GR 890 nm design (judgment f).
components:
  cmp_lit_benedikovic2016_uniform_lin:
    notes: 'Layout: linear (straight-trench) grating with 500 um adiabatic taper to the 300 nm waveguide (p.8 Sec. 2.3). Paper headline: peak measured CE -2.7 dB (54 %) for the uniform and -2.5 dB (56 %) for the apodized couplers, stated over all three layouts (''impact of different coupler layout configurations ... negligible'', p.9); not tied to one layout or (apodized) to one apodization design, so not entered on any row (D159); per-layout figure reads instead. Measured spectra shifted ~40 nm to longer wavelengths, attributed to a ~40 nm fabrication bias (SEM, p.9, Fig. 9). Ripple 0.2-0.6 dB across geometries and layouts (p.10). Nominal 2D design values (F-EEM / FDTD, p.6-8) entered on this straight-trench row, the layout the 2D vertical-cross-section model describes; the focusing siblings carry only their own measured values. Fab empty: passive ''The structures were fabricated on an SOI wafer'' with EBL and ICP-RIE (p.8-9) names no org; authors at IEF Universite Paris Sud, NRC Canada, Universidad de Malaga and University of Zilina (D80b). SEM data bars print ''NRC'' (Figs. 6-8), not a fabrication statement. Fringe-based back-reflection estimate (p.10): about 6 % for the linear-taper group (Fig. 6(a)) and ~3 % for the curved (focusing) group (Figs. 7(a), 8(a)); stated per group, while the ripple differs inside a group (Fig. 6(a): about 0.4 dB peak-to-peak uniform, 0.25 dB two-step, 0.15 dB continuously apodized) and the paper maps ripple 0.2-0.6 dB to 3-6 %, so not entered per device (D254 / D552).'
    why: 'p.10: back-reflection estimates are group statements; per-device rows deleted (D254 / D552), value kept in notes'
  cmp_lit_benedikovic2016_uniform_foctap:
