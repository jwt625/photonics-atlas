# Audit 3 (sweep + gap-fill audit, 2026-10-20); applied after patch.yaml, sweep.yaml, gapfill.yaml.
components:
  cmp_ofc2026_w3e4_mdm_mux_4ch:
    notes: Multiplexes four fundamental-mode inputs into TE1 / TE0 / TM1 / TM0 of one multimode bus; mux and demux used back to back around the bus in the 6.4 Tbps transmitter. Fabricated on a 300-mm CMOS
      platform; foundry not named (affiliations Zhangjiang Laboratory and Fudan University), fab_org_ids empty. Wafer-level IL standard deviation < 0.15 dB at 1550 nm for all four channels over 9 chips
      (p.~2 Sec. 3, Fig. 2(f)) entered as insertion_loss_db with statistic std (m5, D81). MRM array (EO bandwidth 62 GHz at 0 V, > 67 GHz at -3 V) belongs to the EO atlas, not entered.
    why: 'Stale note (D81 gap-fill / registry): std row m5 (ofc_03 gapfill)'
  cmp_ofc2026_tu2j5_ec_5mode:
    notes: 'Fabricated by Applied Nanotools via an MPW run (EBL + RIE) (p.~1); ''fabrication of the prototypes was supported by CMC Microsystems'' (p.~3 Funding) -> fab_org_ids (MPW access, rule 12, D83d).
      Couples to a polarization-maintaining highly elliptical-core fiber (HECF, 5 spatial modes x 2 polarizations). Minimum feature constraint 120 nm. Abstract: 3-dB bandwidths spanning the C and L bands
      (no number; simulated flat response Fig. 2(a)).'
    why: note contradicts the field after the D83d sweep op (CMC moved from facility_org_ids to fab_org_ids); D81 now allows crosstalk_db for fiber_chip_coupler (10-mode)
  cmp_ofc2026_tu2j5_ec_10mode:
    notes: 'Fabricated by Applied Nanotools via an MPW run (EBL + RIE) (p.~1); ''fabrication of the prototypes was supported by CMC Microsystems'' (p.~3 Funding) -> fab_org_ids (MPW access, rule 12, D83d).
      Couples to a polarization-maintaining highly elliptical-core fiber (HECF, 5 spatial modes x 2 polarizations). Minimum feature constraint 120 nm. Fabricated with a deep-learning prefab model compensating
      the ANT SiN process; only measured near-field profiles (no measured efficiency). Simulated modal crosstalk of TE04 below -15 dB ''for most of the simulated range'' (p.~2): crosstalk_db is allowed
      for fiber_chip_coupler since D81, but the bound is not stated over a defined range, not entered.'
    why: note contradicts the field after the D83d sweep op (CMC moved from facility_org_ids to fab_org_ids); D81 now allows crosstalk_db for fiber_chip_coupler (10-mode)
  cmp_ofc2026_th1d5_laser_trim_phase_shifter:
    notes: 'Post-fabrication permanent phase trimming with a Femtum wafer trimming system on a ficonTEC wafer-level tester; segments of 45 um along the ring. Phase shifts 3.9-11 rad on single rings (> half
      an FSR) and 0.76 / 0.68 rad on the double-ring Vernier entered as phase_shift_pi (m3-m5, D81). Loss per rad ~0.05-0.1 dB/rad has no registry parameter; no resonance drift after 125 C / 1000 h annealing
      not entered (D83g: bake stability of a permanent trim is not a retention time). Chip (SiN laser + test rings) ''fabricated by IMEC'' (p.~2; IMEC The Netherlands = org_imec).'
    why: 'Stale note (D81 gap-fill / registry): phase_shift_pi m3-m5 (ofc_03 gapfill); D83g drop of the bake test'
  cmp_ofc2026_th3f2_apd_l10_oband:
    notes: Fabricated on imec's 300 mm SiPho platform [4] (pNA Sec. 2). Waveguide-coupled lateral SACM APD; nominal WA / WM / WC 200 / 100 / 75 nm; TEM of a recessed Ge region 204 nm wide, 193 nm long (device
      not specified). Breakdown voltage ~-9.5 V entered as breakdown_voltage_v (m12, D81). Sec. 2 precedes the first page-image reference, so most locators are pNA. O-band 70 GHz / 2 A/W was first reported
      in [3]; values here are this paper's own measurement.
    why: 'Stale note (D81 gap-fill / registry): breakdown_voltage_v m12 (ofc_03 gapfill)'
  cmp_ofc2026_th3f2_apd_l30_cband:
    notes: Fabricated on imec's 300 mm SiPho platform [4] (pNA Sec. 2). Waveguide-coupled lateral SACM APD; nominal WA / WM / WC 200 / 100 / 75 nm; TEM of a recessed Ge region 204 nm wide, 193 nm long (device
      not specified). Breakdown voltage ~-9.5 V entered as breakdown_voltage_v (m12, D81). Sec. 2 precedes the first page-image reference, so most locators are pNA. Sec. 2 gives 90 GHz at 1.5 A/W (-7 V),
      while Sec. 3, abstract and conclusion give 100 GHz at 1.5 A/W (-7 V); both entered.
    why: 'Stale note (D81 gap-fill / registry): breakdown_voltage_v m12 (ofc_03 gapfill)'
