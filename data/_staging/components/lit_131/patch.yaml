# Audit patch lit_131 (fresh-context audit 2026-11-14, DevLog/audits/2026-11-14-lit_131-audit.md).
# 131 metrics: 127 ok / 4 imprecise / 0 wrong; 21 components: 21 ok / 0 imprecise / 0 wrong; 0 deleted; 27 misses added.
# Coordinator rulings open (audit Q1-Q8): Q1 ren2025 PDE author_estimate (no op), Q2 ma2024 PWB 2-3 dB author_estimate (no op),
# Q3 ma2024 PLC class wdm.other (no op; to switch, add components: cmp_lit_ma2024_plc_combiner: class splitter.other),
# Q4 ma2024 kappa / kL kept out (no op), Q5 ma2024 21.9 GHz current conflict (no op), Q6 sun2026 Fig. 4 rows and the D153 stack
# adds (to drop the stack rows, remove the adds cmp_lit_sun2026_opa_s1/_s2/_s3/_s4/_s6/_s7-m7..-m10 and
# cmp_lit_morenopozas2026_swg_grating_antenna-m9/-m10), Q7 fab orgs Henan Shijia / Yunnan University (org round, no op),
# Q8 ren2025 dark count per gate (registry gap, no op).
metrics:
  cmp_lit_kim2023_pmma_metalens_3layer-m5:
    basis: derived
    notes: printed 1.8 um per PMMA layer (p.1, p.3, p.7; 5.4 um for three layers, p.7); um -> nm (D157 / D256)
    why: p.3 Sec. 3 and p.7 Sec. 5 print the layer thickness as 1.8 um; the nm form is not printed, so the stored 1800 nm is a unit rescale (D157 / D256), not design_target
  cmp_lit_kim2023_pmma_oam_metasurface_3layer-m2:
    basis: derived
    locator: p.1 Abstract; p.3 Sec. 3; p.8 Sec. 6
    notes: printed 1.8 um per PMMA layer (p.1, p.3); three stacked OAM layers, 5.4 um total (p.8); um -> nm (D157 / D256)
    why: p.3 Sec. 3 prints the layer thickness as 1.8 um; the nm form is not printed, so the stored 1800 nm is a unit rescale (D157 / D256), not design_target; the OAM stacking sentence (5.4 um total) is on p.8, not p.9
  cmp_lit_ren2025_pwb_tfln_spad-m8:
    basis: derived
    notes: printed 50 nm (selected h); nm -> um (D157 / D256); top oxide elsewhere 1 um
    why: p.3 Sec. 2.1 prints h = 50 nm; stored as 0.05 um the value is a unit rescale (D157 / D256); the note already said nm -> um while the basis stayed design_target
  cmp_lit_morenopozas2026_cassegrain_ssc_x310-m3:
    notes: abstract 'exceeding 200 nm' (1.45-1.65 um), conclusion '200 nm'; from the halved back-to-back spectrum. The paper's 1-dB bandwidth is the span with IL below 1 dB (absolute), not 1 dB from the best point; Fig. 7 measured minimum about 0.56 dB near 1.52 um and both band edges about 0.9 dB, so the registry criterion (within 1 dB of peak) also holds over at least the same 200 nm span
    why: p.2 Abstract and p.6 Sec. V define the paper's 1-dB bandwidth as sub-decibel loss, while the registry bw_1db_nm is relative to the peak; Fig. 7 (audit render) shows the bound holds under both, which the row did not say
