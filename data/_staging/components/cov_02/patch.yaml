  cmp_lit_mehta2026_elsfp_module-m4:
    notes: 'Printed total variation less than +/-0.8 dB (p.3; abstract p.1), written as max-min < 1.6 dB. Fig. 5(c) re-read (500 dpi): Delta P from about +0.84 dB (L0) to about -0.83 dB (L7) and bars from about 9.15 to 7.48 dBm, so the plotted max-min is about 1.67 dB, slightly above the printed bound; printed value kept.'
