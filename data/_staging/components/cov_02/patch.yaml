  cmp_lit_levy2026_dfb_array_8ch-m4:
    value: 198.1
    value_max: 204.4
    basis: extracted_from_figure
    method: ''
    condition: closed loop, laser L1 as reference, steady state after acquisition (t = 1.3 to 5 min in Fig. 8(c)); range of the seven adjacent spacings
    notes: 'Read off Fig. 8(c) (400 dpi render): lowest Delta L2-L3 about 198.1-198.5 GHz, highest Delta L6-L7 about 204.1-204.4 GHz, about +/-0.3 GHz. Printed reduction to +/-3.5 GHz (p.5): the locked spread (about 6.3 GHz) fits a 7 GHz window but is not centred on 200 GHz; 204.4 GHz lies outside 200 +/- 3.5 GHz.'
