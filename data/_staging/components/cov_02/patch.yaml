    notes: 'Printed temperature tuning coefficient of about 112 pm/C = (1316.19 - 1310.58 nm) / 50 K, the authors'' two-point arithmetic on their own measured wavelengths (D80a); pm/C equals pm/K.'
    why: 'p.7-8 Sec. 2.2: the coefficient is the endpoint difference over 15-65 C (explicit arithmetic, D80a)'
