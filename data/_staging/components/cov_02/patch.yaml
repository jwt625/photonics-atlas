    basis: extracted_from_figure
    method: ''
    condition: open loop, t = 0 of the L1-reference acquisition (all lasers at 70 mA initial bias); range of the seven adjacent spacings
    notes: 'Read off Fig. 8(c) at t = 0 (400 dpi render, gridlines located on the pixel grid): lowest Delta L5-L6 about 188.6 GHz, highest Delta L3-L4 about 209.8 GHz, about +/-0.3 GHz. Printed spacing error +/-12.5 GHz for this sample (p.5); that error is a window around the array''s own spacing, not around 200 GHz (see m5).'
