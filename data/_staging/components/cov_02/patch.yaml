  cmp_lit_levy2026_dfb_array_8ch-m5:
    value: 198.4
    value_max: 205.4
    basis: extracted_from_figure
    method: ''
    condition: closed loop, laser L5 as reference, chuck temperature steps of 20 and 30 C over 40 min, after acquisition (t >= 2.5 min in Fig. 9(c)); range of the seven adjacent spacings
    notes: 'Read off Fig. 9(c) (450 dpi render): lowest about 198.4 GHz (Delta L2-L3 near 13-16 min, Delta L3-L4 near 34 min), highest about 205.3-205.5 GHz (Delta L7-L8 near 6.5 min), about +/-0.3 GHz. Printed spacing error < 7 GHz over the whole excursion (p.6 caption and text; p.1 abstract): the two dashed lines of Fig. 9(c), at about 198.5 and 205.6 GHz, bound a 7 GHz window, so the printed error is the width of that window, not a deviation from 200 GHz.'
