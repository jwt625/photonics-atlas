# Audit patch cov_02 (fresh-context audit 2026-11-07, DevLog/audits/2026-11-07-cov_02-audit.md).
# 119 metrics: 105 ok / 8 imprecise / 6 wrong; 14 components: 11 ok / 3 imprecise / 0 wrong.
# Wrong: levy2026 m2 (basis), m3-m5 (spacing-error bounds centred on 200 GHz contradict Figs. 8(c), 9(c); replaced by
# figure reads), mehta2026 m3 (per-channel placement error entered as an adjacent-spacing range; deleted),
# xie2026a m34 (static current tuning in pm/mA is not an FM efficiency, D83g; deleted).
# No misses added (optional candidates listed in the audit record). No fab / facility change.
components:
  cmp_lit_zhou2022b_lensed_pmf_coupling:
    class: fiber_chip_coupler.edge
    notes: 'Coupling interface inside the 14-pin butterfly module (p.2): AR-coated laser facet to a lensed PM fiber; class edge as for the merged laser-facet-to-lensed-fiber rows (andreou2019, huang2019). Lens type, alignment method and the plane of the reference power not stated; value as printed. Fab empty (D80b).'
    why: 'p.2 Sec. 2: the COS facet is coupled to a lensed PM fiber; merged laser-facet-to-lensed-fiber couplings are fiber_chip_coupler.edge (andreou2019, huang2019), other is for 3D-printed / tapered-fiber interfaces'
  cmp_lit_levy2026_dfb_array_8ch:
    notes: 'Platform and fab empty: the paper places the earlier single-epi 8-lambda array [33] in Intel''s 300 mm hybrid SiPh platform (Si waveguide grating before III-V bonding, p.2), but for this die only says ''fabricated at a nominal spacing of 200 GHz'' (p.4, passive); all authors Intel (D80b, D422). The die photo places the DFB array on the PIC (p.5 Fig. 7(a)); integration method not stated. Journal extension of the authors'' OFC 2026 paper [37] (values kept, D408); the chip-on-board demonstration is attributed to [37] (no values taken from it). Values are the array under closed-loop control on a probed, temperature-controlled chuck with vertical output coupling (p.5). Steady-state bias currents about 65-91 mA (Fig. 8(a,b)). Spacing rows m3-m5 are figure reads of the plotted adjacent spacings (Fig. 8(c), Fig. 9(c)); the printed spacing errors (+/-12.5 and +/-3.5 GHz, < 7 GHz) are windows around the array''s own spacing, not around 200 GHz (the dashed 7 GHz window of Fig. 9(c) spans about 198.5-205.6 GHz). Not entered: estimated 120 mW integrated-controller power (65 mW ring heater, 35 mW p-i-n drivers, 20 mW lock-in and control; p.6) except the ring-heater share on the ring row; 800-1300 Hz estimated loop bandwidth (p.6); marker tones 25.3-46.5 kHz (p.5); Fig. 8(d) spacings with L5 as reference. VOAs, p-i-n modulators, MMI combiners and the output coupler: no quantitative performance.'
    why: 'Spacing rows replaced by figure reads (p.5 Fig. 8(c), p.6 Fig. 9(c)); journal-extension rule is D408, not D259; die photo p.5 Fig. 7(a)'
  cmp_lit_mehta2026_elsfp_module:
    notes: 'Fab empty: no fabrication statement naming an org (D80b); authors at NVIDIA and Lumentum; the acknowledgement thanks O-NET collaborators for supporting ELS packaging and evaluation-board development (p.5, not a shared facility, not in the registry; see report). Design numbers cited to [9-11] (8 dBm per lambda in fiber, 100 mW SOA output) are not entered. Channel-spacing error not entered: abstract < +/-15 GHz, text within +/-16 GHz (p.3, Fig. 5(b)); Fig. 5(b) plots nine per-channel errors, one per measured channel frequency next to a linear fit, so the error reads as each channel''s deviation from the fitted grid, not an adjacent-spacing deviation, and no parameter holds a frequency deviation in GHz. Fig. 5(b) shows nine channels (L0-L8) while the text and Fig. 5(a), (c), (e), (f) have eight. Module efficiency includes LD bias circuitry and PCB / parasitic losses, excludes TEC power (p.3). Not entered: Fig. 8(a) junction temperature versus ex-facet power (no parameter); Fig. 5(b) channel frequencies (about 228.8-230.4 THz). Simulated link-efficiency results (Figs. 6-7) are system modeling, not component values.'
    why: 'p.4 Fig. 5(b) render: nine Err. in CS markers for nine channel-frequency points (L0-L8) beside a linear fit; p.5 Sec. IV ties CS error to wavelength placement; m3 deleted'
