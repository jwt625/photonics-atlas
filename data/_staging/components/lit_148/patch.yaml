# Audit patch lit_148 (fresh-context audit 2026-11-15, DevLog/audits/2026-11-15-lit_148-audit.md).
# 360 metrics: 344 ok / 16 imprecise / 0 wrong; 37 components: 28 ok / 9 imprecise / 0 wrong.
# 11 envelope copies deleted and replaced by 14 per-device figure reads (D552); 4 misses added. After the patch: 37 components, 367 metrics.
# Coordinator rulings open (audit Q1-Q5):
# Q1 sacher2019 family-level ranges (recommended, ops below): the printed minimum crossing loss 0.07-0.09 dB, minimum divider
#    excess loss 0.19-0.47 dB and divider 1-dB bandwidth 70-172 nm summarize all devices (Figs. 8 / 11 show the device spread),
#    so the per-device copies are deleted (D552 hu2020, D254 / D159) and per-device, per-polarization minima are read from the
#    cached embedded figure rasters (the extreme reads reproduce the printed endpoints: 0.066 / 0.085 dB and 0.190 / 0.466 dB).
#    Bounds printed "in all cases" stay on every row (crosstalk > 20 dB, split within 1.1 dB of 50:50; D552 lin2023).
#    Alternative (keep envelopes): drop the delete_metrics / add_metrics for sacher2019 and the 7 component note edits.
# Q2 sun2017 fab org_university_of_toronto via the TNFC acknowledgment: keep (no op; D448, D84b borderline); TNFC facility
#    waits for the org round.
# Q3 wu2020a insertion losses: keep the four measured rows with conflict notes (D417); conclusion values and PDL moved from
#    c_band to 1550 nm inferred (ops below); abstract "< 1 dB for both" stays out.
# Q4 li2018a D-MWC TE2 "crosstalk" +9.08 / +12.01 dB: keep in notes (no op).
# Q5 chen2006 fabricated rows platform soi -> soi_rib (ops below; printed slab ~0.02 um under a ~0.34 um rib).
