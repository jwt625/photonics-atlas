metrics:
  cmp_lit_chen2006_plain_crossing_design-m3:
    locator: p.1 Fig. 1 caption
    why: "The Fig. 1 caption (plain crossing inset, waveguide width 0.3 um) is on p.1 of the text / render, not p.2"
  cmp_lit_wu2020a_swg_mmi_crossing-m1:
    notes: "Printed 'averaged insertion loss is around 1.1 dB'; averaging basis (wavelength or 3-crossing cascade) not stated. Fig. 7 TE trace about 1.0-1.2 dB over 1530-1565 nm; the conclusion's 1 dB (m3) reads as the 1550 nm value."
    why: "p.7 Fig. 7: TE trace is flat near 1.0-1.2 dB, so ~1.1 dB (band average) and 1 dB (conclusion) are not a real conflict; note reworded"
  cmp_lit_wu2020a_swg_mmi_crossing-m3:
    band: ""
    wavelength_nm: 1550
    wavelength_inferred: "true"
    notes: "Conclusion value; no wavelength printed with it. Wavelength inferred: p.7-8 ties the low insertion loss and PDL to 1550 nm, and Fig. 7 at 1550 nm reads about 1.1 dB (TE). Band-averaged TE value ~1.1 dB in m1."
    why: "p.7-8 'low insertion loss and low polarization-dependence loss at 1550 nm wavelength'; Fig. 7 (p.7 render) TE at 1550 nm about 1.1 dB. c_band was imprecise for a single printed value"
  cmp_lit_wu2020a_swg_mmi_crossing-m4:
    band: ""
    wavelength_nm: 1550
    wavelength_inferred: "true"
    notes: "Conclusion value; no wavelength printed with it. Wavelength inferred: p.7-8 ties the low insertion loss and PDL to 1550 nm, and Fig. 7 at 1550 nm reads about 1.6-1.7 dB (TM), while the TM trace reaches about 2.5 dB near 1542 nm, so 1.6 dB cannot hold over the C-band. Conflicts with the abstract IL < 1 dB for both polarizations (not entered, D417)."
    why: "p.7 Fig. 7 TM trace 1.4-2.5 dB over 1530-1565 nm (dip at 1542 nm, '< 3 dB in the entire wavelength range'); 1.6 dB matches the 1550 nm reading, not a C-band value"
  cmp_lit_wu2020a_swg_mmi_crossing-m5:
    band: ""
    wavelength_nm: 1550
    wavelength_inferred: "true"
    notes: "Printed in the abstract only ('< 0.6 dB'); equals the conclusion's TM - TE difference (1.6 - 1 dB). Wavelength inferred from the p.7-8 sentence tying low PDL to 1550 nm; over the C-band the Fig. 7 TE / TM difference exceeds 1 dB near 1542 nm."
    why: "p.1 abstract; p.7-8; Fig. 7 TM - TE difference near 1542 nm is about 1.3 dB, so the < 0.6 dB bound is a 1550 nm value, not a C-band one"
