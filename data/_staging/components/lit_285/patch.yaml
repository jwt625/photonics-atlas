# Audit patch lit_285 (fresh-context audit 2026-11-25, DevLog/audits/2026-11-25-lit_285-audit.md).
# 125 metrics: 121 ok / 4 imprecise / 0 wrong; 22 components: 18 ok / 4 imprecise / 0 wrong. 2 misses added (gassenq2012
# Fig. 3(a) SOI stack labels). After the patch: 22 components, 127 metrics.
# Fixes: wang2015 org_imec also on the PD and taper rows (Si circuit stated as made in imec's CMOS pilot line; liu2025 /
# zhang2023d / soltanian2022 precedent); xue2021 design-only butt coupler loses the NFF facility (no merged lit design row
# carries an org); yu2020 1550 nm 30 um responsivities (0.8 / 0.94 A/W, 75 %) moved from the family row to the 10 x 30 um2
# row (p.7 Summary ties 0.94 A/W to the 20 GHz PD; Fig. 3(a) shows a single 30 um point at 1550 nm); wan2017 laser
# threshold temperature 300 K from the Fig. 7(b) label; gassenq2012 thermal-cycling note wording.
# Note supplements (rows ok): wang2015 dark-current density implied area; gassenq2012 80 K density reading.
components:
  cmp_lit_wang2015_t2qw_pd:
    fab_org_ids: org_imec
    process_name: "imec's CMOS pilot line, 200 mm SOI, 193 nm deep UV lithography"
    notes: "Waveguide PD fed from the Si rib through the tapered III-V mesa (taper row cmp_lit_wang2015_iii_v_si_taper, D396); light enters through the 20 x 20 um SOI grating coupler (cmp_lit_wang2015_gc). Fab org_imec: the SOI waveguide circuit under the PD (400 nm Si rib, 180 nm etch) was made in imec's CMOS pilot line (p.5; liu2025 / zhang2023d / soltanian2022 precedent: Si circuit stated at imec -> org_imec on the heterogeneous rows); the bonding and III-V mesa processing are passive with no org named (D80b), so no second fab org; the III-V part was not made by imec (benchmark exclusion candidate, D933). Epi grown by MBE on n-InP (passive, no org named). Acknowledgment thanks a person for metallization processing help and SEM (staff thanks: no facility, D72). Waveguide-referred values rest on the measured grating-coupler efficiency (p.6-7, Fig. 6(a) inset): derived (D517). Not entered: simulated > 95 % absorption in the 150 um III-V waveguide at 1000 cm-1 (p.4, no parameter); 'good linearity' over 0.21-1.52 mW fiber-coupled input (Fig. 5(b), no parameter)."
    why: "p.5 Sec. 2: 'The SOI waveguide fabrication is carried out in imec's CMOS pilot line' covers the Si rib under the PD; merged heterogeneous rows on an imec-made Si circuit carry org_imec (liu2025 laser / SOA / taper, zhang2023d, soltanian2022) with passive III-V steps adding no second org"
  cmp_lit_wang2015_iii_v_si_taper:
    fab_org_ids: org_imec
    process_name: "imec's CMOS pilot line, 200 mm SOI, 193 nm deep UV lithography"
    notes: "Coupling section of cmp_lit_wang2015_t2qw_pd (D396 cross-note). Only simulated values (FIMMWAVE, TE0, 2.35 um, active-region absorption not included; fabricated row, D80e). The fabricated taper differs from the simulated design: 1 um SiNx mask tip giving about 200 nm bottom width of p-InP and active region after wet etching (p.5), mesa 1 to 3.5 um at the top (p.3). Fig. 3(c) at 150 um taper length: 0.1 um tip about 0.91, 0.5 um tip about 0.87 (simulated design siblings, not entered); text: good coupling for a 0.5 um tip or less (p.4). Most light in the III-V waveguide once it reaches 0.9 um width (p.4). Fab org_imec: the Si rib side (6 to 3 um taper, 180 nm etch) was made in imec's CMOS pilot line (p.5; liu2025 qd_si_taper precedent); bonding and III-V taper processing passive, no org named (D80b)."
    why: "p.5 Sec. 2: the Si half of the transition comes from imec's CMOS pilot line; merged cmp_lit_liu2025_qd_si_taper (III-V / Si taper on an imec Si circuit) carries org_imec"
  cmp_lit_xue2021_si_iii_v_butt_coupler:
    facility_org_ids: ''
    notes: "Waveguide-coupled PD designed and simulated only (3D FDTD, p.4-5): row_kind design. Simulation wavelength not stated. Fig. 5 reads about 78 % at 100 nm and about 31 % at 1000 nm. Facility empty: design-only row, nothing fabricated (no merged lit design row carries a fab or facility org); the NFF acknowledgment sits on the fabricated PD rows. Inverse tapers proposed to raise efficiency and gap tolerance (p.5, no value)."
    why: "row_kind design: the butt-coupled PD was only simulated (p.4-5), so no facility performed work on it; all 426 merged lit design rows have empty fab / facility"
  cmp_lit_yu2020_mutc_pd_family:
    notes: "Population row (D165; gao2025b precedent) for the length series of Fig. 3 (PD widths not stated): 10 um 0.68 A/W, 1064 nm 30 um values and the typical dark current. The 1550 nm 30 um values (0.8 / 0.94 A/W, 75 %) are on cmp_lit_yu2020_mutc_pd_10x30: the Summary ties 0.94 A/W to 'a PD with 20 GHz bandwidth' (p.7), the only such device is 10 x 30 um2 (p.4, Fig. 5), and Fig. 3(a) has a single 30 um point at 1550 nm. At 1064 nm Fig. 3(b) shows two 30 um points (about 0.32-0.33 A/W), so the 1064 nm 30 um values stay here (D159: 10 x 30 or 15 x 30). Responsivity weakly dependent on length 20-60 um and on waveguide width 1-4 um (p.4). Internal values rest on the simulated fiber-chip mode-mismatch loss (0.7 dB at 1550 nm, 4 dB at 1064 nm; row cmp_lit_yu2020_sin_inverse_taper): author_estimate. PDL 0.67 dB (1550 nm) / 0.26 dB (1064 nm) not entered (pdl_db not allowed for photodetector; registry gap). Fab empty: Si3N4 'deposited by low pressure chemical vapor deposition', bonding and PD processing passive ('was adopted', 'were fabricated'); authors at University of Virginia, NIST and LIGENTEC with no fabrication statement naming an org (D80b). Platform sin (stack guiding light into the absorber; gao2025b precedent). A 8 V reverse bias was needed for maximum bandwidth in all measurements (p.5). Not entered: simulated transit-time-limited bandwidth 40 GHz (p.2), RC-limited estimates 23 / 25 GHz (p.4-5, model)."
    why: "notes follow the move of the 1550 nm 30 um rows to the 10 x 30 um2 row (p.7 Summary; p.4 Fig. 3(a))"
  cmp_lit_yu2020_mutc_pd_10x30:
    notes: "Device of the 20 GHz, 69 fF and 40 Gbit/s eye-diagram results (p.4-5; data rate has no parameter) and of the 1550 nm 30 um responsivities (0.8 A/W external, 0.94 A/W internal, 75 %): the Summary prints 'The internal responsivity of a PD with 20 GHz bandwidth is as high as 0.94 A/W' (p.7) and Fig. 3(a) has one 30 um point (about 0.80 A/W). The 'Assuming a series resistance of 20 Ohm, a bandwidth of 25 GHz can be predicted' projection is not entered. Fab empty: Si3N4 'deposited by low pressure chemical vapor deposition', bonding and PD processing passive ('was adopted', 'were fabricated'); authors at University of Virginia, NIST and LIGENTEC with no fabrication statement naming an org (D80b). Platform sin (stack guiding light into the absorber; gao2025b precedent). A 8 V reverse bias was needed for maximum bandwidth in all measurements (p.5). Not entered: simulated transit-time-limited bandwidth 40 GHz (p.2), RC-limited estimates 23 / 25 GHz (p.4-5, model)."
    why: "p.7 Summary ties the 0.94 A/W internal responsivity to the 20 GHz PD (10 x 30 um2, p.4 / Fig. 5); records the basis of the moved rows"
  cmp_lit_gassenq2012_evanescent_pd:
    notes: "Design 1 (evanescent coupling, Fig. 3-4). The only evanescent mesa size printed is 60 x 10 um, for the dark-current values (p.6; Fig. 6(a) currents match it: about 2e-6 A at -1 V, 300 K = 0.3 A/cm2 over 600 um2); the responsivity device size is not printed (single evanescent design in the paper, so kept on this row; flagged). SOI stack from the Fig. 3(a) design-1 schematic labels (Si 0.22 um on 2 um SiO2) and the Fig. 4(b) label (0.3 um BCB). Waveguide-referred responsivity = system responsivity divided by the measured grating-coupler efficiency G (Fig. 5(b)): derived (D517). Not entered: R0A 0.1 Ohm cm2 (no parameter); minimum evanescent coupling efficiency (Fig. 5(c), about 0.75 at 2.3 um, a bound assuming 100 % collection; no photodetector parameter); 'intrinsic' epi-stack dark current density about 10 mA/cm2 at -0.1 V from a fit over the test-mask and integrated devices of Fig. 6(b), and 95 % sidewall share (p.7: fit of a population, not this device); no degradation in responsivity or dark current after thermal cycling between room temperature and liquid nitrogen temperature (p.6, no value). Fab empty: SOI waveguides fabricated 'with standard CMOS technology' and III-V bonding / mesa processing in passive voice, no org named (D80b); authors at Ghent University-IMEC and IES Montpellier (D154). Epi grown by solid-source MBE (passive, no org). No acknowledgment section. Values measured at room temperature unless stated (Fig. 6(a) room-temperature trace labelled 300 K)."
    why: "p.6 Sec. 5 prints 'thermal cycling between room temperature and liquid nitrogen temperature', not 77 K; Fig. 3(a) / Fig. 6(a) evidence recorded with the two added geometry rows"
  cmp_lit_gassenq2012_input_gc_evanescent:
    notes: "Input coupler for the evanescent PD measurements (Fig. 5(b)); the same grating injects TE around 2.2 um and TM around 1.65 um (p.5-6). Fig. 5(b) TE curve peaks about -9 dB near 2.1 um while the text prints a -10 dB maximum around 2.2 um (text value entered). The -12 dB coupler of the grating-assisted PD is a separate row (cmp_lit_gassenq2012_input_gc_grating_pd; same design not confirmed). Mid-IR grating coupler design cited to ref. [16] (efficiency here measured in this paper). SOI layer thickness not stated in the text; the Fig. 3(a) design-1 PD schematic labels Si 0.22 um on 2 um SiO2 (entered on the evanescent PD row only). Fab empty (SOI 'with standard CMOS technology', no org named, D80b). Method of isolating the coupler efficiency not stated."
    why: "note supplement (row ok): Fig. 3(a) labels the SOI stack of the evanescent PD structure"
metrics:
  cmp_lit_wang2015_t2qw_pd-m11:
    notes: "as printed; 12 nA / 0.17 mA/cm2 implies an area of about 7.1e3 um2 (e.g. 150 x 47 um), while 12 nA over the 150 x 3.5 um mesa top would give about 2.3 mA/cm2; the normalizing area is not stated (flagged, D417 style; xue2022 precedent: density kept as printed)"
    why: "note supplement (row ok): implied normalizing area of the printed density (p.7 Sec. 3)"
  cmp_lit_wan2017_qd_microring_laser-m1:
    temperature_k: '300'
    notes: "'the measured photocurrent suggests a lasing threshold of around 21 mA'; Fig. 7(b) labelled 300 K (kink of the photocurrent near 0.021 A)"
    why: "render p.9 Fig. 7(b): the threshold measurement is labelled 300 K"
  cmp_lit_gassenq2012_evanescent_pd-m5:
    notes: "printed 60 uA/cm2 at 'liquid nitrogen temperatures' (uA -> mA); temperature from the Fig. 6(a) lowest trace (80 K; its -1 V current about 3e-10 A over the 600 um2 mesa, about 50 uA/cm2, matches); bias from the same paragraph (-1 V)"
    why: "note supplement (row ok): Fig. 6(a) 80 K trace reading confirms the 80 K / -1 V attribution (judgment f)"
