metrics:
  cmp_lit_ledezma2022_ppln_opa_6mm-m2:
    basis: derived
    notes: 'printed ~50 dB/cm alongside ~30 dB; the authors'' arithmetic 30 dB / 0.6 cm on the measured gain (D80a); abstract: larger than 50 dB/cm'
    why: 'D80a: explicit arithmetic on own measurements (gain divided by the 6 mm length, p.4 Sec. 3A) is derived whether the batch or the authors did it; merged precedent ronn2019 / zhang2023a gain_db_per_cm derived'
  cmp_lit_ledezma2022_ppln_opa_6mm-m3:
    basis: derived
    notes: '''estimated OPA gain'' Gs = E_OPG / a, with a and b fitted to E_OPG = a exp(b sqrt(E_pump)) under stated model assumptions (sinh^2(gL) approximated by 0.25 exp(2gL) above ~10 dB; g proportional to sqrt(E_pump)); model-parameter extraction with stated assumptions -> derived (D80a). Chip temperature not stated for this measurement'
    why: 'p.4 Sec. 3B: the gain is not read from the data but computed from a fitted model whose assumptions the paper states; D80a ''model-parameter extraction with stated assumptions is derived'' (batch report call 5)'
  cmp_lit_ledezma2022_ppln_opa_6mm-m4:
    basis: derived
    qualifier: gt
    notes: 'printed ''exceeding 66 dB ... (110 dB/cm)'' = 66 dB / 0.6 cm; same OPG model extraction as m3 (D80a); abstract: exceeding 100 dB/cm over 600 nm of bandwidth'
    why: 'p.4 Sec. 3B: ''exceeding'' governs the 66 dB and its per-length form (qualifier was empty while m3 has gt); basis as m3 (D80a)'
  cmp_lit_minami2023_aowc_c_l-m1:
    ref_plane: module
    condition: 'C-to-L conversion (signal in C band, idler in L band); CW input at -14 dBm; CE = idler output / signal input, calculated from the input and output spectra of the AO-WC (reference plane: AO-WC input and output ports); signal-to-idler CE includes parametric gain, so values above 100 % are net conversion gain; pump 1572.89 nm, ~30 dBm into the DFG PPLN'
    why: 'p.3 Sec. III-B: CE ''calculated by comparing the input and output spectra of the AO-WC''; power_conversion_efficiency_pct definition requires the reference plane in condition'
