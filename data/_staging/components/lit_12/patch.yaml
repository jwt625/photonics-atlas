  cmp_lit_tian2021_aom_isolator_main-m2:
    wavelength_nm: ''
    band: c_band
    locator: p.1 Abstract; p.3 Sec. I; p.9 Sec. II
    condition: 'maximum isolation stated for 20 dBm (100 mW) RF power applied to each actuator, phases (120, -120) deg; measurement and wavelength of the 10 dB value not identified'
    notes: 'headline value (abstract, p.3, p.9 ''isolation of 10 dB under an RF power of 20 dBm''); not tied to Fig. 4(c), whose isolation points stay near 9 dB, nor to the printed 9.3 dB (Fig. 3(d)) / 9.5 dB (Fig. 5(a)); Fig. 5(d) points scatter up to about 10 dB. Band: C-band resonances of this device (1539.6-1545.6 nm, Fig. 5(a)); the second (950 nm gap) device has smaller isolation (Supp. Note 5), so the value belongs to this device'
    why: 'p.7 Fig. 4(c) render: isolation reaches about 8.8 dB at 20-21 dBm, so the Fig. 4 wavelength (1544.1 nm) and drive 2.968 GHz attached to the 10 dB row are not its conditions; wavelength not stated -> band with wavelength_inferred (rule 8)'
