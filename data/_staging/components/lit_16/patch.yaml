# Audit patch lit_16 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_16-audit.md).
# 173 metrics: 167 ok / 3 imprecise / 3 wrong; 33 components: 29 ok / 4 changed (notes only) / 0 deleted; 4 misses added.
# Not covered here (coordinator decisions, see the audit file): MIT.nano registry org (he2026 facility), PCSEL coupling
# coefficient parameter, focal-spot FWHM parameter and the other registry gaps.
components:
  cmp_lit_ishii2003_vcsel_wg_microlens_469:
    notes: 'fab_org_ids empty: all authors at NTT Microsystem Integration Laboratories, but the paper only says the authors developed the fabrication techniques (D80b). The fiber-to-waveguide (PD side) tolerance of Fig. 15 (about +/-50 um, p.5) is not entered: the text ties the 469 um lens only to the input position shown in the Fig. 14 inset; the lens at the output side of the Fig. 15 sample is not identified (could be this lens or the 352 um lens of Fig. 13(b)), D159.'
    why: 'p.5 Sec. V: the 469 um microlens is formed at the input position of the waveguide as shown in the Fig. 14 inset; Fig. 15 uses an LED input and a lens at the output side whose identity is not stated (D159); records why the deleted m2 value is not entered'
  cmp_lit_ishii2003_wg_microlens_352:
    notes: 'fab_org_ids empty: all authors at NTT Microsystem Integration Laboratories, but the paper only says the authors developed the fabrication techniques (D80b). The Fig. 15 fiber-to-waveguide tolerance (about +/-50 um, p.5) uses an LED-fed waveguide with an output-side lens whose identity is not stated; not entered on this row or the 469 um row (D159).'
    why: 'p.5 Sec. V and Fig. 15: sample identity ambiguous between the 352 um and 469 um lens rows (D159); bound recorded in component notes'
  cmp_lit_wang2023c_metasurface_on_ld:
    notes: 'fab_org_ids empty: the conclusion states the authors fabricated the metasurfaces, but the authors sit at SINANO (CAS), Suzhou Laboratory, Jiangsu Institute of Advanced Semiconductors and Soochow University (not unambiguous, rule 12). Not entered: focal-spot intensity FWHM about 0.738 um at 149.7 um from the metasurface, about 0.74 um for 30-55 mA (p.7, Fig. 6(c)(d); a focused-spot FWHM is not beam_diameter_um, registry gap), nanograting transmittance ~80 % (tied to the authors'' earlier work [39] on p.3, restated p.7; D259), circular-polarization degree > 0.99 (p.7; no parameter), measured focal distance 149.7 um and calculated NA ~0.55 (p.7; no parameter), nanobrick period 250 nm and nanograting period 220 nm (p.5; subwavelength_period_nm not allowed for micro_optics), metalens-only imaging of USAF group 3 element 4 to ~0.57 um line width (p.6). Nanobrick height below the 600 nm design is blamed for the efficiency gap (p.7).'
    why: 'p.7 Sec. 3: the 0.738 um value is the intensity FWHM of the focused spot 149.7 um from the metasurface; beam_diameter_um is defined as the beam diameter at the interface (expanded / collimated beam), so the value is removed (metric m2 deleted) and recorded here as a registry gap'
  cmp_lit_wang2023c_metalens_design_50um:
    notes: 'Simulation-only scaled design (NA ~0.55, same as the fabricated 200 um lens). Not entered: simulated focal-spot intensity FWHM about 0.495 um (p.4, Fig. 3(d); focused-spot FWHM is not beam_diameter_um, registry gap), focal length F 37.5 um (design, no parameter).'
    why: 'p.4 Sec. 2.2: 0.495 um is the FWHM of the focal spot of the F 37.5 um design, not a beam diameter at an interface; metric m2 deleted, value recorded here'
