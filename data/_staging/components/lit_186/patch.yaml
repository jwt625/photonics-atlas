metrics:
  cmp_lit_ji2022a_racetrack_euler_p1-m3:
    notes: "Printed 2.4 dB/m, converted to dB/cm (D256a: author_estimate kept); computed from kappa_0 with a group index not printed (D76) and the D403 kappa_0. Printed values disagree (D417, kept as printed): kappa_0/2pi = 15.5 MHz gives about 2.8-3.0 dB/m for n_g 2.0-2.1 (alpha = n_g kappa_0 / c); the printed 19.81 GHz FSR with a round trip of at least 7000 um straight plus two pi-bends bounds n_g at about 2.1, and 2.4 dB/m would need n_g about 1.7 (audit check, p.5, p.4)."
    why: "imprecise: the printed 2.4 dB/m does not follow from the printed 15.5 MHz with any group index consistent with the printed FSR and racetrack length (p.4 L = 3500 um, p.5 Fig. 3(a) D1/2pi = 19.81 GHz); D417 conflict note, value kept"
  cmp_lit_gu2021_tpc_nanobeam-m3:
    wavelength_nm: '1574.7'
    wavelength_inferred: 'true'
    notes: "Printed 'about 33 dB', limited by the photodiode detection limit (p.5; conclusion 'over 33 dB', abstract 'maximum extinction ratio of 33 dB'). Fano extinction ratio, not a Lorentzian notch. Wavelength: Fano lineshape of the 1574.7 nm topological boundary state (Fig. 3(c)); the Fig. 3(d) axis spans 1565-1585 nm and no dip wavelength is printed."
    why: "imprecise (rule 8): no wavelength on the row although the lineshape belongs to the 1574.7 nm TBS (p.4-5, p.5 Fig. 3(c), (d))"
  cmp_lit_gu2021_tpc_nanobeam-m4:
    wavelength_nm: '1574.7'
    wavelength_inferred: 'true'
    notes: "Slope ratio 10.78 dB/nm. Wavelength: Fano lineshape of the 1574.7 nm topological boundary state (Fig. 3(c)); the Fig. 3(d) axis spans 1565-1585 nm and no dip wavelength is printed."
    why: "imprecise (rule 8): no wavelength on the row although the lineshape belongs to the 1574.7 nm TBS (p.4-5, p.5 Fig. 3(c), (d))"
  cmp_lit_gu2021_tpc_nanobeam-m5:
    qualifier: ''
    wavelength_nm: '1574.7'
    wavelength_inferred: 'true'
    notes: "Printed 'a similar ER of 21 dB' ('similar' compares with the 20.5 dB +Delta case; no approximation word), slope ratio 10.07 dB/nm. The text calls these the red lines; in the Fig. 3(d) legend both the blue and the red traces are -Delta (labels q = 3.79 and q = 8.52), so the trace is not identified. Wavelength: Fano lineshape of the 1574.7 nm topological boundary state (Fig. 3(c)); the Fig. 3(d) axis spans 1565-1585 nm."
