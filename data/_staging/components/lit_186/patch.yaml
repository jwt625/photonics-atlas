    notes: "'A 187 GHz repetition rate silicon nitride comb wafer' (p.1); no FSR is stated for this ring (D82a design-stated value). Fig. 4 resonance spacings TE1-TE2 about 1.55 nm and TM1-TM2 about 1.52 nm (about 193 / 190 GHz) are not stated to be adjacent longitudinal modes and are not used."
