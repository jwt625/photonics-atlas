add_metrics:
- metric_id: cmp_larocque2024_dc_michelson-m5
  component_id: cmp_larocque2024_dc_michelson
  parameter: core_thickness_nm
  value: 600
  unit: nm
  basis: design_target
  locator: p.6 Methods (Device Fabrication)
  notes: 600 nm x-cut TFLN on insulator wafer (NanoLN), CSEM MPW run, chip-wide. Restates eo_film_thickness_nm of EO row larocque2024-a (D106).
  why: 'DevLog-005 D106 geometry pass (passives): template dimension reported by the source'
- metric_id: cmp_larocque2024_dc_michelson-m6
  component_id: cmp_larocque2024_dc_michelson
  parameter: etch_depth_nm
  value: 400
  unit: nm
  basis: design_target
  locator: p.6 Methods (Device Fabrication)
  notes: Etch configured to remove 400 nm of LN, chip-wide. Restates EO row larocque2024-a (D106).
  why: 'DevLog-005 D106 geometry pass (passives): template dimension reported by the source'
- metric_id: cmp_larocque2024_dc_michelson-m7
  component_id: cmp_larocque2024_dc_michelson
  parameter: slab_thickness_nm
  value: 200
  unit: nm
  basis: derived
  locator: p.6 Methods (Device Fabrication)
  notes: 600 nm film - 400 nm etch = 200 nm; slab thickness not printed. Same value as slab_thickness_nm of EO row larocque2024-a (D106).
  why: 'DevLog-005 D106 geometry pass (passives): template dimension reported by the source'
- metric_id: cmp_larocque2024_dc_michelson-m8
  component_id: cmp_larocque2024_dc_michelson
  parameter: sidewall_angle_deg
  value: 55
  unit: deg
  basis: derived
  locator: p.6 Methods (Device Fabrication)
  notes: 'Printed as a 35 deg sidewall angle with respect to the chip normal (waveguides in general); converted to the registry convention (angle to the film plane): 90 - 35 = 55. The 17 deg value applies
    only inside the PhC mirror gaps.'
  why: 'DevLog-005 D106 geometry pass (passives): template dimension reported by the source'
- metric_id: cmp_liu2026a_ge_pd-m8
  component_id: cmp_liu2026a_ge_pd
  parameter: core_thickness_nm
  value: '220'
  unit: nm
  basis: design_target
  locator: p.2 Sec. 2; p.2 Sec. 2.2
  notes: 'Si waveguide layer: 220 nm top Si of the SOI wafer; the Ge bottom is embedded into the 220 nm Si layer. Restates eo_film_thickness_nm 220 of EO rows liu2026a-a/-b (D106, verified at the locator).'
  why: D106 geometry pass (actives, 2026-10-20)
- metric_id: cmp_liu2026a_ge_pd-m9
