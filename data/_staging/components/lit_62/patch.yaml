add_components:
- component_id: cmp_lit_zeng2026_yb_alox_amp_6p6mm
  source_id: lit:zeng2026
  class: amplifier.rare_earth
  label: 6.6 mm Yb:AlOx waveguide amplifier, short device (saturated active gain, saturated insertion loss)
  row_kind: fabricated
  platform: al2o3
  core_material: Yb:AlOx (RF magnetron co-sputtered, Yb 6.8e20 /cm3 = 0.76 at.%, RBS), 1.08 um thick, 1.50 um wide
  cladding: 'SiO2: 5 um deposited and annealed top, 4 um wet thermal oxide bottom'
  facility_org_ids: org_center_for_nanoscale_systems
  process_name: co-sputtered film, e-beam lithography, Cl-based RIE, oxide top cladding, 725 C anneal
  tags: ytterbium;short_device
  verified_on: '2026-11-02'
  notes: 'Sibling length of cmp_lit_zeng2026_yb_alox_amp_55mm (skill rule 9). Also used for the pump absorption and the luminescence
    lifetime (p.12, p.18; no parameter). Facility: alumina and silicon nitride devices made in the Harvard CNS and MIT.nano
    cleanrooms (p.7 Acknowledgments); MIT.nano is not in the registry (see report). Paper names no fabricating org: fab empty.'
  why: 'miss: the measured 6.2 dB/cm active gain and the 2.1 dB saturated insertion loss belong to the 6.6 mm device (p.12
    Sec. S1.1, p.16 Sec. S2.1), which had no row; skill rule 9; audit Q4'
