# Audit patch lit_62 (fresh-context audit 2026-11-02, DevLog/audits/2026-11-02-lit_62-audit.md).
# 163 metrics: 150 ok / 13 imprecise / 0 wrong; 31 components: 27 ok / 4 imprecise (kazama2021 fab) / 0 wrong; 0 deleted.
# Misses: 1 component and 7 metrics added (zeng2026 6.6 mm device 3, cavity length 1, Si3N4 stack 2; ahmadi2022 12.7 dB 1).
# After the patch: 32 components, 170 metrics. Open coordinator questions: see the audit file.
components:
  cmp_lit_kazama2021_ppln_opa_module:
    fab_org_ids: org_ntt
    notes: 'Module: 45 mm waveguide, four dichroic mirrors, six lenses, four pigtails (p.5 Fig. 2). SH pump 1.3 W from module
      PPLN-4 at 2.6 W input (p.7): not entered as a conversion row because PPLN-4 is not stated to be this waveguide (D159).
      Idler generator PPLN-1: signal and idler gain about 7.5 and 6.9 dB at 0.5 W SH pump (p.6): same reason, not entered.
      Calculated NF degradation 0.8 dB PSA / 3.8 dB PIA (p.8) and receiver sensitivity gains 3.2 and 2.8 dB (p.10): no separate
      row. Handling limited by the fiber at the SH wavelength, not the waveguide (p.7). Waveguide: cmp_lit_kazama2021_ppzn_ridge_wg;
      SHG view: cmp_lit_kazama2021_ppln_shg; facet: cmp_lit_kazama2021_ssc_facet (D396). Fab: first-person statement that
      the authors formed the SSC taper at the waveguide ends (p.3 Sec. 2) and reference to their own development of the fabrication
      process (p.2 Sec. 1); all authors in NTT Corporation laboratories (p.1): org_ntt (D80b, D84a, D154).'
    why: 'p.3 Sec. 2 first-person taper statement (few words: we formed) and p.2 Sec. 1 own fabrication process go beyond
      the ''we developed'' wording the distiller read; all authors NTT Corporation (p.1); D80b, D84a, D154; umeki2010 and
      goh2001 precedents; audit Q2'
  cmp_lit_kazama2021_ppln_shg:
    fab_org_ids: org_ntt
    notes: 'SHG view of the waveguide in cmp_lit_kazama2021_ppln_opa_module (D396). Fitted effective length 42 mm vs 43 mm
      QPM (p.4). Fab: first-person statement that the authors formed the SSC taper at the waveguide ends (p.3 Sec. 2) and
      reference to their own development of the fabrication process (p.2 Sec. 1); all authors in NTT Corporation laboratories
      (p.1): org_ntt (D80b, D84a, D154).'
    why: 'p.3 Sec. 2 first-person taper statement (few words: we formed) and p.2 Sec. 1 own fabrication process go beyond
      the ''we developed'' wording the distiller read; all authors NTT Corporation (p.1); D80b, D84a, D154; umeki2010 and
      goh2001 precedents; audit Q2'
  cmp_lit_kazama2021_ppzn_ridge_wg:
    fab_org_ids: org_ntt
    notes: 'Platform other (umeki2010 precedent, same material system). Fiber core 9 um in the butt-coupled loss split (p.3-4).
      Fab: first-person statement that the authors formed the SSC taper at the waveguide ends (p.3 Sec. 2) and reference to
      their own development of the fabrication process (p.2 Sec. 1); all authors in NTT Corporation laboratories (p.1): org_ntt
      (D80b, D84a, D154).'
    why: 'p.3 Sec. 2 first-person taper statement (few words: we formed) and p.2 Sec. 1 own fabrication process go beyond
      the ''we developed'' wording the distiller read; all authors NTT Corporation (p.1); D80b, D84a, D154; umeki2010 and
      goh2001 precedents; audit Q2'
  cmp_lit_kazama2021_ssc_facet:
    fab_org_ids: org_ntt
    notes: 'Facet of cmp_lit_kazama2021_ppzn_ridge_wg. The two-lens + dichroic path is inside the module (p.5). Fig. 1(c)
      panel label prints 776.65 nm, text 776.5 nm. Fab: first-person statement that the authors formed the SSC taper at the
      waveguide ends (p.3 Sec. 2) and reference to their own development of the fabrication process (p.2 Sec. 1); all authors
      in NTT Corporation laboratories (p.1): org_ntt (D80b, D84a, D154).'
    why: 'p.3 Sec. 2 first-person taper statement (few words: we formed) and p.2 Sec. 1 own fabrication process go beyond
      the ''we developed'' wording the distiller read; all authors NTT Corporation (p.1); D80b, D84a, D154; umeki2010 and
      goh2001 precedents; audit Q2'
