    wavelength_inferred: ""
    mode: TE00
    notes: "single resonance (Fig. S2), below the range of per-device medians (430-870 MHz); doublet dips at about 1550.317 and 1550.333 nm read off the Fig. S2 wavelength axis (reading uncertainty about +/- 0.01 nm); the resonance wavelength is not printed in the text. Regime fixed by the resolved doublet (see m1)"
    why: "p.12 Supp. Fig. S2: the wavelength axis (1550.28-1550.36 nm) places the resonance at about 1550.32 nm; the row carried an inferred 1500-1600 nm span and said the wavelength was not stated"
