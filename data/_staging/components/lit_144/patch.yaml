    wavelength_nm: 1550.32
    wavelength_max_nm: ""
    wavelength_inferred: ""
    mode: TE00
    notes: "Fig. S2 typical resonance; doublet dips at about 1550.317 and 1550.333 nm read off the Fig. S2 wavelength axis (ticks 1550.28 / 1550.32 / 1550.36 nm; reading uncertainty about +/- 0.01 nm); the resonance wavelength is not printed in the text"
    why: "p.12 Supp. Fig. S2: the wavelength axis (1550.28-1550.36 nm) places the resonance at about 1550.32 nm; the row carried an inferred 1500-1600 nm span and said the wavelength was not stated"
  cmp_lit_riedhauser2025_bto_ring_r100-m7:
    wavelength_nm: 1550.32
