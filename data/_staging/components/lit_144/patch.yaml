    notes: "printed '~615 GHz' (abstract) and 615 GHz (p.4, p.6, Table 1); GBP = gain x bandwidth of the paper's own values, 12.8 x 48 GHz = 614.4 GHz ('The corresponding GBP is also shown in Fig. 5(b)', p.4); Fig. 5(b) top point at gain 12.8 reads about 615 GHz (srinivasan2020 m19 / xue2026 / yanikgonul2021 precedent: product of own gain and bandwidth -> derived)"
