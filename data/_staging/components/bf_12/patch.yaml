    notes: 'extracted from the ring Q (formula not stated); said to match the cutback loss (data not shown); O band inferred as for the Q rows; basis author_estimate (D76): Q-derived loss with the group
      index not stated'
    why: 'D76: Q-derived loss -> author_estimate when an input (ng) is not stated'
  cmp_datta2024_bare_sin_ring-m2:
    basis: author_estimate
    notes: '+-0.38 dB/cm, corresponding to Q0 (conversion not stated); wavelength not stated; basis author_estimate (D76): Q-derived loss, group index not stated'
    why: 'D76: Q-derived loss -> author_estimate when an input (ng) is not stated'
