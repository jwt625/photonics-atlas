  cmp_kieninger2020_mmi-m1:
    basis: measured
    why: 'D76: slope of the source''s own 4/8/12-MMI cascade fit -> measured (as singer2025 / schwarzenberger2026)'
  cmp_kieninger2020_mmi-m2:
    basis: measured
    why: 'D76: slope of the source''s own 4/8/12-MMI cascade fit -> measured (as singer2025 / schwarzenberger2026)'
  cmp_kieninger2020_mmi-m3:
    basis: measured
