# Audit patch bf_12 (fresh-context audit 2026-10-20), main block only (optional Block B not applied).
components:
  cmp_kieninger2020_strip_slot_converter:
    platform: soi_slot
    why: 'cross-batch consistency: Si strip-to-slot converters are soi_slot in schwarzenberger2026, schwarzenberger2026a, wolf2018a, singer2025 (slot side guides the converted mode)'
  cmp_kieninger2020_mmi:
    label: Si 2x2 MMI splitter/combiner of the SOH MZMs, IME 200 mm SOI
    notes: MMIs that split and combine the light of the MZM arms (p.2); 2x2 MMI (the cached text p.2 prints the multiplication sign as a Symbol-font private-use byte between the two 2s). Per-coupler attenuation
      from 4, 8 and 12 concatenated MMIs accessed via GCs on each die (p.9). Fabricated at A*STAR IME (p.2).
    why: 'port count verified: byte sequence between ''2'' and ''2'' on p.2 is the Symbol-font multiplication sign'
  cmp_khalil2026_racetrack:
    fab_org_ids: org_imec
    notes: 'Optical cavity of the acousto-optic racetrack modulator of EO row khalil2026-a (critically coupled, p.6-7). The EO row holds FSR 0.781 nm and the 4.68 dB/cm modal loss (not re-entered); Qi and
      linewidth are held there only in notes. Fab: A.U. fabricated the samples, H.C. assisted the fabrication and S.S.S. developed the wafer-bonding process in the fab (contributions, p.15); imec is the
      affiliation common to all three (D72 as extended by D76); the Xplore cleanroom team is thanked for assistance (staff thanks, not entered).'
    why: 'D72/D76: all fabricating contributors share imec (A.U. imec + Ghent, H.C. imec + KU Leuven, S.S.S. imec); contributions are on p.15, not p.10'
