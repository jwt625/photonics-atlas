    basis: measured
    why: 'D76: slope of the source''s own converter-cascade fit -> measured'
  cmp_chen2022_gc-m1:
    includes: one GC
    notes: The paper measured the GC on a reference structure of two GCs and a short straight waveguide but prints only the 8.2 dB device total and the deduced about 0.2 dB on-chip loss (p.7); (8.2 - 0.2)
      / 2 = 4.0 dB per GC; peak-coupling wavelength not stated
    why: includes text described the reference structure as the measured quantity; the arithmetic is on the device total
add_components:
- component_id: cmp_weigel2018_directional_coupler
  source_id: eo:weigel2018
  class: splitter.directional_coupler
  label: Broadband single-mode Si directional coupler (MZM splitter / combiner), C-band
  row_kind: fabricated
  host_device_ids: weigel2018-a
  platform: soi
  core_material: Si 150 nm (thinned from 220 nm SOI); coupler geometry not stated
  cladding: SiO2
  fab_org_ids: ''
  facility_org_ids: org_san_diego_nanotechnology_infrastructure
  process_name: ''
  test_structure: ''
  tags: ''
  verified_on: '2026-10-20'
  notes: Splitter and combiner of the MZM in the SiP region outside the bonded LN (p.4); split ratio said to be accurate and repeatable from foundry processing (no number). Part of the 4.7 dB unexplained
    MZM loss is 'likely' attributed to these couplers and tapers (p.6), no per-coupler value. Foundry not named in the text (ref. [4]); facility as for the other weigel2018 rows (p.16).
- component_id: cmp_zhang2026b_mmi
  source_id: eo:zhang2026b
  class: splitter.mmi
  label: TFLN MMI splitter / combiner of the MZMs, O-band, 8-inch wafer
  row_kind: fabricated
  host_device_ids: zhang2026b-a;zhang2026b-b;zhang2026b-c
  platform: lnoi_rib
  core_material: x-cut LiNbO3 350 nm, 200 nm rib, 150 nm slab (process geometry); MMI dimensions not stated
  cladding: SiO2 1 um
  fab_org_ids: ''
  facility_org_ids: ''
  process_name: ''
  test_structure: ''
  tags: ''
  verified_on: '2026-10-20'
  notes: MMI splitters of the MZMs (SEM Fig. 1(b)); the > 25 dB extinction of a typical unbalanced MZI is stated to show the designed MMIs are well fabricated (p.2). The EO rows hold no extinction ratio.
    Fab org left empty (NSTIC / A*STAR IME dual affiliation), as for the other zhang2026b rows.
