# Audit patch lit_02 (fresh-context audit 2026-10-22, DevLog/audits/2026-10-22-lit_02-audit.md).
# Blocks in one file: A = findings (wrong / imprecise), B = D111 / D82d unit-rescaling convention (28 rows,
#   droppable as a block if the coordinator does not enforce D111 on design dimensions), C = misses (add_metrics).
# Block B ids: every metrics entry whose why starts with "D111 / D82d".
metrics:
  cmp_lit_mu2026_to_phase_shifter-m3:
    parameter: length_um
    notes: '324 um long TO phase shifter per arm as printed (p.11 Sec. 5); the TiN heater length itself is not stated (D111: phase-section length stays length_um).'
    why: 'D111: heater_length_um only when the paper states the heater length; p.11 states a 324-um-long TO phase shifter (TiN heater over a 3-pass folded waveguide), not the heater length'
  cmp_lit_mu2026_inverse_taper_coupler-m1:
    n_samples: ''
    why: 'p.8: the twelve samples of the coupling-loss measurement cover both coupler designs; the per-design count is not stated'
    notes: Minimum measured LD-to-waveguide coupling loss (Table 3). Twelve samples of both coupler designs together were measured this way (p.8); per-design count not stated. Paper attributes ~1.2 dB excess
      to misalignment vs simulation.
  cmp_lit_mu2026_taper_coupler-m1:
    n_samples: ''
    why: 'p.8: the twelve samples of the coupling-loss measurement cover both coupler designs; the per-design count is not stated'
    notes: Minimum measured coupling loss (Table 3). Twelve samples of both coupler designs together were measured this way (p.8); per-design count not stated. Paper attributes ~0.5 dB excess to misalignment
      vs simulation.
  cmp_lit_maeda2023_membrane_dr_laser-m1:
    temperature_k: ''
    notes: L-I measurement temperature not stated (spectra and eyes at 25 C); output into a large-area PD.
    why: 'never invent conditions: the L-I temperature is not stated (p.4-5; 25 C is stated only for spectra and eyes)'
  cmp_lit_dangel2013_silicone_wg_flex-m2:
    basis: author_estimate
    method: loss_breakdown
    notes: Bound over 760-860 nm stated in the text (p.7) from the white-light VIS-NIR spectrum of one 10 cm straight waveguide, corrected to the 850 nm single-wavelength loss by subtracting an estimated
      4.08 dB coupling loss (assumes negligible SM-fiber launch loss). Sample type (flex or rigid) not stated; attached to the flex row with this caveat.
    why: 'D44/D76: the spectrum is baseline-corrected with an estimated 4.08 dB coupling loss that rests on the assumption of negligible SM-fiber launch loss (p.7); a single 10 cm waveguide, not a cutback'
  cmp_lit_dangel2013_silicone_wg_flex-m3:
    basis: author_estimate
    method: loss_breakdown
    notes: Bound over 600-1100 nm stated in the text (p.7) from the white-light VIS-NIR spectrum of one 10 cm straight waveguide, corrected to the 850 nm single-wavelength loss by subtracting an estimated
      4.08 dB coupling loss (assumes negligible SM-fiber launch loss). Sample type (flex or rigid) not stated; attached to the flex row with this caveat.
    why: 'D44/D76: the spectrum is baseline-corrected with an estimated 4.08 dB coupling loss that rests on the assumption of negligible SM-fiber launch loss (p.7); a single 10 cm waveguide, not a cutback'
  cmp_lit_jahed2022_vcsel_gc_flipchip-m4:
    includes: VCSEL-to-input-GC coupling, SiN waveguide + tapers, output GC to the flip-chip GaAs PD
    notes: Power-to-PD conversion not stated (vendor responsivity 0.4 A/W is given on p.7, but its use for this number is not stated).
    why: 'never invent: the paper does not say how detected power was obtained from the PD (p.7); remove the asserted photocurrent / 0.4 A/W conversion'
  cmp_lit_heim2025_vernier_ring-m6:
    basis: derived
    notes: ECTL waveguide 2.6 um x 80 nm. Printed as 2.6 um; unit rescaling (D82d / D111).
    why: 'D111 / D82d: unit rescaling of a printed dimension is derived with the printed value in notes (printed 2.6 um)'
  cmp_lit_heim2025_coil_resonator-m5:
