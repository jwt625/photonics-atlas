# D169 gap-fill (subagent, 2026-10-22); replay order patch, sweep, gapfill, addendum, geometry, geoaudit, coord, sweep2
components:
  cmp_lit_lu2024_pcw_dfb:
    notes: 'Partially corrugated waveguide DFB: front section with first-order grating (400 um), back section without grating,
      HR (~0.95) / AR facets (p.2, p.9). Fabrication described passively (p.6), no fabricating org stated: fab_org_ids empty
      (one author affiliation is Ningbo Ori-Chip Optoelectronics, not stated as fabricator). Front-facet power measured with
      a large-area PD on a TEC-controlled copper heat sink (chip on bar, p.6). Not entered (no registry parameter): grating
      length 400 um, turn-on voltage 0.74 V, MQW confinement factor ~3.8 % (design); longitudinal mode spacing (fsr_nm), series
      resistance and thermal resistance entered in the D169 gap-fill. Table 1 simulated sibling designs (1.4 / 1.5 / 1.6 mm)
      were not fabricated and are not rows.'
    why: 'D169 gap-fill: mode spacing, series resistance and thermal resistance now entered (m21-m24)'
  cmp_lit_mu2026_ingan_ld_flipchip:
    notes: 'Hybrid flip-chip assembly (laser.heterogeneous used for a laser bonded on a PIC; flip-chip, not transfer-printed).
      LDs designed and fabricated by ams OSRAM (p.4, p.15): ams OSRAM is not in the registry (reported), so fab_org_ids empty;
      Si chip by AMF (org_amf, on the coupler rows). All powers are on-chip (SiN-waveguide-coupled), computed by subtracting
      the separately measured fiber edge-coupler loss from the off-chip power (p.7). 40 bonded samples (20 per coupler design);
      post-bonding in-plane misalignment sigma 635 nm (X) / 665 nm (Y), mean 268 / -7 nm, 85 % within +/-1 um (p.6); max tilts
      in Table 2 (p.7). Not entered: emission FWHM 0.05-0.10 nm (OSA-resolution limited, and no FWHM parameter for lasers),
      15.5 % power drop at 80 mA from 14 to 80 C, series-resistance / emission changes after bonding-heat exposure (Supp.
      S5), +12.6 % mean power after PDMS underfill + epoxy encapsulation (5 samples, Supp. S4; calculated Fresnel reflection
      24.8 % -> 9.4 %). PIC demo (p.11-13): DC/AC (1 MHz) power monitoring with the integrated Si PD; PD has no quantitative
      own result (18 GHz bandwidth is cited from ref. 26), so it is not a row.'
    why: 'D169 gap-fill: T0 187 K now entered (m18)'
  cmp_lit_maeda2023_membrane_dr_laser:
    notes: 'Distributed-reflector laser: 140 um DFB active section + 60 um rear DBR on a 160 x 700 um2 coupon; no Si waveguide
      under the active region (confinement factor ~12 %, design) (p.2). Abstract says the authors fabricate the lasers, but
      author affiliations span NTT Device Technology Labs, Keio and U. Tokyo, so the fabricating org is not unambiguous (D72/D80b):
      fab_org_ids empty. Output power received by a large-area PD (p.4); L-I kinks from chip-facet reflection (ripple FSR
      ~0.35 nm). Not entered (no registry parameter): 40 / 50 Gbit/s NRZ eyes with ER 3.2 / 2.5 dB and 0.78 / 0.63 pJ/bit
      (p.6, system-level). Self-heating tuning and temperature coefficient measured on another sample from the same wafer
      (p.5).'
    why: 'D169 gap-fill: thermal resistance ~700 K/W now entered (m15)'
  cmp_lit_suda2025_polymer_sm_wg_fr4:
    notes: 'Eight 11 mm waveguides at 250 um pitch (pitch_um not allowed for waveguide_platform) on high-Tg FR4 (p.2). Fabrication
      described passively (all authors AIST, no explicit fabrication statement): fab_org_ids empty; material supplied by Nissan
      Chemical (note only). Not entered (no parameter): temperature rise 4.4 C measured (thermal camera) vs 4.9 C simulated
      at +20 dBm, 1311 nm (p.7); PDL, DGD and PER entered in the D169 gap-fill. Simulation inputs 0.3 dB/facet coupling and
      0.5 dB/cm propagation are assumptions (p.7), not entered. The Furukawa ELS is test equipment (not a row).'
    why: 'D169 gap-fill: PDL, DGD and PER now entered (m11-m21)'
