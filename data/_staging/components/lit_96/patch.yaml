- metric_id: cmp_lit_zhao2025_sin_spiral_rib_wg2_56cm-m11
  component_id: cmp_lit_zhao2025_sin_spiral_rib_wg2_56cm
  parameter: insertion_loss_db
  value: 1
  unit: dB
  qualifier: approx
  band: l_band
  polarization: te
  mode: TE00
  ref_plane: on_chip
  scope: de_embedded
  excludes: 'lensed-fiber facet coupling'
  condition: 'total on-chip waveguide loss of the 0.56 m WG2 in the L band, the term subtracted from the on-off gain for the net gain (OPA m1)'
  method: unspecified
  basis: author_estimate
  locator: p.4
  notes: 'Printed about 1 dB in the L band; origin not stated (rule 4). Not consistent with the OFDR minimum of 2.5 dB/m over 0.56 m (1.4 dB, p.3) nor with the 2.5 dB/m assumed for the Fig. 2(c),(d) analytical curves (D417 note). Same physical waveguide as the OPA row (D396).'
  why: 'Miss: p.4 prints the on-chip L-band waveguide loss of WG2 as its own value; a subtraction term of unstated origin is entered as author_estimate (wang2023e precedent, D444). Audit Q2'
- metric_id: cmp_lit_raghunathan2025_sin_bsfwm_qfc_ring-m6
  component_id: cmp_lit_raghunathan2025_sin_bsfwm_qfc_ring
  parameter: q_intrinsic
  value: 900000
  unit: '1'
  wavelength_nm: 1283
  polarization: tm
  condition: 'signal resonance of the conversion device; critical coupling inferred from the signal scan across the resonance (Fig. 2(a)); Q_i = 2 Q_L'
  method: ring_extraction
  basis: derived
  locator: p.3; p.5 Fig. 2(a)
  notes: 'Not printed: 2 x 4.5e5 (m4). The paper infers critical coupling from its own scan of the signal resonance (p.3, Fig. 2(a)); the 1283 nm panel of Fig. 2(a) is the only signal panel and its dip reaches about zero transmission (render), so the regime is determined from the data (D403; puckett2021 precedent, D463). The idler coupling is unknown (p.3), so no idler value.'
  why: 'Miss: D403 allows an intrinsic Q when the coupling regime is determined from the data; p.3 ties the critical-coupling inference to the Fig. 2(a) scan, whose only signal panel is 1283 nm. Audit Q5'
