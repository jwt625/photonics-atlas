  parameter: etch_depth_nm
  value: 300
  unit: nm
  condition: 'rib height H1 above the 500 nm slab (design)'
  basis: design_target
  locator: p.5 Fig. 4 caption; p.5
  notes: 'H1 = 300 nm printed for both designs (rib thickness, p.5 text and Fig. 4 caption); same convention as the fabricated rows (m7: rib height H1 = etch depth on the 800 nm film).'
