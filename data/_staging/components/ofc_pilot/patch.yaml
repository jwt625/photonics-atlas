# Audit patch ofc_pilot (fresh-context audit 2026-10-20), main block only (optional blocks not applied, D80).
components:
  cmp_ofc2026_w1b3_soa_dfb_1p8mm:
    fab_org_ids: org_furukawa_electric
    notes: Long-cavity SOA-integrated DFB-LD mounted on an AlN substrate (CoS); temperature sensed at the substrate bottom. Material system and lasing wavelength not stated in this paper. 'We newly design
      and fabricate' (pNA Sec. 1); all authors Furukawa Electric; fab_org_ids = org_furukawa_electric (D72 own-org fabrication, D76).
    why: 'D72/D76: authors ''design and fabricate'' the LD and the TOSA (pNA Sec. 1), all authors Furukawa Electric; replaces the pilot precedent'
  cmp_ofc2026_w1b3_tosa_8ch:
    fab_org_ids: org_furukawa_electric
    notes: '8-channel TOSA (sub-assembly for ELSFP modules, not a full module): eight 1.8-mm SOA-integrated DFB-LDs junction-down on AlN at 1.2 mm pitch, lens-integrated optical isolators to PMF, back-facet
      monitor PDs, FPC. Case temperature sensed at the TOSA substrate bottom. Wavelengths / channel grid not stated. TOSA size 22.5 x 13.0 x 3.3 mm cited from [5] (not entered). Simulated LD temperature
      (37 C at 1000 mA, 25 C case; 870 mA max for 65 C LD at 55 C case, Fig. 4) has no registry parameter. ''We newly design and fabricate'' (pNA Sec. 1); all authors Furukawa Electric; fab_org_ids = org_furukawa_electric
      (D72 own-org fabrication, D76).'
    why: 'D72/D76: authors ''design and fabricate'' the LD and the TOSA (pNA Sec. 1), all authors Furukawa Electric; replaces the pilot precedent'
  cmp_ofc2026_w3e1_soa_dfb_1p0mm:
    fab_org_ids: org_furukawa_electric
    notes: Designed for VHP ELSFP modules in air cooling; mounted on AlN, operating temperature sensed at the substrate bottom. Wavelength not stated. Earlier +21 dBm x 16-ch ELSFP with this LD is prior
      work [3] (not entered). 'designed and fabricated' by the authors (all Furukawa Electric); fab_org_ids = org_furukawa_electric (D72 own-org fabrication, D76).
    why: 'D72/D76: ''designed and fabricated'' (p.~1 Sec. 2; p.~2 Sec. 4), all authors Furukawa Electric'
  cmp_ofc2026_w3e1_soa_dfb_1p8mm:
    fab_org_ids: org_furukawa_electric
    notes: Same 1.8-mm design family as OFC 2026 W1B.3 (same group); entered separately per source. Mounted on AlN, operating temperature sensed at the substrate bottom. Wavelength not stated. 'designed
      and fabricated' by the authors (all Furukawa Electric); fab_org_ids = org_furukawa_electric (D72 own-org fabrication, D76).
    why: 'D72/D76: ''designed and fabricated'' (p.~1 Sec. 2; p.~2 Sec. 4), all authors Furukawa Electric'
  cmp_ofc2026_w3e1_elsfp_16ch:
    fab_org_ids: org_furukawa_electric
    notes: Two 8-ch TOSAs (LD variant used not stated), PCBA with regulator, MCU, temperature sensor and laser drivers (APC/ACC), blind-mate adaptor with two MT ferrules; PMF bend radius >7.5 mm [5]. PMF
      slow axis aligned to the MT guide-hole line; rotational angle error <2 deg for all channels (Table 1; no registry parameter). 'designed and fabricated' by the authors (all Furukawa Electric); fab_org_ids
      = org_furukawa_electric (D72 own-org fabrication, D76).
    why: 'D72/D76: ''designed and fabricated'' (p.~1 Sec. 2; p.~2 Sec. 4), all authors Furukawa Electric'
  cmp_ofc2026_w3e1_tosa_8ch_1p0mm:
    fab_org_ids: org_furukawa_electric
    notes: '8-ch TOSA, 22.5 x 13 x 3.3 mm; LDs on AlN at 1.2 mm pitch; PMF coupling via focusing-lens-attached isolators (row cmp_ofc2026_w3e1_lens_isolator_pmf_coupling). Case temperature sensed at the
      TOSA substrate bottom. Wavelengths not stated. Simulated max allowable LD current 600 mA at 55 C case for LD <65 C (Fig. 3; no registry parameter). ''designed and fabricated'' by the authors (all
      Furukawa Electric); fab_org_ids = org_furukawa_electric (D72: the TOSA assembly and PMF coupling process are described as the authors'' own, p.~1 Sec. 3; the companion paper W1B.3 states ''design
      and fabricate'' for the same TOSA).'
    why: 'D72/D76: authors'' own assembly (p.~1 Sec. 3), all authors Furukawa Electric; consistent with the LD / ELSFP rows'
  cmp_ofc2026_w3e1_tosa_8ch_1p8mm:
    fab_org_ids: org_furukawa_electric
    notes: '8-ch TOSA, 22.5 x 13 x 3.3 mm; LDs on AlN at 1.2 mm pitch; PMF coupling via focusing-lens-attached isolators (row cmp_ofc2026_w3e1_lens_isolator_pmf_coupling). Case temperature sensed at the
      TOSA substrate bottom. Wavelengths not stated. Simulated max allowable LD current 870 mA at 55 C case (Fig. 3; no registry parameter). ''designed and fabricated'' by the authors (all Furukawa Electric);
      fab_org_ids = org_furukawa_electric (D72: the TOSA assembly and PMF coupling process are described as the authors'' own, p.~1 Sec. 3; the companion paper W1B.3 states ''design and fabricate'' for
      the same TOSA).'
    why: 'D72/D76: authors'' own assembly (p.~1 Sec. 3), all authors Furukawa Electric; consistent with the LD / ELSFP rows'
  cmp_ofc2026_w3e1_lens_isolator_pmf_coupling:
    fab_org_ids: org_furukawa_electric
    notes: 'Parallel optical coupling system of both TOSA variants; axes aligned and PMF rotated to maximize coupling and PER, PMF fixed with adhesive. Isolation not stated. ''designed and fabricated''
      by the authors (all Furukawa Electric); fab_org_ids = org_furukawa_electric (D72: the TOSA assembly and PMF coupling process are described as the authors'' own, p.~1 Sec. 3; the companion paper W1B.3
      states ''design and fabricate'' for the same TOSA).'
    why: 'D72/D76: authors'' own assembly (p.~1 Sec. 3), all authors Furukawa Electric; consistent with the LD / ELSFP rows'
  cmp_ofc2026_w4e2_pcsel_200um:
    notes: Chip 0.5 x 0.5 mm; 200-um electrode / mirror diameter. Air-hole diameters after regrowth typically 130 / 80 nm, depth >500 nm (Fig. 1(a); geometry not entered). Lasing wavelength not stated numerically
      (O-band). Wavelength variation within +/-0.4 nm over 10 chips entered as wavelength_spread_nm (D71). Process described in Refs. [6,7]; fabricating org not stated. Sec. 1-3 precede the first page-image
      reference, so most locators are pNA + Sec./Fig.
    why: notes follow the D71 additions
  cmp_ofc2026_w4e2_pcsel_2x2_array:
    notes: Parallel drive; array devices 'not fully optimized'. Output-power deviation among the four single devices <0.50 dB at 2 A entered as power_uniformity_db (D71); array threshold about four times
      a single device; array total power linear up to 3 A (current-source limit). Spacing variation below +/-15 GHz for single devices and the array, also at high injection (Fig. 4(d),(f); no registry parameter).
      Abstract text prints '11 mm chip' (extraction artefact; Sec. 1 and 4 say 1 mm x 1 mm).
    why: notes follow the D71 additions
  cmp_ofc2026_th2a9_awg_16ch_1p6nm:
    notes: Fabricated at 'China United Microelectronics Center (CUMEC)' (p.~2 Sec. 3). Overlapping AWG; 2-um arrayed waveguides with parabolic tapers joined by 0.45-um curved waveguides; 45 and 90 deg Euler
      bends. Measured with an ASE source via TE GCs, SMF and OSA; central input port. 10-dB bandwidth 1.3 nm entered as bw_10db_nm (D71). Abstract footprint 540 x 590 um2 vs 550 x 590 um2 elsewhere. The
      extract appends the poster (_page_4_ images), not used for locators.
    why: notes follow the D71 addition
  cmp_ofc2026_tu2d3_si_strip_wg:
    notes: Samsung Foundry platform paper (Foundry Business, Samsung Electronics). Values from the Sec. 3 text, which summarizes Table 1 (Table 1 is an image, not read); statistic and test method not stated;
      Sec. 3 calls Table 1 'experimentally characterized results' and the DRF / PD values 'measured' (basis measured stands).
    why: 'coordinator flag (platform values of unstated origin): origin is stated as experimental (p.~1 Sec. 3); record the basis evidence'
