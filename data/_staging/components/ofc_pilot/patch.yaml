  cmp_ofc2026_w4b2_imc_sion:
    fab_org_ids: org_university_of_california_berkeley
    notes: Fabricated by the authors ('We present the design, simulation, and fabrication', pNA Sec. 1; process developed by the authors, p.~2 Sec. 3); all authors UC Berkeley -> fab_org_ids (D72/D76);
      no facility named. Measured on IMC pairs with SiON-waveguide loopbacks (pre-dicing) against an SMF-28 FAU. Fabricated lens dimensions not stated. Lens roughness ~50 nm and profile error estimated
      to add ~0.5 dB (author estimate, not entered). Sec. 1 (pNA) summary states 1.0 dB O-band / 1.4 dB C-band and PDL 0.3 / 0.1 dB; Sec. 4 states PDL 0.2 dB in the O-band.
    why: D72/D76 own-org fabrication applies to universities; all authors UC Berkeley
  cmp_ofc2026_m1b1_qd_soa:
    notes: 'Off-the-shelf QD-SOA (p.~1 Sec. 3), the device under test in an 8-lambda, 400-GHz-grid DWDM CPO link; external to the optical engine, PM fiber at the input, isolators around it. Operated at
      1.5 A pump and 60 C (Sec. 3: temperature; Fig. 2 caption: junction temperature). Power consumption 2.4 W entered as power_consumption_w (D71, author_estimate). Link results (9 dB Tx power reduction,
      2.0 dB 8-lambda penalty) are system metrics, not entered. VPI model assumptions (6 mm, 150 ps) not entered.'
    why: notes follow the D71 addition
