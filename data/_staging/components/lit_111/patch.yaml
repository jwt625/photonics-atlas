  cmp_lit_li2024_ubg_n1000_dw80-m1:
    notes: Printed 'as high as 29 dB' (p.7) and labelled in Fig. 6(b). ER saturates with dW at N = 1000, attributed to light collected from the LN slab. The Fig. 6(b) '11.9 nm' stopband arrow is entered as m6 (tied to the dW = 80 nm trace in the same way as the Fig. 6(a) 12.3 nm arrow).
    why: 'Follows the miss added as m6 (p.7 Fig. 6(b)): the note said the 11.9 nm arrow was not entered'
