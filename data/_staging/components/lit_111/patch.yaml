    basis: derived
    notes: Printed 1.8 and 2.2 um (w1, w2); stored in nm (unit rescaling, D157 / D256).
    why: p.3 Sec. 2 prints the grating end widths only in um (1.8 and 2.2 um); a pure unit rescaling is derived with the printed value in notes (D157, D256), the batch kept design_target
  cmp_lit_li2023a_drop_dc-m6:
    basis: derived
    notes: Printed 2.3 um (w3); stored in nm (unit rescaling, D157 / D256).
    why: p.6 Sec. 2 prints w3 only as 2.3 um (Fig. 4(b) axis in um); D157 / D256, the batch kept design_target
