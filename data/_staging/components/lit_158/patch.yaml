# Audit patch lit_158 (fresh-context audit 2026-11-16, DevLog/audits/2026-11-16-lit_158-audit.md).
# 58 metrics: 54 ok / 4 imprecise / 0 wrong (+2 note syncs); 9 components: 8 ok / 1 imprecise (note) / 0 wrong;
# 0 deleted; 0 misses added. After the patch: 9 components, 58 metrics.
# Coordinator rulings asked (audit Q1-Q6): Q1 lorenzen2025 stays at 0 rows (every device and value covered by
# lit:lorenzen2026; version link outside this patch); Q2 timurdogan2017 DC Kerr MZI stays out (EO-atlas candidate),
# fab and process_name stay empty (no op); Q3 yang2010a 14.4 dB / 4.1 cm kept as printed with the Fig. 2 conflict in
# notes (component + m1 / m3 ops; to drop the flag, drop those three ops); Q4 yang2010a "additional" channel losses
# stay out (no op); Q5 kasture2016 eta_norm stays author_estimate (notes only); Q6 xiong2011 inset geometry kept (no op).
components:
  cmp_lit_yang2010a_nd113_4p1cm:
    notes: 'Internal net gain gamma = 10 log10(Ip / Iu) / l - alpha (Eq. (1), p.4): pumped / unpumped signal ratio minus the
      background propagation and Nd absorption loss, so coupling losses drop out; basis derived (D166). Pump 802 nm (Ti:sapphire),
      launched 45 mW, small signal typically 1-10 uW, free-space objective coupling (p.3-4). Broadest net-gain bandwidth 865-930
      nm is stated across Fig. 4(b) and 4(c), several samples, not tied to one device (D159). Additional channel propagation
      losses 0.6 / 0.3 / 0.15 dB/cm at 880 / 1064 / 1330 nm (p.3, CCD scattered-light method) not entered: ''additional''
      leaves open whether they are the full channel loss or an excess over the slab loss, and the sample is not named. Nd
      lifetime 325 us, cross sections and ETU parameters have no registry parameter. Table 2 lists ''thickness 2.0 um, width
      0.6 um'', swapped against the text (600 nm layer, 2.0 um channel width, p.2): text values entered. Fab empty: passive
      fabrication sentences, all authors University of Twente (D80b); no facility named. Sample identity conflict (D417, printed
      values kept): the 1.13e20 length set is printed as 0.95, 1.30, 3.00 and 4.25 cm (p.6, Fig. 4(b) text), and the longest
      1.13e20 points in Fig. 2(b-c) sit at about 4.25 cm; at 1064 nm that point reads about 15.0 dB, while the 14.4 dB of
      the text matches the 1.68e20 point at about 4.1 cm (render, +/-0.2 dB, +/-0.05 cm). The 1330 nm 5.1 dB matches the 1.13e20
      point.'
    why: p.6 prints the 1.13e20 lengths 0.95 / 1.30 / 3.00 / 4.25 cm and the p.4 Fig. 2(b-c) render puts the longest 1.13e20
      points at about 4.25 cm, with about 15.0 dB at 1064 nm; the 14.4 dB the text ties to 1.13e20 / 4.1 cm matches the 1.68e20
      point at about 4.1 cm (coordinator Q3)
