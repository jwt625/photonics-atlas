    notes: 'Theory-only paper: cached arXiv text 2102.04049v1 is titled ''Design of Photonic Filters based on Integrated Coupled Sagnac Loop Reflectors'' (registry title is the JLT title; same DOI / arXiv id), values as this text reports them. Scattering-matrix model; lossless directional couplers assumed; model inputs n_g 4.3350 (TE) and alpha 55 m^-1 (2.4 dB/cm) taken from the authors'' earlier fabricated SOI devices (refs. 33, 40; cited, not entered). No fabrication; fab / facility empty. Comparison BPF: architecture of refs. [77, 78], designed and simulated by the authors in this paper on the same SOI wire model with the same ER and FSR as the zig-zag MC-SLR BPF (row zigzag_mcslr_bpf; p.15); no value is taken from the cited work (rule 3 / D259 do not apply); ring / loop dimensions and coupling coefficients not stated. Only the 3-dB BW is printed.'
