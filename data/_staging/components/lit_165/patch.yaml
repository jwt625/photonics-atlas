# Audit patch lit_165 (fresh-context audit 2026-11-16, DevLog/audits/2026-11-16-lit_165-audit.md).
# 72 metrics: 69 ok / 2 imprecise / 1 wrong (deleted); 17 components: 9 ok / 8 imprecise / 0 wrong; 4 misses added
# (arianfard2020 1-dB BW of the 50 / 200 GHz interleavers, Table III). After the patch: 17 components, 75 metrics.
# Coordinator rulings asked (audit Q1-Q5): Q1 arianfard2020 comparison designs kept (notes only); Q2 Fano device stays
# resonator.other (no op); Q3 thermal drift deleted (rule 3; reversal = drop the delete op); Q4 yang2018a KNI facility removed
# (D80c / D83e; reversal = drop the 4 component ops' facility change); Q5 lake2016 both maxima + platform other kept (no op).
components:
  cmp_lit_yang2018a_ridge_ring_d4p3mm:
    facility_org_ids: ''
    notes: 'Source text is the arXiv preprint 1702.05076v3 (2017-09-17) of the Nature Photonics paper; values as the preprint reports them (journal version not read). Fab org_caltech: p.6 Author contributions state that KYY, DYO and SHL fabricated and tested the resonator structures (all authors Caltech; D395 / D80b). Facility empty: the p.6 Acknowledgment names the Kavli Nanoscience Institute only together with the DARPA DODOS award (''gratefully acknowledge ... and the Kavli Nanoscience Institute''), with no use, place or fabrication-support wording (program-style acknowledgement, D80c / D83e). Staff thanks for PECVD / ALD / SEM help not used. Class: the paper calls it a ridge ring / ridge resonator (annular silica ridge after the ring-aperture undercut), entered as resonator.ring (judgment; lee2012 wedge disks are resonator.disk). Measured devices: FSR about 15 GHz, diameter about 4.3 mm; the Fig. 2 scans used a pulley waveguide (straight and pulley versions made, p.2-3). Fiber coupling to the SiN bus: row sin_bus_facet. The same resonator design hosts the soliton comb (row soliton_comb_15ghz; D396 cross-note). Not entered: D2/2pi = 6.4 kHz second-order dispersion (no registry parameter; D81), single-mode cutoff width about 1200 nm (simulated, Fig. 6), deposited SiN 500 nm before etch.'
    why: 'p.6 Acknowledgment: KNI is named only in the sentence that acknowledges the DARPA award, with no ''performed at'' / ''made use of'' / fabrication-support wording; rule 12 and D80c / D83e (a facility named only in a funding acknowledgement is a program acknowledgement)'
  cmp_lit_yang2018a_soliton_comb_15ghz:
    facility_org_ids: ''
    notes: 'Source text is the arXiv preprint 1702.05076v3 (2017-09-17) of the Nature Photonics paper; values as the preprint reports them (journal version not read). Fab org_caltech: p.6 Author contributions state that KYY, DYO and SHL fabricated and tested the resonator structures (all authors Caltech; D395 / D80b). Facility empty: the p.6 Acknowledgment names the Kavli Nanoscience Institute only together with the DARPA DODOS award (''gratefully acknowledge ... and the Kavli Nanoscience Institute''), with no use, place or fabrication-support wording (program-style acknowledgement, D80c / D83e). Staff thanks for PECVD / ALD / SEM help not used. Cross-note: soliton generation in the 4.3 mm resonator design of row ridge_ring_d4p3mm (D396); resonator designed to minimize avoided mode crossings. Solitons triggered with power kick and capture-lock (p.5). FROG shows a pulse period of 66.5 ps (round-trip time, Fig. 3(c)); pulse width not stated. Not entered: pump power as low as 61 mW for stable soliton operation (p.5; no registry parameter for a soliton-operation pump power; not a threshold).'
    why: as cmp_lit_yang2018a_ridge_ring_d4p3mm (p.6 Acknowledgment; D80c / D83e)
  cmp_lit_yang2018a_brillouin_laser_d6mm:
    facility_org_ids: ''
    notes: 'Source text is the arXiv preprint 1702.05076v3 (2017-09-17) of the Nature Photonics paper; values as the preprint reports them (journal version not read). Fab org_caltech: p.6 Author contributions state that KYY, DYO and SHL fabricated and tested the resonator structures (all authors Caltech; D395 / D80b). Facility empty: the p.6 Acknowledgment names the Kavli Nanoscience Institute only together with the DARPA DODOS award (''gratefully acknowledge ... and the Kavli Nanoscience Institute''), with no use, place or fabrication-support wording (program-style acknowledgement, D80c / D83e). Staff thanks for PECVD / ALD / SEM help not used. Separate design: diameter about 6.0 mm, chosen to phase match the Brillouin process for pumping near 1550 nm (p.5). Lasing Stokes wave collected counter-propagating to the pump. Not entered: ''Hertz-level'' short-term fundamental linewidth (no number), first-Stokes power (inset of Fig. 4 only, clamped by second-Stokes oscillation), pump-Stokes beat note near 10.88 GHz (axis label, no registry parameter), Q of the 6 mm devices (not reported).'
    why: as cmp_lit_yang2018a_ridge_ring_d4p3mm (p.6 Acknowledgment; D80c / D83e)
