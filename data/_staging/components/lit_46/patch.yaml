metrics:
  cmp_lit_jin2021_ring_30ghz-m1:
    basis: author_estimate
    notes: 'Intrinsic Q from the fit of the asymmetric mode doublet; author_estimate (D403): the doublet-lineshape fit of the transmission (p.2 Sec. Results, Fig. 1(c); p.9 Methods) gives the loaded linewidth and depth, which do not fix under- vs over-coupling; the under-coupled branch is taken from the design (pulley coupler designed under-coupled, p.11 Supp. Sec. I); the ring-down (p.2) checks only the loaded Q.'
    why: 'D403 / skill rule 4: p.11 Supp. Sec. I states the coupler is designed under-coupled so that the intrinsic Q can be measured; the regime is a design assumption, not determined from the data (amplitude transmission is symmetric under swapping intrinsic and external rates; ring-down p.2 gives only Q_L). Locator p.2 Fig. 1(c)'
