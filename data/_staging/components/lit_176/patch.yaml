components:
  cmp_lit_bozzola2015_gc_340_uniform:
    notes: 'Design-only paper (2D FDTD, Lumerical; n_Si 3.47, n_SiO2 1.44; semi-infinite top oxide; TE from SMF at 10 deg). No fabrication.
      Uniform reference of the Fig. 6 field-map comparison. Etch, BOX and period not stated for this design. The uniform curve of Fig. 5(a)
      is attributed to the authors'' ref. [21] (p.9) and its 340 nm point reads about 66 %, the same as the p.11 value; the 66 % is kept
      because the p.11 sentence carries no citation and the Fig. 6 comparison (field maps, 41 nm 1-dB bandwidth, 13.4 % reflection) is
      this paper''s own (D408); the 420 nm 73.1 % maximum of that curve is not entered (D259). Transmission losses 18.5 % (power not
      coupled, p.11) have no registry parameter.'
    why: 'p.9 Sec. 3 / p.10 Fig. 5(a) vs p.11 Sec. 3: the 66 % coincides with the [21]-attributed curve; relation recorded, value kept (D408)'
