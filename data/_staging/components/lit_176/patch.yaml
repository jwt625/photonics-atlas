  cmp_lit_chen2010_apodized_gc_340nm-m2:
    statistic: best
    why: 'p.2 Sec. II / p.3 Fig. 3 caption: 75.8 % is the conversion of the same "Up to -1.2 dB" peak value that m1 carries as best;
      pair kept consistent (marchetti2017 m1 / m2 precedent)'
  cmp_lit_bozzola2015_gc_340_uniform-m1:
    wavelength_inferred: ''
    locator: 'p.11 Sec. 3; p.10 Fig. 5(a)'
    notes: 'printed maximum CE of the uniform grating 66 % (p.11). 1550 nm stated: every design''s period is tuned to put the CE maximum
      at 1550 nm (p.6 method) and Fig. 5(a) plots CE @ 1550 nm, where the 340 nm uniform point reads about 66 % (+/- 1 %). See the
      component notes for the ref. [21] attribution of that curve.'
    why: 'p.6 Sec. 2 (period tuned to the 1550 nm target) and p.10 Fig. 5(a) axis "CE @ 1550 nm": the wavelength is stated, not inferred
      (skill rule 8)'
