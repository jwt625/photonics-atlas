# Audit patch lit_54 (fresh-context audit 2026-10-30, DevLog/audits/2026-10-30-lit_54-audit.md).
# 216 metrics: 204 ok / 12 imprecise / 0 wrong; 33 components: 30 ok / 3 changed (mauthe2020 class -> vertical,
# notes) / 0 deleted; 7 misses added (kang2008a simulated low-gain bandwidth, 6 pernice2012 BOX rows).
# Not covered here (coordinator / registry): alias IBM Research Europe -> org_ibm_research_zurich (mauthe2020),
# schuck2013 row structure (question 1, kept), registry gaps listed in the audit file.
components:
  cmp_lit_mauthe2020_ingaas_pin_w60:
    class: photodetector.vertical
    notes: 'Class photodetector.vertical (audit 2026-10-30): top illumination with the fiber at 10 deg from the normal (p.6
      Methods); precedent song2021 top-illuminated InGaAs PDs grown on Si (iii_v_on_si_epi, photodetector.vertical). Responsivity
      and high-speed measurements were performed on cross-like structures whose contact design fits the RF probes (p.6 Methods;
      Supp. Note 4 not cached). Fig. 6(a) S21 curves of the 60 / 200 / 500 nm devices: bias stated only for 200 nm. Free-space
      (top) illuminated, not waveguide coupled (p.2). Responsivity up to 0.68 A/W at -2 V and 1346 nm with QE up to 62 % (p.4;
      incident power estimated from fiber position and device area, Supp. Note 10 not cached) is stated for ''the measured
      device'' without its width: not entered (D159). Junction capacitance below 0.1 fF suggested by the scaled dimensions
      (p.3), not tied to a width: not entered. LED operation (EL near 1600 nm, about 1 um wide device, Fig. 5(b)) has no values.
      fab: author contributions (p.7) S.M. designed and fabricated the diodes; S.M. at IBM Research Europe, Rueschlikon (printed
      name; registry org_ibm_research_zurich, alias missing).'
    why: 'registry subtype vertical = vertical-illumination PD; the device is top-illuminated through free space (p.2 Results,
      p.6 Methods: fiber NA 0.14 at 10 deg from the normal); merged precedent cmp_lit_song2021_hs_d10..d40 (top-illuminated
      InGaAs p-i-n on Si, platform iii_v_on_si_epi) is photodetector.vertical'
  cmp_lit_mauthe2020_ingaas_pin_w200:
    class: photodetector.vertical
    notes: 'Class photodetector.vertical (audit 2026-10-30): top illumination with the fiber at 10 deg from the normal (p.6
      Methods); precedent song2021 top-illuminated InGaAs PDs grown on Si (iii_v_on_si_epi, photodetector.vertical). Responsivity
      and high-speed measurements were performed on cross-like structures whose contact design fits the RF probes (p.6 Methods;
      Supp. Note 4 not cached). Fig. 4(b) I-V vs power and Fig. 5(a) PL / spectral response use a 200 nm device. Fig. 6(a)
      S21 curves of the 60 / 200 / 500 nm devices: bias stated only for 200 nm. Free-space (top) illuminated, not waveguide
      coupled (p.2). Responsivity up to 0.68 A/W at -2 V and 1346 nm with QE up to 62 % (p.4; incident power estimated from
      fiber position and device area, Supp. Note 10 not cached) is stated for ''the measured device'' without its width: not
      entered (D159). Junction capacitance below 0.1 fF suggested by the scaled dimensions (p.3), not tied to a width: not
      entered. LED operation (EL near 1600 nm, about 1 um wide device, Fig. 5(b)) has no values. fab: author contributions
      (p.7) S.M. designed and fabricated the diodes; S.M. at IBM Research Europe, Rueschlikon (printed name; registry org_ibm_research_zurich,
      alias missing).'
    why: 'registry subtype vertical = vertical-illumination PD; the device is top-illuminated through free space (p.2 Results,
      p.6 Methods: fiber NA 0.14 at 10 deg from the normal); merged precedent cmp_lit_song2021_hs_d10..d40 (top-illuminated
      InGaAs p-i-n on Si, platform iii_v_on_si_epi) is photodetector.vertical'
  cmp_lit_mauthe2020_ingaas_pin_w500:
    class: photodetector.vertical
    notes: 'Class photodetector.vertical (audit 2026-10-30): top illumination with the fiber at 10 deg from the normal (p.6
      Methods); precedent song2021 top-illuminated InGaAs PDs grown on Si (iii_v_on_si_epi, photodetector.vertical). Responsivity
      and high-speed measurements were performed on cross-like structures whose contact design fits the RF probes (p.6 Methods;
      Supp. Note 4 not cached). 32 Gb/s NRZ eye at -2 V measured on a 500 nm wide device (Fig. 6(b), no parameter). Fig. 6(a)
      S21 curves of the 60 / 200 / 500 nm devices: bias stated only for 200 nm. Free-space (top) illuminated, not waveguide
