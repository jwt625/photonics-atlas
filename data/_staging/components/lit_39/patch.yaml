    notes: 'fab_org_ids: author contributions (p.15) state the lantern was fabricated on the NanoScribe tool by an author
      affiliated only with the Hebrew University of Jerusalem, at the Peter Brojde Laboratory for Miniature Integrated Systems
      (also thanked for 3D nanoprinting on the tool, p.15); that laboratory is not in the registry (facility not entered,
      reported). Sections (design): source interface 170 um, MUX 83 um, output taper (Fig. 1(a) label 122 um; text 115 um,
      p.6). Not entered: measured MDL 4.4 dB (holography) and PDL < 0.2 dB (mdl_db / pdl_db not allowed for mode_converter,
      registry gap); simulated full-device MDL 1.4 dB; highest coupling to higher-order modes -15 dB; OVNA system MDL with
      a fiber mode-preserving lantern demux (system-level, 18 um core fiber). A prototype printed on a glass substrate (Fig.
      8(a,b)) has no reported data. 7-core fiber with fan-out supplied by Chiral Photonics (note).'
    why: 'locator: the acknowledgements and author contributions sit after the <!-- page 15 --> marker of text.md (p.15),
      not p.14'
