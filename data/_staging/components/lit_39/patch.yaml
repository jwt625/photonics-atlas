    label: 50/50 2x2 MMI (5 x 90 um), 1.5 um access waveguides, of the uniform / pi-shifted MZI-IBGs, 220 nm SOI
    notes: 'fab_org_ids: fabricated in SOI using electron-beam lithography at University of Washington (p.8). CMC Microsystems
      acknowledged for contribution and technical support (p.14): not entered (no fabrication / MPW statement). The simulated
      loss is stated once for the designed MMIs (both access widths, p.8) and entered on both MMI rows; the 1.0 um access
      design is cmp_lit_simard2015_mmi_2x2_w1um. Fitted splitting-ratio asymmetries 8% (input) / 4% (output) for the uniform
      device (p.10) not entered (definition not given).'
    why: 'skill rule 9 / D102: the paper uses two MMI designs (1.5 um access waveguides for the Sec. 3 gratings, 1.0 um
      for the Sec. 4 filter, p.8 Sec. 2.4); one row with two port widths cannot be drawn without guessing; this row keeps
      the 1.5 um design'
metrics:
  cmp_lit_dana2024_output_taper-m1:
    excludes: 16.8 um facet mode overlap to the six-mode fiber (m2)
    condition: taper form n = 0.8 (chosen); coupling matrix between the taper input and output modes (Fig. 6(c)), taper
      section only
    why: 'p.7 Sec. Polymer waveguide taper and Fig. 6 caption: the -0.3 dB is computed from the coupling matrix between
      taper input / output modes; the fiber facet overlap (-0.2 dB, p.6, m2) is a separate term, so the per_coupler row
      must state that it excludes it'
  cmp_lit_ding2026_mc2_ring-m5:
    parameter: q_loaded
    basis: measured
    notes: 'printed as a Q-factor of 3.5e6 for the pumped mode without loaded / intrinsic qualifier (details in Supplementary
      Sec. 2, not cached); skill rule: an unqualified Q goes to q_loaded with a note. The next sentence compares it with
      a 4.8e6 mode at 1572 nm (Fig. 1(e) labels a 4.8e6 intrinsic Q for this resonator); the text does not label the 3.5e6
      itself'
    why: 'skill pitfall (unqualified Q -> q_loaded with a note) and coordinator ruling for this batch: p.5 prints the pumped-mode
      Q without qualifier; the comparison with the 4.8e6 value and its magnitude do not identify it as intrinsic'
  cmp_lit_ding2026_mc2_ring-m7:
    value: '66.6'
    condition: splitting of the TE00 / TM10 hybridized branches at degeneracy, 2G, from the fitted coupling rate G/2pi =
      33.3 GHz (coupled-mode fit, Fig. 2(b))
    notes: 'Eq. (1) (p.7 Methods): omega_pm = (omega1 + omega2)/2 pm sqrt(G^2 + (omega1 - omega2)^2 / 4), so the branch
      splitting at degeneracy is 2G; printed G/2pi = 33.3 GHz (p.5, p.7)'
    why: 'p.7 Eq. (1) (checked on the PDF render): the branch splitting at degeneracy is 2G, not G; mode_splitting_ghz is
      the supermode splitting, so the printed coupling rate 33.3 GHz is doubled (derived, D82d) and the note claiming splitting
      = G is corrected'
  cmp_lit_ding2026_platicon_ring-m3:
    value: '86.0'
    condition: splitting of the TE00 / TM10 hybridized branches at degeneracy, 2G, from the fitted coupling rate G/2pi =
      43.0 GHz (coupled-mode fit, Fig. 3(b))
    notes: 'Eq. (1) (p.7 Methods): branch splitting at degeneracy = 2G; printed G/2pi = 43.0 GHz (p.7)'
    why: 'as cmp_lit_ding2026_mc2_ring-m7: p.7 Eq. (1) gives a splitting of 2G; printed G/2pi = 43.0 GHz is the coupling
      rate'
  cmp_lit_simard2015_mmi_2x2-m1:
    notes: printed simulated total loss 0.1 dB, stated once for the designed MMIs (both access widths); wavelength not stated,
      devices operate near 1544 nm (Fig. 3, 8)
    why: note follows the split of the two MMI designs (p.8 Sec. 2.4)
