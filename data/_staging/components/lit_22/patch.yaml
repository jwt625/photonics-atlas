# Audit patch lit_22 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_22-audit.md).
# 295 metrics: 291 ok / 3 imprecise / 1 wrong; 49 components: 48 ok / 1 changed / 0 deleted; +1 component, 19 misses added.
# Not covered here (coordinator decisions): registry orgs (Washington Nanofabrication Facility, MIT Materials Research
# Laboratory, Lincoln Laboratory Microelectronics Laboratory), registry gaps listed in the audit record.
components:
  cmp_lit_chen2024a_qc_dc:
    notes: 'Non-volatile 2x2 coupler switch: Sb2S3 on the narrower waveguide, phase-matched in the a-state; segments 1 um apart with opposite-polarity
      PIN heaters (p.4-5). Coupler values (IL, ER, split ratio, endurance-test contrast) on this row; the endurance count and the 4 operation
      levels are on the sibling phase-shifter row qc_dc_pcm (D396). 52,600 switching events applied in total; Sb2S3 inactive after ~50,000 (p.5-6).
      Spectra normalized to an on-chip reference waveguide (Fig. 3 caption). Si wafers fabricated by Intel (p.2, p.7 Methods, acknowledgements
      p.9); Sb2S3 integrated in-house by the authors (contributions p.9; all authors University of Washington), hence both fab orgs. Facilities:
      Washington Nanofabrication Facility / Molecular Analysis Facility (not in registry) and SNSF (''Part of this work was performed at'', p.9).
      Measured with 20-degree angled fiber coupling, stage at 26 C (p.7).'
    why: 'D396: the PCM segments of the QC-DC are characterized as non-volatile actuators (endurance, levels, p.5) and get a phase_shifter.phase_change
      sibling row; note no longer claims a registry gap'
metrics:
  cmp_lit_chen2024a_qc_mzi_unequal-m2:
    basis: derived
    notes: printed ~0.059 pi step phase shift; computed by the authors from the 0.41 +/- 0.12 nm uniform spectral step and the MZI FSR (FSR not
      printed); same basis as sbs_mzi_60um-m1 / -m2
    why: 'p.7 / p.6 Fig. 4(f) caption: the phase step is the spectral step converted with the FSR (arithmetic on own measurement, D80a); batch-internal
      consistency with the 60 um MZI phase rows (derived)'
  cmp_lit_yong2021_ps1_suspended_3pass-m30:
    value: '2.3'
    value_max: '3.4'
    statistic: range
    wavelength_nm: '445'
    wavelength_max_nm: '561'
    condition: estimated phase-shifter loss = cutback loss of a 550 nm waveguide (about 8 - 5.5 dB/cm) x total phase-shifter waveguide length
      4.259 mm
    notes: printed 3.4 - 2.3 dB for 445 - 561 nm; the 5.5 dB/cm minimum of the cutback is at 532 nm (5.8 dB/cm at 561 nm, p.10), so the end values
      are not tied to single wavelengths; arithmetic on own cutback loss
    why: p.13 Sec. IV states one range for 445-561 nm; the 2.3 dB end corresponds to the 5.5 dB/cm value at 532 nm (p.10), not 561 nm; one range
      row instead of two per-wavelength rows
  cmp_lit_ozdemir2021_nrwpd_site_a_pooled-m3:
    notes: 'printed 1.98e-8 A/cm2 at -2 V (A -> mA); -2 V confirmed by the arithmetic: median 0.05 pA at -2 V over 505 nm x 500 um = 1.98e-8 A/cm2
      (the -1 V median is 5 fA); the conclusion (p.6) attributing it to -1 V is inconsistent with this'
    why: 'D159 ruling: bias is unambiguous from p.3 (value stated at -2 V and reproduced by 0.05 pA / 2.525e-6 cm2); note records the check'
delete_metrics:
- id: cmp_lit_yong2021_ps1_suspended_3pass-m31
  why: 'wrong: entered 2.3 dB at 561 nm with "about 5.5 dB/cm at 561 nm", but the cutback gives 5.8 dB/cm at 561 nm and 5.5 at 532 nm (p.10);
    the p.13 range is now one row (m30)'
add_components:
- component_id: cmp_lit_chen2024a_qc_dc_pcm
  source_id: lit:chen2024a
  class: phase_shifter.phase_change
  label: Two-segment Sb2S3 actuator (35 / 70 um, independent PIN heaters) of the quasi-continuous asymmetric DC, O-band
  row_kind: fabricated
  platform: soi
  core_material: Si 300 nm waveguide (400 nm wide in the MRR comparison, p.3) from the Intel 300 mm fab with PIN-doped Si heaters and vias; 4
    um oxide window opened in-house, ~20 nm Sb2S3 (40 nm sputtered, reduced by the lift-off trench effect) capped by 40 nm ALD Al2O3; Ti/Pt 15/200
    nm pads
  cladding: SiO2 top cladding (opened over the Sb2S3); 40 nm Al2O3 cap on the Sb2S3
  fab_org_ids: org_intel;org_university_washington
  facility_org_ids: org_stanford_nano_shared_facilities
  tags: phase_change;sb2s3;non_volatile;pin_heater;multilevel
  verified_on: '2026-10-29'
  notes: 'Non-volatile PCM actuator of the QC-DC (coupler row qc_dc holds IL, ER, split ratio and the endurance-test contrast; D396). Segment
    lengths on qc_dc (m10 / m11). Spectra normalized to an on-chip reference waveguide (Fig. 3 caption). Si wafers fabricated by Intel (p.2, p.7
    Methods, acknowledgements p.9); Sb2S3 integrated in-house by the authors (contributions p.9; all authors University of Washington), hence
    both fab orgs. Facilities: Washington Nanofabrication Facility / Molecular Analysis Facility (not in registry) and SNSF (''Part of this work
    was performed at'', p.9). Measured with 20-degree angled fiber coupling, stage at 26 C (p.7).'
  why: 'D396 / D254 precedent (meng2023 sibling rows): endurance and level count of the PCM segments (p.5, Fig. 3(c)-(d)) need a phase_shifter
    row; splitter has no endurance_cycles / n_levels'
