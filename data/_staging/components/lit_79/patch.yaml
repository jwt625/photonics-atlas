delete_metrics:
  - id: cmp_lit_gissibl2016_chiral_phc_left-m1
    why: 'p.7 Fig. 5(c): ratio of two figure readings at a distiller-chosen 1560 nm, no contrast printed; audit Q1. The same curves (coordinates of the figure paths) give 5.9 dB at 1540 nm, 3.5 dB at 1560 nm and 0.9 dB at 1580 nm, all inside the marked band, and p.5 says absolute values are not exactly calibrated'
  - id: cmp_lit_gissibl2016_chiral_phc_left-m2
    why: 'p.7 Fig. 5(c): ratio of two figure readings at a distiller-chosen 1560 nm, no contrast printed; audit Q1. The same curves give 6.6 dB at 1540 nm, 3.6 dB at 1560 nm (the row said 4.0) and 1.0 dB at 1580 nm; p.5 says absolute values are not exactly calibrated (T_RCP reads about 1.0 here)'
  - id: cmp_lit_gissibl2016_chiral_phc_right-m1
    why: 'p.7 Fig. 5(d): ratio of two figure readings at a distiller-chosen 1570 nm, no contrast printed; audit Q1. The condition also named the ratio backwards: 0.58 is T_LCP and 0.18 is T_RCP on this panel. The same curves give 5.7 dB at 1550 nm, 5.2 dB at 1570 nm and 1.9 dB at 1590 nm, all inside the marked band'
  - id: cmp_lit_gissibl2016_chiral_phc_right-m2
    why: 'p.7 Fig. 5(d): ratio of two figure readings at a distiller-chosen 1570 nm, no contrast printed; audit Q1. The condition also named the ratio backwards: 0.65 is T_LCP and 0.19 is T_RCP on this panel. The same curves give 8.2 dB at 1550 nm, 5.5 dB at 1570 nm and 1.6 dB at 1590 nm, all inside the marked band'
  - id: cmp_lit_gissibl2016_donut_shaper-m2
    why: 'p.6 Fig. 4(b): a ring peak-to-peak distance is not a beam diameter under any reading of the parameter; value moved to component notes'
  - id: cmp_lit_gissibl2016_top_hat_shaper-m2
    why: 'p.6 Methods: the 3 um waist is a design input chosen to compensate fabrication deformation, not the mode of the fibre or of a beam the part couples to (mfd_fiber_um definition, registry convention); value moved to component notes'
