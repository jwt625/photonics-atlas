  method: ring_extraction
  basis: author_estimate
  locator: p.7 Sec. 4; p.7 Eq. (5)
  notes: 'Printed ''kappa=0.009'' (fraction -> %). Eq. (5) as printed swaps kappa and 1 - kappa (literal M = 1.15); the corrected
