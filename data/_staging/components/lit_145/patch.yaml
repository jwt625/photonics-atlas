    why: "wrong reading. p.3 Fig. 2(c) pixel read of the cached render: axis ticks 0 / -1 / -2 nm at y 192.5 / 230 / 268 (37.7 px/nm), -10 / 0 / 10 V at x 837 / 980 / 1124; the 158 / 225 nm data and fit reach y about 250-254 at x 837-842 and about 247-251 at x 1118-1124, i.e. -1.5 to -1.6 nm at +/-10 V. The -1 nm level is crossed near -8.4 V, so the row's 1.0 nm / 29 deg / 0.16 pi reading was taken off the wrong point"
