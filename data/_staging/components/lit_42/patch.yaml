      22.5 nm 3-dB bandwidth at 15 mA (p.4; which SOA length not stated, D159).'
    why: 'p.4 Sec. IV-A: "show transparency currents at 3.7 mA and 4.2 mA, respectively [26]" carries a citation; the reason for not entering it is rule 3, not only the missing parameter'
  cmp_lit_lu2016a_pin_phase_shifter:
    notes: 'Fabrication done with the CMOS-compatible process in IME Singapore (p.5 Sec. 3); IME acknowledged for device fabrication (p.13): fab org_astar_ime. Heavily doped regions 0.8 um from the waveguide
      edges; doping ~1e20 cm-3. Table 2 EO switching currents 2.95-5.14 mA per element. FCA insertion-loss increase of about 1 dB in the ON state (p.7-8, p.9) not entered: EO phase-shifter (modulator) insertion
      loss stays with the EO atlas (skill rule 2); P_pi kept (not an EO-atlas quantity).'
    why: records the deleted m2 (coordinator ruling on EO phase shifters, skill rule 2)
