  cmp_lit_cohen2024_filter_2nd_order:
    notes: 'Channel element of the 1x7 WSS (D407: ring switch element inside a switch matrix, switch_fabric.other). Two racetracks, each about 1500 um round trip, Fourier tapers, standardized couplers Rmin
      = 5 um; doped-Si heater slabs 1.25 um from the waveguide. Spectral values without a switch_fabric parameter kept here (registry gaps): FSR about 54.5 GHz and extracted average group index 3.54 (p.5);
      off-resonance roll-off about 5.3 dB/GHz (abstract); design power coupling about 18 % (bus-racetrack) and 0.8 % (racetrack-racetrack) (p.4); bistability above 4.1 dBm on-chip input, linewidth broadening
      linear in dBm from -6.0 to 4.1 dBm (p.5, Fig. 5). Fab as the WSS row (p.4 Sec. III). Table I test structures (p.3) not entered (D259 / D259a / D408: the sentence presenting Table I attributes the
      values to the authors'' IPC 2022 paper [21], whose MPW run [21] also carried the structures, p.2): intrinsic Q / structure average loss (dB/cm) / structure loss (dB) / sub-component average loss (dB/cm):
      R = 20 um ring 4.37e5 / 1.8 / 0.0110 / 1.8; standardized coupler Rmin 3, 4, 5 um 1.43e5, 2.33e5, 3.29e5 / 5.43, 3.32, 2.33 / 0.0099, 0.0075, 0.0064; linear taper 30, 50, 100, 200 um 3.26e5, 5.57e5,
      8.26e5, 9.68e5 / 2.16, 1.24, 0.82, 0.70 / 0.0062, 0.0047, 0.0062, 0.0117 / 2.09, 0.95, 0.62, 0.59; Fourier taper 11.36 um 1.64e6 / 0.40 / 0.0034 / 3.01; 2 um multimode waveguide 700, 1200 um 1.67e6,
      1.89e6 / 0.40, 0.35 / 0.0170, 0.0300 / 0.24, 0.25.'
    why: 'records the values of the 13 deleted Table I test-structure components (coordinator ruling: D259 / D259a / D408; p.3 "The results are shown in Table 1, where we tabulate ... [21]"; p.2 "A subset
      of results ... presented at the IEEE Photonics Conference [21]")'
  cmp_lit_ding2017_mzi_element:
    notes: 'Fabricated in an open-access generic InGaAsP foundry MPW within the EU FP7 PARADIGM project (p.3 Sec. III, 4 mm x 6 mm sector); the foundry is not named: fab empty. Cell characterized as part
      of the switch (D158). The chip uses 1000 um and (where needed) 900 um long phase modulators; which MZI the crosstalk statement refers to is not stated (a single MZI on this chip). Crosstalk attributed
      to arm loss mismatch and MMI split-ratio error. MZI capacitance about 0.5 pF (p.7; no switch_fabric parameter). QCSE phase-modulator values not entered (EO modulator metrics stay with the EO atlas,
      skill rule 2; rows deleted): Vpi 9 V (1000 um) and 9.5 V (900 um) (p.4 Sec. IV-A); power-budget losses 1.2 dB (1000 um) and 1 dB (900 um) (p.4, Fig. 5, origin not stated).'
    why: records the values of the two deleted QCSE phase-modulator components (coordinator ruling, skill rule 2)
  cmp_lit_ding2017_soa_230um:
    notes: 'Fabricated in an open-access generic InGaAsP foundry MPW within the EU FP7 PARADIGM project (p.3 Sec. III, 4 mm x 6 mm sector); the foundry is not named: fab empty. Placed after each MZI. Not
      entered: transparency current 3.7 mA (p.4; the sentence carries ref. [26]: cited value, skill rule 3 / D80i, also no registry parameter); gain peak 1535.9 nm with 22.5 nm 3-dB bandwidth at 15 mA (p.4;
      which SOA length not stated, D159).'
    why: 'p.4 Sec. IV-A: "show transparency currents at 3.7 mA and 4.2 mA, respectively [26]" carries a citation; the reason for not entering it is rule 3, not only the missing parameter'
  cmp_lit_ding2017_soa_250um:
    notes: 'Fabricated in an open-access generic InGaAsP foundry MPW within the EU FP7 PARADIGM project (p.3 Sec. III, 4 mm x 6 mm sector); the foundry is not named: fab empty. Placed at the shuffle network
