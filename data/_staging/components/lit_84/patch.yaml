# Audit patch lit_84 (fresh-context audit 2026-11-04, DevLog/audits/2026-11-04-lit_84-audit.md).
# 277 metrics: 246 ok / 27 imprecise / 4 wrong (deleted, values kept in notes); 39 components: 36 ok / 3 imprecise, 1 deleted; 16 misses added.
# Not covered here (coordinator / org round): facility Albany Nanotech Complex on the three hossain2026 rows, missing from the registry; registry gaps in the audit file.
components:
  cmp_lit_boerma2026_sagnac_sgdbr_sil:
    notes: 'Fraunhofer HHI, Berlin, Germany. Fabrication statement p.2 Sec. II. Chip with on-chip photodiodes at the ring and Sagnac ports (Fig. 6: photocurrent vs ring heater power; no photodiode performance stated). Linewidth stays near minimum for ring heater offsets -10 to 2.5 mW (p.4). Chirp: 1.8 GHz over a 32 us period, residual error 47.4 MHz (2.61%) in 80% ROI, nonlinearity 7.0e-5 up / 5.4e-5 down (p.5 Sec. IV.A text): no registry parameter. Intracavity ring is row sagnac_sgdbr_ring. Figure conflict: Fig. 10 is captioned Sagnac SGDBR but plots about 6.3 GHz with labels 7.9E-06 / 1.7E-05, the values the text gives for the MMI DFB; Fig. 11 is captioned MMI DFB but plots about 1.8 GHz with labels 7.0E-05 / 5.4E-05, the values the text gives for the SGDBR. Text attribution kept.'
    why: 'p.5 Fig. 10, Fig. 11 renders against p.5 Sec. IV.A and IV.B text: captions and plotted values disagree; the row note cited Fig. 10 as the source of the SGDBR chirp'
  cmp_lit_boerma2026_mmi_dfb_sil:
    notes: 'Fraunhofer HHI, Berlin, Germany. Phase tuner between DFB and ring found unnecessary for stable locking (p.4). Chirp range: 6.29 GHz (p.5 Sec. IV.B text; the panel plotting about 6.3 GHz is the one captioned Fig. 10 for the SGDBR, see row sagnac_sgdbr_sil), 6.85 GHz (p.6 Table I, conclusion), 6.8 GHz (p.1 abstract); 3.34 GHz at 8 us period, rms error 0.12% / 0.23%, residual error 7.4 MHz, nonlinearity 7.9e-6 up / 1.7e-5 down: no registry parameter.'
    why: 'p.5 Fig. 10, Fig. 11 renders: Fig. 11 plots about 1.8 GHz, not 6.29 GHz'
  cmp_lit_heermeier2025_double_dbr_reference:
    notes: 'Comparison group of this study (p.8-9). Text gives apertures 2-5 um; Pmax is stated at 6 um and the Fig. 8 maps run to row 6. Fabrication: ''we'' with authors at TU Berlin and Lodz University of Technology; which org fabricated is not stated: fab left empty. Rth > 3 K/mW is cited from ref. [27], not entered. Tuning range of conventional double-DBR VCSELs 3-5 nm (p.15 Sec. V.D.1.a): generic comparison sentence, the reference column of Fig. 17 has no data cells: not entered.'
    why: 'p.15 text and Fig. 17 render: value moved from deleted row m4'
  cmp_lit_heermeier2025_top_dbr_15p5:
    notes: 'Cross-note: part of row double_dbr_reference (D396). The paper''s numbers conflict: 99.3% at 15.5 pairs (p.9) vs 99.43% with theoretical Q 6774 stated for 14.5 pairs (p.4), and about 93% / 93.3% on p.9. Fig. 3 (p.4, simulated) plots about 99.43% at 15 pairs and about 99.6% at 16 pairs, so 99.3% at 15.5 pairs is off that curve; kept as printed (D417). Direct reflectance measurement not possible per p.11.'
    why: 'p.4 Fig. 3 enlarged: adds the plotted curve to the conflict note; 14.5-pair value moved here from the deleted design row'
  cmp_lit_heermeier2025_mhcg_population:
    notes: 'Array-level row (D165): the values are stated for the sample or for an unspecified device. Fabrication: ''we'' with authors at TU Berlin and Lodz University of Technology; which org fabricated is not stated: fab left empty. Not assigned to a device (D159 / D254): SMSR 43-46 dB commonly measured within the operating range of the Fig. 23 regime (p.18); WPE 6-7% in the middle of each cluster (p.9, p.11); small / medium Rth 2.34 / 2.45 K/mW and 0.21 / 0.22 nm/mW for 6 um, P 520 nm devices of about 5 / 9 nm tuning (p.15-16; F not stated). Layer stack: 5.5 + 37 DBR pairs, Fig. 1 caption. Rows m7-m9 stay here because p.15 states dlambda/dT should not depend on the grating design; Rth and slope do depend on it (p.16), so the small / medium device values without F stay in notes (D159).'
    why: 'p.15 and p.16 Sec. V.D.1.b: reason for the different treatment of two kinds of single-device values'
  cmp_lit_heermeier2025_mhcg_p490_f64_h313_phi5:
    notes: 'Oxide aperture diameter is in the label (no registry parameter).  Fabrication: ''we'' with authors at TU Berlin and Lodz University of Technology; which org fabricated is not stated: fab left empty. Table I lists H 313 nm here and H 322 nm on device 5 with the same P and F.'
    why: 'p.19 Table I render: printed conflict not in the row note'
  cmp_lit_heermeier2025_mhcg_p490_f64_h322_phi3:
    notes: 'Oxide aperture diameter is in the label (no registry parameter).  Fabrication: ''we'' with authors at TU Berlin and Lodz University of Technology; which org fabricated is not stated: fab left empty. Table I lists H 322 nm here and H 313 nm on device 2 with the same P and F.'
    why: 'p.19 Table I render: printed conflict not in the row note'
  cmp_lit_heermeier2025_mhcg_p520_f61_phi4:
    notes: 'Oxide aperture diameter is in the label (no registry parameter). Abstract prints threshold as low as 0.25 mA; p.9, p.20 and Table I print 0.27 mA. Fabrication: ''we'' with authors at TU Berlin and Lodz University of Technology; which org fabricated is not stated: fab left empty. p.9 places the 0.27 mA device in the cluster middle, for instance UC 4 col. 6 or 7 (F 59 / 58 by p.18); Table I lists F 61, H 331 nm.'
    why: 'p.9 Sec. V.C.1, p.18 Sec. V.D.2, p.19 Table I: printed conflict not in the row note'
  cmp_lit_bai2023_pol_wdm_awg_8ch:
    notes: 'Two identical AWGs measured, one with a TE and one with a TM input grating coupler (p.4 Fig. 6). Fabrication sentence passive: fab not entered. Staff thanks at AEMD (SJTU) and at a Zhejiang University training platform (p.5) are not facility statements. Channel crosstalk not stated for the measured device; Fig. 8(b) shows TE leakage into TM channels up to about -15 dB and Fig. 8(c) TM leakage into TE channels up to about -8 dB at 1530 nm, -13 dB elsewhere (absolute level, not entered). Also a polarization splitter by function; no separate class row (no polarization metric beyond the simulated PER). Fig. 8 reads rows m48-m51: no printed crosstalk or 3-dB width; the reads use the printed channel centers, which match the plotted peaks within 0.1 nm.'
    why: 'p.5 Fig. 8 enlarged: basis of the added figure-read rows'
  cmp_lit_hossain2026_awg_1x13:
    notes: 'AIM Photonics, Albany NY, USA. Facility ''Albany Nanotech Complex'' (p.1, p.3) has no registry org. Stack per Fig. 2: 2.32 um SiO2 on Si, FN 220 nm, 100 nm SiO2, SN 220 nm, SiO2 top. Operating range 1500-1620 nm per abstract; plotted 1500-1600 nm (Fig. 4). Replicated on 64 dies, 29 characterized. Text gives crosstalk range 31-41 dB but Fig. 5(c) labels run to -45 dB. FPR facet radii of curvature: input FPR output facet 468 um; output FPR input facet 700 um and output facet 225 um (p.2 Sec. III): no registry parameter.'
    why: 'p.2 Sec. III: values moved from deleted rows m36-m38'
  cmp_lit_hoffman2016_bend_1um:
    notes: 'Data from two chips, single-mode fiber input (p.10). Fabrication sentence passive, authors at imec, KU Leuven and Ghent University: fab not entered. Fig. 11(a): labels 500 and 1000 are printed left of their tick marks; the last two data columns sit on those ticks, inside the text series 25-1000 um.'
    why: p.10 Fig. 11(a) enlarged
  cmp_lit_hoffman2016_bend_5um:
    notes: 'Data from two chips, single-mode fiber input (p.10). Compensated per-90 loss not stated for this width. Fabrication sentence passive, authors at imec, KU Leuven and Ghent University: fab not entered. Fig. 11(a): labels 500 and 1000 are printed left of their tick marks; the last two data columns sit on those ticks, inside the text series 25-1000 um.'
    why: p.10 Fig. 11(a) enlarged
