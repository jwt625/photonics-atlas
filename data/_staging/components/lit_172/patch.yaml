# Audit patch lit_172 (fresh-context audit 2026-11-16, DevLog/audits/2026-11-16-lit_172-audit.md).
# 200 metrics: 169 ok / 30 imprecise / 1 wrong; 33 components: 28 ok / 5 imprecise / 0 wrong; 1 metric deleted; 3 misses added.
# After the patch: 33 components, 202 metrics.
# Coordinator rulings asked (audit Q1-Q6): Q1 xuan2016 D403 split, comb rows, Purdue fab, Birck only on the Purdue-film row,
# Noel note (no op); Q2 quack2019 imec + EPFL fab and CMi facility also on the GC (no op), in-plane 0.55 pi figure read (no op);
# Q3 nedeljkovic2014 3.5 dB/cm deleted (D259 / D80i; revert = drop the delete op and the rib_wg notes op); Q4 sun2010 fab empty
# (no op); Q5 espinola2003 1/e rise as thermal_time_constant_us (no op); Q6 D157 unit rescales on 22 geometry rows (patched).
components:
  cmp_lit_xuan2016_ring_t800_w3:
    cladding: ''
    notes: '800 nm film ring of p.9 Sec. 5 (not a Table 1 entry): only film thickness, ring width and radius are printed; film source,
      cladding and annealing are not stated for these rings (Table 1 lists process variations, its default is the foundry film).
      Fab Purdue: first-person account of the process (''the process steps and variations we have attempted'', ''we follow the
      procedure in Ref. [34] and performed high-temperature annealing'', p.2-3); all authors at Purdue (School of ECE and Birck
      Nanotechnology Center; one author also at Universidad Tecnologica de Pereira) -> org_purdue_university. Birck Nanotechnology
      Center is named only for the Purdue-grown films (p.2): facility only on the purdue_film row.'
    why: 'p.9 Sec. 5 prints only 800 nm film, 3 um width, 100 um radius and Q_i 5.9e6 for this ring; the cladding text (3 um LTO,
      1150-1200 C anneal) and the foundry-film note were not stated for it (cladding only if stated)'
  cmp_lit_xuan2016_ring_t800_w5:
    cladding: ''
    notes: '800 nm film ring of p.9 Sec. 5 (not a Table 1 entry): only film thickness, ring width and radius are printed; film source,
      cladding and annealing are not stated for these rings (Table 1 lists process variations, its default is the foundry film).
      Fab Purdue: first-person account of the process (''the process steps and variations we have attempted'', ''we follow the
      procedure in Ref. [34] and performed high-temperature annealing'', p.2-3); all authors at Purdue (School of ECE and Birck
      Nanotechnology Center; one author also at Universidad Tecnologica de Pereira) -> org_purdue_university. Birck Nanotechnology
      Center is named only for the Purdue-grown films (p.2): facility only on the purdue_film row.'
    why: 'p.9 Sec. 5 prints only 800 nm film, 5 um width, 100 um radius and Q_i 7.7e6 for this ring; cladding / anneal not stated
      for it (cladding only if stated)'
  cmp_lit_xuan2016_ring_t750_w2_pieces:
    core_material: 'LPCVD stoichiometric Si3N4 750 nm, 2 um wide (film source not stated: Table 1 default is the foundry film, but
      the Birck furnace also grew films on cleaved wafer pieces, p.2)'
    why: 'p.2: the Purdue ProTemp furnace grew films on patterned 4 inch wafers and cleaved wafer pieces, Noel on patterned 4 inch
      wafers; Table 1 ''Fabricated on wafer pieces'' does not say where the 750 nm film was grown, so ''(foundry film)'' is not
      stated; facility left empty (ambiguous)'
  cmp_lit_xuan2016_edge_coupler:
    core_material: 'LPCVD stoichiometric Si3N4 600 nm (foundry-grown film, Noel Technologies), inverse nanotaper (tip width and taper
      length not stated), HSQ / EBL, CHF3/O2 ICP etch'
    why: 'p.4 Sec. 3 / Fig. 4: the coupler is an inverse nanotaper; the copied ''3 um wide'' is the resonator waveguide width, not a
      coupler dimension'
  cmp_lit_nedeljkovic2014_rib_wg:
    notes: 'Waveguide of the modulators. Not entered (D259 / D80i): ''Waveguides with these dimensions, characterized using the
      cut-back method, showed a propagation loss of 3.5 dB/cm'' (p.1 Sec. II) sits in the design section directly after ''In [4] we
      showed that MMIs fabricated according to the same design and using the same fabrication process exhibited ...''; the paper
      describes no cutback structure or measurement on this chip, and its only other loss statement (1.5 dB/cm for W = 1350 nm,
      p.3 / p.4) is ''previously shown'' in ref. [4]. 1.5 dB/cm and the MMI 0.10 +/- 0.01 dB: cited (rule 3). Fab: ''Chip fabrication
      was carried out at the Southampton Nanofabricaton Centre [sic], University of Southampton'' (p.2 Sec. III); all authors at the
      Optoelectronics Research Centre, University of Southampton -> org_university_of_southampton (bucio2017 precedent). The
      Southampton Nanofabrication Centre is not in the registry (reported as a missing facility). EBL + ICP Si etch, PECVD SiO2,
      sputtered Al patterned by contact lithography and ICP metal etch (p.2).'
    why: 'metric m1 deleted (D259 / D80i, audit Q3); the 3.5 dB/cm sentence is the design-section restatement of the authors'' ref. [4]
      characterization, not a measurement on this chip'
