delete_components:
- id: cmp_lit_wang2013_y_branch
  why: 'p.8 Sec. 3.1: the reflection peak ''about 3 dB below the transmission level, corresponding to the extra loss of the Y-branch'' is the ideal 1x2 split of the second Y-branch pass (reflection path passes the Y-branch twice, transmission path once); it carries no excess-loss or other performance value of the Y-branch and its attribution assumes full grating reflection. Stored as insertion_loss_db 3 dB per_component it would read as a 3 dB-loss Y-branch. Geometry-only otherwise (500 nm strip): rule 9, not a row; layout context stays in the grating notes'
