  cmp_lit_jiang2018a_loop_maswbg_filter-m9:
    notes: 'printed ''The resistor of the heater is 650 ohm. It''s easy to know that the power efficiency of the bandwidth tuning is about 20 mW/nm'' (p.7); check: 13 V on 650 ohm = 260 mW for the 13 to 1.0 nm bandwidth change (about 12 nm, p.6), i.e. about 20-22 mW/nm; the bandwidth change is the stop-band edge shift of the heated grating (Fig. 5: drop-port short-wavelength edge moves from about 1568 to about 1580 nm); stored as 1000 / 20 pm/mW (D82d, D256).'
    why: 'note supplement (row ok): arithmetic check of the printed 20 mW/nm against the 650 ohm and 0-13 V data'
  cmp_lit_jiang2018a_loop_maswbg_filter-m10:
    basis: derived
    notes: 'printed ''the power efficiency of the wavelength tuning is about 40 mW/nm, which is about twice the power consumption of the bandwidth tuning since two MASWBGs are heated simultaneously'' (p.7). The value is arithmetic on the paper''s own data, not an assumed input: Fig. 7 legend gives 0 / 9 / 12 / 13 V on both heaters, and 2 x 13^2 V^2 / 650 ohm = 520 mW over the ''over 13 nm'' centre shift (1575 to 1589 nm, Fig. 7 caption) gives 40 mW/nm; stored as 1000 / 40 pm/mW per mW of total heater power (D82d, D256: derived).'
    why: 'rule 4 / D80a: the printed 40 mW/nm reproduces exactly from the measured Fig. 7 voltages, the stated 650 ohm and the measured 13 nm shift; the doubling sentence explains it rather than replacing data with an assumption; so derived (as m9), not author_estimate'
