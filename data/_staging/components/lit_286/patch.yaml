# Audit patch lit_286 (fresh-context audit 2026-11-25, DevLog/audits/2026-11-25-lit_286-audit.md).
# 158 metrics: 132 ok / 25 imprecise / 1 wrong; 37 components: 34 ok / 2 imprecise / 1 wrong. 2 misses added.
# After the patch: 36 components, 159 metrics.
# Fixes: wang2013 Y-branch row deleted (the ~3 dB is the ideal 1x2 split of the extra reflection-path pass, no excess or
# performance value; rule 9); wang2013 phase-shifted grating locators moved to p.11 (Fig. 11 is on page 11 of text.md);
# jiang2018a / liu2017a grating-coupler-normalized filter IL scope de_embedded (rule 6); jiang2018a 40 mW/nm wavelength
# tuning basis derived (the printed value is the authors' arithmetic on Fig. 7 data: 2 x 13^2 / 650 ohm over 13 nm);
# jiang2018a fab notes cite the p.2 first-person sentence (fab stays empty: two unrelated author orgs);
# liu2017a simulated IL locators (Fig. 2 is on p.4). Misses: jiang2018a centre wavelength 1575 / 1589 nm (Fig. 7 caption).
components:
  cmp_lit_jiang2018a_loop_maswbg_filter:
    notes: 'MASWBG1 add-drop filter and MASWBG2 drop filter joined in a loop (Fig. 1). Spectra normalized to a pair of directly connected grating couplers on the same chip (p.5); later spectra ''normalized by the insertion loss of the grating coupler'' (p.6). Not entered: bandwidth tuning range ''about 12 nm (1.455 THz)'' (p.6) and ''over 1.455 THz'' (p.8) (no bandwidth-tuning-range parameter; tuning_range_nm is wavelength tuning); passband ripple ''less than 0.5 dB'' (p.8, no ripple parameter); heater resistance 650 ohm (p.7; heater_resistance_ohm not allowed for wdm); heater sheet resistance (printed 1.2 uOhm m, a resistivity unit; no parameter); ''almost no loss of spectral energy'' (qualitative). THz values printed beside the nm bandwidths are kept in notes only. Fab: first-person ''we designed and fabricated a broadband tunable filter'' (p.2 Sec. 1) and passive ''The devices were fabricated using electron-beam lithography on a standard commercial SOI wafer'' (p.5 Sec. 3), no org or place named; the authors sit at two unrelated institutions (eight at Zhejiang University, one at Longyan University), so the own org is not unambiguous (rule 12, D154): fab empty. No facility acknowledgment (Funding only, p.8).'
    why: 'p.2 Sec. 1 ''we designed and fabricated'' was not cited; fab stays empty because the authors are at two unrelated orgs (D154, two-institution ''we have designed and fabricated'' precedent in DevLog-007), not because the wording is passive'
  cmp_lit_jiang2018a_single_maswbg_sim:
    notes: 'Only one filter was simulated (memory limit, p.4); the simulated period 296 nm differs from the fabricated 300 nm, so this is a design row (D80e). Fabricated chip: first-person ''we designed and fabricated'' (p.2) and passive EBL fabrication sentence (p.5), authors at two unrelated institutions (Zhejiang University, Longyan University): fab empty (rule 12, D154).'
    why: 'same fab rationale correction as the loop filter row (p.2 first-person sentence; two unrelated author orgs)'
