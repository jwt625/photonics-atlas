# Audit patch lit_119 (fresh-context audit 2026-11-09, DevLog/audits/2026-11-09-lit_119-audit.md).
# 220 metrics: 214 ok / 5 imprecise / 1 wrong; 28 components: 24 ok / 4 imprecise / 0 wrong, 0 deleted; 7 misses added (7 metrics).
# Coordinator rulings open: Q1 piyush2026 29 mW (to keep it, drop the delete_metrics entry and restore the old W heater note
# sentence); Q2 piyush2026 split deviations stay out (D401); Q3 device assignments kept (fatema2026 area match, tabatabaei2026
# 157 fF confirmed by the vector read, goyvaerts2020 pooled coupon statistics, D465); Q4 parra2020 IL author_estimate and
# liu2024a in scope (no ops). The figure-read misses can be dropped one by one (add_metrics entries).
components:
  cmp_lit_piyush2026_w_heater_160:
    notes: 'Fab: ''fabricated using IMEC''s standard iSiPP50G silicon photonics platform'' (p.6 Sec. 2.3; p.19 Sec. 4: 1 x
      4 splitter fabricated using IMEC''s iSiPP50G platform): fab org_imec, process_name as printed. The fabricated set (standalone
      diodes, standalone heaters, DAMs, 1 x 4 circuit) is one foundry run (p.8 Sec. 3). Electrical packaging on a custom DC
      PCB with TEC; IZMO Microsystems thanked for assistance with the electrical packaging (p.23; not a fab of the photonic
      parts). Dedicated 1x2 MZI with independent heaters on both arms (p.11 Sec. 3.1.2). Measured heater I-V: about 25 mA
      at 4 V (Fig. 12). Temperature coefficient of resistance about 1.66e-3 /K extracted from the R-P curve (p.12; no registry
      parameter); dn_eff/dT 1.76e-4 /K estimated from P_pi (p.5). P_pi about 29 mW averaged over 24 fabricated devices of
      the foundry W heater (p.4 Sec. 2.2) is not entered (D159): the heater length of those devices is not printed, and the
      160 um length was chosen afterwards from a simulated 75 K heater-temperature limit at that power (p.5 Fig. 3(b)); the
      measured value of the 160 um heater is m1 (27.3 mW, p.12). Typical 160 ohm heater resistance (p.5) is cited (ref. 24):
      not entered.'
    why: 'Audit Q1 (D159): the 29 mW row (old m2) is deleted and its value moved here; p.4 prints it for 24 devices with no
      heater length, and p.5 derives the 160 um length from it, so the devices are not shown to be 160 um heaters. Locator:
      the Sec. 4 sentences cited here (220 nm SOI platform, iSiPP50G fabrication of the 1 x 4 splitter, about 50 mW at 3 V,
      12 % / 88 % power split, +/-0.015 / +/-0.025 dB) sit on p.19 of text.md (page marker before them), not p.18'
  cmp_lit_piyush2026_dam:
    notes: 'Fab: ''fabricated using IMEC''s standard iSiPP50G silicon photonics platform'' (p.6 Sec. 2.3; p.19 Sec. 4: 1 x
      4 splitter fabricated using IMEC''s iSiPP50G platform): fab org_imec, process_name as printed. The fabricated set (standalone
      diodes, standalone heaters, DAMs, 1 x 4 circuit) is one foundry run (p.8 Sec. 3). Electrical packaging on a custom DC
      PCB with TEC; IZMO Microsystems thanked for assistance with the electrical packaging (p.23; not a fab of the photonic
      parts). Standalone diode (measured, p.10 Sec. 3.1.1): about 90 mA at 2 V, series resistance about 11-12 ohm in the linear
      region, breakdown about -13.5 V, reverse leakage about 3.5 nA; cut-in about 0.9 V (p.13); TCAD: 6-7 ohm, about -15 V
      (p.7). Not entered: phase_shifter has no series_resistance_ohm / breakdown_voltage_v (registry gap). At 3 V about 12
      % of the power is dissipated in the diode and 88 % in the heater (p.19). The DUT of the dynamic tests is one MZI of
      the 1 x 4 splitter (p.14).'
    why: 'Locator: the Sec. 4 sentences cited here (220 nm SOI platform, iSiPP50G fabrication of the 1 x 4 splitter, about
      50 mW at 3 V, 12 % / 88 % power split, +/-0.015 / +/-0.025 dB) sit on p.19 of text.md (page marker before them), not
      p.18'
  cmp_lit_piyush2026_1x4_splitter:
    notes: 'Fab: ''fabricated using IMEC''s standard iSiPP50G silicon photonics platform'' (p.6 Sec. 2.3; p.19 Sec. 4: 1 x
      4 splitter fabricated using IMEC''s iSiPP50G platform): fab org_imec, process_name as printed. The fabricated set (standalone
      diodes, standalone heaters, DAMs, 1 x 4 circuit) is one foundry run (p.8 Sec. 3). Electrical packaging on a custom DC
      PCB with TEC; IZMO Microsystems thanked for assistance with the electrical packaging (p.23; not a fab of the photonic
      parts). Split deviation after phase-error correction: +/-0.15 dB at 1550 nm and +/-0.25 dB over 1545-1555 nm (p.18 Sec.
      3.3) vs +/-0.015 dB and +/-0.025 dB in the abstract (p.1, there ''across a 40 nm operating wavelength bandwidth'' while
      the measurement spans 1545-1555 nm) and the p.19 conclusion (conflict); not entered (D401: a per-port deviation from
      the ideal -6 dB is not imbalance_db or an insertion loss). Fig. 19(b) resolves neither value (audit view: trace noise
      of a few tenths of a dB on a 20 dB axis). Before correction the port powers are non-uniform (Fig. 19(a)). Per-MZI offsets
      in Table 1 (Voff-T 1.5 / 2.0 / 2.5 V, Voff-B -2.8 / -2.4 / -1.85 V).'
    why: 'Locator: the Sec. 4 sentences cited here (220 nm SOI platform, iSiPP50G fabrication of the 1 x 4 splitter, about
      50 mW at 3 V, 12 % / 88 % power split, +/-0.015 / +/-0.025 dB) sit on p.19 of text.md (page marker before them), not
      p.18; the abstract''s 40 nm span conflicts with the measured 1545-1555 nm range (p.17-18) and is noted with the split-deviation
      conflict (audit Q2)'
  cmp_lit_fatema2026_apd_50x120:
    notes: 'Fab empty: first-person bonding / processing statements (''we spun'', p.3) by authors at two unrelated orgs (University
      of Virginia, University of Maryland); no fabricating org named (D154). Epitaxial wafer source not stated. Responsivities
      are internal (on-chip): photocurrent over the waveguide power, with a simulated 2.94 dB fiber-to-waveguide coupling
      loss (p.5): author_estimate. Dark current / breakdown are from the Fig. 4(a) APD of area 6000 um2; among the measured
      sizes (Fig. 5(a): 50 x 80, 50 x 100, 50 x 120, 70 x 100, 60 x 150, 80 x 150 um) only 50 x 120 um has that area, so they
      are entered here (identity inferred from the area, not stated). Fig. 4(b) also shows circular APDs on SiN whose sizes
      are not printed; the text does not call the Fig. 4(a) device rectangular, so the assignment rests on the area match
      (audit Q3). Punch-through about -17 V (p.4). Simulated absorbed fraction about 80 % for a 55 um long APD (p.3). Which
      mesa dimension lies along the waveguide is not stated: absorber length / width not entered. Eye diagrams (5.5 / 6.5
      / 7.5 Gbps) were measured on a 60 x 150 um APD (p.7 Fig. 9): no registry parameter, no row. Table 1 values of other
      works not entered.'
    why: 'p.4 Fig. 4(b) caption: circular APDs fabricated on SiN exist besides the rectangular set of Fig. 5(a); the note
      now states that the 6000 um2 assignment rests on the area match (audit Q3) and lists the Fig. 5(a) sizes'
