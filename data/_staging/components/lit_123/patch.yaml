metrics:
  cmp_lit_zhang2021a_opa_64ch-m12:
    basis: derived
    notes: 'printed 0.22 um waveguide thickness (p.8); rescaled to nm (D157 / D256: the OPA sections print no nm form; the
      220 nm on p.2 belongs to the test waveguide)'
    why: 'D157 / D256: a unit rescale of a printed dimension is derived unless the source prints the stored-unit form for
      the same quantity; p.8 Sec. 4 prints 0.22 um for the OPA emitters'
  cmp_lit_zhang2021a_sin_wg_1500x400-m1:
    wavelength_inferred: 'true'
    condition: input peak power (10 ns pulses, 100 kHz) at 90 % survival from the fitted survival curve of 48 waveguides;
      coupling loss not subtracted (Sec. 2.1 method); individual damage between 11.6 and 285 W; 80 % survive below 88 W
    notes: 'printed damage threshold 35 W peak; 10 log10(35000 mW) = 45.44 dBm. A 90 %-survival damage threshold, not a no-degradation
      level (criterion in condition, audit Q3). Sec. 2.2 does not restate the wavelength: 1550 nm inferred from the Sec. 2.1
      method it says it reuses (p.3-4).'
    why: 'p.3-4 Sec. 2.2 reuses the ''above-mentioned method'' without restating 1550 nm or the coupling-loss convention:
      wavelength is inferred (rule 8) and the Si row''s ''coupling loss not considered'' condition applies'
  cmp_lit_wang2026g_ps400_plain-m5:
    basis: derived
    notes: 'printed bandwidth computed by the authors from the measured rise / fall times (values reproduce 0.35 / mean(rise,
      fall); the relation is not printed), not a small-signal frequency response; arithmetic on the paper''s own measurements:
      derived (D80a; merged chang2026a, guo2024, wang2022b precedents); text prints > 68 kHz'
    why: 'D80a / merged precedents: a bandwidth the authors compute from their own measured rise / fall times with an unprinted
      relation is derived (chang2026a 729 kHz, guo2024 32 kHz, wang2022b 30 kHz); no assumed, nominal or cited input (rule
      4), audit Q4'
  cmp_lit_wang2026g_ps400_trench-m5:
    basis: derived
    notes: 'printed bandwidth computed by the authors from the measured rise / fall times (values reproduce 0.35 / mean(rise,
      fall); the relation is not printed), not a small-signal frequency response; arithmetic on the paper''s own measurements:
      derived (D80a; merged chang2026a, guo2024, wang2022b precedents); text prints a minimum bandwidth of about 66 kHz'
    why: 'D80a / merged precedents: a bandwidth the authors compute from their own measured rise / fall times with an unprinted
      relation is derived (chang2026a 729 kHz, guo2024 32 kHz, wang2022b 30 kHz); no assumed, nominal or cited input (rule
      4), audit Q4'
    condition: detector-limited response (rise time 3.1 us below the about 3.5 us detector limit)
  cmp_lit_wang2026g_ps100_uc3-m5:
    basis: derived
    notes: 'printed bandwidth computed by the authors from the measured rise / fall times (values reproduce 0.35 / mean(rise,
      fall); the relation is not printed), not a small-signal frequency response; arithmetic on the paper''s own measurements:
