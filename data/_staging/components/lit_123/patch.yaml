# Audit patch lit_123 (fresh-context audit 2026-11-11, DevLog/audits/2026-11-11-lit_123-audit.md).
# 321 metrics: 312 ok / 8 imprecise / 1 wrong (deleted); 44 components: 31 ok / 13 imprecise / 0 wrong; 0 misses.
# 22 ops (13 component, 8 metric, 1 delete_metrics).
# Coordinator rulings open: Q1 poulsen2025 CMC fab (no op; to drop CMC, set fab_org_ids org_amf on the 3 poulsen2025
# rows), Q2 zhang2021a 0.02 deg (to keep it, drop the delete_metrics op and the OPA notes op), Q3 damage thresholds
# (no op), Q4 wang2026g bandwidths (to keep author_estimate, drop the 6 bw3db_khz ops), Q5 shared stack (no op),
# Q6 imec Xplore lab (to defer, drop the 12 wang2026g component ops).
components:
  cmp_lit_zhang2021a_opa_64ch:
    notes: 'Fab org_amf: p.5 Sec. 3.1 states the authors designed and fabricated the OPA chip with the standard silicon photonics
      integration process in AMF, Singapore; p.2 places the Si and PECVD SiN test waveguides on ''our chip'' (same chip assumed
      from that wording). process_name left empty: the printed process wording names no node or flow. Not entered (no registry
      parameter for free_space_emitter): main-lobe peak power about 720 mW at 24 W input peak (10 ns, 100 kHz; Fig. 8(d),
      p.8), input peak power of 43 W withstood (p.8), average electrical power 1.23 W per steering state over the 11 calibrated
      angles (p.7). Phase calibration by an iterative voltage search against a target far field (p.7). Theoretical steering
      +/-90 deg; measured range limited by the narrow 200 nm emitter tips (p.7). Fig. 4 (5 um pitch OPA far field, grating
      lobes at +/-18 deg) is not tied to a device of this paper and is not entered. The 0.02 deg longitudinal divergence (p.1
      Abstract; p.9 Sec. 4, Fig. 9(c), (f)) is measured with an off-chip bulk plano-convex cylindrical lens 17 mm in front
      of the chip (screen at 3 m), for the 0 deg and the 10-55 deg beams: not entered (D411, bulk off-chip optic); the chip''s
      own longitudinal value is the 32 deg row.'
    why: 'Follows the deletion of m6 (audit Q2): the lens-system divergence is kept in the component notes'
  cmp_lit_wang2026g_ps800_plain:
    facility_org_ids: org_xplore_multiuser_cleanroom
    notes: 'Configuration: 800 um heater, no bridges, no SiO2 trench, no Si undercut.  Fab org_imec: waveguide stack processed
      in the imec 200 mm CMOS pilot line (p.4 Sec. 3); heater, SiO2 trench and Si undercut modules developed by the authors
      on diced dies in the imec Xplore lab (p.5, first-person die-level post-processing of the diced pilot-line wafer; D440:
      imec is both the wafer fab and the authors'' org; benchmark exclude_values candidate, D933). Facility org_xplore_multiuser_cleanroom
      for the printed ''imec Xplore lab'' (p.5; alias to be added in the org round, audit Q6). Phase shifter in one arm of
      an unbalanced MZI (5 um arm-length difference) with input / output grating couplers; transmission normalized to a short
      reference waveguide (p.2, p.6). Undercut designs: two 15 um wide trenches 10 um apart, centred on the waveguide, and
      an isotropic Si undercut (p.2); XSEM shows an upward beam deflection from residual stress (p.6). Platform loss 0.60
      +/- 0.17 dB/cm (p.2) not entered: platform reported in the authors'' ref. [18] (p.5, D259 / D408). IL / ER of the MZIs
      shown only as curves (Fig. 4), stated as similar for the three 800 um structures (p.6).'
    why: 'p.5 Sec. 3: the heater, SiO2 trench and Si undercut modules were made on the die level in the imec Xplore lab (''performed
      at'', rule 12); the registry facility org_xplore_multiuser_cleanroom is the imec Xplore cleanroom of khalil2026 (imec
      authors, Leuven), so the facility is set and the printed name goes to the org round as an alias (audit Q6); MMI rows
      untouched (pilot-line parts, Contract v7 fab per component)'
