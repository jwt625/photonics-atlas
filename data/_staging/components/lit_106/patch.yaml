  value: 220
  unit: nm
  condition: Si device layer of the inverse taper (foundry SOI stack)
  basis: derived
  locator: p.2 Sec. 2
  notes: Printed 0.22 um, converted (D157); same layer as the microdisks (core_thickness_nm 220 on cmp_lit_kiani2023_tm_disk_r20 / _r30).
  why: 'Miss (D153). p.2 Sec. 2 states the 0.22 um Si waveguide layer in which the inverse tapers are patterned; core_thickness_nm is the required cross-section dimension of the edge_taper layout template and the batch kept it only in core_material'
