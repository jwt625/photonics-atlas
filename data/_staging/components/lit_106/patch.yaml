# Audit patch lit_106 (fresh-context audit 2026-11-08, DevLog/audits/2026-11-08-lit_106-audit.md).
# 156 metrics: 150 ok / 6 imprecise / 0 wrong; 23 components: 23 ok / 0 imprecise / 0 wrong, 0 deleted; 5 geometry misses added.
# Ops: 6 metric field changes (structured wavelength for printed approximate wavelengths, D393; one D256a note) and 5 add_metrics
# (D153 layout geometry). Coordinator rulings open (Q1-Q5 in the audit) need no patch op unless the coordinator overrules a keep.
metrics:
  cmp_lit_kiani2023_tm_disk_r20-m7:
    wavelength_nm: 1510
    why: 'p.7 Sec. 4.1 prints the FSR "around 1510 nm": a stated approximate wavelength (D393), so it goes into wavelength_nm (not inferred); the batch kept it only in the condition text'
  cmp_lit_kiani2023_tm_disk_r20-m8:
    wavelength_nm: 1900
    why: 'p.7 Sec. 4.1 prints the FSR "at the ~1900 nm laser wavelength": stated approximate wavelength (D393), structured field set as on the 1900 nm Q rows of the same component (m4-m6)'
  cmp_lit_kiani2023_tm_disk_r30-m7:
    wavelength_nm: 1510
    why: 'p.7 Sec. 4.1 prints the FSR "around 1510 nm": stated approximate wavelength (D393); the batch kept it only in the condition text'
  cmp_lit_kiani2023_tm_disk_r30-m8:
    wavelength_nm: 1900
    why: 'p.7 Sec. 4.1 prints the FSR "at the ~1900 nm laser wavelength": stated approximate wavelength (D393), as on the 1900 nm Q rows of the same component (m4-m6)'
  cmp_lit_soltanian2022_dual_wtl-m4:
    wavelength_nm: 1530
    why: 'p.7 Sec. 4: the frequency-noise measurement behind the about 20 kHz Lorentzian linewidth is taken "while the lasing wavelength is 1530 nm"; the batch kept the wavelength only in the condition text'
  cmp_lit_ferrotti2016_grating_coupler-m2:
    notes: 'Printed 1.3 um ("centered at 1.3 um", p.14 and p.17-18), stored in nm; author_estimate kept after the unit conversion (D256a). Origin not stated (no grating-coupler spectrum shown).'
    why: 'p.14 Sec. 3.4 prints the peak wavelength only as 1.3 um; D256a requires the printed value and the conversion in notes for an author_estimate row stored in another unit (the batch notes said only "Origin not stated")'
