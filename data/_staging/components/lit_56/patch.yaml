  cmp_lit_biberman2012_ridge_ring_r2p45mm-m1:
    notes: printed FWHM 9.9 MHz (text and Fig. 2(a) label); the Fig. 2(a) arrows mark the width at -3 dB transmission, not at half depth of the ~7.1 dB dip (a Lorentzian half-depth width would be ~12.7 MHz); value kept as printed
    why: 'p.2 Fig. 2(a) render: arrows at -3 dB on the transmission (dB) axis; dip minimum ~-7.1 dB'
  cmp_lit_biberman2012_ridge_ring_r2p45mm-m2:
    notes: 'printed Q0 = 2.2 x 10^7 (transfer-matrix Lorentzian fit); coupling regime not stated (D403). Cross-check: 9.9 MHz and the ~7.1 dB dip give ~2.6e7 (under-coupled); the half-depth width implied by the -3 dB arrows (~12.7 MHz) gives ~2.05e7 (under) / ~5.3e7 (over); printed value kept'
    why: 'imprecise note: the mismatch recorded by the distiller is largely explained by the -3 dB width convention of Fig. 2(a) (render p.2); D403 basis endorsed'
  cmp_lit_biberman2012_ridge_ring_r2p45mm-m6:
    notes: 'printed Q0 = 1.4 x 10^5 from the fit; coupling regime not stated (D403). Cross-check: FWHM 1668.2 MHz (arrows at about half depth of the ~19.5 dB dip) gives Q_L ~1.16e5 and Q0 ~2.1e5 (under-coupled) or ~2.6e5 (over-coupled), not the printed value; the mode solver gives 1.3246e5 (p.3); printed value kept'
    why: 'p.2 Fig. 3(a) render: dip ~-19.5 dB, FWHM arrows near -3 dB (= half depth for this dip); neither branch reproduces 1.4e5 (he2023 / lit_49 precedent: printed value kept, mismatch recorded)'
