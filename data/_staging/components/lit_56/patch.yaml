  cmp_lit_zhang2010_te_converter_l5um:
    notes: 'Transition length 5 um of the 5 / 10 / 30 um series (Tables 1-2). Two-layer (pseudo-vertical + symmetric lateral taper) TE mode converter between a 200 (w) x 400 (h) nm ''vertical'' and a 400 (w) x 200 (h) nm ''horizontal'' Si waveguide, for a proposed PSR; classed mode_converter.converter (shape conversion of the TE0 mode within one Si layer, not an inter-material transition). Transition IL is the authors'' arithmetic on their own measurements (derived, D80a / D166): -1 dBm input minus the measured output power, minus the 5.5 dB lensed-fiber coupling + 3 mm propagation term measured on a simple waveguide of the same wafer (''estimated'', cmp_lit_zhang2010_ref_waveguide_3mm) and the 5 dB second-polarizer loss (setup readings -1 dBm after the first polarizer, -6 dBm with the second, p.6); about +/- 0.5 dB coupling variation between loadings (p.6). Measured with a 1530-1570 nm ASE source (broadband, integrated power); flat response over that range stated (p.7). 3D FDTD transition-length study (Fig. 3, curve only) and the 10 um wavelength scan (''flat response'', no number) not entered. Fab / facility empty: ''were fabricated'' (passive), all authors IME A*STAR (D80b).'
    why: 'p.6 render: input -1 dBm and -6 dBm with the second polarizer (5 dB, measured in the setup); the 5.5 dB term is measured on a reference waveguide; neither term is nominal'
