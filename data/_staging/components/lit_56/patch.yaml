  cmp_lit_biberman2012_ridge_ring_r2p45mm:
    notes: 'Single bus-coupled ring (all-pass); TE resonance at 1600 nm and TM resonance at 1554 nm of the same ring are conditions of one row. Q0 values are fits to a transfer-matrix Lorentzian model; the paper does not state how the under / over-coupled branch was assigned, so q_intrinsic and the losses derived from it are author_estimate (D403). Cross-check: the printed FWHM (TE 9.9 MHz, Q_L ~1.9e7 at 1600 nm; TM 1668.2 MHz, Q_L ~1.16e5 at 1554 nm) with the dip depths read off Fig. 2(a) / 3(a) (~7.1 / ~19.5 dB) give ~2.6e7 (TE) and ~2.1e5 (TM) under the standard all-pass under-coupled formula, not the printed 2.2e7 / 1.4e5. The Fig. 2(a) arrows mark the TE width at -3 dB transmission, not at half depth of the ~7.1 dB dip; the half-depth Lorentzian width would be ~12.7 MHz, which gives ~2.05e7 (under-coupled) / ~5.3e7 (over-coupled), close to the printed TE value. The TM arrows sit at about half depth (deep dip), so the TM mismatch remains (~2.1e5 / ~2.6e5 vs printed 1.4e5; mode solver 1.3246e5). Printed values kept (author_estimate). Total fiber-to-fiber chip insertion loss about 30 dB and about -25 dBm in the ring (p.2; couplers not described, no coupler row). Fab / facility empty: ''were fabricated'' (passive), authors at MIT RLE and Sandia; the acknowledgment is the Sandia contract statement only. Comparison values (silica, SiN, microdisk losses, p.1) are other works, not entered.'
    why: 'p.2 Fig. 2(a) render: the FWHM arrows sit at -3 dB on the dB axis of a ~7.1 dB dip; recomputed both branches'
