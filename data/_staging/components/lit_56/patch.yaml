    notes: 'Array-level row (D165) for the four Brillouin-laser devices (mask diameters 6,020 / 6,044 / 6,062 / 6,080 um, p.3); FSRs from the Fig. 4(a) legend (the same values appear as the measured points vs target diameter in Fig. 3, larger diameter = smaller FSR). Mask-to-final diameter reduction ~10 um for 10 um oxide (p.3). FSR-control statistics not entered (no parameter): r.m.s. deviation from the linear fit 2.4 MHz over five devices of one wafer (FSR ~11 GHz) and 0.45 MHz over four devices of the same target on a second wafer (FSR ~8.707 GHz, Fig. 3 inset; target diameter not stated). Oxide thickness and wedge angle of these devices not stated. Laser function: cmp_lit_lee2012_wedge_sbl (D396). Fiber-taper coupled (SMF-28 taper on the upper surface near the wedge centre); spectra taken under-coupled, TE, laser scan calibrated by a 7.75 MHz-FSR fiber MZI; ring-down measurements agreed with the linewidths (p.1-2). Q values: Fig. 2 caption list (each value one device); the inset labels the 875 M value ''Q_int'' for an under-coupled resonance (FWHM 0.3 MHz). The coupling regime is set and identified experimentally (taper gap adjusted between under- and over-coupling, p.1 / Fig. 2 caption), so the values are kept measured (D403 judgment, report). All measurements ''in the 1,500 nm band'', TE, ~1 uW coupled power. Not entered: model material Q 2.5 billion (fit, p.2 / p.5), AFM r.m.s. roughness (upper 0.15, wedge 0.75, lower 0.70 nm for 27 deg; Methods), 10-deg-wedge and 2 / 4 / 7.5 um oxide data (plotted only, Fig. 2), earlier wedge Q 50 M (own earlier work, ref. [15]). Fab org_caltech: p.5 Author contributions state that H.L. performed the microfabrication of the devices with assistance from T.C. and K.Y. (all authors Caltech; D395 / D80b). Facility: p.5 Acknowledgements acknowledge support from the Kavli Nanoscience Institute at Caltech (not in the registry; org round, then facility_org_ids).'
