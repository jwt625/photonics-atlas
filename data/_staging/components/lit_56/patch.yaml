components:
  cmp_lit_lee2012_wedge_d7p5mm_27deg:
    fab_org_ids: org_caltech
    notes: 'Red (27 deg, 10 um oxide) data point of Fig. 2 at D ~7.5 mm; 2 devices listed in the caption. Fiber-taper coupled (SMF-28 taper on the upper surface near the wedge centre); spectra taken under-coupled, TE, laser scan calibrated by a 7.75 MHz-FSR fiber MZI; ring-down measurements agreed with the linewidths (p.1-2). Q values: Fig. 2 caption list (each value one device); the inset labels the 875 M value ''Q_int'' for an under-coupled resonance (FWHM 0.3 MHz). The coupling regime is set and identified experimentally (taper gap adjusted between under- and over-coupling, p.1 / Fig. 2 caption), so the values are kept measured (D403 judgment, report). Cross-check: FWHM ~0.3 MHz gives Q_L ~6.4-6.7e8 (1550-1500 nm); with the inset dip minimum read as 0.15-0.25 (normalized) the under-coupled branch gives ~0.86-0.96e9, consistent with the printed 875M; the over-coupled branch would give ~2.1-2.7e9. All measurements ''in the 1,500 nm band'', TE, ~1 uW coupled power. Not entered: model material Q 2.5 billion (fit, p.2 / p.5), AFM r.m.s. roughness (upper 0.15, wedge 0.75, lower 0.70 nm for 27 deg; Methods), 10-deg-wedge and 2 / 4 / 7.5 um oxide data (plotted only, Fig. 2), earlier wedge Q 50 M (own earlier work, ref. [15]). Fab org_caltech: p.5 Author contributions state that H.L. performed the microfabrication of the devices with assistance from T.C. and K.Y. (all authors Caltech; D395 / D80b). Facility: p.5 Acknowledgements acknowledge support from the Kavli Nanoscience Institute at Caltech (not in the registry; org round, then facility_org_ids).'
    why: p.5 Author contributions ('H.L. performed microfabrication of devices with assistance from T.C. and K.Y.') and Acknowledgements (Kavli Nanoscience Institute at Caltech) exist in the cached text; fab = the named fabricating author's org (D395 / D80b), all authors at Caltech
