# Audit patch bench_01 (fresh-context audit 2026-11-07, DevLog/audits/2026-11-07-bench_01-audit.md).
# 20 metrics: 16 ok / 4 imprecise / 0 wrong; 13 components: 11 ok / 2 imprecise / 0 wrong; 0 misses added.
# Coordinator rulings open: to keep platform soi on the two M1E.4 rows (Tower P_pi in the tower.siph column) drop the two
# platform / core_material ops (Q2). All other ops are a figure re-read (edge-coupler statistic), a D157 basis fix,
# a condition fix and additive notes.
components:
  cmp_ofc2026_m1e4_folded_heater_ps:
    platform: ''
    core_material: waveguide folded three times under the metal heater (waveguide material and layer stack not stated)
    notes: 'Fab: the PIC with the 4-tap filter was fabricated through TowerJazz foundry (p.~2 Sec. 3; printed name TowerJazz -> org_tower_semiconductor, alias missing from org_aliases.csv). Platform empty (D423, D168): the paper names only a commercial 300 mm silicon photonics platform (pNA Sec. 1); the waveguide material under the heater, SOI and a buried oxide are not stated. Optically packaged and wirebonded at Optelligent (packaging, not fabrication; note only). Heater design used for the 20 heaters of the 4-tap filter (cmp_ofc2026_m1e4_4tap_fourier_filter); P_pi measured on a reference test MZI in bare-die testing (p.~2 Sec. 3, Fig. 2(b)). Isolation trenches between the heaters are stated as a thermal-crosstalk measure (p.~2 Sec. 3). Phase mismatch across the six filter MZIs 0.12-0.42 pi not entered (no registry parameter).'
    why: 'pNA Sec. 1 and p.~2 Sec. 3 state only a commercial 300 mm silicon photonics platform and fabrication through TowerJazz; no Si / SOI / BOX statement for the waveguide. D423 (platform not stated -> empty), D168 and the lit_83 audit Q3 (rizzo2020, same group: a foundry name is not a platform statement). core_material no longer implies Si'
  cmp_ofc2026_m1e4_4tap_fourier_filter:
    platform: ''
    core_material: waveguides (material and layer stack not stated)
    notes: 'Fab: the PIC with the 4-tap filter was fabricated through TowerJazz foundry (p.~2 Sec. 3; printed name TowerJazz -> org_tower_semiconductor, alias missing from org_aliases.csv). Platform empty (D423, D168): the paper names only a commercial 300 mm silicon photonics platform (pNA Sec. 1); SOI and a buried oxide are not stated. Optically packaged and wirebonded at Optelligent (packaging, not fabrication; note only). MZI splitter tree -> 4 arms with delays 0, dL, 2dL, 3dL and per-arm heaters -> MZI combiner tree; phase compensation heaters between first- and second-stage MZIs (p.~1 Sec. 2). Delta L, FSR and filter insertion loss not stated. Not entered (no registry parameter): >= 16 dB reduction of receiver dynamic-range requirement; programmed impulse / sawtooth / triangle / flat-top passbands (Fig. 2(c), qualitative match to simulation).'
    why: 'D423 as on the heater row (pNA Sec. 1). Locator of the architecture sentence: Sec. 2 follows the _page_0_ figure reference, so p.~1, not p.~2 (skill rule 14)'
  cmp_lit_alexander2024_hairpin_snspd:
    notes: 'Fab: baseline technology stack ''developed in partnership with GlobalFoundries'' and fabricated in their 300 mm foundry (p.1 Sec. II); this component is a baseline building block (Sec. II / III). Platform soi: the baseline stack''s waveguides are SOI (p.1 Sec. II process modules); Fig. 1(b) (p.2) draws the Gen1 (baseline) stack with Si waveguides only and the detector on a waveguide, SiN appears only as a Gen2 addition. Detection efficiency measured with the detectors operated at about 2 K (p.2 Sec. II, sentence tied to Fig. 2(e)). Efficiency stated as limited by the hairpin design. Dark count rate only as a log-scale inset (Fig. 2(e)), no printed value, not entered. Supplementary material [20] is not part of this arXiv v1 (''to be published at a later date'', p.8).'
    why: 'Additive: p.2 Fig. 1(b) supports soi for the baseline detector (Gen1 has no SiN layer); p.2 Sec. II ties the about 2 K operation to the Fig. 2(e) measurement'
  cmp_lit_alexander2024_sin_pnrd:
    notes: 'Fab not entered: next-generation component from ''multiple process flows'' (p.5 Sec. IV); the source names no fabricating org for these, and the GlobalFoundries statement (p.1 Sec. II) covers the baseline stack only; all authors PsiQuantum (not enough, D80b). PNRDs with 4 and 5 unit cells produced; resolves 0, 1, 2, 3, 4+ photons (Fig. 4(f)). Values for the best performing designs; Fig. 4(e) is the average over 6 unique devices of the PNRD shown in Fig. 4(d). Operating temperature not stated for the PNRD (cryogenic readout implied by the cryogenic amplifier of Fig. 4(f)); temperature_k empty. Supplementary material [20] is not part of this arXiv v1 (''to be published at a later date'', p.8).'
    why: 'Additive: p.5 Fig. 4(f) caption names a cryogenic amplifier; no temperature printed for the PNRD (temperature_k stays empty)'
metrics:
  cmp_ofc2026_m1e4_folded_heater_ps-m1:
    condition: bare-die test of a reference test MZI (thermal tuning calibration of Fig. 2(b)); source, detector and wavelength of the bare-die test not stated
    notes: 'Printed as P_pi of 8.8 mW (per pi, not 2 pi) in the Fig. 2(b) caption and Sec. 3. No wavelength with the value; C band inferred from the operating band of the same chip (comb lines 1525.2-1553.9 nm, p.~2 Sec. 3). The SLD / OSA setup of Fig. 2(a) is stated for the packaged PIC, not for the bare-die test; heater I-V curves are stated for computing heater settings (p.~1 Sec. 2), not for this measurement. Consistent with m2: 0.13 pi x 8.8 mW per pi = 1.14 mW.'
    why: 'p.~2 Fig. 2(a) caption and Sec. 3: the SLD / OSA setup belongs to the packaged-PIC measurement, and p.~1 Sec. 2 uses the I-V curve for heater settings; neither is stated for the bare-die P_pi test'
  cmp_lit_alexander2024_hairpin_snspd-m4:
    basis: derived
    notes: 'Printed nanowire width about 90 nm (p.2 Sec. II); nm -> um rescale (D157, derived); stated design dimension, not SEM-measured.'
    why: 'D157 / D256: a pure unit rescaling of a printed dimension is derived (printed 90 nm, stored 0.09 um)'
  cmp_lit_alexander2024_edge_smf28-m1:
    statistic: mean
    notes: 'Printed coupling loss 120 +/- 17 mdB (p.6 Sec. IV); mdB -> dB (D256). Fig. 5(c) axis: insertion loss per edge coupler; the printed value equals the Fig. 5(c) mean mark (black, about 120 mdB; median, white, about 128 mdB; reading +/- 1 mdB) of repeated measurements on 2 exemplary devices per the caption; meaning of +/- not stated. ''Two of our best coupler designs'' selects designs, it is not a best-of-measurements statistic. How the per-coupler value is separated from the input-output fiber transmission is not stated in this version. Temperature not stated. C band inferred: the paper states its platform operates at telecom C-band wavelengths (p.1 Sec. I); no wavelength with this value.'
    why: 'p.6 Fig. 5 caption: mean (black) and median (white); Fig. 5(c) re-read: black mark at about 120 mdB, white at about 128 mdB, so the printed 120 is the mean of the repeated measurements, not a best value'
  cmp_lit_alexander2024_edge_uhna4-m1:
    statistic: mean
    notes: 'Printed coupling loss 53 +/- 12 mdB (p.6 Sec. IV; UHNA4 in text, UHNA in the Fig. 5(c) label); mdB -> dB (D256). Fig. 5(c) axis: insertion loss per edge coupler; the printed value equals the Fig. 5(c) mean mark (black, about 53 mdB; median, white, about 46 mdB; reading +/- 1 mdB) of repeated measurements on 1 exemplary device per the caption; meaning of +/- not stated. ''Two of our best coupler designs'' selects designs, it is not a best-of-measurements statistic. How the per-coupler value is separated from the input-output fiber transmission is not stated in this version. Temperature not stated. C band inferred: the paper states its platform operates at telecom C-band wavelengths (p.1 Sec. I); no wavelength with this value.'
    why: 'p.6 Fig. 5 caption: mean (black) and median (white); Fig. 5(c) re-read: black mark at about 53 mdB, white at about 46 mdB, so the printed 53 is the mean, not a best value'
  cmp_lit_alexander2024_sin_sm_wg-m1:
    notes: 'Printed 1.58 +/- 0.50 dB/m; dB/m -> dB/cm. Fig. 5 marks mean and median; which one the printed value is, and the meaning of +/-, not stated. Fig. 5(a) SM marks read at about 1.61 dB/m (mean, black) and 1.66 dB/m (median, white), reading +/- 0.02 dB/m; neither equals the printed 1.58 (value kept as printed). Temperature not stated. C band inferred: the paper states its platform operates at telecom C-band wavelengths (p.1 Sec. I); no wavelength with this value.'
    why: 'Additive: p.6 Fig. 5(a) re-read; the printed value matches neither mark, so no statistic can be set'
  cmp_lit_alexander2024_sin_mm_wg-m1:
    notes: 'Printed 0.39 +/- 0.12 dB/m; dB/m -> dB/cm. Fig. 5 marks mean and median; which one the printed value is, and the meaning of +/-, not stated. Fig. 5(a) MM marks read at about 0.37 dB/m (mean, black) and 0.39 dB/m (median, white), reading +/- 0.02 dB/m. Temperature not stated. C band inferred: the paper states its platform operates at telecom C-band wavelengths (p.1 Sec. I); no wavelength with this value.'
    why: 'Additive: p.6 Fig. 5(a) re-read; mean and median differ by less than the reading uncertainty, so no statistic is set'
