# Audit patch lit_265 (fresh-context audit 2026-11-23, DevLog/audits/2026-11-23-lit_265-audit.md).
# 158 metrics: 139 ok / 19 imprecise / 0 wrong; 22 components: 22 ok. 29 misses added (1 figure-read performance value,
# 1 measured fiber angle, 27 geometry / design-fiber rows, D153 / D625).
# Fixes: rawat2023 figure-page locators (Fig. 12 p.9, Fig. 13 p.9, Fig. 14 p.10) and bend loss basis measured (rule 4,
# D167); ruiz2021 3D grating-block wavelengths = Fig. 2(c) maxima, full-coupler method loss_breakdown (no reference
# structure described); wang2017c polarization cleared on measured rows (not stated, D673), p474 peak at the printed
# 1.327 um (D393); xue2019 taper / waveguide moved from excludes to includes (nothing subtracted), band-maximum PDLs le.
