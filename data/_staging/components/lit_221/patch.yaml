# Audit patch lit_221 (fresh-context audit 2026-11-20, DevLog/audits/2026-11-20-lit_221-audit.md).
# 123 metrics: 116 ok / 7 imprecise / 0 wrong; 16 components: 15 ok / 1 imprecise / 0 wrong. Misses added: 3 metrics (nelan2022b
# bend radius 500 um, BOX 4.7 um on the bend and MMI rows). Deleted by recommendation: 2 ding2012 components (L = 100 / 120 um) with
# their 12 metrics. After the patch: 14 components, 114 metrics.
# Coordinator questions (audit Q1-Q5): Q1 ding2012 per-sample rows kept, w1 318 / 323 / 329 nm confirmed on the vector data, L = 100 /
# 120 um rows deleted (revert = drop the two delete_components ops and the w324_l140 notes op), scope unspecified kept; Q2 ma2019
# per_db kept, fab orgs kept (no op); Q3 tan2016 bound kept as a bound, 100 -> 120 nm from the Fig. 5 span (revert = drop the m5 op);
# Q4 nelan2022b rulings kept (no op); Q5 EO-atlas candidate (no op).
