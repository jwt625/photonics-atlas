      nm. Printed only as the family bound (above -1 dB for 310-324 nm, p.6). Conflict (D417): the Fig. 6(a) w1 = 310 nm trace reads -0.34 dB at 1540 nm
      in the vector data (local maximum +0.03 dB at 1537.6 nm), so the Fig. 6(b) values are not the plain Fig. 6(a) trace values at 1540 nm (method not
      stated); Fig. 6(b) value kept.'
