# Audit patch lit_75 (fresh-context audit 2026-11-02, DevLog/audits/2026-11-02-lit_75-audit.md).
# 352 metrics: 341 ok / 9 imprecise / 2 wrong (deleted); 28 components: 25 ok / 3 imprecise, 0 deleted; 36 misses added. After the patch: 28 components, 386 metrics.
# Not covered here (coordinator rulings): audit Q1-Q4; registry gaps in the audit file.
components:
  cmp_lit_huh2016_tff_dmux_rosa:
    fab_org_ids: ''
    notes: 'Fab empty: the first-person assembly statement with all authors at ETRI (p.2) covers the ROSA built from the receptacle, this DMUX and the APD block; the maker of the filters and optic block is not stated (D399: assembled rows only, not parts whose fabrication is not stated; audit Q1). AOI on each TFF 8 deg, TFF effective width 400 um (p.9). 0.5-dB bandwidth of each lane larger than 3 nm (p.10; no bw_0p5db_nm for wdm). 0.5-dB (10 %) alignment tolerance of the DMUX X -30 to +110 um, Y -260 to +220 um (p.9; D250). Pitch grew from 500 to 510 um, sentence cites the authors'' ref. [7]: not entered (D408). ROSA receiver sensitivity -22.4 / -22.7 / -22.7 / -22.2 dBm for lanes 0-3 at BER 1e-12, 25.78 Gb/s NRZ (p.10; no parameter). ROSA body 10.65 x 6.6 x 5.6 mm3 (p.10). Platform empty: material not stated.'
    why: p.2 Sec. 1 and p.9 Sec. 4.3 state only the assembly of the three key components; no sentence says ETRI made the molded block or the TFFs; D399 tanaka2012 precedent; the lens and APD rows of the same ROSA are already empty
  cmp_lit_huh2016_focusing_array_lens_apd:
    notes: 'Design focal length 600 um (p.3). 0.5-dB (10 % coupling drop) tolerance lens to APD: axial -100 to +150 um, lateral +/-25 um (p.6; no 0.5-dB tolerance parameter, D250). APD-block tolerance X and Y +/-40 um (p.8). Fabricator not stated. Lane pitch 500 um is stated for the DMUX (p.3), not for this lens: no pitch row.'
    why: records why m3 is deleted (p.3 Sec. 2)
  cmp_lit_huh2016_apd_array_rosa:
    notes: 'Discrete APDs with a 4-channel TIA (TIA 3-dB bandwidth typically 20 GHz, input noise 10 pA/rtHz, p.4; electronics, not entered). APD maker and material not stated: platform empty. Active area diameter 20 um (p.6): no diameter parameter. Receiver sensitivity on the wdm.tff row notes. Power penalty below 0.5 dB when beam diameter stays below 200 um (p.4-5). Lane pitch 500 um is stated for the DMUX (p.3), not for the APD array: no pitch row.'
    why: records why m2 is deleted (p.3 Sec. 2)
  cmp_lit_palmer2026_cawg_8x400g:
    notes: 'Fabricated in the Broadex Technologies U.K. cleanroom (p.6). 20 devices, 8 channels each; die test SMF FAU in, MMF FAU out; part of the set pigtailed with SMF FAUs. 8 deg angle-polished facets. Registry gaps: 20-dB bandwidth 479.5 +/- 20.0 GHz, 1-dB / 20-dB ratio 0.63 +/- 0.03 (0.67 best), frequency offset from target below 40 GHz at room temperature (p.7; p.8). Target grid 1295.56-1311.43 nm (Table II): m40-m47, author_estimate. Simulated mode 4.75 x 6.27 um at 1300 nm (p.4). Comparison flat-top AWG of Fig. 9(a) and the no-iris variant of Fig. 9(b) have no printed values: no rows. Abstract and conclusion print PDL below 0.2 dB, body 0.2 dB average.'
    why: the Table II grid is now entered as the design-stated passband centers (see add_metrics)
  cmp_lit_palmer2026_ssc_fau_interface:
    notes: 'Cross-note: facets of the CAWG row. 5-channel input and 12-channel output FAUs, 4 fibers per FAU for alignment loopbacks (p.6). Method of the 0.4 dB not stated (D167). Fab follows the CAWG cleanroom statement (p.6) for the PIC with its spot-size converters; the pigtailing site is not stated.'
    why: p.6 Sec. V names Broadex for the CAWG samples only; dicing, polishing and pigtailing have no named site
  cmp_lit_xie2023_taper_slab_array:
    fab_org_ids: ''
    notes: Part of the AWG row, which CUMEC fabricated (p.4 acknowledgment); this row holds only the simulated taper. Transmission vs length in Fig. 2(b).
    why: 'row_kind design: 82 of 82 merged design rows have empty fab_org_ids; same batch cheung2019 design rows are empty'
  cmp_lit_xie2023_vertical_grating_coupler:
    core_material: Si 220 nm, 180-nm lithography
    why: p.1 Abstract and p.2 Sec. II state the single 220 nm etch for the AWG and its taper; the coupler is designed by the tape-out platform (p.2 Sec. III) and its etch is not stated
metrics:
  cmp_lit_yi2024a_d1_1x4_400g-m20:
    notes: C-band operating band of the device (p.2, Table 1); no wavelength with the value. Grating couplers at each end; normalization not stated. Fig. 4(b) peaks read about 2.7 to 3.2 dB by eye, at about 1556-1565 nm. Source sign as positive IL.
    why: 'p.7 Fig. 4(b): the note said the figure peaks sit at the stated IL; on the render they do not for every design (by-eye reading, consistency check only; printed values kept, D417)'
  cmp_lit_yi2024a_d2_1x8_400g-m20:
    notes: 'C-band operating band of the device (p.2, Table 1); no wavelength with the value. Grating couplers at each end; normalization not stated. Fig. 4(d) peaks read about 4.7 dB (ch. 3-6) to 7.2 dB (ch. 1) by eye against the printed 3.9 dB: Table 2 value kept (D417).'
    why: 'p.7 Fig. 4(d): the note said the figure peaks sit at the stated IL; on the render they do not for every design (by-eye reading, consistency check only; printed values kept, D417)'
  cmp_lit_yi2024a_d3_1x8_200g-m20:
