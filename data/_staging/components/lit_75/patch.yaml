    why: 'p.8 Fig. 5(a): the note said the figure peaks sit at the stated IL; on the render they do not for every design (by-eye reading, consistency check only; printed values kept, D417)'
  cmp_lit_yi2024a_d3_1x8_200g-m21:
    notes: C-band operating band of the device (p.2, Table 1); no wavelength with the value. Grating couplers at each end; normalization not stated. Fig. 5(a) edge peaks read about 5.8 dB by eye (printed 5.7 dB).
    why: 'p.8 Fig. 5(a): the note said the figure peaks sit at the stated IL; on the render they do not for every design (by-eye reading, consistency check only; printed values kept, D417)'
  cmp_lit_yi2024a_d4_8x8_200g-m20:
    band: ''
    wavelength_nm: 1500
    wavelength_max_nm: 1535
    notes: Table 2 value, channel not stated. Wavelength inferred from the Fig. 5(d) axis, the only measured spectrum of this device (1500-1535 nm, below the 1550 nm design center); Table 1 labels the designs C-band. Grating couplers at each end; normalization not stated. Peaks read about 4.7 to 6 dB by eye.
    why: 'p.8 Fig. 5(d): the measured window is mostly below C band, so c_band misdescribes the row'
  cmp_lit_cheung2019_straight_dc_k050-m2:
    basis: extracted_from_figure
    notes: Fig. 14 legend prints Gap=300nm, no reading uncertainty
    why: 'p.9 Fig. 14: the only place this gap is printed; figure-labelled dimensions are extracted_from_figure (skill contract v6; izumisawa2026 legend precedent, lit_71)'
  cmp_lit_palmer2026_cawg_8x400g-m5:
    method: loss_breakdown
    why: 'p.8 Table VI: value isolated by subtracting 2 x 0.4 dB of fiber coupling, not read directly'
  cmp_lit_palmer2026_cawg_8x400g-m6:
    method: loss_breakdown
    why: 'p.8 Table VI: value isolated by subtracting 2 x 0.4 dB of fiber coupling, not read directly'
  cmp_lit_palmer2026_cawg_8x400g-m9:
    condition: printed 300.8 +/- 4.4 GHz
    why: 'p.6-7 Sec. VI: 3.5 GHz RBW belongs to the OSA spectra of pigtailed samples (Fig. 12); the 20-device statistic also holds die tests with a tunable laser and power meter, no resolution stated'
