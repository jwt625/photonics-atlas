  cmp_lit_snigirev2023_ring_102ghz-m2:
    notes: 'span of the histogram not printed; 1500-1630 nm is the full measured span of Supp. Fig. 6 (inferred), which holds only about 160 resonances at 102 GHz FSR, so the 593 (legend 532) resonances come from a wider span or several rings of this design (not stated). Fig. 2(b) axis label kappa_0/2pi and legend ''532 resonances'' conflict with the caption (593) and the text ''loaded linewidth'' (D417); the loaded reading is the one consistent with the printed 8.5 dB/m (kappa_0 about 50 MHz at critical coupling needs n_g about 1.9; kappa_0 = 100 MHz would need n_g about 0.9)'
