# Audit patch lit_139 (fresh-context audit 2026-11-15, DevLog/audits/2026-11-15-lit_139-audit.md).
# 126 metrics: 117 ok / 9 imprecise / 0 wrong; 23 components: 23 ok / 0 imprecise / 0 wrong; 0 deleted; 9 misses added.
# Coordinator rulings open (audit Q1-Q7), all with no op unless noted: Q1 chen2024c fab org_amf from the author
# contribution (no op; to drop, empty fab_org_ids on the 4 chen2024c rows), Q2 xu2022a SJTU-Pinghu on the ECL row
# (no op), Q3 vissers2021 fab empty on the laser rows (no op; ibrahimi2021 reading would add org_smart_photonics to
# cmp_lit_vissers2021_mll_a_1p2mm / _mll_b_3cm), Q4 nejadriahi2024 JPL / Photodigm wait for the org round (no op),
# Q5 chen2024c main-beam loss row (added m9; to drop, delete cmp_lit_chen2024c_tx_opa_128-m9), Q6 nejadriahi2024
# heater power row (added m6; to drop, delete cmp_lit_nejadriahi2024_ecl_852-m6), Q7 xu2022a 17 dB beamforming loss
# stays out (registry gap, no op).
components:
  cmp_lit_xu2022a_opa_256_aperiodic:
    notes: 'Two-axis steering: phased array (psi, 256 TO phase shifters, average TO power 5 W after phase alignment) and wavelength (theta, grating antennas). Measured with an off-chip laser through the fiber array (ECL below threshold) unless the condition says on-chip ECL. Linearly increasing pitch: minimum 3.6 um, increment 20 nm, average 6.14 um (p.5; increment has no parameter). Not entered: beamforming loss 17 dB from free-space power vs distance (p.8, Fig. 10(d); no parameter, registry gap); average TO power 5 W (power_consumption_w not allowed on free_space_emitter, D432 candidate); maximum steering error 0.01 deg over 350 incidences (p.6, no parameter); simulated beamforming loss < 10.1 dB and EML (p.5, Fig. 4); theoretical aliasing-free FOV ''~150 deg'' (p.5) vs 154 deg (p.5, entered). Grating-antenna element: cmp_lit_xu2022a_grating_antenna. Fab: ''Fabricated by Advanced Micro Foundry (AMF Singapore)'' (p.5) -> org_amf on the PIC rows. ''For device characterization, the chip is packaged by SJTU-Pinghu Institute of Intelligent Optoelectronics'' (p.5); the assembled device comprises fiber array, RSOA and PIC (Fig. 6). Platform: tri-layer Si3N4-on-Si PIC (Fig. 1 inset: three waveguide layers and a TiN heater; ref. [32] cited for the platform); the paper names no PDK or process, so process_name is empty. Chip 15.6 mm x 11.7 mm.'
    why: 'Note sync with the added m22 (simulated psi divergence < 0.056 deg, p.5): drop it from the not-entered list'
  cmp_lit_nejadriahi2024_ecl_852:
    notes: 'Fab: the Si3N4 chip is ''fabricated in the ultra-low loss silicon nitride platform'' (p.1, passive, no org); the acknowledgment thanks JPL''s cleanroom staff for assistance in the preparation of samples and says the research was carried out at the Jet Propulsion Laboratory (p.4): borderline fab at JPL (D84b / D448), but JPL is not in the registry (reported), so fab_org_ids is empty. No facility named. RSOA purchased from Photodigm, Inc. (part 850SAF100; not in the registry): vendor of a part, not of the laser (winkler2024 precedent). Characterized with the RSOA on a 5-axis stage butt-coupled to the Si3N4 chip (p.2, Fig. 1(c)); RSOA TEC 25 C, Si3N4 chip TEC 25-27 C. Reference plane of the output power: p.2 says on-chip power is measured with a free-space lens and photodetector directly at the waveguide output, the Fig. 2(a) caption and the conclusion say free-space power at the chip output, but the p.3 text calls it the ''fiber-coupled output'' (conflict, D417; entered as chip). Output power printed as 24 mW (abstract, p.1, p.4) and ~25 mW at 215 mA (p.3); Fig. 2(a) maximum about 24.5 mW. Not entered: round-trip optical cavity length 6.5 cm (p.4, no parameter); multimode lasing above ~170 mA (p.3); Schawlow-Townes estimate about two orders of magnitude below 65 Hz (p.3, calculation per ref. [22]). Cross-section from the Fig. 1 labels (p.2 image): Si3N4 40 nm core, 8 um thermal SiO2, 5 um LPCVD + PECVD SiO2 top cladding, Si 600 um; anneal 1050 C for > 12 h (p.2).'
    why: 'Note sync with the added m6 (heater power ~0-500 mW, p.3): drop it from the not-entered list'
  cmp_lit_chen2024c_tx_opa_128:
    notes: 'Transmit half of the monolithic Vernier OPA transceiver (cmp_lit_chen2024c_vernier_opa_transceiver); antenna element cmp_lit_chen2024c_chained_grating_antenna; phase shifter cmp_lit_chen2024c_to_phase_shifter. Beam power within the FoV measured with a free-space power meter on a rotation stage, 0 dBm input (p.4 Fig. 2(b), p.8 Appendix); the power drop at -79 / 80 deg is caused by an obstacle on both sides of the chip (p.5). Operating wavelength of the steering data not stated (Santec TSL550 laser, EDFA). Main beam ~11 dBm for 25 dBm input (p.6) entered as insertion_loss_db device_total (m9, audit). Not entered: input power > 37 dBm for SiN-on-SOI (p.6, cited ref. 11); ranging accuracy 5.5 mm, velocity and SNPR values (system level, no parameter); far-field grating-lobe positions +/-21.5 / +/-47.5 deg (design). Fab: ''fabricated on a multilayered SiN-on-SOI ... platform'' (p.3, passive); author contributions (p.8): ''G.L. support the wafer fabrication process'', G.L. affiliated with ''Advance Micro Foundry Pte. Ltd.'' (printed spelling; registry org_amf ''Advanced Micro Foundry'') -> org_amf as the fabrication-support org of the fabrication sentence (D395 / D398 reading; borderline). No facility named. process_name empty (no PDK or process named). The chip is packaged with a PM fiber array and wire-bonded to a 256-channel DAC board (p.3, Fig. 1(e)); packaging org not stated.'
    why: 'Note sync with the added m9 (25 dBm in, ~11 dBm main beam, p.6)'
