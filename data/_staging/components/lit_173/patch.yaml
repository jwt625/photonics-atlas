metrics:
  cmp_lit_lu2018_ring_r40_sion-m3:
    basis: derived
    notes: 'Printed n_g 2.45 ''measured experimentally from the FSR of the ring'' via Eq. (3), n_g = lambda^2 / (FSR L) with L the
      round-trip length: explicit arithmetic by the authors on their own measured FSR, so derived (D80a; golshani2021 / kervazo2025
      group-index precedents). FSR of this ring not printed, so the arithmetic cannot be reproduced here.'
    why: 'p.10 Sec. 4.2 Eq. (3): n_g is computed from the measured FSR and the ring length (D80a: explicit arithmetic on own measurements
      is derived whether the batch or the authors did it; merged group-index-from-FSR rows are derived)'
  cmp_lit_lu2018_ring_r50_pmma-m4:
    basis: derived
    notes: 'Printed n_g 2.15 ''measured experimentally from the FSR of the 50 um radius ring'' (Eq. (3), n_g = lambda^2 / (FSR L)):
      explicit arithmetic by the authors on their own measured FSR, so derived (D80a). FSR value not printed.'
    why: 'p.10 Sec. 4.2: same Eq. (3) computation as ring_r40_sion-m3 (D80a)'
  cmp_lit_lu2018_ring_r40_sion-m5:
    value: '73000'
    wavelength_nm: '468'
    notes: 'Highest OSA data point read off Fig. 4(c): about 7.3e4 (+/- 0.2e4) at about 468 nm (+/- 2 nm; wavelength from the plot
      axis, the point sits at the left edge of the cluster near 470 nm). Points come from
      several 40 um rings. Unqualified Q (q_loaded).'
    why: 'p.9 Fig. 4(c) render: x-axis 360-480 nm at about 9 px/nm, the top OSA point lies at about 468 nm (not 474 nm) and at about
      7.3e4 on the 0-8e4 axis'
  cmp_lit_lu2018_gc_red-m2:
    value: '24'
    notes: 'Peak of the simulated curve read off Fig. 3(c): about 24 % (+/- 0.5 %) near 610 nm (+/- 2 nm); right axis 0-25 %, the
      curve peak sits about 1 % below the 25 % tick (5 % per tick).'
    why: 'p.8 Fig. 3(c) render: the simulated peak reads 23.9-24.0 % (25 % tick at the frame top, 20 % tick one division lower), not
      24.5 %'
