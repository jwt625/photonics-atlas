  'cmp_lit_pathak2012a_mmi_awg_12x400_56wg':
    'notes': 'Optimized device of the paper (p.5 Sec. V-C): input aperture = 42 um long, 4 um wide shallow taper plus 5 um wide, 15 um long MMI; array waveguides tapered to 2 um at the star couplers with 0.2 um separation; output apertures 2 um, 25 um adiabatic taper to a 450 nm wire (p.2). Spectra de-embedded by subtracting the transmission of a reference waveguide with identical grating couplers (p.4 Sec. V). Grating couplers about 30 % efficient per ref. [15] (cited, not entered). Fab: ''The experimental AWG devices were fabricated through ePIXfab'' (p.7 Acknowledgment): MPW access service named for fabrication (D398, Contract v7); the foundry behind it is not named in the paper. All authors at Ghent University - IMEC (no first-person fabrication sentence). ePIXfab is not in the registry: fab empty until the org round (reported). Not entered: measured crosstalk 17.0 dB and simulated 19.5 dB (p.5-6): the value sentence carries the authors'' own GFP 2011 paper [16] (''crosstalk of 17.0 dB [16]''), D408 / D424 pathak2012 precedent (the loss and non-uniformity in the same sentence carry no citation); aspect ratio (1-dB / 10-dB passband) 0.52 measured (p.7) and 0.49 simulated, 0.33 for a conventional AWG (p.5; no registry parameter); 1-dB / 3-dB / 10-dB bandwidth non-uniformity 0.23 / 0.17 / 0.15 nm (p.6-7; the ranges are in the bandwidth rows); channel spacing per channel pair about 360-419 GHz (Fig. 16). The Fig. 11 points of this 56-waveguide device (measured phase-error crosstalk about -16.8 dB read off the figure; neighbouring-channel crosstalk hidden in that floor, p.5) are the quantity the p.6 sentence attributes to [16]: not entered either (audit 2026-11-15).'
    'why': 'Record that the Fig. 11 56-waveguide point is the [16]-attributed 17.0 dB value (D408 / D424), kept out with it'
