# 5 misses added (pathak2012a Fig. 11 phase-error crosstalk of the 44 / 47 / 50 / 53-waveguide devices, sciancalepore2014
# PCG BOX 0.8 um). All 50 imprecise rows are rule-8 wavelength conditions (band / wavelength missing on values whose
# operating band or sibling-row wavelength is stated). After the patch: 47 components, 311 metrics.
# Coordinator rulings proposed (audit Q1-Q6), no op unless noted: Q1 pathak2012a 17.0 / 19.5 dB stay out (D408 / D424),
# the Fig. 11 56-waveguide point with them (component note op only); Q2 wang2024c on-chip IL author_estimate and fab empty
# kept; Q3 yi2022 band nir_above_u inferred kept (bandwidth rows aligned, ops); Q4 qiu2018 tuning stays on the heater row;
# Q5 sciancalepore2014 wafer statistics / 60 pm/C stay in notes (D159); Q6 ePIXfab / WNF: fab / facility empty until the
# org round (already queued since D422 / D579).
