# Audit patch lit_09 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_09-audit.md).
# 423 metrics: 393 ok / 30 imprecise / 0 wrong; 77 components: 58 ok / 19 changed / 0 deleted; 46 misses added.
# Not covered here (coordinator decisions, see the audit file): alexander2026 devices 09-16 PDE / DCR (Fig. 4 legend
# vs Table S1), NQFF Singapore facility, cheung2023 UCSB facility (kept, borderline), FIRST Center alias, registry gaps.
components:
  cmp_lit_seo2025_type1_tops_l240:
    notes: 'Proposed design: finite-slab rib connected directly to the standard single-mode rib (SMR) waveguide. Measured
      in symmetric MZIs (1x2 MMIs, S-bends, focusing GCs), TOPS in both arms; six identical TOPSes per length averaged (p.7-8).
      Fabricated by the commercial foundry service Applied Nanotools Inc. (p.6) on SOI with 500 nm Si and 1 um BOX; two rounds
      of e-beam lithography and Si dry etch. Headline averages over all lengths (Table 2 ''Total''): Pi 55.9 +/- 2.99 mW,
      IL 0.193 +/- 0.099 dB (type-1); 79.6 +/- 3.72 mW, 0.089 +/- 0.107 dB (type-2): not entered (average over three component
      rows). Not entered: thermal crosstalk phase in the adjacent victim TOPS 0.012 pi (type-1) / 0.022 pi (type-2) at D =
      200 um, L = 240 um (p.9, Fig. 8(c)-(d), no registry parameter); simulated V2pi 3.19 V and design-study Ppi values for
      other BOX / cladding / heater widths (p.5-6, p.11-12). MZI extinction ratios of several MZIs below 20 dB regardless
      of TOPS type (p.8, attributed to MMIs): not entered. Single-device Ppi (p.7, Fig. 7) and rise / fall times (p.10, Fig.
      9) of the L = 240 um devices entered as statistic single beside the Table 2 / Table 3 means (audit 2026-10-29).'
    why: audit adds the single-device Ppi (p.7) and rise / fall (p.10) of the L = 240 um devices; the note said they were
      not entered
