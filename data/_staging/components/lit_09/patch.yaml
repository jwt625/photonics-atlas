  cmp_lit_alexander2026_lateral_spad_01:
    test_structure: ''
    notes: 'Device ID 01 of Table S1 (p.11), one of 16 lateral doping variants (only the 16 um long lateral devices were characterized,
      p.4). Input via lensed-fiber inverse-taper edge coupler (cmp_lit_alexander2026_edge_coupler), SiN waveguide and Si-SiN
      end-fire interface (cmp_lit_alexander2026_si_sin_endfire). Fabricated on 8-inch wafers at the commercial foundry Advanced
      Micro Foundry on a SiN-on-SOI platform (p.4 Sec. III). PDE and DCR at the headline operating point (Pin 500 pW, Vex
      1.5 V) read off Fig. S3 / Fig. 4 (device IDs 01-08 agree between Fig. 4, Fig. S3 and Table S1); the Vex 0.5 / 1.0 V
      bars of Fig. S3 not entered. Family-level statements not entered (D254 / D159: device identity not stated): DCR on the
      order of 1e7 cps and PDE ~1 % across variants (p.4), lateral linear-mode photocurrent ~100 uA at 1 mW (~0.5 A/W) ''with
      a few exceptions'' (p.5), afterpulsing 25-30 % overall / 1.5-2.2 % largest peak, ~2.2 ns peak interval, ~15 / ~18 ns
      decay for ''a typical SPAD'' (p.9 Supp. SIII).'
    why: 'skill workflow step 3 / schema: test_structure true = measured on a dedicated test structure; the SPAD is the device
      under test itself, wire-bonded to the quench circuit (p.3 Sec. II-C, p.4 Sec. III); merged photodetector rows leave
      it empty; notes updated for the PDE / DCR rows added from Fig. S3 / Fig. 4 (p.10, p.5)'
