# Audit patch lit_189 (fresh-context audit 2026-11-18, DevLog/audits/2026-11-18-lit_189-audit.md).
# 118 metrics: 117 ok / 0 imprecise / 1 wrong; 20 components: 19 ok / 1 imprecise (note follow-up of the wrong row) / 0 wrong;
# 1 metric deleted (guarino2007 4 cm^-1 loss converted with an assumed coefficient definition), 0 misses added.
# After the patch: 20 components, 117 metrics.
# Coordinator rulings asked (audit Q1-Q5): Q1 guarino2007 EO tuning row kept on resonator.ring + EO-atlas candidate (no op);
# Q2 guarino2007 loss row deleted to notes (patched here; revert = drop the delete and the component op, keep 17.37 per D420);
# Q3 guarino2007 platform other, fab org_eth_zurich, Rossendorf note only (no op); Q4 logan2018 basis / fab / WNF facility
# after the org round (no op); Q5 liao2024 and gu2020 kept as distilled (no op).
components:
  cmp_lit_guarino2007_ln_ring_r100:
    notes: "Cached text is the arXiv v1 preprint (0705.2392, with the Methods and Supplementary Information in the same file) of the Nature Photonics paper of the source row; journal version unread. Platform `other`: LN film on BCB polymer (not on oxide), stack in core_material. Fab: first-person fabrication statements ('We have improved the lithium niobate thin film fabrication technique', p.3; 'we lithographically define the waveguides and the rings in two steps', p.4) and all five authors at the ETH Zurich Nonlinear Optics Laboratory (p.1) -> org_eth_zurich (D72 / D80b). He+ implantation of the LiNbO3 wafers performed by the AIM team at the Research Center Rossendorf (acknowledgment, p.6): a film-preparation step, kept as a note (wafer / film supplier analogue, rule 12). Wafers: congruent z-cut LiNbO3 (Crystal Technology, Inc.); BCB Cyclotene 3022-46 (Dow Chemical) (p.7). Waveguides multimode (w about 4 um; single mode would need w < 1 um, p.4, p.10). AFM RMS surface roughness 4 nm after Ar+ smoothing (p.7; no parameter). Propagation loss printed as 'approximately 4 cm^-1' (p.5; method, structure and wavelength not stated) is not entered in dB/cm: the paper's own use of the loss coefficient is ambiguous. Supp. Eq. (1) (p.8) writes Q ~ pi N / (alpha lambda), the form that holds for a field (amplitude) coefficient, and the Supp. example (p.9) ties a 10 dB/cm loss to Q about 4000, which with N about 2.0 (Fig. 8) follows only when 10 dB/cm is inserted as alpha = 10 cm^-1. Readings of the printed value: 17.4 dB/cm (power coefficient), 34.7 dB/cm (field coefficient) or 4 dB/cm (the example's usage). Electrodes cover the whole device surface in this preliminary configuration (p.5). Tuning 0.14 GHz/V is about 50 % of the bulk EO activity per the authors (p.5-6); proposed improvements (> 1 GHz/V, Q 2e4, < 10 V) are projections, not entered. The EO tuning of this ring is an EO-atlas candidate (not in the EO atlas as of 2026-11-18)."
    why: "follow-up of the deleted m7 (p.5 '4 cm^-1'; p.8 Supp. Eq. (1); p.9 Supp. Sec. A 10 dB/cm -> Q about 4000; p.11 Fig. 8 N about 2.0 at 1.55 um)"
delete_metrics:
- id: cmp_lit_guarino2007_ln_ring_r100-m7
  why: "17.37 dB/cm rests on reading the printed 'approximately 4 cm^-1' (p.5) as a power coefficient. Unlike sun2022 (D420, definition simply not printed), this paper defines its loss coefficient inconsistently: Supp. Eq. (1) Q ~ pi N / (alpha lambda) (p.8) is the field-coefficient form (power reading would need 2 pi N), and the Supp. example 'alpha = 10 dB/cm would already imply Q ~ 4000' (p.9) reproduces only with alpha = 10 cm^-1 and N about 2.0 (p.11 Fig. 8). The three readings (4 / 17.4 / 34.7 dB/cm) differ by up to 8.7x; rule 1 / D159 analogue: value to component notes"
