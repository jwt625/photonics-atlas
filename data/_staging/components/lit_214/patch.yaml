# Audit patch lit_214 (fresh-context audit 2026-11-20, DevLog/audits/2026-11-20-lit_214-audit.md).
# 65 metrics: 53 ok / 10 imprecise / 2 wrong; 12 components: 9 ok / 3 imprecise (notes) / 0 wrong; 1 miss added.
# After the patch: 12 components, 64 metrics.
# Coordinator questions (audit Q1-Q7): Q1 lu1996 20 um biparabolic row kept (D408, no op); Q2 lu1996 23 % / 20 % efficiency deleted
# (D159, physically inconsistent with the 16 um linear device's own Fig. 9 / 10 data; revert = drop the two delete_metrics);
# Q3 lu1996 / goncher1996 separate rows kept, cross-notes extended with the shared-figure finding; Q4 fu2020 50 GHz kept as printed,
# measured, no qualifier, platform empty (no op); Q5 chang2008 Fig. 3 / 4(a) and shi2010 control rows kept (notes only);
# Q6 chang2008 platform gaas kept (no op); Q7 lu1996 abstract 12 GHz kept out (no op).
components:
  cmp_lit_lu1996_vcsel_16um_linear:
    notes: 'Same authors, design and temperature range as lit:goncher1996 (16 um linearly graded VCSEL, 6-200 K); this paper does not cite goncher1996. Figs. 10, 12, 15 and 16 here
      show the same data as goncher1996 Figs. 2, 3 and 4 (identical plots: threshold current / voltage vs substrate and junction temperature, pulsed / CW lasing wavelength vs
      temperature, S21 at 10-200 K and the -3 dB bandwidth vs temperature), so Vth 4.5 / 6.5 V, Rth ~1000 K/W, 8.1 / 10.8 GHz and the 798-808 nm range sit on both rows; no attribution,
      so no D259 removal (D408). Fig. 9 is a different L-I sweep (legend 6-298 K, to 30 mA; the 6 K trace peaks near 11.8 mW at about 11.5 mA) from goncher1996 Fig. 1(b) (legend
      5.6-298.5 K, to 12 mA; about 9.4 mW at 12 mA), hence 12 vs 10 mW at 6 K. Not entered (D159): power efficiency 23 % at 77 K and 20 % at 6 K (p.8). The sentence follows the
      highest-doped Fig. 13(c) VCSEL (''this VCSEL''), and the values exceed what this device''s own data allow: the Fig. 9 6 K trace gives output / current of at most about 1.15 W/A,
      which with Vth 6.5 V (p.8) bounds the efficiency at about 18 %; near 77 K about 1.0 W/A over a threshold voltage of about 5 V or more (Fig. 10) bounds it at about 21 %.
      Device identity unresolved. Not entered: external slope efficiency approaching 100 % below 100 K and > 70 % (Fig. 9 caption; no %-slope parameter); threshold current vs
      temperature (Fig. 10, no printed value; lit:goncher1996 prints them); bias of the small-signal measurement (not stated here; goncher1996: 7.5 mA); abstract ''12 GHz for a 16 um
      device at 80 K'' (Fig. 16 reads about 8.1-8.3 GHz at 75-100 K and 10.8 GHz at 10 K; D417, not entered). No fabrication statement (MOCVD growth and fabrication are described only
      in the passive voice or not at all); authors printed at the Center for High Technology Materials, University of New Mexico, Sandia National Laboratories and Tektronix; the
      acknowledgment thanks one Sandia staff member for technical assistance (staff thanks, D84b / D72): fab and facility empty (D80b).'
    why: 'p.8 efficiency sentence: values deleted (D159, see delete_metrics); p.6 Fig. 9, p.7 Fig. 12, p.9 Figs. 15-16 vs goncher1996 p.2-3 Figs. 1-4 renders: shared figures recorded'
  cmp_lit_goncher1996_vcsel_16um_linear:
    notes: 'Same authors, design and 6-200 K range as the 16 um linearly graded row of lit:lu1996 (cmp_lit_lu1996_vcsel_16um_linear), which does not cite this letter. lu1996 Figs. 10,
      12, 15 and 16 show the same data as Figs. 2, 3 and 4 here (identical plots), so the shared values sit on both rows; lu1996 Fig. 9 is a different L-I sweep (to 30 mA, 12 mW at 6 K)
      from Fig. 1(b) here (to 12 mA; the 5.6 K trace ends near 9.4 mW, printed 10 mW). Not entered: external slope efficiency 70 % at 100 K, 80 % at 6 K, > 70 % (abstract) and > 100 %
      near-threshold external efficiency near 150 K (no %-slope-efficiency parameter, registry gap); abstract ''-3-dB bandwidth increased by about 70 % to 11 GHz at 6 K'' (body and Fig.
      4: 10.8 GHz at 10 K, the lowest measured temperature; D417 note); bandwidth vs temperature inset points other than the printed ones; threshold vs junction temperature and the < 10 %
      / < 20 % self-heating shares (model estimate); CW lasing up to 250 K (p.1; no parameter). Fab: device ''grown by MOCVD'' (passive); authors printed at Tektronix, University of New
      Mexico CHTM and Sandia National Laboratories; acknowledgment thanks one Sandia staff member for technical assistance (staff thanks, D84b / D72): fab and facility empty (D80b).'
    why: 'goncher1996 p.2-3 Figs. 1-4 vs lu1996 p.6-9 Figs. 9, 10, 12, 15, 16 renders: shared figures and the different L-I sweeps recorded'
  cmp_lit_chang2008_vcsel_980_3um:
    notes: 'Platform gaas from the GaAs / AlGaAs layer labels of Fig. 1(b) and Fig. 2(a); the text names only the 980 nm emission. Emission wavelength 980 nm is the design statement (p.1),
      no spectrum shown: not entered. Device structure and fabrication are referred to the authors'' refs. [1], [2]. Not entered: Fig. 4(b) BER at 35 Gb/s (4.4 mA, 0.84 Vpp, extinction
      ratio 5.4 dB, 10 mW dissipation, 3.5 Gbps/mW): the text attributes the curve to the authors'' ref. [1] (Electron. Lett. 2007) (D259a / D408); MCEF 16.7 GHz/mA^1/2 (no registry
      parameter); simulated effective mode radius 2.64 -> 2.01 um, 1.73x mode-volume reduction and predicted 31 % fR increase (design simulation, no parameter); Fig. 3 temperature-rise
      curve. The Fig. 3 / Fig. 4(a) results carry no citation and are kept (D408). Possible overlap with ref. [1]: the introduction credits the ref. [1] 35 Gb/s result on 3 um devices to
      the same aperture and p-doping optimization, and the series resistance (p.2) is quoted at 4.4 mA as the bias of the large-signal experiments, the bias of the ref. [1] BER curve.
      Fab: no fabrication statement; both authors printed at UCSB: fab empty (D80b).'
    why: 'p.1 Sec. I and p.2 Sec. III: the 4.4 mA link to the ref. [1] experiment added to the overlap flag'
