    value: 8.1
    notes: 'read off the Fig. 4 40 mA trace at 1560 nm (the wavelength of maximum gain stated on p.2 for 40 mA): about 8.1 dB, reading +/- 0.3 dB (the 40 mA trace is about 8.1-8.6 dB between 1553 and 1578 nm, highest near 1565-1575 nm; the 50 mA trace reaches about 9.3 dB); the Fig. 4 axis is printed ''SOA Chip Gain (dBm)'' (unit typo; Fig. 5 prints dB)'
