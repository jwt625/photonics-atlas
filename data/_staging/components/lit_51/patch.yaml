components:
  cmp_lit_foster2006_si_fwm_opa_300x550_6p4mm:
    notes: 'No fab org: waveguides ''fabricated as previously described'' (ref. 29, passive, p.2); all authors at Cornell (two schools) but no fabrication statement (D80b). Acknowledged Center for Nanoscale Systems support is funding (NSF / NYSTAR), not a facility. Same waveguide as the frequency_converter row (D396). Not entered: net on/off gain span 1512-1535 nm (23 nm) stated for ''the 6.4-mm-long waveguides'' (p.3): in the Fig. 3(a) render the 300 x 550 nm 6.4 mm trace is above 0 dB only from about 1516.5 to 1533.5 nm, the 1512-1514 nm points above 0 dB belong to the 300 x 600 nm 6.4 mm trace, so the span is the union of two waveguides (D159 / D254); 28 nm net on/off gain span of the abstract (union over the 6.4 mm and 17 mm waveguides, D254); the +3 dB to -2 dB peak conversion efficiencies for signals 1511-1545 nm (p.3; the +3 dB at 1511 nm is not on the plotted 300 x 550 nm 1510 nm trace of Fig. 3(c), which ends near +0.8 dB, so the waveguide is not identified, D159); 300 nm x 600 nm 6.4 mm waveguide (Fig. 3(a) only, no printed value); simulated GVD / FWM gain (Fig. 2(a)-(b)).'
    why: 'follows the deletion of m2 (gain_bandwidth_nm 23 nm): p.3 "For the 6.4-mm-long waveguides ... from 1,512 nm to 1,535 nm" vs p.2 Fig. 3(a) render (300 x 550 nm trace crosses 0 dB near 1516.5 and 1533.5 nm; the 300 x 600 nm trace is at about +1.1 dB at 1513 nm); Fig. 3(c) render for the +3 dB statement'
  cmp_lit_kuyken2011_si_wire_midir_opa_2cm:
    notes: 'No fab org: wire fabricated on a 200 mm SOI wafer in an unnamed CMOS pilot line (p.1, passive); authors at Ghent University-imec, Columbia University and IBM T. J. Watson (D80b). No facility acknowledged. On-chip gain = peak power of the pulsed signal / idler at the waveguide end over the coupled input cw signal power (p.2), from OSA spectra corrected by the cutback-measured coupling loss: derived (D166). Same wire as the frequency_converter, waveguide and coupler rows (D396). Not entered: fitted beta2 -0.6 ps2/m and beta4 5.1e-4 ps4/m, gamma ~150 /W/m (no parameters, D81); differential gain 10.4 / 2.7 dB/W; MI span 1911-2486 nm; earlier 4 mm wire results (ref. [4], D259).'
    why: 'follows the two added misses (m10 on-chip gain > 40 dB, p.1 Abstract / p.1; m11 off-chip transparency pump power about 8 W, p.3 Fig. 4(b)), which the old notes listed as not entered'
