components:
  cmp_lit_liu2018b_ring_nir_r100:
    core_material: "single-crystalline AlN rib, 1.6 um total height with 0.4 um unetched slab, 3.0 um wide (Fig. S3(b) caption and inset); growth, substrate and etch of this chip not stated (the about 0.5 um MOCVD AlN-on-sapphire process of p.1-2 belongs to the UV chips)"
    cladding: ""
    notes: "No fabrication sentence names an org (passive process description); the acknowledgment thanks two named people 'for assistance in the device fabrication' without an org -> fab empty; AlN grower not stated (authors at Yale University and the Institute of Semiconductors, CAS). Q_int from Q_int = 2QL/(1 + sqrt(T0)) with the under-coupled regime assumed (D403 -> author_estimate). Propagation loss alpha_ring = 4.343 f0 / (Q_int FSR R) (p.3). Supplement Fig. S3(b), measured with a swept telecom laser; cross section printed as 3.0 x 1.6 um2 with 0.4 um unetched AlN, and the inset draws the 1.6 um arrow over the full rib height (core 1.6 um, slab 0.4 um): a thicker film than the 0.5 um UV chips. Cladding not stated for this chip (inset unlabelled). The main text calls it one of 'our visible and near-infrared single-crystalline AlN microrings' (p.4), no citation; whether it is a cascaded pair is not stated."
    why: "p.7 Supp. Fig. S3(b): cross section 3.0 x 1.6 um2 with 0.4 um unetched AlN; the inset's 1.6 um arrow spans the whole rib. The row's core_material described the about 0.5 um MOCVD film of the UV chips (p.1-2) and PECVD SiO2 cladding, neither stated for this chip; the cascaded-pair sentence of the UV devices does not apply"
