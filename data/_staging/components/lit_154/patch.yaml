# Audit patch lit_154 (fresh-context audit 2026-11-15, DevLog/audits/2026-11-15-lit_154-audit.md).
# 315 metrics: 309 ok / 6 imprecise / 0 wrong (+1 note sync); 36 components: 31 ok / 5 imprecise (4 fab, 1 note) / 0 wrong (+2 note syncs);
# 0 deleted; 15 misses added (3 shang2017a design FSR rows, 12 template geometry rows). After the patch: 36 components, 330 metrics.
# Coordinator rulings asked (audit Q1-Q6): Q1 harris2017 fab org_elenion per D395 / D80b (4 component ops; to keep fab empty,
# drop the fab_org_ids fields of those ops and keep the notes); Q2 bucio2017 Table 2 losses stay measured (no op);
# Q3 bogaerts2010 crossing kept (new 0-91 crossing data set, note op); GC 33 % stays author_estimate with a cross-note to
# bogaerts2006 (note op); Q4 shang2017a 16x25 GHz IL stays 2.7 dB (note op); Q5 gao2017 IL stays author_estimate (D428, no op);
# Q6 shang2017a FSR rows added as author_estimate (to skip, drop the three add_metrics rows).
components:
  cmp_lit_harris2017_pnp_mesh_26x26:
    fab_org_ids: org_elenion
    notes: 'Mesh of reconfigurable beamsplitters (two 50 % directional couplers + internal theta / external phi thermo-optic phase shifters, p.3). Mean unit-cell extinction ratio 0.9996 +/- 0.0005 (limited by polarization drift, p.4): not entered (visibility-type ratio, dB form not printed). Nearest-neighbour thermal crosstalk 1 % (p.4): no parameter. Phase-shifter 3-dB bandwidth 130.0 +/- 5.59 kHz is cited to the authors'' ref. [36] (rule 3, not entered). Bend radii below 15 um used (p.2; min_bend_radius_um not allowed on switch_fabric). Fab: author contributions ''T.B.J. and M.H. fabricated the system'' (p.7), both printed at Elenion Technologies (p.1) -> org_elenion (D395, D80b); Methods ''We fabricated the PNP ... in the Optoelectronic Systems Integration in Silicon foundry'' (p.7; acronym OpSIS printed in the acknowledgments, p.8) names OpSIS as the foundry / MPW service, not in the registry (org round, D398 / D439 / D458; add next to org_elenion once registered). The paper does not say where T.B.J. and M.H. worked when the chip was made; printed affiliation only. Supplement (Sections 1-7) not cached; arXiv v3 text of the Nature Photonics paper.'
    why: 'p.7 author contributions name the fabricators T.B.J. and M.H., both printed at Elenion Technologies (p.1): D395 (fab = org of the authors the fabrication sentence names), D80b (fabricators named in the contributions); OpSIS is an additional MPW / foundry fab org pending the org round (coordinator Q1)'
  cmp_lit_harris2017_rbs_mzi_unit:
    fab_org_ids: org_elenion
    notes: 'Unit cell of cmp_lit_harris2017_pnp_mesh_26x26 (p.3, Fig. 2(b)). The extinction value is for ''a single MZI measured with the test setup shown in Supplement Section 3'' (p.4; supplement not cached), with careful input polarization filtering (Fig. 2(d) caption). Fab: author contributions ''T.B.J. and M.H. fabricated the system'' (p.7), both printed at Elenion Technologies (p.1) -> org_elenion (D395, D80b); Methods name the Optoelectronic Systems Integration in Silicon (OpSIS) foundry (p.7), not in the registry (org round, D398 / D439 / D458). Printed affiliation only. Supplement (Sections 1-7) not cached; arXiv v3 text of the Nature Photonics paper.'
    why: 'as cmp_lit_harris2017_pnp_mesh_26x26 (p.7, D395, coordinator Q1)'
  cmp_lit_harris2017_doped_si_tops:
    fab_org_ids: org_elenion
    notes: '176 phase shifters on the PNP; design from the authors'' ref. [36] (p.3). Two Al and two via layers for routing (p.7). Fab: author contributions ''T.B.J. and M.H. fabricated the system'' (p.7), both printed at Elenion Technologies (p.1) -> org_elenion (D395, D80b); Methods name the Optoelectronic Systems Integration in Silicon (OpSIS) foundry (p.7), not in the registry (org round, D398 / D439 / D458). Printed affiliation only. Supplement (Sections 1-7) not cached; arXiv v3 text of the Nature Photonics paper.'
    why: 'as cmp_lit_harris2017_pnp_mesh_26x26 (p.7, D395, coordinator Q1)'
  cmp_lit_harris2017_inverse_taper_glass_pic:
    fab_org_ids: org_elenion
    notes: '52 modes coupled to fibers through two laser-written glass PICs (pitch reducer and spot-size converter, p.3-4); glass PIC maker not stated; the fab org covers the Si chip only. Fab: author contributions ''T.B.J. and M.H. fabricated the system'' (p.7), both printed at Elenion Technologies (p.1) -> org_elenion (D395, D80b); Methods name the Optoelectronic Systems Integration in Silicon (OpSIS) foundry (p.7), not in the registry (org round, D398 / D439 / D458). Printed affiliation only. Supplement (Sections 1-7) not cached; arXiv v3 text of the Nature Photonics paper.'
    why: 'as cmp_lit_harris2017_pnp_mesh_26x26 (p.7, D395, coordinator Q1); note says the fab covers the Si chip, not the glass PICs (D450)'
  cmp_lit_bogaerts2010_awg_8x400:
    notes: 'Fig. 15-16 (p.9), measured as the echelle grating (broadband source + OSA). Fig. 16 annotations: 1.1 dB from 0 dB to the center-channel peak and 1.3 dB from the center-channel level to the outer-channel peak, i.e. 1.1 + 1.3 = 2.4 dB, consistent with the text and caption (1.1 dB center, 2.4 dB outer). Fab: first-person ''We fabricate our devices using industrial CMOS tools'' (p.3) at the IMEC research facilities (p.1) and acknowledgment of ''the people of the IMEC p-line for the processing of the devices'' (p.10) -> org_imec (stated processing place, D448 / D84b); ''ePIXfab for the support in design and fabrication'' (p.10): MPW service, see report. Invited overview paper: only the results it shows as its own current-generation (193 nm) devices are entered; values in sentences citing refs. [1], [12], [16], [38], [39], [42] are not entered (rule 3).'
    why: 'p.9 Fig. 16 render: the 1.3 dB mark is the roll-off from the center-channel level (dashed line near -1.1 dB) to the channel-1 peak (near -2.4 dB), so the figure agrees with the printed 2.4 dB; the batch note called it a D417 conflict'
  cmp_lit_bogaerts2010_shallow_etch_crossing:
    notes: 'Crossing concept attributed to ref. [15] (the authors'' own 2007 paper, merged as cmp_lit_bogaerts2007_double_etch_crossing: 248 nm DUV, 0.16 dB from 0 / 5 / 10 / 21 crossings, 6 um long). The 2010 loss / crosstalk sentence and Fig. 8 carry no citation and show a different data set (0 / 10 / 21 / 48 / 91 crossings, per-crossing curve 1510-1590 nm), so the values are kept as this paper''s result (D408). Optimized-geometry 0.2 dB crossing without shallow etch is ref. [16] (not entered); simple direct crossing ''about 30 %'' loss and -10 dB crosstalk is a generic statement (not entered). Fab: first-person ''We fabricate our devices using industrial CMOS tools'' (p.3) at the IMEC research facilities (p.1) and acknowledgment of ''the people of the IMEC p-line for the processing of the devices'' (p.10) -> org_imec (stated processing place, D448 / D84b); ''ePIXfab for the support in design and fabrication'' (p.10): MPW service, see report. Invited overview paper: only the results it shows as its own current-generation (193 nm) devices are entered; values in sentences citing refs. [1], [12], [16], [38], [39], [42] are not entered (rule 3).'
    why: 'p.6 Fig. 8 labels (0 / 10 / 21 / 48 / 91 crossings) vs the merged 2007 row (0 / 5 / 10 / 21 crossings, 0.16 dB): a new data set, which settles the batch''s weak-point flag (coordinator Q3)'
  cmp_lit_bogaerts2010_shallow_gc:
    notes: 'Measurement couplers for all devices (p.4); design from ref. [25], fiber at 10 deg from vertical per ref. [24]. Period not printed. The printed 33 % (-5 dB) equals the value merged from the authors'' 248 nm paper (cmp_lit_bogaerts2006_gc_10deg, 33 % / 5 dB at 10 deg; this paper''s ref. [11]); no measurement is shown here, so the 2010 rows stay author_estimate (origin not stated). Fab: first-person ''We fabricate our devices using industrial CMOS tools'' (p.3) at the IMEC research facilities (p.1) and acknowledgment of ''the people of the IMEC p-line for the processing of the devices'' (p.10) -> org_imec (stated processing place, D448 / D84b); ''ePIXfab for the support in design and fabrication'' (p.10): MPW service, see report. Invited overview paper: only the results it shows as its own current-generation (193 nm) devices are entered; values in sentences citing refs. [1], [12], [16], [38], [39], [42] are not entered (rule 3).'
    why: 'cross-note: the identical 33 % / 5 dB value is merged on bogaerts2006 (248 nm process); supports author_estimate (coordinator Q3)'
metrics:
  cmp_lit_liu2020c_cwdm_mwg_4ch-m1:
    qualifier: approx
    why: 'p.4 Sec. III prints ''about 0.8 dB, 0.3 dB, 0.9 dB and 0.7 dB'' (rule 7: about -> approx); the row note quotes ''about'' but the qualifier was empty'
  cmp_lit_liu2020c_cwdm_mwg_4ch-m2:
    qualifier: approx
    why: 'as m1 (p.4 Sec. III, rule 7)'
  cmp_lit_liu2020c_cwdm_mwg_4ch-m3:
    qualifier: approx
    why: 'as m1 (p.4 Sec. III, rule 7)'
  cmp_lit_liu2020c_cwdm_mwg_4ch-m4:
    qualifier: approx
    why: 'as m1 (p.4 Sec. III, rule 7)'
  cmp_lit_bogaerts2010_shallow_mmi_1x2-m1:
    qualifier: approx
    notes: 'Printed ''of the order of -0.2 dB or less'' (p.6); wavelength span from the Fig. 9 axis. The Fig. 9 measured excess loss spans about 0.09-0.24 dB over 1500-1600 nm (minima near 1525 and 1585 nm), so the printed figure is an order-of-magnitude statement, not a bound over the span: entered as approx.'
    why: 'p.6 Fig. 9 render: the trace exceeds 0.2 dB near 1520-1530 and 1580-1590 nm, so qualifier le over 1500-1600 nm contradicts the paper''s own plot; ''of the order of'' -> approx (rule 7)'
  cmp_lit_bogaerts2010_ring_bistable-m1:
    condition: 'Q printed in the Fig. 11 caption; measurement power not stated (Fig. 11 traces 1-20 mW in fiber, linear wavelength sweep)'
    notes: 'Caption ''a Q of 9500'' (unqualified, entered as loaded Q); the paper does not say at which power the Q was obtained. Wavelength = resonance of the lowest-power (1 mW) trace read off Fig. 11 (about 1564.65 nm, +/-0.05 nm), inferred.'
    why: 'p.7 Fig. 11 caption gives the Q with no power; the condition attributed it to the 1 mW trace, which the paper does not state'
  cmp_lit_shang2017a_awg_16x25-m1:
    notes: 'C band from the Fig. 3 wavelength axes (about 1538-1558 nm). Printed 2.7 dB in the abstract (p.2), the results text (p.5) and the conclusion range ''1.5 to 2.7 dB'' (p.6); Table 1 (p.5) prints 2.1 dB for this AWG (D417 conflict, kept as the thrice-printed value). Fig. 3(d) does not decide it: the channel peaks sit at about -3 to -4.5 dB on the normalized axis, below both printed values (the other three AWGs show the same offset between plotted peaks and printed IL; statistic of the printed IL not stated).'
    why: 'p.4 Fig. 3(d) render checked for the 2.1 / 2.7 dB conflict (coordinator Q4): the figure supports neither; value unchanged'
