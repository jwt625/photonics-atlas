metrics:
  cmp_lin2026a_mmi_1x2-m1:
    parameter: excess_loss_db
    value: '0.24'
    includes: ''
    basis: derived
    notes: Reported 3.25 dB per MMI includes the intrinsic 3 dB split (p.8); excess = 3.25 - 10log10(2) = 0.24 dB (0.25 dB with a nominal 3 dB). Per MMI from the linear fit over the cascaded MMI tree (Fig.
      3(c)); wavelength inferred from the 375 nm UV characterization context.
    why: 'D43: a 1xN value below / including the ideal split is entered as excess_loss_db (reported minus ideal split, derived)'
  cmp_lin2026a_mmi_1x2-m2:
    parameter: excess_loss_db
    value: '0.1'
    includes: ''
    notes: Simulated 3.11 dB per MMI including the 3 dB split (p.8); excess = 3.11 - 10log10(2) = 0.10 dB; quoted for comparison with the measured value.
    why: D43, as m1 (basis stays simulated)
