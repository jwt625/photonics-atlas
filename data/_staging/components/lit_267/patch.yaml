# Audit patch lit_267 (fresh-context audit 2026-11-24, DevLog/audits/2026-11-24-lit_267-audit.md).
# 97 metrics: 84 ok / 13 imprecise / 0 wrong; 22 components: 15 ok / 7 imprecise / 0 wrong. 10 misses added (geometry).
# Fixes: dumon2004a fab org_imec emptied on 7 rows (two printed orgs, no named place; merged lit:dumon2004 precedent),
# figure-label-only geometry -> extracted_from_figure (10 rows), FSR / finesse wavelength span as on the Q row;
# orcutt2011 drop-loss wavelengths = Fig. 5(a) drop peaks. Misses: dumon2004a taper narrow-end widths, orcutt2011
# test-ring poly thickness, sun2015a Fig. 4 poly thickness 230 nm / ridge slab 100 nm.
components:
