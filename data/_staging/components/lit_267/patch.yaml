    notes: 'Loss from a length series of Fabry-Perot cavities (two cleaved facets in a 3 um ridge, wire section in the middle
      reached through adiabatic tapers): total cavity loss vs wire length, slope of the fitted line (p.1, Fig. 1). No sidewall
      smoothing (no thermal oxidation). Fab empty: first-person ''We have fabricated photonic wires using deep UV lithography''
      (p.1 Introduction, citing the authors'' process ref. [4]), but the authors sit at two printed orgs (Ghent University
      - IMEC, Dept. of Information Technology; IMEC vzw, Silicon Process Technology Division) and no sentence names where
      the wafers were processed (D80b / D154 unambiguity; same author group and split as the merged lit:dumon2004 rows, left
      empty in the lit_25 audit). Same measurement series is also reported in lit:dumon2004 (journal paper; there the taper
      length is 300 um). Lithography wavelength and process name not printed.'
    why: 'D80b / D154: first-person fabrication but two printed orgs and no named place; consistency with the merged lit:dumon2004
      rows (same authors, same affiliation split, fab empty) rather than pathak2014a (all authors at one printed org) or bogaerts2006
