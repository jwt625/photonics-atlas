# 63 metrics: 57 ok / 6 imprecise / 0 wrong; 6 components: 3 ok / 3 imprecise / 0 wrong. 0 misses added.
# After the patch: 6 components, 63 metrics.
# Fixes: papes2016 overall coupler efficiency / loss scope per_coupler -> per_facet (edge-coupler convention, D707;
# edge_taper primary insertion_loss_db per_facet); dai2011a platform soi -> soi_strip (Fig. 3(a) full-height Si strips on
# SiO2, "SOI nanowires"; lit_322 dai2011 and D434 / D663 / D816); dai2011a per_db lower band edge 1450 -> 1455 nm and
# TE IL 0.15 -> 0.14 dB from the Fig. 6 vector data of the cached PDF (figure-read edges, inferred flag cleared, lit_322
# convention); michaels2018 component notes carry the two design-unspecific bounds (D159).
components:
  cmp_lit_michaels2018_pvgc_ideal:
    notes: 'Design-only (2D FDFD adjoint shape optimization, single wavelength 1550 nm); no fabrication. Starting structure
      (both designs): uniform two-layer grating, period 586 nm, duty factor 80 %, top-bottom shift 160 nm, 48 % starting
      efficiency (p.6). Period and duty factor chirped per period (Fig. 7), not entered. Fiber 2 um above the grating (p.7).
      Optimized duty factors approach 100 %, i.e. features a few nm wide that DUV lithography cannot make (p.9). Bounds not
      tied to one design (D159): back reflection "-20 dB bandwidth of only 8 nm" (p.12, paragraph on both designs; no
      reflection-bandwidth parameter); Fig. 8 series of separately optimized designs keeps better than -0.5 dB out to a
      minimum feature size over 130 nm (p.10).'
    why: 'p.12 and p.10: values whose design identity is not fixed go into component notes (D159); the batch report listed
      them but the rows did not carry them'
