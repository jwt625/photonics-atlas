    notes: Stated for the modified MLL designs ('~100 GHz'), not measured here (D82a). The sentence ends with ref. [13], the authors' earlier
      MLL transceiver work; the citation attaches to the multi-carrier use, so the value is kept as this paper's design statement (D80i borderline).
    why: 'p.2 Sec. II: the FSR / chip-length sentence carries ref. [13] (authors'' own arXiv MLL transceiver paper, p.4 references); D80i requires
      the borderline to be noted'
