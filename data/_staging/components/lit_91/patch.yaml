delete_metrics:
- id: cmp_lit_tsakyridis2020_soa_mzi_bmwc-m1
  why: 'p.7 Sec. III: Gcw1 = 2 is the steady-state gain of SOA1 alone at the chosen operating point and the model input of p.6 (no measurement
    described); on the gate row it is not a gain of the component, and gain_db is not allowed on switch_fabric. Value kept in component notes;
    audit Q1'
