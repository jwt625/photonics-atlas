# Audit patch lit_245 (fresh-context audit 2026-11-22, DevLog/audits/2026-11-22-lit_245-audit.md).
# 92 metrics: 78 ok / 14 imprecise / 0 wrong; 16 components: 15 ok / 1 imprecise / 0 wrong. 3 misses added (D153 geometry).
# Fixes: 10 unit / prefix conversions entered as measured -> derived (D256: kHz / MHz -> Hz, mW/mA -> W/A; no figure or text
# prints the stored-unit form); faugeron2012 room-temperature RIN rows get the 25 C the Fig. 3 inset prints; okai1990 SMSR rows
# lose a temperature stated only for the linewidth set-up; mathur2002 lensed-fiber coupler -> fiber_chip_coupler.edge, platform inp
# (laser facet; merged facet-to-lensed-fiber precedents); mitsuhara1999 FP test-laser stripe widths (p.1 Sec. II).
# Coordinator questions (audit Q1-Q10): all other distiller judgment calls kept (no op).
components:
