    class: fiber_chip_coupler.edge
    platform: inp
    notes: 'Authors at SDL Inc. (p.1). Fab empty: the structure ''We have developed'' and lasers ''were fabricated'' (p.1, passive; D80b). Laser row: cmp_lit_mathur2002_dfb_1000um. Platform inp: the coupler is the output facet of the AR/HR-coated InGaAsP/InP ridge DFB laser (p.1); edge class as the merged laser / SOA facet-to-lensed-fiber rows (e.g. andreou2019, bakonyi2003).'
    why: 'p.1: the 53 % is facet-to-lensed-SMF coupling of the stated InGaAsP/InP ridge laser; merged facet-to-lensed-fiber rows of laser / SOA chips are fiber_chip_coupler.edge with the chip platform (andreou2019 inp, bakonyi2003 gaas, cao2025 gaas); D422 covers only an unstated platform'
