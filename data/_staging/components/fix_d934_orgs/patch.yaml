components:
  cmp_lit_bolk2018_awg_gap100:
    facility_org_ids: org_nanolab_tu_e
    notes: 'Fab empty: ''Passive PIC devices were fabricated'' (passive, p.3 Sec. V); the authors ''developed a process flow'' (D80b); authors at Eindhoven University of Technology, SMART Photonics, InPACT
      and ASML. The ASML PAS5500/1100 DUV scanner used is installed at the NanoLab@TU/e cleanroom (p.1 Sec. I; staff thanked p.4 Ack.): facility org_nanolab_tu_e (D934). Measured with a PM lensed fiber
      into a central input waveguide, TE, eight outputs, lensed fiber to a power meter; losses normalized to the maximum of reference waveguides of similar length and curvature on both sides of the AWG
      (worst-case excess loss, p.3-4 Sec. V); best channel per FSR plotted in Fig. 5. Gap series 100 / 200 / 300 / 400 nm (sibling rows). The paper does not state that the fabricated AWGs use the Sec. IV
      simulated 8x8 cyclic design (row cmp_lit_bolk2018_awg_8x8_cyclic_sim).'
    why: p.1 Sec. I (the DUV scanner used is installed at the NanoLab@TU/e cleanroom), p.3 Sec. V, p.4 Sec. VII (AWGs fabricated with it); backfill (cov_01 audit point 6); fabricated rows only; D934
