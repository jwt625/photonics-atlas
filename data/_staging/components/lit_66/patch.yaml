delete_metrics:
  - id: cmp_lit_lee2025_sin_waveguide-m2
    why: 'p.1 Sec. I: below 0.1 dB/cm is an introductory platform statement in the same sentence as the ULI value that carries ref. [4]; it is not tied to this chip, whose Si3N4 test structures give 1.68 dB/cm (p.2 Sec. III). D159: sample identity ambiguous; value moved to component notes (audit Q2)'
delete_components:
  - id: cmp_lit_kumar2026_concave_100um
    why: 'rule 9 / D49: the row has geometry only (ROC) plus mfd_fiber_um. Registry convention: mfd_fiber_um only when the fiber is the design target, and p.5 states the spherical elements are not designed to mode-match the fiber mode. Shape accuracy and focal position have no parameter. Merged tables hold no component without a performance metric. Values in the spiral row notes and the audit (Q1)'
  - id: cmp_lit_kumar2026_convex_30um
    why: as cmp_lit_kumar2026_concave_100um (p.3-5)
