# Audit patch lit_66 (fresh-context audit 2026-11-02, DevLog/audits/2026-11-02-lit_66-audit.md).
# 194 metrics: 169 ok / 22 imprecise / 3 wrong; 50 components: 47 ok / 1 imprecise / 2 wrong (deleted).
# Misses: 4 geometry rows added (sundaram2025 edge couplers), 1 row added by splitting a two-axis value (salehzadeh2020).
# After the patch: 48 components, 186 metrics.
# Not covered here (coordinator rulings): audit Q1 (kumar2026 spherical elements return only with a registry extension),
# Q2 (lee2025 platform loss), Q3 (sundaram2025 PPKTP rows under D411); registry gaps and missing orgs are in the audit file.
components:
  cmp_lit_spektor2023_ta2o5_waveguide:
    notes: 'Fab empty: authors state they fabricate the devices but sit at several unrelated orgs and no site is named (D154). Waveguide width not stated. Record 3 +/- 1 dB/m C-band loss (p.2) carries refs. 70, 71: cited, not entered.'
    why: 'stray "Inverse-designed." copied into the waveguide note; p.9 describes length-scan waveguides and names inverse design only for the passive elements'
  cmp_lit_lee2025_sin_waveguide:
    notes: 'Fab: authors state they designed and fabricated the interposer (p.1), all at UC Davis; the DUV step''s site is not stated. All loss values rest on coupling terms calculated by FDTD overlap with a camera-measured mode, so author_estimate (D163). Not entered (D159): the introduction gives below 0.1 dB/cm for the Si3N4 platform (p.1 Sec. I, no reference, no origin), not tied to this chip; the test structures on this chip give 1.68 dB/cm (m1).'
    why: 'records the deleted m2 value in notes (see delete_metrics)'
  cmp_lit_kumar2026_spiral_phase_plate:
    notes: 'Fab and facility empty: Brookhaven National Laboratory and its Center for Functional Nanomaterials (FIB access acknowledged, p.9) are not in the registry. Mach-Zehnder winding fit m = 1.0095 (95 % bootstrap interval 0.8916-1.0600, p.7-8), donut far field (p.5); no parameter. Three devices. All-seven-device mean 0.41 +/- 0.15 dB, 91.12 % (p.9 Table II) stays in this note and the axicon note. Micro-concave and micro-convex spherical elements of the same paper are not rows (geometry only, rule 9; the paper says they are not designed to mode-match the fiber, p.5): concave design ROC 100 um, one element 100.76 / 99.88 um, five elements mean 99.66 +/- 0.56 um, range 98.82-100.32 um; convex design ROC 30 um, one element 28.49 / 29.15 um, three elements mean 28.00 +/- 0.72 um, range 27.44-28.82 um; AFM residuals lambda/50 and lambda/33 at 633 nm over the central 50 % of the area (p.3-5, Table I).'
    why: 'records the two deleted spherical-element rows and their values (see delete_components)'
