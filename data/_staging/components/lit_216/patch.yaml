# Audit patch lit_216 (fresh-context audit 2026-11-20, DevLog/audits/2026-11-20-lit_216-audit.md).
# 58 metrics: 58 ok / 0 imprecise / 0 wrong; 14 components: 13 ok / 1 imprecise (clark2003 APD notes: Fig. 3 series misread) / 0 wrong.
# Misses added: 13 metrics, no component. clark2003 Fig. 3 excess noise factor at M = 5 / 10 / 20 / 30 / 40 (5 rows; the "triangles"
# are the arrowheads of the APD label) and dark current < 5 nA at M = 10 with the bias read off Fig. 2 (1 row; rouvie2008 precedent,
# D671); kang2019 Fig. 2(a) simulated P_pi on the five sibling width rows (5 rows; same treatment as the 2.5 um row); joshi2008
# Fig. 3 dark current at 3 V and 8 V (2 rows; the two markers between the entered ones). After the patch: 14 components, 71 metrics.
# Coordinator questions (audit Q1-Q7): Q1 olivares2021 losses stay on the ring row (no op; registry widening proposed); Q2 platform
# empty and |k| = 0.15 as 15 % author_estimate kept (no op); Q3 kang2019 2.9-3.2 dB range kept on the 2.5 um row (no op); Q4 rise /
# fall kept on the 2.5 um row, phase_shifter.other kept (no op); Q5 joshi2008 split and saturation row kept (no op); Q6 clark2003
# GBP `typical` kept (no op); Q7 clark2003 dark-current add (revert = drop add_metrics cmp_lit_clark2003_apd_20um-m14) and Fig. 3
# adds (revert = drop -m9 ... -m13); registry year 1999 (registry follow-up, no op here).
components:
  cmp_lit_clark2003_apd_20um:
    notes: 'Fab empty: the fabrication section is passive and the conclusion says ''have been fabricated'' with no org named (D80b); all authors are at Nortel (Advanced
      Technology Lab and Nortel Optoelectronics). Discrete chip, not waveguide coupled (Fig. 1, light from the top); all opto-electronic measurements at 25 C with 1300 nm light
      from a cleaved SMF, estimated spot diameter 15 um (p.1-2); Fig. 1 labels the light 1310 nm, the text says 1300 nm (rows use 1300 nm). Active diameter 20 um, guard ring 5
      um wide (p.1): no diameter parameter. Fig. 3 excess-noise data are the filled square markers on the dashed line; the two filled triangles are the arrowheads of the
      ''APD'' label (same arrow style as Fig. 4), not a second series (audit 2026-11-20); F at M = 10 read as about 4.4 is consistent with the printed k_eff = 0.31 (McIntyre).
      Dark current < 5 nA at M = 10 entered with the bias read off Fig. 2 (m14). Not entered: gain ''more than 30'' before the dark current exceeds 20 nA (p.2; the 20 nA point
      sits on the near-vertical breakdown part of Fig. 2 at about 27.3-27.5 V, and the gain there is a second read on a steep curve); effective ionization rate ratio k_eff =
      0.31 at M = 10 from McIntyre analysis of the Fig. 3 noise data (registry gap); reliability: fewer than 1 failure per 1000 h on 40 APDs at 200 C with 100 uA or 2 mA
      reverse current (failure = Id > 50 nA or Vbr shift > 0.5 V; p.2, Fig. 5; no parameter). Comparison values for InP (refs. 4, 5) and InAlAs (ref. 6) are cited, not
      entered. Cross-notes: reference p-i-n cmp_lit_clark2003_pin_50um_ref, back-mirror version cmp_lit_clark2003_apd_back_mirror_rx.'
    why: 'p.2 Fig. 3 (render and native scan): both APD arrows end in filled triangular arrowheads on the dashed line through the square markers, as the arrows of Fig. 4;
      the D156 ambiguity in the old notes does not hold. Notes updated for the added m9-m14 rows and the Fig. 1 1310 nm label'
