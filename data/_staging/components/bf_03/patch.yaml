# Audit bf_01-03 corrections for bf_03.
components:
  cmp_li2025a_slowlight_bragg:
    notes: 'Slow-light phase-shifter waveguide of the 2.8 mm MZM li2025a-a (Np = 80 resonators of two apodized gratings joined by a pi-phase shift); loss measured on separate waveguides with Np = 10, 50 and 80. Values held only in the EO row notes. Class resonator.bragg kept after v3 (a cascade of Bragg resonators; waveguide_platform.slow_light is non-resonant). Fabrication details are in a supplement that is not in the local cache. Centre width w0 0.6 um is held by EO row li2025a-a (rib_width_nm).'
    why: 'audit: stale class note; w0 duplicate removed'
  cmp_montifiore2026_ring_493: {notes: 'The PZT ring modulator of EO row montifiore2026-c, critically coupled. Loaded Q 1.9M and 0.24 dB/cm are held by the EO row (not re-entered); notch ER 18.7 dB is the modulator ER (not entered); FWHM 324 MHz entered as linewidth_mhz. Fabricating organization not stated.', why: 'v3 back-fill linewidth_mhz'}
  cmp_montifiore2026_ring_780: {notes: 'The PZT add-drop ring modulator of EO row montifiore2026-d, slightly under-coupled at 780 nm. Loaded Q 0.7M and 0.27 dB/cm are held by the EO row (not re-entered); ER 12.1 dB is the modulator ER (not entered); FWHM 539 MHz entered as linewidth_mhz. Fabricating organization not stated.', why: 'v3 back-fill'}
  cmp_porto2026_dfb_array: {notes: 'Each DFB emits from both ends into two MZM channels. Fabricated by the Nokia authors (same process as their prior work, p.1, p.3). DFB RIN 0.4 % integrated over 0.1-18 GHz entered as rin_integrated_pct.', why: 'v3 back-fill'}
  cmp_shamsansari2021_dfb_tfln_butt: {notes: 'Trench etched through cladding, LN and BOX at the horn tip; Ti/Pt/Au pad at the trench bottom serves as laser electrode and bonding pad. Facet sidewall angle sets the minimum laser-waveguide gap of about 500 nm (gap_nm). Simulated coupling loss vs gap and height offset only in Fig. 1(c) (not entered).', why: 'v3 back-fill gap_nm'}
