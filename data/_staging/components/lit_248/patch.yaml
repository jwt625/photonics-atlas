    why: 'kappa_m = 0.372 um^-1 is printed in the p.9 text (Fig. 7 discussion); Fig. 5(b) (kappa_m vs Wm) is on p.7'
  cmp_lit_priyadarshini2024_dbr_mirror_n61_wm1p5-m4:
    locator: 'p.1 abstract; p.15 Sec. 4.1; p.17 Fig. 13(a); p.21 Sec. 5'
    why: 'the D1-D3 stopband sentence is on p.15 (text), Fig. 13(a) is on p.17, and p.21 repeats "entire stopband (~60 nm)"'
  cmp_lit_priyadarshini2024_dbr_mirror_n61_wm1p0-m4:
    locator: 'p.5; p.13 Sec. 3'
    why: 'Table 1 (p.13) lists only Wm, Lc, Lg and N; the 292 nm period is printed on p.5, and p.13 states all other parameters as in Sec. 2'
