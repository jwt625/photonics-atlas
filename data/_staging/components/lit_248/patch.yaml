  unit: um
  qualifier: approx
  condition: 'lateral distance from the V-shaped slab-integrated heater apex to the cavity (design); edge vs centre not stated'
  basis: design_target
  locator: 'p.13 Sec. 3; p.14 Fig. 10'
  notes: 'Printed ''~2.5 um laterally away from the cavity'' (p.13); Fig. 10 label 2.5 um from the heater apex to the grating. Lateral heater-to-waveguide distances are stored in heater_gap_um in merged rows (campenhout2010, chung2017).'
  why: 'miss: p.13 and the p.14 Fig. 10 label give the heater-to-cavity distance; heater_gap_um ("as stated") holds lateral distances in merged rows, so the edge-vs-centre ambiguity that ruled out heater_offset_um does not block it'
