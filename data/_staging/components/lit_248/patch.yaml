  cmp_lit_xu2007_dc_ring_r50-m2:
    wavelength_nm: '1528'
    wavelength_max_nm: '1534'
    notes: 'Printed ''Near the critical coupling ... a Q of ~10,000''; wavelength not printed: read off Fig. 3(a) where the dips are deepest (about 34-37.5 dB, 1527.7-1533.8 nm, +/- 0.5 nm) and the Q triangles sit at about 9,300-10,500.'
    why: 'p.5 Fig. 3(a) render: the deepest dips (critical coupling) are at about 1528-1534 nm with Q triangles about 10,000; the 1520-1570 nm span was the whole axis (which starts near 1513 nm)'
  cmp_lit_xu2007_dc_ring_r50-m3:
    wavelength_nm: '1528'
    wavelength_max_nm: '1534'
    notes: 'Printed FWHM ~0.2 nm (nm -> pm); wavelength as the 10,000 Q row (deepest Fig. 3(a) dips, about 1528-1534 nm).'
    why: 'p.5 Fig. 3(a) render: critical-coupling region about 1528-1534 nm (as m2)'
  cmp_lit_priyadarshini2024_dbr_cavity_d1-m9:
    qualifier: ''
    condition: 'onset of optical bistability (reversible nonlinearity, not a damage level); laser power launched into the device, aligned to the resonance'
    notes: 'Printed ''bistability sets in with a launched laser power level into the device of 0.5 mW'' (0.5 mW -> -3.0 dBm); the noise-suppression test was run below it; the authors note operation at higher power by controlling the bistability (ref. [29], not entered). Onset value without bound qualifier as the merged onset precedent cmp_ofc2026_tu2j2_spgc_si-m3.'
    why: 'p.18 Sec. 4.3: the printed 0.5 mW is the onset itself, not a stated bound; merged onset row cmp_ofc2026_tu2j2_spgc_si-m3 stores the onset without lt; condition now says it is a reversible bistability onset (audit Q3)'
  cmp_lit_priyadarshini2024_dbr_mirror_n61_wm1p5-m2:
