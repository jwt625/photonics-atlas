# Audit patch lit_248 (fresh-context audit 2026-11-22, DevLog/audits/2026-11-22-lit_248-audit.md).
# 198 metrics: 187 ok / 11 imprecise / 0 wrong; 23 components: 21 ok / 2 imprecise (notes) / 0 wrong. 3 misses added
# (microheater component notes updated for them). 29 changes; after the patch 23 components / 201 metrics.
# Main fix: xu2007 Fig. 4 panels: (a) R = 50 um is the left panel on a 1482-1495 nm axis (about 1.3 nm FSR), (b) R = 5 um the
# right panel on a 1470-1510 nm axis (about 9.5 nm resonance spacing); the batch swapped the two axes.
# Coordinator questions (audit Q1-Q10): recommendations in the audit file; only Q3 (bistability onset qualifier) is applied here.
components:
  cmp_lit_xu2007_mmi_ring_r5:
    notes: 'Fab: ''were fabricated on unibond SOI wafers'' (p.4), passive with no org named; all authors at the Institute for Microstructural Sciences, National Research Council Canada (D80b: fab empty). Process: EBL, cryogenic SF6/O2 ICP-RIE (p.5). Unibond SOI = wafer supplier wording as printed. Unqualified Q -> q_loaded. FWHM bandwidths stored in linewidth_pm (printed in nm, nm -> pm, D256). SEM of an R = 5 um MMI ring in Fig. 1(c)-(d); spectrum Fig. 4(b) (right panel, 1470-1510 nm axis, resonance spacing about 9.5 nm, ''fairly uniform resonances''). Bend loss ''found experimentally to be insignificant'' (p.6, no number).'
    why: 'p.6 Fig. 4 render: panel (b) (R = 5 um) is the right panel with the 1470-1510 nm axis; the 1482-1494 nm axis belongs to panel (a) (R = 50 um, about 1.3 nm FSR)'
  cmp_lit_priyadarshini2024_dbr_mirror_n101_wm1p5:
    notes: 'Design-only mirror of the Fig. 7(a) length series (CMT-aided TMM with effective-medium unit cells, Lumerical MODE, TE, 1550 nm design; p.5-10); N = 101 is not in the fabricated set (Table 1, p.13). Same Wm 1.5 um, W0 450 nm, W''0 100 nm, h 150 nm, H 220 nm, period 292 nm as the fabricated N = 61 mirror (Fig. 7 caption). Series N = 61-101: stopband ''nearly unchanged (~80 nm)'' (p.9, stated once for the series, not entered). N = 71 / 81 mirrors (fabricated in D2 / D3) have no printed values.'
    why: 'component notes said "DBR mirror of the fabricated cavities (D80e: fabricated ...)" on a row_kind design row; N = 101 is a calculation only (p.9-10 Fig. 7(a), Table 1 p.13)'
  cmp_lit_priyadarshini2024_d1_microheater:
    notes: 'Fab: ''we have fabricated devices using our in-house process technology developed at the Center for NEMS and Nanophotonics (CNNP), IIT Madras'' (p.13) and ''fabricated using in-house facilities at the Centre for NEMS and Nanophotonics (CNNP), IIT Madras'' (p.21): fab IIT Madras (first-person, all authors IIT Madras); CNNP is a named facility missing from the registry (reported). Same physical device as cmp_lit_priyadarshini2024_dbr_cavity_d1 (D396), which carries the 96 pm/mW tuning slope, 4.32 nm range and 46.75 mW. V-shaped heater, two arms of 2.5 um x 1 um (Fig. 10 labels), total ~5 um (Fig. 11(d) caption). Lateral heater-to-cavity distance as stated: 2.5 um design (p.13, Fig. 10 label) and ~3 um on the SEM (Fig. 11(d) caption and label), entered as heater_gap_um (apex-to-cavity, edge vs centre not stated; no heater_offset_um). Rise / fall ''closely following'' the authors'' earlier slab-heater work [28] (p.18): measured here, kept.'
    why: 'notes updated for the two heater_gap_um rows added (p.13; p.14 Fig. 10 and Fig. 11(d))'
