  cmp_lit_xu2007_mmi_ring_r5-m1:
    wavelength_max_nm: ''
    notes: 'Printed ~2000; wavelength from the radius-comparison sentence, which continues the ''At 1470 nm'' values of the R = 50 um ring and is followed by ''This trend of increasing FWHM with wavelength applies to the resonators with other radii'' (p.6). The R = 5 um spectrum (Fig. 4(b), right panel) spans 1470-1510 nm.'
    why: 'p.6 Fig. 4 render: the R = 5 um panel (b) spans 1470-1510 nm; the 1482-1494 nm axis used for the range is panel (a) (R = 50 um); same 1470 nm inference as the R = 20 um rows'
  cmp_lit_xu2007_mmi_ring_r5-m2:
    wavelength_max_nm: ''
    notes: 'Printed FWHM 0.8 nm (nm -> pm); wavelength as the Q row (1470 nm, inferred from the radius-comparison sentence, p.6).'
