metrics:
  cmp_ectc51846_2026_00106_iox_bend_uniform_dn-m1:
    notes: abstract 'from 4 dB/cm'; derivation not stated; wavelength as for the paper's characterization. Not reproduced by Fig. 6 (p.3), where all four mask openings give about 1-1.5 dB fiber-to-fiber
      per 90-degree bend device at R = 10 mm (a 4 dB/cm bend over a 1.57 cm arc would add about 6 dB), so the radius / design behind the 4 dB/cm is uncertain.
    why: consistency check against Fig. 6 (p.3 render); basis author_estimate stays
  cmp_ectc51846_2026_00106_iox_bend_enhanced_dn-m1:
    notes: abstract bend loss 'reduced from 4 dB/cm to 0.01 dB/cm' at R = 10 mm; derivation (measured or modelled) not stated; Fig. 6 fiber-to-fiber totals do not resolve a 0.01 dB/cm coefficient, and the
      same group's OFC paper calls its bend-loss coefficients calculated (Th1D.3 Fig. 2-A). 1310 nm = wavelength of all optical characterization in the paper.
    why: supports author_estimate (origin not stated); context only
