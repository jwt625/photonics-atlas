    fab_org_ids: org_ucsb
    notes: 'Fab org_ucsb (audit Q1): Gen. 1 lasers ''built upon the standard process-design-kit for the heterogeneous Si/InP developed at UCSB'' (p.4) and ''fabricated in a standard Si/InP heterogeneous process'' [35], [36] (p.5): the fabrication sentence names that UCSB process (org named with the process, Contract v7; the authors'' own institution''s process, D84a); no facility named; staff thanks (p.12) not used. Rings: cmp_lit_tran2019_gen1_ring_r60, cmp_lit_tran2019_gen1_ring_r62p5 (D400); front mirror cmp_lit_tran2019_gen1_front_loop_mirror; tap cmp_lit_tran2019_gen1_tap_mmi. Measured at 20 C into a 2.5 um spot lensed fiber after a polished angled facet. Si/III-V taper loss 0.5 dB and < -33 dB reflection are cited ([26], [27]; rule 3). Fig. 12(a) labels the white-noise level 650 Hz2/Hz while p.7 prints 65 Hz2/Hz; pi x 650 matches the printed 2.1 kHz (D417 note). Fig. 13(b): output about 10.8 mW at zero detuning at 120 mA (separate measurement, not entered). Model inputs (Table I: ng 3.689, internal loss 6 /cm, alpha_H 4.0) not entered.'
    why: 'Q1 (p.4 Sec. III; p.5 Sec. III.A.1): the paper names the fabricating process with its org (''the standard process-design-kit for the heterogeneous Si/InP developed at UCSB'', then ''fabricated in'' that process); Contract v7 counts an org named with the process, D84a counts the authors'' own process. Coordinator may drop (keep empty, D80b) or limit to Gen. 1'
