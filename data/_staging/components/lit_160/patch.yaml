    facility_org_ids: org_center_of_micronanotechnology
    notes: 'Cached copy is arXiv 2306.03184v2 (preprint title ''Hertz-linewidth and frequency-agile photonic integrated extended-DBR
      lasers'') of the listed Optica paper; values as the preprint reports them (D430 / D433). Mirror of the self-injection-locked
      E-DBR laser (row edbr_sil_spiral). Not entered: the 10 GHz FWHM reflection bandwidth (p.6): reflector bandwidths are
      registered in nm only and no wavelength is printed for this grating (registry gap). Fab EPFL only: no actuator is stated
      for this chip. Fab: author contributions (p.7) name R.N.W. and Z.Q. (EPFL) as device fabricators and A.A. (Purdue) for
      the integrated actuators; acknowledgments (p.8) place chip fabrication at the EPFL CMi and the Birck Nanotechnology
      Center at Purdue University (liu2020a precedent). Facility CMi only on this row (audit 2026-11-16): the two printed
      sites map to the two fabrication steps of the author contributions (EPFL Si3N4 device, Purdue actuators), and no actuator
      is stated for this chip or part, so Birck follows the Purdue fab assignment and stays on the AlN-actuator chip rows.'
    why: 'Q2 (D448 / D515 / D463): p.8 acknowledgment names CMi and Birck for ''the chip samples''; p.7 contributions tie
      Purdue (Birck) to the integrated actuators only; fab here is org_epfl only, so Birck is dropped with Purdue (drop this
      op to keep Birck on every row)'
