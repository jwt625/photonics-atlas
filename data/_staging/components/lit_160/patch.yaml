# Audit patch lit_160 (fresh-context audit 2026-11-16, DevLog/audits/2026-11-16-lit_160-audit.md).
# 126 metrics: 118 ok / 8 imprecise / 0 wrong; 29 components: 22 ok / 7 imprecise (Q2 facility) / 0 wrong
# (1 note sync on edbr_8mm_piezo); 0 deleted; no misses added. After the patch: 29 components, 126 metrics.
# Imprecise: 5 D157 length rescales (4 siddharth2024 grating lengths, wei2023 cavity length), siddharth2024 SIL
# wavelength re-read (1559 -> 1559.4 nm), siddharth2024 heater tuning conflict note (Fig. 3(c) about 0.37 nm),
# aflatouni2015 Fig. 4(c) curve is a typical modulator (statistic mean -> typical).
# Coordinator questions (audit Q1-Q6): Q1 siddharth2024 kappa-unassigned row kept (note op only); Q2 Birck
# facility dropped on the 7 EPFL-only rows (to keep Birck everywhere, drop those 7 component ops); Q3 OFDR
# 0.01 / 0.02 dB/cm kept; Q4 wei2023 fab and 7.35 dB author_estimate kept; Q5 tang2021 fab empty and 0.297 nm
# kept; Q6 aflatouni2015 fab IME + process_name kept, OpSIS to the org round, no OPA row.
components:
