  cmp_lit_wang2022a_gesn_wpd_l75:
    notes: 'Waveguide-coupled GeSn/Ge MQW PD at 2 um (subtype ge_waveguide: Ge-alloy absorber on a Ge waveguide). Authors at NUS and Applied Materials; no fabrication statement naming an org, fab_org_ids empty. The co-integrated GeSn/Ge EAM (IL 10.88-12.91 dB, ER 2.02 dB at 2004 nm) is a modulator and is not entered. Dark-current density 0.38 A/cm2 at -1 V entered as 380 mA/cm2 (dark_current_density_ma_per_cm2, D169).'
    why: 'D169 gap-fill: note said the dark-current density was not entered (no registry parameter); now entered'
  cmp_lit_brisson2023_snspd_u20:
    notes: 'Evanescently coupled NbN nanowire on a Si waveguide, fully CMOS-compatible 200 mm process; operated at 2.3 K in a cryostat, fiber-array pigtailed via on-chip grating couplers (GC loss excluded from the efficiency, GC values not reported). fab_org_ids borderline: the authors state they start the fabrication on 200 mm SOI (p.1); authors at CEA-Leti and CEA-IRIG (Univ. Grenoble Alpes), 200 mm line taken as CEA-Leti. Not entered (no registry parameter): nanowire linear resistance 11 kOhm/um with <1 % std over 7 dies (p.2 Fig. 1(c)). Critical current 4.62 uA, 3.2 ns decay time (exponential fit), 200 MHz maximum count rate and 100 Hz / 5 kHz dark count rates (p.3) entered under the D169 parameters.'
    why: 'D169 gap-fill: note listed Ic, decay time, max count rate and DCR as not entered (no registry parameter); now entered'
  cmp_lit_qi2024_ingaas_spad:
    notes: 'Discrete SPAD chip in a 26 x 13 x 11 mm butterfly package with mini-TEC, NTC and sampling resistor; 62.5 um metallized multimode fiber pigtail (p.3-4). Module (6 x 5.7 x 1.7 cm) adds the sine-wave gating IC (SWGIC) and readout chip (MIRC), electronic parts not entered as rows. Dark count rate 9 kcps (7.2e-6 per gate, Table I) and 23 kcps, afterpulse probability 4.6 % and 18.5 % and timing jitter 119 ps FWHM entered under the D169 parameters (hold-off 160 ns in their conditions). Not entered (no registry parameter): effective gate width 117 ps, punch-through voltage 35 V. Authors state they design and fabricate the SPAD chip, but the authors span USTC, Chongqing Optoelectronics Research Institute and QuantumCTek, so fab_org_ids is empty (fabricating org not unambiguous).'
    why: 'D169 gap-fill: note listed DCR, afterpulse and jitter as not entered (no registry parameter); now entered'
  cmp_lit_virot2014_ge_apd:
    notes: 'Author contributions (p.6): two CEA-Leti authors fabricated the devices with the CEA/Leti clean room staff. Absorption and multiplication both in Ge (no separate Si multiplication layer). Not entered: maximum gain >140 below -35 dBm (Fig. 2(c), bias not stated), Q-factors / BER / eye extinction (link-level), k_eff ~0.4 (no registry parameter; excess noise factor 5.24 entered, D169), intrinsic-region width ~280 nm from an I-V model fit (no registry parameter). Grating couplers on the same wafers have no reported metrics.'
    why: 'D169 gap-fill: note listed the excess noise factor as not entered (no registry parameter); now entered'
  cmp_lit_hu2023_unpeaked_ge_pd:
    notes: Un-peaked reference of cmp_lit_hu2023_peaked_ge_pd; the paper presents it as the same intrinsic lateral Ge-Si PD without the spiral inductor (geometry rows restate the Sec. 2 design on that basis). Series resistance 31 ohm from the S11 fit entered as series_resistance_ohm (D169).
    why: 'D169 gap-fill: note said the series resistance was not entered (no registry parameter); now entered'
  cmp_lit_hosseini2015_pzt_w30:
    notes: Waveguide made with the standard TriPleX technology (p.3); PZT deposited with a SolMateS PLD system; authors at LioniX, XiO Photonics, SolMateS, PhoeniX. No statement naming the fabricating org, fab_org_ids empty. PZT capacitance 3 nF (LCR meter, p.7) entered (capacitance_ff widened to phase_shifter, D169). MZI extinction ratio typically 25 dB (p.5) is one statement for all electrode widths, not entered on a single row (D254). Electrode resistance 30 ohm (p.7) not entered (no registry parameter for phase_shifter). Energy 430 nJ per bit not entered. Voltage-response time constant 287 ns in the text vs 280 ns in the Fig. 7 legend (not entered).
    why: 'D169 gap-fill: note listed the MZI ER and PZT capacitance as not entered (no registry parameter); capacitance now entered, ER stays a note (coordinator, D254)'
  cmp_lit_meng2023_gsse_pram_4bit:
    notes: 'Amplitude-only (k) modulation memory; class phase_shifter.phase_change as the nearest registry class. Contributions (p.14): devices fabricated by a GWU author and an MIT author; heaters fabricated in the GWU Nanofabrication and Imaging Center (GWNIC, p.11, p.13; not in the registry). Thin-film analysis supported by NIST CNST (p.13; not in the registry). Planarized chips provided by a contributor (D.V.T.) not in the author list. GSSe thickness inconsistent in the paper (40 nm p.3, 30 nm p.3-4, 20 nm Methods p.11): not entered. Total extinction 12 dB over 16 states, 0.75 dB per state (p.4, Fig. 2(a)) entered as extinction_db / n_levels (D169). Not entered (no registry parameter for phase_shifter): 0.2 dB/um extinction, <0.002 dB/um unit IL, 1.5 nJ/dB set energy (Table 1, p.10); 0.5 ms for 0.2 dB and 500 ms for 6 dB extinction (p.6, Fig. 3(b)). The ~500,000 write-reset cycles (double-sided-heater design, p.5) and the 6-state single-heater-pair cell (p.8) are on the sibling rows cmp_lit_meng2023_gsse_pram_double_heater and cmp_lit_meng2023_gsse_pram_single_pair.'
    why: 'D169 gap-fill: note listed the 12 dB / 16 states, endurance and 6-state cell as not entered (no registry parameter); now entered (endurance and 6 states on the sibling designs the text ties them to)'
add_components:
- component_id: cmp_lit_meng2023_gsse_pram_double_heater
  source_id: lit:meng2023
  class: phase_shifter.phase_change
  label: GSSe phase-change non-volatile amplitude memory (P-RAM), double-sided W/Ti heater pairs, bi-state cycling device, SOI
  row_kind: fabricated
  platform: soi
  core_material: planarized Si waveguide (dimensions not stated) with a GSSe (Ge2Sb2Se5) film under a 20 nm ALD Al2O3 cap; W/Ti micro-heater pairs on both sides of the waveguide (500 nm from the waveguide, p.3), 200 nm Al over the routing; thick ALD Al2O3 passivation (600 nm p.5, 400 nm Methods p.11)
  fab_org_ids: org_george_washington_university;org_mit
  tags: phase_change;gsse;non_volatile;memory
  verified_on: '2026-10-22'
  notes: 'Sibling design of cmp_lit_meng2023_gsse_pram_4bit (which uses single-sided heaters): the double-sided heater pairs of Fig. 1(a-c); the endurance test names the failure of the micro-heaters on the two sides of the waveguide (p.5). Fabrication per the contributions (p.14, devices fabricated by a GWU author and an MIT author); heaters made in GWNIC (p.11; not in the registry). Without Al2O3 protection the tungsten heaters failed after 10,000 cycles (Fig. 2(d) caption). Heater-position sweep (Fig. 2(b), 2(e)), FOM and per-length Table 1 values not entered (curves / per-length, D169).'
  why: 'D169 gap-fill: endurance_cycles (~500,000, p.5) is tied by the text to the double-sided-heater design, which had no component row (sibling design, skill rule 9)'
- component_id: cmp_lit_meng2023_gsse_pram_single_pair
  source_id: lit:meng2023
  class: phase_shifter.phase_change
  label: GSSe phase-change non-volatile amplitude memory (P-RAM), single asymmetric heater pair on one GSSe pad (multi-level cell), SOI
  row_kind: fabricated
  platform: soi
  core_material: planarized Si waveguide (dimensions not stated) with a GSSe (Ge2Sb2Se5) film under a 20 nm ALD Al2O3 cap; one asymmetric W/Ti heater pair along the waveguide (longer reset heater, shorter set heater)
  fab_org_ids: org_george_washington_university;org_mit
  tags: phase_change;gsse;non_volatile;memory;multilevel
  verified_on: '2026-10-22'
  notes: 'Second P-RAM design (Fig. 4): the shorter heater sets the amorphous area of the GSSe pad by the pulse energy (80-400 nJ), the longer heater resets the whole cell to crystalline (p.7-8). Fabrication per the contributions (p.14); heaters made in GWNIC (p.11; not in the registry). Pulse energies not entered (no registry parameter).'
  why: 'D169 gap-fill: n_levels 6 (p.8, Fig. 4(c)) is tied by the text to the single-heater-pair design, which had no component row (sibling design, skill rule 9)'
