- metric_id: cmp_lit_xie2026_folded_awg_16x20ghz-m21
  component_id: cmp_lit_xie2026_folded_awg_16x20ghz
  parameter: channel_spacing_nm
  value: 0.146
  unit: nm
  qualifier: approx
  statistic: mean
  n_samples: 10
  wavelength_nm: 1554.16
  wavelength_max_nm: 1555.48
  condition: mean peak spacing of channels 7-16 in the first FSR (Fig. 10(b)); second FSR in Fig. 10(a) about 0.147 nm
  basis: extracted_from_figure
  locator: p.10 Fig. 10(b)
  notes: 'Audit read of the Fig. 10(b) page render (600 dpi, ticks 1554 / 1554.5 / 1555 / 1555.5 nm at 548 px/nm, trace-centre peaks): channel 7 at about 1554.16 nm, channel 16 at about 1555.48 nm, (1555.48 - 1554.16) / 9 = 0.146 nm (+/- 0.005 nm); individual spacings scatter 0.12-0.17 nm (noisy passband tops). 0.146 nm is about 18.2 GHz at 1554.8 nm, against the printed 20 GHz design spacing (Table 1, m4; 20 GHz is about 0.161 nm): flag (D417).'
  why: Miss. The paper prints only the 20 GHz design spacing (p.7 Table 1; m4 author_estimate); p.10 Fig. 10(b) and Fig. 10(a) give a measured mean channel spacing of about 0.146-0.147 nm in both FSRs. Audit Q2
