  cmp_lit_chauhan2022_facet_461:
    notes: 'Fiber-to-chip coupling at the waveguide facet without spot-size converter or facet polishing (both named as improvements, p.6); facet width, preparation and test fiber not stated. Per-facet loss printed directly (D167). Facet of the 461 nm waveguides (1.3 um design width away from the facet). Fab borderline (D84b; isichenko2023 / puckett2021 precedent): the acknowledgment (p.8) thanks named Honeywell staff for help with upper-cladding deposition and annealing of devices. The text says the waveguides are fabricated with a wafer-scale CMOS-compatible LPCVD Si3N4 core process (p.3, passive) and ''we designed and fabricated resonators'' for 674 / 802 nm (p.3, first person), but the author list spans UCSB and Honeywell, so that sentence names no single org (rule 12, D80b, D395): UCSB not entered. No facility named.'
    why: 'Notes miss the p.3 first-person sentence ''At the other wavelengths, we designed and fabricated resonators with 8.9 mm radius for 674 nm, and 10 mm radius for 802 nm''; fab unchanged (authors at UCSB and Honeywell: no single org, rule 12 / D395; Honeywell kept on the p.8 staff thanks, D84b)'
  cmp_lit_chauhan2022_facet_red_nir:
    notes: 'Fiber-to-chip coupling at the waveguide facet without spot-size converter or facet polishing (both named as improvements, p.6); facet width, preparation and test fiber not stated. Per-facet loss printed directly (D167). Facet of the 674 / 802 nm waveguides (2.3 um design width away from the facet); one row for the shared 2.3 um design, wavelength as the condition. No coupling loss printed at 698 nm. Fab borderline (D84b; isichenko2023 / puckett2021 precedent): the acknowledgment (p.8) thanks named Honeywell staff for help with upper-cladding deposition and annealing of devices. The text says the waveguides are fabricated with a wafer-scale CMOS-compatible LPCVD Si3N4 core process (p.3, passive) and ''we designed and fabricated resonators'' for 674 / 802 nm (p.3, first person), but the author list spans UCSB and Honeywell, so that sentence names no single org (rule 12, D80b, D395): UCSB not entered. No facility named.'
    why: 'Notes miss the p.3 first-person sentence ''At the other wavelengths, we designed and fabricated resonators with 8.9 mm radius for 674 nm, and 10 mm radius for 802 nm''; fab unchanged (authors at UCSB and Honeywell: no single org, rule 12 / D395; Honeywell kept on the p.8 staff thanks, D84b)'
  cmp_lit_liu2020d_mmi_unoptimized_design:
    core_material: Si 220 nm on 2 um BOX (SOI wafer); 1 um dual-mode access waveguides joined to the 5 um MMI without tapers
    why: core_material copied from the optimized splitter says 'taper-assisted'; the comparison device has its access waveguides 'directly connected with the MMI without tapers' (p.3 Sec. II)
  cmp_lit_liu2020d_dual_mode_mmi:
    notes: 'Eigenmode-selective excitation: input offset y_in = 1.38 um from the MMI axis, 2.24 um x 5.2 um tapers (p.2; no offset parameter). Simulated power in the lowest three / five eigenmodes 95.9 % (TE0) / 94.2 % (TE1) (p.3; no parameter). Platform soi_strip from the Fig. 1(c) cross-section (rectangular cores in SiO2, no slab). Measured in a test system MUX - splitter - DEMUX with asymmetric-DC mode (de)multiplexers (ref. [16] design), normalized to a reference MDM system on the same chip (Fig. 7(d)); the test system is axisymmetric and only its lower input pair was launched (''we only test the device performance for lower arm'', p.4: TE0 at I3, TE1 at I4); Fig. 8 shows both splitter output arms for each input (TE0 at O2 / O3, TE1 at O1 / O4, port labels of Fig. 7(a)), so the printed output-arm imbalances rest on measured data. Fig. 5 u = 3 / 5 designs (simulated, figure only) not entered. Fab: ''We fabricated and experimentally demonstrated'' the splitter; ''The fabrication process is the same as our previous work [15]'' (p.3-4 Sec. III), all authors at the Next Generation Internet Access National Engineering Laboratory, School of Optical and Electronic Information, HUST (p.1): fab org_huazhong_university_of_science_and_technology (first-person fabrication with the authors'' own process, D80b / D84a).'
    why: Note read 'lower arm' as one splitter output arm, which would contradict the printed imbalances; p.4 Fig. 7(a) / Fig. 8 show the 'lower arm' is the lower input pair (I3 / I4) and both output arms (O2 / O3, O1 / O4) were measured
metrics:
  cmp_lit_chauhan2022_ring_r3mm_461-m3:
    basis: author_estimate
    notes: 'Printed Q_i 9.5 M (p.6, Fig. 4(d) caption, abstract) from Q_L and the coupling measured on separate test structures (kappa^2 ~16 %, p.3-4); converting kappa^2 into a coupling Q needs a group index that is not printed (supplement not cached), as for the loss rows (D76): author_estimate (D403). Over-coupled design (p.3); Q_c about 2.0e6 by 1/Q_L - 1/Q_i.'
    why: 'D403 / D76: the regime is set by kappa^2 from separate test structures, and kappa^2 -> Q_c needs the group index, which the paper does not print; the loss rows from the same extraction are already author_estimate (only the 674 nm ring, dip to about zero, Q_i about 2 Q_L, stays measured, D463)'
  cmp_lit_chauhan2022_ring_r9p4mm_698-m3:
    basis: author_estimate
    notes: 'Printed Q_i 60 M (p.5, Fig. 4(a) caption) from Q_L and the coupling measured on separate test structures (kappa^2 1 %, p.3-4); converting kappa^2 into a coupling Q needs a group index that is not printed (supplement not cached), as for the loss rows (D76): author_estimate (D403). Under-coupled design (p.4); Q_c about 81e6 by 1/Q_L - 1/Q_i.'
    why: 'D403 / D76: the regime is set by kappa^2 from separate test structures, and kappa^2 -> Q_c needs the group index, which the paper does not print; the loss rows from the same extraction are already author_estimate (only the 674 nm ring, dip to about zero, Q_i about 2 Q_L, stays measured, D463)'
  cmp_lit_chauhan2022_ring_r10mm_802-m3:
    basis: author_estimate
    notes: 'Printed Q_i 28.3 M (p.5 text; Fig. 4(c) caption and p.2 print 28 million, D417: text value entered) from Q_L and the coupling measured on separate test structures (kappa^2 57 %, p.3-4); converting kappa^2 into a coupling Q needs a group index that is not printed (supplement not cached), as for the loss rows (D76): author_estimate (D403). Strongly over-coupled (Q_L / Q_i about 0.03), so Q_i is very sensitive to the coupling model.'
    why: 'D403 / D76: the regime is set by kappa^2 from separate test structures, and kappa^2 -> Q_c needs the group index, which the paper does not print; the loss rows from the same extraction are already author_estimate (only the 674 nm ring, dip to about zero, Q_i about 2 Q_L, stays measured, D463)'
