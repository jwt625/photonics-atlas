# Audit patch lit_174 (fresh-context audit, DevLog/audits/2026-11-16-lit_174-audit.md).
# 196 metrics: 193 ok / 3 imprecise / 0 wrong; 25 components: 17 ok / 8 imprecise / 0 wrong; 0 deleted; 2 misses added
# (core_thickness_nm 20 nm on the two chauhan2022 facet rows, D153 / D606).
# Imprecise: chauhan2022 q_intrinsic at 461 / 698 / 802 nm derived -> author_estimate (D403 / D76: kappa^2 from separate
# test structures needs an unprinted group index); chauhan2022 six component notes miss the p.3 first-person
# "we designed and fabricated resonators" sentence (fab unchanged); liu2020d design row core_material said
# "taper-assisted"; liu2020d splitter note misread the "lower arm" sentence.
# Coordinator rulings open (audit Q1-Q4); recommendations:
# Q1 chen2015 11 reflector rows, kappa figure reads, fab org_university_washington, WNF facility via the org round (no op).
# Q2 chauhan2022 fab org_honeywell borderline kept (notes only); 2 m coil losses stay out (no op).
# Q3 liu2020d "below" bounds as lt + mean, design-only comparison row kept (no op beyond the core_material fix).
# Q4 adar1994 Table I author_estimate, D417 notes, R = 5 mm width out, fab empty (no op).
components:
  cmp_lit_chauhan2022_ring_r3mm_461:
    notes: 'All-pass ring designed for 461 nm (over-coupled design (p.3); single TE mode at 1.3 um (p.3)); polarization of the measurement not stated with the values. Q from frequency sweeps calibrated by an unbalanced MZI (674 / 802 nm) or by sidebands (461 / 698 nm), p.4-5. Loss from Q_i and the test-structure kappa^2 with a group index that is not printed (supplement not cached): author_estimate (D76). Bend design: < 1e-4 dB/cm bend contribution for R > 0.33 mm (blue), > 2.3 mm (red), > 5.5 mm (802 nm), simulated design statement, not entered. Mode area / confinement (Fig. 2) simulated, no parameter. Fab borderline (D84b; isichenko2023 / puckett2021 precedent): the acknowledgment (p.8) thanks named Honeywell staff for help with upper-cladding deposition and annealing of devices. The text says the waveguides are fabricated with a wafer-scale CMOS-compatible LPCVD Si3N4 core process (p.3, passive) and ''we designed and fabricated resonators'' for 674 / 802 nm (p.3, first person), but the author list spans UCSB and Honeywell, so that sentence names no single org (rule 12, D80b, D395): UCSB not entered. No facility named.'
    why: 'Notes miss the p.3 first-person sentence ''At the other wavelengths, we designed and fabricated resonators with 8.9 mm radius for 674 nm, and 10 mm radius for 802 nm''; fab unchanged (authors at UCSB and Honeywell: no single org, rule 12 / D395; Honeywell kept on the p.8 staff thanks, D84b)'
  cmp_lit_chauhan2022_ring_r8p9mm_674:
    notes: 'All-pass ring designed for 674 nm (critically coupled design (p.4); quasi-single TE mode at 2.3 um (p.3)); polarization of the measurement not stated with the values. Photothermal absorption measurement on this ring (p.6, Fig. 5): resonance redshift 5.4 MHz/mW of on-chip (bus) power (Fig. 5(b) fit) and 38.0 MHz/mW of absorbed power (with the simulated Rth 9.72 K/W): no parameter for an optical-power-induced shift (tuning_efficiency is per mW of heater / electrical input), not entered. Absorption-limited Q about 340 million not entered (hypothetical limit, puckett2021 precedent). Q from frequency sweeps calibrated by an unbalanced MZI (674 / 802 nm) or by sidebands (461 / 698 nm), p.4-5. Loss from Q_i and the test-structure kappa^2 with a group index that is not printed (supplement not cached): author_estimate (D76). Bend design: < 1e-4 dB/cm bend contribution for R > 0.33 mm (blue), > 2.3 mm (red), > 5.5 mm (802 nm), simulated design statement, not entered. Mode area / confinement (Fig. 2) simulated, no parameter. Fab borderline (D84b; isichenko2023 / puckett2021 precedent): the acknowledgment (p.8) thanks named Honeywell staff for help with upper-cladding deposition and annealing of devices. The text says the waveguides are fabricated with a wafer-scale CMOS-compatible LPCVD Si3N4 core process (p.3, passive) and ''we designed and fabricated resonators'' for 674 / 802 nm (p.3, first person), but the author list spans UCSB and Honeywell, so that sentence names no single org (rule 12, D80b, D395): UCSB not entered. No facility named.'
    why: 'Notes miss the p.3 first-person sentence ''At the other wavelengths, we designed and fabricated resonators with 8.9 mm radius for 674 nm, and 10 mm radius for 802 nm''; fab unchanged (authors at UCSB and Honeywell: no single org, rule 12 / D395; Honeywell kept on the p.8 staff thanks, D84b)'
  cmp_lit_chauhan2022_ring_r9p4mm_698:
    notes: 'All-pass ring designed for 698 nm (under-coupled design (p.4); quasi-single TE mode at 2.3 um (p.3)); polarization of the measurement not stated with the values. 2 m coils: the 0.03 dB/cm at 698 nm (p.6) and 0.08 dB/cm at 450 nm (p.6, sentence cites ref. [28]) are not entered: p.2 attributes the coil losses (''losses from 2 m coils [28]'') to the authors'' CLEO 2020 paper [28], whose title names both wavelengths (D259 / D408, judgment call, report). Q from frequency sweeps calibrated by an unbalanced MZI (674 / 802 nm) or by sidebands (461 / 698 nm), p.4-5. Loss from Q_i and the test-structure kappa^2 with a group index that is not printed (supplement not cached): author_estimate (D76). Bend design: < 1e-4 dB/cm bend contribution for R > 0.33 mm (blue), > 2.3 mm (red), > 5.5 mm (802 nm), simulated design statement, not entered. Mode area / confinement (Fig. 2) simulated, no parameter. Fab borderline (D84b; isichenko2023 / puckett2021 precedent): the acknowledgment (p.8) thanks named Honeywell staff for help with upper-cladding deposition and annealing of devices. The text says the waveguides are fabricated with a wafer-scale CMOS-compatible LPCVD Si3N4 core process (p.3, passive) and ''we designed and fabricated resonators'' for 674 / 802 nm (p.3, first person), but the author list spans UCSB and Honeywell, so that sentence names no single org (rule 12, D80b, D395): UCSB not entered. No facility named.'
    why: 'Notes miss the p.3 first-person sentence ''At the other wavelengths, we designed and fabricated resonators with 8.9 mm radius for 674 nm, and 10 mm radius for 802 nm''; fab unchanged (authors at UCSB and Honeywell: no single org, rule 12 / D395; Honeywell kept on the p.8 staff thanks, D84b)'
  cmp_lit_chauhan2022_ring_r10mm_802:
    notes: 'All-pass ring designed for 802 nm (over-coupled design (p.3); single mode at 2.3 um (p.3)); polarization of the measurement not stated with the values. A particle near the waveguide is visible on the ring (Fig. 4(e)); the authors attribute part of the 802 nm loss to it (p.6). Q from frequency sweeps calibrated by an unbalanced MZI (674 / 802 nm) or by sidebands (461 / 698 nm), p.4-5. Loss from Q_i and the test-structure kappa^2 with a group index that is not printed (supplement not cached): author_estimate (D76). Bend design: < 1e-4 dB/cm bend contribution for R > 0.33 mm (blue), > 2.3 mm (red), > 5.5 mm (802 nm), simulated design statement, not entered. Mode area / confinement (Fig. 2) simulated, no parameter. Fab borderline (D84b; isichenko2023 / puckett2021 precedent): the acknowledgment (p.8) thanks named Honeywell staff for help with upper-cladding deposition and annealing of devices. The text says the waveguides are fabricated with a wafer-scale CMOS-compatible LPCVD Si3N4 core process (p.3, passive) and ''we designed and fabricated resonators'' for 674 / 802 nm (p.3, first person), but the author list spans UCSB and Honeywell, so that sentence names no single org (rule 12, D80b, D395): UCSB not entered. No facility named.'
