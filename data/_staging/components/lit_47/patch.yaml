  cmp_lit_tossoun2024_memresonator_ring:
    notes: 'Ring of the memresonator (phase-shifter row memresonator_ps, D396). Resonance fit with a Lorentzian (Supp. S2, Fig. S1 near 1323.6 nm). Consistency flag (audit 2026-10-29): at 1323.6 nm, FSR 2.808 nm implies a group index of about 9.9 for a 10 um radius (20 um diameter, as printed on p.14 and p.23 and used in the Supp. S5 L_pi arithmetic), about 5.0 for 20 um and about 4.0 for 25 um; the broadband spectrum of ''the memresonator'' (Fig. S5, p.40) shows a resonance spacing of about 3.6-3.7 nm (read off, +/- 0.1 nm), i.e. a group index of about 7.6 for 10 um and 3.8 for 20 um radius. Fig. S2 (p.35) shows measured rings of 10 / 20 / 25 um radius. The paper attributes the S2 values (Q, FSR, FWHM, finesse, extinction) to the memresonator; entered as attributed. Extinction ratio printed as 27.55 with the definition Tmax / Tmin (p.32): entered as 14.4 dB (derived). Hewlett Packard Labs (all authors); no explicit fabrication statement (passive ''were fabricated'', p.5), so fab_org_ids empty (contract v4). Measured device: microring with a 20 um diameter (Methods p.23); MRRs with radii 10-25 um were fabricated (p.5). Grating couplers ~6 dB each (row gc). Not an EO-atlas device (memory phase shifter; the cited 28 GHz bandwidth of similar III-V/Si MOS ring modulators is ref. [22, 26, 45, 46], not entered). Open licence (CC BY 4.0).'
    why: 'p.32 Supp. S2, p.35 Fig. S2, p.40 Fig. S5 (render read): note quantified; Fig. S5 spacing is about 3.6-3.7 nm, not 3.5 nm; extinction miss added below'
