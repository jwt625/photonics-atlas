# Audit patch lit_47 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_47-audit.md).
# 99 metrics: 90 ok / 2 imprecise / 7 wrong (2 adya2024 rib width = p+ slab label, 5 tamura2026 before-PCM extinction D159);
# 16 components: 8 changed (notes) / 0 deleted; 3 misses added. After the patch: 16 components, 95 metrics.
# Not covered here (coordinator / registry): Washington Nanofabrication Facility (adya2024) and Core Facility Platform of
# Electronics, ShanghaiTech University (chang2026a) orgs; registry gaps listed in the audit file.
components:
  cmp_lit_adya2024_gst_pin_8um_10nm:
    notes: 'First device iteration. RESET 10 V / 500 ns (108.35 nJ), SET 4.5 V / 60 us with 36 us falling edge (4.07e3 nJ) (p.5; no switching-energy parameter). Si wafers from the AMF commercial process through the CMC Microsystems MPW service (acknowledgements p.10); the authors post-processed the dies (lift-off, GST sputtering, ALD capping; p.3-4; all authors University of Washington), hence fab AMF + CMC + UW. Post-processing performed at the Washington Nanofabrication Facility (p.3, p.10; not in registry, facility left empty). Amplitude-only GST switch kept as phase_shifter.phase_change (D155). PIN heater effective resistance 256 ohm from the linear I-V section of ''the PIN micro-heater'' (p.5 Fig. 4(a)) not entered: the measured device is not identified among the variants (D159). SEM of an 8 um opening: 1.5 um wide x 7 um long vs 2 um x 8 um design (p.4-5 Fig. 3(d)), sample not identified, not entered. Simulated GST-loaded waveguide loss 0.03 dB/um (a-GST) / 3.32 dB/um (c-GST) for 10 nm GST (p.3 Fig. 1(b)) not entered (no per-length phase-shifter loss parameter, D250). Metal / vias kept >= 5 um from the oxide opening (p.2-3). Rib waveguide width not stated: the 500 nm dimension arrow in the Fig. 1(b) cross-section (p.3) spans the lightly doped p+ slab between the rib edge and the p++ region, and the other two 500 nm labels are scale bars of the mode plots (audit 2026-10-29).'
    why: 'p.3 Fig. 1(b) render: the 500 nm arrow sits beside the rib over the p+ slab, not across the rib; width_nm rows removed below, fact recorded in notes'
  cmp_lit_adya2024_gst_pin_8um_12p5nm:
    notes: 'Second device iteration (thicker GST to offset plasma-ALD thinning, p.5). RESET 12 V / 350 ns (103 nJ), SET 4.5 V / 50 us with 30 us falling edge (3.38e3 nJ) (p.5-6; no switching-energy parameter). Amorphization transmission response 1 us, total ~1.5 us; crystallization: minimum within 5 us, total switching time ~80 us dominated by the ~50 us pulse (p.6-7 Fig. 5); no switching-time parameter (rise_time_us is 10-90 %). Si wafers from the AMF commercial process through the CMC Microsystems MPW service (acknowledgements p.10); the authors post-processed the dies (lift-off, GST sputtering, ALD capping; p.3-4; all authors University of Washington), hence fab AMF + CMC + UW. Post-processing performed at the Washington Nanofabrication Facility (p.3, p.10; not in registry, facility left empty). Amplitude-only GST switch kept as phase_shifter.phase_change (D155). PIN heater effective resistance 256 ohm from the linear I-V section of ''the PIN micro-heater'' (p.5 Fig. 4(a)) not entered: the measured device is not identified among the variants (D159). SEM of an 8 um opening: 1.5 um wide x 7 um long vs 2 um x 8 um design (p.4-5 Fig. 3(d)), sample not identified, not entered. Simulated GST-loaded waveguide loss 0.03 dB/um (a-GST) / 3.32 dB/um (c-GST) for 10 nm GST (p.3 Fig. 1(b)) not entered (no per-length phase-shifter loss parameter, D250). Metal / vias kept >= 5 um from the oxide opening (p.2-3). Rib waveguide width not stated: the 500 nm dimension arrow in the Fig. 1(b) cross-section (p.3) spans the lightly doped p+ slab between the rib edge and the p++ region, and the other two 500 nm labels are scale bars of the mode plots (audit 2026-10-29).'
    why: 'p.3 Fig. 1(b) render: the 500 nm arrow sits beside the rib over the p+ slab, not across the rib; width_nm rows removed below, fact recorded in notes'
  cmp_lit_tamura2026_sb2se3_ring1:
    notes: 'One of five series-coupled rings (microring weight bank) on an AMF chip (''fabricated by Advanced Micro Foundry'', p.9 Sec. 4.1), cladded with ~29.12 nm sputtered Sb2Se3 (30 nm in the Fig. 1 caption) + 10 nm SiO2 covering only the rings, deep trenches between rings (p.3, p.9); who sputtered the PCM is not stated. CMC Microsystems acknowledged for ''products and services'' (FABrIC, p.10): not entered as fab org (no fabrication statement). Fiber array glued over C-band grating couplers (8 deg from vertical) for cryostat operation (p.9). Extinction from Table 2 (p.5); its ''Before PCM deposition 300K'' row (ring 1: 24.99 dB) is not entered (D159): the rings were made on two separate PICs, one left as bare uncladded Si rings and one sputtered with Sb2Se3 (p.9 Sec. 4.1), and the paper does not say whether that row is the bare-Si chip or this chip before sputtering; Q factors only plotted (Fig. 7, p.8) and ''no clear trend'', not entered. Room-temperature Delta n_eff amorphous -> crystalline after the 200 C hotplate anneal (Table 1, p.4) not entered (no parameter); cryogenic n_eff reproducible within 0.0010 (amorphous) / 0.0023 (crystalline) over 3 thermal cycles (p.2). FEMWELL cross-section 500 x 220 nm rib, 90 nm slab, 3 um BOX (p.15 Fig. S2) is a simulation geometry, not entered. Ring model: symmetric add-drop through-port (p.9 Eq. 1). Material dn/dT of Sb2Se3 (~1e-3 /K at 300 K to <1e-5 /K at 4 K, p.2) is a material property, not entered. Non-uniform PCM coverage visible on Rings 1 and 5 (p.3 Fig. 1(c)); Ring 5 prone to warm-up variation (p.4).'
    why: 'p.5 Table 2 vs p.9 Sec. 4.1 (two separate PICs with identical rings, bare and Sb2Se3-cladded): sample identity of the before-deposition row ambiguous; value moved to notes (D159), metric deleted below'
