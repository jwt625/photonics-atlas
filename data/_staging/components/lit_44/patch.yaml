    component_id: cmp_lit_shoaa2025_polysi_taper
    parameter: layer2_thickness_nm
    value: 20
    unit: nm
    condition: intrinsic PECVD poly-Si taper layer above the SiN strip
    basis: design_target
    locator: p.3 Sec. 2.1
    notes: 'deposited to taper the PCM layer (p.3); thickness as deposited, not measured'
    why: 'miss (D153 geometry): p.3 Sec. 2.1 names the 20 nm intrinsic poly-Si layer as the taper layer; layer2_thickness_nm allowed for waveguide_platform'
