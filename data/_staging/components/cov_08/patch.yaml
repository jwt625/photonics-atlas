# Audit patch cov_08 (fresh-context audit 2026-11-07, DevLog/audits/2026-11-07-cov_08-audit.md).
# 143 metrics: 128 ok / 10 imprecise / 5 wrong (1 deleted); 26 components: 23 ok / 3 imprecise / 0 wrong.
# Misses: 1 (wang2025a 6.5 dB fibre-to-fibre loss, added as m7; depends on coordinator question 2).
# Coordinator choices: to keep the distiller's call on question 2, drop the add_metrics op and the
# cmp_lit_wang2025a_flat_top_comb notes op. The D167 basis ops (facet / interface rows, ling2024 m11) follow D167.
components:
  cmp_lit_zhang2019b_racetrack_10ghz:
    notes: 'Fab: M.Z., C.W. and A.S.-A. designed and fabricated the devices (p.5 Author contributions); Harvard is the one org common to the three fabricators, and device fabrication was performed at the Harvard CNS (p.5 Acknowledgements) (D395, D452). Wafer: x-cut TFLN from NANOLN (supplier note). M.Z., C.W., C.R. and M.L. declare involvement with HyperLight (competing interests), not a fabrication statement. Same device as cmp_lit_zhang2019b_eo_comb_10ghz (D396). Gold electrodes 3.3 um from the resonator edge (p.2; no resonator parameter). Internal round-trip transmission coefficient alpha = 0.95 from the all-pass fit (p.6 Methods; the model defines the round-trip intrinsic power loss as 1 - alpha, so alpha is a power transmission): no parameter; the racetrack length is not printed to convert it. The 25 GHz FSR ring in Fig. 2(a) is an illustration only (no values). Ring-bus gap not printed.'
    why: 'p.6 Methods (canonical design paragraph) defines the round-trip intrinsic power loss as 1 - alpha; the old note called alpha a field transmission'
  cmp_lit_wang2025a_flat_top_comb:
    notes: 'Fab: passive ''fabricated at wafer scale'' statement (p.2-3), no org named (D80b); authors at Sun Yat-sen University and Liobate Technology. Wafer: x-cut TFLN from NANOLN (supplier note). Garbled text layer only on p.9 (references); Table 1 read from the p.8 render. Modulator values (RF Vpi 3 V at 25 GHz, 3.35 V at 35 GHz, 2 V DC, EO bandwidth > 67 GHz / 35 GHz packaged, MZM extinction > 50 dB) stay out (rule 2). The 6.5 dB fibre-to-fibre loss of the packaged comb generator is entered as m7 (comb-source total, audit question 2); its loss-budget terms are on cmp_lit_wang2025a_edge_coupler and cmp_lit_wang2025a_rib_waveguide. Span 29.41 nm: no parameter. The 10 dB window is the counting criterion, not a result. Pump tuning 1480-1640 nm (p.7; Fig. 7 1500-1625 nm) is laser tuning, not entered. Simulated 157 / 151 / 99 lines vs RF phase error: not entered (sensitivity study).'
    why: 'Follows the m7 add (question 2): the old note said the 6.5 dB stays out'
  cmp_lit_zhang2024c_il_dfb_amplifier:
    notes: 'Platform left empty (D422). Free-running slave power around 21 dBm (p.4). Six slave DFB chips tuned by temperature amplify the 34 comb lines one at a time (p.7 Methods); each injection-locked DFB amplifies one line, so no channel count is entered on this row (audit). Noise-floor increment ~0 dB vs 4.7 dB (EDFA) and 11.2 dB (SOA) at 20 dB gain (Fig. 2(i)): not a noise figure (not entered). OSNR > 70 dB: no parameter.'
    why: 'Follows the m4 delete: the 34 channels are a system count over six sequentially tuned DFB chips (p.7 Methods), not a property of one amplifier'
