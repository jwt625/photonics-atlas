# Audit patch lit_143 (fresh-context audit 2026-11-15, DevLog/audits/2026-11-15-lit_143-audit.md).
# 141 metrics: 116 ok / 25 imprecise / 0 wrong; 29 components: 17 ok / 12 imprecise / 0 wrong; 0 deleted; 3 misses added.
# Coordinator rulings open (audit Q1-Q5): Q1 martinez2016 reference p-i-n kept under D408 (note only; to drop, delete
# cmp_lit_martinez2016_ge_pin_ref); Q2 chatterjee2019 0.76 fF / 416 ohm stay in notes (no op); Q3 zhong2021 3.33 mW stays
# tuning_power_mw (note fix only); Q4 lin2022a process_name emptied (to keep the printed wording, drop the 11 process_name ops);
# Q5 martinez2016 breakdown condition / wavelength (applied).
components:
  cmp_lit_martinez2016_ge_pin_ref:
    notes: 'Fab: authors at Sandia National Laboratories; the paper places the device ''within our Si photonics process''
      (p.9), based on ''our selective epitaxial Ge on Si growth process'' (p.3), with implants calibrated ''at our CMOS facility''
      (p.5) and reports device ''manufacture'' (p.4) -> org_sandia_national_laboratories (D84a own-process statement). No
      named process. Structure (p.5, Fig. 1): selective epitaxial Ge on a p-implanted Si charge layer (110 keV BF2, 2-6e12
      cm-2, target 1-2e17 cm-3), lateral intrinsic Si multiplication region of width Wmulti, symmetric N+ Si contacts with
      W vias, P+ Ge top contact (BF2, 1e19 cm-3) with Ti/TiN liner; light end-fire coupled from a Si waveguide; Ge under 0.25
      % tensile strain (p.6). Ge / Si dimensions not stated. Measurement (p.6-7): 1510 nm illumination, 1.34 uW incident on
      the APD, calibrated from straight-waveguide transmission including grating coupling and waveguide loss; Vbr defined
      at a 0.2 mA compliance current; gain from Eq. (2) with the measured 0.8 A/W Ge p-i-n responsivity as unity gain. Reference
      device: the APD structure follows the authors'' earlier p-i-n (ref. 6) with different implants; the reference p-i-n''s
      own responsivity and QE are called measured in this paper (p.6-7, p.9) with no citation in the value sentences (D80i);
      length and wafer of the reference device not stated. Audit cross-note: 0.8 A/W is also the headline responsivity of
      the authors'' ref. 6 (lit:derose2011, already in the atlas); this paper''s value sentences call it the measured responsivity
      of a reference p-i-n used for calibration (p.7, p.9) and cite nothing, so it stays under D408 (coordinator question
      in the lit_143 audit).'
    why: 'p.4-p.7, p.9: the p-i-n design is the authors'' ref. 6 and the value equals that paper''s headline; the row note
      did not say so'
  cmp_lit_lin2022a_pin_50:
    process_name: ''
    why: 'p.1 / p.5 Methods: the paper names no process or PDK, only ''a foundry-fabricated visible spectrum PIC platform
      fabricated on 200-mm Si wafers'' at AMF; Contract v7 keeps process_name for a named process, and the merged rows of
      the same AMF visible platform (lin2021, yong2021, mu2026, xu2022a, zhang2021a) leave it empty'
