- metric_id: cmp_lit_chatterjee2019_pd_200nm_design-m3
  component_id: cmp_lit_chatterjee2019_pd_200nm_design
  parameter: absorber_width_um
  value: '0.2'
  unit: um
  condition: intrinsic width of the simulated pin (same convention as the 4 um of the fabricated rows)
  basis: derived
  locator: p.2 text
  notes: printed 'intrinsic width of 200 nm', nm -> um (D157); design value of the simulation
  why: 'Miss (D153 geometry): the defining dimension of the design row (p.2: ''intrinsic width of 200 nm for 15 um long pin'')
    was only in the label'
- metric_id: cmp_lit_zhong2021_mzi_doped_heater-m13
  component_id: cmp_lit_zhong2021_mzi_doped_heater
  parameter: heater_width_um
  value: '1.5'
  unit: um
  condition: width of the lightly p-doped (heating) region centred on the rib; p++ regions 0.45 um from the waveguide edges
  basis: design_target
  locator: p.2 Sec. 2; p.3 Fig. 1(a)
  notes: '''lightly doped areas are 1.5-um-wide'' (p.2), labelled 1.5 um in Fig. 1(a); same cross-section in the ring heater'
  why: 'Miss (D153 geometry): p.2 Sec. 2 and Fig. 1(a) state the doped heater width; the row held the rib geometry only'
- metric_id: cmp_lit_lin2022a_racetrack_r28-m4
