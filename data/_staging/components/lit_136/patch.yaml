components:
  cmp_lit_bonneville2020_edwa_film3_3cm:
    notes: 'Fab: first-person deposition, patterning and ''we designed and fabricated single mode waveguides and ring resonator structures'' (p.2-5), all four authors at McMaster University -> fab McMaster University, which is missing from the registry (report; fab_org_ids left empty until the org round). Acknowledgement (p.10) thanks two CEDT staff for assistance with fabrication (staff thanks: not a facility, D84b). RBS of calibration films at Western University''s Tandetron facility (p.3) is a characterization facility for the films, not entered. Internal net gain uses the Film 3 waveguide loss estimate 0.5 +/- 0.3 dB/cm (between the film background loss and the Film 2 ring upper limit, p.9) and the estimated -4.5 dB coupling loss per facet for the launched powers (p.8): gain rows author_estimate. No gain saturation observed (pump power limited, p.9). Net internal gain stays positive up to about -8.5 dBm launched 1533 nm signal at 190 mW launched pump (p.9, Fig. 5(c) inset; launched power rests on the estimated facet loss); the paper does not call this a saturation power, so it is not entered as psat_in_dbm (audit 2026-11-15). Single-mode design: simulated minimum bend radius about 2.4 mm (p.5, not entered).'
    why: 'carries the -8.5 dBm statement after deleting m5 (p.9 Sec. 3.3)'
