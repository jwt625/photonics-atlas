# Audit patch lit_115 (fresh-context audit 2026-11-08, DevLog/audits/2026-11-08-lit_115-audit.md).
# 139 metrics: 131 ok / 8 imprecise / 0 wrong; 20 components: 14 ok / 6 imprecise / 0 wrong, 0 deleted; 2 misses added.
# Coordinator rulings open: to keep velha2016 building-block values measured drop the five velha2016 basis ops and the
# component note sentence (Q1); to keep the paraphrased process_name drop it from the six velha2016 component ops (Q2).
components:
  cmp_lit_velha2016_pol_controller:
    process_name: 'IMEC multi-project wafer run, photonic design kit (ref. 11: Europractice MPW, imec ISIPP25G)'
    notes: 'Fab org_imec: ''manufactured by IMEC in a multi-project wafer run'' (p.2); grating couplers, MMIs and Ge photodetectors
      taken from the photonic design kit (p.2). Platform empty: the paper says Si photonics / Si waveguide but never states
      SOI or a BOX (D422 / D423). Building-block values (GC, MMI, Ge PD) were ''determined'' (p.2) in the sentence right after
      the statement that these blocks were taken from the photonic design kit; no measurement, spectrum, test-structure result
      or method is shown, so they are author_estimate (origin not stated; rule 4, D44, D418 nader2025). Ref. 11, cited in
      the fabrication sentence, is the Europractice MPW page for the imec ISIPP25G technology (p.4 references): Europractice
      is not in the registry (MPW access, fab role; audit report). Closed loop: TPS voltages swept until the Ge monitor photocurrent
      falls below 70 nA at 1 V reverse bias (p.3). Four 200 GHz-spaced WDM channels after 10 km SMF-28 compensated within
      1 dB spectral uniformity (p.4; power_uniformity_db not allowed for polarization). Also run as a polarization controller
      (Fig. 4 trajectories, no number) and proposed as a scrambler.'
    why: 'p.2 fabrication sentence cites ref. 11, which p.4 lists as the Europractice multi project wafer page for imec ISIPP25G:
      process_name as printed (Contract v7) instead of a paraphrase; building-block basis note follows the metric fixes (audit
      Q1, Q2)'
