metrics:
  cmp_lit_velha2016_2dgc-m1:
    basis: author_estimate
    notes: 'printed 9.7 dB insertion loss at 1550 nm for the 2DGC (given as the coupling efficiency); origin not stated: the
      building-block values ''were determined'' (p.2) in the sentence right after the statement that the GCs, MMIs and Ge
      PDs were taken from the photonic design kit; no measurement or method is shown, so they may be design-kit values (audit
      Q1)'
    why: 'p.2: GCs, MMIs and Ge PDs ''were taken from the photonic design kit'', then ''the performances of the individual
      building blocks were determined'' with no data, figure, test structure or method; whether these are this chip''s measurements
      or design-kit values cannot be decided from the paper, so measured is not supported (rule 4 / D44: unstated origin ->
      author_estimate; D418 nader2025). Audit Q1'
