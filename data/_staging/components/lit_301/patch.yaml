metrics:
  cmp_lit_herr2012_sin_ring_76ghz-m1:
    notes: 'unqualified width (loaded vs intrinsic not stated), stored as linewidth_mhz per its definition; band inferred: setup with CW pump laser + EDFA (p.2 refers to Fig. 3(g)) and the Fig. 1(a) spectrum centred near 1550 nm; no wavelength printed with the value; the p.2 citation [24] (Levy et al., Nature Photonics 2010) attaches to the platform name in parallel with ''MgF2 resonators [19-21]'', not to the width; the Fig. 1 caption restates 200 MHz for this resonator without a reference, and the SiN samples were fabricated at CMI-EPFL (p.9), so the value is this paper''s own (D259 / D408 test)'
    why: 'p.2 Sec. II, p.3 Fig. 1 caption, p.14 ref. [24]: attribution check of the width (coordinator judgment a); note supplement, row ok'
  cmp_lit_ye2023a_antenna-m1:
    notes: 'Fig. 5(b) plots the simulated curve with the axis labelled ''Directionality (dB)'' (about -1.5 dB near 1545-1550 nm); the text calls the 1.487 dB value emission loss, i.e. the upward share of the emitted power'
    why: 'p.5 Fig. 5(b) (embedded image read): axis title records what the 1.487 dB is; note supplement, row ok'
  cmp_lit_ye2023a_antenna-m2:
    notes: budget term, origin not stated; operating wavelength set to 1550 nm (p.5); the measurement wavelength of this value is not stated; the four printed terms sum exactly to the printed total (2.5 + 0.36 + 0.2 + 9.6 = 12.66 dB), so this term may be the remainder of the measured total; the side-lobe share is an array property entered on the element row (zhou2023b / poulton2016 budget-term precedent)
    why: 'p.7 Sec. 3.1: arithmetic check of the budget (coordinator judgment b); supports author_estimate; note supplement, row ok'
  cmp_lit_ye2023a_antenna-m3:
    condition: period of the Si grating reflector below the SiN antenna (p.6 text); the SiN emitting grating has the same 1200 nm period (m6, Fig. 5(a) label)
    why: 'p.5 Fig. 5(a): the old condition ''(not the SiN emitting grating)'' implied a different or unknown SiN period; the figure labels the same 1200 nm period on the SiN teeth'
