  notes: deposited film thickness as stated (D402)
  verified_on: '2026-11-27'
  why: 'miss (D153): core thickness is a required cross-section dimension of the edge_taper template and is stated (400 nm SiN layer, p.7); entered on the transition (m9) and antenna (m5) rows but not here'
- metric_id: cmp_lit_ye2023a_sin_mmi_1x2-m4
  component_id: cmp_lit_ye2023a_sin_mmi_1x2
  parameter: core_thickness_nm
