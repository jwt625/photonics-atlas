  verified_on: '2026-11-27'
  why: 'miss (D153): core thickness is a required cross-section dimension of the mmi template and is stated (400 nm SiN layer, p.7)'
- metric_id: cmp_lit_xiang2022a_dfb_8um_800um-m24
  component_id: cmp_lit_xiang2022a_dfb_8um_800um
  parameter: center_wavelength_nm
  value: '1560.5'
  unit: nm
  qualifier: approx
  temperature_k: '293.15'
  condition: lasing wavelength at 300 mA, 20 C chip temperature
  basis: extracted_from_figure
  locator: p.7 Fig. 7(b)
  notes: 'Read off the Fig. 7(b) wavelength trace (right axis 1555-1570 nm) at 20 C; reading uncertainty about +/-0.3 nm. Validation: the same read gives about 1556.7 nm at -10 C and 1565.3 nm at 60 C, i.e. the printed 8.6 nm span; Fig. 7(a) T = 20 C peak near 1560.5 nm agrees. Text states only ''around 1550 nm'' (p.2)'
  verified_on: '2026-11-27'
  why: 'miss: the lasing wavelength of the main DFB is plotted (Fig. 7(b), lasing wavelengths vs temperature) but not entered; figure read validated on the printed 8.6 nm tuning span (DFB precedents aihara2026, chen2002)'
