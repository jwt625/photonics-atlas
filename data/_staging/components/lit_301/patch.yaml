- metric_id: cmp_lit_ye2023a_antenna-m6
  component_id: cmp_lit_ye2023a_antenna
  parameter: period_nm
  value: '1200'
  unit: nm
  condition: period of the fully etched SiN emitting grating (upper layer)
  basis: extracted_from_figure
  locator: p.5 Fig. 5(a)
  notes: 'Figure label ''1200nm'' between the left edges of two adjacent SiN teeth (SiN green per the Fig. 1 legend); printed label, no reading uncertainty; same period as the Si reflector (m3)'
  verified_on: '2026-11-27'
  why: 'miss (D153 / Contract v5): the grating-emitter period is labelled in Fig. 5(a); the component note said it was not stated'
- metric_id: cmp_lit_ye2023a_antenna-m7
  component_id: cmp_lit_ye2023a_antenna
  parameter: fill_factor
  value: '0.5'
  unit: '1'
  condition: SiN emitting grating (upper layer)
  basis: derived
  locator: p.5 Fig. 5(a)
  notes: '600 nm SiN tooth / 1200 nm period, both figure labels (tooth = unetched SiN, D253)'
  verified_on: '2026-11-27'
  why: 'miss (D153): SiN tooth width and period are labelled in Fig. 5(a); fill factor = tooth / period'
