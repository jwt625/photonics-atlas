# Audit patch lit_301 (fresh-context audit 2026-11-27, DevLog/audits/2026-11-27-lit_301-audit.md).
# 117 metrics: 116 ok / 1 imprecise / 0 wrong; 27 components: 26 ok / 1 imprecise / 0 wrong. 5 misses added.
# After the patch: 27 components, 122 metrics.
# Fixes: ye2023a antenna note said the SiN emitting-grating period and duty are not stated; Fig. 5(a) labels them
# (1200 nm period, 600 nm teeth on the SiN layer, colours as the Fig. 1 legend), m3 condition clarified.
# Misses: ye2023a SiN grating period (m6) and fill factor (m7); ye2023a 400 nm SiN core thickness on the edge coupler and
# the MMI (D153, edge_taper / mmi templates); xiang2022a lasing wavelength about 1560.5 nm at 20 C, 300 mA (Fig. 7(b)).
# Note supplements on ok rows: herr2012 200 MHz width (ref. [24] attaches to the platform name); ye2023a budget terms
# sum exactly to the 12.66 dB total; ye2023a Fig. 5(b) axis reads Directionality; ashtiani2019 DC ratio-pair reading.
components:
  cmp_lit_ye2023a_antenna:
    notes: 'Fab empty: ''The chip is fabricated on SOI wafer'' with 248 nm DUV lithography and ICP etching (p.7) is passive with no org named (D80b, D433); authors at China University of Geosciences and HUST WNLO. Element of cmp_lit_ye2023a_opa_64ch (64 units). Si reflector dual-layer offset 0.83 um (p.6; no registry parameter). SiN emitting grating: Fig. 5(a) labels a 1200 nm period and 600 nm teeth on the upper (SiN) layer and 600 nm teeth on the Si reflector (colours as the Fig. 1 legend: SiN green, Si blue), so both gratings share the 1.2 um period and 0.5 duty (m3 / m4 Si reflector from the text, m6 / m7 SiN grating from the figure labels). Antenna length not stated.'
    why: 'p.5 Fig. 5(a) (embedded image read, Fig. 1 legend for the layer colours): the ''1200nm'' label spans the left edges of two adjacent SiN teeth and a ''600nm'' label spans one SiN tooth, so the SiN grating period and duty are stated by figure labels; the note said they were not stated'
  cmp_lit_ashtiani2019_dc1:
    notes: 'Fab org_astar_ime: ''fabricated in the IME 180 nm silicon-on-insulator (SOI) photonic process'' (p.4; Fig. 3 caption; Contract v7 named-process sentence, aflatouni2015 precedent). One of 7 sibling couplers per row / column of cmp_lit_ashtiani2019_opa_8x8, lengths and etch levels optimized for equal element power (p.6, Fig. 4(c) FDTD table). Ratio pair a/b printed without port labels; read as through / coupled from the p.6 order ''transmission and the coupling coefficients'' (the second number grows with length). Audit check of the reading (D156): the pair sums are 86-89 % (simulated excess about 11-14 %), the second number rises 5 -> 43 % along the row as an equal-power tap must (the last coupler near an even split, 46 / 43), and the reverse reading would send 81 % of the row power into the first element against the equal-power design (p.2, p.4 Sec. 3); the order matches the p.6 wording, so the tie is unambiguous.'
    why: 'p.5 Fig. 4(c) render (embedded image): table values confirmed; note supplement recording why the unlabeled ratio pair is tied to through / coupled ports (judgment d, keep; row ok)'
