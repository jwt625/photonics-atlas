    why: 'p.3 Fig. 6 (img_p03_2): the printed -2.5 dB is the maximum of the highest of three measured apodized traces near 1562 nm; a figure-read peak wavelength replaces the C-band inference (lit_265 ruiz2021 precedent)'
  cmp_lit_xu2017d_uniform_sin_on_soi_gc-m1:
    wavelength_nm: '1553'
    wavelength_inferred: 'true'
    band: ''
    statistic: best
    notes: 'Printed ''peak coupling coefficient of -3.6 dB'' (sign as printed); de-embedding not described. Peak wavelength not printed: Fig. 6 shows three measured uniform traces; the highest peaks about -3.7 dB (+/-0.05 dB) near 1553 nm (+/-2 nm), the others about -4.1 and -4.4 dB (img_p03_2; wavelength read off the plot). The Fig. 6 caption says the best testing results are shown.'
    why: 'p.3 Fig. 6 (img_p03_2) and caption: -3.6 dB is the best of three measured uniform traces (as the apodized -2.5 dB ''best''), at a figure-read peak near 1553 nm'
