# Audit patch lit_273 (fresh-context audit 2026-11-24, DevLog/audits/2026-11-24-lit_273-audit.md).
# 139 metrics: 133 ok / 6 imprecise / 0 wrong; 19 components: 17 ok / 2 imprecise (notes). 18 misses added
# (geometry / design-fiber rows, D153 / D625; no performance value missed).
# Fixes: figure-page locators (tokushima2016 Fig. 8 p.8, zhao2015 Fig. 6 p.3, subramanian2012a Fig. 4 p.3); xu2017d
# measured peaks at the Fig. 6 figure-read wavelengths, uniform -3.6 dB statistic best (best of three traces);
# subramanian2012a abstract note (values swapped, not unmatched); zhao2015 strip width note.
components:
  cmp_lit_subramanian2012a_lgc_70nm:
    notes: 'Fab borderline (D84b, golshani2021 / doerr2010 precedent): the acknowledgment thanks IMEC''s p-line and a named staff member ''for the fabrication of the Si3N4 waveguides'' (p.4); the process text is passive (p.2); one author at IMEC, the others at Ghent University: fab org_imec kept with this note. Waveguides and GCs were patterned in the same 193 nm lithography / RIE flow (p.2). Cladding of the GC samples not stated (some wafers got 1.5 um PECVD SiO2, p.2). Paper prints a per-GC efficiency ''determined from the fibre-to-fibre transmission'' (p.2) without the arithmetic or the handling of the connecting waveguide (4 mm LGC / 6 mm FGC at about 3 dB/cm): loopback_half, basis measured (D452 lorenzen2026 / D167). Input light unpolarized while the GC is designed for TE (p.1-2). Abstract prints ''efficiency of 5.7 and 6.5 dB and 1-dB bandwidth of 26 and 40 nm'' for the linear and focused GCs respectively: the two efficiencies are the Table I FGC 120 nm (-5.7 dB) and LGC 70 nm (-6.5 dB) values in swapped order, and 26 / 40 nm match no printed bandwidth; Table I / Sec. IV values entered (D417).'
    why: 'p.1 Abstract vs p.3 Table I: -5.7 dB is the FGC 120 nm value and -6.5 dB the LGC 70 nm value, printed in swapped order (''linear and focused ... respectively''); only the 26 / 40 nm bandwidths match nothing. The batch note said the abstract matches neither (imprecise)'
  cmp_lit_zhao2015_si3n4_strip_700nm:
    notes: 'Fab borderline (D84b, xu2025 / lu2017 precedent): the fabrication section is passive (p.4 Sec. III); all authors at WNLO, HUST (p.1); the acknowledgment thanks the engineers of the Center of Micro-Fabrication and Characterization of WNLO for support in device fabrication (p.4-5): fab org_huazhong_university_of_science_and_technology kept with this note; staff thanks do not set facility_org_ids. The loss is printed only as the term subtracted from the GC pair measurement (400 um long interconnect); the measurement method is not stated. Width 900 nm is the strip width of the 3D-FDTD model (p.3), which the experiment keeps (''other parameters are the same as the 3D-FDTD simulation'', p.4).'
    why: 'p.4 Sec. III: ''We = 4 um and Lt = 20 um are chosen for the experiment and other parameters are the same as the 3D-FDTD simulation''; the 900 nm strip width (p.3) therefore applies to the fabricated strip (width row added)'
