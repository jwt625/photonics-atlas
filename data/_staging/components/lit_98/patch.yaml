      11 um beam diameter (1/e2) in the vertical transverse direction and about 4-7 um in the focused horizontal transverse direction (p.15; stated for all gratings, not entered, D254). Text: grating efficiencies
      approximately 10 % for all (p.4; per-grating losses entered instead). Fig. 5 (one of the gratings): 150 um taper region, 20 um x 20 um grating labels. Period not printed.'
