# Audit patch lit_87 (fresh-context audit 2026-11-06, DevLog/audits/2026-11-06-lit_87-audit.md).
# 55 metrics: 51 ok / 4 imprecise / 0 wrong; 11 components: 9 ok / 2 imprecise / 0 wrong.
# Misses: 3 metric rows added. After the patch: 11 components, 58 metrics.
# Ruling pending on the miller2017 population Q row (Q1): drop add_metrics cmp_lit_miller2017_airclad_ring-m5 and
# restore the D159 sentence in the ring notes if overruled.
components:
  cmp_lit_miller2017_airclad_ring:
    notes: 'Fab empty: ''we fabricate'' with authors at Cornell and Columbia (D154). Facility: work performed in part at the CUNY Advanced Science Research Center NanoFabrication Facility (p.9). SOI wafer from Ultrasil Corporation (p.3, supplier note only). Process: EBL (ma-N 2410), ICP C4F8/SF6 full etch, 3 um PECVD oxide removed over the devices (dry etch to 200 nm, then dilute HF), piranha / HF surface treatment, etched facet trenches, XeF2 substrate removal near the facet (p.3-4). Cross-note: OPO row cmp_lit_miller2017_airclad_ring_opo has the same ring design (D396); the paper does not say whether the OPO device (3.7 um resonance, p.8) is the ring of Fig. 3(a). Design-family row (D165): the Fig. 3(b) circles come from devices with varying coupling gaps (p.5), gaps not printed; the about 1e6 intrinsic Q over 3.5-3.8 um (abstract, p.4) is m5 with the population in its notes, the 3790 nm resonance is m1. Ring radius and coupling gap not printed (Fig. 2(a) scale bar only). Oxide-clad 500 x 1400 nm comparison resonators are those of ref. [49] (Fig. 3(b) only): not entered.'
    why: 'p.8 says only "our microresonator" for the OPO, so "the same ring" overstates the identity; p.4, p.5 and Fig. 3(b) tie the about 1e6 Q to the one air-clad design, so a population row (D165) replaces the D159 exclusion (Q1)'
  cmp_lit_miller2017_airclad_ring_opo:
    notes: 'Fab empty: ''we fabricate'' with authors at Cornell and Columbia (D154). Facility: work performed in part at the CUNY Advanced Science Research Center NanoFabrication Facility (p.9). SOI wafer from Ultrasil Corporation (p.3, supplier note only). Process: EBL (ma-N 2410), ICP C4F8/SF6 full etch, 3 um PECVD oxide removed over the devices (dry etch to 200 nm, then dilute HF), piranha / HF surface treatment, etched facet trenches, XeF2 substrate removal near the facet (p.3-4). Cross-note: same ring design as cmp_lit_miller2017_airclad_ring (D396); whether it is the Fig. 3(a) device is not stated (p.8 says our microresonator, high-Q resonance at 3.7 um). Sidebands 10 FSRs from the pump (p.8, Fig. 5(b) inset); simulated anomalous GVD near 4 um (Fig. 5(a)): no parameter (D250).'
    why: 'p.8: the OPO device is "our microresonator" with a resonance at 3.7 um; the Q of Fig. 3(a) is at 3790 nm and the Q data come from several devices (p.5), so "same ring" overstates the identity'
metrics:
  cmp_lit_miller2017_airclad_wg-m1:
    notes: 'printed Q above 1e5 (loss <= 1 dB/cm) throughout 2-6 um (p.7 text and Fig. 4 caption); total-Q model: FEM absorption from cited oxide data plus Payne-Lacey scattering anchored on an unprinted measured loss at 3.8 um with an assumed lambda^-2 scaling (rule 4); p.3 prints the same bound from the absorption-only FEM simulation (Fig. 1)'
    why: 'note said the 2 um lower bound is only the Fig. 4 axis start; p.7 text and the Fig. 4 caption print 2-6 um'
  cmp_lit_miller2017_airclad_wg-m2:
    notes: 'printed Q above 1e6 (loss <= 0.1 dB/cm) out to 5 um (p.7; nearly 5 um on p.3); the range starts at 2 um, the start of the span printed on p.7 and in the Fig. 4 caption; same total-Q model as m1 (rule 4)'
    why: 'note said the 2 um lower bound is only the Fig. 4 axis start; p.7 text and the Fig. 4 caption print the 2 um start'
  cmp_lit_fan2021_input_facet-m2:
    notes: 'Fig. 7 is a smooth curve without data points, read about 0.2 % at 5 deg for both TE10 and TM10; the caption does not say calculated, but p.5 and p.8 say the mode portions are difficult to distinguish experimentally and call the result comparable to a simulation, so the value is a calculation (p.5 cites the curve as Fig. 6, a mis-reference); wavelength not printed with it, 1056 nm is the pump'
    why: 'note said the Fig. 7 caption calls the curve calculated; the caption (p.8) does not; basis simulated rests on p.5 / p.8 wording'
  cmp_lit_dutta2025_lc_ps_sep1um-m2:
    notes: 'printed 3.5 V for the 40 um LC length (p.15-16), origin not stated; it equals half of the 7 V used for about 2 pi. Fig. 4(c) resonance positions give 0.31 nm (about 0.68 pi) at 3 V and 0.48 nm (about 1.05 pi) at 5 V on a 0.91 nm FSR, so pi is reached near 5 V on that sweep: printed value kept with the conflict noted (D417)'
    why: 'note asserted a linear-response assumption the paper does not state; the basis rests on the unstated origin (rule 4), p.15-16, p.13 Fig. 4(c)'
