  cmp_lit_kittlaus2018_nibs_modulator_d5nm:
    notes: 'No fab org: fabrication described passively (p.7 Methods); all authors at Yale University (D80b). No facility acknowledged (p.8: funding only). Source text is the arXiv v1 preprint (''Nonreciprocal Inter-band Brillouin Modulation'', dated 2018-08-30) of the Nature Photonics article in the source row; same work by title and authors, journal version not read (D430 / D433). Classed mode_converter.converter (D419, kittlaus2020a / sohn2018 ruling): the nonreciprocity is a forward / backward contrast of the Stokes scattering efficiency, not an isolation measurement. Main device: Fig. 3(b), (c) and (d)i (p.6 ties Fig. 3(d)i to the device of Fig. 3(b)-(c)). Not entered (no registry parameter): maximum nonreciprocity 38 dB (Fig. 3(d)i, p.6), Stokes / anti-Stokes asymmetry 37 dB (Fig. 3(e), p.6; device not identified, D159; conversion_contrast_db / sideband_suppression_db are D419 registry candidates), FWHM 125 GHz (no bw_3db_ghz on mode_converter), acoustic resonance 5.7 GHz with 17 MHz -3 dB width (Fig. 3(b)), probe-response tuning over 35 nm by the pump wavelength 1530-1565 nm (Fig. 3(f), Supp. Sec. IV; device not tied to a delta; tuning_range_nm not allowed on mode_converter). Forward phase matching near 1545.3 nm and backward at 1548.5 nm (Fig. 3(c)). Supp. Fig. 7 / Table I (0.9 % at 104 mW, G = 195 W^-1 m^-1, L = 2.387 cm) are for one device not identified (D159): not entered. The Discussion (p.7) gives the 0.2 / 0.4 dB/cm losses and a total insertion loss below 1 dB for a device of L = 2.39 cm, the Table I length; no delta is named, so the bound sits on the shared waveguide row cmp_lit_kittlaus2018_suspended_ridge_wg (m7), not here (D159). Methods: the device under test has 468 suspended segments of 50 um (2.34 cm by arithmetic, vs 2.39 / 2.387 cm printed; D417 note).'
    why: p.6 ties only Fig. 3(d)i to the Fig. 3(b)-(c) device; Fig. 3(e), Fig. 3(f) and the p.7 L = 2.39 cm device (= Supp. Table I L 2.387 cm, one device, p.32-33) name no delta (D159). Notes said Fig. 3(e) belongs to this row and omitted the 2.39 cm attribution
  cmp_lit_kittlaus2018_suspended_ridge_wg:
    notes: 'No fab org: fabrication described passively (p.7 Methods); all authors at Yale University (D80b). No facility acknowledged (p.8: funding only). Source text is the arXiv v1 preprint (''Nonreciprocal Inter-band Brillouin Modulation'', dated 2018-08-30) of the Nature Photonics article in the source row; same work by title and authors, journal version not read (D430 / D433). Waveguide of the three NIBS modulators (cross-note cmp_lit_kittlaus2018_nibs_modulator_d5nm, D396). Group indices 4.0595 / 4.1853 (Supp. p.13) carry the citation of the authors'' ref. [5]: not entered (rule 3). Supp. Table I loss coefficients 4.6 / 9.2 m^-1 correspond to the printed 0.2 / 0.4 dB/cm. Total insertion loss below 1 dB over the L = 2.39 cm device (p.7, the authors'' arithmetic on these losses) as m7: the device is not tied to a width asymmetry (D159), and all current devices are about 2.4 cm (Supp. p.14).'
    why: Cross-note for the insertion-loss bound moved here from the delta = 5 nm row (audit Q2)
