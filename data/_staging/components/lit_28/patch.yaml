    why: 'p.3 Fig. 3(b)-(c): contour labels 1.000 / 3.000 dB on maps whose colour-bar minimum is 0.1600 (TE) / 0.2000 (TM) dB; the registry parameter is defined for 1 dB excess loss, so the note must state the level'
