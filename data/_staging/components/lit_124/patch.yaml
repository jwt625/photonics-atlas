    notes: 'GlobalFoundries provided the silicon fabrication through its MPW university program (p.12 Acknowledgments); commercial 45-nm monolithic process on a 300-mm wafer, 160 nm Si device layer, 300 nm waveguide width (p.8 Sec. 3). MZI-type wavelength-independent coupler: two DCs (lengths normalized to the cross-over length L0 only, Table 1, not entered) with curved MZI arms. TE set by a polarization controller, GC-coupled O-band measurement. SR and IL extracted from a 9-device cascade macro (Eq. (9)-(11), Fig. 6). Arms: 3rd-order Bezier bends (continuous curvature change, Fig. 1(c), 2(b)); arm coordinates only normalized to L0 (Table 1). Footprint 36.3 x 3.8 um2 is printed once for the BWIC (p.1 Abstract, p.11, p.11 Table 3, p.12) while Table 1 gives SR-dependent LDC1 (0.91 / 1.08 / 1.37 L0) and yb (0.48 / 0.51 / 0.52 L0) for the 30:70 / 40:60 / 50:50 designs, so one value cannot describe all three and the paper does not say which design it is: not entered (D159 / D254 / D541). Split-ratio deviation statements disagree (D417): p.1 Abstract and p.12 conclusion give 0.6 % as the maximum deviation of the optimal device over 100 nm; p.11 gives 0.6 % as the maximum mean offset from the target (= Table 2 40:60, 0.394) and 1.3 % as the maximum SD (= Table 2 30:70); p.11 Table 3 gives 1.6 % for this work, defined as the maximum non-uniformity of the best-performing device over the wavelength range; p.2 gives an SD of 0.6 %, below every BWIC SD of Table 2 (0.8-1.3 %). The best-performing device is not identified: no deviation row (D159). Table 3 also lists IL 0.15 +/- 0.05 dB for this work (the per-wavelength Table 2 values are entered on this row).'
