# Audit patch lit_124 (fresh-context audit 2026-11-11, DevLog/audits/2026-11-11-lit_124-audit.md).
# 200 metrics: 180 ok / 16 imprecise / 4 wrong (deleted); 24 components: 19 ok / 5 imprecise / 0 wrong, 0 deleted; 2 misses added.
# Coordinator rulings open: Q1 footprint stated once for a design family (to keep the batch version instead, drop the 4 delete_metrics
# and restore the footprint sentences of the 4 component notes), Q2 chen2021a facet width (no op), Q3 chen2021a per-port ILs (no op),
# Q4 printed-value conflicts (notes only).
components:
  cmp_lit_papadovasilakis2023_bwic_sr30:
    notes: 'GlobalFoundries provided the silicon fabrication through its MPW university program (p.12 Acknowledgments); commercial 45-nm monolithic process on a 300-mm wafer, 160 nm Si device layer, 300 nm waveguide width (p.8 Sec. 3). MZI-type wavelength-independent coupler: two DCs (lengths normalized to the cross-over length L0 only, Table 1, not entered) with curved MZI arms. TE set by a polarization controller, GC-coupled O-band measurement. SR and IL extracted from a 9-device cascade macro (Eq. (9)-(11), Fig. 6). Arms: 3rd-order Bezier bends (continuous curvature change, Fig. 1(c), 2(b)); arm coordinates only normalized to L0 (Table 1). Footprint 36.3 x 3.8 um2 is printed once for the BWIC (p.1 Abstract, p.11, p.11 Table 3, p.12) while Table 1 gives SR-dependent LDC1 (0.91 / 1.08 / 1.37 L0) and yb (0.48 / 0.51 / 0.52 L0) for the 30:70 / 40:60 / 50:50 designs, so one value cannot describe all three and the paper does not say which design it is: not entered (D159 / D254 / D541). Split-ratio deviation statements disagree (D417): p.1 Abstract and p.12 conclusion give 0.6 % as the maximum deviation of the optimal device over 100 nm; p.11 gives 0.6 % as the maximum mean offset from the target (= Table 2 40:60, 0.394) and 1.3 % as the maximum SD (= Table 2 30:70); p.11 Table 3 gives 1.6 % for this work, defined as the maximum non-uniformity of the best-performing device over the wavelength range; p.2 gives an SD of 0.6 %, below every BWIC SD of Table 2 (0.8-1.3 %). The best-performing device is not identified: no deviation row (D159). Table 3 also lists IL 0.15 +/- 0.05 dB for this work (the per-wavelength Table 2 values are entered on the 50:50 row).'
    why: 'Follows the deletion of the family-level footprint rows (audit Q1, D159 / D254 / D541; p.8 Table 1 shows SR-dependent geometry) and corrects the deviation-conflict description: the 0.6 % of the abstract / conclusion is a best-device spectral deviation, the 0.6 % on p.11 a mean offset, and p.2 prints a 0.6 % SD that matches no Table 2 SD (p.1, p.2, p.9 Table 2, p.11 Table 3, p.12)'
