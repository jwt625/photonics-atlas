  cmp_lit_papadovasilakis2022_wic_sr50:
    notes: 'GlobalFoundries provided the silicon fabrication through its MPW university program (p.10 Acknowledgments); monolithic CMOS SOI platform with a 160 nm device layer (p.2). MZI-type wavelength-independent coupler: two DCs (w = 300 nm, gap 200 nm, chosen for fabrication tolerance; Fig. 1(e)) and an arm-length difference dL; lengths only normalized to the cross-over length L0 (Table 1, not entered). Fabricated with three width variants (w = 290 / 300 / 310 nm, g = 210 / 200 / 190 nm); Table 1 SR mean / SD pool the three variants over the O-band (D165 population row). TE design (p.4); measurement polarization not stated (setup in ref. 32). Companion paper lit:papadovasilakis2023a uses WICs of the same 300 nm / 200 nm DC design. The 3-dB design also sits in the 9-device cascade macro (Fig. 5) used for the 6-site SR statistics and the IL extraction (Eq. (6)-(8)). Site-to-site SR spread at 9 wavelengths: maximum deviation 0.011-0.026 (Fig. 6(b), not entered). Conclusion p.10 gives ''mean SD of 1.2 % for the least stable device'' vs 1.3 % on p.6 (D417). Footprint 60 x 40 um2 is printed once for the WIC (p.1 Abstract; p.10 Table 2 ''This Work'' row with splitting ratio ''Any'') while the four designs differ in LDC1 (1.12 / 0.81 / 0.72 / 0.48 L0) and dL (0.18 / 0.16 / 0.14 / 0.13 L0, p.6 Table 1); the design it describes is not stated: not entered (D159 / D254 / D541, audit Q1).'
    why: 'Follows the deletion of m9 (footprint stated once for the WIC family, placed on one representative row; D254 / D541, audit Q1; p.1 Abstract, p.6 Table 1, p.10 Table 2)'
  cmp_lit_chen2021a_mmi4x4_tm:
    notes: 'Fabrication stated in the passive voice (p.6 Sec. 3); all authors at NUS, no fabricating org named (D80b): fab empty. The acknowledgment names the Spin and Energy Lab (SEL) and E6NanoFab facilities at NUS (p.9); neither is in the registry (reported). Process: Cr / ma-N 2403 mask, 75 keV EBL, Ar-only ICP etch (Oxford PlasmaPro 100 Cobra, about 25 nm/min, selectivity about 1:1); 700 nm Z-cut TFLN on 2 um SiO2 (wafer supplier not named). All design and measurement in TM. Proposed also as a 90-degree hybrid (p.8; not characterized as one). Per-port ILs at 1550 nm for input port 2: 6.6 / 6.85 / 6.54 / 6.62 dB for O1-O4 (p.7), not entered as rows (per-port transmissions including the 1/4 split, D401 analogue). Audit read of the Fig. 8(a) inset at 1550 nm (embedded figure image, about +/- 0.01 dB): -6.54 (blue, Port4), -6.61 (red, Port2), -6.81 (black, Port1) and -6.85 dB (green, legend repeats ''Port2''). The inset differs from the printed list in the port labels and in one value: the printed 6.6 and 6.62 dB fall on one inset point (about 6.61 dB), and the inset point at about 6.81 dB has no printed counterpart (D417). The inset values sum to a total of about 0.68 dB instead of the printed 0.63 dB; the max-min spread is 0.31 dB either way. Printed values used (0.63 dB on p.1, p.2, p.7, p.9 Table 1 and p.9 conclusion). Simulated uniform output for W_M 19.5-20.1 um and L_M tolerance about 1 um (p.4). Cascade not used (sample area).'
    why: 'p.8 Fig. 8(a) inset (embedded image read): the disagreement with the p.7 per-port list is not only a Port 1 / Port 3 assignment, one inset value (about 6.81 dB) has no printed counterpart and the inset total would be about 0.68 dB (audit Q4)'
