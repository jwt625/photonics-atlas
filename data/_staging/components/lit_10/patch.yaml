# Audit patch lit_10 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_10-audit.md).
# 216 metrics: 213 ok / 3 imprecise / 0 wrong; 32 components: 26 ok / 6 imprecise / 0 wrong; 11 misses added.
# Not covered here (coordinator decisions, see the audit file): registry orgs Kyoto University Nano Technology Hub
# (ashida2017 facility) and ANFF ACT node (suk2025 facility, borderline), registry gaps (passband ripple, DC coupling
# coefficient, split-tolerance bandwidth, optical self-heating shift, PhC hole radius, GC polarization selectivity,
# platform sicoi), test_structure convention for headline devices.
components:
  cmp_lit_gao2021_cmp_microring_d200:
    cladding: ''
    why: 'skill workflow step 3: cladding only if stated; the row itself says ''not stated otherwise''; p.2-3 give no cladding (ring contacted by a separate ridge-waveguide chip, p.3)'
  cmp_lit_suk2025_as2s3_single_layer:
    cladding: ''
    why: 'cladding only if stated: p.2-3 give no cladding for the single-layer rings (top is the 10 nm Ge33As12Se55 passivation layer, p.2; flip-chip bus placed above, p.3)'
  cmp_lit_suk2025_as2se3_single_layer:
    cladding: ''
    why: as as2s3_single_layer (p.2-3)
  cmp_lit_suk2025_ge11as24se64_single_layer:
    cladding: ''
    why: as as2s3_single_layer (p.2-3)
  cmp_lit_suk2025_ge33as12se55_single_layer:
    cladding: ''
    why: as as2s3_single_layer (p.2-3)
  cmp_lit_zhang2013a_arc_butt_y_junction:
    core_material: 'Si submicron waveguide (wafer, process and dimensions not stated for this structure)'
    notes: 'Mentioned in the introduction as the authors'' own experimental observation (''in our experiment'', p.2 Sec. 1); design dimensions, wafer, process, test structure and wavelength not stated; platform soi from the paper''s submicron-silicon-waveguide context. fab_org_ids empty: no fabrication statement for this structure (rule 12).'
    why: 'p.2 Sec. 1: the arc-plus-butt Y-junction is only an observation ''in our experiment''; the 8-inch / 248 nm process of Sec. 2.2 (p.4) is stated for the PSO Y-junction chip, so attributing it to this structure was an inference'
metrics:
  cmp_lit_jeong2013_crow5_arf_crow3-m1:
    qualifier: ''
    statistic: best
    notes: 'printed ''as low as 0.2 dB'' at the passband center (p.7); summary (p.12) prints < 0.2 dB'
    why: 'skill rule 7: ''as low as'' -> statistic best, not qualifier approx (p.7 Sec. 3.2 ''as low as 0.2 dB at the center of passband'')'
  cmp_lit_radulaski2018_perturbed_cavity_bus-m2:
    includes: 'input grating coupler (10 dB) and the bus waveguide past three cavities; output path not stated'
    why: 'p.13-14: the paper names the input grating (10 dB loss) and the bus waveguide; it does not describe the output collection, so ''output path'' in includes was an inference'
  cmp_lit_suk2025_trilayer_as2se3_midir-m3:
    notes: 'printed Qint exceeded 10^7 across 3.2-4.6 um (p.4, abstract, conclusion); the Fig. 4(b) measured points fall below 10^7 near 3.4 um (hydrocarbon absorption) and near 4.02 um (S-H band, mean 8.6 x 10^6 in m4); entered as printed'
    why: 'p.5 Fig. 4(b): measured Qint points dip below 10^7 near 3.4 um as well as at 4.02 um; the old note mentioned only the 4.02 um dip at about 10^7'
