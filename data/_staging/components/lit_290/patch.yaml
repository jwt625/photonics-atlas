# Audit patch lit_290 (fresh-context audit 2026-11-26, DevLog/audits/2026-11-26-lit_290-audit.md).
# Batch: 10 components / 33 metrics, all from lit:subramanian2013; rahim2018, jalali2006, rahim2016: 0 rows (confirmed).
# 33 metrics: 33 ok / 0 imprecise / 0 wrong; 10 components: 9 ok / 1 imprecise (wg180_clad_w400 single-mode note) / 0 wrong.
# Ops, in groups the coordinator can drop separately:
#  - notes / label edits on existing rows (wg180_clad_w400 fix; note supplements; gc_unclad-m1 basis note);
#  - miss: BOX 2.43 um FIB/SEM label (wg220_unclad_w800-m9), 532 nm GC width 5 um (gc_unclad-m11);
#  - judgment e (question 5): design film / BOX / top-cladding thickness on every waveguide and GC row (D153);
#  - judgment f (question 6), "figure block": 16 extracted_from_figure loss points of Figs. 5-6 on 14 new
#    per-width rows plus one existing row (wg220_unclad_w700-m3), each with its width and stack geometry.
#    Dropping the figure block also needs the wg220_unclad_w700 / wg220_clad_w800 / wg180_unclad_sm /
#    wg180_unclad_wide note edits reverted (they cross-reference the new rows).
# After the full patch: 24 components, 33 + 87 = 120 metrics.
components:
  cmp_lit_subramanian2013_wg180_clad_w400:
    notes: 'The paper calls the 400 nm clad wire single mode (p.7 Sec. 4.2), but its own simulated clad single-mode width at 532 nm is 380 nm (p.3 Sec. 2; the Fig. 6 dashed cut-off line sits near 390 nm), so by the simulation 400 nm is just above cut-off; label keeps the printed wording. Fig. 6 (532 nm series) point reads 0.94 dB/cm with a large error bar (about 0.37-1.51). Fab empty: the paper says only that the waveguides were fabricated ''in a CMOS pilot line'' / ''within a CMOS pilot line'' (p.2 abstract, p.9) and names no org; authors at Ghent University-IMEC and IMEC (D80b, Contract v7). Process as printed: 200 mm bare Si wafer, 2-2.4 um HDP-CVD SiO2, PECVD Si3N4 at 400 C (SiH4 / N2 / NH3), 193 nm optical lithography, fluorine ICP-RIE, no anneal (p.4 Sec. 3); process_name left empty (no node or named flow).'
    why: 'p.3 Sec. 2 and p.8 Fig. 6: the batch note stated ''single mode'' next to a 380 nm simulated cut-off without saying that 400 nm lies above it; note corrected (D417-type internal inconsistency recorded)'
  cmp_lit_subramanian2013_wg180_unclad_sm:
    notes: 'Conclusion value for the unclad single-mode wires at 532 nm (p.9); the width is not printed with it. The simulated unclad single-mode width at 532 nm is 530 nm (p.3 Sec. 2; Fig. 5 dashed line), so the measured single-mode widths are 300, 400 and 500 nm; p.8 puts the single-mode regime at < 600 nm. Fig. 5 reads 7.32 / 3.22 dB/cm at 300 / 400 nm (rows cmp_lit_subramanian2013_wg180_unclad_w300 / _w400) and 2.39 dB/cm at 500 nm (green marker partly hidden behind the 780 nm marker; about +/-0.04), and the abstract''s 1-3 dB/cm range for single-mode unclad wires at 780 / 532 nm excludes 300 / 400 nm; so the value most likely belongs to the 500 nm wire, but the width is not entered and no separate 500 nm row is made (D159 / D156: identity not printed). The 780 nm marker at 500 nm reads 2.30 dB/cm, the printed number; the 532 nm marker is 0.09 dB/cm higher. Fab empty: the paper says only that the waveguides were fabricated ''in a CMOS pilot line'' / ''within a CMOS pilot line'' (p.2 abstract, p.9) and names no org; authors at Ghent University-IMEC and IMEC (D80b, Contract v7). Process as printed: 200 mm bare Si wafer, 2-2.4 um HDP-CVD SiO2, PECVD Si3N4 at 400 C (SiH4 / N2 / NH3), 193 nm optical lithography, fluorine ICP-RIE, no anneal (p.4 Sec. 3); process_name left empty (no node or named flow).'
    why: 'p.7 Fig. 5 raster read, p.2 abstract, p.8 Sec. 4.2: note supplement for judgment a (question 1); records the 500 nm reading, the abstract range and the coincidence with the 780 nm series; cross-references the added 300 / 400 nm figure rows'
  cmp_lit_subramanian2013_wg180_unclad_wide:
    notes: 'Multimode widths: the text says the best 532 nm loss was reached ''for the waveguides wider than 800 nm'' (p.7); Fig. 5 shows 900 and 1000 nm points at 0.70 / 0.68 dB/cm (raster read, about +/-0.03), so this row stands for that width group (D165 population row), not one width; narrower widths have their own figure rows. Film thickness 9-point map on one test wafer of the lot: mean 178.9 nm, std 4.6 nm, min 174.2 / max 186.2 nm for a 180 nm target (p.5 Sec. 4.1); entered here only, the 180 nm design value is on every 180 nm row. Text: unclad widths > 700 nm show < 1 dB/cm at 532 and 900 nm; 500-700 nm 1-2 dB/cm at all three wavelengths (p.7; family statements, not entered). Fab empty: the paper says only that the waveguides were fabricated ''in a CMOS pilot line'' / ''within a CMOS pilot line'' (p.2 abstract, p.9) and names no org; authors at Ghent University-IMEC and IMEC (D80b, Contract v7). Process as printed: 200 mm bare Si wafer, 2-2.4 um HDP-CVD SiO2, PECVD Si3N4 at 400 C (SiH4 / N2 / NH3), 193 nm optical lithography, fluorine ICP-RIE, no anneal (p.4 Sec. 3); process_name left empty (no node or named flow).'
    why: p.7 Fig. 5 raster read; note updated for the per-row geometry and figure rows (judgments b, e, f)
  cmp_lit_subramanian2013_wg220_unclad_w700:
    label: Unclad PECVD Si3N4 wire, 220 nm film, 700 nm wide (780 / 900 nm)
    notes: 'Best of the four unclad widths measured at 780 nm (450, 500, 600, 700 nm; p.7); single mode at 780 nm (unclad single-mode width ~900 nm simulated, p.3). The 900 nm point of the same width (Fig. 5, 0.87 dB/cm) is entered as m3 (extracted_from_figure). Fab empty: the paper says only that the waveguides were fabricated ''in a CMOS pilot line'' / ''within a CMOS pilot line'' (p.2 abstract, p.9) and names no org; authors at Ghent University-IMEC and IMEC (D80b, Contract v7). Process as printed: 200 mm bare Si wafer, 2-2.4 um HDP-CVD SiO2, PECVD Si3N4 at 400 C (SiH4 / N2 / NH3), 193 nm optical lithography, fluorine ICP-RIE, no anneal (p.4 Sec. 3); process_name left empty (no node or named flow).'
    why: 'judgment f: the 900 nm figure point of this design is added as m3; label and note follow (figure block)'
  cmp_lit_subramanian2013_wg220_clad_w800:
    notes: 'Best clad value at 900 nm (Fig. 6 point 0.31 dB/cm). Text: clad loss < 1 dB/cm over the whole range the paper calls single mode, 500-800 nm, at 900 nm (p.7; family statement; the simulated clad single-mode width at 900 nm is 770 nm, p.4); the 500-700 nm clad wires have figure rows (cmp_lit_subramanian2013_wg220_clad_w500 / _w600 / _w700). Fab empty: the paper says only that the waveguides were fabricated ''in a CMOS pilot line'' / ''within a CMOS pilot line'' (p.2 abstract, p.9) and names no org; authors at Ghent University-IMEC and IMEC (D80b, Contract v7). Process as printed: 200 mm bare Si wafer, 2-2.4 um HDP-CVD SiO2, PECVD Si3N4 at 400 C (SiH4 / N2 / NH3), 193 nm optical lithography, fluorine ICP-RIE, no anneal (p.4 Sec. 3); process_name left empty (no node or named flow).'
    why: 'judgment f: cross-reference to the added clad 900 nm figure rows (figure block); 770 nm cut-off recorded'
  cmp_lit_subramanian2013_gc_clad:
    notes: 'Same GC designs as the unclad family row (cmp_lit_subramanian2013_gc_unclad) on the SiO2-clad samples (clad samples were measured at 532 and 900 nm, Fig. 6); the paper attributes the improvement to the reduced grating index and notes a slight blue shift of the peak wavelength (p.7). Period, etch depth, fill factor, film and BOX are on the unclad family row. Fab empty: the paper says only that the waveguides were fabricated ''in a CMOS pilot line'' / ''within a CMOS pilot line'' (p.2 abstract, p.9) and names no org; authors at Ghent University-IMEC and IMEC (D80b, Contract v7). Process as printed: 200 mm bare Si wafer, 2-2.4 um HDP-CVD SiO2, PECVD Si3N4 at 400 C (SiH4 / N2 / NH3), 193 nm optical lithography, fluorine ICP-RIE, no anneal (p.4 Sec. 3); process_name left empty (no node or named flow).'
    why: 'judgment e: geometry cross-reference; cladding thickness added as m2'
metrics:
  cmp_lit_subramanian2013_wg220_unclad_w800-m8:
    notes: 'target 2.4 um; FIB/SEM shows 2.43 um (Fig. 4(b) label, m9), text: ''found to be the same''; > 5 % variation across the wafer'
    why: 'p.6 Fig. 4(b) render: the SEM label prints 2.43 um; note supplement (row ok), measured value added as m9'
  cmp_lit_subramanian2013_gc_unclad-m1:
    notes: '''Typical efficiency of these GCs were around ~7 dB/coupler'' (printed as an efficiency in dB, entered as loss); one value stated for three wavelengths (rule 7: band unspecified); the measurement is the fiber-GC-waveguide-GC-fiber transmission described on p.5 with GCs at both ends of 1-8 cm waveguides, but how the per-coupler value was isolated is not described (method unspecified); measured, not author_estimate: the paper''s own GCs in its described set-up (D167; unlike velha2016 / chung2023, D544 / D651, where no measurement was described)'
    why: 'judgment c (question 3): basis kept measured; note records why D544 / D651 do not apply'
