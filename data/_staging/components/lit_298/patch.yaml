# Audit patch lit_298 (fresh-context audit 2026-11-27, DevLog/audits/2026-11-27-lit_298-audit.md).
# 10 metrics: 9 ok / 0 imprecise / 1 wrong; 3 components: 1 ok / 1 imprecise / 1 wrong. 1 miss added.
# After the patch: 2 components, 9 metrics.
# Wrong: kim2005 RWGSOA preamplifier 16 mW (12.04 dBm) is the power at the tapered-amplifier input after an optical
# isolator and a band-pass filter (Fig. 4 order: preamplifier -> isolator -> BPF -> TA), not the SOA's own output; with
# m1 gone the row keeps only its 1 mm length (geometry-only, rule 9): component deleted (D706 kim2004 line: no value of
# the Sarnoff SOA alone). Imprecise: kim2005 TA core_material (p.2 prints "cascaded InGaAs semiconductor optical
# amplifiers"); TA notes carry the preamplifier facts. Miss: hamrouni2024 sidewall angle 78 deg labelled in Fig. 1(a).
components:
  cmp_lit_kim2005_tapered_amp_3mm:
    core_material: InGaAs (p.2 'cascaded InGaAs semiconductor optical amplifiers'); structure and substrate not stated
    notes: 'Discrete tapered amplifier (TA, Fig. 4) used as the power amplifier after the RWGSOA preamplifier, lens-coupled in a free-space bench-top chain. Input aperture 3 um, output aperture 200 um (p.6; no registry parameter names which width is which for a taper, kept here). Maker not stated (the acknowledgment credits Sarnoff only for the IBTSOA and RWGSOA): fab empty. Material only from the p.2 sentence on the cascaded InGaAs SOAs (preamplifier and TA); substrate not stated: platform empty (D422 / D423). The 16 mW input is the power delivered by the preamplifier (1 mm 5 deg tilted ridge-waveguide InGaAs/AlGaAs SOA at 150 mA, saturated by ~1.3 mW of stretched pulses, p.5-6) after an optical isolator and a band-pass filter (Fig. 4); the preamplifier is not a row (no value of that SOA by itself; D706). The 1 W corresponds to 10.5 nJ per 9.6 ns stretched pulse (p.6; pulse_energy_nj is not a registry parameter). Most, not all, of the 1 W is amplified signal (p.6, Fig. 5(d)); the ASE share is not quantified.'
    why: 'p.2 Sec. 1 prints "cascaded InGaAs semiconductor optical amplifiers" for the X-CPA amplifier chain (preamplifier + TA, Fig. 4), so the TA material is stated (the row said "material not stated"); notes take over the preamplifier facts from the deleted RWGSOA row'
delete_components:
  - id: cmp_lit_kim2005_rwg_soa_preamp
    why: 'p.6 Sec. 5 "16mW input power from the preamplifier" is the tapered-amplifier input; p.5 Fig. 4 places an optical isolator and a band-pass filter between the RWGSOA preamplifier and the TA, so 16 mW is a system-plane value after two other parts, not the SOA output (its own output is not printed; a ">= 16 mW" bound would be an inference). Without m1 the row holds only length_um 1000 (geometry-only, rule 9). Same outcome as D706 for the group''s kim2004 (no value of the Sarnoff SOA alone). Preamplifier facts moved to the TA notes'
add_metrics:
  - metric_id: cmp_lit_hamrouni2024_facet_objective-m6
    component_id: cmp_lit_hamrouni2024_facet_objective
    parameter: sidewall_angle_deg
    value: '78'
    unit: deg
    condition: ridge sidewall
    basis: extracted_from_figure
    locator: p.3 Fig. 1(a)
    notes: 'labelled 78 deg on the Fig. 1(a) design schematic (label read as printed, no reading uncertainty); not in the text, not stated as measured'
    why: 'p.3 Fig. 1(a) render labels the ridge sidewall angle 78 deg next to the 1520 nm / 931 nm / 608 nm cross-section already on this row (D153 geometry, Contract v5 figure-labelled dimension)'
