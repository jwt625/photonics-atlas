metrics:
  cmp_lit_luo2018_zcut_ln_shg_wg_8mm-m1:
    basis: measured
    notes: 'Paper: ''Fitting the experimental data, we obtained an on-chip conversion efficiency of 4.7% W-1'' (p.3); Fig. 3(c) quadratic fit of SH power vs pump power (both axes in dBm; the top point, about -67 dBm SH at about -11.5 dBm pump (read), gives about 4 %/W, consistent with on-chip-referred axes). The coupling corrections are not printed: the telecom side matches the own cutback value (about 5 dB/facet, p.3), the visible output coupling loss is never stated. Standard fit of own data (D80a), entered measured as the merged on-chip SHG rows whose coupling correction is not printed (zhao2026 m1, wang2018, zhao2025a); author_estimate would apply if the paper called the correction estimated or assumed (chang2018a). 18.7 C printed; 291.85 K converted.'
    why: 'coordinator Q1: p.3 ''on-chip conversion efficiency'' from a quadratic fit of own data (D80a); no assumed or cited input is named, only an unprinted visible coupling correction; merged precedents with unprinted coupling corrections are measured (zhao2026 m1 ''Coupling correction values not printed'', lit_62 audit; wang2018 / zhao2025a, lit_85 audit)'
  cmp_lit_hwang2023_lnos_pump_enhanced_sro-m3:
    wavelength_nm: '1550'
    wavelength_max_nm: ''
    condition: 'total Q of the signal (telecom) cavity modes near 1550 nm, cold cavity, Lorentzian fits; telecom laser sweep'
    notes: 'Printed Q_tot = 1.3-1.6 x 10^6 citing Fig. 1(c) (p.2-3), whose caption gives ''signal wavelengths near 1550 nm'' (plot axis 1558-1558.5 nm; D393, stated). The next sentence says high Q extends over the whole 1500-1640 nm laser range (Ext. Data Fig. 3(b), p.16, 2621 fitted modes, 174 poor fits excluded) without restating the range for that span; p.16 render not cached, so the range is not extended to 1500-1640 nm. The p.11 pump model uses 1.5e6 and the p.4 OPO model 1.6e6.'
    why: 'p.2-3 the 1.3-1.6e6 range is printed with Fig. 1(c) (caption p.2: modes near 1550 nm); the batch set 1500-1640 nm from the ''High Q-factors extend over...'' sentence, which does not state that range for the full span'
  cmp_lit_hwang2023_lnos_pump_enhanced_sro-m5:
    wavelength_nm: '1550'
    wavelength_max_nm: ''
    condition: 'signal cavity modes near 1550 nm, extracted for the undercoupled cavity (Q_ex about 20e6)'
    notes: 'D403: the undercoupled regime is stated (design ~1 % extraction), not determined from the data. Wavelength as the Q_tot range it is extracted from (Fig. 1(c), near 1550 nm, p.2-3).'
    why: 'as m3: the Q_i range is extracted from the Q_tot range printed with Fig. 1(c) (near 1550 nm, p.2-3)'
