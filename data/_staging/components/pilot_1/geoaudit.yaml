# Fresh-context audits of the geometry pass (couplers; passives + actives), 2026-10-20, with coordinator rulings D113; applied after geometry.yaml.
components:
  cmp_li2022b_mmi_1x2_532:
    notes: Splitter and combiner of the 532 nm MZM (EO row li2022b-a counts two MMIs as 1.6 dB in its on-chip IL breakdown). Loss from a test structure of five cascaded MMIs between two GCs. Output-port
      separation Y_MMI 2.08 um (design) entered as pitch_um (m6, D102). Input/output waveguides 1.5 um wide (m5). Fabricated in the authors' laboratory (EBL, dry etch); the laboratory's organization is
      not named, so fab_org_ids is empty (NanoLN is the wafer supplier).
    why: 'stale note: pitch_um covers splitter port pitch since D102 and the value is now entered'
metrics:
  cmp_li2026aa_ssc-m17:
    notes: SiON layer thickness as deposited (4.2 um, p.8) = total overlay height; Table 1 gives the SiON rib height h1 3.2 um and slab h2 1 um (slab entered as overlay_slab_thickness_um).
    why: 'audit: stale note; overlay_slab_thickness_um exists since D111'
  cmp_li2026aa_ssc-m23:
    basis: derived
    notes: Table 1 w4 printed as 0.8 um; unit conversion um -> nm (D82d). Lower slab taper widths w1 0.2, w3 2.1, w5 5 um.
    why: 'audit: value differs from the printed number (0.8 um -> 800 nm), D82d / D111 unit rescaling is derived'
  cmp_li2022b_gc_532-m11:
    basis: derived
    notes: printed as 0.3 um (taper 5 um to 0.3 um); unit conversion um -> nm (D82d). Taper length, grating length / width and n_periods not stated.
    why: 'audit: value differs from the printed number (0.3 um -> 300 nm), D82d / D111'
  cmp_kohli2025_vdc_sin_bto_cband-m8:
    condition: BTO (upper layer) single-mode width after its taper (150 to 800 nm, C-band)
    notes: SiN (lower layer) taper start width 800 nm entered as lower_width_nm (D111).
    why: 'audit role fix (D102 / D111): width_nm is the upper-layer width; the SiN width has its own parameter lower_width_nm'
  cmp_berman2026_racetrack_249um-m5:
    parameter: coupling_length_um
    notes: Straight-section length 249 um of the racetrack (Fig. 1(c) caption, bend radius 100 um in m4); racetrack straight entered as coupling_length_um so the ring_bus template draws it (D102). Gap and
      width of this racetrack not stated.
    why: 'D102 role fix not applied by the geometry pass: racetrack straight length belongs in coupling_length_um (ring_bus template top view)'
