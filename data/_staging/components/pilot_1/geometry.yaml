# Geometry pass for the layout viewer (DevLog-005 D102-D111, 2026-10-20; families couplers / passives / actives); applied after patch, sweep, gapfill, addendum.
metrics:
  cmp_li2026aa_ssc-m16:
    parameter: overlay_width_um
    value: '4.4'
    unit: um
    notes: optimized SiON rib width (Table 1 w6; p.2 text); entered as printed in um
    why: 'D102 role-specific geometry: the 4.4 um SiON rib is the SSC overlay waveguide, not the LN waveguide width (value as printed in um)'
  cmp_li2026aa_ssc-m17:
    parameter: overlay_thickness_um
    value: '4.2'
    unit: um
    notes: SiON layer thickness as deposited (4.2 um, p.8); Table 1 gives SiON rib height h1 3.2 um and slab h2 1 um (no registry parameter for the overlay slab)
    why: 'D102 role-specific geometry: the 4.2 um SiON layer is the SSC overlay, not the LN core (value as printed in um)'
  cmp_kohli2025_vdc_sin_bto_cband-m3:
    parameter: lower_tip_width_nm
    why: 'D102 role-specific geometry: the SiN taper (800 to 200 nm) is the lower layer; BTO sits about 100 nm above it'
  cmp_kohli2025_vdc_sin_bto_cband-m6:
    parameter: layer2_thickness_nm
    condition: BTO layer (upper)
    why: 'D102 role-specific geometry: BTO is the second (upper) guiding layer of the bilayer VDC'
  cmp_valdez2023_mmi_cband-m2:
    parameter: mmi_length_um
    value: 39
    unit: um
    notes: MMI length designed from simulation (C-band design).
    why: 'D102: the MMI body dimension was stored in the generic width_nm / length_um, which the layout viewer reads as the access waveguide / device length; repointed to the role-specific parameter, value
      as printed in um'
  cmp_valdez2023_mmi_cband-m3:
    parameter: mmi_width_um
    value: 6
    unit: um
    notes: MMI width 6 um stated for the MMI couplers (both bands).
    why: 'D102: the MMI body dimension was stored in the generic width_nm / length_um, which the layout viewer reads as the access waveguide / device length; repointed to the role-specific parameter, value
      as printed in um'
  cmp_valdez2023_mmi_oband-m2:
