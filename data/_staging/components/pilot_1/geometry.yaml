    notes: MMI length designed from simulation (O-band design).
    why: 'D102: the MMI body dimension was stored in the generic width_nm / length_um, which the layout viewer reads as the access waveguide / device length; repointed to the role-specific parameter, value
      as printed in um'
  cmp_valdez2023_mmi_oband-m3:
    parameter: mmi_width_um
    value: 6
    unit: um
    notes: MMI width 6 um stated for the MMI couplers (both bands).
    why: 'D102: the MMI body dimension was stored in the generic width_nm / length_um, which the layout viewer reads as the access waveguide / device length; repointed to the role-specific parameter, value
      as printed in um'
  cmp_li2022b_mmi_1x2_532-m3:
