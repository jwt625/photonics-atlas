add_metrics:
- metric_id: cmp_li2022b_gc_532-m9
  component_id: cmp_li2022b_gc_532
  parameter: core_thickness_nm
  value: '200'
  unit: nm
  condition: x-cut TFLN film
  basis: design_target
  locator: p.2 Sec. 2 Design and fabrication
  notes: '200 nm top LN film; GC etched to the 100 nm ridge depth (m8). Cross-note: EO row li2022b-a eo_film_thickness_nm 200, verified at the locator (D106).'
  why: geometry pass couplers (DevLog-005 D106)
- metric_id: cmp_li2022b_gc_532-m10
