  parameter: box_thickness_um
  value: '2'
  unit: um
  basis: design_target
  locator: p.2 Sec. 2 Design and fabrication
  notes: '2 um thermal oxide between the LN film and the Si substrate. Cross-note: EO row li2022b-a buffer_oxide_um 2 (D106). The 300 nm SiO2 over-cladding is removed above the GC ports (p.2-3), so no cladding
