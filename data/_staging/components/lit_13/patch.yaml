  why: 'class ruling: nf_db is not allowed for frequency_converter; value (Tx NF about 6 dB, p.2) kept in component notes,
    registry gap reported'
- id: cmp_lit_abe2025_ppln_opa_wc-m4
  why: 'class ruling: Rx NF about 5 dB (p.2) moved to component notes, registry gap'
- id: cmp_lit_abe2025_ppln_opa_wc-m5
