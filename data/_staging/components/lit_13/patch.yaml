# Audit patch lit_13 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_13-audit.md).
# 160 metrics: 140 ok / 17 imprecise / 3 wrong; 29 components: 24 ok / 5 changed / 0 deleted; 5 misses added.
# Class ruling: abe2025 -> frequency_converter.sfg_dfg (one class with umeki2010); conversion gains / efficiencies in
# power_conversion_efficiency_pct (ding2022 precedent) until a conversion-gain parameter exists (coordinator question).
# Not covered here (coordinator): InPhenix registry org (starnault2024 QW / bulk fab), registry gaps.
components:
  cmp_lit_abe2025_ppln_opa_wc:
    class: frequency_converter.sfg_dfg
    notes: 'Subsystem of two PPLN OPA modules (X / Y polarization, input and output PBS) pumped by one PPLN SHG module, Peltier-controlled
      (p.2 Fig. 1(a)); the output used is the converted (idler) light, C/L <-> U band. Classed frequency_converter.sfg_dfg
      (audit lit_13: one class for the PPLN DFG / OPA wavelength converters of abe2025 and umeki2010; ding2022 FWM wavelength-converter
      precedent). Conversion gain (converted output / signal input) stored as power_conversion_efficiency_pct (dB -> %, derived)
      until a conversion-gain parameter exists. Conversion NF not entered (no frequency_converter NF parameter): Tx about
      6 dB over 1624.23-1675.99 nm, Rx about 5 dB, beyond-U-band Tx 6-8 dB over 1675.99-1719.24 nm (p.2-3, Fig. 2-3). Two
      units, post-OPA (Tx) and pre-OPA (Rx), same configuration, Rx run at a higher SH-pump power: operating points in condition.
      Modules described as the authors'' own development, all authors NTT, no fabrication statement: fab_org_ids empty (D80b).
      Gain flatness <= 3 dB within the conversion bands (p.2) has no parameter. Input total-power tolerance ~16 dBm (1 dB
      SNR penalty with ~4 dB gain reduction, Fig. 4, sentence cites [26]) is not a saturation-power definition: not entered.
      X / Y path-length difference <= 0.5 mm (p.2) is an assembly setting.'
    why: 'Class ruling (batch report call 1): both abe2025 and umeki2010 are PPLN chi(2) DFG / OPA wavelength converters whose
      output is the converted light (p.2 Sec. II-A ''wavelength-converted with the PPLN for OPA''; title); registry frequency_converter.sfg_dfg
      = sum / difference frequency generation; merged precedent ding2022 FWM wavelength converter = frequency_converter with
      idler/signal CE in power_conversion_efficiency_pct, while amplifier.parametric holds signal-gain devices (riemensberger2022,
      kuznetsov2025). umeki2010 module metrics (%/W) cannot live in amplifier'
  cmp_lit_umeki2010_ppznln_dfg_module:
    notes: 'Authors state they fabricated the waveguide and the module (p.1 Abstract, p.5 Sec. IV); all authors NTT Photonics
      Laboratories: fab_org_ids org_ntt (D72). Lens coupling and laser welding, Peltier + thermistor, AR-coated facets, TM
      input via 1.55 um PM fibers (p.5). Values reproduced from the authors'' earlier paper ref. [20] are not entered (D259
      / D259a): SHG efficiency 2400%/W at 1563.2 nm and the 0.2 nm phase-matching FWHM (Fig. 4 [20]), 148 mW SH from 160 mW
      pump / 92% (Fig. 8 [20]); abstract and conclusion restate them. Internal (+8 dB) and external fiber-to-fiber (+4 dB)
      wavelength conversion efficiencies entered as power_conversion_efficiency_pct (dB -> %, audit lit_13, ding2022 precedent);
      the +9 dB signal parametric gain (p.6) has no frequency_converter parameter. Same +8 / +4 dB for four WDM signals 1555.3-1557.7
      nm (p.7, Fig. 15). Convertible region +/-30 nm from the QPM peak (p.6).'
    why: notes said the +8 / +4 dB conversion efficiencies had no parameter; they are now entered (m6, m7), see add_metrics
  cmp_lit_vandekerckhove2025_ppln_sin_shg_inhouse:
    platform: lnoi_loaded_sin
    notes: 'Author contributions: three authors fabricated the nonlinear waveguides (poling, transfer printing; p.9-10), all
      with the Ghent University - imec affiliation. Normalized efficiency eta = P_SH / (P_F^2 L^2) from on-chip powers obtained
      with the measured lensed-fiber coupling losses at both wavelengths (Methods p.9), L = 0.9 mm interaction length. Phase-matching
      3-dB bandwidth has no frequency_converter parameter (see registry gaps). 25 deg angled SiN-to-hybrid transitions: only
      simulated curves (Supp. Fig. S1), no stated value; propagation and transition losses not separated (Supp. p.12). LN
      surface roughness 0.20 / 0.22 nm RMS (AFM, Supp. Fig. S2) not a registry parameter. SPDC photon pairs (CAR 1154 at 28
      kHz on-chip PCR, -40.0 dBm on-chip average pump, p.7 Fig. 6) not entered: platform of the SPDC device not stated and
      photon-pair metrics are not in the registry (D250). Phase matching at 1620 nm instead of the 1550 nm target, attributed
      to the LN thickness deviation (p.4). Thermo-optic phase-matching shift 0.18 nm/K (p.5, Fig. 5(d), 20-60 C) is printed
      as a property of "our platform"; the text does not name the device (Fig. 5(d) phase matching near 1560-1570 nm points
      to a foundry-platform device, in-house device at 1620 nm): not entered on either row (D159, audit lit_13).'
    why: 'platform: hybrid PPLN film on a Si3N4 strip (p.3 ''hybrid PPLN/SiN geometry''); merged precedents for LN on SiN
      (vanackere2023 transfer-printed LN coupon on SiN, churaev2023 bonded LN on SiN) use lnoi_loaded_sin, not other (rule
      11, D47); notes: D159 ruling on the 0.18 nm/K value'
  cmp_lit_vandekerckhove2025_ppln_sin_shg_foundry:
    platform: lnoi_loaded_sin
    notes: 'Author contributions: three authors fabricated the nonlinear waveguides (poling, transfer printing; p.9-10), all
      with the Ghent University - imec affiliation. Normalized efficiency eta = P_SH / (P_F^2 L^2) from on-chip powers obtained
      with the measured lensed-fiber coupling losses at both wavelengths (Methods p.9), L = 0.9 mm interaction length. Phase-matching
      3-dB bandwidth has no frequency_converter parameter (see registry gaps). 25 deg angled SiN-to-hybrid transitions: only
      simulated curves (Supp. Fig. S1), no stated value; propagation and transition losses not separated (Supp. p.12). LN
      surface roughness 0.20 / 0.22 nm RMS (AFM, Supp. Fig. S2) not a registry parameter. SPDC photon pairs (CAR 1154 at 28
      kHz on-chip PCR, -40.0 dBm on-chip average pump, p.7 Fig. 6) not entered: platform of the SPDC device not stated and
      photon-pair metrics are not in the registry (D250). SiN wafer developed and fabricated on imec''s 200 mm pilot line
      (acknowledgment and contributions, p.9-10): org_imec (niels2026 precedent). Dual-waveguide monitor / circuit pairs on
      four chips along one wafer radius show overlapping phase matching (Fig. 4(d), no numbers). Post-printing tuning (Fig.
      5(c), starting at 1560 nm): SiO2 deposition shifts phase matching down to 1520 nm, LN thinning (modified RCA-1) up to
      1590 nm; no frequency_converter tuning-range parameter. Simulated thickness sensitivity 2.8 nm per nm LN (Fig. 4(a))
      not entered. Thermo-optic phase-matching shift 0.18 nm/K (p.5, Fig. 5(d), 20-60 C) is printed as a property of "our
      platform"; the text does not name the device (Fig. 5(d) phase matching near 1560-1570 nm points to a foundry-platform
      device, in-house device at 1620 nm): not entered on either row (D159, audit lit_13).'
    why: as the in-house row (lnoi_loaded_sin precedent); notes record the D159 removal of m3
  cmp_lit_wang2026b_ppln_mrr_qfc:
    notes: 'No fab org: the chip is described as designed and fabricated in passive voice (p.4, p.8) and the authors sit at
      USTC units, the Jinan Institute of Quantum Technology and the Hefei National Laboratory (not unambiguous, D80b). Ring
      radius 74 um, coupler A bus 600 nm / gap 700 nm (signal + pump in), coupler B bus 300 nm / gap 390 nm (SF out); azimuthal
      orders ms 550, mp 875, msf 1584, poling order M 159 (p.7); radius_um, gap_nm and bus_width_nm are not allowed for frequency_converter
      (registry gap). Simulated coupling strengths kappa^2 (p.7, Supp. Note 1) not entered. Q values from a dedicated copy
      of the MRR on the same chip without the SF path (coupler-B ports 300 nm, p.9). On-chip noise ~7k cps at the maximum-QE
      point (p.11) has no parameter. Chip temperature 40.5 C (p.10). Hybrid chip 12 x 12 mm2 with a butt-coupled DFB pump
      (separate rows). On-chip quantum (photon-number) conversion efficiency QE = P_sf lambda_sf / (P_s lambda_s) of 57% at
      360 uW on-chip pump (p.10-11, Fig. 4(b)) and the Q-derived maximum ~70% (p.9) are photon-number efficiencies, not power
      ratios: not entered (power_conversion_efficiency_pct is a power ratio; registry gap, audit lit_13).'
    why: records the QE values removed from m8 / m9 (see delete_metrics)
