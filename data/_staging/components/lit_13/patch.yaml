      than 5.5 dB at -9 dBm (p.8 Sec. V-A, V-B); wavelength of the NF characterization (1302 nm, p.4-5) assumed for this reading
      of Fig. 2(c)
    why: p.8 Sec. V-B prints the value itself (5.45 dB vs PDFA 6.3 dB) for the same -9 dBm input; the < 5.5 dB bound is the
      rounded statement
  cmp_lit_abe2025_ppln_opa_wc-m1:
    parameter: power_conversion_efficiency_pct
    value: '1000'
    unit: '%'
    basis: derived
    condition: post-OPA (Tx) conversion gain = converted (idler) output / signal input, C/L-band WDM input converted to the
      U band; 50-GHz comb-like ASE bins; loss of other transmitter components considered; pump 1612.44 nm (EDFA-amplified
      LD) frequency-doubled to an 806.22 nm SH pump in a PPLN SHG module
    notes: printed 10 dB conversion gain (p.2); 100 x 10^(10/10) = 1000 %; Fig. 2 Tx gain about 8-10.5 dB across the band
    why: 'class ruling (component op): gain_db is not allowed for frequency_converter; the conversion gain is the converted-output
      / signal-input power ratio, stored like ding2022 CE (dB -> %, derived, D82d)'
  cmp_lit_abe2025_ppln_opa_wc-m3:
    parameter: power_conversion_efficiency_pct
    value: '1995'
    unit: '%'
    basis: derived
    condition: pre-OPA (Rx) conversion gain = converted output / signal input, U band converted back to the C/L band (output
      wavelengths); higher SH-pump power than Tx; pump 1612.44 nm (EDFA-amplified LD) frequency-doubled to an 806.22 nm SH
      pump in a PPLN SHG module
    notes: printed more than 13 dB (p.2); 100 x 10^1.3 = 1995 %; output range = the WDM source range 1553.53-1600.81 nm (p.3
      Sec. II-C); Fig. 2 Rx gain about 12.5-15 dB
