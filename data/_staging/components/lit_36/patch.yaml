components:
  cmp_lit_jiang2020_zipper_l15_tether:
    notes: 'Device of Fig. 2(b)-(d), Fig. 3 and Fig. 17 (four L = 15 um nanobenders attached through narrow tethers per the Fig. 2(b) caption; Fig. 3c and Fig. 17 state the same device as Fig. 2). Read in reflection via a reflector-terminated coupling waveguide (side-coupled active and control cavities). As printed (arXiv v1): the Fig. 2(e) tethered points near L = 15 um lie at about 2 nm/V, none near the 5 nm/V of this device (figure reading). fab: author contributions state W.J. and F.M.M. designed and fabricated the devices (both Stanford, p.9); facility: acknowledgements, device fabrication performed at SNSF and SNF (p.9). Not entered: mechanical Q about 20 (air damped; no parameter), mechanical resonances near 1 MHz (mech_resonance_khz not allowed for resonator), Vpi = kappa/(2 alpha_ac) about 1 mV (author computed, v_pi_v not allowed for resonator), 0.6 THz/V (same quantity as 5 nm/V), Fig. 2e tuning coefficients of >40 devices vs L (plot only).'
    why: 'p.4 Fig. 2(b) caption says tethered; p.4 Fig. 2(e) render: tethered (triangle) points at L = 15 um are about 1.6-2 nm/V, only an untethered point (L = 18 um) reaches about 5.5 nm/V; inconsistency recorded, values unchanged'
  cmp_lit_lischke2021a_ge100_10:
    notes: 'fab: author contributions, S.L. (IHP) designed and fabricated the photodiodes (p.9); fabrication entirely on IHP''s 8-inch BiCMOS pilot line (p.2, p.6). IHP''s own cleanroom is not a shared facility. Not entered: calculated fRC / fTT / f3dB (Table 1, model with assumed saturation velocity); bandwidth-efficiency product (registry gap); 1-dB bandwidths >60 GHz at -0.25 V and >67 GHz up to 3.2 mA photocurrent (no 1-dB PD bandwidth parameter); ''no saturation up to 2.5 mA at 8 dBm at the fibre tip'' (p.4; device not tied: Fig. 4c and 4d show both diodes); zero-bias ''>65 GHz'' summary (p.1, p.5; the p.3 statement >70 GHz at zero bias is entered); dark currents up to 125 C (Supplementary Fig. 2, not cached). Fig. 2(f) series-resistance range 8.3-9.2 ohm is printed jointly for both diodes and three chips (not per diode, D159); the per-diode value is taken from Table 1.'
    why: 'p.9 Author contributions (not p.2 / p.6); p.3 Fig. 2(f) label is one range for both diodes, see the series_resistance_ohm ops'
  cmp_lit_lischke2021a_ge150_10:
    notes: 'fab: author contributions, S.L. (IHP) designed and fabricated the photodiodes (p.9); fabrication entirely on IHP''s 8-inch BiCMOS pilot line (p.2, p.6). IHP''s own cleanroom is not a shared facility. Not entered: calculated fRC / fTT / f3dB (Table 1, model with assumed saturation velocity); bandwidth-efficiency product (registry gap); 1-dB bandwidths >60 GHz at -0.25 V and >67 GHz up to 3.2 mA photocurrent (no 1-dB PD bandwidth parameter); ''no saturation up to 2.5 mA at 8 dBm at the fibre tip'' (p.4; device not tied: Fig. 4c and 4d show both diodes); zero-bias ''>65 GHz'' summary (p.1, p.5; the p.3 statement >70 GHz at zero bias is entered); dark currents up to 125 C (Supplementary Fig. 2, not cached). Fig. 2(f) series-resistance range 8.3-9.2 ohm is printed jointly for both diodes and three chips (not per diode, D159); the per-diode value is taken from Table 1.'
    why: as cmp_lit_lischke2021a_ge100_10
  cmp_lit_lischke2021a_gc_1d_uniform:
    notes: 'fab: author contributions, S.L. (IHP) designed and fabricated the photodiodes (p.9); fabrication entirely on IHP''s 8-inch BiCMOS pilot line, GCs patterned in the same flow (p.2, p.6, p.8 Methods). IHP''s own cleanroom is not a shared facility. Test structure: two GCs joined by a short waveguide, measured on six chips (Fig. 4(b)). Peak not at 1550 nm (lower loss expected after optimization, p.4).'
    why: 'p.9 Author contributions; p.8 Methods: uniform 1D grating couplers realized with a second DUV lithography in the same process'
  cmp_lit_wilmart2020_gc_oband:
    notes: 'fab: the fabrication took place in the 200 mm CMOS-compatible pilot line of CEA-LETI (p.1 Sec. II). Paper states GC performance unchanged by the anneal. Not entered (D159): insertion loss ~2 dB and 1-dB bandwidth ~20 nm are printed once for ''the grating fiber coupler'' without saying they hold for both the O- and C-band designs (p.4 Sec. V). GC geometry not stated.'
    why: 'p.4 Sec. V: IL / bandwidth printed once, singular, after the per-band center wavelengths; the text does not state the values hold for each design (D159 / D254), see delete_metrics'
  cmp_lit_wilmart2020_gc_cband:
    notes: 'fab: the fabrication took place in the 200 mm CMOS-compatible pilot line of CEA-LETI (p.1 Sec. II). Paper states GC performance unchanged by the anneal. Not entered (D159): insertion loss ~2 dB and 1-dB bandwidth ~20 nm are printed once for ''the grating fiber coupler'' without saying they hold for both the O- and C-band designs (p.4 Sec. V). GC geometry not stated.'
