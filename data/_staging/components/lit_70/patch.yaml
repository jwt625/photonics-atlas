# Audit patch lit_70 (fresh-context audit 2026-11-02, DevLog/audits/2026-11-02-lit_70-audit.md).
# 265 metrics: 250 ok / 15 imprecise / 0 wrong; 27 components: 26 ok / 1 imprecise / 0 wrong; 2 ok components get a notes update.
# Misses: 12 metrics added (oser2019 interconnect width x5, marin2023 drop level x4, primiani2019 threshold, lasing wavelength, gain length).
# Not covered here (coordinator rulings): audit questions 1-6; registry gaps and missing orgs listed in the audit file.
components:
  cmp_lit_oser2019_cascade_10x250:
    notes: 'Shifted-teeth TE0-to-TE1 Bragg grating: back-reflection goes into TE1 and radiates in the single-mode section. Cached text is the arXiv v1 of this journal paper. E-beam + ICP etch (p.7). Single-mode sections, tapers and S-bends are named for this device (p.6), but their dimensions are stated only for the 50 um section series (400 nm x 20 um, 25 um tapers, 15 um radius S-bends, p.3); the 3.5 mm reference length leaves 1 mm outside the gratings (p.6). Hero device. Off-band insertion loss stated only as negligible within alignment and fabrication variability (p.6): no value. Back-reflection through a fiber circulator about -40 dBm, broad and flat without the Bragg signature (p.6; no parameter). Check: Fig. 4 shows the 3.5 mm reference waveguide near -13.5 dBm and the PD B floor near -88 dBm, about 74.5 dB apart, against the stated at least 80 dB; the paper does not give the arithmetic. Fig. 3 sets carry no labelled values, no rows; the text p.6 lists 4, 6, 8 sections of 100, 50, 25 um where the Fig. 3(b) legend has 4, 8, 16. Fab: D.O. and X.L.R. fabricated the samples (p.8 contributions), both at C2N (p.1): D395. Facility: fabrication performed at the Plateforme de Micro-Nano-Technologie/C2N, partly supported by the RENATECH network (p.8): neither in the registry, the C2N parent is not used as the facility (D80).'
    why: p.3 gives the interconnect dimensions in the paragraph on the 50 um section series (total lengths 50-500 um); p.6 does not restate them for the 250 um section device
  cmp_lit_primiani2019_bragg_11th_4mm:
    notes: 'Width 2.9 to 3.1 um in the corrugation; tooth length 263 nm on the mask. Chip 9 mm with mode size adapters and a tilted input bend; reflection measured with a high-resolution OSA, circulator and a 4 um MFD lensed fiber (p.2). Abstract rounds the stopband to 0.2 nm. Peak near 1543.93 nm (Fig. 3); Fig. 4 has the Bragg wavelength near 1543.2 nm at 20 C and reaches 1543.93 nm only near 75 C, and the heater state of the Fig. 3 spectrum is not stated. Used as the mirror of cmp_lit_primiani2019_dbr_ecl (D396). Not allowed for reflector (report): thermal dependence 15 pm/C (p.2), tuning about 1.5 nm over 20-120 C (Fig. 4, p.1), heater power 1.98 W to reach 120 C (p.3), Bragg wavelength, heater 10 nm Ti + 100 nm TiN, 6 um wide (p.2), suspended waveguide variant (Fig. 1; whether the measured grating was suspended is not stated). Fitted material values dnSi3N4/dT 2.51e-5 and dnSiO2/dT 1.26e-5 per K (p.3): no parameter. Fab: the acknowledgment states the staff of the LETI silicon platform fabricated the passive devices (p.4).'
    why: records the p.2 Fig. 3 vs Fig. 4 mismatch behind the m2 condition fix
  cmp_lit_primiani2019_dbr_ecl:
    notes: 'Cavity between the R-SOA back facet and the Bragg grating (cmp_lit_primiani2019_bragg_11th_4mm); R-SOA fabricated by III-V Lab (p.3); passive chip per the acknowledgment (p.4). Coupling: cmp_lit_primiani2019_rsoa_to_sin_butt. Threshold has no printed value: m10 is read at the L-I onset of Fig. 7(a). Target below 17 kHz (p.4) not entered.'
    why: keeps the notes consistent with the added threshold row m10 (p.4 Fig. 7(a))
