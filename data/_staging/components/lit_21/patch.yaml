components:
  cmp_lit_fang2021_sbs_ito_ring_switch:
    notes: 'Ring switch with an on-chip ITO heater over the Sb2S3 (Fig. 4(a)-(b)); this row holds the ring-level response (non-volatile SET shift, transmission contrast); the Sb2S3 / ITO phase-change cell of the same device is cmp_lit_fang2021_sbs_ito_cell (D396; jayatilleka2021 / song2016 ring + cell precedent), which holds the SET power and the cell length. Fabrication: author contributions (p.21) state that Z.F. fabricated the devices; all authors at the University of Washington (fab_org_ids per D72 / D80b). Part of the work was conducted at the Washington Nanofabrication Facility / Molecular Analysis Facility (p.21): org missing from the registry, facility_org_ids left empty. Not entered: endurance not reported; ring radius not stated for this device; simulated shift 0.456 nm (Fig. S1, supplement not cached); 0.48 nm for the fully etched waveguide (p.13) is the per-length fit applied to 8 um, not a separate device.'
    why: 'D396: the electrically actuated Sb2S3 / ITO cell is characterized in its own right (SET power 13 mW, 8 um cell, p.13 Sec. 2.3); cell-level values move to a phase_shifter.phase_change row, ring-level values stay here'
