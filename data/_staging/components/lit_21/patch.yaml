add_components:
- component_id: cmp_lit_fang2021_sbs_ito_cell
  source_id: lit:fang2021
  class: phase_shifter.phase_change
  label: Electrically switched Sb2S3 phase-change cell, 8 um x 20 nm under a 200 nm ITO heater, in the rib-SOI ring switch, C-band
  row_kind: fabricated
  platform: soi_rib
  core_material: Si 220 nm rib, 140 nm etch / 80 nm slab, 3 um BOX; 20 nm Sb2S3 + 200 nm ITO sputtered without breaking vacuum (lift-off); Au/Cr 60/30 nm pads
  fab_org_ids: org_university_washington
  tags: phase_change;sb2s3;non_volatile;ito_heater
  verified_on: '2026-10-29'
  notes: 'Phase-change tuning cell of cmp_lit_fang2021_sbs_ito_ring_switch (one physical device, two classes, D396): this row holds the cell-level electrical actuation (SET power, cell length, ITO heater), the ring row the optical response (0.4 nm non-volatile shift, > 30 dB contrast). Fabrication: author contributions (p.21) state that Z.F. fabricated the devices; all authors at the University of Washington (fab_org_ids per D72 / D80b). Part of the work was conducted at the Washington Nanofabrication Facility / Molecular Analysis Facility (p.21): org missing from the registry, facility_org_ids left empty. Not entered: RESET by a 6 V, 200 ns square pulse with 8 ns trailing edge (slight blue shift; RESET spectrum does not overlap the original, p.14-15; no pulse parameter); simulated PCM temperature 650 K (Fig. S1, supplement not cached); endurance not reported.'
  why: 'D396 (one row per class for one physical device) and the jayatilleka2021 / song2016 precedents (ring row + tuning-cell row): p.12-13 Sec. 2.3 characterizes the ITO-heated Sb2S3 cell electrically (SET at 13 mW in a 0-1 V sweep, Fig. 4(d) inset I-V / power)'
