# (pruessner2016 "phase shifts as large as 3 pi", Fig. 4 caption). After the patch: 12 components, 72 metrics.
# Coordinator rulings asked (audit Q1-Q8): all distiller judgment calls (a)-(h) kept as distilled (no op) except the notes
