    notes: 'Wavelength: measured with the single-mode VCSEL tuned ''around 850 nm'' (849.03-850.64 nm tuning range, p.3; setup
      p.4 Sec. IV), a stated measurement wavelength (D393; D676 ye2014). Read off Fig. 7 (BS3, 0.9 um, filled circle at 50
      um), reading uncertainty about +/- 0.02; P2 about 0.58.'
    why: 'p.4 Sec. IV: every characterization used the VCSEL tuned ''around 850 nm'' (range 849.03-850.64 nm, p.3); a stated
      measurement wavelength, not an inferred band (D393; D676 ye2014 ''tested with a 2 um laser''); the batch treats the
      zhuang2011 1550 nm setup laser the same way'
  cmp_lit_samusenko2016_ring_bs3_water-m1:
    wavelength_nm: '849.52'
    notes: Unqualified Q of the Lorentzian fit (q_loaded). Wavelength read from the figure axis (resonance position, Fig.
      10 BS3 dip about 849.52 nm, +/- 0.01 nm).
    why: 'p.7 Fig. 10 (img_p07_2 raster): the BS3 water resonance dip sits right of the 849.5 nm tick, about 849.52 nm (849.49
      was on the wrong side of the tick)'
  cmp_lit_samusenko2016_ring_bs3_water-m2:
    wavelength_nm: '849.52'
    notes: Printed ER; stored as a positive magnitude.
    why: 'p.7 Fig. 10 (img_p07_2 raster): the BS3 water resonance dip sits right of the 849.5 nm tick, about 849.52 nm (849.49
      was on the wrong side of the tick)'
  cmp_lit_samusenko2016_bends_bs1_w900-m3:
    locator: p.2 Sec. II.A; p.5 Table II
    why: Fig. 5 shows sample BS3 only (caption, p.5); the BS1 / BS2 widths are the Table II nominal columns
  cmp_lit_samusenko2016_bends_bs1_w1000-m4:
    locator: p.2 Sec. II.A; p.5 Table II
    why: Fig. 5 shows sample BS3 only (caption, p.5); the BS1 / BS2 widths are the Table II nominal columns
  cmp_lit_samusenko2016_bends_bs2_w900-m3:
    locator: p.2 Sec. II.A; p.5 Table II
    why: Fig. 5 shows sample BS3 only (caption, p.5); the BS1 / BS2 widths are the Table II nominal columns
  cmp_lit_samusenko2016_bends_bs2_w1000-m4:
    locator: p.2 Sec. II.A; p.5 Table II
    why: Fig. 5 shows sample BS3 only (caption, p.5); the BS1 / BS2 widths are the Table II nominal columns
  cmp_lit_samusenko2016_ring_bs3_teos-m2:
    notes: 'Extracted intrinsic Q (printed 3.8e5). The over-coupled regime is determined from the paper''s own data: Fig.
      11 places this ring (red labels: ER about -2.8 dB, Q 4.6e4 at 35 um) on the over-coupled side of the coupling-length
      series, whose critical coupling lies at about 10-20 um (p.7); derived, not author_estimate (D403). Extraction formula
      not printed; the over-coupled relation Q_i = 2 Q_L / (1 - sqrt(T_min)) with the Fig. 9 dip (T_min about 0.52) gives
      about 3.3e5, the same order as the printed value (the fit includes a Fabry-Perot term).'
    why: 'notes: record the regime evidence (Fig. 11 red labels = this BS3 ring) and the consistency check'
  cmp_lit_samusenko2016_ring_bs2_teos-m2:
    notes: 'Extracted intrinsic Q (printed 4.5e5). Regime evidence for BS2 is indirect: the Fig. 11 red labels are the BS3
      circuit ring; the text calls the circuit resonators over-coupled because of the long 35 um coupling zone (p.7), and
      the BS2 directional couplers are over-coupled at every tested length (Fig. 7, p.6). Kept derived (D403, regime from
      the paper''s own data); author_estimate is the strict alternative. Extraction formula not printed; the over-coupled
      relation Q_i = 2 Q_L / (1 - sqrt(T_min)) with the Fig. 9 dip (T_min about 0.66) reproduces about 4.6e5.'
    why: 'notes: the Fig. 11 regime evidence covers the BS3 ring only; record the indirect BS2 evidence and the check'
  cmp_lit_jin2017_sin_ring_r580-m2:
    locator: p.1 Abstract; p.2 Conclusion; p.2 Fig. 3; p.2 Fig. 4
    notes: 'Resonance ''tuned by a full FSR'' at 16 V (abstract, conclusion); value = the Fig. 3 FSR label 0.412 nm. Data
      check: the Fig. 3 86 um points reach about -0.38 nm at 15 V/um and the Fig. 4 TM dip moves about 0.39 nm from 0 to 15
      V (about 1550.07 -> 1549.68 nm); 16 V is not plotted, so the full FSR at 16 V rests on the text. The results text says
      ''pi phase shift'' at 16 V (inconsistent; component notes).'
    why: 'p.2 Fig. 3 / Fig. 4 renders: the plotted data stop at 15 V (0.38-0.39 nm, about 0.93 FSR); the note must say the
      16 V full-FSR value comes from the text, not the figure'
add_components:
- component_id: cmp_lit_samusenko2016_ring_lc_series
  source_id: lit:samusenko2016
  class: resonator.ring
  label: SiON racetrack ring series R 100 um, coupling length 0-54 um (coupling-regime test set), 850 nm
  row_kind: fabricated
  host_device_ids: ''
  platform: sion
  core_material: PECVD SiON, bulk index 1.66, RIE-patterned, annealed 1050 C 1.5 h, on 4 um thermal SiO2 on Si (p.4); wafer
    (BS1 / BS2 / BS3) and cladding of the series not stated
  cladding: ''
  fab_org_ids: ''
  facility_org_ids: ''
  process_name: ''
  test_structure: 'true'
  tags: racetrack;coupling_series;biosensing
  verified_on: '2026-11-24'
  notes: '''several rings with the radius of curvature of 100 um and different coupling lengths'' characterized to find the
    coupling regime (p.7, Fig. 11); critical coupling at about 10-20 um. Separate physical rings from the four circuit rings
    (the BS3 circuit ring is the red label at 35 um, entered on cmp_lit_samusenko2016_ring_bs3_teos). Wafer, cladding (TEOS
    or water) and polarization of the series not stated: values are attached to this set only, never to a BS row (D159). Q
    is the unqualified ''Quality factor'' of the figure (q_loaded). Fab: passive ''The devices were fabricated'' (p.4 Sec.
    III); acknowledgment thanks the ''MNF Facility of Fondazione Bruno Kessler, Centre for Materials and Microsystems, for
    device fabrication'' (p.8), a stated place of fabrication (D448), but neither Fondazione Bruno Kessler nor its MNF facility
    is in the registry: fab and facility empty, reported.'
  why: 'miss: Fig. 11 (p.7) prints measured Q and ER for eight coupling lengths of a distinct, identifiable test set; the
    series holds the paper''s highest measured Q (about 2.7e5 at 0 um); unknown wafer / cladding is a stack gap, not an ambiguity
    between two components (D159 does not bite), recorded in notes'
