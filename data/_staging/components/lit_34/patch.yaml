    class: mode_converter.converter
    notes: 'Fab: carried out by K.H. and P.B. (Univ. Grenoble Alpes, CEA, LETI) and J.-A.D. (Vistec Electron Beam GmbH, not in the registry) on a 200 mm SOI pilot line (p.6 Author contributions; p.4 Experiments and Methods); fabricators at two orgs named in the contributions -> both orgs (D80b); fab_org_ids holds CEA-Leti only until the Vistec Electron Beam org exists. The paper calls it an integrated metalens (quarter-period GRIN lens) and treats it as a mode converter from a 3 um multimode to a 350 nm single-mode waveguide (p.2); classed mode_converter.converter (in-plane guided waveguide-to-waveguide conversion, audit lit_34). Strip period 250 nm and fill factor 0.2-0.8 not entered (subwavelength_period_nm / fill_factor not allowed for mode_converter, registry gap). Several lengths measured (Fig. 5(b)); the experimental optimum is 2.3 um vs FEM 2.022 um (within 15%).'
    why: 'p.2 Results: the device is a mode converter between a multimode and a single-mode waveguide (in-plane, guided); registry micro_optics subtypes are beam-shaping optics to fiber / PD / free space (all merged micro_optics.metalens rows are free-space metasurfaces); merged in-plane SWG / reflector converters are mode_converter.converter (bock2010, hung2020, morenopozas2025)'
