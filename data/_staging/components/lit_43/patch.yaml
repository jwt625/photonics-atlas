# Audit patch lit_43 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_43-audit.md).
# 117 metrics: 111 ok / 5 imprecise / 1 wrong; 22 components: 20 ok / 2 changed / 0 deleted; 1 miss added.
# Not covered here (coordinator / registry): TIA Super Clean Room of AIST and Southampton Nanofabrication Centre
# registry rows (facility), registry gaps listed in the audit file.
components:
  cmp_lit_ikeda2020_wss_2x2_16ch:
    notes: "Sixteen 2x2 single-channel WSSs with different Bragg wavelengths cascaded (p.2 Fig. 2); DC-based polarizer at each input and output port. Each channel passes one MZ switch, two dropping C-DCs and 15 non-dropping C-DCs (p.4). WSS channel 3-dB bandwidth 4.2 nm (16-ch average, p.1 Abstract, p.5 Sec. 3, Fig. 5; per channel about 2.8-5.8 nm, wider at longer wavelength) not entered: it is read from the fiber-to-fiber WSS spectra (Fig. 4), i.e. the passband of the drop path (two C-DCs and the MZ switch), and bw_3db_nm is not allowed for switch_fabric (registry gap; D407). C-DC loss 0.20 dB (p.5) computed from the MZ switch loss 0.13 dB cited from ref. [4]: not entered (rule 3). Chip fabricated using the authors' 300-mm CMOS R&D foundry with 45-nm ArF immersion lithography (p.3; all authors AIST): fab AIST (D84a). Device fabrication supported by TIA Super Clean Room of AIST (p.8 Acknowledgments): not in the registry, facility empty (reported)."
    why: "p.5 Sec. 3: the 3-dB bandwidth is one of the Fig. 5 quantities 'read from Fig. 4' (fiber-to-fiber WSS spectra); p.1 Abstract lists it with the WSS 16-ch averages; the drop path contains two dropping C-DCs and the MZ switch (p.4), so it is not a single C-DC passband: moved from the C-DC row to this note (D407, coordinator question)"
  cmp_lit_ikeda2020_cdc:
    notes: "Add-drop filter of the WSS; anti-reflection pi phase shift between the gratings on the two sidewalls of each waveguide (p.2). Corrugation (modulation) depths dW1 / dW2 40 / 60 nm (Table 1) not entered: no registry parameter (gap). The 16-ch average 3-dB bandwidth 4.2 nm is a WSS drop-path value (see cmp_lit_ikeda2020_wss_2x2_16ch notes), not entered here. 2D FDTD width-apodization study (Fig. 9) gives spectra without numbers. Chip fabricated using the authors' 300-mm CMOS R&D foundry with 45-nm ArF immersion lithography (p.3; all authors AIST): fab AIST (D84a). Device fabrication supported by TIA Super Clean Room of AIST (p.8 Acknowledgments): not in the registry, facility empty (reported)."
    why: "follows the deletion of cdc-m1 (WSS passband, p.5 Sec. 3 'read from Fig. 4'); the C-DC keeps its Bragg-wavelength range (added m7) as performance metric"
