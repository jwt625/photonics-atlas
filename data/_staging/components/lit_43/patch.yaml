  cmp_lit_ikeda2020_dc_polarizer-m1:
    condition: "printed per path; each path has an input and an output polarizer, and the loss breakdown (6.5 - 1.46 - 1.2 = 2 x 1.92 dB; 8.6 - 2 x 1.92 - 1.2 = 3.56 dB) uses 1.2 dB once per path"
