    notes: "printed P2pi 50.7 mW, evaluated on the fabricated CAT and stated as the same for both heater lengths (p.11); stored per 2 pi as printed, not halved. C-band inferred: measured spectra axis 1520-1580 nm (Fig. 14); channel wavelengths not stated in the text"
    why: "p.11 Sec. 4 prints the 2 pi value; the registry has no dedicated per-2pi parameter, tuning_power_mw ('for the stated range') holds per-2pi heater powers in merged rows (li2026 opa_tops-m1, ofc2026 w4k3 flm_tops-m1, gao2019 m5); keeps the printed number instead of a derived halving (skill pitfall per 2 pi vs per pi, coordinator question)"
