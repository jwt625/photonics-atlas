    why: as heater_400um-m1 (p.11 Sec. 4 'regardless of the lengths')
  cmp_lit_akiyama2021_cat_sim-m1:
    locator: "p.1 Abstract; p.10 Sec. 3, Fig. 11"
    notes: "printed range -50 to -40 dB (abstract), stated for the proposed demultiplexers; Fig. 11 (100 GHz spacing, round-top CAT) plots means of about -59 to -52 dB with standard-deviation bars over hundreds of Monte-Carlo trials, and the text says as small as < -50 dB for a wide range of channel counts (p.10): the abstract range is wider than the Fig. 11 means and which configurations it covers is not stated"
    why: "p.10 Fig. 11 render: means about -59 (4 ch) to -52 dB (64 ch), not -50 to -40 dB; the note implied Fig. 11 carries the abstract range"
  cmp_lit_akiyama2021_cat_sim-m2:
