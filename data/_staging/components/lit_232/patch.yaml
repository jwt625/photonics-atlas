components:
  cmp_lit_yen2020_ft_mzi_cwdm_demux:
    notes: 'Each MZI combines a wide (650 nm, L1 23.250 um) and a narrow (450 nm, L2 8.014 um) arm section so that dneff/dw cancels (Eq. (5)); identical tapers on both arms; S1 stages FSR 40 nm, S2 stages FSR 80 nm; multi-section MZIs with directional couplers of design cross coupling 0.5, 0.3, 0.23, 0.17, 0.05 (Fig. 5(b), p.6; 14 DCs and 10 MZIs per path, designed for 1550 nm). Channel grid 1510 / 1530 / 1550 / 1570 nm. Fabricated ''using a CMOS-compatible process with 193-nm deep ultraviolet (DUV) lithography provided by a foundry'' (p.5); foundry not named; mask replicated on an 8-inch multi-project wafer (p.6). Acknowledgment: ''chip fabrication support provided by OCP Asia, MOLEX'' (p.8): MPW / fabrication-support org (D398 role) not in the registry, fab left empty and reported. TSMC appears only as a funding source (Joint Development Project, p.1), not as fab. Cladding of the fabricated chip not stated (the mode simulation assumes 2 um upper and lower oxide, p.2). Polarization not stated. I/O: a pair of broadband edge couplers with a single-mode lensed fiber (p.5; no coupler values). The paper extends the authors'' preliminary conference report (ref. [25], p.2); values here are this paper''s own. Channel numbering: Fig. 5(a) / Fig. 6 label 1550 nm as CH2, 1570 nm as CH3 and 1530 nm as CH4, and the Fig. 7(a)(b) panel titles (CH.1 / CH.4 / CH.2 / CH.3 over the 1510 / 1530 / 1550 / 1570 nm arrows) follow the same numbering, while the Fig. 7(c) legend maps CH2 / CH3 / CH4 to 1530 / 1550 / 1570 nm (each wavelength keeps its colour in every figure, so the legend renumbers in wavelength order). The p.6 observation (one die, Fig. 6) of lower crosstalk over 1550-1570 nm for both designs agrees with Table I under the Fig. 5(a) numbering (regular 21.4 / 20.9 dB at 1550 / 1570 nm vs 16.3 dB at 1530 nm) and not under the Fig. 7(c) legend (16.3 dB at 1570 nm). The paper does not state which numbering Table I uses, so Table I channels 2-4 are entered with the 1530-1570 nm span and the channel label, not one wavelength. Cross-note: cmp_lit_yen2020_regular_mzi_cwdm_demux (reference circuit on the same chips).'
    why: p.6 Fig. 7(a)(b) panel titles and the p.6 crosstalk observation (1550-1570 nm) also bear on the Table I channel mapping; the note named only Fig. 5(a) / Fig. 6 vs the Fig. 7(c) legend
  cmp_lit_yen2020_regular_mzi_cwdm_demux:
    notes: 'Reference circuit with identical arm widths (450 nm) and the same phase shifts / FSRs, fabricated on the same chips (p.5). Fabricated ''using a CMOS-compatible process with 193-nm deep ultraviolet (DUV) lithography provided by a foundry'' (p.5); foundry not named; mask replicated on an 8-inch multi-project wafer (p.6). Acknowledgment: ''chip fabrication support provided by OCP Asia, MOLEX'' (p.8): MPW / fabrication-support org (D398 role) not in the registry, fab left empty and reported. TSMC appears only as a funding source (Joint Development Project, p.1), not as fab. Cladding of the fabricated chip not stated (the mode simulation assumes 2 um upper and lower oxide, p.2). Polarization not stated. I/O: a pair of broadband edge couplers with a single-mode lensed fiber (p.5; no coupler values). The paper extends the authors'' preliminary conference report (ref. [25], p.2); values here are this paper''s own. Same channel-numbering ambiguity as cmp_lit_yen2020_ft_mzi_cwdm_demux for Table I channels 2-4 (that row''s notes give the evidence: Fig. 5(a), Fig. 6 and the Fig. 7(a)(b) panel titles use CH2 = 1550, CH3 = 1570, CH4 = 1530 nm; only the Fig. 7(c) legend differs).'
    why: 'p.5-6 Figs. 5(a), 6, 7(a)(b): pointer to the channel-mapping evidence added to the companion row'
