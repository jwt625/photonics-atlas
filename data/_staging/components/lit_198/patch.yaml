metrics:
  cmp_lit_dai2012_mzi_pbs-m6:
    notes: "Read off Fig. 3(a) at 1.54 um (TE highest-ER wavelength) from the PDF vector trace: local mean -1.67 dB within +/-1 nm (-1.46 dB within +/-4 nm); Fabry-Perot ripple about +/-0.8 dB (trace -0.7 to -2.3 dB within +/-4 nm). Normalization by a separate straight waveguide: the normalized traces reach about 0 dB (TE through max -0.04 dB, TM cross +0.17 dB near 1.564 um), so the reference error is at least about 0.2 dB. The paper prints no insertion-loss number."
    why: "notes imprecise: printed ripple range (-1.0 to -2.8 dB) does not match the Fig. 3(a) vector trace (-0.7 to -2.3 dB within +/-4 nm of 1.54 um); value 1.7 confirmed (p.3 Fig. 3(a))"
  cmp_lit_dai2012_mzi_pbs-m7:
    value: "1.8"
    notes: "Read off Fig. 3(a) at the 1.55 um design wavelength from the PDF vector trace: local mean -1.75 / -1.87 / -1.80 dB within +/-0.5 / 1 / 2 nm (-1.54 dB within +/-4 nm); ripple about +/-1 dB (trace -0.5 to -2.5 dB within +/-4 nm). Normalized by a separate straight waveguide (reference error at least about 0.2 dB, see m6). The paper prints no insertion-loss number."
    why: "value imprecise: 2.0 dB is above every local mean of the Fig. 3(a) vector trace at 1.55 um (1.75-1.87 dB within +/-0.5-2 nm); ripple range in notes (-1.3 to -2.5 dB) corrected to -0.5 to -2.5 dB (p.3 Fig. 3(a))"
  cmp_lit_dai2012_mzi_pbs-m8:
    notes: "Read off Fig. 3(b) at the 1.55 um design wavelength from the PDF vector trace: local mean -1.59 dB within +/-1 nm (-1.30 / -1.26 dB within +/-2 / 4 nm); ripple about +/-1.2 dB (trace -0.2 to -2.5 dB within +/-4 nm). Normalized by a separate straight waveguide (reference error at least about 0.2 dB, see m6). The paper prints no insertion-loss number."
    why: "notes imprecise: ripple range (-0.5 to -1.9 dB) does not match the Fig. 3(b) vector trace (-0.2 to -2.5 dB within +/-4 nm of 1.55 um); value 1.4 confirmed (p.3 Fig. 3(b))"
  cmp_lit_dai2012_mzi_pbs-m9:
    notes: "Read off Fig. 3(b) at 1.59 um from the PDF vector trace: local mean -3.43 dB within +/-1 nm (-3.26 dB within +/-4 nm); ripple about +/-0.8 dB (trace -2.2 to -3.9 dB within +/-4 nm). Normalized by a separate straight waveguide (reference error at least about 0.2 dB, see m6). p.3 states that the insertion loss becomes high at the TM central wavelength."
    why: "notes imprecise: ripple range (-2.9 to -3.7 dB) does not match the Fig. 3(b) vector trace (-2.2 to -3.9 dB within +/-4 nm of 1.59 um); value 3.4 confirmed (p.3 Fig. 3(b))"
