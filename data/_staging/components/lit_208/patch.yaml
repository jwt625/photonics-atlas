# Audit patch lit_208 (fresh-context audit 2026-11-18, DevLog/audits/2026-11-18-lit_208-audit.md).
# 85 metrics: 84 ok / 1 imprecise (notes) / 0 wrong; 9 components: 5 ok / 4 imprecise (2 platform + process_name + notes,
# 2 notes only) / 0 wrong; no misses added. After the patch: 9 components, 85 metrics.
# Coordinator questions (audit Q1-Q7): Q1 kim2017 one row, headline -0.078 dB kept (notes add Fig. 6 support); Q2 celo2017
# one row per layout kept, platform soi_strip; Q3 celo2017 crosstalk ge kept, 32 mdB notes only; Q4 chen2012 crossing.mmi kept;
# Q5 noe2016 in scope, row kept (delete the component if D259 covers the recap sentence); Q6 tolerance rows kept;
# Q7 EOSPACE org round.
components:
  cmp_lit_celo2017_wgx_mmi_crossing:
    platform: soi_strip
    process_name: MPW runs on 200 mm SOI wafers, 193 nm and 248 nm non-immersion lithography
    notes: 'Layout without serifs at the four internal corners (Fig. 3(a)); minimum gap inside the opening nominally 150 nm (p.1). Fab empty: ''a multi-project wafer of a silicon photonics research foundry''
      with no foundry named (p.1 Sec. I-II; D433); authors at Huawei Technologies Canada and Huawei Technologies (Shenzhen). process_name is the printed flow (p.1 Sec. II); the research foundry is not named.
      Platform soi_strip: the crossings are fully-etched silicon (p.1 Sec. I, D434); the 500 nm connecting waveguide is called a single-mode ridge waveguide (p.1 Sec. II). Test structure: 250 crossings
      in series joined by 500 nm single-mode ridge waveguide, unused ports beam-dumped, normalized to a reference waveguide of identical length and bends, GC array I/O; loss per crossing = normalized total
      / number of crossings (p.1-2 Sec. II). Crosstalk into TE0 of the crossing waveguide via a victim interferometer from two crossings (Fig. 4). Measurement error +/-8 mdB (p.2). Simulation result 32
      mdB ''for a perfectly fabricated crossing'' (p.2 Sec. IV) not entered: not tied to wgx or wgxs (D159). Printed energy-loss percentages not entered: 43 mdB ''1 %'' matches the dB value (0.99 %), 26
      mdB ''0.06 %'' does not (26 mdB = 0.6 %; printed slip, p.2 Sec. III). Fig. 6 caption reads ''Measured loss per crossing'' but the plot is crosstalk.'
    why: 'p.1 Sec. I ''MMI crossings comprising fully-etched silicon'': platform soi_strip (D434, D459 su2017, lit_199 lu2017); process_name held the distiller comment ''(research foundry not named)'',
      moved to notes (Contract v7: process_name as printed, shown in the benchmark tooltip); p.2 Sec. III: 43 mdB = 0.99 % matches the printed ''1 %'', only the 26 mdB ''0.06 %'' is inconsistent'
  cmp_lit_celo2017_wgxs_mmi_crossing_opc:
    platform: soi_strip
    process_name: MPW runs on 200 mm SOI wafers, 193 nm and 248 nm non-immersion lithography
    notes: 'Same layout as wgx plus serifs at the four intersecting internal corners (Fig. 3(b)); serifs from a rule-of-thumb design of experiments. The 6-die cross-wafer value and the 19 mdB optimum are
      assigned here: they follow the OPC sentences and the abstract states the OPC loss as < 30 mdB (p.1, p.2); lithography not stated for them. Abstract ''< 30 mdB'' and wavelength dependence ''around
      +/-5 mdB'' over the C band not entered as rows (summary of the same data; +/- half-span form). Fab empty: ''a multi-project wafer of a silicon photonics research foundry'' with no foundry named (p.1
      Sec. I-II; D433); authors at Huawei Technologies Canada and Huawei Technologies (Shenzhen). process_name is the printed flow (p.1 Sec. II); the research foundry is not named. Platform soi_strip: the
      crossings are fully-etched silicon (p.1 Sec. I, D434); the 500 nm connecting waveguide is called a single-mode ridge waveguide (p.1 Sec. II). Test structure: 250 crossings in series joined by 500
      nm single-mode ridge waveguide, unused ports beam-dumped, normalized to a reference waveguide of identical length and bends, GC array I/O; loss per crossing = normalized total / number of crossings
      (p.1-2 Sec. II). Crosstalk into TE0 of the crossing waveguide via a victim interferometer from two crossings (Fig. 4). Measurement error +/-8 mdB (p.2). Simulation result 32 mdB ''for a perfectly
      fabricated crossing'' (p.2 Sec. IV) not entered: not tied to wgx or wgxs (D159). Printed energy-loss percentages not entered: 43 mdB ''1 %'' matches the dB value (0.99 %), 26 mdB ''0.06 %'' does not
      (26 mdB = 0.6 %; printed slip, p.2 Sec. III). Fig. 6 caption reads ''Measured loss per crossing'' but the plot is crosstalk.'
    why: 'p.1 Sec. I ''MMI crossings comprising fully-etched silicon'': platform soi_strip (D434, D459 su2017, lit_199 lu2017); process_name held the distiller comment ''(research foundry not named)'',
      moved to notes (Contract v7: process_name as printed, shown in the benchmark tooltip); p.2 Sec. III: 43 mdB = 0.99 % matches the printed ''1 %'', only the 26 mdB ''0.06 %'' is inconsistent'
  cmp_lit_kim2017_slot_mt_mmi_intersection:
    notes: 'Design-only: 3D FDTD (Lumerical FDTD Solutions, mode-expansion monitors), TEs slot mode launched at 1550 nm (p.5 Sec. 2); no fabrication (p.10: could be fabricated with 193 nm lithography, ref.
      [27]). Mode transformer: rails linearly widened from 260 nm to (wM/2 - 50 nm) over lT = 3 um; slot terminates (Si-filled) at lS = 2.05 um from the slot end (p.3 Sec. 2, p.8). Footprint 79.2 um2 =
      (2 lT + lM)^2 = 8.9 um squared. Table 2 throughput 0.984 (linear) for wM 1.7 um (-0.070 dB) differs from the printed -0.078 dB headline (p.8, Table 3); headline kept: Fig. 6(c) at r_b = 0 reads about
      -7.78 x 10^-2 dB and Fig. 6(d) at delta-w = 0 about -0.078 dB, Fig. 6(a) about -0.08 dB at 1.55 um (p.9), so the figures support -0.078 dB, not the Table 1 / Table 2 0.984. Not entered: the other
      designs of the Table 1 (lT / lS sweep at wM 1.7 um) and Table 2 (wM 1.4-1.9 um, peak linear throughput 0.956-0.987) optimization sweeps (design-space points, judgment); reflectance -30 dB at 1550
      nm (Table 3) and < -29 dB over 1500-1600 nm (p.8-9): no reflection parameter for crossing (registry gap); blunt-corner deltas (r_b 0-50 nm: throughput +0.003 dB, crosstalk -0.25 dB, reflectance -1.8
      dB, p.9-10, Fig. 6(c)); comparison values of refs. [19]-[21] (p.3, Table 3; rule 3).'
    why: 'p.9 Fig. 6(a), (c), (d): the throughput at the nominal design reads about -0.078 dB, corroborating the kept headline against the Table 1 / 2 linear 0.984 (judgment (a)); notes only'
  cmp_lit_noe2016_eospace_sbc_pol_transformer:
    notes: 'Purchased device: ''a commercial polarization transformer (EOSPACE)'' (p.1 Sec. II.A); vendor EOSPACE is the fab org under rule 12 but is missing from the registry (reported), so fab_org_ids
      is empty. 8 integrated-optical SBCs, each driven by two voltages; used with an FPGA gradient-algorithm controller (p.1). The paper reviews the authors'' earlier work: tracking speeds (100 / 140 krad/s),
      > 350 Grad tracked, -40 dB average extinction at 1 krad/s and the wavelength / temperature results are attributed to refs. [6], [7], [11]-[15] and not entered (rule 3, D259); tracking speed (rad/s)
      also has no registry parameter. Fig. 1 ''7 um'' label not tied to a dimension (D156). Novoptel EPS1000 scrambler and receivers are setup equipment (rule 13). The ''~3 dB'' loss (p.6 Sec. IV) has no
      citation, but it sits in the conclusion''s recap list whose other items (up to ~100 krad/s, > 350 Grad) are the cited results of refs. [6], [7]; kept as an uncited own statement (author_estimate);
      delete this component if D259 is applied to the whole recap sentence (it has no other metric).'
    why: 'p.6 Sec. IV: context of the only metric (recap sentence mixing cited and uncited values) recorded for the coordinator ruling (audit Q5); notes only'
metrics:
  cmp_lit_noe2016_eospace_sbc_pol_transformer-m1:
    notes: Printed 'features low loss (~3 dB)' for endless polarization control with the LiNbO3 device (p.6 Sec. IV); origin (own measurement or datasheet) and reference planes not stated; no wavelength
