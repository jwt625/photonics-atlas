# Audit patch lit_05 (fresh-context audit 2026-10-22, DevLog/audits/2026-10-22-lit_05-audit.md).
# 297 metrics: 279 ok / 18 imprecise / 0 wrong; 47 components: 43 ok / 4 imprecise / 0 wrong; 6 misses added.
# Not covered here (coordinator decisions, see the audit file): ams AG / NRC Canada registry rows (nevlacsil2020 fab),
# crossing.mmi template primary (excess_loss_db) vs crossing_loss_db, registry gaps.
components:
  cmp_lit_bock2010_swg_crossing_400:
    core_material: 'Si 260 nm on 2 um BOX (commercial SOI); single-etch SWG segments; SEM fabrication bias 50 nm (p.6-7); the SEM SWG dimensions (pitch 300 nm, segment width 250 nm, duty cycle 33%) match design B, not this design; wire width 400 nm (SEM) vs 450 nm design'
    why: 'p.6-7 Sec. 4: the SEM-determined pitch 300 nm belongs to design B (final pitch 300 nm); design A has final pitch 400 nm (m4), so the core_material must not attribute a 300 nm SEM pitch to it'
  cmp_lit_wang2026_crossing_oband_lband:
    class: crossing.mmi
    why: 'p.2 Sec. II: the device is a taper-based transition plus a multimode interference region working by self-imaging (''analogous to that of a multimode interferometer''); p.4 ''gradually varying MMI structure''; geometry already entered with MMI roles (mmi_width_um, mmi_length_um, port_width_um); registry crossing.mmi = MMI-based'
  cmp_lit_wang2026_crossing_visible:
    class: crossing.mmi
    why: same design method and structure as the O-L band crossing (p.4-5 Sec. III, Table II)
  cmp_lit_elsaeed2024_straight_dc_50:
    notes: 'Fabricated on imec''s iSiPP300 platform (p.4). The cutback with six cascaded identical DCs (slope of linear regression, Fig. 3) is stated for the bent DCs only (p.4); the straight-DC coupling ratios are fitted against coupling length (Fig. 4(a)) and their measurement structure is not stated. Wavelength span 80 nm read as 1260-1340 nm from the Fig. 5 / Fig. 8 axes.'
    why: 'p.4 Sec. II: ''the cutback method was used for the bent DC measurements''; the component note claimed the cascade for the straight DC as well'
