# D169 gap-fill (subagent, 2026-10-22); replay order patch, sweep, gapfill, addendum, geometry, geoaudit, coord, sweep2
components:
  cmp_lit_nan2025_3d_crossing:
    notes: 'Test sample: 20 top Ta2O5 waveguides (127 um pitch), each with two interlayer couplers and crossing 300 bottom LN waveguides at 10 um spacing (p.5 Sec. 3). fab_org_ids borderline (D84a): the paper describes its own CMP-based fabrication method and points to the authors'' earlier work for the PLACE process details (p.4); all authors list East China Normal University. Interlayer-gap 1.5 um is SEM-measured (entered as gap_nm m7, D169 gap-fill). The interlayer coupler (LN-to-Ta2O5 transition) has only simulated values in Fig. 3 whose panel labels conflict with the caption and text; not entered as a row.'
    why: 'D169 gap-fill: gap_nm now allowed for crossing; rewrite the not-entered sentence only'
  cmp_lit_bock2010_swg_crossing_300:
    notes: 'No fab org: authors state they used e-beam lithography to fabricate the structures (p.6) but are split between NRC Canada and the University of Ottawa (not unambiguous, rule 12). Design B: pitch chirped 200 -> 300 nm, width 450 -> 300 nm, segment length 150 nm, 50 um SWG tapers with bridging segments, 350 um SWG section; crossings 0-80 on a 6.1 mm chip (p.6 Sec. 4). PDL < 0.02 dB and loss variation < 0.02 dB (TE) / 0.06 dB (TM) over 1520-1580 nm entered as pdl_db m13 and wdl_db m14 / m15 (D169 gap-fill).'
    why: 'D169 gap-fill: pdl_db and wdl_db now allowed for crossing; rewrite the not-entered sentence only'
  cmp_lit_bock2010_swg_crossing_400:
    notes: 'No fab org: authors state they used e-beam lithography to fabricate the structures (p.6) but are split between NRC Canada and the University of Ottawa (not unambiguous, rule 12). Design A: pitch chirped 200 -> 400 nm, width 450 -> 300 nm, segment length 150 -> 200 nm (p.6 Sec. 4). PDL < 0.005 dB entered as pdl_db m6 (D169 gap-fill).'
    why: 'D169 gap-fill: pdl_db now allowed for crossing; rewrite the not-entered sentence only'
  cmp_lit_elsaeed2024_bent_dc_50:
    notes: 'Fabricated on imec''s iSiPP300 platform (p.4). Coupling ratios from 6 cascaded identical DCs (slope of linear regression, p.4 Fig. 3). Wavelength span 80 nm read as 1260-1340 nm from the Fig. 5 / Fig. 8 axes. Coupling angle 8.5 deg entered as coupling_angle_deg m15 (D169 gap-fill); all bends are curvature-continuous low-loss bends (p.2 Fig. 1).'
    why: 'D169 gap-fill: coupling_angle_deg now exists for splitter; rewrite the no-parameter clause only'
  cmp_lit_elsaeed2024_bent_dc_40:
    notes: 'Fabricated on imec''s iSiPP300 platform (p.4). Coupling ratios from 6 cascaded identical DCs (slope of linear regression, p.4 Fig. 3). Wavelength span 80 nm read as 1260-1340 nm from the Fig. 5 / Fig. 8 axes. Coupling angle 12 deg entered as coupling_angle_deg m6 (D169 gap-fill); example of the arbitrary-ratio model (p.6-7 Fig. 12).'
    why: 'D169 gap-fill: coupling_angle_deg now exists for splitter; rewrite the no-parameter clause only'
  cmp_lit_elsaeed2024_bent_dc_60:
    notes: 'Fabricated on imec''s iSiPP300 platform (p.4). Coupling ratios from 6 cascaded identical DCs (slope of linear regression, p.4 Fig. 3). Wavelength span 80 nm read as 1260-1340 nm from the Fig. 5 / Fig. 8 axes. Coupling angle 6 deg entered as coupling_angle_deg m6 (D169 gap-fill); example of the arbitrary-ratio model (p.6-7 Fig. 12).'
    why: 'D169 gap-fill: coupling_angle_deg now exists for splitter; rewrite the no-parameter clause only'
  cmp_lit_elsaeed2024_bent_dc_70:
    notes: 'Fabricated on imec''s iSiPP300 platform (p.4). Coupling ratios from 6 cascaded identical DCs (slope of linear regression, p.4 Fig. 3). Wavelength span 80 nm read as 1260-1340 nm from the Fig. 5 / Fig. 8 axes. Coupling angle 4 deg entered as coupling_angle_deg m6 (D169 gap-fill); example of the arbitrary-ratio model (p.6-7 Fig. 12).'
    why: 'D169 gap-fill: coupling_angle_deg now exists for splitter; rewrite the no-parameter clause only'
  cmp_lit_huang2019a_mode_filter_lpg:
    notes: 'Fabricated with the authors'' in-house microfabrication facilities (p.2 Sec. III); three of four authors at City University of Hong Kong, one at UESTC (borderline fab_org_ids, D84b-like). Rejection ratios (18.4 dB vs E21, 16.9 dB vs E12 at 1550 nm), 10-dB rejection bandwidths (~190 nm, ~140 nm; author estimate assuming wavelength-flat higher-mode losses), RW2 -10 dB bandwidths (197 nm; 182 nm at 66 C) and grating period / count entered in the D169 gap-fill (m9-m16); RW2 -15 dB bandwidths (97 / 90 nm) not entered (no -15 dB width parameter).'
    why: 'D169 gap-fill: extinction_db, bw_10db_nm, period_nm, n_periods now allowed for mode_converter; rewrite the not-entered sentence only'
  cmp_lit_qi2025_fp_slr_cavity:
    notes: 'Authors state they fabricate the devices (p.3 Sec. III A); fabrication performed at SNSF and SNF (acknowledgments p.7). One co-author at Sandia; fab org Stanford. Values at a highly reflective operating point (120 mW heater power). Qe = 40e6 (p.5) entered as q_external m11 (D169 gap-fill); the 3% round-trip loss not entered (no round-trip-loss parameter).'
    why: 'D169 gap-fill: q_external now exists for resonator; rewrite the not-entered sentence only'
