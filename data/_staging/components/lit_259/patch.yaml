# Audit patch lit_259 (fresh-context audit 2026-11-23, DevLog/audits/2026-11-23-lit_259-audit.md).
# 118 metrics: 112 ok / 6 imprecise / 0 wrong; 20 components: 19 ok / 1 imprecise / 0 wrong. 2 misses added.
# Fixes: gupta2017 three figure reads re-read on the enlarged embedded rasters (Fig. 16(c) MZI cross-port dips, Fig. 17(c)
# ring notch depth floor and resonance spacing); gupta2017 WIDC lDC 8 um deep-access row platform soi_rib -> soi (same mixed
# rib + deep-etch stack as the 1x4 / MZI deep-access rows); abuelmaaty2018 3D TM converter values wavelength_inferred
# (Sec. 3.2.1 prints no wavelength).
# Misses: gupta2017 WIDC lDC 5 um split ratio (Fig. 13(b)); morino2014 curved DC temperature range (Fig. 7, simulated).
# Coordinator questions (audit Q1-Q12): distiller judgment calls kept (no op).
components:
  cmp_lit_gupta2017_widc_deep_access_l8:
    platform: soi
    why: 'p.4 Fig. 10, p.6 Sec. III: shallow-etched rib WIDC section with the slab tapered to deeply etched access waveguides (depth of the second etch not stated); the distiller gave the same mixed stack `soi` on ps1x4_deep_access and umzi_deep_access, `soi_rib` is kept for the all-shallow rows (rule 11)'
  cmp_lit_morino2014_curved_dc_r21:
    notes: 'Simulation-only design paper (2D FDTD; no fabrication). Platform left empty: the paper describes Si wire waveguides buried in SiO2 and never states SOI or a buried oxide (D422 / D423). The -3 +/- 0.1 dB bandwidth is entered as split_ratio_pct 48.98-51.29 % (10^(-0.31) and 10^(-0.29) of the input, D83f: arithmetic on simulated values stays simulated); a criterion-bandwidth parameter would hold it directly (registry gap). Temperature: cross-port coupling efficiency varies less than 1.0 % over 0-200 C at ~1.55 um (p.4 Sec. III-D, Fig. 7); entered as the Fig. 7 split_ratio_pct range (m8, simulated, D454); a temperature-coupling-variation parameter would hold the printed < 1.0 % directly (registry gap). Fig. 4 / Fig. 5 coupling-angle series (theta 18.5-21.0 deg, LC 6.78-7.70 um; slopes -11.0 %/um and -0.035 um/um) and Fig. 8 width / gap tolerance curves: no rows (figure-only siblings, no allowed parameter for the slopes). Fig. 6 bending-radius series: only R = 26 um is printed (own row).'
    why: 'component note updated for the added m8 (Fig. 7 curved-coupler range); previous text said the temperature value was not entered'
