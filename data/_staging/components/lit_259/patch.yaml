    why: 'p.7 Fig. 17(c): 22 notches (not 23) span about 92 nm, giving about 4.4 nm per spacing rather than 4.2 nm'
  cmp_lit_abuelmaaty2018_pp_3d_tm_w1p5um-m1:
    wavelength_inferred: 'true'
    notes: 'printed insertion loss -2.58 dB (sign quoted); Sec. 3.2.1 prints no wavelength with the TM values; 1550 nm = the operating wavelength of the TE results (Sec. 3.2, abstract), and the Fig. 7 trace reads about -2.5 dB at 1550 nm'
    why: 'p.3 Sec. 3.2.1: "Figure 7 shows ... an insertion loss of -2.58 dB" with no wavelength (rule 8)'
  cmp_lit_abuelmaaty2018_pp_3d_tm_w1p5um-m2:
    wavelength_inferred: 'true'
    notes: 'printed -10.68 dB (sign quoted); Sec. 3.2.1 prints no wavelength; the Fig. 7 TM2 trace reads about -10.5 dB at 1550 nm'
    why: 'p.3 Sec. 3.2.1: crosstalk values printed without a wavelength (rule 8)'
  cmp_lit_abuelmaaty2018_pp_3d_tm_w1p5um-m3:
    wavelength_inferred: 'true'
    notes: 'printed -13.2 dB (sign quoted); Sec. 3.2.1 prints no wavelength; the Fig. 7 TM0 trace reads about -13.3 dB at 1550 nm'
    why: 'p.3 Sec. 3.2.1: crosstalk values printed without a wavelength (rule 8)'
