    value: '14'
    notes: 'Fig. 17(c) reading (embedded raster enlarged, frame-calibrated): 22 notches between about 1529 and 1621 nm; shallowest about 14 dB (near 1545, 1589 and 1593 nm), most 17-22 dB, deepest about 33 dB near 1558 nm; uncertainty about +/-1.5 dB'
