  unit: dB
  wavelength_nm: '1500'
  wavelength_max_nm: '1640'
  wavelength_inferred: 'true'
  scope: per_coupler
  condition: two-GC test device (100 um waveguide, two 300 um tapers); cleaved SMF-28; peak of the moving-average trace; device close to the chip edge
  method: unspecified
  basis: measured
  locator: p.6 Sec. 3; p.6 Fig. 4(a)
  notes: "Printed '-7.1 +/- 0.77 dB from moving average process' (p.6); the +/- term is not defined (ripple of the raw trace about the moving average, Fig. 4(a)). Peak wavelength not printed; wavelength set to the measured sweep 1500-1640 nm (p.6, inferred); the Fig. 4(a) moving-average maximum lies about 1560-1575 nm. Extraction from the two-GC device not stated (p.6)."
  why: "miss: printed measured peak efficiency of the smoothed spectrum (p.6), as inverse_gc-m17"
