# --- xie2024a: moving-average peaks printed beside the raw peaks (p.6 / p.7)
- metric_id: cmp_lit_xie2024a_inverse_gc-m17
  component_id: cmp_lit_xie2024a_inverse_gc
  parameter: insertion_loss_db
  value: '4.5'
  unit: dB
  wavelength_nm: '1500'
  wavelength_max_nm: '1640'
  wavelength_inferred: 'true'
  scope: per_coupler
  condition: two-GC test device (100 um waveguide, two 300 um tapers); cleaved SMF-28; peak of the moving-average trace
  method: unspecified
  basis: measured
  locator: p.7 Sec. 3; p.6 Fig. 4(b)
  notes: "Printed '-4.5 +/- 0.7 dB from moving average process' (p.7); the +/- term is not defined (ripple of the raw trace about the moving average, Fig. 4(b)). Peak wavelength not printed; wavelength set to the measured sweep 1500-1640 nm (p.6, inferred); the Fig. 4(b) moving-average maximum lies about 1570-1590 nm. Extraction from the two-GC device not stated (p.6). The 1-dB / 3-dB boundaries in Fig. 4(b) (about -5.5 / -7.5 dB) are referenced to this level."
  why: "miss: printed measured peak efficiency of the smoothed spectrum (p.7), the level the paper's own 1-dB / 3-dB bandwidth lines refer to (p.6 Fig. 4(b) dashed / dotted lines)"
