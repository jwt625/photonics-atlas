# Audit patch lit_281 (fresh-context audit 2026-11-25, DevLog/audits/2026-11-25-lit_281-audit.md).
# 113 metrics: 101 ok / 11 imprecise / 1 wrong; 28 components: 18 ok / 10 imprecise (notes / fab). 12 misses added
# (wang2017a sidewall angle 50 deg on 10 rows, two Fig. 4 inset theory peaks). After the patch: 28 components, 124 metrics.
# Fixes: levy2011 batch-computed 0.101 %/W deleted (not printed, point-dependent), fab org_cornell_university (D84a);
# wang2017a six figure-legend widths measured -> design_target; yu2005 internal 23 %/W derived -> author_estimate
# (72 % SH out-coupling of unstated origin), Fig. 3(a) conflict notes, three inferred wavelengths;
# porcel2017 fab basis restated (named process + D448), values unchanged.
components:
  cmp_lit_levy2011_sin_ring_shg:
    fab_org_ids: org_cornell_university
    notes: 'Interface-induced (surface) chi(2) SHG with modal phase matching: fundamental quasi-TE pump to the 6th-order SH mode (FDM mode solver, p.3 Fig. 1(b)); ring radius 116 um and coupling gap 350 nm (p.3) are not entered (radius_um / gap_nm not allowed for frequency_converter, registry gap). Fab org_cornell_university (D84a): ''We design silicon nitride ring resonators ... with the same fabrication process previously described [5, 14]'' (p.3), refs. 5 and 14 being the authors'' own earlier papers (Levy, Gondarenko, Lipson et al.), i.e. the device was made with the authors'' own process; all authors at Cornell University (p.1); stricter reading (no first-person fabrication, D80b) would leave fab empty. Facility org_cornell_nanoscale_facility: ''This work was performed in part at the Cornell NanoScale Facility'' (p.7 Acknowledgements). Not entered (no registry parameter): effective chi(2) up to 4e-14 m/V, range 3e-15 to 4e-14 m/V (p.6; rests on the assumed SH cavity enhancement 1 <= C_sh <= C_p and assumed ideal phase matching); pump circulating-power factor C_p about 156 (p.6); SH-vs-dropped-pump slope 1.9745 +/- 0.0225 (p.6, Fig. 5 label 1.97 +/- 0.02); SH detected for pump powers as low as 3 mW (p.3); third-harmonic output ''on the order of picowatts'' at up to 120 mW dropped, pump near 1560 nm (p.5, p.7; no definite number, no THG row). Normalized efficiency not entered: the paper prints no %/W value; P_SH / P_pump^2 depends on the Fig. 5 point (about 0.10 %/W at the 100 uW / 315 mW top point, about 0.18 %/W at the lowest point near 5.5 dBm / -46.5 dBm, reading +/- 0.5 dB), so a single computed value is not a reported quantity.'
    why: 'p.3: the ring is made with ''the same fabrication process previously described [5, 14]'', the authors'' own earlier process papers (refs. 5, 14: Levy, Gondarenko, Lipson et al.): D84a (''following our previous process'' qualifies); facility CNF p.7 unchanged; note on the deleted computed %/W row'
  cmp_lit_porcel2017_sin_shg_w0p9_l36:
    notes: 'Best device: maximum SH output at L = 36 mm, 0.9 x 1 um2, horizontal pump (p.10). Not entered (no registry parameter): equivalent chi(2)_eq 3.7 +/- 0.2 pm/V (p.1, p.16 Fig. 10; assumes a pure E13 SH mode and ideal phase matching) and nonlinear coupling kappa (Fig. 10); SH output 53 uW (p.1, p.4). Dominant SH mode E13 is inferred from the far-field pattern of the 0.7 um waveguide (Fig. 6) and assumed for this waveguide in Eq. (9)-(10) (p.16). Fab org_lionix_international (not only staff thanks: the waveguides are ''based on the proprietary TripleX process from LioniX International'' (p.6), a named process with its org (Contract v7), and the acknowledgment names LioniX staff for the ''fabrication of the samples'', a stated place (D448)): the acknowledgment thanks two LioniX International staff for designing the lithography mask and ''for cleanroom processing and fabrication of the samples'' (p.17); manufacturing ''based on the proprietary TripleX process from LioniX International'' (p.6). Cladding: the paper describes the platform as Si3N4 ''embedded in a SiO2 cladding'' (p.4); the cladding of these samples is not restated. Photo-induced (coherent photogalvanic) chi(2) grating written by an optical initialization of minutes to hours (p.6-7); 1064 nm mode-locked Yb-fiber laser, 6.2 ps (abstract: 6 ps), 20 MHz; free-space aspheric-lens input (NA 0.68), microscope-objective output (NA 0.74). Waveguide-internal pump powers rest on the input-coupling estimate that assumes the cited 0.5 dB/cm propagation loss [13] (p.6).'
    why: 'fab basis restated: p.6 names the process with its org and p.17 credits LioniX with fabricating the samples (D448), so the fab is not a D84b borderline case; value unchanged'
