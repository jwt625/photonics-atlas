  cmp_lit_wang2017a_mpm_w630:
    notes: 'Best uniform device (p.10). SH generated in the 3rd-order TE mode (three-lobe output, Fig. 4(f)). Not entered: SH output 1.38 pW at 18.3 uW in-coupled pump (no output-power parameter); input-output slope 1.99 +/- 0.01 (Fig. 4(e)); a 3 mm total waveguide length incl. coupling and bending sections is stated for the loss-extraction waveguide (p.8), the SHG length used for normalization is 1 mm. Fab org_harvard_university and facility org_center_for_nanoscale_systems: ''Device fabrication was performed at the Center for Nanoscale Systems (CNS) at Harvard University'' (p.11 Acknowledgments; stated place, D448). Simulation geometry uses t = 400 nm and theta = 40 deg ''taken from actual device dimensions'' (p.3); Fig. 1(a) draws theta from the vertical (dashed vertical line at the sidewall; consistent with wt 600 / wb 1270 / t 400 nm, p.5), so theta = 40 deg is stored in the registry convention (angle to the film plane) as sidewall_angle_deg 50 (90 - 40, derived) on the waveguide and converter rows.'
    why: 'render p.4 Fig. 1(a): theta is drawn between the sidewall and a dashed vertical line; registry convention is the angle to the film plane, so the printed 40 deg converts to 50 deg (merged practice: soref1986, desiatov2019, pfeifle2014, 90 - printed angle, derived)'
