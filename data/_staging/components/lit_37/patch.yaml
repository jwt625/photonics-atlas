# Audit patch lit_37 (fresh-context audit 2026-10-29, DevLog/audits/2026-10-29-lit_37-audit.md).
# 154 metrics: 152 ok / 2 imprecise / 0 wrong; 29 components: 29 ok / 0 changed / 0 deleted; 13 misses added (layout geometry).
# Not covered here (coordinator decisions, see the audit file): li2026b endurance attribution (kept), registry orgs
# (MIT Materials Research Laboratory, HUST Advanced Micro-Nano Fabrication Center), registry gaps.
metrics:
  cmp_lit_li2026b_ltoi_ring-m1:
    basis: author_estimate
    wavelength_inferred: 'true'
    notes: 'per-resonance labels 7.24 / 7.72 / 6.50 / 7.16 / 7.52 x 10^6 (Fig. 1(g)); text: intrinsic Q above 7 x 10^6; Lorentzian fits, coupling regime not stated (D403); wavelength span from the Fig. 1(g) axis'
    why: 'D403: q_intrinsic from Lorentzian fits of a single-port spectrum rests on a coupling regime the paper does not state (p.5 Fig. 1(g) caption, p.6 Sec. 2.1); wavelength span read off the Fig. 1(g) axis like m2 (inferred there)'
  cmp_lit_singaravelu2019_two_tier_ssc_ox180-m3:
    condition: standard deviation of the per-wavelength loss-per-SSC values over 1520-1620 nm (spectral spread of one device set, not a spread over devices)
    why: 'p.4 Fig. 3(b): the annotated Std. Dev = 0.092 belongs to the loss-per-coupler spectrum (mean 0.298 dB over the 100 nm band); the row did not say what the std is taken over'
