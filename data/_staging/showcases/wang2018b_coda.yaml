# Spec patch (staging): coda chapters for the thin-film LN modulator story (Wang et al., Nature 2018), owner ruling 2026-11-11:
# the 2018 device stays as published (plain G-S-G, single drive); one or two closing chapters show what came next, labelled
# as later work. Research 2026-11-11. Merge into data/history/showcases/wang2018b.yaml by the builder (append parts,
# chapters, references, withheld; apply the p re-split; append coda_note to title_note). Bases as in the main spec:
# stated = paper text / caption; figure = arrangement read from a printed figure; derived = arithmetic on stated values;
# assumed = rendering value only. Sources and reasoning: wang2018b_coda.report.txt (same folder).
# Coordinates as in the main spec: cross-section in um, world x = crystal z (across the gaps), world y = film normal,
# world z = propagation; y = 0 at the bottom of the LN film.

coda_note: 'The last two chapters show later work by other groups, not the 2018 device: T-rail electrodes (Kharel et al.,
  Optica 2021) and a differential drive (Aimone et al., OFC 2026). Wang et al. 2018 used plain ground-signal-ground strips
  driven from one signal line.'

# ------------------------------------------------------------------------------------------------- p re-split (proposal)
# Option A (recommended): raise height 9 -> 10.8 and scale every existing chapter by 1/1.2, so each keeps its scroll length;
# the coda gets 0.083 each (about the length of the ridge or electrodes chapter).
# Option B: height unchanged; only the tail is re-split (fields to fom shortened by about 0.02 each).
resplit:
  option_a:
    height: 10.8
    p:
      intro: [0.0, 0.058]
      stack: [0.058, 0.142]
      ridge: [0.142, 0.225]
      electrodes: [0.225, 0.308]
      cladding: [0.308, 0.367]
      mzi: [0.367, 0.458]
      fields: [0.458, 0.575]
      vpi: [0.575, 0.658]
      bandwidth: [0.658, 0.742]
      fom: [0.742, 0.833]
      t_rail: [0.833, 0.917]
      differential: [0.917, 1.0]
  option_b:
    height: 9
    p:
      fields: [0.55, 0.65]
      vpi: [0.65, 0.73]
