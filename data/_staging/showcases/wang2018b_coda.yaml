# ------------------------------------------------------------------------------------------------------------- withheld
withheld:
- what: GSSG or G-S-G-S-G electrode drawn as the differential drive
  reason: 'Not drawn. A plain GSSG with one arm in each outer gap gives the same phase shift in both arms on x-cut LN (US
    12,619,109 B2, FIG. 1C), so push-pull is lost; Aimone et al. (p.1) state that GS̅GSG and GS̅SG "are not inherently
    compatible" with the three-conductor electrode. Thin-film LN papers that make a GSSG or split G-S-G-G-S-G layout work
    (Chen et al., Laser Photonics Rev. 2025, two-segment Mach-Zehnder; Zhou et al., OFC 2026, "GSSG differential electrode
    configuration") could not be read in full or print no layout, so their arm placement and crossings are unknown. The
    story shows the S̅ S S̅ scheme instead, the only differential layout on thin-film LN whose conductor roles are printed.'
- what: Segment dimensions of the differential-drive electrode
  reason: Aimone et al. state periodic capacitive loading but print no segment, gap or width values; the differential chapter
    carries over the Kharel et al. T-rail geometry, labelled as carried over.
- what: Cross-section of the differential-drive device
  reason: 'Aimone et al. give only "350 nm of Lithium Niobate on a Silicon substrate"; oxide, etch, ridge and metal are not
    printed. The differential chapter keeps the drawn cross-section of the T-rail chapter (Kharel et al., quartz), labelled.'
- what: Ridge width and sidewall of the T-rail device
  reason: Not stated by Kharel et al. (Fig. 1e is a schematic); the 2018 ridge shape is kept, labelled carried over.
- what: Number of segments along the 20 mm line
  reason: Not stated (whether segments run the full electrode length is not printed); the compressed plan draws an
    illustrative count.
- what: Field and current distribution around the T segments
  reason: Fig. 1(c, d) of Kharel et al. are artistic views; no simulated field map printed. Any current glow is illustrative.
- what: Plot for the coda
  reason: None added (the story already has 3 plot chapters; the coda results are single numbers in the side panel).
- what: First thin-film LN differential drive
  reason: 'Chen et al. (Laser Photonics Rev. 2025) claim the first differential-drive push-pull modulator on thin-film LN;
    Aimone et al. cite an earlier conference paper (N. Chen et al., OECC 2024) not found. No "first" is shown for the
    differential chapter.'
