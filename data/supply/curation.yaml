  - {paper: zhong2026, org: org_amf, category: B1, why: "AMF standard 220 nm SOI process"}

# wafer_supplier cells the generic parser cannot split or would misread (D57): explicit (printed name, qualifier)
# parts; qualifier = the stated fact only (goes to stated_spec); note = printed-form / locator remarks (goes to notes).
wafer_parts:
  cai2025:  # paper acknowledgements: LTOI wafers fabricated in NSIT and the SIMIT-CAS
    - {printed: "Shanghai Novel Si Integration Technology", qualifier: "LTOI wafers", note: "printed abbreviation NSIT; EO cell locator words: acknowledgements"}
    - {printed: "SIMIT-CAS", qualifier: "LTOI wafers", note: "EO cell locator words: acknowledgements"}
  wang2024b:
    - {printed: "Shanghai Novel Si Integration Technology", qualifier: "LTOI wafers", note: "printed abbreviation NSIT; EO cell locator words: acknowledgements"}
    - {printed: "Shanghai Institute of Microsystem and Information Technology", qualifier: "LTOI wafers", note: "EO cell locator words: acknowledgements"}
  # audit 2026-10-20 #35: parentheticals that are a legal name or a printed-form remark, not a stated spec
  chen2024:
    - {printed: "NanoLN", qualifier: "", note: "EO record: written NONOLN in the paper"}
  rahman2025:
    - {printed: "NanoLN", qualifier: "", note: "EO record adds the legal name Jinan Jingzheng Electronics Co., Ltd."}
  weigel2018:
    - {printed: "NanoLN", qualifier: "", note: "EO record adds the legal name Jinan Jingzheng Electronics Co. Ltd."}

# Printed names that are aliases of an existing registry org (not new orgs): staged as kind alias requests with
# alias_of_org_id; the coordinator applies registry changes (audit 2026-10-20 #34; applied in org curation round 2).
alias_requests:
  "SIMIT-CAS": {org: org_shanghai_institute_of_microsystem_and_information_technology, why: "alias of the registry SIMIT org (SIMIT + parent CAS suffix), printed in cai2025 acknowledgements; not a new org"}

# Notes for staged org requests (audit 2026-10-20 #33): the 22 new-org request rows are 18 distinct orgs (NanoLN
# printed 4 ways, Novel Si 2 ways); SIMIT-CAS is an alias request. Status resolved / open is set by the script from
# the registry matcher (org curation round 2, 2026-10-20, resolved all but Shin-Etsu).
request_notes:
  "NanoLN": "distinct org; printed variants: NanoLN, China / NanoLN, Jinan / NanoLN, Jinan Jingzheng Electronics Co., Ltd."
  "NanoLN, China": "printed variant of NanoLN (same org, not a separate org)"
  "NanoLN, Jinan": "printed variant of NanoLN (same org, not a separate org)"
  "NanoLN, Jinan Jingzheng Electronics Co., Ltd.": "printed variant of NanoLN (same org, not a separate org)"
  "Shanghai Novel Si Integration Technology": "distinct org; printed variant: Novel Si Integration Technology"
  "Novel Si Integration Technology": "printed variant of Shanghai Novel Si Integration Technology (same org, not a separate org)"
  "Shin-Etsu": "still open: not added in org curation round 2 (2026-10-20); witmer2020 usage row appends once it is a registry org"

# Category of an org's wafer_supplier rows when the cell's qualifier has no keyword (D57).
wafer_org_defaults:
  org_polaris_electro_optics: {category: A4, why: "EO process_name of taghavi2024 / taghavi2026: FN-LC PM-158 applied post-foundry"}
  org_nlm_photonics: {category: A4, why: "EO process_name of karakida2026: OEO JRD1 (NLM Photonics)"}
  org_soluxra: {category: A4, why: "witmer2020 EO process_name: SEO100C (Soluxra) spin-coated and poled; paper p.5 names SEO100C from Soluxra as the EO polymer (audit round 2 #2)"}

# Category of one (paper, org) wafer_supplier row, checked before the qualifier keywords (D57 per-(paper, org) override).
# basis goes to the row note; why stays here.
wafer_categories:
  - {paper: chen2024, org: org_jinan_jingzheng_electronics, category: A2.1, basis: "paper p.5 and EO process_name: x-cut TFLN wafer", why: "paper p.5: commercially available 4-inch x-cut TFLN wafer (NONOLN); no EO device rows (audit round 2 #5)"}

