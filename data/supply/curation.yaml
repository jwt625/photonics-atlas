# Hand decisions for scripts/build_supply_seed.py (DevLog-003 D56-D58). Every entry cites the EO atlas text it rests
# on (eo-modulator-atlas data/papers.csv columns foundry_or_fab, wafer_supplier, process_name). Nothing here comes
# from memory: when a paper's record states no platform, the category stays top-level and no process row is written.
version: 1

# Roles that hold for an org in every EO foundry_or_fab row (D56). Facility orgs (registry org_type facility) are
# facility_use / B7 without an entry.
fab_org_roles:
  org_cmc_microsystems: {role: mpw_access, category: B6, why: "geravand2025 process_name: multi-project wafer service of CMC Microsystems"}

# B subcategory per (paper, org) for fabrication / post_processing rows (D56). Not listed -> category B + note.
# Optional `note` is appended to the row's notes (e.g. why a row stays top-level B).
fab_categories:
  - {paper: chaudhury2024, org: org_applied_nanotools, category: B1, why: "220 nm SOI SiPh process"}
  - {paper: geravand2025, org: org_amf, category: B1, why: "AMF standard process on 220 nm SOI"}
  - {paper: gupta2023, org: org_fraunhofer_heinrich_hertz_institute, category: B4, why: "HHI generic InP foundry process"}
  - {paper: han2023, org: org_compoundtek, category: B1, why: "standard 90 nm lithography SOI process"}
  - {paper: hess2026, org: org_polariton, category: B5, why: "plasmonic PIC platform (silicon photonics with plasmonic-organic slot)"}
  - {paper: horst2025, org: org_polariton, category: B5, why: "plasmonic PIC platform (silicon photonics with plasmonic-organic slot)"}
  - {paper: hillier2025, org: org_smart_photonics, category: B4, why: "JePPIX generic InP platform"}
  - {paper: hsu2024, org: org_intel, category: B1, why: "Intel 300 mm SOI silicon photonics process"}
  - {paper: johnson2025, org: org_amf, category: B1, why: "AMF O-band GP v4.5 platform, 200 mm wafer run"}
  - {paper: johnson2025, org: org_nlm_photonics, role: post_processing, category: B5, why: "SOH post-processing at die level by NLM Photonics"}
  - {paper: kari2025, org: org_luxtelligence, category: B3, why: "Luxtelligence lnoi400 PDK (TFLN)"}
  - {paper: kawahara2025, org: org_national_institute_of_advanced_industrial_science_and_technology, category: B1, why: "AIST 300 mm silicon-on-insulator process"}
