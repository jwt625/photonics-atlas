# Schema for the shared registry (data/registry/*.csv) and generated crosswalks (data/crosswalk/*.csv).
# Single source of truth for scripts/validate_db.py. v1 2026-10-20 (DevLog-001, decisions D13-D29).
#
# Rules (binding)
#   (a) Empty cell = not stated by any source. Never fill from memory; country, dates, types and names need a record
#       that states them (EO/PK/LIN atlas row, ROR record, cited source).
#   (b) Ids are immutable once written: org_<slug>, event_<slug>, <corpus>:<native id> for sources. LIN ids are reused.
#   (c) Dates: ISO partial strings YYYY, YYYY-MM or YYYY-MM-DD (type pdate); precision = string length.
#   (d) Lists are ';'-separated.
#   (e) Renames, spin-offs, acquisitions and mergers are org_events between separate org ids, never aliases (D19, D20).
#   (f) Crosswalk files are generated by scripts/build_org_crosswalk.py; do not edit them by hand.
#   (h) Tables marked `built: true` must exist (validator error when missing).
#   (g) Evidence: an event needs grade, status, basis, source_ids and a locator; grade/status compatibility per D22.
version: 1

patterns:
  org_id: "^org_[a-z0-9]+(_[a-z0-9]+)*$"
  event_id: "^event_[a-z0-9]+(_[a-z0-9]+)*$"
  source_id: "^(eo|pk|ofc2026|blog|ds|lin|web|lit):[^\\s;]+$"
  country: "^[A-Z]{2}$"
  ror_id: "^https://ror\\.org/0[a-z0-9]{8}$"
  wikidata_qid: "^Q[0-9]+$"
  url: "^https?://\\S+$"
  nonneg_int: "^[0-9]+$"

enums:
  org_type: [university, academic_lab, company, startup, business_unit, industrial_lab, research_institute, national_lab, government_lab, foundry, facility, consortium, standards_body, venture_fund, other, unknown]
  supply_role: [wafer_supplier, materials_supplier, equipment_vendor, instrument_vendor, component_vendor, software_vendor, foundry_service, osat]
  org_status: [active, acquired, merged, renamed, defunct, historical, unknown]
  name_basis: [eo_atlas, lineage, pk_atlas, ror, website, cited_source, printed]
  origin: [eo, pk, lin, ofc2026, ror, web, lit, manual]
  alias_type: [printed_variant, legal_name, native_name, abbreviation, short_name, brand, subsidiary_printed, unit_printed, joint_printed]
  alias_basis: [eo_name, pk_name, pk_alias_map, lineage_alias, lineage_name, ror_record, curated]
  event_type: [acquisition, merger, spin_off, rename, dissolution, team_formation, unit_reorg]
  participant_role: [target, acquirer, predecessor, successor, parent, spun_off, merging, resulting]
  grade: [A, B, C, D, X]
  claim_status: [validated, asserted, inferred, disputed]
  event_basis: [stated_in_source, imported_lineage]
  corpus: [eo, pk, ofc2026, blog, ds, lin, web, lit]
  source_type: [journal, conference, arxiv_preprint, thesis, review, datasheet, standard, slides, regulatory_filing, acquisition_filing, official_press_release, official_company_page, official_company_bio, university_bio, conference_bio, cv, paper, patent, archived_webpage, standards_body, professional_society, reputable_technical_media, authoritative_interview, linkedin, crunchbase, company_directory, startup_database, promotional_pr, news_media, repost, other]
  access: [open_access, arxiv, paywalled, paywalled_conference, public_web, login_required, unknown]
  redistribution: [open_license_ok, restricted_local_only, unknown]
  match_basis: [name, alias, ror, unmapped]

tables:
  organizations:
    path: data/registry/organizations.csv
    built: true
    key: [org_id]
    columns:
      - {name: org_id, type: str, pattern: org_id, required: true}
      - {name: name, type: str, required: true, desc: "own preferred English name (D16)"}
      - {name: name_basis, type: enum, enum: name_basis, required: true}
      - {name: name_source, type: str, required: false, desc: "URL, ROR id or atlas reference the name was taken from"}
      - {name: org_type, type: enum, enum: org_type, required: true, desc: "institutional kind (D15); unknown when no record states it (D17)"}
      - {name: supply_roles, type: list, enum: supply_role, required: false, desc: "P2; each role needs evidence"}
      - {name: country, type: str, pattern: country, required: false, desc: "ISO 3166-1 alpha-2 from a record that states it"}
      - {name: parent_org_id, type: fk, ref: organizations.org_id, required: false}
      - {name: status, type: enum, enum: org_status, required: true}
      - {name: founded_on, type: pdate, required: false}
      - {name: dissolved_on, type: pdate, required: false}
      - {name: ror_id, type: str, pattern: ror_id, required: false}
      - {name: wikidata_qid, type: str, pattern: wikidata_qid, required: false}
      - {name: website, type: str, pattern: url, required: false}
      - {name: origin, type: list, enum: origin, required: true, desc: "which inputs contributed the row"}
      - {name: no_name_match, type: bool, required: false, desc: "true = name not used for crosswalk matching: a historical org whose normalized name equals a current org's (e.g. Coherent, Inc. vs Coherent Corp.); match it through scoped aliases only"}
      - {name: notes, type: str, required: false}

  org_aliases:
    path: data/registry/org_aliases.csv
    built: true
    key: [org_id, alias]
    columns:
      - {name: org_id, type: fk, ref: organizations.org_id, required: true}
      - {name: alias, type: str, required: true, desc: "exact printed or official variant"}
      - {name: alias_type, type: enum, enum: alias_type, required: true}
      - {name: lang, type: str, required: false, desc: "BCP 47 tag when not English"}
      - {name: valid_from, type: pdate, required: false}
      - {name: valid_to, type: pdate, required: false}
      - {name: origin, type: enum, enum: origin, required: true, desc: "input where the variant was seen"}
      - {name: scope, type: list, enum: corpus, required: false, desc: "corpora where the alias applies (empty = all); for strings that are unambiguous only in one input"}
      - {name: basis, type: enum, enum: alias_basis, required: true}
      - {name: notes, type: str, required: false}

  org_events:
    path: data/registry/org_events.csv
    built: true
    key: [event_id]
    columns:
      - {name: event_id, type: str, pattern: event_id, required: true}
      - {name: event_type, type: enum, enum: event_type, required: true}
      - {name: name, type: str, required: true}
      - {name: announced_on, type: pdate, required: false}
      - {name: effective_on, type: pdate, required: false}
      - {name: grade, type: enum, enum: grade, required: true}
      - {name: status, type: enum, enum: claim_status, required: true}
      - {name: basis, type: enum, enum: event_basis, required: true}
      - {name: source_ids, type: list, fk: sources.source_id, required: false, desc: "required unless grade X"}
      - {name: locator, type: str, required: false, desc: "quote <= 200 chars + position, or lin:canonical/events.yaml#<id> for imported rows; required unless grade X"}
      - {name: notes, type: str, required: false, desc: "grade X needs the rationale here"}

  org_event_participants:
    path: data/registry/org_event_participants.csv
    built: true
    key: [event_id, org_id, role]
    columns:
      - {name: event_id, type: fk, ref: org_events.event_id, required: true}
      - {name: org_id, type: fk, ref: organizations.org_id, required: true}
      - {name: role, type: enum, enum: participant_role, required: true}
      - {name: printed_name, type: str, required: false, desc: "name the source uses for this participant"}

  sources:
    path: data/registry/sources.csv
    built: true
    key: [source_id]
    columns:
      - {name: source_id, type: str, pattern: source_id, required: true}
      - {name: corpus, type: enum, enum: corpus, required: true}
      - {name: native_id, type: str, required: true, desc: "id inside its corpus (paper_id, presentation code, LIN src id, file stem)"}
      - {name: title, type: str, required: true}
      - {name: year, type: int, required: false}
      - {name: published_on, type: pdate, required: false}
      - {name: venue, type: str, required: false, desc: "journal/conference or publisher"}
      - {name: doi, type: str, required: false}
      - {name: arxiv_id, type: str, required: false}
      - {name: url, type: str, pattern: url, required: false}
      - {name: source_type, type: enum, enum: source_type, required: true}
      - {name: access, type: enum, enum: access, required: true}
      - {name: license, type: str, required: false}
      - {name: redistribution, type: enum, enum: redistribution, required: true}
      - {name: evidence_grade, type: enum, enum: grade, required: false, desc: "source-class grade for web/LIN documents (D9)"}
      - {name: text_cached, type: bool, required: false, desc: "full text exists in the input corpus (local-only for non-OA)"}
      - {name: same_as, type: fk, ref: sources.source_id, required: false, desc: "canonical row of a duplicate (D23)"}
      - {name: accessed_on, type: pdate, required: false}
      - {name: notes, type: str, required: false}

  org_crosswalk:
    path: data/crosswalk/org_crosswalk.csv
    built: true
    generated: true
    key: [corpus, printed]
    columns:
      - {name: corpus, type: enum, enum: corpus, required: true}
      - {name: printed, type: str, required: true, desc: "exact string or id in the input (EO/PK org_name, LIN org id, OFC affiliation)"}
      - {name: org_ids, type: list, fk: organizations.org_id, required: false}
      - {name: match_basis, type: enum, enum: match_basis, required: true}
      - {name: n_rows, type: int, pattern: nonneg_int, required: true, desc: "input rows carrying this string (OFC: authors_json rows; EO/PK: author_affiliations rows; LIN: 1 per org record)"}
